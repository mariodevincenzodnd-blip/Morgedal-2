// Salva il token in sessionStorage così che, navigando dalla Home a una scheda
// (o da una scheda all'altra) nella stessa scheda del browser, l'accesso a Google
// resti attivo senza doverlo rifare ogni volta.
function saveGoogleTokenToSession(token, expiresInSeconds){
  try{
    sessionStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY, JSON.stringify({
      token: token,
      expiresAt: Date.now() + (Number(expiresInSeconds || 0) * 1000)
    }));
  }catch(e){}
}

function loadGoogleTokenFromSession(){
  try{
    const raw = sessionStorage.getItem(GOOGLE_TOKEN_STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.token || !data.expiresAt) return null;
    if (Date.now() > data.expiresAt - 60000) return null; // margine di sicurezza di 60s
    return data.token;
  }catch(e){ return null; }
}

let googleTokenClient = null;
let googleAccessToken = null;
let googleUserEmail = "";
let driveFileId = null;
let driveFileIdKey = null;

function googleConfigured(){ return !!GOOGLE_CLIENT_ID; }

function driveStorageKey(){
  const safe = (STATE && STATE.nome ? STATE.nome : "personaggio").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "personaggio";
  return "drive-file-id::" + safe;
}

function initGoogleAuth(){
  if (!googleConfigured()) return;
  const tryInit = ()=>{
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2){
      setTimeout(tryInit, 300);
      return;
    }
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (resp)=>{
        if (resp && resp.access_token){
          googleAccessToken = resp.access_token;
          saveGoogleTokenToSession(resp.access_token, resp.expires_in);
          try{ localStorage.setItem(GOOGLE_EVER_CONNECTED_KEY, "1"); }catch(e){}
          await onGoogleSignedIn();
        }
      },
      error_callback: ()=>{
        // Il tentativo di accesso automatico e silenzioso (senza popup) non è
        // riuscito: nessuna sessione Google attiva nel browser, o consenso non
        // ancora dato. Non facciamo nulla: resta il pulsante "Accedi con Google".
      }
    });
  };
  tryInit();
}

function tryGoogleSilentReauth(){
  // Prova a ottenere un token senza mostrare popup, sfruttando una sessione
  // Google già attiva nel browser e un consenso già dato in precedenza
  // (questo browser ha già usato Google Drive per questo personaggio almeno
  // una volta). Se fallisce non succede nulla di visibile: resta il pulsante
  // manuale "Accedi con Google".
  if (!googleTokenClient || googleAccessToken) return;
  try{ googleTokenClient.requestAccessToken({ prompt: "" }); }catch(e){}
}

function signInGoogle(prompt){
  if (!googleConfigured()){
    window.alert("Il collegamento a Google Drive non \u00e8 ancora configurato su questa pagina.");
    return;
  }
  if (!googleTokenClient){ window.alert("Google non \u00e8 ancora pronto, riprova tra un istante."); return; }
  googleTokenClient.requestAccessToken({ prompt: prompt || "consent" });
}

async function onGoogleSignedIn(){
  try{
    const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
      headers: { Authorization: "Bearer " + googleAccessToken }
    });
    const info = res.ok ? await res.json() : null;
    googleUserEmail = (info && info.email) || "";
  }catch(e){ googleUserEmail = ""; }

  driveFileIdKey = driveStorageKey();
  let legacyFileId = null;
  try{ legacyFileId = localStorage.getItem(driveFileIdKey) || null; }catch(e){}
  const isPlayer = isAuthorizedPlayerEmail(googleUserEmail);

  if (isPlayer && legacyFileId && legacyFileId !== DEFAULT_DRIVE_FILE_ID){
    driveFileId = legacyFileId;
    const loadedLegacy = await driveLoad();
    if (loadedLegacy){
      try{
        driveFileId = DEFAULT_DRIVE_FILE_ID;
        await driveUpdate(DEFAULT_DRIVE_FILE_ID);
        try{ localStorage.setItem(driveFileIdKey, DEFAULT_DRIVE_FILE_ID); }catch(e){}
        updateGoogleStatus();
        setStatus("Modifiche precedenti migrate nel file condiviso ✓");
        return;
      }catch(e){
        console.error("Migrazione verso il file condiviso non riuscita:", e);
      }
    }
  }

  driveFileId = DEFAULT_DRIVE_FILE_ID;
  try{ localStorage.setItem(driveFileIdKey, driveFileId); }catch(e){}
  updateGoogleStatus();

  const ok = await driveLoad();
  if (!ok){
    setStatus("Errore collegamento file condiviso Drive");
    return;
  }
}
async function driveFind(){
  const name = suggestedFileName();
  const q = encodeURIComponent(`name='${name}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: "Bearer " + googleAccessToken }
  });
  if (!res.ok){
    const body = await res.text().catch(()=> "");
    console.error("Drive (find) errore " + res.status + ": " + body);
    throw new Error("drive find failed: " + res.status);
  }
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function driveCreate(){
  const name = suggestedFileName();
  const boundary = "-------scheda" + Date.now();
  const metadata = { name, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(STATE)}\r\n` +
    `--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": `multipart/related; boundary=${boundary}` },
    body
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (create) errore " + res.status + ": " + errBody);
    throw new Error("drive create failed: " + res.status);
  }
  const data = await res.json();
  return data.id;
}

async function driveUpdate(fileId){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": "application/json" },
    body: JSON.stringify(STATE)
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (update) errore " + res.status + ": " + errBody);
    const err = new Error("drive update failed: " + res.status);
    err.status = res.status;
    throw err;
  }
}

async function driveSave(){
  if (!googleAccessToken) return false;
  try{
    driveFileId = DEFAULT_DRIVE_FILE_ID;
    await driveUpdate(driveFileId);
    try{ localStorage.setItem(driveFileIdKey || driveStorageKey(), driveFileId); }catch(e){}
    updateGoogleStatus();
    return true;
  }catch(e){
    console.error("Salvataggio sul file condiviso Drive non riuscito:", e);
    window.alert("Non riesco a salvare sul file condiviso ufficiale di questo personaggio. Non è stata creata alcuna copia personale. Riprova l'accesso Google oppure segnala l'errore al Master.");
    return false;
  }
}
let driveLastLoadStatus = null;

async function driveLoad(){
  driveLastLoadStatus = null;
  if (!googleAccessToken || !driveFileId) return false;
  try{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
      headers: { Authorization: "Bearer " + googleAccessToken }
    });

      driveLastLoadStatus = res.status;

      console.error("Drive (load) errore " + res.status + ": " + errBody);

  }catch(e){

function updateGoogleStatus(){
  const el = document.getElementById("google-status");
  if (!el) return;
  el.textContent = googleAccessToken ? ("\ud83d\udfe2 " + (googleUserEmail || "collegato a Drive")) : "";
}

function deepMerge(base, override){
  if (Array.isArray(base)) return (override && Array.isArray(override)) ? override : base;
  if (typeof base === "object" && base !== null){
    const out = {...base};
    if (override && typeof override === "object"){
      for (const k in override){ out[k] = deepMerge(base[k], override[k]); }
    }
    if (override && override.sheetId && override.travellerLayoutVersion === undefined) out.travellerLayoutVersion = 0;
    return out;
  }
  return (override !== undefined) ? override : base;
}

async function loadState(){
  if (!window.storage || typeof window.storage.get !== "function"){
    STORAGE_AVAILABLE = false;
    STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
    setStorageWarning();
    return;
  }
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if (res && res.value){
      const saved = JSON.parse(res.value);
      STATE = deepMerge(DEFAULT_STATE, saved);
      setStatus("Dati caricati \u2713");
      return;
    }
  }catch(e){ /* nessun dato salvato ancora, va bene cos\u00ec */ }
  STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
  setStatus("Scheda pronta");
}

function queueSave(){
  setStatus("Salvataggio\u2026");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(performSave, 500);
}

function flushSave(){
  clearTimeout(saveTimer);
  performSave();
}

async function performSave(){
  let wroteSomething = false;
  let cloudFailed = false;

  if (STORAGE_AVAILABLE){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
      wroteSomething = true;
    }catch(e){ cloudFailed = true; }
  }

  if (localFileHandle){
    const ok = await writeLocalFile();
    if (ok) wroteSomething = true;
  }

  let driveOk = false;
  let driveAttempted = false;
  if (googleAccessToken){
    driveAttempted = true;
    driveOk = await driveSave();
    if (driveOk) wroteSomething = true;
  }

  const t = new Date();
  const stamp = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  if (wroteSomething){
    lastSaveOk = true;
    clearStorageWarning();
    const extras = [localFileHandle ? "file locale" : null, driveOk ? "Drive" : null].filter(Boolean).join(" + ");
    setStatus("Salvato \u2713 " + stamp + (extras ? " (" + extras + ")" : ""));
  } else if (cloudFailed){
    lastSaveOk = false;
    setStatus("Errore di salvataggio \u2014 usa \u2018Esporta backup\u2019");
  } else if (driveAttempted && !driveOk){
    lastSaveOk = false;
    setStatus("Errore di salvataggio su Drive \u2014 controlla la console (F12) o usa \u2018Esporta backup\u2019");
  } else {
    setStatus("Non salvato automaticamente \u2014 collega un file locale, Google Drive, o esporta il backup");
  }
}

function setStorageWarning(){
  const bar = document.getElementById("savebar");
  const status = document.getElementById("savebar-status");
  if (bar) bar.classList.add("warn");
  if (status){
    status.textContent = "Salvataggio automatico non disponibile qui \u2014 collega un file locale o usa \u2018Esporta backup\u2019";
    status.classList.add("warn-text");
  }
}

function clearStorageWarning(){
  const bar = document.getElementById("savebar");
  const status = document.getElementById("savebar-status");
  if (bar) bar.classList.remove("warn");
  if (status) status.classList.remove("warn-text");
}

/* ============================================================
   FILE LOCALE (es. dentro una cartella sincronizzata con Google Drive)
   Usa la File System Access API del browser (Chrome / Edge):
   una volta collegato un file, ogni salvataggio automatico lo
   sovrascrive direttamente — se quel file vive in una cartella
   sincronizzata da Google Drive Desktop, finisce su Drive da solo,
   senza bisogno di scaricare backup manualmente ogni volta.
   ============================================================ */
function localFSSupported(){
  return typeof window.showSaveFilePicker === "function" && typeof window.showOpenFilePicker === "function";
}

function suggestedFileName(){
  const safe = (STATE.nome || "personaggio").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "personaggio";
  return "scheda-" + safe + ".json";
}

async function connectNewLocalFile(){
  if (!localFSSupported()){
    window.alert("Questa funzione richiede Chrome o Edge (su computer). Puoi comunque usare \u2018Esporta backup\u2019 e salvare tu il file dentro la cartella di Google Drive.");
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: suggestedFileName(),
      types: [{ description: "Backup scheda (JSON)", accept: {"application/json": [".json"]} }]
    });
    localFileHandle = handle;
    await writeLocalFile();
    updateLocalFileStatus();
    clearStorageWarning();
    setStatus("File locale collegato \u2713");
  }catch(e){
    if (!e || e.name !== "AbortError") window.alert("Non sono riuscito a collegare il file.");
  }
}

async function openExistingLocalFile(){
  if (!localFSSupported()){
    window.alert("Questa funzione richiede Chrome o Edge (su computer). Puoi comunque usare \u2018Importa scheda\u2019 per caricare un backup.");
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "Backup scheda (JSON)", accept: {"application/json": [".json"]} }],
      multiple: false
    });
    const file = await handle.getFile();
    const text = await file.text();
    let parsed;
    try{ parsed = JSON.parse(text); }
    catch(err){ window.alert("Il file scelto non \u00e8 un backup valido."); return; }
    const ok = window.confirm("Caricare questa scheda e collegarla per il salvataggio automatico?\nLa scheda attuale verr\u00e0 sostituita.");
    if (!ok) return;
    STATE = deepMerge(BLANK_STATE, parsed);
    localFileHandle = handle;
    renderAll();
    updateLocalFileStatus();
    queueSave();
  }catch(e){
    if (!e || e.name !== "AbortError") window.alert("Non sono riuscito ad aprire il file scelto.");
  }
}

async function writeLocalFile(){
  if (!localFileHandle) return false;
  try{
    const perm = await localFileHandle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted") return false;
    const writable = await localFileHandle.createWritable();
    await writable.write(JSON.stringify(STATE, null, 2));
    await writable.close();
    return true;
  }catch(e){ return false; }
}

function updateLocalFileStatus(){
  const el = document.getElementById("local-file-status");
  if (!el) return;
  el.textContent = localFileHandle ? ("\ud83d\udd17 " + (localFileHandle.name || "file locale")) : "";
}

function setStatus(msg){
  const el = document.getElementById("savebar-status");

}

function mod(score){ return Math.floor((score-10)/2); }
function fmtMod(m){ return (m>=0 ? "+" : "") + m; }
/* Modificatore effettivo: usa il valore inserito manualmente (override) se presente,
   altrimenti il calcolo automatico dal punteggio. Permette all'utente di sostituire
   un valore calcolato senza che il ricalcolo automatico lo sovrascriva. */
function effMod(k){
  const ov = STATE.modOverride ? STATE.modOverride[k] : undefined;
  return (typeof ov === "number" && !isNaN(ov)) ? ov : mod(STATE.scores[k]);
}
function hasOverride(k){
  return !!(STATE.modOverride && typeof STATE.modOverride[k] === "number");
}

/* ============================================================
   IMMAGINI OGGETTI (compresse in dataURL, salvate nello stato)
   ============================================================ */
function fileToCompressedDataURL(file, maxDim, quality, cb){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim / Math.max(w,h));
      w = Math.max(1, Math.round(w*scale));
      h = Math.max(1, Math.round(h*scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = ()=>{ setStatus("Immagine non valida"); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function openImageLightbox(src, label){
  const lb = document.getElementById("img-lightbox");
  const img = document.getElementById("img-lightbox-img");
  const cap = document.getElementById("img-lightbox-caption");
  if (!lb || !img || !src) return;
  img.src = src;
  if (cap){
    if (label){ cap.textContent = label; cap.hidden = false; }
    else { cap.textContent = ""; cap.hidden = true; }
  }
  lb.hidden = false;
  requestAnimationFrame(()=> lb.classList.add("show"));
}
function closeImageLightbox(){
  const lb = document.getElementById("img-lightbox");
  const img = document.getElementById("img-lightbox-img");
  if (!lb) return;
  lb.classList.remove("show");
  lb.hidden = true;
  if (img) img.src = "";
}
function initImageLightbox(){
  const lb = document.getElementById("img-lightbox");
  if (!lb) return;
  const backdrop = document.getElementById("img-lightbox-backdrop");
  const closeBtn = document.getElementById("img-lightbox-close");
  if (backdrop) backdrop.addEventListener("click", closeImageLightbox);
  if (closeBtn) closeBtn.addEventListener("click", closeImageLightbox);
  document.addEventListener("keydown", (e)=>{ if (e.key === "Escape" && !lb.hidden) closeImageLightbox(); });
}

/* allowZoom: aggiunge un pulsante di ingrandimento (modal) accanto alla miniatura.
   Usato solo per le immagini dell'Equipaggiamento, non per l'Inventario. */
function makeImagePicker(currentSrc, onPick, onRemove, allowZoom, zoomLabel, readOnly){
  const wrap = document.createElement("div");
  wrap.className = "img-row";

  const thumb = document.createElement(currentSrc ? "img" : "div");
  if (currentSrc){ thumb.src = currentSrc; thumb.className = "thumb"; }
  else { thumb.className = "thumb-placeholder"; }

  if (readOnly){
    /* Player read-only (equip/inventario): solo visualizzazione. Nessun
       modo di aggiungere, cambiare o rimuovere l'immagine. Se c'è
       un'immagine, il clic sulla miniatura apre il lightbox; altrimenti
       un placeholder neutro senza alcuna interattività. */
    if (currentSrc){
      thumb.title = "Clic per ingrandire";
      thumb.addEventListener("click", ()=> openImageLightbox(currentSrc, zoomLabel));
    } else {
      thumb.title = "Nessuna immagine";
    }
    wrap.appendChild(thumb);
    return wrap;
  }

  if (currentSrc){ thumb.title = "Clic per cambiare immagine"; }
  else { thumb.textContent = "+"; thumb.title = "Aggiungi immagine"; }

  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.className = "file-input-hidden";
  input.addEventListener("change", ()=>{
    const f = input.files && input.files[0];
    if (f) fileToCompressedDataURL(f, 320, 0.72, (dataUrl)=>{ onPick(dataUrl); });
  });

  thumb.addEventListener("click", ()=> input.click());

  wrap.appendChild(thumb);
  wrap.appendChild(input);

  const label = document.createElement("span");
  label.className = "file-btn";
  label.textContent = currentSrc ? "Cambia immagine" : "Aggiungi immagine";
  label.addEventListener("click", ()=> input.click());
  wrap.appendChild(label);

  if (currentSrc && allowZoom){
    const zoom = document.createElement("button");
    zoom.className = "img-zoom"; zoom.type="button"; zoom.textContent = "\u26f6"; zoom.title="Ingrandisci immagine";
    zoom.addEventListener("click", (ev)=>{ ev.stopPropagation(); openImageLightbox(currentSrc, zoomLabel); });
    wrap.appendChild(zoom);
  }

  if (currentSrc){
    const rm = document.createElement("button");
    rm.className = "img-remove"; rm.type="button"; rm.textContent = "\u2715"; rm.title="Rimuovi immagine";
    rm.addEventListener("click", (ev)=>{ ev.stopPropagation(); onRemove(); });
    wrap.appendChild(rm);
  }
  return wrap;
}

    pips.push(`<button class="caos-pip ${i<=STATE.livelloCaos?'on':''}" data-caos-pip="${i}" title="Livello ${i}"></button>`);

  const letterEls = letters.map((l,i)=>`<span class="caos-letter ${STATE.livelloCaos>i?'lit':''}">${l}</span>`).join("");

      <div class="card">
        <h2>Abilit\u00e0</h2>
        ${skillRows}
      </div>
    </div>

    <div class="card">
      <h2>Attacchi & Incantesimi di Prima Utilit\u00e0</h2>
      ${renderAttacchiNav()}
      <div class="rich" contenteditable="true" data-rich="attacchi">${STATE.attacchi}</div>
    </div>
  `;

  // score inputs
  document.querySelectorAll('[data-score]').forEach(inp=>{
    inp.readOnly = false;
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.score;
      STATE.scores[k] = parseInt(inp.value || "0", 10);
      const modInp = document.getElementById("mod-"+k);
      if (modInp){ modInp.value = fmtMod(effMod(k)); modInp.classList.toggle("is-override", hasOverride(k)); }
      const sm = document.getElementById("savemod-"+k);
      if (sm) sm.textContent = fmtMod(effMod(k));
      STATE.skills.forEach((s,i)=>{
        if (s[1]===k){ const el=document.getElementById("skillmod-"+i); if(el) el.textContent = k+" "+fmtMod(effMod(k)); }
      });
      queueSave();
    });
  });

  // override manuale del modificatore (Caratteristiche editabili):
  // il calcolo automatico resta attivo, ma un valore inserito qui manualmente
  // sostituisce quello calcolato e non viene più sovrascritto dal ricalcolo.
  document.querySelectorAll('[data-modover]').forEach(inp=>{
    inp.readOnly = false;
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.modover;
      const raw = inp.value.trim();
      if (!STATE.modOverride) STATE.modOverride = {};
      if (raw === ""){
        delete STATE.modOverride[k];
      } else {
        const parsed = parseInt(raw.replace(/^\+/, ""), 10);
        if (!isNaN(parsed)) STATE.modOverride[k] = parsed;
      }
      inp.classList.toggle("is-override", hasOverride(k));
      const sm = document.getElementById("savemod-"+k);
      if (sm) sm.textContent = fmtMod(effMod(k));
      STATE.skills.forEach((s,i)=>{
        if (s[1]===k){ const el=document.getElementById("skillmod-"+i); if(el) el.textContent = k+" "+fmtMod(effMod(k)); }
      });
      queueSave();
    });
    inp.addEventListener("blur", ()=>{
      const k = inp.dataset.modover;
      inp.value = fmtMod(effMod(k));
    });
  });
  document.querySelectorAll('[data-save]').forEach(inp=>{
    inp.disabled = false;
    inp.addEventListener("change", ()=>{ STATE.saves[inp.dataset.save] = inp.checked; queueSave(); });
  });
  document.querySelectorAll('[data-skill]').forEach(inp=>{
    inp.readOnly = false;
    inp.addEventListener("input", ()=>{ STATE.skills[inp.dataset.skill][2] = parseInt(inp.value||"0",10); queueSave(); });
  });
  document.querySelectorAll('[data-death]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cls,idx] = btn.dataset.death.split("-");
      const arr = cls==="s" ? STATE.deathSuccess : STATE.deathFail;
      arr[idx] = !arr[idx];
      btn.classList.toggle("used", arr[idx]);
      queueSave();
    });
  });

  bindSimpleInputs();
  bindRich();

  const hpCur = document.getElementById("hp-cur"), hpMax = document.getElementById("hp-max"), hpTemp = document.getElementById("hp-temp");
  hpMax.readOnly = !isMasterEditorOn();
  function refreshHp(){
    let cur = parseInt(hpCur.value||"0",10), max = parseInt(hpMax.value||"0",10);
    if (cur > max) cur = max;
    if (cur < 0) cur = 0;
    hpCur.value = cur;
    let temp = parseInt(hpTemp.value||"0",10);
    if (temp < 0) temp = 0;
    STATE.hpCur = cur; STATE.hpMax = max; STATE.hpTemp = temp;
    const pct = max>0 ? Math.max(0,Math.min(100, cur/max*100)) : 0;
    document.getElementById("hp-fill").style.width = pct+"%";
    document.getElementById("hp-fill").style.background = pct<25 ? "linear-gradient(90deg,#7a2a24,var(--bad))" : (pct<60 ? "linear-gradient(90deg,#8a6a24,#c9a34e)" : "linear-gradient(90deg,#3f6a3a,var(--good))");
    const tempPct = max>0 ? Math.max(0,Math.min(100, temp/max*100)) : (temp>0 ? 100 : 0);
    document.getElementById("hp-fill-temp").style.width = tempPct+"%";
  }
  hpCur.addEventListener("input", ()=>{refreshHp(); queueSave();});
  hpMax.addEventListener("input", ()=>{refreshHp(); queueSave();});
  hpTemp.addEventListener("input", ()=>{refreshHp(); queueSave();});
  document.getElementById("hp-minus").addEventListener("click", ()=>{hpCur.value = (parseInt(hpCur.value||"0",10)-1); refreshHp(); queueSave();});
  document.getElementById("hp-plus").addEventListener("click", ()=>{hpCur.value = (parseInt(hpCur.value||"0",10)+1); refreshHp(); queueSave();});
  refreshHp();
  bindCaosTracker();
}

/* ============================================================
   MASTER EDITOR
   Modalità di modifica strutturale riservata al Master: categoria,
   titolo/etichetta, testo, larghezza e ordine dei riquadri di
   Passive/Truccetti/Risorse/Ambiti/Campi. Nessuna auto-correzione:
   il testo inserito viene salvato esattamente com'è scritto.
   Attivabile SOLO da chi ha già sbloccato la modalità Master
   (password Master), ed è completamente invisibile/inattiva in
   modalità giocatore.
   ============================================================ */
const MASTER_EDITOR_KEY = "morgedal-master-editor";
const MASTER_CATS = [
  { key:"passive", label:"Passiva" },
  { key:"truccetti", label:"Truccetto" },
  { key:"incantesimo", label:"Incantesimo" },
  { key:"abilita", label:"Abilità" },
  { key:"risorse", label:"Risorsa" },
  { key:"ambiti", label:"Ambito" },
  { key:"campiAttiva", label:"Campo" }
];
const MASTER_ARR_SHAPE_CATS = new Set(["ambiti","campiAttiva"]);

function isMasterEditorOn(){
  if (!isMasterUnlocked()) return false;
  try{ return sessionStorage.getItem(MASTER_EDITOR_KEY) === "1"; }catch(e){ return false; }
}
function setMasterEditorOn(on){  try{ if (on) sessionStorage.setItem(MASTER_EDITOR_KEY, "1"); else sessionStorage.removeItem(MASTER_EDITOR_KEY); }catch(e){}
}

function masterToCanonical(cat, item){
  if (cat === "sourceSections") return {...item};
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    return { nome:item[0]||"", desc:item[1]||"", group:item[2]||"", width:item[3]||1 };
  }
  if (cat === "passive") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Passiva", width:item.width||1, hidden:!!item.hidden };
  if (cat === "truccetti") return { nome:item.nome||"", desc:item.desc||"", uso:item.uso||"?", width:item.width||1, hidden:!!item.hidden };
  if (cat === "abilita") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Abilità", width:item.width||1, hidden:!!item.hidden };
  if (cat === "risorse") return { nome:item.nome||"", desc:item.desc||"", max:item.max||1, width:item.width||1, hidden:!!item.hidden };
  if (cat === "incantesimo") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Incantesimo", width:item.width||1, hidden:!!item.hidden };
  return { nome:"", desc:"", width:1 };
}
function masterFromCanonical(cat, c){
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    return [c.nome||"Nuovo elemento", c.desc||"", "", c.width||1];
  }
  if (cat === "passive") return { nome:c.nome||"Nuova Passiva", tag:c.tag||"Passiva", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "truccetti") return { nome:c.nome||"Nuovo Truccetto", uso:c.uso||"?", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "abilita") return { nome:c.nome||"Nuova Abilità", tag:c.tag||"Abilità", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "risorse") return { nome:c.nome||"Nuova Risorsa", desc:c.desc||"", max:c.max||1, used:0, width:c.width||1, hidden:!!c.hidden };
  if (cat === "incantesimo") return { nome:c.nome||"Nuovo Incantesimo", tag:c.tag||"Incantesimo", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  return { nome:c.nome||"", desc:c.desc||"" };
}

function masterRerender(cat){
  if (cat === "sourceSections") renderAll(); else renderPoteri();
}
function masterMoveCategory(cat, idx, newCat){
  if (newCat === cat) return;
  const item = STATE[cat][idx];
  const canon = masterToCanonical(cat, item);
  STATE[cat].splice(idx,1);
  if (!STATE[newCat]) STATE[newCat] = [];
  STATE[newCat].push(masterFromCanonical(newCat, canon));
  renderAll();
  queueSave();
}
function masterReorder(cat, idx, dir){
  const arr = STATE[cat];
  const j = idx + dir;
  if (j < 0 || j >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
  masterRerender(cat);
  queueSave();
}
function masterDelete(cat, idx){
  STATE[cat].splice(idx,1);
  masterRerender(cat);
  queueSave();
}
function masterCreate(cat){
  STATE[cat].push(masterFromCanonical(cat, {nome:"Nuovo elemento", desc:""}));
  masterRerender(cat);
  queueSave();
}
function masterBoxWidth(cat, idx){
  const item = STATE[cat][idx];
  return (MASTER_ARR_SHAPE_CATS.has(cat) ? item[3] : item.width) || 1;
}
function setMasterBoxWidth(cat, idx, w){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)) item[3] = w; else item.width = w;
  masterRerender(cat);
  queueSave();
}
function masterSetField(cat, idx, field, val){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    if (field === "nome") item[0] = val;
    else if (field === "desc") item[1] = val;
    else if (field === "group") item[2] = val;
  } else {
    item[field] = val;
  }
}
function masterBoxHeight(cat, idx){
  const item = STATE[cat][idx];
  return (MASTER_ARR_SHAPE_CATS.has(cat) ? item[4] : item.h) || null;
}
function setMasterBoxHeight(cat, idx, h){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)) item[4] = h; else item.h = h;
  queueSave();
}
/* Al rilascio di un resize verticale del Master, se l'altezza scelta
   manualmente è inferiore al minimo necessario a mostrare tutto il
   contenuto (produrrebbe uno scroll interno), il box viene espanso
   automaticamente al minimo richiesto: nessuna scrollbar interna, nessun
   testo tagliato. Restituisce l'altezza EFFETTIVA (px, intera) da salvare
   nello STATE, che quindi non è mai inferiore a quella richiesta dal
   contenuto. Se l'altezza scelta è già sufficiente resta invariata. */
function growBoxToFitContent(el){
  let h = Math.round(el.getBoundingClientRect().height);
  if (el.scrollHeight > el.clientHeight){
    h = Math.round(h + (el.scrollHeight - el.clientHeight));
    el.style.height = h + "px";
  }
  return h;
}
function masterBoxStyle(cat, idx){
  const w = masterBoxWidth(cat, idx);
  const h = masterBoxHeight(cat, idx);
  let style = "";
  if (w && w > 1) style += `grid-column:span ${w};`;
  if (h) style += `height:${h}px;`;
  return ` data-master-box="${cat}-${idx}"${style ? ` style="${style}"` : ""}`;
}
function masterToolbarHtml(cat, idx, opts){
  opts = opts || {};
  const options = (cat === "sourceSections" ? '<option value="sourceSections" selected>Sezione originale</option>' : "") + MASTER_CATS.map(c => `<option value="${c.key}"${c.key===cat?" selected":""}>${c.label}</option>`).join("");
  const w = masterBoxWidth(cat, idx);
  const widthCtl = opts.noWidth ? "" : `<select class="master-box-width" data-master-width="${cat}-${idx}" title="Larghezza del riquadro">
      <option value="1"${w===1?" selected":""}>1/3</option>
      <option value="2"${w===2?" selected":""}>2/3</option>
      <option value="3"${w===3?" selected":""}>3/3</option>
    </select>`;
  const canHide = !MASTER_ARR_SHAPE_CATS.has(cat);
  const isHidden = canHide && !!(STATE[cat][idx] && STATE[cat][idx].hidden);
  const eyeCtl = canHide
    ? `<button type="button" class="master-mini-btn master-eye-btn${isHidden?' is-hidden':''}" data-master-eye="${cat}-${idx}" title="${isHidden?'Nascosto al giocatore — clic per mostrare':'Visibile al giocatore — clic per nascondere'}">${isHidden?'🙈':'👁️'}</button>`
    : "";
  return `<div class="master-toolbar">
    <select class="master-cat-select" data-master-move="${cat}-${idx}" title="Sposta in un'altra categoria">${options}</select>
    <button type="button" class="master-mini-btn" data-master-up="${cat}-${idx}" title="Sposta su">↑</button>
    <button type="button" class="master-mini-btn" data-master-down="${cat}-${idx}" title="Sposta giù">↓</button>
    ${widthCtl}
    ${cat === "risorse" ? `<label>max <input type="number" min="0" max="100" data-resource-max="${idx}" value="${STATE[cat][idx].max}" style="width:64px"></label>` : ""}
    ${eyeCtl}
    <button type="button" class="master-mini-del" data-master-del="${cat}-${idx}" title="Elimina questo elemento">✕</button>
  </div>`;
}
function masterNewBoxBtn(cat, label){
  return `<button type="button" class="btn master-add-btn" data-master-create="${cat}">+ Nuovo box — ${label}</button>`;
}
function masterToggleHidden(cat, idx){
  const item = STATE[cat][idx];
  if (!item) return;
  item.hidden = !item.hidden;
  masterRerender(cat);
  queueSave();
}
function bindMasterControls(root){
  root = root || document;
  root.querySelectorAll("[data-resource-max]").forEach(el=>el.addEventListener("change",()=>{if(!isMasterEditorOn())return; const r=STATE.risorse[+el.dataset.resourceMax]; r.max=Math.max(0,Math.min(100,parseInt(el.value)||0));r.used=Math.min(r.used,r.max);renderPoteri();queueSave();}));
  root = root || document;
  if (!isMasterEditorOn()) return;
  root.querySelectorAll('[data-master-move]').forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const [cat, idx] = sel.dataset.masterMove.split("-");
      masterMoveCategory(cat, Number(idx), sel.value);
    });
  });
  root.querySelectorAll('[data-master-up]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterUp.split("-");
      masterReorder(cat, Number(idx), -1);
    });
  });
  root.querySelectorAll('[data-master-down]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterDown.split("-");
      masterReorder(cat, Number(idx), 1);
    });
  });
  root.querySelectorAll('[data-master-del]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterDel.split("-");
      masterDelete(cat, Number(idx));
    });
  });
  root.querySelectorAll('[data-master-eye]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterEye.split("-");
      masterToggleHidden(cat, Number(idx));
    });
  });
  root.querySelectorAll('[data-master-width]').forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const [cat, idx] = sel.dataset.masterWidth.split("-");
      setMasterBoxWidth(cat, Number(idx), Number(sel.value));
    });
  });
  root.querySelectorAll('[data-master-box]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const [cat, idx] = el.dataset.masterBox.split("-");
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = growBoxToFitContent(el);
        if (h && h !== masterBoxHeight(cat, Number(idx))){
          setMasterBoxHeight(cat, Number(idx), h);
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
  root.querySelectorAll('[data-master-create]').forEach(btn=>{
    btn.addEventListener("click", ()=>{ masterCreate(btn.dataset.masterCreate); });
  });
  root.querySelectorAll('[data-master-field]').forEach(el=>{
    const evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, ()=>{
      const [cat, idx, field] = el.dataset.masterField.split("|");
      const val = el.matches("[contenteditable]") ? el.innerHTML : el.value;
      masterSetField(cat, Number(idx), field, val);
      queueSave();
    });
  });
}
function initMasterEditorToggle(){
  const btn = document.getElementById("master-editor-toggle");
  if (!btn) return;
  if (!isMasterUnlocked()){
    btn.classList.remove("show");
    return;
  }
  btn.classList.add("show");
  const refresh = ()=>{
    const on = isMasterEditorOn();
    btn.classList.toggle("on", on);
    btn.textContent = on ? "🛠️ Editor Master: ON" : "🛠️ Editor Master";
    document.body.classList.toggle("master-editor-on", on);
  };
  refresh();
  btn.addEventListener("click", ()=>{
    setMasterEditorOn(!isMasterEditorOn());
    refresh();
    renderAll();
  });
}

function migrateTravellerState(){
  if (!STATE || STATE.sheetId !== DEFAULT_STATE.sheetId) return;

  if ((STATE.travellerLayoutVersion || 0) < 1){
    for (const key of ['passive','truccetti','abilita','incantesimo','sourceSections']){
      if (!STATE[key] || STATE[key].length === 0) STATE[key] = JSON.parse(JSON.stringify(DEFAULT_STATE[key] || []));
    }
    STATE.risorse = STATE.risorse || [];
    for (const resource of DEFAULT_STATE.risorse || []){
      if (resource.sourceId && !STATE.risorse.some(r=>r.sourceId === resource.sourceId || (r.nome === resource.nome && !r.sourceId))){
        STATE.risorse.push(JSON.parse(JSON.stringify(resource)));
      }
    }
    if (TRAVELLER_MAGE && STATE.slots.length === 1 && STATE.slots[0].lvl === 1 && STATE.slots[0].max === 6){
      STATE.slots = JSON.parse(JSON.stringify(DEFAULT_STATE.slots)).map((s,i)=>({...s,used:i===0?STATE.slots[0].used:0}));
    }
    if (!STATE.portraits) STATE.portraits = JSON.parse(JSON.stringify(DEFAULT_STATE.portraits));
    STATE.portraits.forEach((p,i)=>{if (!p.img) p.img=DEFAULT_STATE.portraits[i]?.img||''; if (/^Ritratto [12]$/.test(p.cap||'')) p.cap=DEFAULT_STATE.portraits[i]?.cap||p.cap;});
    STATE.travellerLayoutVersion = 1;
  }

  if ((STATE.travellerLayoutVersion || 0) < 2){
    const sections = STATE.sourceSections || [];
    const tomoIndex = sections.findIndex(s=>s && s.nome === "TOMO MULTIELEMENTALE");
    if (tomoIndex >= 0 && sections[tomoIndex].desc === JHAGGORK_TOMO_V1_DESC){
      const previous = sections[tomoIndex];
      const elementSections = (DEFAULT_STATE.sourceSections || [])
        .filter(s=>s.group === "TOMO MULTIELEMENTALE")
        .map(s=>({
          ...JSON.parse(JSON.stringify(s)),
          hidden: previous.hidden ?? s.hidden,
          location: previous.location || s.location
        }));
      sections.splice(tomoIndex, 1, ...elementSections);
    }
    STATE.travellerLayoutVersion = 2;
  }
}

function sourceSectionsHtml(location){
  const masterOn=isMasterEditorOn(); let lastGroup='';
  return (STATE.sourceSections||[]).map((s,i)=>{
    if ((s.location||'poteri')!==location || (!masterOn && s.hidden)) return '';
    const group=s.group && s.group!==lastGroup ? `<h2 class="source-group-title">${esc(s.group)}</h2>`:'';lastGroup=s.group||'';
    return `${group}<div class="subcard source-block${s.hidden?' master-hidden-item':''}" id="source-${i}"${masterBoxStyle('sourceSections',i)}>
      ${masterOn?masterToolbarHtml('sourceSections',i,{noWidth:true}):''}
      ${masterOn?`<input class="master-name-input" data-master-field="sourceSections|${i}|nome" value="${esc(s.nome)}">`:`<h3>${esc(s.nome)}</h3>`}
      <div class="rich" ${masterOn?'contenteditable="true"':''} data-master-field="sourceSections|${i}|desc">${s.desc}</div>
    </div>`;
  }).join('');
}
function mountSourceSections(location){
  const panel=document.getElementById('panel-'+location);if(!panel)return;
  panel.querySelectorAll('.source-sections').forEach(el=>el.remove());
  const markup=sourceSectionsHtml(location);
  if(markup){const wrap=document.createElement('div');wrap.className='card source-sections';wrap.innerHTML=markup;panel.append(wrap);bindMasterControls(wrap);}
}

function renderPoteri(){
  const masterOn=isMasterEditorOn(), panel=document.getElementById('panel-poteri');
  const categories=[['truccetti','Trucchetti','tag-truccetto'],['abilita','Abilità','tag-abilita'],['incantesimo','Incantesimi','tag-incantesimo'],['passive','Passive','tag-passiva'],['ambiti','Ambiti','tag-ambito'],['campiAttiva','Campi','tag-campo']];
  const visible=cat=>(STATE[cat]||[]).some(x=>!x.hidden);
  const resourceIndexFor=(cat,item)=>{
    const key=String(item.nome||'').split('\n')[0].toLocaleLowerCase();
    return (STATE.risorse||[]).findIndex(r=>r.nome.toLocaleLowerCase()===key || (TRAVELLER_RESOURCE_ALIASES[key]&&r.nome===TRAVELLER_RESOURCE_ALIASES[key]));
  };
  const linked=new Set();
  const cards=categories.map(([cat,label,cls])=>{
    if (!masterOn&&!visible(cat))return '';
    const body=(STATE[cat]||[]).map((raw,i)=>{
      const item=Array.isArray(raw)?{nome:raw[0],desc:raw[1],width:raw[3]||3}:raw;
      if(!masterOn&&item.hidden)return '';
      const ri=resourceIndexFor(cat,item);let uses='';
      if(ri>=0){linked.add(ri);const r=STATE.risorse[ri];
        if(masterOn||!r.hidden)uses=`<div class="power-uses"><span class="field-label">${esc(r.nome)} · utilizzi</span><div class="pips">${Array.from({length:r.max},(_,p)=>`<button type="button" class="pip ${p<r.used?'used':''}" data-respip="${ri}-${p}" aria-label="${esc(r.nome)}: utilizzo ${p+1}" aria-pressed="${p<r.used}"></button>`).join('')}</div></div>`;
      }
      return `<div class="subcard${item.hidden?' master-hidden-item':''}" data-width="${item.width||3}" id="anchor-${slugify(item.nome)}"${masterBoxStyle(cat,i)}>
        ${masterOn?masterToolbarHtml(cat,i):''}<span class="tag ${cls}">${esc(MASTER_CATS.find(c=>c.key===cat)?.label||label)}</span>
        ${masterOn?`<input class="master-name-input" data-master-field="${cat}|${i}|nome" value="${esc(item.nome)}">`:`<h3>${esc(item.nome)}</h3>`}
        <div class="rich" ${masterOn?'contenteditable="true"':''} data-master-field="${cat}|${i}|desc">${item.desc||''}</div>${uses}
      </div>`;
    }).join('');
    return `<section class="card" id="powers-${cat}"><h2>${label}</h2><div class="power-grid">${body}</div>${masterOn?masterNewBoxBtn(cat,MASTER_CATS.find(c=>c.key===cat)?.label||label):''}</section>`;
  }).join('');
  const resources=(STATE.risorse||[]).map((r,i)=>{
    if(!masterOn&&(r.hidden||linked.has(i)))return '';
    return `<div class="tracker${r.hidden?' master-hidden-item':''}">${masterOn?masterToolbarHtml('risorse',i,{noWidth:true}):''}
      ${masterOn?`<input class="master-name-input" data-master-field="risorse|${i}|nome" value="${esc(r.nome)}">`:`<div class="t-name">${esc(r.nome)}</div>`}
      <div class="rich" ${masterOn?'contenteditable="true"':''} data-master-field="risorse|${i}|desc">${r.desc||''}</div>
      <div class="pips">${Array.from({length:r.max},(_,p)=>`<button type="button" class="pip ${p<r.used?'used':''}" data-respip="${i}-${p}" aria-label="${esc(r.nome)}: utilizzo ${p+1}" aria-pressed="${p<r.used}"></button>`).join('')}</div></div>`;
  }).join('');
  panel.innerHTML=`<nav class="power-index" aria-label="Sezioni poteri"><a href="#powers-slots">${TRAVELLER_MAGE?'Slot Incantesimo':'Slot'}</a>${categories.filter(([c])=>masterOn||visible(c)).map(([c,l])=>`<a href="#powers-${c}">${l}</a>`).join('')}${(STATE.sourceSections||[]).some(s=>(s.location||'poteri')==='poteri'&&(masterOn||!s.hidden))?'<a href="#powers-extra">Regole e capacità</a>':''}</nav>
    <section class="card" id="powers-slots"><h2>${TRAVELLER_MAGE?'Slot Incantesimo':'Slot'}</h2>
    ${(STATE.slots||[]).map((s,i)=>`<div class="slot-lvl"><div class="lvl-badge">${TRAVELLER_MAGE?'Livello '+s.lvl:'Slot'}</div><div class="pips">${Array.from({length:s.max},(_,p)=>`<button type="button" class="pip ${p<s.used?'used':''} ${s.colorClass||''}" data-slotpip="${i}-${p}" aria-label="Slot ${s.lvl}, ${p+1}" aria-pressed="${p<s.used}"></button>`).join('')}</div><label>max <input class="maxslot" type="number" min="0" data-slotmax="${i}" value="${s.max}" ${masterOn?'':'readonly'}></label></div>`).join('')}
    <button class="btn primary" id="reset-slots">Riposo Lungo — recupera tutti gli slot</button></section>
    ${(resources||masterOn)?`<section class="card"><h2>Risorse</h2>${resources}${masterOn?masterNewBoxBtn('risorse','Risorsa'):''}</section>`:''}
    <div style="margin-bottom:20px"><button class="btn" id="reset-risorse">Riposo Lungo — recupera le risorse</button></div>
    ${cards}${sourceSectionsHtml('poteri')?`<section class="card" id="powers-extra">${sourceSectionsHtml('poteri')}</section>`:''}`;
  panel.querySelectorAll('[data-slotpip]').forEach(el=>el.addEventListener('click',()=>{const[i,p]=el.dataset.slotpip.split('-').map(Number),s=STATE.slots[i];s.used=p<s.used?p:p+1;renderPoteri();queueSave();}));
  panel.querySelectorAll('[data-respip]').forEach(el=>el.addEventListener('click',()=>{const[i,p]=el.dataset.respip.split('-').map(Number),r=STATE.risorse[i];r.used=p<r.used?p:p+1;renderPoteri();queueSave();}));
  panel.querySelectorAll('[data-slotmax]').forEach(el=>el.addEventListener('change',()=>{if(!isMasterEditorOn())return;const s=STATE.slots[+el.dataset.slotmax];s.max=Math.max(0,Math.min(100,parseInt(el.value)||0));s.used=Math.min(s.used,s.max);renderPoteri();queueSave();}));
  panel.querySelector('#reset-slots').addEventListener('click',()=>{STATE.slots.forEach(s=>s.used=0);renderPoteri();queueSave();});
  panel.querySelector('#reset-risorse').addEventListener('click',()=>{STATE.risorse.forEach(r=>r.used=0);renderPoteri();queueSave();});
  bindMasterControls(panel);
}

function autoGrowTextarea(el){
  if (!el) return;
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

/* Ordine: Nome -> Descrizione -> Peso. La descrizione si espande in verticale
   con il contenuto (nessuno scroll interno, nessun testo troncato). */
function renderInvTable(){
  const masterOn = isMasterEditorOn();
  const tbody = document.getElementById("inv-tbody");
  tbody.innerHTML = STATE.inventario.map((it,i)=>`
    <div class="inv-item">
      <div class="inv-item-top">
        <input type="checkbox" data-inv-check="${i}" ${it[0]==="\u2713"?"checked":""} title="Portato/equipaggiato">
        <div class="imgcell" id="inv-img-${i}"></div>
        <input type="text" class="inv-item-name" data-inv-name="${i}" value="${esc(it[1])}" placeholder="Nome oggetto">
        ${masterOn ? `<button class="inv-remove" data-inv-del="${i}" title="Rimuovi oggetto">\u2715</button>` : ''}
      </div>
      <textarea class="inv-item-desc" data-inv-desc="${i}" placeholder="Descrizione" rows="1">${esc(it[3])}</textarea>
      <div class="inv-item-peso">
        <label>Peso</label>
        <input type="number" data-inv-peso="${i}" value="${it[2]}">
      </div>
    </div>`).join("");

  STATE.inventario.forEach((it,i)=>{
    const cell = document.getElementById("inv-img-"+i);
    if (!cell) return;
    const picker = makeImagePicker(
      it[4] || "",
      (dataUrl)=>{ STATE.inventario[i][4] = dataUrl; renderInvTable(); queueSave(); },
      ()=>{ STATE.inventario[i][4] = ""; renderInvTable(); queueSave(); },
      true,
      it[1] || "Oggetto",
      false
    );
    // nell'elenco mostriamo solo la miniatura, senza le etichette testuali
    const lbl = picker.querySelector(".file-btn");
    if (lbl) lbl.remove();
    cell.appendChild(picker);
  });

  tbody.querySelectorAll('[data-inv-check]').forEach(c=>c.addEventListener("change",()=>{
    STATE.inventario[c.dataset.invCheck][0] = c.checked?"\u2713":"";
    refreshInvTotal(); queueSave();
  }));
  tbody.querySelectorAll('[data-inv-name]').forEach(c=>c.addEventListener("input",()=>{
    STATE.inventario[c.dataset.invName][1] = c.value; queueSave();
  }));
  tbody.querySelectorAll('[data-inv-peso]').forEach(c=>c.addEventListener("input",()=>{
    STATE.inventario[c.dataset.invPeso][2] = c.value; refreshInvTotal(); queueSave();
  }));
  tbody.querySelectorAll('[data-inv-desc]').forEach(c=>{
    autoGrowTextarea(c);
    c.addEventListener("input",()=>{
      STATE.inventario[c.dataset.invDesc][3] = c.value;
      autoGrowTextarea(c);
      queueSave();
    });
  });
  // Editor Master: se il Master ridimensiona manualmente una descrizione
  // sotto l'altezza necessaria a mostrare il testo per intero, la
  // riporta automaticamente almeno all'altezza del contenuto (niente
  // testo tagliato, niente scroll interno).
  if (window.ResizeObserver && !tbody.__invDescRO){
    tbody.__invDescRO = new ResizeObserver(entries=>{
      for (const entry of entries){
        const el = entry.target;
        if (el.scrollHeight > el.clientHeight + 1) autoGrowTextarea(el);
      }
    });
  }
  if (tbody.__invDescRO){
    tbody.querySelectorAll('[data-inv-desc]').forEach(c=> tbody.__invDescRO.observe(c));
  }
  tbody.querySelectorAll('[data-inv-del]').forEach(c=>c.addEventListener("click",()=>{
    STATE.inventario.splice(parseInt(c.dataset.invDel,10),1);
    renderInvTable(); refreshInvTotal(); queueSave();
  }));
  refreshInvTotal();
}

function refreshInvTotal(){
  const total = STATE.inventario.reduce((sum,it)=> sum + (it[0]==="\u2713" ? (parseFloat(it[2])||0) : 0), 0);
  const cap = STATE.capacitaMax || 1;
  const pct = Math.max(0, Math.min(100, total/cap*100));
  const fill = document.getElementById("inv-bar-fill");
  if (fill){
    fill.style.width = pct+"%";
    fill.style.background = pct<70 ? "var(--good)" : (pct<100 ? "var(--gold)" : "var(--bad)");
  }
  const totalEl = document.getElementById("inv-total");
  if (totalEl) totalEl.textContent = total + " / " + cap + " P";
}

/* Raggruppa voci di ambiti/campiAttiva che condividono un terzo elemento (chiave di gruppo)
   in un unico box "subcard", cos\u00ec da non frammentare blocchi concettuali unici della fonte
   originale (es. "Super Abilit\u00e0" di Katan, "Emocrachia"/"Purgatorio di Rasta" di Ervork).
   Le voci senza chiave di gruppo (2 elementi: [nome, descrizione]) si comportano come prima,
   una subcard indipendente ciascuna. Pensata per essere manipolabile dal futuro Master Editor:
   ogni sotto-voce mantiene il proprio id ancora (anchor-slug) per i link di navigazione rapida. */
function renderGroupedSubcards(arr, tagLabel, tagClass, fieldName){
  const masterOn = isMasterEditorOn();
  const groups = [];
  const byKey = {};
  (arr||[]).forEach((entry,idx)=>{
    const n = entry[0], d = entry[1], g = entry[2];
    if (g){
      if (!byKey[g]){ byKey[g] = { key:g, items:[] }; groups.push(byKey[g]); }
      byKey[g].items.push([n,d,idx]);
    } else {
      groups.push({ key:null, items:[[n,d,idx]] });
    }
  });
  const itemFields = (n,d,idx,headingTag)=>{
    if (!masterOn){
      return `<${headingTag}>${n}</${headingTag}><div style="color:var(--text-dim);font-size:13.5px;">${d}</div>`;
    }
    const nameField = `<input type="text" class="master-name-input" data-master-field="${fieldName}|${idx}|nome" value="${esc(n)}">`;
    const descField = `<div class="rich" contenteditable="true" style="color:var(--text-dim);font-size:13.5px;" data-master-field="${fieldName}|${idx}|desc">${d}</div>`;
    return nameField + descField;
  };
  return groups.map(grp=>{
    if (!grp.key){
      const [n,d,idx] = grp.items[0];
      const toolbar = masterOn ? masterToolbarHtml(fieldName, idx) : "";
      return `<div class="subcard" id="anchor-${slugify(n)}"${masterOn?masterBoxStyle(fieldName, idx):""}>
        ${toolbar}
        <span class="tag ${tagClass}">${tagLabel}</span>
        ${itemFields(n,d,idx,"h3")}
      </div>`;
    }
    const body = grp.items.map(([n,d,idx])=>{
      const toolbar = masterOn ? masterToolbarHtml(fieldName, idx, {noWidth:true}) : "";
      return `<div class="subcard-subsection" id="anchor-${slugify(n)}">
        ${toolbar}
        ${itemFields(n,d,idx,"h4")}
      </div>`;
    }).join("");
    return `<div class="subcard subcard-grouped"><span class="tag ${tagClass}">${tagLabel}</span><h3>${grp.key}</h3>${body}</div>`;
  }).join("");
}

/* Editor Master: ridimensionamento verticale persistente dei riquadri di
   Info & Carattere (STATE.lore[i].h), sullo stesso principio gi\u00e0 usato
   per i Ritratti: il resize nativo CSS (angolo in basso a destra) resta
   disponibile solo in modalit\u00e0 Master; al rilascio del trascinamento
   l'altezza raggiunta viene salvata in STATE.lore[i].h e resta quindi
   persistente tra render/reload/export/import (non un semplice resize CSS
   volatile). Se h \u00e8 assente il riquadro mantiene l'aspetto originale.
   Il giocatore non vede mai la maniglia di resize. */
function initLoreResize(){
  document.querySelectorAll('.subcard[data-lore-box]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      if (!isMasterEditorOn()) return;
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const idx = el.dataset.loreBox;
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = growBoxToFitContent(el);
        if (h && STATE.lore[idx] && h !== STATE.lore[idx].h){
          STATE.lore[idx].h = h;
          queueSave();
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
}

/* Editor Master: ridimensionamento verticale persistente dei ritratti.
   Il resize nativo CSS (angolo in basso a destra del riquadro) resta
   disponibile solo in modalit\u00e0 Master; al rilascio del trascinamento
   l'altezza raggiunta viene salvata in STATE.portraits[i].h e resta quindi
   persistente tra render/reload/export/import (non un semplice resize CSS
   volatile). L'immagine usa object-fit per non deformarsi mai quando il
   riquadro ha un'altezza personalizzata. Solo il Master pu\u00f2 ridimensionare
   il riquadro; il giocatore pu\u00f2 sempre cambiare immagine e didascalia. */
function initPortraitResize(){
  document.querySelectorAll('.portrait[data-portrait-idx]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      if (!isMasterEditorOn()) return;
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const idx = el.dataset.portraitIdx;
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = Math.round(el.getBoundingClientRect().height);
        if (h && STATE.portraits[idx] && h !== STATE.portraits[idx].h){
          STATE.portraits[idx].h = h;
          el.classList.add("has-h");
          queueSave();
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
}

/* Migrazione hidden di Evoluzioni Future: se una voce ha gi\u00e0 un valore
   booleano per "hidden" (salvataggio esistente, o gi\u00e0 impostato dal
   Master con l'occhio), viene rispettato cos\u00ec com'\u00e8. Se invece
   "hidden" \u00e8 assente (voce mai migrata), viene inizializzato secondo
   la regola: livelli fino al 10 compreso (e l'eventuale livello 11 gi\u00e0
   presente nella fonte) visibili di default, livelli dal 12 in poi
   nascosti di default. Non crea n\u00e9 elimina mai livelli. */
function evoLevelNumber(lv){
  const m = String((lv && lv.livello) || "").match(/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}
function migrateEvoHiddenDefaults(list){
  (list || []).forEach(lv=>{
    if (typeof lv.hidden !== "boolean"){
      const n = evoLevelNumber(lv);
      lv.hidden = (n !== null && n >= 12);
    }
  });
}
function renderEvoluzioni(){
  const list = STATE.evoluzioniFuturi || [];
  migrateEvoHiddenDefaults(list);
  const masterOn = isMasterEditorOn();
  const visibleList = masterOn ? list : list.filter(lv=>!lv.hidden);
  const items = list.map((lv,i)=>{
    if (!masterOn && lv.hidden) return "";
    const eyeCtl = masterOn
      ? `<button type="button" class="master-mini-btn master-eye-btn${lv.hidden?' is-hidden':''}" data-master-evo-eye="${i}" title="${lv.hidden?'Nascosto al giocatore \u2014 clic per mostrare':'Visibile al giocatore \u2014 clic per nascondere'}">${lv.hidden?'\ud83d\ude48':'\ud83d\udc41\ufe0f'}</button>`
      : "";
    return `
    <details class="evo-level${masterOn && lv.hidden ? ' master-hidden-item' : ''}">
      <summary>${eyeCtl}${esc(lv.livello)}</summary>
      <div class="evo-content rich" ${masterOn ? 'contenteditable="true"' : ''} data-rich-evo="${i}">${lv.html}</div>
    </details>`;
  }).join("");

  document.getElementById("panel-evoluzioni").innerHTML = (visibleList.length || masterOn) ? `
    <div class="card">
      <h2>Evoluzioni Future & Poteri Futuri <small>testo originale non ancora sbloccato in gioco</small></h2>
      <p class="evo-note">Contenuto trascritto verbatim dalla scheda originale: poteri, trasformazioni e privilegi dei livelli successivi a quello attuale del personaggio, non ancora disponibili in gioco. Clic su una voce per espanderla.</p>
      <div class="evo-list">${items || '<p class="muted">Nessun contenuto di livello futuro trovato nel documento originale di questo personaggio.</p>'}</div>
    </div>
  ` : '';

  document.querySelectorAll('[data-rich-evo]').forEach(el=>{
    el.addEventListener("input", ()=>{ STATE.evoluzioniFuturi[el.dataset.richEvo].html = el.innerHTML; queueSave(); });
  });
  document.querySelectorAll('[data-master-evo-eye]').forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(btn.dataset.masterEvoEye);
      STATE.evoluzioniFuturi[idx].hidden = !STATE.evoluzioniFuturi[idx].hidden;
      renderEvoluzioni();
      queueSave();
    });
  });
}

const HERO_ZOOM_MIN = 1, HERO_ZOOM_MAX = 2.5, HERO_ZOOM_STEP = 0.1;
function clampHeroZoom(z){ return Math.max(HERO_ZOOM_MIN, Math.min(HERO_ZOOM_MAX, z)); }
function setHeroZoom(z){
  STATE.heroBgZoom = clampHeroZoom(z);
  applyHeroBg();
  queueSave();
}
function initHeroZoom(){
  const zoomOut = document.getElementById("hero-zoom-out");
  const zoomIn = document.getElementById("hero-zoom-in");
  const hero = document.getElementById("hero");
  if (zoomOut) zoomOut.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); setHeroZoom((STATE.heroBgZoom||1) - HERO_ZOOM_STEP); });
  if (zoomIn) zoomIn.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); setHeroZoom((STATE.heroBgZoom||1) + HERO_ZOOM_STEP); });
  if (hero) hero.addEventListener("wheel", (e)=>{
    e.preventDefault();
    setHeroZoom((STATE.heroBgZoom||1) + (e.deltaY < 0 ? HERO_ZOOM_STEP : -HERO_ZOOM_STEP));
  }, { passive:false });
}
function applyHeroBg(){  const hero = document.getElementById("hero");
  const heroBg = document.getElementById("hero-bg");
  if (!hero || !heroBg) return;
  heroBg.style.backgroundPosition = STATE.heroBgPos.x + "% " + STATE.heroBgPos.y + "%";
  if (STATE.heroBgImage){
    heroBg.style.backgroundImage = "linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.75)), url('" + STATE.heroBgImage + "')";
  } else {
    heroBg.style.backgroundImage = "";
  }
  const heroZoom = STATE.heroBgZoom || 1;
  heroBg.style.transform = "scale(" + heroZoom + ")";
  const zoomLabel = document.getElementById("hero-zoom-label");
  if (zoomLabel) zoomLabel.textContent = Math.round(heroZoom * 100) + "%";
}

function clamp01to100(v){ return Math.max(0, Math.min(100, v)); }

function initHeroDrag(){
  const hero = document.getElementById("hero");
  if (!hero) return;
  let dragging = false, startX = 0, startY = 0, startPos = {x:50,y:20};

  hero.addEventListener("pointerdown", (e)=>{
    if (e.target.closest("input, .hero-chip, .hero-hint")) return;
    dragging = true;
    hero.classList.add("dragging");
    startX = e.clientX; startY = e.clientY;
    startPos = { x: STATE.heroBgPos.x, y: STATE.heroBgPos.y };
    hero.setPointerCapture(e.pointerId);
  });
  hero.addEventListener("pointermove", (e)=>{
    if (!dragging) return;
    const rect = hero.getBoundingClientRect();
    const dx = e.clientX - startX, dy = e.clientY - startY;
    const newX = clamp01to100(startPos.x - (dx / rect.width) * 100);
    const newY = clamp01to100(startPos.y - (dy / rect.height) * 100);
    STATE.heroBgPos = { x:newX, y:newY };
    applyHeroBg();
  });
  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    hero.classList.remove("dragging");
    try{ hero.releasePointerCapture(e.pointerId); }catch(err){}
    queueSave();
  }
  hero.addEventListener("pointerup", endDrag);
  hero.addEventListener("pointercancel", endDrag);
  hero.addEventListener("pointerleave", (e)=>{ if(dragging) endDrag(e); });
}

/* Riduce automaticamente la dimensione del font del nome personaggio se troppo lungo per stare
   su una riga, cos\u00ec da non farlo tagliare/scomparire su nomi lunghi (es. nome completo esteso). */
function fitNameToWidth(el){
  if (!el) return;
  const maxPx = 64, minPx = 18;
  el.style.letterSpacing = "2px";
  el.style.fontSize = maxPx + "px";
  let size = maxPx;
  let guard = 0;
  while (el.scrollWidth > el.clientWidth && size > minPx && guard < 60){
    size -= 1;
    el.style.fontSize = size + "px";
    guard++;
  }
  // Se anche alla dimensione minima il testo non entra, riduce progressivamente la spaziatura
  // tra le lettere prima di lasciare che l'ultimo carattere venga tagliato.
  let spacing = 2;
  guard = 0;
  while (el.scrollWidth > el.clientWidth && spacing > -0.5 && guard < 30){
    spacing -= 0.1;
    el.style.letterSpacing = spacing.toFixed(1) + "px";
    guard++;
  }
}

function initGoogleButton(){
  const btn = document.getElementById("btn-google");
  const loadBtn = document.getElementById("btn-google-load");
  const statusEl = document.getElementById("google-status");
  if (!btn) return;
  if (!googleConfigured()){
    btn.title = "Non ancora configurato su questa pagina";
    btn.style.opacity = "0.55";
    if (loadBtn){ loadBtn.style.opacity = "0.55"; loadBtn.title = "Non ancora configurato su questa pagina"; }
    return;
  }
  initGoogleAuth();

  // Se l'accesso con Google è già stato eseguito in questa stessa scheda del
  // browser (es. dalla Home, o da un'altra scheda personaggio), recupera subito
  // il token invece di richiedere di nuovo l'accesso.
  if (!googleAccessToken){
    const restored = loadGoogleTokenFromSession();
    if (restored){
      googleAccessToken = restored;
      onGoogleSignedIn();
    }
  }

  // Se questo browser ha già usato Google Drive per questo personaggio almeno
  // una volta (in qualunque sessione precedente), prova un accesso automatico e
  // silenzioso (senza popup) prima di mostrare il solo pulsante manuale: se la
  // sessione Google è ancora attiva nel browser, l'accesso si ripristina da solo.
  if (!googleAccessToken){
    try{
      if (localStorage.getItem(GOOGLE_EVER_CONNECTED_KEY) === "1"){
        tryGoogleSilentReauth();
      }
    }catch(e){}
  }

  // Il collegamento a Google non resta attivo da una apertura di pagina all'altra
  // (per sicurezza, va rifatto ogni volta, salvo il recupero automatico sopra). Se
  // questo browser ha già un salvataggio Drive per questo personaggio, lo segnaliamo
  // qui: altrimenti sembra che le modifiche siano andate perse, quando in realtà
  // vanno solo recuperate premendo di nuovo "Accedi con Google".
  if (!googleAccessToken && statusEl){
    try{
      if (localStorage.getItem(driveStorageKey())){
        statusEl.textContent = "\u2601\ufe0f Salvataggio Drive trovato per questo personaggio \u2014 premi \u201cAccedi con Google\u201d per recuperarlo";
        statusEl.style.color = "var(--gold-bright)";
      }
    }catch(e){}
  }

  btn.addEventListener("click", ()=> signInGoogle(googleAccessToken ? "" : "consent"));
  if (loadBtn) loadBtn.addEventListener("click", ()=>{
    if (!googleAccessToken){ window.alert("Accedi prima con Google."); return; }
    driveLoad();
  });

  const pickerBtn = document.getElementById("btn-google-picker");
  if (pickerBtn){
    if (!GOOGLE_PICKER_API_KEY){
      pickerBtn.style.opacity = "0.55";
      pickerBtn.title = "Non ancora configurato su questa pagina (manca la Chiave API della Picker API)";
    }
    pickerBtn.addEventListener("click", ()=>{
      if (!googleAccessToken){ window.alert("Accedi prima con Google."); return; }
      if (!GOOGLE_PICKER_API_KEY){ window.alert("La selezione di file condivisi non è ancora configurata su questa pagina."); return; }
      openDrivePicker();
    });
  }

  // Suggerimento per il Master: quale file cercare su Drive per condividerlo
  // con il giocatore (il file va condiviso dall'interfaccia di Google Drive
  // stessa: qui mostriamo solo il nome da cercare).
  const shareHintEl = document.getElementById("google-share-hint");
  if (shareHintEl && typeof isMasterUnlocked === "function" && isMasterUnlocked()){
    shareHintEl.textContent = "Master: per condividere, cerca su Drive “" + suggestedFileName() + "” e condividilo con il giocatore.";
  }
}

function openDrivePicker(){
  function showPicker(){
    const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
      .setMimeTypes("application/json")
      .setIncludeFolders(false);
    const picker = new google.picker.PickerBuilder()
      .setOAuthToken(googleAccessToken)
      .setDeveloperKey(GOOGLE_PICKER_API_KEY)
      // Necessario per selezionare correttamente file "Condivisi con me" (non
      // creati da questa app) sotto lo scope drive.file: senza l'App ID, Drive
      // può negare l'accesso al file scelto anche se il selettore lo mostra
      // (l'errore tipico è "File not found" nonostante il file esista davvero).
      // Il Project Number è il segmento numerico prima del primo "-" nel Client ID.
      .setAppId(GOOGLE_CLIENT_ID.split("-")[0])
      .addView(view)
      .setCallback(onDrivePicked)
      .build();
    picker.setVisible(true);
  }
  if (window.gapi && window.gapi.picker){ showPicker(); return; }
  if (!window.gapi){ window.alert("La libreria di Google non è ancora pronta, riprova tra un istante."); return; }
  gapi.load("picker", { callback: showPicker });
}

async function onDrivePicked(data){
  if (!data || data.action !== google.picker.Action.PICKED) return;
  const doc = data.docs && data.docs[0];
  if (!doc || !doc.id) return;

  // Non colleghiamo subito la scheda al file scelto: prima verifichiamo che
  // si riesca davvero a leggerlo con questo account (es. non più condiviso,
  // spostato nel cestino, o scelto con l'account sbagliato). Se il caricamento
  // fallisce, torniamo al collegamento precedente invece di restare bloccati
  // su un id che farebbe fallire anche tutti i salvataggi automatici successivi.
  const previousFileId = driveFileId;
  driveFileId = doc.id;
  driveFileIdKey = driveStorageKey();
  setStatus("File collegato: " + (doc.name || "senza nome") + " — caricamento…");

  const ok = await driveLoad();
  if (ok){
    try{ localStorage.setItem(driveFileIdKey, driveFileId); }catch(e){}
    updateGoogleStatus();
  } else {
    driveFileId = previousFileId;
    setStatus("Collegamento al file condiviso non riuscito — controlla che sia stato condiviso con questo account Google, poi riprova.");
  }
}

/* ============================================================
   BACKUP — esporta / importa
   ============================================================ */
function initSavebarToggle(){
  const bar = document.getElementById("savebar");
  const btn = document.getElementById("savebar-toggle");
  if (!bar || !btn) return;
  function updateLabel(){
    const collapsed = bar.classList.contains("collapsed");
    btn.textContent = collapsed ? "⚙ Opzioni scheda" : "✕ Chiudi opzioni";
    btn.title = collapsed ? "Mostra il pannello Opzioni scheda" : "Nascondi il pannello Opzioni scheda";
  }
  updateLabel();
  btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    bar.classList.toggle("collapsed");
    updateLabel();
  });
}

function initBackupButtons(){
  const exportBtn = document.getElementById("btn-export");
  const importBtn = document.getElementById("btn-import");
  const importInput = document.getElementById("import-input");
  if (!exportBtn || !importBtn || !importInput) return;

  exportBtn.addEventListener("click", ()=>{
    const json = JSON.stringify(STATE, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (STATE.nome || "personaggio").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "personaggio";
    const today = new Date();
    const stamp = today.getFullYear() + String(today.getMonth()+1).padStart(2,"0") + String(today.getDate()).padStart(2,"0");
    a.href = url;
    a.download = `scheda-${safeName}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    setStatus("Backup scaricato");
  });

  importBtn.addEventListener("click", ()=> importInput.click());
  importInput.addEventListener("change", ()=>{
    const f = importInput.files && importInput.files[0];
    importInput.value = "";
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ window.alert("Il file scelto non \u00e8 un backup valido."); return; }
      const ok = window.confirm("Ripristinare la scheda da questo file di backup?\nLa scheda attuale verr\u00e0 sostituita.");
      if (!ok) return;
      STATE = deepMerge(BLANK_STATE, parsed);
      renderAll();
      queueSave();
      setStatus("Backup importato");
    };
    reader.onerror = ()=> window.alert("Non sono riuscito a leggere il file.");
    reader.readAsText(f);
  });
}

function esc(s){
  return String(s===undefined||s===null?"":s)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

/* ============================================================
   ACCESSO PROTETTO DA PASSWORD
   Le password non sono salvate in chiaro: qui \u00e8 salvata solo la
   loro "impronta" (hash SHA-256), che non pu\u00f2 essere riletta al
   contrario. \u00c8 comunque una protezione leggera pensata per un
   gruppo privato, non una sicurezza a prova di esperto: chi
   analizzasse a fondo il codice sorgente potrebbe in teoria
   provare a indovinare la password offline.
   ============================================================ */
const CHAR_SLUG = "jhaggork";
const CHAR_PASSWORD_HASH = "26b319b6735708eeafabb322d781acf03c491b5233f1f3e42cf7a1e4fa99c8d2";
const MASTER_PASSWORD_HASH = "c95488e91dbb746dde809ac9806bdcadb59f72c0dbd89f3440aa4f3e3e25688a";
const LOCK_SESSION_KEY = "morgedal-unlocked::" + CHAR_SLUG;

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

const MASTER_UNLOCK_KEY = "morgedal-master-unlocked";
/* Migrazione: lo sblocco Master vive ora in sessionStorage, non pi\u00f9 in
   localStorage, cos\u00ec resta attivo per tutta la sessione/tab di navigazione
   (Home -> scheda -> Home -> altra scheda) ma NON sopravvive alla chiusura del
   browser / a una nuova sessione. Rimuove anche l'eventuale vecchia chiave
   legacy rimasta in localStorage da versioni precedenti del sito. */
try{ localStorage.removeItem(MASTER_UNLOCK_KEY); }catch(e){}

function isMasterUnlocked(){
  try{ return sessionStorage.getItem(MASTER_UNLOCK_KEY) === "1"; }catch(e){ return false; }
}
function markMasterUnlocked(){
  try{ sessionStorage.setItem(MASTER_UNLOCK_KEY, "1"); }catch(e){}
}

function isUnlockedThisSession(){
  try{ return sessionStorage.getItem(LOCK_SESSION_KEY) === "1"; }catch(e){ return false; }
}
function markUnlocked(){
  try{ sessionStorage.setItem(LOCK_SESSION_KEY, "1"); }catch(e){}
}

function hideLockScreen(){
  const el = document.getElementById("lock-screen");
  if (el) el.style.display = "none";
}

async function attemptUnlock(){
  const input = document.getElementById("lock-input");
  const errorEl = document.getElementById("lock-error");
  const pw = input ? input.value : "";
  if (!pw){ if (errorEl) errorEl.textContent = "Inserisci una password."; return; }
  const hash = await sha256Hex(pw);
  if (hash === MASTER_PASSWORD_HASH){
    // La password Master sblocca questa scheda e TUTTE le altre
    // schede del gruppo (stesso sito), senza richiederla di nuovo.
    markMasterUnlocked();
    markUnlocked();
    setMasterEditorOn(true); // login Master -> Editor Master ON di default
    hideLockScreen();
    init();
  } else if (hash === CHAR_PASSWORD_HASH){
    markUnlocked();
    hideLockScreen();
    init();
  } else {
    if (errorEl) errorEl.textContent = "Password errata, riprova.";
    if (input){ input.value = ""; input.focus(); }
  }
}

async function googleAccountCanBypassPassword(){
  const candidates = [];
  const sharedToken = loadGoogleTokenFromSession();
  if (sharedToken) candidates.push(sharedToken);
  try{
    const raw = sessionStorage.getItem(GOOGLE_IDENTITY_TOKEN_STORAGE_KEY);
    if (raw){
      const data = JSON.parse(raw);
      if (data && data.token && data.expiresAt && Date.now() <= data.expiresAt - 60000){
        candidates.push(data.token);
      }
    }
  }catch(e){}

  for (const token of candidates){
    try{
      const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
        headers: { Authorization: "Bearer " + token }
      });
      if (!res.ok) continue;
      const info = await res.json();
      const email = String(info && info.email || "").toLowerCase();
      if (!email) continue;
      if (email === GOOGLE_OWNER_EMAIL.toLowerCase()){
        markMasterUnlocked();
        return true;
      }
      if (isAuthorizedPlayerEmail(email)) return true;
    }catch(e){}
  }
  return false;
}
async function initLock(){
  // Accesso obbligatorio con account Google autorizzato.
  if (await googleAccountCanBypassPassword()){
    setMasterEditorOn(false);
    hideLockScreen();
    init();
    return;
  }

  // Apertura diretta senza sessione Google valida: torna alla Home,
  // dove il login parte automaticamente e il giocatore viene inviato
  // alla propria scheda in base all'indirizzo email.
  window.location.replace("index.html");
}
