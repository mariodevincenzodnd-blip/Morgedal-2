<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GORG — Scheda Personaggio</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
  :root{
    --bg:#0f0d0c;
    --bg-panel:#1b1613;
    --bg-panel-2:#241d18;
    --bg-panel-3: #171210;
    --border:#3d3024;
    --border-soft:#2a2119;
    --gold:#c9a34e;
    --gold-bright:#eecb7c;
    --violet:#9450d8;
    --violet-dim:#5c3a86;
    --red-glow:#c9463b;
    --blue:#4f8fd6;
    --blue-dim:#2d5a86;
    --teal:#2fb8ac;
    --teal-dim:#1d6b64;
    --amber:#e08a3a;
    --amber-dim:#8a541f;
    --identity:#4fae54;
    --identity2:#d6409f;
    --text:#ece3d0;
    --text-dim:#a89880;
    --text-faint:#7a6c58;
    --good:#6f9a63;
    --bad:#b04a3f;
    --radius:10px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.10), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(201,70,59,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:0;
  }
  ::selection{background:var(--violet-dim);color:#fff;}
  a{color:var(--gold-bright);}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:38px 24px 26px;
    border-bottom:1px solid var(--border);
        cursor:grab;
    user-select:none;
    touch-action:none;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;inset:0;z-index:-1;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
      url('assets/characters/jhaggork-1.webp');
    background-size:cover;
    background-position:50% 20%;
    background-repeat:no-repeat;
    transition:transform .12s ease-out;
  }
  .hero.dragging{cursor:grabbing;}
  .hero-zoom-btn{
    background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.25);
    color:rgba(237,227,208,0.9);width:18px;height:18px;line-height:16px;
    border-radius:50%;font-size:12px;cursor:pointer;padding:0;margin:0 1px;
    font-family:var(--mono);vertical-align:middle;
  }
  .hero-zoom-btn:hover{background:rgba(0,0,0,0.7);}
  #hero-zoom-label{font-family:var(--mono);font-size:10px;margin:0 3px;vertical-align:middle;}
  .hero-hint{
    position:absolute;top:12px;right:16px;font-size:10px;letter-spacing:.4px;
    color:rgba(237,227,208,0.8);background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);
    padding:4px 11px;border-radius:12px;transition:opacity .2s;opacity:0.55;z-index:2;
  }
  .hero:hover .hero-hint{opacity:1;}

  .hero::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, var(--identity), var(--identity2));z-index:2;
  }
  .hero-inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .hero-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(38px,6vw,64px);
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-bright);
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    margin:0;
  }
  .hero-sub{font-family:var(--serif);font-style:italic;color:var(--text-dim);font-size:15px;margin-top:6px;}
  .hero-meta{display:flex;gap:10px;flex-wrap:wrap;}
  .hero-chip{
    background:rgba(20,16,14,0.65);
    border:1px solid var(--border);
    border-radius:20px;
    padding:6px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    backdrop-filter: blur(2px);
  }
  .hero-chip b{color:var(--gold-bright);font-weight:600;}
  .tipo-label{opacity:.65;font-size:11px;letter-spacing:.5px;}
  .hero-chip-tipo{border-color:var(--identity);}
  .hero-chip-tipo b{color:var(--identity);}
  .hero-chip-id{display:flex;flex-direction:column;gap:1px;padding:5px 14px 6px;}
  .hero-chip-label{
    font-size:8px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-faint);font-weight:600;line-height:1.3;
  }
  .quicknav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;}
  .quicknav-pill{
    display:inline-flex;align-items:center;gap:5px;
    background:color-mix(in srgb, var(--identity) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--identity) 45%, transparent);
    border-radius:14px;padding:4px 12px;font-size:12px;color:var(--identity);
    cursor:pointer;transition:background .15s,color .15s;
  }
  .quicknav-pill:hover{background:color-mix(in srgb, var(--identity) 25%, transparent);color:var(--gold-bright);}
  .quicknav-pill::before{content:"\2197";font-size:11px;}
  @keyframes anchorFlash{0%,100%{box-shadow:none;}30%{box-shadow:0 0 0 3px var(--gold);}}
  .anchor-flash{animation:anchorFlash 1.4s ease;}
  .editable-name{
    background:transparent;border:none;color:var(--gold-bright);font-family:var(--serif);
    font-weight:700;font-size:64px;letter-spacing:2px;text-transform:uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    border-bottom:1px dashed transparent; padding:0; width:100%; max-width:100%;
    white-space:nowrap; overflow:hidden;
  }
  @media (max-width:720px){ .editable-name{ font-size:38px; } }
  .editable-name:hover, .editable-name:focus{border-bottom:1px dashed var(--gold); outline:none;}

  /* ---------- TABS ---------- */
  .tabbar{
    position:sticky;top:0;z-index:50;
    background:rgba(15,13,12,0.94);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    white-space:nowrap;
  }
  .tabbar-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 16px;}
  .tab-btn{
    background:none;border:none;color:var(--text-dim);
    font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:0.4px;
    padding:14px 16px;cursor:pointer;border-bottom:2px solid transparent;
    text-transform:uppercase;transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-bright);border-bottom:2px solid var(--gold);}
  .dot-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--identity);margin-left:6px;filter:drop-shadow(0 0 4px var(--identity));animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---------- CARDS / GRID ---------- */
  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:1.6px;
    color:var(--gold);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .card h2 small{font-family:var(--sans);text-transform:none;letter-spacing:0;color:var(--text-faint);font-size:11px;}
  .grid{display:grid;gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  @media (max-width:820px){.grid-4,.grid-3,.grid-6{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.grid-4,.grid-3,.grid-2,.grid-6{grid-template-columns:1fr 1fr;}}
  @media (max-width:700px){.grid-2{grid-template-columns:1fr;}}
  @media (max-width:520px){#equip-slots-grid{grid-template-columns:1fr;}}
  @media (max-width:480px){.grid-3{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-faint);}
  .field input[type=text], .field input[type=number], select, textarea{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%;
  }
  .field input:focus, textarea:focus, select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  textarea{resize:vertical;font-family:var(--sans);line-height:1.55;}

  /* ---------- ABILITY SCORES ---------- */
  .abil-box{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:14px;text-align:center;position:relative;
  }
  .abil-box .name{font-size:11px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .abil-box input[type=number]{
    width:64px;text-align:center;font-size:20px;font-weight:700;font-family:var(--mono);
    background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);
    margin:8px auto 6px;padding:4px 0;
  }
  .abil-box .mod{
    font-family:var(--mono);font-size:22px;color:var(--gold-bright);font-weight:700;
    width:60px;text-align:center;background:transparent;border:1px solid transparent;
    border-radius:6px;padding:2px 0;margin:0 auto;display:block;
  }
  .abil-box .mod:hover{border-color:var(--border-soft);}
  .abil-box .mod:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  .abil-box .mod.is-override{color:var(--text);border-color:var(--gold);background:var(--bg-panel-3);}

  /* ---------- STAT PILLS ---------- */
  .statpill{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px;text-align:center;}
  .statpill label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);margin-bottom:6px;}
  .statpill input{width:100%;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;background:transparent;border:none;color:var(--gold-bright);}
  .statpill input:focus{outline:none;}

  /* ---------- HP ---------- */
  .hp-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .hp-track{flex:1;min-width:220px;height:22px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;position:relative;}
  .hp-fill{height:100%;background:linear-gradient(90deg,#7a2a24,var(--bad));transition:width .3s;}
  .hp-numbers{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:15px;}
  .hp-numbers input{width:64px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);border-radius:6px;padding:6px 2px;}
  .hp-row-temp{margin-top:6px;}
  .hp-track-temp{height:14px;}
  .hp-fill-temp{height:100%;background:linear-gradient(90deg,#8a5a1f,var(--amber));transition:width .3s;}
  .btn{
    background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.3px;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn.primary{background:linear-gradient(180deg, #3a2a12, #241a0c);border-color:var(--gold);color:var(--gold-bright);}
  .btn.small{padding:4px 9px;font-size:11px;}
  .btn.danger:hover{border-color:var(--bad);color:#ff9d90;}

  /* ---------- SKILL LIST ---------- */
  .skill-row{display:grid;grid-template-columns:1fr 46px 60px;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border-soft);}
  .skill-row:last-child{border-bottom:none;}
  .skill-name{font-size:13.5px;}
  .skill-abbr{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);text-align:center;background:var(--bg-panel-3);border-radius:5px;padding:3px 0;}
  .skill-row input[type=number]{width:100%;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:6px;padding:5px 0;font-family:var(--mono);font-weight:700;}

  /* ---------- SAVES ---------- */
  .save-row{display:grid;grid-template-columns:26px 1fr 60px;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--border-soft);}
  .save-row:last-child{border-bottom:none;}
  .save-row .modbadge{font-family:var(--mono);text-align:center;color:var(--gold-bright);font-weight:700;background:var(--bg-panel-3);border-radius:6px;padding:5px 0;}
  .save-row input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;}

  /* ---------- PIPS / TRACKERS ---------- */
  .tracker{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .tracker:last-child{border-bottom:none;}
  .tracker .t-name{font-size:13.5px;font-weight:600;color:var(--text);min-width:190px;}
  .tracker .t-desc{font-size:11.5px;color:var(--text-faint);flex:1;min-width:160px;}
  .pips{display:flex;gap:6px;}
  .pip{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);
    cursor:pointer;background:transparent;transition:background .15s, box-shadow .15s;
  }
  .pip.used{background:radial-gradient(circle at 35% 30%, var(--violet), var(--violet-dim));box-shadow:0 0 8px rgba(148,80,216,0.8);border-color:var(--violet);}
  .pip.death{border-color:var(--bad);}
  .pip.death.death-success{border-color:var(--good);}
  .pip.death.death-success.used{background:radial-gradient(circle at 35% 30%, #8fc97e, var(--good));box-shadow:0 0 8px rgba(111,154,99,0.7);border-color:var(--good);}
  .pip.death.death-fail.used{background:radial-gradient(circle at 35% 30%, #e0685a, var(--bad));box-shadow:0 0 8px rgba(224,104,90,0.7);border-color:var(--bad);}
  .pip.fail{border-color:var(--text-faint);}

  /* ---------- SLOTS ---------- */
  .slot-lvl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .slot-lvl:last-child{border-bottom:none;}
  .slot-lvl .lvl-badge{font-family:var(--serif);font-weight:700;color:var(--gold-bright);width:78px;font-size:13px;}
  .slot-lvl input.maxslot{width:42px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-faint);border-radius:5px;font-size:11px;padding:3px 0;}

  /* ---------- RICH TEXT ---------- */
  .rich{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;
    padding:12px 14px;font-size:14px;line-height:1.65;color:var(--text);
  }
  .rich:focus{outline:none;border-color:var(--gold);}
  .rich b, .rich strong{color:var(--gold-bright);}
  /* Editor Master: consente di ridimensionare verticalmente (drag dell'angolo in basso
     a destra) i riquadri di testo modificabili, sullo stesso principio già usato per le
     Note. Attivo solo quando l'Editor Master è acceso (classe su <body>), quindi mai
     visibile o utilizzabile in modalità giocatore. */
  body.master-editor-on .rich[contenteditable]{
    resize:vertical;overflow:auto;min-height:60px;
  }
  body.master-editor-on .inv-item-desc{
    /* niente overflow:auto qui: la descrizione non deve mai avere uno
       scroll interno. Il Master può comunque ingrandirla manualmente
       (resize:vertical); se prova a ridurla sotto l'altezza del contenuto,
       il listener ResizeObserver in renderInvTable() la fa risnappare. */
    resize:vertical;overflow:hidden;min-height:44px;
  }
  /* Blocco 1: in Editor Master ogni riquadro/tabella (non solo l'inventario)
     deve potersi ridimensionare verticalmente, con lo stesso comportamento
     già usato per le Note: resize manuale dall'angolo in basso a destra. */
  body.master-editor-on .subcard,
  body.master-editor-on .tracker,
  body.master-editor-on textarea{
    resize:vertical;overflow:auto;
  }
  body.master-editor-on .subcard{min-height:80px;}
  body.master-editor-on .tracker{min-height:56px;}
  .subcard{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .subcard h3{margin:0 0 8px;font-family:var(--serif);font-size:14.5px;color:var(--gold-bright);letter-spacing:.4px;}
  .subcard .tag{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);background:rgba(255,255,255,0.05);border:1px solid var(--border-soft);border-radius:10px;padding:2px 9px;margin-bottom:8px;}
  .subcard .tag.tag-passiva{color:var(--amber);background:rgba(224,138,58,0.14);border-color:var(--amber-dim);}
  .subcard .tag.tag-truccetto{color:var(--blue);background:rgba(79,143,214,0.12);border-color:var(--blue-dim);}
  .subcard .tag.tag-abilita{color:var(--red-glow);background:rgba(201,70,59,0.14);border-color:rgba(201,70,59,0.45);}
  .subcard .tag.tag-incantesimo{color:var(--violet);background:rgba(148,80,216,0.12);border-color:var(--violet-dim);}
  .subcard .tag.tag-ambito{color:var(--teal);background:rgba(47,184,172,0.14);border-color:var(--teal-dim);}
  .subcard .tag.tag-campo{color:var(--good);background:rgba(111,154,99,0.14);border-color:rgba(111,154,99,0.45);}
  .subcard-grouped{grid-column:1/-1;}
  .subcard-subsection{padding-top:10px;margin-top:10px;border-top:1px dashed var(--border-soft);}
  .subcard-subsection:first-of-type{border-top:none;margin-top:6px;padding-top:0;}
  .subcard-subsection h4{margin:0 0 4px;font-size:13.5px;color:var(--gold-bright);font-family:var(--serif);}

  /* ---------- MASTER EDITOR (visibile solo in modalità Editor Master) ---------- */
  .master-toolbar{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-bottom:8px;padding:4px 6px;border-radius:6px;
    background:rgba(148,80,216,0.08);border:1px dashed var(--violet-dim);
  }
  .master-cat-select, .master-box-width{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:5px;font-size:10px;padding:2px 4px;max-width:120px;
  }
  .master-mini-btn, .master-mini-del{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:5px;font-size:11px;padding:2px 7px;cursor:pointer;line-height:1.3;
  }
  .master-mini-btn:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  .master-mini-del{color:var(--bad);}
  .master-mini-del:hover{border-color:var(--bad);}
  .master-eye-btn.is-hidden{color:var(--bad);border-color:rgba(176,74,63,0.5);}
  .master-hidden-item{opacity:0.55;border-style:dashed;}
  .master-add-btn{margin-top:8px;}
  .master-name-input{
    display:block;width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border-soft);
    color:var(--gold-bright);font-family:var(--serif);font-size:14.5px;letter-spacing:.4px;
    margin:0 0 8px;padding:0 0 4px;
  }
  .master-name-input:focus{outline:none;border-color:var(--gold-bright);}
  .master-tag-input, .master-uso-input{
    display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;
    background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:10px;padding:2px 9px;margin-bottom:8px;width:auto;max-width:220px;
  }
  [data-master-field][contenteditable="true"]{border-radius:4px;}
  [data-master-field][contenteditable="true"]:focus{outline:1px dashed var(--violet-dim);}
  .home-link{
    position:fixed;top:14px;left:16px;z-index:60;
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    text-decoration:none;white-space:nowrap;transition:border-color .15s, color .15s;
  }
  .home-link:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  @media (max-width:760px){
    .home-link{position:static;display:inline-flex;margin:0 0 10px;}
  }

  .master-editor-toggle{
    display:none;position:fixed;bottom:14px;left:16px;z-index:60;
    align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;white-space:nowrap;
  }
  .master-editor-toggle.show{display:flex;}
  .master-editor-toggle:hover{border-color:var(--gold-bright);}
  .master-editor-toggle.on{background:rgba(148,80,216,0.18);color:var(--violet);border-color:var(--violet);}
  @media (max-width:760px){
    .master-editor-toggle{position:static;margin:0 0 10px;}
  }

  .master-color-picker{
    display:none;position:fixed;bottom:60px;left:16px;z-index:60;
    align-items:center;gap:8px;padding:6px 12px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    white-space:nowrap;
  }
  .master-color-picker.show{display:flex;}
  .master-color-picker input[type=color]{
    width:30px;height:22px;border:none;border-radius:6px;padding:0;
    background:none;cursor:pointer;
  }
  @media (max-width:760px){
    .master-color-picker{position:static;margin:0 0 10px;}
  }

  /* ---------- EVOLUZIONI FUTURE (pannelli richiudibili) ---------- */
  .evo-note{font-size:12.5px;color:var(--text-faint);margin:-6px 0 14px;line-height:1.5;}
  .evo-level{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .evo-level:last-child{margin-bottom:0;}
  .evo-level summary{
    list-style:none;cursor:pointer;padding:12px 16px;font-family:var(--serif);font-size:14.5px;color:var(--gold-bright);
    display:flex;align-items:center;gap:8px;user-select:none;
  }
  .evo-level summary::-webkit-details-marker{display:none;}
  .evo-level summary::before{content:"\25B8";color:var(--gold);transition:transform .15s;}
  .evo-level[open] summary::before{transform:rotate(90deg);}
  .evo-level summary:hover{color:var(--gold);}
  .evo-content{padding:0 16px 16px 16px;border-top:1px solid var(--border-soft);padding-top:12px;}
  .evo-content p{margin:0 0 10px;}
  .evo-content p:last-child{margin-bottom:0;}

  /* ---------- EQUIP GRID ---------- */
  .equip-slot{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .equip-slot label{display:block;font-size:10px;text-transform:uppercase;color:var(--text-faint);letter-spacing:1px;margin-bottom:4px;}
  .equip-slot input{width:100%;background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:14px;}
  .equip-slot input:focus{outline:none;}
  .img-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .thumb{width:42px;height:42px;border-radius:7px;object-fit:cover;border:1px solid var(--border-soft);background:var(--bg-panel-3);cursor:pointer;}
  .thumb-placeholder{width:42px;height:42px;border-radius:7px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:17px;background:var(--bg-panel-3);cursor:pointer;flex-shrink:0;}
  .thumb-placeholder:hover, .thumb:hover{border-color:var(--gold);}
  /* Miniature Equipaggiamento: più grandi rispetto a quelle dell'Inventario */
  #equip-slots-grid .img-row{flex-wrap:wrap;gap:10px;}
  #equip-slots-grid .thumb, #equip-slots-grid .thumb-placeholder{width:96px;height:96px;border-radius:10px;}
  #equip-slots-grid .thumb-placeholder{font-size:30px;}
  .file-btn{font-size:10.5px;color:var(--text-dim);cursor:pointer;border:1px solid var(--border-soft);border-radius:6px;padding:4px 8px;background:var(--bg-panel-2);white-space:nowrap;}
  .file-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .file-input-hidden{display:none;}
  .img-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;}
  .img-remove:hover{color:var(--bad);}

  /* ---------- INGRANDIMENTO IMMAGINE (solo Equipaggiamento) ---------- */
  .img-zoom{
    background:none;border:1px solid var(--border-soft);border-radius:6px;color:var(--text-faint);
    cursor:pointer;font-size:13px;width:24px;height:24px;line-height:1;flex-shrink:0;
  }
  .img-zoom:hover{border-color:var(--gold);color:var(--gold-bright);}
  .img-lightbox{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;}
  .img-lightbox[hidden]{display:none;}
  .img-lightbox-backdrop{position:absolute;inset:0;background:rgba(10,8,7,0.95);backdrop-filter:blur(4px);}
  .img-lightbox-content{
    position:relative;width:100%;height:100%;max-width:min(98vw,2200px);max-height:97vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transform:scale(.96);opacity:0;transition:transform .16s ease,opacity .16s ease;
  }
  .img-lightbox.show .img-lightbox-content{transform:scale(1);opacity:1;}
  .img-lightbox-content img{display:block;max-width:100%;max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:12px;border:1px solid var(--border-soft);box-shadow:0 16px 60px rgba(0,0,0,0.6);}
  .img-lightbox-caption{color:var(--gold-bright);font-size:15px;font-weight:600;text-align:center;}
  .img-lightbox-caption[hidden]{display:none;}
  .img-lightbox-close{
    position:absolute;top:-16px;right:-16px;width:42px;height:42px;border-radius:50%;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    font-size:24px;line-height:1;cursor:pointer;
  }
  .img-lightbox-close:hover{border-color:var(--gold);color:var(--gold-bright);}
  @media (max-width:720px){
    .img-lightbox{padding:8px;}
    .img-lightbox-content{max-width:100vw;max-height:100vh;gap:10px;}
    .img-lightbox-content img{max-height:calc(100vh - 70px);}
    .img-lightbox-close{top:-13px;right:2px;width:38px;height:38px;font-size:22px;}
  }

  /* ---------- INVENTORY ---------- */
  .inv-cap{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .inv-bar{flex:1;min-width:200px;height:16px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;}
  .inv-bar-fill{height:100%;transition:width .3s, background .3s;}
  /* Elenco Inventario: card verticali, ordine Nome -> Descrizione -> Peso.
     La descrizione non ha altezza fissa né scroll interno: si espande col contenuto. */
  .inv-list{display:flex;flex-direction:column;gap:10px;}
  .inv-item{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .inv-item-top{display:flex;align-items:center;gap:10px;}
  .inv-item input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;}
  .inv-item .imgcell{flex-shrink:0;}
  .inv-item-name{background:transparent;border:none;color:var(--text);font-weight:600;font-size:14px;flex:1;min-width:0;}
  .inv-item-name:focus, .inv-item-desc:focus{outline:none;background:var(--bg-panel-3);border-radius:4px;}
  .inv-item-desc{
    display:block;width:100%;box-sizing:border-box;margin-top:8px;
    background:transparent;border:none;color:var(--text-dim);font-size:13px;font-family:var(--sans);
    line-height:1.5;resize:none;overflow:hidden;min-height:22px;padding:4px 2px;
  }
  .inv-item-peso{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
  .inv-item-peso label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);}
  .inv-item-peso input[type=number]{width:52px;background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:5px;text-align:center;font-family:var(--mono);}
  .inv-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;flex-shrink:0;}
  .inv-remove:hover{color:var(--bad);}

  /* ---------- PORTRAITS ---------- */
  .portraits{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){.portraits{grid-template-columns:1fr;}}
  .portrait{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-soft);}
  /* Il resize verticale nativo (angolo in basso a destra) \u00e8 disponibile
     solo in Editor Master: solo il Master controlla la dimensione del
     riquadro, il giocatore controlla solo immagine e didascalia. */
  body.master-editor-on .portrait{resize:vertical;}
  .portrait img{width:100%;display:block;filter:saturate(1.05) contrast(1.03);cursor:pointer;}
  /* Quando il riquadro ha un'altezza personalizzata (persistita dal
     Master), l'immagine usa object-fit:cover per non deformarsi mai. */
  .portrait.has-h img{height:100%;object-fit:cover;}
  .portrait .cap{
    position:absolute;bottom:0;left:0;right:0;padding:10px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
    font-family:var(--serif);letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:var(--gold-bright);
    border:none;outline:none;width:100%;box-sizing:border-box;
  }
  .portrait .cap:focus{background:linear-gradient(0deg, rgba(0,0,0,0.92), rgba(0,0,0,0.35));}

  /* ---------- NOTES ---------- */
  .note-entry{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .note-entry .note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .note-entry input[type=text]{background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:13px;width:70%;}
  .note-entry input[type=text]:focus{outline:none;}
  .note-entry textarea{background:transparent;border:none;color:var(--text);width:100%;min-height:70px;font-size:13.5px;}
  .note-entry textarea:focus{outline:none;}
  .note-date{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}

  .savebar{
    position:static;margin:28px 0 40px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    max-width:min(94vw, 620px);justify-content:flex-end;
    font-size:11px;color:var(--text-faint);
    background:rgba(20,16,14,0.9);border:1px solid var(--border-soft);border-radius:16px;
    padding:8px 10px;
  }
  .savebar b{color:var(--gold-bright);}
  .savebar .btn{padding:5px 11px;font-size:10.5px;border-radius:14px;}
  .savebar .sep{width:1px;height:16px;background:var(--border-soft);}
  .savebar.warn{border-color:var(--bad);}
  .savebar-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--gold-bright);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;flex-shrink:0;white-space:nowrap;
  }
  .savebar-toggle:hover{border-color:var(--gold-bright);}
  .savebar.collapsed{padding:6px 8px;gap:0;}
  .savebar.collapsed .savebar-content{display:none;}

  /* Su smartphone il riquadro comandi non deve restare "fixed" sopra i contenuti
     durante lo scroll: torna nel normale flusso della pagina, in fondo alla scheda. */
  @media (max-width:768px){
    body{ padding-bottom:0; }
    .savebar{
      position:static;
      bottom:auto; right:auto; left:auto; top:auto;
      width:auto; max-width:none;
      margin:24px 20px 20px;
      justify-content:center;
      backdrop-filter:none;
    }
  }
  .savebar #savebar-status.warn-text{color:#ff9d90;font-weight:600;}
  @media (max-width:760px){
    .pip{width:28px;height:28px;}
    .pips{gap:8px;}
    .btn{padding:10px 14px;font-size:13px;}
    .btn.small{padding:8px 12px;}
    .tab-btn{padding:14px 15px;}
  }
  #btn-print{background:linear-gradient(180deg, #22301f, #182013);border-color:var(--good);}
  #btn-print:hover{color:#b9e0ac;}

  .divider-label{font-family:var(--serif);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);margin:22px 0 8px;text-align:center;position:relative;}
  .divider-label::before,.divider-label::after{content:"";position:absolute;top:50%;width:38%;height:1px;background:var(--border);}
  .divider-label::before{left:0;}
  .divider-label::after{right:0;}

  /* ---------- TRACCIATO DEL CAOS ---------- */
  .caos-tracker{
    display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
    background:radial-gradient(ellipse at center, rgba(148,80,216,0.10), transparent 70%);
    border:1px solid var(--border-soft);border-radius:12px;padding:18px 20px;margin-bottom:16px;
  }
  .caos-pips{display:flex;gap:8px;}
  .caos-pip{
    width:26px;height:26px;border-radius:50%;border:2px solid #9450d8;background:transparent;cursor:pointer;
    transition:background .2s, box-shadow .2s, transform .15s;
  }
  .caos-pip:hover{transform:scale(1.08);}
  .caos-pip.on{
    background:radial-gradient(circle at 35% 30%, #ff8a4a, #c9463b);
    box-shadow:0 0 12px 3px rgba(255,138,74,0.7);border-color:#ff8a4a;
  }
  .caos-word{display:flex;gap:6px;font-family:var(--serif);font-weight:700;font-size:38px;letter-spacing:2px;}
  .caos-letter{
    color:var(--border-soft);text-shadow:none;transition:color .3s, text-shadow .3s, transform .3s;
    transform:scale(0.92);
  }
  .caos-letter.lit{transform:scale(1);}
  .caos-letter.lit:nth-child(1){color:#4fd1c5;text-shadow:0 0 14px rgba(79,209,197,0.8);}
  .caos-letter.lit:nth-child(2){color:#e0a85a;text-shadow:0 0 14px rgba(224,168,90,0.8);}
  .caos-letter.lit:nth-child(3){color:#e0524a;text-shadow:0 0 14px rgba(224,82,74,0.8);}
  .caos-letter.lit:nth-child(4){color:#9450d8;text-shadow:0 0 14px rgba(148,80,216,0.8);}
  .caos-flame{font-size:32px;filter:grayscale(1) opacity(0.25);transition:filter .3s, transform .3s;}
  .caos-flame.on{filter:none;opacity:1;animation:flamepulse 1.4s infinite;}
  @keyframes flamepulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .caos-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-faint);text-align:center;margin-top:6px;}
  .caos-col{display:flex;flex-direction:column;align-items:center;}

  /* ---------- SCHERMATA DI ACCESSO ---------- */
  #lock-screen{
    position:fixed;inset:0;z-index:9999;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.12), transparent 60%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .lock-box{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);border-radius:12px;
    padding:32px 30px;max-width:340px;width:100%;text-align:center;
  }
  .lock-box h2{
    font-family:var(--serif);color:var(--gold-bright);text-transform:uppercase;letter-spacing:1.6px;
    font-size:20px;margin:0 0 8px;
  }
  .lock-box p{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
  .lock-box input[type=password]{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:10px 12px;font-size:14px;width:100%;text-align:center;margin-bottom:12px;
  }
  .lock-box input:focus{outline:none;border-color:var(--gold);}
  .lock-box button{
    background:linear-gradient(180deg, #3a2a12, #241a0c);border:1px solid var(--gold);color:var(--gold-bright);
    border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;width:100%;
  }
  .lock-box button:hover{opacity:0.9;}
  .lock-error{color:#ff9d90;font-size:12px;margin-top:10px;min-height:14px;}

  /* ---------- STAMPA PULITA ---------- */
  @media print{
    @page{ margin:10mm; }
    body{ background:#fff !important; color:#111 !important; padding-bottom:0 !important; font-size:11px !important; }
    .tabbar, .savebar, .hero-hint, #hero-image-input, #import-input,
    .thumb, .thumb-placeholder, .file-btn, .img-remove, .img-row, .img-zoom, #img-lightbox,
    .inv-remove, #inv-add, #reset-slots, #reset-risorse, #lock-screen{ display:none !important; }
    .wrap{ padding:12px 0 !important; max-width:100% !important; }
    .hero{
      background:none !important; padding:2px 0 8px !important; border-bottom:2px solid #111 !important;
      cursor:default !important;
    }
    .hero::before{ display:none !important; }
    .hero-inner{ align-items:baseline !important; gap:8px !important; }
    .editable-name{ color:#000 !important; text-shadow:none !important; border:none !important; font-size:26px !important; }
    .hero-sub{ color:#444 !important; font-size:11px !important; margin-top:2px !important; }
    .hero-chip{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; backdrop-filter:none !important; padding:2px 9px !important; font-size:10.5px !important; }
    .hero-chip b{ color:#000 !important; }
    .hero-meta{ gap:6px !important; }

    .panel{ display:block !important; }
    .card, .subcard{
      background:#fff !important; border:1px solid #999 !important; box-shadow:none !important;
      page-break-inside:avoid; break-inside:avoid;
      padding:8px 10px !important; margin-bottom:6px !important; border-radius:5px !important;
    }
    .card h2{ color:#000 !important; border-bottom:1px solid #999 !important; font-size:10.5px !important; margin:0 0 6px !important; padding-bottom:3px !important; letter-spacing:.6px !important; }
    .card h2 small{ display:none !important; }
    input, textarea, select{ color:#000 !important; background:transparent !important; border:none !important; font-size:11px !important; padding:2px 3px !important; }
    .rich{ background:#fff !important; border:1px solid #ccc !important; color:#000 !important; padding:6px 8px !important; font-size:10.5px !important; line-height:1.4 !important; }
    .rich b, .rich strong{ color:#000 !important; }

    /* forza colonne compatte indipendentemente dal breakpoint a schermo */
    .grid{ gap:5px !important; }
    .grid-6{ grid-template-columns:repeat(6,1fr) !important; }
    .grid-4{ grid-template-columns:repeat(4,1fr) !important; }
    .grid-3{ grid-template-columns:repeat(3,1fr) !important; }
    .grid-2{ grid-template-columns:repeat(2,1fr) !important; }

    /* caratteristiche: molto più compatte */
    .abil-box{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .abil-box .name{ color:#000 !important; font-size:8.5px !important; letter-spacing:.3px !important; }
    .abil-box input[type=number]{
      color:#000 !important; background:transparent !important; border:none !important;
      font-size:13px !important; width:32px !important; margin:2px auto 1px !important; padding:0 !important;
    }
    .abil-box .mod{ color:#000 !important; font-size:13px !important; }

    .statpill{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .statpill label{ font-size:8.5px !important; margin-bottom:2px !important; }
    .statpill input{ color:#000 !important; font-size:12px !important; }

    .save-row, .skill-row{ padding:3px 4px !important; }
    .save-row .modbadge{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; padding:2px 0 !important; }
    .skill-row input, .inv-item input, .inv-item textarea{ color:#000 !important; }
    .skill-abbr{ background:#fff !important; border:1px solid #ccc !important; color:#333 !important; font-size:9px !important; padding:1px 0 !important; }

    .hp-row{ gap:8px !important; }
    .hp-numbers input{ padding:3px 0 !important; }
    .pip{ width:15px !important; height:15px !important; border-color:#000 !important; }
    .pip.used{ background:#000 !important; box-shadow:none !important; }
    .hp-track, .inv-bar{ height:12px !important; border:1px solid #000 !important; background:#fff !important; }
    .hp-fill, .inv-bar-fill{ background:#999 !important; }

    .equip-slot{ background:#fff !important; border:1px solid #ccc !important; padding:5px 6px !important; }
    .equip-slot label{ font-size:8.5px !important; }
    .equip-slot input{ color:#000 !important; font-size:11px !important; }

    .inv-item .imgcell{ display:none !important; }
    .inv-item{ padding:4px 5px !important; }
    .tracker{ padding:5px 0 !important; }
    .slot-lvl{ padding:4px 0 !important; }

    .portraits, .portrait{ display:none !important; }
    .caos-tracker{ background:#fff !important; border:1px solid #999 !important; }
    .caos-pip{ border-color:#000 !important; }
    .caos-pip.on{ background:#000 !important; box-shadow:none !important; }
    .caos-letter{ color:#ccc !important; text-shadow:none !important; }
    .caos-letter.lit{ color:#000 !important; text-shadow:none !important; }
    .caos-flame{ display:none !important; }
    .divider-label{ color:#444 !important; margin:10px 0 6px !important; font-size:9.5px !important; }
    .divider-label::before, .divider-label::after{ background:#999 !important; }

(function(){
"use strict";

/* ============================================================
   DATI DI BASE (prima importazione dalla scheda originale)
   ============================================================ */
function slugify(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

/* Colore funzionale del "tag" di una capacit\u00e0, dedotto dal testo del tag stesso
   (non dall'array di appartenenza): Passiva = viola, Truccetto = blu, Abilit\u00e0/Incantesimo = rosso. */
function tagColorClass(tag){
  const t = String(tag || "");
  if (/^passiva/i.test(t)) return "tag-passiva";
  if (/^truccetto/i.test(t)) return "tag-truccetto";
  if (/incantesimo/i.test(t)) return "tag-incantesimo";
  if (/abilit/i.test(t)) return "tag-abilita";
  return "";
}
const ATTACCHI_LINKS = [];
function renderAttacchiNav(){
  if (!ATTACCHI_LINKS.length) return "";
  return `<div class="quicknav">${ATTACCHI_LINKS.map(l=>`<span class="quicknav-pill" data-jump-tab="${l.tab}" data-jump-anchor="${l.anchor}">${l.label}</span>`).join("")}</div>`;
}
function bindQuicknav(){
  document.querySelectorAll(".quicknav-pill").forEach(el=>{
    el.addEventListener("click", ()=> jumpToAnchor(el.dataset.jumpTab, el.dataset.jumpAnchor));
  });
}
function jumpToAnchor(tabId, anchorId){
  const btn = document.querySelector('.tab-btn[data-tab="'+tabId+'"]');
  if (btn) btn.click();
  setTimeout(()=>{
    const el = anchorId ? document.getElementById(anchorId) : null;
    const target = el || document.getElementById("panel-"+tabId);
    if (target){
      target.scrollIntoView({behavior:"smooth", block:"start"});
      if (el){
        el.classList.add("anchor-flash");
        setTimeout(()=>el.classList.remove("anchor-flash"), 1500);
      }
    }
  }, 80);
}

me":"INCANTATORE ARCANO SUPERIORE","desc":"<p>Il giocatore può lanciare due magie durante il proprio turno, a patto che una delle due non sia esclusivamente offensiva(dedita al solo danno nemico), ed ogni due turni, potrà lanciarne due di attacco.</p>","hidden":false,"width":3,"tag":"Passiva"}],"abilita":[{"nome":"FURTO MAGICO","desc":"<p>Il pg ha la possibilità di effettuare un tiro per assorbire slot incantesimi, da nemici che siano magici, immondi o benedetti in un&#x27;area di max 8 caselle. Avendo la possibilità di condividere il ricavato con i propri compagni.</p><p>Con slot. lvl ½  = 1d4 decidere livello + 1d4 recupero slot(solo nel caso in cui entrambi i tiri dovessero esse critici, il PG potrebbe allora decidere di recuperare 1 solo slot di lvl 5)</p><p>Con Slot lvl  ¾  = 1d6 decidere livello + 1d6 recupero slot(nel caso di critico su entrambi i dadi, avrebbe uno slot 6 temporaneo fino alla fine del corrente riposo lungo)</p>","hidden":false,"width":3},{"nome":"PRISMA DEL TRASMUTATORE","desc":"<p>Il giocatore può creare grazia alle sue conoscenze magiche, un prisma con diversi poteri.</p><p>se infuso in un arma dona poteri aggiuntivi elementali all’arma;</p><p>se utilizzato come oggetto può essere trasformato in un utilizzabile es(dal tomo dell’acqua prende onda grande e la infonde in una gemma che dopo essere stata utilizzata viene distrutta)</p><p>può essere utilizzata per canalizzare magie di altri giocatori(es imposizione di mani, per poter recuperare altri pf)</p><p>le gemme hanno poteri non conosciuti che il pg può provare a scovare</p><p>In base ai lvl di slot impiegati la forza e durata dei prismi muterà.</p><p>(limite prismi a riposo lungo 4)</p>","hidden":false,"width":3},{"nome":"VELO DEL MAGO","desc":"<p>Il mago evoca un campo di forza protettivo che può assorbire danni e rilasciare un contrattacco magico. Quando il mago subisce danno, può attivare il velo, assorbendo parte dei danmi 1d12 o 2d6. Successivamente il mago può scegliere uno dei seguenti effetti (Il velo appare come un bagliore evanescente che risulterà avere come forma una cupola attaccata al suolo):</p><p>Velo Protettivo: Ottiene +2 alla CA fino a quando non cambierà posizione, gli incantesimi avranno la possibilità di attraversare la barriera, durata tutto lo scontro. Se usata più volte durante lo scontro il precedente scudo svanirà, se si dovesse scegliere un effetto differente allora rimarrebbe attiva.</p><p>Velo Riflesso: L’energia assorbita viene rilasciata sotto forma di una scarica magica, infliggendo danni  a un nemico  a scelta entro 9 caselle, lo stesso potrebbe passare 1 turno in stato confusionale TS 16 Saggezza.</p><p>Velo Caricante: L’energia viene convertita in azione bonus durante il prossimo turno</p><p>Velo Devastante: L’effetto permette di lanciare una qualsiasi magia di slot 1/2 gratis o 3/4/5 slot a consumo anche offensiva.</p>","hidden":false,"width":3}],"incantesimo":[{"nome":"RAGGIO GELIDO","desc":"<p>Un raggio gelido di luce azzurra e biancastra sfreccia verso una creatura entro gittata. L&#x27;incantatore effettua un attacco a distanza con questo incantesimo contro il bersaglio, con possibilità di congelare l’avversario.</p><p>Lvl 1 : Danni 1d6, Distanza 6 caselle, 2 Danni x 1 turno;</p><p>Lvl 2 : Danni 2d6, Distanza 8 caselle, 2 Danni x 2 turni;</p><p>Lvl 3 : Danni 3d6, Distanza 10 caselle, 2 Danni x 3 turni;</p><p>Lvl 4 : Danni 5d6, Distanza 15 caselle, 2 Danni x 4 turni, il colpo potrebbe congelare il nemico;</p><p>Lvl 5 : Danni 7d6, Distanza 20 caselle, 3 Danni x 4 turni, il colpo ha alte probabilità di congelare il nemico;</p>","hidden":false,"width":3},{"nome":"COLTELLI ACIDI","desc":"<p>Evoca dei coltelli volanti intrisi di acido che colpiscono il nemico con danni altamente corrosivi. (6h)</p><p>Lvl 1 : Danni 1d4, distanza massima 4 caselle, 1 turno 2 pf danni corrosivi;</p><p>Lvl 2 : Danni 2d4, distanza massima 6 caselle, 2 turni 1d4  danni corrosivi;</p><p>Lvl 3 : Danni 2d6, distanza massima 6 caselle, 3 turni 1d4  danni corrosivi;</p><p>Lvl 4 : Danni 3d6, distanza massima 6 caselle, 3 turni 1d4  danni corrosivi;</p><p>Lvl 5 :  Danni 6d6, distanza massima 15 caselle, 5 turni 1d4  danni corrosivi;</p>","hidden":false,"width":3},{"nome":"MINOR ILLUSIO","desc":"<p>L&#x27;incantatore crea un suono o un&#x27;immagine di un oggetto entro gittata che permane per la durata dell&#x27;incantesimo. L&#x27;illusione termina anche se l&#x27;incantatore la interrompe con un&#x27;azione o se lancia questo incantesimo di nuovo. Se l&#x27;incantatore crea un suono, il suo volume può variare da un sussurro a un urlo. Può trattarsi di un qualsiasi suono a sua scelta. Può echeggiare ininterrottamente per tutta la durata, oppure l&#x27;incantatore può emettere suoni più discreti in momenti diversi prima che l&#x27;incantesimo termini. L&#x27;immagine non può emettere suoni, luci, odori o qualsiasi altro effetto sensoriale. Un&#x27;interazione fisica con l&#x27;immagine rivela che si tratta di un&#x27;illusione, in quanto gli oggetti la attraversano. Se una creatura discerne l&#x27;illusione per ciò che è, l&#x27;illusione si attenua per quella creatura.</p><p>Lvl 1 : Dimensioni oggetto PICCOLA, Suono max 4 caselle, Durata 2 turni;</p><p>Lvl 2 : Dimensioni oggetto PICCOLA, Suono max 6 caselle, Durata 4 turni;</p><p>Lvl 3 : Dimensioni oggetto MEDIA, Suono max 8 caselle, Durata 6 turni;</p><p>Lvl 4 : Dimensioni oggetto MEDIA, Suono max 10 caselle, Durata 8 turni;</p><p>Lvl 5 : Dimensioni oggetto GRANDE, Suono max 15 caselle, Durata 12 turni;</p>","hidden":false,"width":3},{"nome":"MANO MAGICA","desc":"<p>Una mano spettrale fluttuante appare in un punto a scelta dell&#x27;incantatore situato entro gittata. La mano permane per la durata dell&#x27;incantesimo o finché l&#x27;incantatore non la congeda con un&#x27;azione. La mano svanisce se quest&#x27;ultimo lancia di nuovo questo incantesimo. L&#x27;incantatore può usare la sua azione per controllare la mano. Può usarla per maneggiare un oggetto, aprire una porta o tutte le funzioni che farebbe una mano comune, non può attaccare.</p><p>Lvl 1 : Distanza 4 caselle durata 2 Turni, Sollevamento max 2Kg.</p><p>Lvl 2 : Distanza 6 caselle durata 3 Turni, Sollevamento max 4Kg.</p><p>Lvl 3 : Distanza 8 caselle durata 4 Turni, Sollevamento max 5Kg.</p><p>Lvl 4 : Distanza 10 caselle durata 6 Turni, Sollevamento max 8Kg.</p><p>Lvl 5 : Distanza 15 caselle durata 8 Turni, Sollevamento max 15Kg. (Una sola volta a scontro può lanciare incantesimi che richiedano l’utilizzo delle mani.)</p>","hidden":false,"width":3},{"nome":"STRETTA FOLGORANTE","desc":"<p>Un fulmine si sprigiona dalla mano dell&#x27;incantatore per trasmettere una scarica folgorante a una creatura da lui toccata. L&#x27;incantatore effettua un attacco in mischia con questo incantesimo contro il bersaglio. Se il bersaglio indossa un&#x27;armatura fatta di metallo l&#x27;incantatore dispone di un vantaggio di 1d6.</p><p>Lvl 1 :  Danni 1d8</p><p>Lvl 2 :  Danni 1d10+1d6</p><p>Lvl 3 :  Danni 1d20+1d4</p><p>Lvl 4 :  Danni 1d20+1d10+2</p><p>Lvl 5 :  Danni 2d20+2, con possibilità di scagliare il fulmine anche a distanza max 15 caselle.</p>","hidden":false,"width":3},{"nome":"IRRIDIO AURA","desc":"<p>Permette di evocare, delle luci di piccolissima entità che con il loro movimento ondulare, avvolgono l&#x27;obiettivo richiesto dall’incantatore, mantenendo un moto ellittico perpetuo.</p><p>Lvl 1 : Durata 2 turni, applicabile solo a piccole entità o esseri di piccola costituzione. (Applicabile su +1 casella in combattimento)</p><p>Lvl 2 : Durata 4 turni, applicabile solo a piccole entità o esseri di piccola costituzione. (+2 casella in combattimento)</p><p>Lvl 3 : Durata 6 turni, applicabile a medie entità o esseri di media costituzione. (+4 casella in combattimento)</p><p>Lvl 4 : Durata 8 turni, applicabile a medie entità o esseri di media costituzione. (+6 casella in combattimento)</p><p>Lvl 5 : Durata 12 turni, applicabile a grandi entità o esseri di grande costituzione. (+10 casella in combattimento)</p>","hidden":false,"width":3}],"divergenzaIntro":"","ambiti":[],"campiAttiva":[],"divergenzaAttivaNote":"","divergenzaPassiva":"","trucchetti":[],"descrizione":{"eta":"GIOVANE","altezza":"1,90","peso":"150 Kg","occhi":"GIALLI","capelli":"ROSSI","colorePersonaggio":"SQUAME VERDI SCURO"},"backstory":"<p>Jhaggork nasce a Tibstina un continente del mondo di Morgedal costellato da diverse razze Animalimorfi con ognuna il proprio territorio ben definito. Seppur una razza prettamente fisica, abile nel combattimento e istintiva, questa coesisteva con la comunità umana, che portò la sua influenza. Jhaggork sin dalla schiusa del suo uovo risultò innamorato della magia, poiché seppur pochi, vi erano dei maghi nella comunità. Diventato adolescente intraprese la via della magia grazie al suo maestro “xx” e questo gli permise di diventare un mago molto astuto e potente. Sfortunatamente la razza Lizardfolk presentava una malformazione genetica che portava i rettiliani ad auto avvelenarsi, il giovane mago fù uno dei pochi a salvarsi poiché nato senza ghiandole velenifere. I restanti abitanti della comunità Lizardfolk un giorno di estate durante la loro quotidianità, vennero attaccati da delle guardie dalle armature dal color grigio scuro ed il mantello bianco e dalla forza sovrumana. Jhag riuscì a fuggire preservando il suo istinto animale, messosi subito in viaggio per capire cosa stesse succedendo, si ritrovò in un nuovo continente, Sadarill e lì conobbe altri quattro soggetti con storie altrettanto assurde, cui condivise tantissime avventure.</p>","lore":[],"portraits":[{"img":"assets/characters/jhaggork-1.webp","cap":"JHAGGORK","h":null},{"img":"assets/characters/jhaggork-2.webp","cap":"JHAGGORK · Ritratto 2","h":null}],"noteGenerali":"","diarioEntries":[],"evoluzioniFuturi":[],"fonteOriginale":"SCHEDA PG\r\n\tNOME PERSONAGGIO \r\n\r\n\r\n\r\n\r\n\r\n\r\nJHAGGORK ARTH\r\n\tCLASSE E LIVELLO\r\n\r\n\r\nMAGO MULTIELEMENTALE LVL 7\r\n\tBACKGR \n12\r\n\r\n\r\n(+1)\r\n\tCARISMA\r\n\r\n\r\n10\r\n\r\n\r\n(+0)\r\n\t15 (+3) SAGGEZZA (PERCEZIONE) PASSIVA\r\n\t                                                 \r\n                                     \r\nDESCRIZIONE PG\r\n\tETA’\r\n\r\n\r\nGIOVANE\r\n\r\n\r\n\tALTEZZA\r\n\r\n\r\n1,90\r\n\tPESO\r\n\r\n\r\n150 Kg\r\n\tOCCHI\r\n\r\n\r\nGIALLI\r\n\r\n\r\n\tCARNAGIONE\r\n\r\n\r\nSQUAME VERDI SCURO\r\n\r\n\r\n\tCAPELLI\r\n\r\n\r\nROSSI\r\n\t\r\n\r\nIMMAGINE 1\r\n\r\n\r\n\t\r\n\r\nIMMAGINE 2\r\n\r\n\r\n\t  \r\n\r\n\t  \r\n\r\n\tSTORIA\r\n\r\n\r\nJhaggork nasce a Tibstina un continente del mondo di Morgedal costellato da diverse razze Animalimorfi con ognuna il proprio territorio ben definito. Seppur una razza prettamente fisica, abile nel combattimento e istintiva, questa coesisteva con la comunità umana, che portò la sua influenza. Jhaggork sin dalla schiusa del suo uovo risultò innamorato della magia, poiché seppur pochi, vi erano dei maghi nella comunità. Diventato adolescente intraprese la via della magia grazie al suo maestro “xx” e questo gli permise di diventare un mago molto astuto e potente. Sfortunatamente la razza Lizardfolk presentava una malformazione genetica che portava i rettiliani ad auto avvelenarsi, il giovane mago fù uno dei pochi a salvarsi poiché nato senza ghiandole velenifere. I restanti abitanti della comunità Lizardfolk un giorno di estate durante la loro quotidianità, vennero attaccati da delle guardie dalle armature dal color grigio scuro ed il mantello bianco e dalla forza sovrumana. Jhag riuscì a fuggire preservando il suo istinto animale, messosi subito in viaggio per capire cosa stesse succedendo, si ritrovò in un nuovo continente, Sadarill e lì conobbe altri quattro soggetti con storie altrettanto assurde, cui condivise tantissime avventure.\r\n\t\r\n\r\n                                          \r\nEQUIPAGGIAMENTO\r\n\tTESTA\r\n\r\n\r\nX\r\n\tBUSTO\r\n\r\n\r\nMANTELLO DA INCANTATORE\r\n\tGAMBE\r\n\r\n\r\nX\r\n\tARMA 1\r\n\r\n\r\nBASTONE DELA COSCIENZA PROFONDA \r\n\tARMA 2\r\n\r\n\r\nTOMO MULTIRLEMENTALE\r\n\tALTRO\r\n\r\n\r\nBOMBE DA LANCIO\r\n\tARTEFATTO 1\r\n\r\n\r\nANELLO DELLA SAPIENZA \r\n\r\n\r\n\tARTEFATTO 2\r\n\r\n\r\nX\r\n\tARTEFATTO 3\r\n\r\n\r\nX\r\n\t\r\n\r\n* BASTONE DELLA COSCIENZA PROFONDA: Il bastone oltre a lanciare magie ed incantesimi li apprende e se possibile crea combinazioni o intrecci che al mago stesso possano giovare, in pratica il bastone ha capacità adattive e evolutive sia dal punto di vista dell'utilizzo delle magie che della loro composizione. Il bastone presenta una leggera lama sulla parte superiore e una punta nella parte inferiore, tali da renderlo un'arma offensiva se necessario 1d6+1d6 danni elementali a scelta. Il bastone, in base alla loro potenza, può apprendere 2 magie e lanciarle sotto comando del suo possessore, come se fossero lanciate dall'oggetto incantatore stesso ex tomo, catalizzatore, pergamena sacra e altri oggetti magici, non consumando slot(utilizzabile max 2 volte per riposo lungo). Tutti i tiri su intelligenza hanno un tiro bonus in caso di fallimento. + 1 Saggezza\r\n\r\n\r\n* MANTELLO DA INCANTATORE :  Il mantello è incantato da una magia di vestibilità, infatti qualsiasi tipo di utilizzatore esso abbia non necessiterà di farlo adattare alla propria corporatura dato che esso si adatterà in autonomia, questo artefatto magico conferisce un + 2 ad tutti i tiri su  intelligenza ed un + 150 ai trasportabili situati nella sacca interna della tunica(Il mantello presenta un incantesimo di protezione sulla tasca da trasporto così che solo il suo possessore possa realmente prendere gli oggetti e nessun altro che non abbia particolari capacità magiche). Il mantello presenta una particolare magia vitalizzante, esso non è che pare essere vivo, lo è a tutti gli effetti. Aiuterà il possessore in diversi modi, primo tra tutti combattendo la solitudine.\r\n\r\n\r\n* ANELLO DELLA SAPIENZA : Per  3  turni/ 3 ore, può essere utilizzato per accrescere l’intelligenza a 25(+7). Conferisce un bonus di + 1 su tutti i tiri rigardanti la caratteristica Intelligenza. Inoltre conferisce la capacità di memorizzare due ricordi in modo indelebile e di usarli nella maniera più utile possibile al suo possessore. \r\n\r\n\r\n\r\n\r\n* TOMO MULTIELEMENTALE (*)\r\n\r\n\r\n\r\n\r\n\t\r\n\r\n                                                                                                                \r\nINVENTARIO\r\n\tTotale massimo trasportabile 50P\r\n\t\r\n\r\n* OTRE. 4P\r\n\r\n\r\n* PICCOLO AMULETO ELEMENTALE. 1P\r\n\r\n\r\n* CARBONCINO/GESSETTO. 1P\r\n\r\n\r\n* CARTA : 1O Fogli. 1P\r\n\r\n\r\n* MAPPA SADARILL. 1P\r\n\r\n\r\n* MINIMERIDIANA. 1P\r\n\r\n\r\n* LIBRO SU MORGEDAL. 1P\r\n\r\n\r\n* ERBA MEDICA SUPERIORE : Erbe in grado di ristabilire 1d10 ad utilizzo, utilizzabili max due contemporaneamente (x4). 4P\r\n\r\n\r\n* BRACCIALE D’ORO : Bracciale avuto in dono da Tod, fedele compagno di Rodgard(il suo utilizzo è ancora sconosciuto). 1P\r\n\r\n\r\n* BOMBE : Esplosivi di forma sferica con innesto da circa 3sec, 1d10. (x3) 3P\r\n\r\n\r\n* TAVOLO DA COSTRUZIONE BASE : Un tavolo di piccolissime dimensioni ripiegabile su se stesso, dagli utilizzi limitati, che fornisce bonus sulla costruzione di oggetti o piccole forgiature. Utilizzi max 12, bonus +5. 4P\r\n\r\n\r\n* MAPPE VARIE. 1P\r\n\r\n\r\n* EPIDOTO. 2P\r\n\r\n\r\n* BROCHURE CRISTALLI. 1P\r\n\r\n\r\n* 11800 Monete. 11P\r\n\r\n\r\n\tTOT 37P/50P\r\n\t\r\n\r\n\r\n\r\n\r\n\r\nTASCA MAGICA\r\n\tTotale massimo trasportabile 150P\r\n\t* RUNA DELLA SFINGE : Particolare runa avuta da una sfinge in un labirinto in una piramide, dalle caratteristiche sconosciute, utilizzabile in alchimia, magia, o semplice baratto. 1P\r\n\r\n\r\n* INCHIOSTRO PROFONDO ACUTO : Permette di riprodurre uno dei 5 sensi su un foglio e riprodurlo come proprio (occhio,naso,bocca) 50ml 10 utilizzi; 2P\r\n\r\n\r\n* CATALIZZATORE DEL DESERTO : Il catalizzatore permette di lanciare qualsiasi tipo di incantesimo magico o alchemico senza nessun tipo di malus. Il catalizzatore inoltre, consente al possessore di utilizzare l’elemento della sabbia come meglio preferisce potendone modificare forma, spazio, etc.etc.. In più possiede l'abilità di chiudere in una bolla di sabbia il nemico per 2 turni CD16 con danni 1d6 a turno. All’inizio del combattimento se si brandisce questo oggetto magico si può evocare un dardo sabbioso senza utilizzare azioni o attacchi (4d6), tutti gli attacchi derivanti dalla natura elementale Sabbiosa (6d6) Quantità - 2 - 5P \r\n* ARTIGLI ORLUK : Artigli di animale feroce, mutato, delle terre di Sadarill, ritrovato sulla base del vulcano Zola, utilizzabile per alchimia forgiatura e creazione, estremamente taglienti. (x64) 16P\r\n\r\n\r\n* PERGAMENA DI NOGADRIM : TOMO DEL MINDCONTROL introduzioni dei Re di Nogadrim al Mindcontrol (2P):\r\n\r\n\r\n   * CONTROLLO MENTALE INFERIORE: consente di imporre un comando semplice ad un soggetto(solo umani o immondi), che abbia intelligenza non superiore a 14, il comando sarà imperativo e verrà eseguito proprio come descritto. CD 14\r\n   * CONTROLLO MENTALE SUPERIORE: impone la propria volontà, su esseri di qualsivoglia entità, con comandi semplici o complessi per un tot di 1d8 turni. CD 18\r\n   * DISTRASIX: Magia arcana che permette al mindcontroller di modificare il vissuto di un individuo, modificando ricordi, paure, conoscenze varie(riprogrammare un essere).CD 21\r\n   * ASSOLUZIONE: Il pg può decidere di porre mentalmente fine all’essere portandolo in uno stato catatonico da cui vi è impossibile riprendervi, lo stato di Assoluzione è irreversibile. CD 25\r\n   * (E’ possibile utilizzare una sola magia per scontro, ogni riposo lungo verranno debitamente ripristinate)\r\n\r\n\r\n* BECCO FENICE INVERNALE : Becco di animale feroce, mutato, delle terre di Sadarill, ritrovato sulla base del vulcano Zola, utilizzabile per alchimia forgiatura e creazione, apparentemente molto resistente e tagliente (x2). 1P\r\n* CORNA DI CHIMERA INFERNALE : Corna di animale feroce, mutato, delle terre di Sadarill, ritrovato sulla base del vulcano Zola, utilizzabile per alchimia forgiatura e creazione. apparentemente capaci di assorbire fuoco o lava (x2). 4P \r\n* TENDINI CHIMERA INFERNALE : Tendini di animale feroce, mutato, delle terre di Sadarill, ritrovato sulla base del vulcano Zola, utilizzabile per alchimia forgiatura e creazione, estremamente elastici e spessi (x11). 7P\r\n* BLOCCO DI FERRO : Utilizzabile per forgiatura e creazione.(x9) 9P\r\n\r\n\r\n* BLOCCO DI FERRO : Utilizzabile per forgiatura e creazione.(x5) 5P\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\tTOT 52P/150P\r\n\t\r\n\r\nABILITÀ  & TRUCCHETTI & INCANTESIMI\r\n\t\r\n\r\n\r\n\r\nINSERIMENTO SLOT PG\r\n\tIl PG potrà usufruire di diversi slot, suddivisi in livelli esclusivamente per abilità ATTIVE, il restante, verrà contrassegnato come TRUCCHETTO. I trucchetti avranno CD proprie ed avranno degli utilizzi limitati nell'arco della giornata (riposo lungo). I tiri delle abilità verranno effettuati esclusivamente su due Macro Categorie, MAGIA con CD 16 che scaleranno su INTELLIGENZA.\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nCARATTERISTICHE DI RAZZA\r\n\r\n\r\n\t* Il Giocatore essendo di natura anfibia può rimanere sott'acqua fino a 5 ore / turni + movimeto sott’acqua 20;\r\n* Intimidrie vs Animali + 8;\r\n* Un lizardfolk ha una pelle ricoperta da dure scaglie, quando non indossa alcun tipo di armatura la sua CA diventa 13 + mod. Destrezza. Se l'armatura che indossa lo porterebbe ad avere una CA minore di quella che avrebbe senza, può comunque utilizzare quella garantita dall'armatura naturale. I benefici dello scudo si aggiungono;\r\n\t\r\n\r\nINCANTATORE ARCANO SUPERIORE\r\nPASSIVA\r\n\r\n\r\n\r\n\r\n\t\r\n\r\nIl giocatore può lanciare due magie durante il proprio turno, a patto che una delle due non sia esclusivamente offensiva(dedita al solo danno nemico), ed ogni due turni, potrà lanciarne due di attacco.\r\n\t\r\n\r\nRECUPERO ARCANO MIGLIORATO\r\nTRUCCHETTO\r\n\tUna sola volta, durante il corrente riposo lungo il PG può recuperare a sua scelta uno dei seguenti slot(ma non durante il combattimento): \r\n* N.3 slot incantesimi lvl 1\r\n* N.3 slot incantesimi lvl 2\r\n* N.2 slot incantesimi lvl 3\r\n* N.2 slot incantesimi lvl 4\r\n* N.1 slot incantesimi lvl 5\r\n\t\r\n\r\n\r\n\r\nMORSO\r\nTRUCCHETTO\r\n\tIl PG può, grazie alla sua natura selvaggia ed indomabile :), compiere un’azione bonus, per azzannare il nemico, effettuando un tiro sulla sua CA, esattamente come se fosse un attacco. I punti ferita decurtati al nemico, verranno aggiunti a quelli del giocatore, nel caso in cui disponesse dei punti ferita massimi, quest’ultimi, si aggiungerebbero come temporanei fino alla fine del corrente riposo lungo. \r\n1d12 o 2d6+(sanguinamento nemico 3 turni 1D4 PF).\r\nQuantità      - 3 -\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nFURTO MAGICO\r\nABILITA’\r\n\tIl pg ha la possibilità di effettuare un tiro per assorbire slot incantesimi, da nemici che siano magici, immondi o benedetti in un'area di max 8 caselle. Avendo la possibilità di condividere il ricavato con i propri compagni. \r\nCon slot. lvl ½  = 1d4 decidere livello + 1d4 recupero slot(solo nel caso in cui entrambi i tiri dovessero esse critici, il PG potrebbe allora decidere di recuperare 1 solo slot di lvl 5)\r\nCon Slot lvl  ¾  = 1d6 decidere livello + 1d6 recupero slot(nel caso di critico su entrambi i dadi, avrebbe uno slot 6 temporaneo fino alla fine del corrente riposo lungo)\r\n\t\r\n\r\n\r\n\r\n\r\n\r\nPRISMA DEL TRASMUTATORE\r\nABILITA’\r\n\tIl giocatore può creare grazia alle sue conoscenze magiche, un prisma con diversi poteri.\r\n* se infuso in un arma dona poteri aggiuntivi elementali all’arma;\r\n* se utilizzato come oggetto può essere trasformato in un utilizzabile es(dal tomo dell’acqua prende onda grande e la infonde in una gemma che dopo essere stata utilizzata viene distrutta)\r\n*  può essere utilizzata per canalizzare magie di altri giocatori(es imposizione di mani, per poter recuperare altri pf)\r\n* le gemme hanno poteri non conosciuti che il pg può provare a scovare\r\nIn base ai lvl di slot impiegati la forza e durata dei prismi muterà.\r\n(limite prismi a riposo lungo 4)\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n   VELO DEL MAGO\r\nABILITA’\r\n\tIl mago evoca un campo di forza protettivo che può assorbire danni e rilasciare un contrattacco magico. Quando il mago subisce danno, può attivare il velo, assorbendo parte dei danmi 1d12 o 2d6. Successivamente il mago può scegliere uno dei seguenti effetti (Il velo appare come un bagliore evanescente che risulterà avere come forma una cupola attaccata al suolo):\r\n* Velo Protettivo: Ottiene +2 alla CA fino a quando non cambierà posizione, gli incantesimi avranno la possibilità di attraversare la barriera, durata tutto lo scontro. Se usata più volte durante lo scontro il precedente scudo svanirà, se si dovesse scegliere un effetto differente allora rimarrebbe attiva.\r\n* Velo Riflesso: L’energia assorbita viene rilasciata sotto forma di una scarica magica, infliggendo danni  a un nemico  a scelta entro 9 caselle, lo stesso potrebbe passare 1 turno in stato confusionale TS 16 Saggezza. \r\n* Velo Caricante: L’energia viene convertita in azione bonus durante il prossimo turno\r\n* Velo Devastante: L’effetto permette di lanciare una qualsiasi magia di slot 1/2 gratis o 3/4/5 slot a consumo anche offensiva.\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nRAGGIO GELIDO\r\nINCANTESIMO\r\n\r\n\r\n\tUn raggio gelido di luce azzurra e biancastra sfreccia verso una creatura entro gittata. L'incantatore effettua un attacco a distanza con questo incantesimo contro il bersaglio, con possibilità di congelare l’avversario. \r\n* Lvl 1 : Danni 1d6, Distanza 6 caselle, 2 Danni x 1 turno;\r\n* Lvl 2 : Danni 2d6, Distanza 8 caselle, 2 Danni x 2 turni;\r\n* Lvl 3 : Danni 3d6, Distanza 10 caselle, 2 Danni x 3 turni;\r\n* Lvl 4 : Danni 5d6, Distanza 15 caselle, 2 Danni x 4 turni, il colpo potrebbe congelare il nemico;\r\n* Lvl 5 : Danni 7d6, Distanza 20 caselle, 3 Danni x 4 turni, il colpo ha alte probabilità di congelare il nemico;\r\n\t\r\n\r\n\r\n\r\nCOLTELLI ACIDI\r\nINCANTESIMO\r\n\r\n\r\n\tEvoca dei coltelli volanti intrisi di acido che colpiscono il nemico con danni altamente corrosivi. (6h) \r\n* Lvl 1 : Danni 1d4, distanza massima 4 caselle, 1 turno 2 pf danni corrosivi;\r\n* Lvl 2 : Danni 2d4, distanza massima 6 caselle, 2 turni 1d4  danni corrosivi;\r\n* Lvl 3 : Danni 2d6, distanza massima 6 caselle, 3 turni 1d4  danni corrosivi;\r\n* Lvl 4 : Danni 3d6, distanza massima 6 caselle, 3 turni 1d4  danni corrosivi;\r\n* Lvl 5 :  Danni 6d6, distanza massima 15 caselle, 5 turni 1d4  danni corrosivi;\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nMINOR ILLUSIO\r\nINCANTESIMO\r\n\r\n\r\n\tL'incantatore crea un suono o un'immagine di un oggetto entro gittata che permane per la durata dell'incantesimo. L'illusione termina anche se l'incantatore la interrompe con un'azione o se lancia questo incantesimo di nuovo. Se l'incantatore crea un suono, il suo volume può variare da un sussurro a un urlo. Può trattarsi di un qualsiasi suono a sua scelta. Può echeggiare ininterrottamente per tutta la durata, oppure l'incantatore può emettere suoni più discreti in momenti diversi prima che l'incantesimo termini. L'immagine non può emettere suoni, luci, odori o qualsiasi altro effetto sensoriale. Un'interazione fisica con l'immagine rivela che si tratta di un'illusione, in quanto gli oggetti la attraversano. Se una creatura discerne l'illusione per ciò che è, l'illusione si attenua per quella creatura. \r\n* Lvl 1 : Dimensioni oggetto PICCOLA, Suono max 4 caselle, Durata 2 turni;\r\n* Lvl 2 : Dimensioni oggetto PICCOLA, Suono max 6 caselle, Durata 4 turni;\r\n* Lvl 3 : Dimensioni oggetto MEDIA, Suono max 8 caselle, Durata 6 turni;\r\n* Lvl 4 : Dimensioni oggetto MEDIA, Suono max 10 caselle, Durata 8 turni;\r\n* Lvl 5 : Dimensioni oggetto GRANDE, Suono max 15 caselle, Durata 12 turni;\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nMANO MAGICA\r\nINCANTESIMO\r\n\r\n\r\n\r\n\r\n\tUna mano spettrale fluttuante appare in un punto a scelta dell'incantatore situato entro gittata. La mano permane per la durata dell'incantesimo o finché l'incantatore non la congeda con un'azione. La mano svanisce se quest'ultimo lancia di nuovo questo incantesimo. L'incantatore può usare la sua azione per controllare la mano. Può usarla per maneggiare un oggetto, aprire una porta o tutte le funzioni che farebbe una mano comune, non può attaccare.\r\n* Lvl 1 : Distanza 4 caselle durata 2 Turni, Sollevamento max 2Kg.\r\n* Lvl 2 : Distanza 6 caselle durata 3 Turni, Sollevamento max 4Kg. \r\n* Lvl 3 : Distanza 8 caselle durata 4 Turni, Sollevamento max 5Kg.\r\n* Lvl 4 : Distanza 10 caselle durata 6 Turni, Sollevamento max 8Kg.\r\n* Lvl 5 : Distanza 15 caselle durata 8 Turni, Sollevamento max 15Kg. (Una sola volta a scontro può lanciare incantesimi che richiedano l’utilizzo delle mani.)\r\n\t\r\n\r\n\r\n\r\nSTRETTA FOLGORANTE\r\nINCANTESIMO\r\n\r\n\r\n\tUn fulmine si sprigiona dalla mano dell'incantatore per trasmettere una scarica folgorante a una creatura da lui toccata. L'incantatore effettua un attacco in mischia con questo incantesimo contro il bersaglio. Se il bersaglio indossa un'armatura fatta di metallo l'incantatore dispone di un vantaggio di 1d6. \r\n* Lvl 1 :  Danni 1d8 \r\n* Lvl 2 :  Danni 1d10+1d6\r\n* Lvl 3 :  Danni 1d20+1d4\r\n* Lvl 4 :  Danni 1d20+1d10+2\r\n* Lvl 5 :  Danni 2d20+2, con possibilità di scagliare il fulmine anche a distanza max 15 caselle.\r\n\t\r\n\r\n\r\n\r\nIRRIDIO AURA\r\nINCANTESIMO\r\n\tPermette di evocare, delle luci di piccolissima entità che con il loro movimento ondulare, avvolgono l'obiettivo richiesto dall’incantatore, mantenendo un moto ellittico perpetuo.\r\n* Lvl 1 : Durata 2 turni, applicabile solo a piccole entità o esseri di piccola costituzione. (Applicabile su +1 casella in combattimento)\r\n* Lvl 2 : Durata 4 turni, applicabile solo a piccole entità o esseri di piccola costituzione. (+2 casella in combattimento)\r\n* Lvl 3 : Durata 6 turni, applicabile a medie entità o esseri di media costituzione. (+4 casella in combattimento)\r\n* Lvl 4 : Durata 8 turni, applicabile a medie entità o esseri di media costituzione. (+6 casella in combattimento)\r\n* Lvl 5 : Durata 12 turni, applicabile a grandi entità o esseri di grande costituzione. (+10 casella in combattimento)\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nABILITÀ\r\nTRUCCHETTO\r\nINCANTESIMO\r\n\t\r\n\r\n\t\r\n\r\n\t\r\n\r\n\t\r\n\r\n\t\r\n\r\n\t\r\n\r\nTOMO MULTIELEMENTALE\r\n\t____________________________________________________________________________________________Elemento FUOCO____________________________________________________________________________________________ \r\n- Durante l’utilizzo di questo elemento, le mani del PG vengono avvolte dal fuoco, pertanto ogni turno avrà un'azione bonus per lanciare una palla di fuoco 1d6/Distanza max 12. Danni  7d6(nel caso ci dovessero essere attacchi ad area, il PG ha la facoltà di dividere i dadi in base all’attacco). Tutti gli attacchi di questa natura elementale, causano danni incendiari 1d4 PF x 3 turni(se un nemico dovesse essere già sotto l’effetto di questo malus, non ne accumulerebbe un secondo, solo terminato il terzo turno si potrebbe ritornare nuovamente a decurtare i PF). Possibilità di evocare armi elementali o infonderne già esistenti;\r\n- Elementale di 1° livello passando 1 turno in Evocazione(concentrazione), in caso di attacco nemico o perdita di concentrazione il tiro fallirebbe; \r\n  # Danni 3d6+2/Spostamento 9/CA 15/PF 50; Abilità: Attacchi a Distanza 2d6+2. *(Si possono lanciare solo incantesimi offensivi di LVL 1-2-3 )*\r\n- Elementale di 1° livello SUPERIORE [MAGMA](creato dall’unione con evocazioni di LUX); \r\n  # Danni 7d6+2/Spostamento 12/CA 16/PF 70; Abilità: Eruzione Vulcanica, il corpo dell’elementale ha la facoltà di sparare dal proprio corpo meteoriti di magma che andranno a colpire il nemico nell’arco di 30 caselle(attacco a distanza, stile mortaio). *(Si possono lanciare solo incantesimi offensivi di LVL 1-2-3 )* Quantità -  2 -  (Per tutti i tipi di incantesimi lanciati da questo elemento esclusi attacchi base)\r\n____________________________________________________________________________________________Elemento ACQUA____________________________________________________________________________________________ \r\n- Durante l’utilizzo di questo elemento, il PG aumenta la sua capacità di movimento di + 5, potendo scivolare sul terreno come se surfasse. Danni 6d6; Ogni due turni il Pg crea automaticamente una bolla d’acqua fluttuante, di piccole dimensioni, da poter posizionare sul campo di battaglia, la sopracitata a contatto con il nemico, causerà 1d8 danni esplosivi(le bolle non possono essere posizionate sul nemico come un attacco, ma nelle loro adiacenze come trappole o altro). Possibilità di evocare armi elementali o infonderne già esistenti;\r\n- Elementale di 1° livello passando 1 turno in Evocazione(concentrazione); \r\n   # Danni 2d6+2/Spostamento 12/CA 16/PF 40; Abilità: Possibilità, durante il turno nemico, di compiere un tiro contrapposto al tiro per colpire, per parare o schivare l’eventuale attacco. **\r\n- Elementale di 1° livello SUPERIORE [GHIACCIO]; \r\n   # Danni 6d6+2/Spostamento 17/CA 17/PF 60; Abilità: Congelamento Istantaneo, una volta a scontro può utilizzare un raggio che congelerebbe il nemico istantaneamente. TS nemico 18/Distanza 15/Danni 10d6(in caso di non riuscita del congelamento). Quantità -  2 - (Per tutti i tipi di incantesimi lanciati da questo elemento esclusi attacchi base)\r\n______________________________________________________________________________________________Elemento ARIA_______________________________________________________________________________________________ \r\n- Durante l’utilizzo di questo elemento, il PG viene avvolto da un'aura protettiva di vento, che come un turbine gli ruota intorno, limitando gli spostamenti nemici e i rispettivi attacchi(i nemici una volta entrati nell’area interessata dovranno superare un TS di 16 per poter mantenere l’equilibrio ed avranno un in ogni caso un -2 ai Tiri per colpire). Danni 6d6+2; Il PG ogni turno può compiere un’azione bonus per utilizzare l’aria del tomo per spostare oggetti o altro, facendoli levitare se necessario, con un massimo di 12 caselle, oppure scegliere di levitare lui stesso fino ad un massimo di 2 metri da terra, non sfruttando spostamento; Possibilità di evocare armi elementali o infonderne già esistenti;\r\n- Elementale di 1° livello passando 1 turno in Evocazione(concentrazione); \r\n   # Danni 2d6+1d4/Spostamento 20/CA 17/PF 30; Abilità: Possibilità di avvolgere il nemico per prenderne il possesso, nel caso dovesse essere troppo potente, di bloccarlo semplicemente TS nemico 16. **\r\n- Elementale di 1° livello SUPERIORE [CUMULONEMBO ELETTRICO]; \r\n   # Danni 6d6+4/Spostamento 30/CA 18/PF 50; Abilità: Raggio Folgorante, l’elementale ha la capacità di levitare in cielo a tal punto da trasformarsi in un vero e proprio cumulonembo, pertanto in questa forma l’elementale avrà stesso spostamento ma danni 8d6(con alta probabilità di folgorare o paralizzare il nemico). Quantità -  2 -  (Per tutti i tipi di incantesimi lanciati da questo elemento esclusi attacchi base)\r\n___________________________________________________________________________
