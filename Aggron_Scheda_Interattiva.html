/* Riduce automaticamente la dimensione del font del nome personaggio se troppo lungo per stare
   su una riga, cos\u00ec da non farlo tagliare/scomparire su nomi lunghi (es. nome completo esteso). */
function fitNameToWidth(el){
  if (!el) return;
  const maxPx = 64, minPx = 18;
  el.style.letterSpacing = "2px";
  el.style.fontSize = maxPx + "px";
  let size = maxPx;
  let guard = 0;
  while (el.scrollWidth > el.clientWidth && size > minPx && guard < 60){
    size -= 1;
    el.style.fontSize = size + "px";
    guard++;
  }
  // Se anche alla dimensione minima il testo non entra, riduce progressivamente la spaziatura
  // tra le lettere prima di lasciare che l'ultimo carattere venga tagliato.
  let spacing = 2;
  guard = 0;
  while (el.scrollWidth > el.clientWidth && spacing > -0.5 && guard < 30){
    spacing -= 0.1;
    el.style.letterSpacing = spacing.toFixed(1) + "px";
    guard++;
  }
}

function initGoogleButton(){
  const btn = document.getElementById("btn-google");
  const loadBtn = document.getElementById("btn-google-load");
  const statusEl = document.getElementById("google-status");
  if (!btn) return;
  if (!googleConfigured()){
    btn.title = "Non ancora configurato su questa pagina";
    btn.style.opacity = "0.55";
    if (loadBtn){ loadBtn.style.opacity = "0.55"; loadBtn.title = "Non ancora configurato su questa pagina"; }
    return;
  }
  initGoogleAuth();

  // Se l'accesso con Google è già stato eseguito in questa stessa scheda del
  // browser (es. dalla Home, o da un'altra scheda personaggio), recupera subito
  // il token invece di richiedere di nuovo l'accesso.
  if (!googleAccessToken){
    const restored = loadGoogleTokenFromSession();
    if (restored){
      googleAccessToken = restored;
      onGoogleSignedIn();
    }
  }

  // Se questo browser ha già usato Google Drive per questo personaggio almeno
  // una volta (in qualunque sessione precedente), prova un accesso automatico e
  // silenzioso (senza popup) prima di mostrare il solo pulsante manuale: se la
  // sessione Google è ancora attiva nel browser, l'accesso si ripristina da solo.
  if (!googleAccessToken){
    try{
      if (localStorage.getItem(GOOGLE_EVER_CONNECTED_KEY) === "1"){
        tryGoogleSilentReauth();
      }
    }catch(e){}
  }

  // Il collegamento a Google non resta attivo da una apertura di pagina all'altra
  // (per sicurezza, va rifatto ogni volta, salvo il recupero automatico sopra). Se
  // questo browser ha già un salvataggio Drive per questo personaggio, lo segnaliamo
  // qui: altrimenti sembra che le modifiche siano andate perse, quando in realtà
  // vanno solo recuperate premendo di nuovo "Accedi con Google".
  if (!googleAccessToken && statusEl){
    try{
      if (localStorage.getItem(driveStorageKey())){
        statusEl.textContent = "\u2601\ufe0f Salvataggio Drive trovato per questo personaggio \u2014 premi \u201cAccedi con Google\u201d per recuperarlo";
        statusEl.style.color = "var(--gold-bright)";
      }
    }catch(e){}
  }

  btn.addEventListener("click", ()=> signInGoogle(googleAccessToken ? "" : "consent"));
  if (loadBtn) loadBtn.addEventListener("click", ()=>{
    if (!googleAccessToken){ window.alert("Accedi prima con Google."); return; }
    driveLoad();
  });

  const pickerBtn = document.getElementById("btn-google-picker");
  if (pickerBtn){
    if (!GOOGLE_PICKER_API_KEY){
      pickerBtn.style.opacity = "0.55";
      pickerBtn.title = "Non ancora configurato su questa pagina (manca la Chiave API della Picker API)";
    }
    pickerBtn.addEventListener("click", ()=>{
      if (!googleAccessToken){ window.alert("Accedi prima con Google."); return; }
      if (!GOOGLE_PICKER_API_KEY){ window.alert("La selezione di file condivisi non è ancora configurata su questa pagina."); return; }
      openDrivePicker();
    });
  }

  // Suggerimento per il Master: quale file cercare su Drive per condividerlo
  // con il giocatore (il file va condiviso dall'interfaccia di Google Drive
  // stessa: qui mostriamo solo il nome da cercare).
  const shareHintEl = document.getElementById("google-share-hint");
  if (shareHintEl && typeof isMasterUnlocked === "function" && isMasterUnlocked()){
    shareHintEl.textContent = "Master: per condividere, cerca su Drive “" + suggestedFileName() + "” e condividilo con il giocatore.";
  }
}

function openDrivePicker(){
  function showPicker(){
    const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
      .setMimeTypes("application/json")
      .setIncludeFolders(false);
    const picker = new google.picker.PickerBuilder()
      .setOAuthToken(googleAccessToken)
      .setDeveloperKey(GOOGLE_PICKER_API_KEY)
      // Necessario per selezionare correttamente file "Condivisi con me" (non
      // creati da questa app) sotto lo scope drive.file: senza l'App ID, Drive
      // può negare l'accesso al file scelto anche se il selettore lo mostra
      // (l'errore tipico è "File not found" nonostante il file esista davvero).
      // Il Project Number è il segmento numerico prima del primo "-" nel Client ID.
      .setAppId(GOOGLE_CLIENT_ID.split("-")[0])
      .addView(view)
      .setCallback(onDrivePicked)
      .build();
    picker.setVisible(true);
  }
  if (window.gapi && window.gapi.picker){ showPicker(); return; }
  if (!window.gapi){ window.alert("La libreria di Google non è ancora pronta, riprova tra un istante."); return; }
  gapi.load("picker", { callback: showPicker });
}

async function onDrivePicked(data){
  if (!data || data.action !== google.picker.Action.PICKED) return;
  const doc = data.docs && data.docs[0];
  if (!doc || !doc.id) return;

  // Non colleghiamo subito la scheda al file scelto: prima verifichiamo che
  // si riesca davvero a leggerlo con questo account (es. non più condiviso,
  // spostato nel cestino, o scelto con l'account sbagliato). Se il caricamento
  // fallisce, torniamo al collegamento precedente invece di restare bloccati
  // su un id che farebbe fallire anche tutti i salvataggi automatici successivi.
  const previousFileId = driveFileId;
  driveFileId = doc.id;
  driveFileIdKey = driveStorageKey();
  setStatus("File collegato: " + (doc.name || "senza nome") + " — caricamento…");

  const ok = await driveLoad();
  if (ok){
    try{ localStorage.setItem(driveFileIdKey, driveFileId); }catch(e){}
    updateGoogleStatus();
  } else {
    driveFileId = previousFileId;
    setStatus("Collegamento al file condiviso non riuscito — controlla che sia stato condiviso con questo account Google, poi riprova.");
  }
}

/* ============================================================
   BACKUP — esporta / importa
   ============================================================ */
function initSavebarToggle(){
  const bar = document.getElementById("savebar");
  const btn = document.getElementById("savebar-toggle");
  if (!bar || !btn) return;
  function updateLabel(){
    const collapsed = bar.classList.contains("collapsed");
    btn.textContent = collapsed ? "⚙ Opzioni scheda" : "✕ Chiudi opzioni";
    btn.title = collapsed ? "Mostra il pannello Opzioni scheda" : "Nascondi il pannello Opzioni scheda";
  }
  updateLabel();
  btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    bar.classList.toggle("collapsed");
    updateLabel();
  });
}

function initBackupButtons(){
  const exportBtn = document.getElementById("btn-export");
  const importBtn = document.getElementById("btn-import");
  const importInput = document.getElementById("import-input");
  if (!exportBtn || !importBtn || !importInput) return;

  exportBtn.addEventListener("click", ()=>{
    const json = JSON.stringify(STATE, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (STATE.nome || "personaggio").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "personaggio";
    const today = new Date();
    const stamp = today.getFullYear() + String(today.getMonth()+1).padStart(2,"0") + String(today.getDate()).padStart(2,"0");
    a.href = url;
    a.download = `scheda-${safeName}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    setStatus("Backup scaricato");
  });

  importBtn.addEventListener("click", ()=> importInput.click());
  importInput.addEventListener("change", ()=>{
    const f = importInput.files && importInput.files[0];
    importInput.value = "";
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ window.alert("Il file scelto non \u00e8 un backup valido."); return; }
      const ok = window.confirm("Ripristinare la scheda da questo file di backup?\nLa scheda attuale verr\u00e0 sostituita.");
      if (!ok) return;
      STATE = deepMerge(BLANK_STATE, parsed);
      renderAll();
      queueSave();
      setStatus("Backup importato");
    };
    reader.onerror = ()=> window.alert("Non sono riuscito a leggere il file.");
    reader.readAsText(f);
  });
}

function esc(s){
  return String(s===undefined||s===null?"":s)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

function bindSimpleInputs(){

    inp.readOnly = false;

      queueSave();

  });
  document.querySelectorAll('[data-key-num]').forEach(inp=>{
    inp.readOnly = false;
    inp.oninput = ()=>{ STATE[inp.dataset.keyNum] = parseFloat(inp.value||"0"); queueSave(); };

const IDENTITY_CHIP_FIELDS = [
  { key:"classe", label:"Classe e Livello" },
  { key:"razza", label:"Razza" },
  { key:"background", label:"Background" },
  { key:"allineamento", label:"Allineamento" },

];
/* Blocco 1: mostra tutti e 6 i campi Identità compilati (non solo i 3 di
   prima), ciascuno con una micro-etichetta sopra il valore; un campo vuoto
   non lascia né etichetta né spazio vuoto — il layout si ricompone.

  const box = document.getElementById("hero-meta");

  const chips = IDENTITY_CHIP_FIELDS
    .filter(f => (STATE[f.key] || "").toString().trim() !== "")

    .join("");
  const tipoChip = `<div class="hero-chip hero-chip-tipo"><span class="tipo-label">TIPO: </span><b data-key-text="tipo">${esc(STATE.tipo)}</b></div>`;
  box.innerHTML = chips + tipoChip;
}

/* ============================================================
   ACCESSO PROTETTO DA PASSWORD
   Le password non sono salvate in chiaro: qui \u00e8 salvata solo la
   loro "impronta" (hash SHA-256), che non pu\u00f2 essere riletta al
   contrario. \u00c8 comunque una protezione leggera pensata per un
   gruppo privato, non una sicurezza a prova di esperto: chi
   analizzasse a fondo il codice sorgente potrebbe in teoria
   provare a indovinare la password offline.
   ============================================================ */
const CHAR_SLUG = "aggron";
const CHAR_PASSWORD_HASH = "628532fd048c3f94900aa04ed880747782a29ae4eac26949d7a88e2557a6d73b";
const MASTER_PASSWORD_HASH = "c95488e91dbb746dde809ac9806bdcadb59f72c0dbd89f3440aa4f3e3e25688a";
const LOCK_SESSION_KEY = "morgedal-unlocked::" + CHAR_SLUG;

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

const MASTER_UNLOCK_KEY = "morgedal-master-unlocked";
/* Migrazione: lo sblocco Master vive ora in sessionStorage, non pi\u00f9 in
   localStorage, cos\u00ec resta attivo per tutta la sessione/tab di navigazione
   (Home -> scheda -> Home -> altra scheda) ma NON sopravvive alla chiusura del
   browser / a una nuova sessione. Rimuove anche l'eventuale vecchia chiave
   legacy rimasta in localStorage da versioni precedenti del sito. */
try{ localStorage.removeItem(MASTER_UNLOCK_KEY); }catch(e){}

function isMasterUnlocked(){
  try{ return sessionStorage.getItem(MASTER_UNLOCK_KEY) === "1"; }catch(e){ return false; }
}
function markMasterUnlocked(){
  try{ sessionStorage.setItem(MASTER_UNLOCK_KEY, "1"); }catch(e){}
}

function isUnlockedThisSession(){
  try{ return sessionStorage.getItem(LOCK_SESSION_KEY) === "1"; }catch(e){ return false; }
}
function markUnlocked(){
  try{ sessionStorage.setItem(LOCK_SESSION_KEY, "1"); }catch(e){}
}

function hideLockScreen(){
  const el = document.getElementById("lock-screen");
  if (el) el.style.display = "none";
}

async function attemptUnlock(){
  const input = document.getElementById("lock-input");
  const errorEl = document.getElementById("lock-error");
  const pw = input ? input.value : "";
  if (!pw){ if (errorEl) errorEl.textContent = "Inserisci una password."; return; }
  const hash = await sha256Hex(pw);
  if (hash === MASTER_PASSWORD_HASH){
    // La password Master sblocca questa scheda e TUTTE le altre
    // schede del gruppo (stesso sito), senza richiederla di nuovo.
    markMasterUnlocked();
    markUnlocked();
    setMasterEditorOn(true); // login Master -> Editor Master ON di default
    hideLockScreen();
    init();
  } else if (hash === CHAR_PASSWORD_HASH){
    markUnlocked();
    hideLockScreen();
    init();
  } else {
    if (errorEl) errorEl.textContent = "Password errata, riprova.";
    if (input){ input.value = ""; input.focus(); }
  }
}

async function googleAccountCanBypassPassword(){
  const token = loadGoogleTokenFromSession();
  if (!token) return false;
  try{
    const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
      headers: { Authorization: "Bearer " + token }
    });
    if (!res.ok) return false;
    const info = await res.json();
    const email = String(info && info.email || "").toLowerCase();
    if (!email) return false;
    // Il proprietario/Master entra in tutte le schede senza password, ma
    // l'Editor Master resta OFF finché non viene attivato manualmente.
    if (email === GOOGLE_OWNER_EMAIL.toLowerCase()){
      markMasterUnlocked();
      return true;
    }
    // Il giocatore può entrare senza password soltanto nella propria scheda.
    if (GOOGLE_PLAYER_EMAIL && email === GOOGLE_PLAYER_EMAIL.toLowerCase()) return true;
    return false;
  }catch(e){ return false; }
}

async function initLock(){
  // Accesso obbligatorio con account Google autorizzato.
  if (await googleAccountCanBypassPassword()){
    setMasterEditorOn(false);
    hideLockScreen();
    init();
    return;
  }

  // Apertura diretta senza sessione Google valida: torna alla Home,
  // dove il login parte automaticamente e il giocatore viene inviato
  // alla propria scheda in base all'indirizzo email.
  window.location.replace("index.html");
}
