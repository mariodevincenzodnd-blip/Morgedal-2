  passive: [
    {nome:"Presenza Primordiale", tag:"Passiva", desc:"La corporatura di Aggron, la sua altezza e la sua massa lo rendono una presenza naturalmente imponente, capace di incutere soggezione ancora prima che compia qualsiasi gesto ostile. Creature di taglia Piccola o Media, possono essere costrette a superare un Tiro Salvezza contro Intimidazione prima di affrontarlo direttamente. Un fallimento pu\u00f2 tradursi in esitazione, timore o nella difficolt\u00e0 di avvicinarsi immediatamente ad Aggron. L'effetto non rappresenta una tecnica volontaria: deriva semplicemente dalla percezione istintiva di trovarsi davanti a qualcosa di fisicamente molto pi\u00f9 grande e pericoloso. Questa reazione dovrebbe risultare ancora pi\u00f9 naturale negli animali di taglia Piccola o Media, capaci di percepire immediatamente la differenza di stazza e il potenziale pericolo rappresentato da Aggron. Nel suo caso, tuttavia, questo istinto entra in contrasto con un fenomeno che lo accompagna da gran parte della sua esistenza: la natura sembra riconoscerlo e accettarlo. Nonostante il suo aspetto, gli animali tendono raramente a considerarlo una minaccia senza motivo e, in condizioni normali, possono mostrarsi insolitamente tranquilli, curiosi o persino disponibili nei suoi confronti. Anche gli ambienti naturali sembrano aver sempre accolto la sua presenza con una particolare familiarit\u00e0, come se qualcosa appartenente alla natura stessa, forse riconducibile all'influenza di Ignis, Yggdrasil o a un principio che Aggron non \u00e8 mai riuscito a comprendere pienamente, lo riconoscesse come parte del proprio equilibrio. Di conseguenza, il Tiro Salvezza legato alla sua imponenza pu\u00f2 essere particolarmente severo per gli animali quando questi sono realmente costretti a considerarlo una minaccia, ma nella maggior parte degli incontri naturali tale prova non diventa nemmeno necessaria, poich\u00e9 gli animali tendono spontaneamente a tollerare o accettare la presenza di Aggron. In tutti i casi se i TS dovessero fallire, i nemici guadagnerebbero dei malus ai TpC."},
    {nome:"Pelle Dura", tag:"Passiva", desc:"Aggron non indossa alcun tipo di armatura. La sua enorme corporatura, la densit\u00e0 della muscolatura e soprattutto lo spessore naturale della pelle degli Ogre gli garantiscono tuttavia una protezione fisica considerevole, permettendogli di affrontare colpi che per creature di costituzione pi\u00f9 comune richiederebbero necessariamente una vera corazza. La sua Classe Armatura viene quindi calcolata senza necessit\u00e0 di equipaggiamento difensivo, tenendo conto della sua naturale capacit\u00e0 di assorbire e sopportare gli impatti. Alla normale componente derivante dalla Destrezza e dalla Costituzione viene applicato un bonus razziale fisso, rappresentativo della particolare robustezza del corpo di Aggron. Questa protezione non deriva da un indurimento volontario della pelle n\u00e9 da una trasformazione temporanea: Aggron non deve attivarla, concentrarsi o spendere alcuna risorsa. \u00c8 semplicemente la naturale resistenza di un Ogre della sua stazza e rimane quindi costantemente attiva fintanto che non indossa un'armatura che ne sostituisca il normale calcolo difensivo. (+4 CA)"},
    {nome:"Dualit\u00e0 Bicefala", tag:"Passiva", desc:"Aggron possiede due teste, ma soprattutto due coscienze completamente distinte che condividono lo stesso corpo. Ognuna pensa, osserva, ricorda e interpreta ci\u00f2 che accade in maniera autonoma; ci\u00f2 che viene vissuto direttamente da una delle due non viene necessariamente acquisito anche dall'altra. Questa indipendenza rimane evidente persino durante il riposo. Le due teste possono infatti dormire separatamente, permettendo a una di rimanere sveglia mentre l'altra riposa. In questo modo Aggron pu\u00f2 continuare a sorvegliare l'ambiente, osservare ci\u00f2 che accade o svolgere semplici attivit\u00e0 senza interrompere completamente il proprio riposo. Al risveglio, tuttavia, la testa che ha dormito non conosce automaticamente ci\u00f2 che \u00e8 accaduto durante quel periodo e deve farselo raccontare dal proprio \u201cfratello\u201d. La stessa separazione mentale continua a esistere durante il combattimento. Sebbene una delle due teste assuma il controllo principale del corpo, l'altra non diventa completamente passiva e conserva un piccolo margine di autonomia. Per questo motivo, oltre alla normale azione della testa dominante, Aggron dispone una volta per turno di una Azione del Fratello, considerata come Azione Bonus, attraverso la quale la testa non dominante pu\u00f2 compiere un intervento limitato che non richieda il controllo completo del corpo. Quando il controllo appartiene alla testa istintiva, quella intelligente pu\u00f2 sfruttare questo margine per intervenire attraverso capacit\u00e0 di supporto relativamente semplici, come potenziare Aggron, indebolire un avversario o utilizzare manifestazioni e incantesimi fino a un massimo equivalente al 3\u00b0 livello. Quando invece il controllo appartiene alla testa intelligente, quella istintiva pu\u00f2 utilizzare una mano libera per interagire con uno dei propri strumenti improvvisati, lanciare un oggetto, utilizzare un piccolo diversivo, predisporre una semplice trappola o compiere un'altra azione compatibile con il limitato controllo di una parte del corpo."}
  ],

  abilita: [],
  incantesimo: [],
  divergenzaIntro: "Ogni fenomeno tende naturalmente verso un decorso atteso, seguendo una successione di cause, probabilit\u00e0 e conseguenze. In Aggron esiste tuttavia un potere innato capace di interferire con questo equilibrio, producendo quella che la testa pi\u00f9 intelligente ha imparato a definire <b>Divergenza</b>: un'alterazione anomala del normale corso degli eventi, attraverso la quale ci\u00f2 che dovrebbe accadere pu\u00f2 deviare verso un esito differente, improbabile o completamente inatteso. La Divergenza non rappresenta una forma tradizionale di magia e Aggron stesso non ne conosce realmente l'origine. Essa sembra appartenere alla sua natura e lo accompagna indipendentemente dalla sua volont\u00e0, manifestandosi attraverso coincidenze, deviazioni, concatenazioni improbabili ed eventi che sembrano alterare continuamente il rapporto tra caso, probabilit\u00e0 e conseguenza. Nel corso dei millenni la testa pi\u00f9 intelligente ha osservato queste anomalie e ha tentato di comprenderne il funzionamento, arrivando progressivamente a riconoscere alcuni degli ambiti nei quali la Divergenza sembra manifestarsi con maggiore frequenza. Questi non rappresentano differenti forme di magia n\u00e9 costituiscono necessariamente tutti i modi attraverso i quali la Divergenza pu\u00f2 agire: sono semplicemente i principali fenomeni che Aggron \u00e8 riuscito, fino ad oggi, a distinguere e classificare.",
  ambiti: [
    ["Probabilit\u00e0","La Divergenza pu\u00f2 modificare la possibilit\u00e0 che un determinato evento si verifichi. Qualcosa di estremamente improbabile pu\u00f2 improvvisamente accadere, mentre un evento apparentemente quasi certo pu\u00f2 non verificarsi affatto. Una coincidenza impossibile, un errore nel momento esatto o una possibilit\u00e0 infinitesimale possono quindi assumere improvvisamente un peso reale nel corso degli eventi."],
    ["Causalit\u00e0","La Divergenza pu\u00f2 alterare il normale rapporto tra una causa e le sue conseguenze. Un'azione apparentemente insignificante pu\u00f2 generare una successione di eventi completamente sproporzionata, oppure una concatenazione di circostanze pu\u00f2 condurre a un risultato che nessuno avrebbe potuto ragionevolmente prevedere. La causa rimane reale, cos\u00ec come le conseguenze, ma il percorso che le collega pu\u00f2 assumere forme anomale e imprevedibili."],
    ["Tempismo","La Divergenza pu\u00f2 influenzare il momento esatto nel quale qualcosa accade, senza rappresentare una vera manipolazione del tempo. Un evento pu\u00f2 verificarsi un istante prima o dopo rispetto a quanto sarebbe stato naturale, una struttura pu\u00f2 cedere proprio quando qualcuno vi passa accanto, una persona pu\u00f2 voltarsi nel momento esatto in cui qualcosa sta per accadere o un fenomeno pu\u00f2 manifestarsi nella precisa frazione di tempo capace di modificarne completamente le conseguenze."],
    ["Deviazione","La Divergenza pu\u00f2 modificare il corso, la direzione o la destinazione di qualcosa che \u00e8 gi\u00e0 in movimento o che sta gi\u00e0 avvenendo. Un proiettile pu\u00f2 cambiare traiettoria, un attacco pu\u00f2 terminare in un punto differente da quello previsto, un movimento pu\u00f2 essere alterato o persino una manifestazione magica pu\u00f2 subire una variazione nel proprio percorso. La Divergenza non crea necessariamente ci\u00f2 che devia: interviene su qualcosa che possiede gi\u00e0 una propria direzione e la conduce altrove."],
    ["Alterazione","La Divergenza pu\u00f2 modificare temporaneamente propriet\u00e0, condizioni o caratteristiche di qualcosa. Peso, velocit\u00e0, equilibrio, forza, resistenza, percezione e numerose altre qualit\u00e0 possono subire variazioni apparentemente prive di una causa proporzionata. L'alterazione non deve necessariamente rendere qualcosa migliore o peggiore: modifica semplicemente una condizione rispetto a ci\u00f2 che sarebbe normalmente dovuta essere."],
    ["Esternazione","Attraverso lo studio della propria natura, Aggron ha riconosciuto che in alcune circostanze la Divergenza pu\u00f2 assumere una forma pi\u00f9 concreta e immediatamente percepibile. Invece di limitarsi ad alterare ci\u00f2 che sta gi\u00e0 accadendo, il potere pu\u00f2 esternarsi direttamente attraverso fenomeni, impulsi, scariche o altre manifestazioni difficili da ricondurre a una causa naturale. \u00c8 l'ambito che maggiormente si avvicina a una tradizionale espressione magica della Divergenza e quello sul quale la testa intelligente ha concentrato maggiormente i propri studi."]
  ],
  campiAttiva: [
    ["Campo Offensivo","Attraverso il Campo Offensivo, Aggron indirizza la Divergenza con l'intento di ferire, colpire, distruggere o compromettere fisicamente un bersaglio. Pu\u00f2 intervenire direttamente su una creatura, su un oggetto, su una struttura oppure sull'ambiente circostante, sfruttando qualsiasi elemento possa diventare la causa di un danno. La Divergenza pu\u00f2 manifestarsi direttamente sotto forma di scariche, impulsi, distorsioni o altre manifestazioni energetiche, ma non \u00e8 obbligata a produrre qualcosa dal nulla. Pu\u00f2 invece deviare improvvisamente un oggetto gi\u00e0 in movimento, far cedere una porzione di terreno, provocare la rottura di una struttura nel momento opportuno, alterare violentemente il movimento di qualcosa o trasformare una circostanza apparentemente innocua nella causa di un attacco. Il Campo Offensivo comprende quindi tutto ci\u00f2 in cui il risultato desiderato \u00e8 produrre direttamente un danno, indipendentemente dalla forma attraverso cui la Divergenza riesce a raggiungerlo."],
    ["Campo Difensivo","Attraverso il Campo Difensivo, Aggron orienta la Divergenza affinch\u00e9 una minaccia venga evitata, deviata, rallentata o resa meno efficace. Il bersaglio della protezione pu\u00f2 essere Aggron stesso, un alleato, un oggetto oppure qualcosa che desidera mantenere intatto. La Divergenza pu\u00f2 interagire con attacchi fisici, proiettili, incantesimi, esplosioni, movimenti, impatti o elementi dell'ambiente. Non deve necessariamente creare una barriera: molto pi\u00f9 spesso interviene sul modo in cui la minaccia raggiunge il proprio bersaglio o sulle conseguenze che dovrebbe produrre. Un colpo potrebbe deviare pochi centimetri prima dell'impatto; una freccia cambiare improvvisamente traiettoria. Il Campo Difensivo non serve quindi soltanto a bloccare qualcosa: pu\u00f2 impedirgli di arrivare, modificarne il percorso, ridurne l'efficacia oppure creare le condizioni affinch\u00e9 il bersaglio riesca a evitarlo."],
    ["Campo di Potenziamento","Attraverso il Campo di Potenziamento, Aggron utilizza la Divergenza per amplificare temporaneamente qualcosa che esiste gi\u00e0 o che \u00e8 gi\u00e0 in corso, spingendone una o pi\u00f9 caratteristiche oltre i normali limiti. Il potenziamento pu\u00f2 riguardare Aggron, un alleato, una capacit\u00e0 fisica, una percezione, un'abilit\u00e0, un incantesimo, una trasformazione, un attacco o qualsiasi altro fenomeno gi\u00e0 attivo. Non riguarda quindi soltanto forza o resistenza, ma praticamente ogni caratteristica che possa essere resa pi\u00f9 intensa. Il Campo di Potenziamento agisce quindi principalmente su intensit\u00e0, potenza, durata, portata, estensione, efficacia o capacit\u00e0, senza essere limitato esclusivamente alle caratteristiche fisiche di una creatura."],
    ["Campo di Indebolimento","Il Campo di Indebolimento utilizza lo stesso principio del Potenziamento in senso opposto: Aggron tenta di ridurre, limitare o compromettere temporaneamente qualcosa che \u00e8 gi\u00e0 presente. Pu\u00f2 intervenire su creature, capacit\u00e0 fisiche, sensi, incantesimi, trasformazioni, attacchi, protezioni o altri fenomeni attivi, diminuendone una o pi\u00f9 caratteristiche. Un avversario potrebbe perdere parte della propria forza o velocit\u00e0, una percezione diventare meno efficace, un incantesimo ridurre la propria portata, una trasformazione diventare meno stabile oppure un attacco perdere parte della propria potenza. La Divergenza potrebbe anche ridurre la durata di un effetto, diminuirne l'estensione, limitare temporaneamente una capacit\u00e0 particolarmente pericolosa o indebolire una propriet\u00e0 specifica di qualcosa senza necessariamente annullarla completamente. Questo Campo serve quindi a rendere qualcosa meno efficace rispetto alla propria condizione normale, intervenendo sulle stesse caratteristiche che il Potenziamento sarebbe invece in grado di amplificare."],
    ["Campo di Alterazione","Il Campo di Alterazione rappresenta l'utilizzo pi\u00f9 libero della Divergenza Attiva. Aggron non stabilisce necessariamente quale debba essere il risultato finale, ma indica ci\u00f2 su cui desidera che la Divergenza intervenga, lasciandole molta pi\u00f9 libert\u00e0 nel determinare cosa modificare. Pu\u00f2 essere indirizzata verso una creatura, un oggetto, un attacco, un incantesimo, una zona dell'ambiente, un movimento, una situazione o persino una sequenza di eventi in corso. La Divergenza pu\u00f2 quindi modificarne propriet\u00e0, comportamento, direzione, tempismo o conseguenze, producendo qualcosa che non rientra chiaramente negli altri quattro Campi. Aggron potrebbe liberarla all'interno di una zona affinch\u00e9 qualcosa cambi; indirizzarla verso un incantesimo per vedere come questo venga alterato; influenzare un oggetto affinch\u00e9 assuma temporaneamente propriet\u00e0 differenti; interferire con una serie di eventi gi\u00e0 in movimento; oppure concentrarla su un avversario senza chiedere espressamente che venga ferito o indebolito, lasciando che sia la Divergenza stessa a determinare quale anomalia produrre. Questo \u00e8 il Campo nel quale Aggron esercita il minor controllo sulla forma dell'effetto. Non chiede necessariamente alla Divergenza di fare una cosa precisa: sceglie dove liberarla e permette al caso di decidere quale deviazione introdurre nella situazione."],
    ["Campo di Manifestazione","Attraverso il Campo di Manifestazione, Aggron indirizza la Divergenza affinch\u00e9 qualcosa di utile, necessario o desiderato finisca per presentarsi nella situazione, non necessariamente perch\u00e9 venga creato dal nulla, ma perch\u00e9 una coincidenza, una concatenazione di eventi o una possibilit\u00e0 normalmente trascurabile conduca proprio a ci\u00f2 di cui aveva bisogno. La Manifestazione pu\u00f2 riguardare oggetti, opportunit\u00e0, elementi dell'ambiente, vie d'uscita, occasioni favorevoli o piccoli eventi che prima non erano disponibili, visibili o apparentemente rilevanti. Aggron esprime ci\u00f2 che vorrebbe ottenere, mentre la Divergenza cerca una possibilit\u00e0 attraverso la quale farlo comparire, arrivare o diventare improvvisamente accessibile. La Manifestazione non rappresenta quindi la capacit\u00e0 di generare liberamente qualsiasi cosa desiderata. Aggron spinge invece il caso affinch\u00e9 il mondo trovi, tra le possibilit\u00e0 gi\u00e0 esistenti, una strada attraverso cui ci\u00f2 di cui ha bisogno possa in qualche modo arrivare fino a lui. Pi\u00f9 improbabile \u00e8 ci\u00f2 che desidera ottenere, maggiore sar\u00e0 la quantit\u00e0 di Divergenza necessaria per tentare di renderlo possibile."]
  ],
  divergenzaAttivaNote: "Nel corso dei millenni, la testa intelligente di Aggron ha imparato non soltanto a osservare la Divergenza, ma anche a richiamarla consapevolmente e tentare di indirizzarla. Non si tratta di una forma tradizionale di magia e non esistono formule o incantesimi prestabiliti: Aggron imprime alla Divergenza un intento, cercando di spingerla verso un determinato risultato. Il controllo non \u00e8 mai assoluto. La Divergenza pu\u00f2 seguire quasi perfettamente la volont\u00e0 di Aggron, interpretarla in maniera differente oppure raggiungere un risultato simile attraverso una strada completamente inattesa. Pi\u00f9 potere Aggron cerca di imbrigliare, pi\u00f9 grande pu\u00f2 essere l'effetto ottenuto, ma aumenta anche la difficolt\u00e0 di mantenere la manifestazione vicina all'intento originale. Per questo motivo la testa intelligente non ha sviluppato veri e propri incantesimi, ma ha classificato alcuni Campi di Intervento, utilizzandoli come direzioni attraverso le quali orientare il potere.<br><br>(Durante il turno Aggron pu\u00f2 lanciare fino ad un massimo di due incantesimi. Se la Divergenza dovesse essere stata utilizzata come attacco attraverso lo scettro allora verrebbero esclusi solo gli incantesimi di tipo <b>OFFENSIVO</b>)",
  divergenzaPassiva: "Quando la testa istintiva controlla Aggron, la Divergenza non viene normalmente imbrigliata n\u00e9 indirizzata in maniera cosciente. Questo non significa per\u00f2 che il potere si attenui o scompaia: al contrario, continua a essere costantemente presente e tende a emergere spontaneamente soprattutto nei momenti di maggiore tensione, pericolo o imprevedibilit\u00e0.<br><br>Durante un combattimento, la Divergenza pu\u00f2 quindi interferire con ci\u00f2 che sta accadendo attraverso coincidenze, deviazioni, alterazioni improvvise o concatenazioni di eventi improbabili. Un attacco pu\u00f2 mancare per una circostanza assurda, una traiettoria pu\u00f2 cambiare all'ultimo istante, un appoggio pu\u00f2 cedere sotto un avversario, un oggetto pu\u00f2 cadere nel punto giusto oppure una sequenza apparentemente casuale di eventi pu\u00f2 finire per produrre una conseguenza favorevole ad Aggron. Queste manifestazioni non possiedono una forma prestabilita e possono richiamare qualunque Ambito della Divergenza. Possono agire sulla probabilit\u00e0, sul rapporto tra causa e conseguenza, sul tempismo, sulla direzione di qualcosa, sulle propriet\u00e0 di un elemento o persino attraverso un'emanazione pi\u00f9 evidente del potere. Proprio per questo, due manifestazioni spontanee possono risultare completamente diverse tra loro pur avendo origine dalla stessa forza. Anche la loro intensit\u00e0 pu\u00f2 cambiare enormemente. Alcune possono essere cos\u00ec sottili da sembrare semplice fortuna, mentre altre possono alterare in maniera evidente l'andamento dello scontro, producendo eventi difficili da giustificare come normali coincidenze. La Divergenza non \u00e8 necessariamente limitata a piccoli effetti: quando la situazione assume particolare importanza o pericolosit\u00e0, la deviazione prodotta pu\u00f2 diventare molto pi\u00f9 significativa.<br><br>La testa istintiva non sceglie quando, come o attraverso quale Ambito la Divergenza debba intervenire. Non tenta nemmeno di comprenderne il funzionamento e tende a considerare questi episodi come qualcosa di perfettamente naturale, spesso interpretandoli semplicemente come segni favorevoli della Fortuna. Quando le circostanze lo richiedono, il DM pu\u00f2 effettuare o richiedere un <b>Tiro di Divergenza</b> per determinare se il potere intervenga spontaneamente, quale Ambito venga coinvolto e con quale intensit\u00e0. Questo pu\u00f2 avvenire soprattutto nei momenti in cui pericolo, casualit\u00e0 o imprevedibilit\u00e0 rendono particolarmente probabile una deviazione significativa del normale corso degli eventi.",

  truccetti: [
    {nome:"Convergenza", desc:"In condizioni normali Aggron pu\u00f2 soltanto assistere alle manifestazioni spontanee della Divergenza o, attraverso la testa intelligente, tentare di indirizzarne il potere senza possederne mai un controllo assoluto. Esistono tuttavia rarissimi momenti nei quali entrambe le componenti di Aggron sembrano riuscire, per un singolo istante, a imbrigliare realmente la Divergenza e costringerla a convergere verso un esito preciso. Prima di un tiro particolarmente importante, Aggron pu\u00f2 utilizzare Convergenza, concentrando tutto il proprio potere sull'evento imminente e piegando temporaneamente le possibilit\u00e0 affinch\u00e9 l'esito risulti eccezionalmente favorevole ai propri interessi. La Convergenza pu\u00f2 essere richiamata da entrambe le teste, indipendentemente da quale possieda in quel momento il controllo del corpo, ma deve essere dichiarata prima che il tiro venga effettuato. Una volta che l'esito si \u00e8 gi\u00e0 manifestato, Aggron non pu\u00f2 utilizzare questa capacit\u00e0 per modificarlo retroattivamente. Per un singolo istante, quindi, la Divergenza smette di comportarsi come una forza completamente imprevedibile e viene costretta verso una possibilit\u00e0 specifica; subito dopo, per\u00f2, il controllo svanisce e il potere ritorna alla propria natura instabile e incontrollabile.", uso:"1 x Riposo Lungo"},
    {nome:"Potrebbe Servire", desc:"La testa istintiva di Aggron possiede una naturale inclinazione verso la costruzione di armi improvvisate, trappole e piccoli strumenti da combattimento, assemblati utilizzando praticamente qualsiasi cosa riesca a recuperare durante i propri viaggi. Ferraglia, corde, catene, chiodi e oggetti apparentemente inutili vengono conservati con la convinzione che, prima o poi, \u00abpotrebbero servire\u00bb. Le sue creazioni nascono spesso senza un vero progetto, seguendo intuizioni semplici e immediate: pu\u00f2 fissare un pezzo di ferro a una corda, riempire un sacchetto di frammenti appuntiti o modificare un vecchio oggetto semplicemente perch\u00e9, in quel momento, gli sembra utile farlo. Il risultato \u00e8 quasi sempre rudimentale, approssimativo e ben lontano dal lavoro di un vero artigiano, eppure tende sorprendentemente a rivelarsi funzionale quando serve davvero. Quelle che sembrano semplici cianfrusaglie possono cos\u00ec diventare risorse da battaglia capaci di ferire, rallentare, intralciare, distrarre o creare ostacoli. Quando non possiede il controllo principale del corpo, la testa istintiva pu\u00f2 utilizzare la propria Azione del Fratello per interagire con una di queste creazioni, purch\u00e9 l'azione sia compatibile con il limitato margine di movimento a sua disposizione.", uso:"3 x Riposo Lungo"},
    {nome:"Devozione", desc:"La testa istintiva di Aggron possiede una fede assoluta nella Dea della Fortuna e interpreta molte delle coincidenze favorevoli della propria vita come risposte dirette alla sua devozione. Durante il combattimento tende quindi a rivolgersi spontaneamente alla Dea con richieste semplici e immediate: che un nemico cada, che un colpo lo manchi, che qualcosa si rompa, che un alleato venga aiutato o che accada semplicemente qualcosa di favorevole. Non tutte queste richieste sembrano ricevere risposta, ma sorprendentemente molte finiscono per avverarsi, talvolta in modo diretto, altre attraverso coincidenze o concatenazioni di eventi del tutto inattese. Per Aggron non esiste alcun dubbio: \u00e8 la Dea della Fortuna ad ascoltare le sue preghiere. La testa intelligente, invece, ritiene possibile che queste richieste siano il modo istintivo con cui il fratello riesce inconsapevolmente a indirizzare la Divergenza, esprimendo un desiderio senza comprenderne il meccanismo.", uso:"6 x Riposo Lungo"},
    {nome:"Sincronia Gemella", desc:"La natura bicefala di Aggron rappresenta una delle sue pi\u00f9 grandi peculiarit\u00e0 ma anche uno dei limiti pi\u00f9 profondi del suo corpo: le due coscienze condividono la stessa carne, ma possiedono volont\u00e0, istinti e modi di agire differenti, e questo impedisce ad Aggron di esprimere tutto il proprio potenziale. In rarissime circostanze, per\u00f2, le due teste desiderano esattamente la stessa cosa e ogni contrasto interno scompare: nessuna prevale sull'altra e Aggron viene controllato da entrambe contemporaneamente, perfettamente coordinate come due fratelli che combattono fianco a fianco nello stesso corpo. In questa condizione la Moneta della Decisione viene temporaneamente sospesa, il corpo non \u00e8 pi\u00f9 frenato dalla divisione delle due volont\u00e0 e pu\u00f2 esprimere pienamente la propria forza, mentre la testa intelligente pu\u00f2 concentrarsi interamente sulla Divergenza. <u>Aggron ottiene 30 Punti Ferita Temporanei, +2 alla CA e i suoi attacchi possono raggiungere fino a 12d6 di danno, tutti i nemici entro 6 caselle devono effettuare un TS Carisma CD 17 in caso di fallimento -3 ai Tpc su Aggron di qualsiasi natura</u>; allo stesso tempo, la Divergenza spontanea diventa molto pi\u00f9 presente e incisiva, mentre la Divergenza Attiva viene amplificata, permettendo ai suoi effetti di raggiungere intensit\u00e0, portata, durata o complessit\u00e0 superiori al normale. Lo Scettro dell'Amplificazione diventa il punto d'incontro perfetto tra le due nature di Aggron, potendo essere sfruttato contemporaneamente come devastante arma da mischia e come catalizzatore della Divergenza. Il potere rimane comunque imprevedibile e non viene mai controllato completamente, ma in questa condizione Aggron riesce a spingerlo molto pi\u00f9 lontano prima che sfugga alla direzione impressa.", uso:"1 x 2 Riposi Lunghi"}
  ],

  descrizione: { eta:"6000", altezza:"3 Metri", peso:"400 KG", occhi:"Quattro (teste due :))", capelli:"Pochi ma belli", colorePersonaggio:"Blu" },

  backstory: "Aggron appartiene alla razza degli Ogre, uno dei popoli pi\u00f9 antichi di Morgedal, presente nelle sue terre fin dalle epoche pi\u00f9 remote. Gli Ogre non hanno mai posseduto una vera patria n\u00e9 costruito grandi comunit\u00e0 stabili: per generazioni hanno attraversato il mondo in piccoli gruppi nomadi, tramandando oralmente tradizioni e racconti le cui origini si perdono quasi nella nascita stessa di Morgedal. Con il trascorrere dei secoli la loro razza \u00e8 per\u00f2 diventata sempre pi\u00f9 rara; il valore attribuito a diverse parti del loro corpo li ha trasformati nelle prede di cacciatori e mercanti, disperdendo progressivamente le poche comunit\u00e0 rimaste e costringendo molti degli Ogre superstiti a un'esistenza solitaria e itinerante.<br><br>Tra le pi\u00f9 antiche credenze conservate dalla loro tradizione figura quella di una misteriosa dea, ricordata come la <b>Dea della Fortuna</b>. Secondo questi racconti, ancora prima che i suoi fratelli entrassero in contrasto tra loro e si dividessero i grandi piani ancestrali, ella avrebbe rinunciato spontaneamente a prendere parte alle loro contese, scegliendo per s\u00e9 un dominio che nessuno degli altri desiderava e che nessuno riteneva realmente possibile governare: il Caso. Si sarebbe quindi ritirata nel proprio piano, lontano dalle vicende dei fratelli, fino quasi a scomparire dalla memoria del mondo.<br><br>Quando Aggron nacque con due teste, un evento mai conosciuto prima tra gli Ogre, la sua famiglia interpret\u00f2 immediatamente quella nascita come un nuovo segno della dea. Crescendo divenne per\u00f2 evidente che quelle due teste ospitavano due menti distinte, capaci di ragionare e interpretare il mondo in maniera profondamente diversa. La pi\u00f9 istintiva accolse completamente la fede tramandata dalla propria famiglia e ancora oggi considera le incredibili coincidenze che sembrano accompagnare Aggron come manifestazioni della volont\u00e0 della Dea della Fortuna. La mente pi\u00f9 razionale rifiuta invece questa interpretazione e riconosce come reali soltanto le divinit\u00e0 conosciute di Morgedal Cratus, legato alla morte; Linfeus, alla vita; Galactus, al tempo e allo spazio; Ignis, alla natura; e Mens, alla mente. arrivando a considerare soprattutto Ignis come una possibile spiegazione della loro particolare natura. Durante la lunghissima esistenza di Aggron, tuttavia, eventi improbabili, errori, coincidenze e circostanze apparentemente casuali hanno continuato con sorprendente frequenza a volgere in suo favore. Nessuna delle due menti conosce realmente la causa di questo fenomeno: per una \u00e8 la prova che l'antica leggenda degli Ogre sia vera; per l'altra \u00e8 un mistero ancora irrisolto, che nel corso dei secoli l'ha spinta ad avvicinarsi sempre pi\u00f9 allo studio del suo potere nel tentativo di comprendere cosa si nasconda realmente dietro la loro esistenza.",

  lore: [
    {t:"Identit\u00e0 e carattere delle due teste", d:"Aggron possiede due menti distinte che condividono lo stesso corpo. Entrambe sanno perfettamente di non essere due individui fisicamente separati, ma ciascuna riconosce nell'altra una coscienza diversa dalla propria, capace di pensare, desiderare e prendere decisioni autonomamente. Vivono quindi in una sorta di limbo identitario e tendono a considerarsi come \u201cfratelli\u201d, pur essendo consapevoli della particolarit\u00e0 di questo termine. Una delle due menti \u00e8 impulsiva, spontanea e istintiva, possiede capacit\u00e0 intellettive piuttosto semplici e tende ad agire prima di riflettere; \u00e8 la testa maggiormente legata alla componente fisica e combattente di Aggron. L'altra possiede invece un'intelligenza spiccata: \u00e8 lucida, razionale, riflessiva e costantemente alla ricerca di risposte; \u00e8 la testa maggiormente legata alla componente stregonesca."},
    {t:"Rapporto con gli altri", d:"Aggron adora stare in compagnia. Sebbene abbia trascorso gran parte della propria esistenza viaggiando da solo, la solitudine non rappresenta una sua scelta. Quando riesce a instaurare un vero rapporto con qualcuno tende ad affezionarsi profondamente e difficilmente desidera separarsene."},
    {t:"Ideologie e convinzioni", d:"la testa pi\u00f9 istintiva crede fermamente nella Dea della Fortuna, misteriosa figura tramandata dalle pi\u00f9 antiche tradizioni degli Ogre, e interpreta le strane coincidenze che accompagnano Aggron come manifestazioni della sua volont\u00e0. N\u00e9 Aggron n\u00e9 gli Ogre conoscono il vero nome di questa divinit\u00e0 o possiedono prove certe della sua esistenza. La testa razionale considera infatti questa figura soltanto un'antichissima leggenda e riconosce come reali solamente le cinque divinit\u00e0 conosciute di Morgedal: Cratus, Linfeus, Galactus, Ignis e Mens. Tra queste ritiene possibile che proprio Ignis possa essere collegato alla particolare natura di Aggron e che dietro la loro esistenza possa nascondersi uno scopo ancora sconosciuto."},
    {t:"Esperienza e longevit\u00e0", d:"i circa sei millenni di vita di Aggron gli hanno permesso di attraversare epoche molto diverse della storia di Morgedal e di assistere sia alla Seconda sia alla Terza Grande Guerra, senza mai schierarsi direttamente. Non ha mai sentito il bisogno di stabilire quale fazione fosse nel giusto o nel torto, anche perch\u00e9 molti dei popoli coinvolti appartenevano agli stessi che per secoli avevano perseguitato gli Ogre. Essendo uno degli ultimi della propria specie, non ha mai ritenuto sensato rischiare la vita per guerre che non considerava sue. Ci\u00f2 non significa che sia rimasto estraneo a ci\u00f2 che accadeva: la testa pi\u00f9 intelligente ha osservato, studiato e appreso ci\u00f2 che riteneva utile, mentre quella istintiva ha imparato soprattutto dall'esperienza diretta, osservando combattimenti, guerrieri e tecniche incontrate nei propri viaggi. In migliaia di anni entrambe hanno quindi accumulato una grande esperienza, seppur sempre in maniera selettiva."},
    {t:"Paure e vulnerabilit\u00e0", d:"Aggron teme profondamente di perdere le persone alle quali riesce ad affezionarsi. Per gran parte della propria esistenza l'unica presenza realmente costante \u00e8 stata l'altra testa, il suo \u201cfratello\u201d: nonostante abbia vissuto senza veri compagni, nessuna delle due menti ha quindi mai sperimentato una completa solitudine."},
    {t:"Riposo delle due teste", d:"le due menti di Aggron, pur condividendo lo stesso corpo, non sono necessariamente costrette a dormire contemporaneamente. Una testa pu\u00f2 addormentarsi mentre l'altra rimane perfettamente sveglia e cosciente, permettendo ad Aggron di alternare il riposo delle due menti. Questa particolarit\u00e0 pu\u00f2 generare situazioni imprevedibili: mentre una delle due dorme, l'altra rimane libera di osservare ci\u00f2 che accade, interagire con ci\u00f2 che la circonda o dedicarsi alle proprie iniziative, lasciando alla testa addormentata la possibilit\u00e0 di risvegliarsi e scoprire soltanto in seguito cosa il proprio \u201cfratello\u201d abbia combinato durante la sua assenza."},
    {t:"Viaggio", d:"Aggron conduce un'esistenza completamente itinerante e non possiede una destinazione prestabilita. La testa pi\u00f9 intelligente tende a scegliere attentamente i percorsi, considerando pericoli, ostacoli, presenza di cacciatori e qualsiasi altra variabile possa rendere il viaggio pi\u00f9 sicuro. La testa pi\u00f9 istintiva segue invece una filosofia completamente opposta: ritiene inutile pianificare il percorso, perch\u00e9 \u00e8 convinta che la Dea della Fortuna finir\u00e0 comunque per condurre Aggron esattamente dove dovrebbe trovarsi. Questa convinzione viene chiamata \u201cStriscia Celeste\u201d."}
  ],

function saveGoogleTokenToSession(token, expiresInSeconds){
  try{
    sessionStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY, JSON.stringify({
      token: token,
      expiresAt: Date.now() + (Number(expiresInSeconds || 0) * 1000)
    }));
  }catch(e){}
}

function loadGoogleTokenFromSession(){
  try{
    const raw = sessionStorage.getItem(GOOGLE_TOKEN_STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.token || !data.expiresAt) return null;
    if (Date.now() > data.expiresAt - 60000) return null; // margine di sicurezza di 60s
    return data.token;
  }catch(e){ return null; }
}

async function driveFind(){
  const name = suggestedFileName();
  const q = encodeURIComponent(`name='${name}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: "Bearer " + googleAccessToken }
  });
  if (!res.ok){
    const body = await res.text().catch(()=> "");
    console.error("Drive (find) errore " + res.status + ": " + body);
    throw new Error("drive find failed: " + res.status);
  }
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function driveCreate(){
  const name = suggestedFileName();
  const boundary = "-------scheda" + Date.now();
  const metadata = { name, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(STATE)}\r\n` +
    `--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": `multipart/related; boundary=${boundary}` },
    body
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (create) errore " + res.status + ": " + errBody);
    throw new Error("drive create failed: " + res.status);
  }
  const data = await res.json();
  return data.id;
}

async function driveUpdate(fileId){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": "application/json" },
    body: JSON.stringify(STATE)
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (update) errore " + res.status + ": " + errBody);
    const err = new Error("drive update failed: " + res.status);
    err.status = res.status;
    throw err;
  }
}

function deepMerge(base, override){
  if (Array.isArray(base)) return (override && Array.isArray(override)) ? override : base;
  if (typeof base === "object" && base !== null){
    const out = {...base};
    if (override && typeof override === "object"){
      for (const k in override){ out[k] = deepMerge(base[k], override[k]); }
    }
    return out;
  }
  return (override !== undefined) ? override : base;
}

async function loadState(){

  try{

    if (res && res.value){

      STATE = deepMerge(DEFAULT_STATE, saved);
      setStatus("Dati caricati \u2713");

    }
  }catch(e){ /* nessun dato salvato ancora, va bene cos\u00ec */ }

}

async function performSave(){
  let wroteSomething = false;
  let cloudFailed = false;

  if (STORAGE_AVAILABLE){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
      wroteSomething = true;
    }catch(e){ cloudFailed = true; }
  }

  if (localFileHandle){
    const ok = await writeLocalFile();
    if (ok) wroteSomething = true;
  }

  let driveOk = false;
  let driveAttempted = false;
  if (googleAccessToken){
    driveAttempted = true;
    driveOk = await driveSave();
    if (driveOk) wroteSomething = true;
  }

  const t = new Date();
  const stamp = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  if (wroteSomething){
    lastSaveOk = true;
    clearStorageWarning();
    const extras = [localFileHandle ? "file locale" : null, driveOk ? "Drive" : null].filter(Boolean).join(" + ");
    setStatus("Salvato \u2713 " + stamp + (extras ? " (" + extras + ")" : ""));
  } else if (cloudFailed){
    lastSaveOk = false;
    setStatus("Errore di salvataggio \u2014 usa \u2018Esporta backup\u2019");
  } else if (driveAttempted && !driveOk){
    lastSaveOk = false;
    setStatus("Errore di salvataggio su Drive \u2014 controlla la console (F12) o usa \u2018Esporta backup\u2019");
  } else {
    setStatus("Non salvato automaticamente \u2014 collega un file locale, Google Drive, o esporta il backup");
  }
}

async function writeLocalFile(){
  if (!localFileHandle) return false;
  try{
    const perm = await localFileHandle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted") return false;
    const writable = await localFileHandle.createWritable();
    await writable.write(JSON.stringify(STATE, null, 2));
    await writable.close();
    return true;
  }catch(e){ return false; }
}

/* ============================================================
   IMMAGINI OGGETTI (compresse in dataURL, salvate nello stato)
   ============================================================ */
function fileToCompressedDataURL(file, maxDim, quality, cb){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim / Math.max(w,h));
      w = Math.max(1, Math.round(w*scale));
      h = Math.max(1, Math.round(h*scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = ()=>{ setStatus("Immagine non valida"); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* allowZoom: aggiunge un pulsante di ingrandimento (modal) accanto alla miniatura.
   Usato solo per le immagini dell'Equipaggiamento, non per l'Inventario. */
function makeImagePicker(currentSrc, onPick, onRemove, allowZoom, zoomLabel, readOnly){
  const wrap = document.createElement("div");
  wrap.className = "img-row";

  const thumb = document.createElement(currentSrc ? "img" : "div");
  if (currentSrc){ thumb.src = currentSrc; thumb.className = "thumb"; }
  else { thumb.className = "thumb-placeholder"; }

  if (readOnly){
    /* Player read-only (equip/inventario): solo visualizzazione. Nessun
       modo di aggiungere, cambiare o rimuovere l'immagine. Se c'è
       un'immagine, il clic sulla miniatura apre il lightbox; altrimenti
       un placeholder neutro senza alcuna interattività. */
    if (currentSrc){
      thumb.title = "Clic per ingrandire";
      thumb.addEventListener("click", ()=> openImageLightbox(currentSrc, zoomLabel));
    } else {
      thumb.title = "Nessuna immagine";
    }
    wrap.appendChild(thumb);
    return wrap;
  }

  if (currentSrc){ thumb.title = "Clic per cambiare immagine"; }
  else { thumb.textContent = "+"; thumb.title = "Aggiungi immagine"; }

  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.className = "file-input-hidden";
  input.addEventListener("change", ()=>{
    const f = input.files && input.files[0];
    if (f) fileToCompressedDataURL(f, 320, 0.72, (dataUrl)=>{ onPick(dataUrl); });
  });

  thumb.addEventListener("click", ()=> input.click());

  wrap.appendChild(thumb);
  wrap.appendChild(input);

  const label = document.createElement("span");
  label.className = "file-btn";
  label.textContent = currentSrc ? "Cambia immagine" : "Aggiungi immagine";
  label.addEventListener("click", ()=> input.click());
  wrap.appendChild(label);

  if (currentSrc && allowZoom){
    const zoom = document.createElement("button");
    zoom.className = "img-zoom"; zoom.type="button"; zoom.textContent = "\u26f6"; zoom.title="Ingrandisci immagine";
    zoom.addEventListener("click", (ev)=>{ ev.stopPropagation(); openImageLightbox(currentSrc, zoomLabel); });
    wrap.appendChild(zoom);
  }

  if (currentSrc){
    const rm = document.createElement("button");
    rm.className = "img-remove"; rm.type="button"; rm.textContent = "\u2715"; rm.title="Rimuovi immagine";
    rm.addEventListener("click", (ev)=>{ ev.stopPropagation(); onRemove(); });
    wrap.appendChild(rm);
  }
  return wrap;
}

      <input type="text" inputmode="numeric" class="mod${hasOverride(k)?' is-override':''}" id="mod-${k}" data-modover="${k}" value="${fmtMod(effMod(k))}" title="Modificatore calcolato automaticamente dal punteggio. Puoi modificarlo manualmente: il valore inserito viene mantenuto e non viene più sovrascritto dal ricalcolo automatico. Cancella il campo per tornare al calcolo automatico.">
    </div>`).join("");

  const saveRows = Object.keys(STATE.saves).map(k=>`
    <div class="save-row">
      <input type="checkbox" data-save="${k}" ${STATE.saves[k]?"checked":""}>
      <span>${abilNames[k]}</span>
      <span class="modbadge" id="savemod-${k}">${fmtMod(effMod(k))}</span>
    </div>`).join("");

  const skillRows = STATE.skills.map((s,i)=>`
    <div class="skill-row">
      <span class="skill-name">${s[0]}</span>
      <span class="skill-abbr" id="skillmod-${i}">${s[1]} ${fmtMod(effMod(s[1]))}</span>
      <input type="number" data-skill="${i}" value="${s[2]}">
    </div>`).join("");

  const deathPips = (arr, cls)=> arr.map((v,i)=>`<button class="pip death ${cls==='s'?'death-success':'death-fail'} ${v?'used':''}" data-death="${cls}-${i}"></button>`).join("");

  document.getElementById("panel-scheda").innerHTML = `
    <div class="card">
      <h2>Identit\u00e0</h2>
      <div class="grid grid-4">
        <div class="field"><label>Classe e Livello</label><input type="text" data-key="classe" value="${esc(STATE.classe)}"></div>
        <div class="field"><label>Background</label><input type="text" data-key="background" value="${esc(STATE.background)}"></div>
        <div class="field"><label>Razza</label><input type="text" data-key="razza" value="${esc(STATE.razza)}"></div>
        <div class="field"><label>Allineamento</label><input type="text" data-key="allineamento" value="${esc(STATE.allineamento)}"></div>
        <div class="field"><label>Nome Giocatore</label><input type="text" data-key="giocatore" value="${esc(STATE.giocatore)}"></div>
        <div class="field"><label>Altro</label><input type="text" data-key="altro" value="${esc(STATE.altro)}"></div>
      </div>
    </div>

    <div class="card">
      <h2>Caratteristiche <small>il modificatore si aggiorna da solo</small></h2>
      <div class="grid grid-6">${abilBoxes}</div>
    </div>

    <div class="card">
      <h2>Parametri di Combattimento</h2>
      <div class="grid grid-4">
        <div class="statpill"><label>CA</label><input type="number" data-key-num="ca" value="${STATE.ca}"></div>
        <div class="statpill"><label>Iniziativa</label><input type="number" data-key-num="iniziativa" value="${STATE.iniziativa}"></div>
        <div class="statpill"><label>Velocit\u00e0</label><input type="number" data-key-num="velocita" value="${STATE.velocita}"></div>
        <div class="statpill"><label>Bonus Competenza</label><input type="number" data-key-num="bonusComp" value="${STATE.bonusComp}"></div>
      </div>
      <div style="margin-top:12px;" class="grid grid-4">
        <div class="statpill"><label>Dado Vita</label><input type="text" data-key="dadoVita" value="${esc(STATE.dadoVita)}"></div>
        <div class="statpill"><label>Perc. Passiva</label><input type="number" data-key-num="percPassiva" value="${STATE.percPassiva}"></div>
      </div>
    </div>

    <div class="card">
      <h2>Punti Ferita</h2>
      <div class="hp-row">
        <div class="hp-numbers">
          <button class="btn small" id="hp-minus">\u2212</button>
          <input type="number" id="hp-cur" value="${STATE.hpCur}">
          <span style="color:var(--text-faint)">/</span>
          <input type="number" id="hp-max" value="${STATE.hpMax}">
          <button class="btn small" id="hp-plus">+</button>
        </div>
        <div class="hp-track"><div class="hp-fill" id="hp-fill"></div></div>
      </div>
      <div class="hp-row hp-row-temp">
        <div class="hp-numbers">
          <label style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;">PF Temp.</label>
          <input type="number" id="hp-temp" value="${STATE.hpTemp}">
        </div>
        <div class="hp-track hp-track-temp"><div class="hp-fill hp-fill-temp" id="hp-fill-temp"></div></div>
      </div>
      <div class="divider-label">Tiri Salvezza contro la Morte</div>
      <div style="display:flex;gap:26px;justify-content:center;flex-wrap:wrap;">
        <div><div style="text-align:center;font-size:10.5px;color:var(--good);text-transform:uppercase;margin-bottom:6px;">Successi</div><div class="pips">${deathPips(STATE.deathSuccess,"s")}</div></div>
        <div><div style="text-align:center;font-size:10.5px;color:var(--bad);text-transform:uppercase;margin-bottom:6px;">Fallimenti</div><div class="pips">${deathPips(STATE.deathFail,"f")}</div></div>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h2>Tiri Salvezza</h2>
        ${saveRows}
      </div>
      <div class="card">
        <h2>Abilit\u00e0</h2>
        ${skillRows}
      </div>
    </div>

    <div class="card">
      <h2>Attacchi & Incantesimi di Prima Utilit\u00e0</h2>
      ${renderAttacchiNav()}
      <div class="rich" contenteditable="true" data-rich="attacchi">${STATE.attacchi}</div>
    </div>
  `;

  // score inputs
  document.querySelectorAll('[data-score]').forEach(inp=>{
    inp.readOnly = false;
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.score;
      STATE.scores[k] = parseInt(inp.value || "0", 10);
      const modInp = document.getElementById("mod-"+k);
      if (modInp){ modInp.value = fmtMod(effMod(k)); modInp.classList.toggle("is-override", hasOverride(k)); }
      const sm = document.getElementById("savemod-"+k);
      if (sm) sm.textContent = fmtMod(effMod(k));
      STATE.skills.forEach((s,i)=>{
        if (s[1]===k){ const el=document.getElementById("skillmod-"+i); if(el) el.textContent = k+" "+fmtMod(effMod(k)); }
      });
      queueSave();
    });
  });

  // override manuale del modificatore (Caratteristiche editabili):
  // il calcolo automatico resta attivo, ma un valore inserito qui manualmente
  // sostituisce quello calcolato e non viene più sovrascritto dal ricalcolo.
  document.querySelectorAll('[data-modover]').forEach(inp=>{
    inp.readOnly = false;
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.modover;
      const raw = inp.value.trim();
      if (!STATE.modOverride) STATE.modOverride = {};
      if (raw === ""){
        delete STATE.modOverride[k];
      } else {
        const parsed = parseInt(raw.replace(/^\+/, ""), 10);
        if (!isNaN(parsed)) STATE.modOverride[k] = parsed;
      }
      inp.classList.toggle("is-override", hasOverride(k));
      const sm = document.getElementById("savemod-"+k);
      if (sm) sm.textContent = fmtMod(effMod(k));
      STATE.skills.forEach((s,i)=>{
        if (s[1]===k){ const el=document.getElementById("skillmod-"+i); if(el) el.textContent = k+" "+fmtMod(effMod(k)); }
      });
      queueSave();
    });
    inp.addEventListener("blur", ()=>{
      const k = inp.dataset.modover;
      inp.value = fmtMod(effMod(k));
    });
  });
  document.querySelectorAll('[data-save]').forEach(inp=>{
    inp.disabled = false;
    inp.addEventListener("change", ()=>{ STATE.saves[inp.dataset.save] = inp.checked; queueSave(); });
  });
  document.querySelectorAll('[data-skill]').forEach(inp=>{
    inp.readOnly = false;
    inp.addEventListener("input", ()=>{ STATE.skills[inp.dataset.skill][2] = parseInt(inp.value||"0",10); queueSave(); });
  });
  document.querySelectorAll('[data-death]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cls,idx] = btn.dataset.death.split("-");
      const arr = cls==="s" ? STATE.deathSuccess : STATE.deathFail;
      arr[idx] = !arr[idx];
      btn.classList.toggle("used", arr[idx]);
      queueSave();
    });
  });

  bindSimpleInputs();
  bindRich();

  const hpCur = document.getElementById("hp-cur"), hpMax = document.getElementById("hp-max"), hpTemp = document.getElementById("hp-temp");
  hpMax.readOnly = !isMasterEditorOn();
  function refreshHp(){
    let cur = parseInt(hpCur.value||"0",10), max = parseInt(hpMax.value||"0",10);
    if (cur > max) cur = max;
    if (cur < 0) cur = 0;
    hpCur.value = cur;
    let temp = parseInt(hpTemp.value||"0",10);
    if (temp < 0) temp = 0;
    STATE.hpCur = cur; STATE.hpMax = max; STATE.hpTemp = temp;
    const pct = max>0 ? Math.max(0,Math.min(100, cur/max*100)) : 0;
    document.getElementById("hp-fill").style.width = pct+"%";
    document.getElementById("hp-fill").style.background = pct<25 ? "linear-gradient(90deg,#7a2a24,var(--bad))" : (pct<60 ? "linear-gradient(90deg,#8a6a24,#c9a34e)" : "linear-gradient(90deg,#3f6a3a,var(--good))");
    const tempPct = max>0 ? Math.max(0,Math.min(100, temp/max*100)) : (temp>0 ? 100 : 0);
    document.getElementById("hp-fill-temp").style.width = tempPct+"%";
  }
  hpCur.addEventListener("input", ()=>{refreshHp(); queueSave();});
  hpMax.addEventListener("input", ()=>{refreshHp(); queueSave();});
  hpTemp.addEventListener("input", ()=>{refreshHp(); queueSave();});
  document.getElementById("hp-minus").addEventListener("click", ()=>{hpCur.value = (parseInt(hpCur.value||"0",10)-1); refreshHp(); queueSave();});
  document.getElementById("hp-plus").addEventListener("click", ()=>{hpCur.value = (parseInt(hpCur.value||"0",10)+1); refreshHp(); queueSave();});
  refreshHp();
}

/* ============================================================
   MASTER EDITOR
   Modalità di modifica strutturale riservata al Master: categoria,
   titolo/etichetta, testo, larghezza e ordine dei riquadri di
   Passive/Truccetti/Risorse/Ambiti/Campi. Nessuna auto-correzione:
   il testo inserito viene salvato esattamente com'è scritto.
   Attivabile SOLO da chi ha già sbloccato la modalità Master
   (password Master), ed è completamente invisibile/inattiva in
   modalità giocatore.
   ============================================================ */
const MASTER_EDITOR_KEY = "morgedal-master-editor";
const MASTER_CATS = [
  { key:"passive", label:"Passiva" },
  { key:"truccetti", label:"Truccetto" },
  { key:"incantesimo", label:"Incantesimo" },
  { key:"abilita", label:"Abilità" },
  { key:"risorse", label:"Risorsa" },
  { key:"ambiti", label:"Ambito" },
  { key:"campiAttiva", label:"Campo" }
];
const MASTER_ARR_SHAPE_CATS = new Set(["ambiti","campiAttiva"]);

function isMasterEditorOn(){
  if (!isMasterUnlocked()) return false;
  try{ return sessionStorage.getItem(MASTER_EDITOR_KEY) === "1"; }catch(e){ return false; }
}
function setMasterEditorOn(on){
  try{ if (on) sessionStorage.setItem(MASTER_EDITOR_KEY, "1"); else sessionStorage.removeItem(MASTER_EDITOR_KEY); }catch(e){}
}

function masterToCanonical(cat, item){
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    return { nome:item[0]||"", desc:item[1]||"", group:item[2]||"", width:item[3]||1 };
  }
  if (cat === "passive") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Passiva", width:item.width||1, hidden:!!item.hidden };
  if (cat === "truccetti") return { nome:item.nome||"", desc:item.desc||"", uso:item.uso||"?", width:item.width||1, hidden:!!item.hidden };
  if (cat === "abilita") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Abilità", width:item.width||1, hidden:!!item.hidden };
  if (cat === "risorse") return { nome:item.nome||"", desc:item.desc||"", max:item.max||1, width:item.width||1, hidden:!!item.hidden };
  if (cat === "incantesimo") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Incantesimo", width:item.width||1, hidden:!!item.hidden };
  return { nome:"", desc:"", width:1 };
}
function masterFromCanonical(cat, c){
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    return [c.nome||"Nuovo elemento", c.desc||"", "", c.width||1];
  }
  if (cat === "passive") return { nome:c.nome||"Nuova Passiva", tag:c.tag||"Passiva", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "truccetti") return { nome:c.nome||"Nuovo Truccetto", uso:c.uso||"?", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "abilita") return { nome:c.nome||"Nuova Abilità", tag:c.tag||"Abilità", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "risorse") return { nome:c.nome||"Nuova Risorsa", desc:c.desc||"", max:c.max||1, used:0, width:c.width||1, hidden:!!c.hidden };
  if (cat === "incantesimo") return { nome:c.nome||"Nuovo Incantesimo", tag:c.tag||"Incantesimo", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  return { nome:c.nome||"", desc:c.desc||"" };
}

function masterRerender(cat){
  if (MASTER_ARR_SHAPE_CATS.has(cat)) renderDivergenza(); else renderPoteri();
}
function masterMoveCategory(cat, idx, newCat){
  if (newCat === cat) return;
  const item = STATE[cat][idx];
  const canon = masterToCanonical(cat, item);
  STATE[cat].splice(idx,1);
  if (!STATE[newCat]) STATE[newCat] = [];
  STATE[newCat].push(masterFromCanonical(newCat, canon));
  renderPoteri(); renderDivergenza();
  queueSave();
}
function masterReorder(cat, idx, dir){
  const arr = STATE[cat];
  const j = idx + dir;
  if (j < 0 || j >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
  masterRerender(cat);
  queueSave();
}
function masterDelete(cat, idx){
  STATE[cat].splice(idx,1);
  masterRerender(cat);
  queueSave();
}
function masterCreate(cat){
  STATE[cat].push(masterFromCanonical(cat, {nome:"Nuovo elemento", desc:""}));
  masterRerender(cat);
  queueSave();
}
function masterBoxWidth(cat, idx){
  const item = STATE[cat][idx];
  return (MASTER_ARR_SHAPE_CATS.has(cat) ? item[3] : item.width) || 1;
}
function setMasterBoxWidth(cat, idx, w){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)) item[3] = w; else item.width = w;
  masterRerender(cat);
  queueSave();
}
function masterSetField(cat, idx, field, val){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    if (field === "nome") item[0] = val;
    else if (field === "desc") item[1] = val;
    else if (field === "group") item[2] = val;
  } else {    item[field] = val;
  }
}
function masterBoxHeight(cat, idx){
  const item = STATE[cat][idx];
  return (MASTER_ARR_SHAPE_CATS.has(cat) ? item[4] : item.h) || null;
}
function setMasterBoxHeight(cat, idx, h){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)) item[4] = h; else item.h = h;
  queueSave();
}
/* Al rilascio di un resize verticale del Master, se l'altezza scelta
   manualmente è inferiore al minimo necessario a mostrare tutto il
   contenuto (produrrebbe uno scroll interno), il box viene espanso
   automaticamente al minimo richiesto: nessuna scrollbar interna, nessun
   testo tagliato. Restituisce l'altezza EFFETTIVA (px, intera) da salvare
   nello STATE, che quindi non è mai inferiore a quella richiesta dal
   contenuto. Se l'altezza scelta è già sufficiente resta invariata. */
function growBoxToFitContent(el){
  let h = Math.round(el.getBoundingClientRect().height);
  if (el.scrollHeight > el.clientHeight){
    h = Math.round(h + (el.scrollHeight - el.clientHeight));
    el.style.height = h + "px";
  }
  return h;
}
function masterBoxStyle(cat, idx){
  const w = masterBoxWidth(cat, idx);
  const h = masterBoxHeight(cat, idx);
  let style = "";
  if (w && w > 1) style += `grid-column:span ${w};`;
  if (h) style += `height:${h}px;`;
  return ` data-master-box="${cat}-${idx}"${style ? ` style="${style}"` : ""}`;
}
function masterToolbarHtml(cat, idx, opts){
  opts = opts || {};
  const options = MASTER_CATS.map(c => `<option value="${c.key}"${c.key===cat?" selected":""}>${c.label}</option>`).join("");
  const w = masterBoxWidth(cat, idx);
  const widthCtl = opts.noWidth ? "" : `<select class="master-box-width" data-master-width="${cat}-${idx}" title="Larghezza del riquadro">
      <option value="1"${w===1?" selected":""}>1/3</option>
      <option value="2"${w===2?" selected":""}>2/3</option>
      <option value="3"${w===3?" selected":""}>3/3</option>
    </select>`;
  const canHide = !MASTER_ARR_SHAPE_CATS.has(cat);
  const isHidden = canHide && !!(STATE[cat][idx] && STATE[cat][idx].hidden);
  const eyeCtl = canHide
    ? `<button type="button" class="master-mini-btn master-eye-btn${isHidden?' is-hidden':''}" data-master-eye="${cat}-${idx}" title="${isHidden?'Nascosto al giocatore — clic per mostrare':'Visibile al giocatore — clic per nascondere'}">${isHidden?'🙈':'👁️'}</button>`
    : "";
  return `<div class="master-toolbar">
    <select class="master-cat-select" data-master-move="${cat}-${idx}" title="Sposta in un'altra categoria">${options}</select>
    <button type="button" class="master-mini-btn" data-master-up="${cat}-${idx}" title="Sposta su">↑</button>
    <button type="button" class="master-mini-btn" data-master-down="${cat}-${idx}" title="Sposta giù">↓</button>
    ${widthCtl}
    ${eyeCtl}
    <button type="button" class="master-mini-del" data-master-del="${cat}-${idx}" title="Elimina questo elemento">✕</button>
  </div>`;
}
function masterNewBoxBtn(cat, label){
  return `<button type="button" class="btn master-add-btn" data-master-create="${cat}">+ Nuovo box — ${label}</button>`;
}
function masterToggleHidden(cat, idx){
  const item = STATE[cat][idx];
  if (!item) return;
  item.hidden = !item.hidden;
  masterRerender(cat);
  queueSave();
}
function bindMasterControls(root){
  root = root || document;
  if (!isMasterEditorOn()) return;
  root.querySelectorAll('[data-master-move]').forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const [cat, idx] = sel.dataset.masterMove.split("-");
      masterMoveCategory(cat, Number(idx), sel.value);
    });
  });
  root.querySelectorAll('[data-master-up]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterUp.split("-");
      masterReorder(cat, Number(idx), -1);
    });
  });
  root.querySelectorAll('[data-master-down]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterDown.split("-");
      masterReorder(cat, Number(idx), 1);
    });
  });
  root.querySelectorAll('[data-master-del]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterDel.split("-");
      masterDelete(cat, Number(idx));
    });
  });
  root.querySelectorAll('[data-master-eye]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterEye.split("-");
      masterToggleHidden(cat, Number(idx));
    });
  });
  root.querySelectorAll('[data-master-width]').forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const [cat, idx] = sel.dataset.masterWidth.split("-");
      setMasterBoxWidth(cat, Number(idx), Number(sel.value));
    });
  });
  root.querySelectorAll('[data-master-box]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const [cat, idx] = el.dataset.masterBox.split("-");
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = growBoxToFitContent(el);
        if (h && h !== masterBoxHeight(cat, Number(idx))){
          setMasterBoxHeight(cat, Number(idx), h);
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
  root.querySelectorAll('[data-master-create]').forEach(btn=>{
    btn.addEventListener("click", ()=>{ masterCreate(btn.dataset.masterCreate); });
  });
  root.querySelectorAll('[data-master-field]').forEach(el=>{
    const evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, ()=>{
      const [cat, idx, field] = el.dataset.masterField.split("|");
      const val = el.matches("[contenteditable]") ? el.innerHTML : el.value;
      masterSetField(cat, Number(idx), field, val);
      queueSave();
    });
  });
}
function initMasterEditorToggle(){
  const btn = document.getElementById("master-editor-toggle");
  if (!btn) return;
  if (!isMasterUnlocked()){
    btn.classList.remove("show");
    return;
  }
  btn.classList.add("show");
  const refresh = ()=>{
    const on = isMasterEditorOn();
    btn.classList.toggle("on", on);
    btn.textContent = on ? "🛠️ Editor Master: ON" : "🛠️ Editor Master";
    document.body.classList.toggle("master-editor-on", on);
  };
  refresh();
  btn.addEventListener("click", ()=>{
    setMasterEditorOn(!isMasterEditorOn());
    refresh();
    renderAll();
  });
}

function renderPoteri(){
  const slotHtml = STATE.slots.map((s,i)=>{
    const pips = Array.from({length:s.max}).map((_,p)=>`<button class="pip ${p<s.used?'used':''}" data-slotpip="${i}-${p}"></button>`).join("");
    return `<div class="slot-lvl">
      <div class="lvl-badge">Livello ${s.lvl}</div>
      <div class="pips">${pips}</div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
        <label style="font-size:10px;color:var(--text-faint);">max</label>
        <input class="maxslot" type="number" data-slotmax="${i}" value="${s.max}">
      </div>
    </div>`;
  }).join("");

  const masterOn = isMasterEditorOn();

  const risorseHtml = STATE.risorse.map((r,i)=>{
    if (!masterOn && r.hidden) return "";
    const pips = Array.from({length:r.max}).map((_,p)=>`<button class="pip ${p<r.used?'used':''}" data-respip="${i}-${p}"></button>`).join("");
    const nameField = masterOn
      ? `<input type="text" class="master-name-input" data-master-field="risorse|${i}|nome" value="${esc(r.nome)}">`
      : `<div class="t-name">${r.nome}</div>`;
    const descField = masterOn

function autoGrowTextarea(el){
  if (!el) return;
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

/* Ordine: Nome -> Descrizione -> Peso. La descrizione si espande in verticale
   con il contenuto (nessuno scroll interno, nessun testo troncato). */
function renderInvTable(){
  const masterOn = isMasterEditorOn();
  const tbody = document.getElementById("inv-tbody");
  tbody.innerHTML = STATE.inventario.map((it,i)=>`
    <div class="inv-item">
      <div class="inv-item-top">
        <input type="checkbox" data-inv-check="${i}" ${it[0]==="\u2713"?"checked":""} title="Portato/equipaggiato">
        <div class="imgcell" id="inv-img-${i}"></div>
        <input type="text" class="inv-item-name" data-inv-name="${i}" value="${esc(it[1])}" placeholder="Nome oggetto">
        ${masterOn ? `<button class="inv-remove" data-inv-del="${i}" title="Rimuovi oggetto">\u2715</button>` : ''}
      </div>
      <textarea class="inv-item-desc" data-inv-desc="${i}" placeholder="Descrizione" rows="1">${esc(it[3])}</textarea>
      <div class="inv-item-peso">
        <label>Peso</label>
        <input type="number" data-inv-peso="${i}" value="${it[2]}">
      </div>
    </div>`).join("");

  STATE.inventario.forEach((it,i)=>{
    const cell = document.getElementById("inv-img-"+i);
    if (!cell) return;
    const picker = makeImagePicker(
      it[4] || "",
      (dataUrl)=>{ STATE.inventario[i][4] = dataUrl; renderInvTable(); queueSave(); },
      ()=>{ STATE.inventario[i][4] = ""; renderInvTable(); queueSave(); },
      true,
      it[1] || "Oggetto",
      false
    );
    // nell'elenco mostriamo solo la miniatura, senza le etichette testuali
    const lbl = picker.querySelector(".file-btn");
    if (lbl) lbl.remove();
    cell.appendChild(picker);
  });

  tbody.querySelectorAll('[data-inv-check]').forEach(c=>c.addEventListener("change",()=>{
    STATE.inventario[c.dataset.invCheck][0] = c.checked?"\u2713":"";
    refreshInvTotal(); queueSave();
  }));
  tbody.querySelectorAll('[data-inv-name]').forEach(c=>c.addEventListener("input",()=>{
    STATE.inventario[c.dataset.invName][1] = c.value; queueSave();
  }));
  tbody.querySelectorAll('[data-inv-peso]').forEach(c=>c.addEventListener("input",()=>{
    STATE.inventario[c.dataset.invPeso][2] = c.value; refreshInvTotal(); queueSave();
  }));
  tbody.querySelectorAll('[data-inv-desc]').forEach(c=>{
    autoGrowTextarea(c);
    c.addEventListener("input",()=>{
      STATE.inventario[c.dataset.invDesc][3] = c.value;
      autoGrowTextarea(c);
      queueSave();
    });
  });
  // Editor Master: se il Master ridimensiona manualmente una descrizione
  // sotto l'altezza necessaria a mostrare il testo per intero, la
  // riporta automaticamente almeno all'altezza del contenuto (niente
  // testo tagliato, niente scroll interno).
  if (window.ResizeObserver && !tbody.__invDescRO){
    tbody.__invDescRO = new ResizeObserver(entries=>{
      for (const entry of entries){
        const el = entry.target;
        if (el.scrollHeight > el.clientHeight + 1) autoGrowTextarea(el);
      }
    });
  }
  if (tbody.__invDescRO){
    tbody.querySelectorAll('[data-inv-desc]').forEach(c=> tbody.__invDescRO.observe(c));
  }
  tbody.querySelectorAll('[data-inv-del]').forEach(c=>c.addEventListener("click",()=>{
    STATE.inventario.splice(parseInt(c.dataset.invDel,10),1);
    renderInvTable(); refreshInvTotal(); queueSave();
  }));
  refreshInvTotal();
}

function refreshInvTotal(){
  const total = STATE.inventario.reduce((sum,it)=> sum + (it[0]==="\u2713" ? (parseFloat(it[2])||0) : 0), 0);
  const cap = STATE.capacitaMax || 1;
  const pct = Math.max(0, Math.min(100, total/cap*100));
  const fill = document.getElementById("inv-bar-fill");
  if (fill){
    fill.style.width = pct+"%";
    fill.style.background = pct<70 ? "var(--good)" : (pct<100 ? "var(--gold)" : "var(--bad)");
  }
  const totalEl = document.getElementById("inv-total");
  if (totalEl) totalEl.textContent = total + " / " + cap + " P";
}

   RENDER: DIVERGENZA
   ============================================================ */
/* Raggruppa voci di ambiti/campiAttiva che condividono un terzo elemento (chiave di gruppo)
   in un unico box "subcard", cos\u00ec da non frammentare blocchi concettuali unici della fonte
   originale (es. "Super Abilit\u00e0" di Katan, "Emocrachia"/"Purgatorio di Rasta" di Ervork).
   Le voci senza chiave di gruppo (2 elementi: [nome, descrizione]) si comportano come prima,
   una subcard indipendente ciascuna. Pensata per essere manipolabile dal futuro Master Editor:
   ogni sotto-voce mantiene il proprio id ancora (anchor-slug) per i link di navigazione rapida. */
function renderGroupedSubcards(arr, tagLabel, tagClass, fieldName){
  const masterOn = isMasterEditorOn();
  const groups = [];
  const byKey = {};
  (arr||[]).forEach((entry,idx)=>{
    const n = entry[0], d = entry[1], g = entry[2];
    if (g){
      if (!byKey[g]){ byKey[g] = { key:g, items:[] }; groups.push(byKey[g]); }
      byKey[g].items.push([n,d,idx]);
    } else {
      groups.push({ key:null, items:[[n,d,idx]] });
    }
  });
  const itemFields = (n,d,idx,headingTag)=>{
    if (!masterOn){
      return `<${headingTag}>${n}</${headingTag}><div style="color:var(--text-dim);font-size:13.5px;">${d}</div>`;
    }
    const nameField = `<input type="text" class="master-name-input" data-master-field="${fieldName}|${idx}|nome" value="${esc(n)}">`;
    const descField = `<div class="rich" contenteditable="true" style="color:var(--text-dim);font-size:13.5px;" data-master-field="${fieldName}|${idx}|desc">${d}</div>`;
    return nameField + descField;
  };
  return groups.map(grp=>{
    if (!grp.key){
      const [n,d,idx] = grp.items[0];
      const toolbar = masterOn ? masterToolbarHtml(fieldName, idx) : "";
      return `<div class="subcard" id="anchor-${slugify(n)}"${masterOn?masterBoxStyle(fieldName, idx):""}>
        ${toolbar}
        <span class="tag ${tagClass}">${tagLabel}</span>
        ${itemFields(n,d,idx,"h3")}
      </div>`;
    }
    const body = grp.items.map(([n,d,idx])=>{
      const toolbar = masterOn ? masterToolbarHtml(fieldName, idx, {noWidth:true}) : "";
      return `<div class="subcard-subsection" id="anchor-${slugify(n)}">
        ${toolbar}
        ${itemFields(n,d,idx,"h4")}
      </div>`;
    }).join("");
    return `<div class="subcard subcard-grouped"><span class="tag ${tagClass}">${tagLabel}</span><h3>${grp.key}</h3>${body}</div>`;
  }).join("");
}
function renderDivergenza(){
  const masterOn = isMasterEditorOn();
  const ambiti = renderGroupedSubcards(STATE.ambiti, "Ambito", "tag-ambito", "ambiti");
  const campi = renderGroupedSubcards(STATE.campiAttiva, "Campo", "tag-campo", "campiAttiva");

/* Editor Master: ridimensionamento verticale persistente dei riquadri di
   Info & Carattere (STATE.lore[i].h), sullo stesso principio gi\u00e0 usato
   per i Ritratti: il resize nativo CSS (angolo in basso a destra) resta
   disponibile solo in modalit\u00e0 Master; al rilascio del trascinamento
   l'altezza raggiunta viene salvata in STATE.lore[i].h e resta quindi
   persistente tra render/reload/export/import (non un semplice resize CSS
   volatile). Se h \u00e8 assente il riquadro mantiene l'aspetto originale.
   Il giocatore non vede mai la maniglia di resize. */
function initLoreResize(){
  document.querySelectorAll('.subcard[data-lore-box]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      if (!isMasterEditorOn()) return;
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const idx = el.dataset.loreBox;
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = growBoxToFitContent(el);
        if (h && STATE.lore[idx] && h !== STATE.lore[idx].h){
          STATE.lore[idx].h = h;
          queueSave();
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
}

/* Editor Master: ridimensionamento verticale persistente dei ritratti.
   Il resize nativo CSS (angolo in basso a destra del riquadro) resta
   disponibile solo in modalit\u00e0 Master; al rilascio del trascinamento
   l'altezza raggiunta viene salvata in STATE.portraits[i].h e resta quindi
   persistente tra render/reload/export/import (non un semplice resize CSS
   volatile). L'immagine usa object-fit per non deformarsi mai quando il
   riquadro ha un'altezza personalizzata. Solo il Master pu\u00f2 ridimensionare
   il riquadro; il giocatore pu\u00f2 sempre cambiare immagine e didascalia. */
function initPortraitResize(){
  document.querySelectorAll('.portrait[data-portrait-idx]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      if (!isMasterEditorOn()) return;
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const idx = el.dataset.portraitIdx;
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = Math.round(el.getBoundingClientRect().height);
        if (h && STATE.portraits[idx] && h !== STATE.portraits[idx].h){
          STATE.portraits[idx].h = h;
          el.classList.add("has-h");
          queueSave();
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
}

/* Migrazione hidden di Evoluzioni Future: se una voce ha gi\u00e0 un valore
   booleano per "hidden" (salvataggio esistente, o gi\u00e0 impostato dal
   Master con l'occhio), viene rispettato cos\u00ec com'\u00e8. Se invece
   "hidden" \u00e8 assente (voce mai migrata), viene inizializzato secondo
   la regola: livelli fino al 10 compreso (e l'eventuale livello 11 gi\u00e0
   presente nella fonte) visibili di default, livelli dal 12 in poi
   nascosti di default. Non crea n\u00e9 elimina mai livelli. */
function evoLevelNumber(lv){
  const m = String((lv && lv.livello) || "").match(/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}
function migrateEvoHiddenDefaults(list){
  (list || []).forEach(lv=>{
    if (typeof lv.hidden !== "boolean"){
      const n = evoLevelNumber(lv);
      lv.hidden = (n !== null && n >= 12);
    }
  });
}
function renderEvoluzioni(){
  const list = STATE.evoluzioniFuturi || [];
  migrateEvoHiddenDefaults(list);
  const masterOn = isMasterEditorOn();
  const visibleList = masterOn ? list : list.filter(lv=>!lv.hidden);
  const items = list.map((lv,i)=>{
    if (!masterOn && lv.hidden) return "";
    const eyeCtl = masterOn
      ? `<button type="button" class="master-mini-btn master-eye-btn${lv.hidden?' is-hidden':''}" data-master-evo-eye="${i}" title="${lv.hidden?'Nascosto al giocatore \u2014 clic per mostrare':'Visibile al giocatore \u2014 clic per nascondere'}">${lv.hidden?'\ud83d\ude48':'\ud83d\udc41\ufe0f'}</button>`
      : "";
    return `
    <details class="evo-level${masterOn && lv.hidden ? ' master-hidden-item' : ''}">
      <summary>${eyeCtl}${esc(lv.livello)}</summary>
      <div class="evo-content rich" ${masterOn ? 'contenteditable="true"' : ''} data-rich-evo="${i}">${lv.html}</div>
    </details>`;
  }).join("");

  document.getElementById("panel-evoluzioni").innerHTML = (visibleList.length || masterOn) ? `
    <div class="card">
      <h2>Evoluzioni Future & Poteri Futuri <small>testo originale non ancora sbloccato in gioco</small></h2>
      <p class="evo-note">Contenuto trascritto verbatim dalla scheda originale: poteri, trasformazioni e privilegi dei livelli successivi a quello attuale del personaggio, non ancora disponibili in gioco. Clic su una voce per espanderla.</p>
      <div class="evo-list">${items || '<p class="muted">Nessun contenuto di livello futuro trovato nel documento originale di questo personaggio.</p>'}</div>
    </div>
  ` : '';

  document.querySelectorAll('[data-rich-evo]').forEach(el=>{
    el.addEventListener("input", ()=>{ STATE.evoluzioniFuturi[el.dataset.richEvo].html = el.innerHTML; queueSave(); });
  });
  document.querySelectorAll('[data-master-evo-eye]').forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(btn.dataset.masterEvoEye);
      STATE.evoluzioniFuturi[idx].hidden = !STATE.evoluzioniFuturi[idx].hidden;
      renderEvoluzioni();
      queueSave();
    });
  });
}

const HERO_ZOOM_MIN = 1, HERO_ZOOM_MAX = 2.5, HERO_ZOOM_STEP = 0.1;
function clampHeroZoom(z){ return Math.max(HERO_ZOOM_MIN, Math.min(HERO_ZOOM_MAX, z)); }
function setHeroZoom(z){
  STATE.heroBgZoom = clampHeroZoom(z);
  applyHeroBg();
  queueSave();
}
function initHeroZoom(){
  const zoomOut = document.getElementById("hero-zoom-out");
  const zoomIn = document.getElementById("hero-zoom-in");
  const hero = document.getElementById("hero");
  if (zoomOut) zoomOut.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); setHeroZoom((STATE.heroBgZoom||1) - HERO_ZOOM_STEP); });
  if (zoomIn) zoomIn.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); setHeroZoom((STATE.heroBgZoom||1) + HERO_ZOOM_STEP); });
  if (hero) hero.addEventListener("wheel", (e)=>{
    e.preventDefault();
    setHeroZoom((STATE.heroBgZoom||1) + (e.deltaY < 0 ? HERO_ZOOM_STEP : -HERO_ZOOM_STEP));
  }, { passive:false });
}
function applyHeroBg(){
  const hero = document.getElementById("hero");
  const heroBg = document.getElementById("hero-bg");
  if (!hero || !heroBg) return;
  heroBg.style.backgroundPosition = STATE.heroBgPos.x + "% " + STATE.heroBgPos.y + "%";
  if (STATE.heroBgImage){
    heroBg.style.backgroundImage = "linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.75)), url('" + STATE.heroBgImage + "')";
  } else {
    heroBg.style.backgroundImage = "";
  }
  const heroZoom = STATE.heroBgZoom || 1;
  heroBg.style.transform = "scale(" + heroZoom + ")";
  const zoomLabel = document.getElementById("hero-zoom-label");
  if (zoomLabel) zoomLabel.textContent = Math.round(heroZoom * 100) + "%";
}

function clamp01to100(v){ return Math.max(0, Math.min(100, v)); }

function initHeroDrag(){
  const hero = document.getElementById("hero");
  if (!hero) return;
  let dragging = false, startX = 0, startY = 0, startPos = {x:50,y:20};

  hero.addEventListener("pointerdown", (e)=>{
    if (e.target.closest("input, .hero-chip, .hero-hint")) return;
    dragging = true;
    hero.classList.add("dragging");
    startX = e.clientX; startY = e.clientY;
    startPos = { x: STATE.heroBgPos.x, y: STATE.heroBgPos.y };
    hero.setPointerCapture(e.pointerId);
  });
  hero.addEventListener("pointermove", (e)=>{
    if (!dragging) return;
    const rect = hero.getBoundingClientRect();
    const dx = e.clientX - startX, dy = e.clientY - startY;
    const newX = clamp01to100(startPos.x - (dx / rect.width) * 100);
    const newY = clamp01to100(startPos.y - (dy / rect.height) * 100);
    STATE.heroBgPos = { x:newX, y:newY };
    applyHeroBg();
  });
  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    hero.classList.remove("dragging");
    try{ hero.releasePointerCapture(e.pointerId); }catch(err){}
    queueSave();
  }
  hero.addEventListener("pointerup", endDrag);
  hero.addEventListener("pointercancel", endDrag);
  hero.addEventListener("pointerleave", (e)=>{ if(dragging) endDrag(e); });
}
