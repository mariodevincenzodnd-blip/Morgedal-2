      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.10), transparent 60%),

    -webkit-font-smoothing:antialiased;
    padding-bottom:0;
  }

  a{color:var(--gold-bright);}

  }
  .hero.dragging{cursor:grabbing;}
  .hero-zoom-btn{
    background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.25);
    color:rgba(237,227,208,0.9);width:18px;height:18px;line-height:16px;
    border-radius:50%;font-size:12px;cursor:pointer;padding:0;margin:0 1px;
    font-family:var(--mono);vertical-align:middle;
  }
  .hero-zoom-btn:hover{background:rgba(0,0,0,0.7);}
  #hero-zoom-label{font-family:var(--mono);font-size:10px;margin:0 3px;vertical-align:middle;}
  .hero-hint{
    position:absolute;top:12px;right:16px;font-size:10px;letter-spacing:.4px;
    color:rgba(237,227,208,0.8);background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);
    padding:4px 11px;border-radius:12px;transition:opacity .2s;opacity:0.55;z-index:2;
  }
  .hero:hover .hero-hint{opacity:1;}

  .hero::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, var(--identity), var(--identity2));z-index:2;
  }
  .hero-inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .hero-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(38px,6vw,64px);
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-bright);
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    margin:0;
  }
  .hero-sub{font-family:var(--serif);font-style:italic;color:var(--text-dim);font-size:15px;margin-top:6px;}
  .hero-meta{display:flex;gap:10px;flex-wrap:wrap;}
  .hero-chip{
    background:rgba(20,16,14,0.65);
    border:1px solid var(--border);
    border-radius:20px;
    padding:6px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    backdrop-filter: blur(2px);
  }
  .hero-chip b{color:var(--gold-bright);font-weight:600;}
  .tipo-label{opacity:.65;font-size:11px;letter-spacing:.5px;}
  .hero-chip-tipo{border-color:var(--identity);}
  .hero-chip-tipo b{color:var(--identity);}
  .hero-chip-id{display:flex;flex-direction:column;gap:1px;padding:5px 14px 6px;}
  .hero-chip-label{
    font-size:8px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-faint);font-weight:600;line-height:1.3;
  }
  .quicknav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;}
  .quicknav-pill{
    display:inline-flex;align-items:center;gap:5px;
    background:color-mix(in srgb, var(--identity) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--identity) 45%, transparent);
    border-radius:14px;padding:4px 12px;font-size:12px;color:var(--identity);
    cursor:pointer;transition:background .15s,color .15s;
  }
  .quicknav-pill:hover{background:color-mix(in srgb, var(--identity) 25%, transparent);color:var(--gold-bright);}
  .quicknav-pill::before{content:"\2197";font-size:11px;}
  @keyframes anchorFlash{0%,100%{box-shadow:none;}30%{box-shadow:0 0 0 3px var(--gold);}}
  .anchor-flash{animation:anchorFlash 1.4s ease;}
  .editable-name{
    background:transparent;border:none;color:var(--gold-bright);font-family:var(--serif);
    font-weight:700;font-size:64px;letter-spacing:2px;text-transform:uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    border-bottom:1px dashed transparent; padding:0; width:100%; max-width:100%;
    white-space:nowrap; overflow:hidden;
  }
  @media (max-width:720px){ .editable-name{ font-size:38px; } }
  .editable-name:hover, .editable-name:focus{border-bottom:1px dashed var(--gold); outline:none;}

  /* ---------- TABS ---------- */
  .tabbar{
    position:sticky;top:0;z-index:50;
    background:rgba(15,13,12,0.94);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    white-space:nowrap;
  }
  .tabbar-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 16px;}
  .tab-btn{
    background:none;border:none;color:var(--text-dim);
    font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:0.4px;
    padding:14px 16px;cursor:pointer;border-bottom:2px solid transparent;
    text-transform:uppercase;transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-bright);border-bottom:2px solid var(--gold);}
  .dot-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--identity);margin-left:6px;filter:drop-shadow(0 0 4px var(--identity));animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---------- CARDS / GRID ---------- */
  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:1.6px;
    color:var(--gold);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .card h2 small{font-family:var(--sans);text-transform:none;letter-spacing:0;color:var(--text-faint);font-size:11px;}
  .grid{display:grid;gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  @media (max-width:820px){.grid-4,.grid-3,.grid-6{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.grid-4,.grid-3,.grid-2,.grid-6{grid-template-columns:1fr 1fr;}}
  @media (max-width:700px){.grid-2{grid-template-columns:1fr;}}
  @media (max-width:520px){#equip-slots-grid{grid-template-columns:1fr;}}
  @media (max-width:480px){.grid-3{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-faint);}
  .field input[type=text], .field input[type=number], select, textarea{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%;
  }
  .field input:focus, textarea:focus, select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  textarea{resize:vertical;font-family:var(--sans);line-height:1.55;}

  /* ---------- ABILITY SCORES ---------- */
  .abil-box{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:14px;text-align:center;position:relative;
  }
  .abil-box .name{font-size:11px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .abil-box input[type=number]{
    width:64px;text-align:center;font-size:20px;font-weight:700;font-family:var(--mono);
    background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);
    margin:8px auto 6px;padding:4px 0;
  }
  .abil-box .mod{
    font-family:var(--mono);font-size:22px;color:var(--gold-bright);font-weight:700;
    width:60px;text-align:center;background:transparent;border:1px solid transparent;
    border-radius:6px;padding:2px 0;margin:0 auto;display:block;
  }
  .abil-box .mod:hover{border-color:var(--border-soft);}
  .abil-box .mod:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  .abil-box .mod.is-override{color:var(--text);border-color:var(--gold);background:var(--bg-panel-3);}

  /* ---------- STAT PILLS ---------- */
  .statpill{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px;text-align:center;}
  .statpill label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);margin-bottom:6px;}
  .statpill input{width:100%;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;background:transparent;border:none;color:var(--gold-bright);}
  .statpill input:focus{outline:none;}

  /* ---------- HP ---------- */
  .hp-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .hp-track{flex:1;min-width:220px;height:22px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;position:relative;}
  .hp-fill{height:100%;background:linear-gradient(90deg,#7a2a24,var(--bad));transition:width .3s;}
  .hp-numbers{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:15px;}
  .hp-numbers input{width:64px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);border-radius:6px;padding:6px 2px;}
  .hp-row-temp{margin-top:6px;}
  .hp-track-temp{height:14px;}
  .hp-fill-temp{height:100%;background:linear-gradient(90deg,#8a5a1f,var(--amber));transition:width .3s;}
  .btn{
    background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.3px;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn.primary{background:linear-gradient(180deg, #3a2a12, #241a0c);border-color:var(--gold);color:var(--gold-bright);}
  .btn.small{padding:4px 9px;font-size:11px;}
  .btn.danger:hover{border-color:var(--bad);color:#ff9d90;}

  /* ---------- SKILL LIST ---------- */
  .skill-row{display:grid;grid-template-columns:1fr 46px 60px;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border-soft);}
  .skill-row:last-child{border-bottom:none;}
  .skill-name{font-size:13.5px;}
  .skill-abbr{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);text-align:center;background:var(--bg-panel-3);border-radius:5px;padding:3px 0;}
  .skill-row input[type=number]{width:100%;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:6px;padding:5px 0;font-family:var(--mono);font-weight:700;}

  /* ---------- SAVES ---------- */
  .save-row{display:grid;grid-template-columns:26px 1fr 60px;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--border-soft);}
  .save-row:last-child{border-bottom:none;}
  .save-row .modbadge{font-family:var(--mono);text-align:center;color:var(--gold-bright);font-weight:700;background:var(--bg-panel-3);border-radius:6px;padding:5px 0;}
  .save-row input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;}

  /* ---------- PIPS / TRACKERS ---------- */
  .tracker{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .tracker:last-child{border-bottom:none;}
  .tracker .t-name{font-size:13.5px;font-weight:600;color:var(--text);min-width:190px;}
  .tracker .t-desc{font-size:11.5px;color:var(--text-faint);flex:1;min-width:160px;}
  .pips{display:flex;gap:6px;}
  .pip{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);
    cursor:pointer;background:transparent;transition:background .15s, box-shadow .15s;
  }
  .pip.used{background:radial-gradient(circle at 35% 30%, var(--violet), var(--violet-dim));box-shadow:0 0 8px rgba(148,80,216,0.8);border-color:var(--violet);}
  .pip.slot-pip.used{background:radial-gradient(circle at 35% 30%, var(--gold-bright), #a3792c);box-shadow:0 0 8px rgba(201,163,78,0.75);border-color:var(--gold);}
  .pip.slot-pip.pip-red{border-color:#e0524a;}
  .pip.slot-pip.pip-red.used{background:radial-gradient(circle at 35% 30%, #ff8a7a, #a8302a);box-shadow:0 0 9px rgba(224,82,74,0.8);border-color:#e0524a;}
  .pip.death{border-color:var(--bad);}
  .pip.death.death-success{border-color:var(--good);}
  .pip.death.death-success.used{background:radial-gradient(circle at 35% 30%, #8fc97e, var(--good));box-shadow:0 0 8px rgba(111,154,99,0.7);border-color:var(--good);}
  .pip.death.death-fail.used{background:radial-gradient(circle at 35% 30%, #e0685a, var(--bad));box-shadow:0 0 8px rgba(224,104,90,0.7);border-color:var(--bad);}
  .pip.pip-special{border-color:#c46be0;}
  .pip.pip-special.used{background:radial-gradient(circle at 35% 30%, #d98af0, #8a3aa8);box-shadow:0 0 9px rgba(196,107,224,0.85);border-color:#c46be0;}
  .slot-lvl-special{background:rgba(196,107,224,0.06);border-radius:8px;padding-left:8px !important;padding-right:8px !important;}
  .slot-note{font-size:10.5px;color:#c46be0;font-style:italic;flex-basis:100%;order:5;}
  .pip.fail{border-color:var(--text-faint);}

  /* ---------- SLOTS ---------- */
  .slot-lvl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .slot-lvl:last-child{border-bottom:none;}
  .slot-lvl .lvl-badge{font-family:var(--serif);font-weight:700;color:var(--gold-bright);width:78px;font-size:13px;}
  .slot-lvl input.maxslot{width:42px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-faint);border-radius:5px;font-size:11px;padding:3px 0;}

  /* ---------- RICH TEXT ---------- */
  .rich{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;
    padding:12px 14px;font-size:14px;line-height:1.65;color:var(--text);
  }
  .rich:focus{outline:none;border-color:var(--gold);}
  .rich b, .rich strong{color:var(--gold-bright);}
  /* Editor Master: consente di ridimensionare verticalmente (drag dell'angolo in basso
     a destra) i riquadri di testo modificabili, sullo stesso principio già usato per le
     Note. Attivo solo quando l'Editor Master è acceso (classe su <body>), quindi mai
     visibile o utilizzabile in modalità giocatore. */
  body.master-editor-on .rich[contenteditable]{
    resize:vertical;overflow:auto;min-height:60px;
  }
  body.master-editor-on .inv-desc{
    /* niente overflow:auto qui: la descrizione non deve mai avere uno
       scroll interno. Il Master pu\u00f2 comunque ingrandirla manualmente
       (resize:vertical); se prova a ridurla sotto l'altezza del contenuto,
       il listener ResizeObserver in renderInvTable() la fa risnappare. */
    resize:vertical;overflow:hidden;min-height:44px;
  }
  /* Blocco 1: in Editor Master ogni riquadro/tabella (non solo l'inventario)
     deve potersi ridimensionare verticalmente, con lo stesso comportamento
     già usato per le Note: resize manuale dall'angolo in basso a destra. */
  body.master-editor-on .subcard,
  body.master-editor-on .tracker,
  body.master-editor-on textarea{
    resize:vertical;overflow:auto;
  }
  body.master-editor-on .subcard{min-height:80px;}
  body.master-editor-on .tracker{min-height:56px;}
  .subcard{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .subcard h3{margin:0 0 8px;font-family:var(--serif);font-size:14.5px;color:var(--gold-bright);letter-spacing:.4px;}
  .subcard .tag{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);background:rgba(255,255,255,0.05);border:1px solid var(--border-soft);border-radius:10px;padding:2px 9px;margin-bottom:8px;}
  .subcard .tag.tag-passiva{color:var(--amber);background:rgba(224,138,58,0.14);border-color:var(--amber-dim);}
  .subcard .tag.tag-truccetto{color:var(--blue);background:rgba(79,143,214,0.12);border-color:var(--blue-dim);}
  .subcard .tag.tag-abilita{color:var(--red-glow);background:rgba(201,70,59,0.14);border-color:rgba(201,70,59,0.45);}
  .subcard .tag.tag-incantesimo{color:var(--violet);background:rgba(148,80,216,0.12);border-color:var(--violet-dim);}
  .subcard .tag.tag-ambito{color:var(--teal);background:rgba(47,184,172,0.14);border-color:var(--teal-dim);}
  .subcard .tag.tag-campo{color:var(--good);background:rgba(111,154,99,0.14);border-color:rgba(111,154,99,0.45);}
  .subcard-grouped{grid-column:1/-1;}
  .subcard-subsection{padding-top:10px;margin-top:10px;border-top:1px dashed var(--border-soft);}
  .subcard-subsection:first-of-type{border-top:none;margin-top:6px;padding-top:0;}
  .subcard-subsection h4{margin:0 0 4px;font-size:13.5px;color:var(--gold-bright);font-family:var(--serif);}

  /* ---------- MASTER EDITOR (visibile solo in modalità Editor Master) ---------- */
  .master-toolbar{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-bottom:8px;padding:4px 6px;border-radius:6px;
    background:rgba(148,80,216,0.08);border:1px dashed var(--violet-dim);
  }
  .master-cat-select, .master-box-width{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:5px;font-size:10px;padding:2px 4px;max-width:120px;
  }
  .master-mini-btn, .master-mini-del{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:5px;font-size:11px;padding:2px 7px;cursor:pointer;line-height:1.3;
  }
  .master-mini-btn:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  .master-mini-del{color:var(--bad);}
  .master-mini-del:hover{border-color:var(--bad);}
  .master-eye-btn.is-hidden{color:var(--bad);border-color:rgba(176,74,63,0.5);}
  .master-hidden-item{opacity:0.55;border-style:dashed;}
  .master-add-btn{margin-top:8px;}
  .master-name-input{
    display:block;width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border-soft);
    color:var(--gold-bright);font-family:var(--serif);font-size:14.5px;letter-spacing:.4px;
    margin:0 0 8px;padding:0 0 4px;
  }
  .master-name-input:focus{outline:none;border-color:var(--gold-bright);}
  .master-tag-input, .master-uso-input{
    display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;
    background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:10px;padding:2px 9px;margin-bottom:8px;width:auto;max-width:220px;
  }
  [data-master-field][contenteditable="true"]{border-radius:4px;}
  [data-master-field][contenteditable="true"]:focus{outline:1px dashed var(--violet-dim);}
  .home-link{
    position:fixed;top:14px;left:16px;z-index:60;
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    text-decoration:none;white-space:nowrap;transition:border-color .15s, color .15s;
  }
  .home-link:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  @media (max-width:760px){
    .home-link{position:static;display:inline-flex;margin:0 0 10px;}
  }

  .master-editor-toggle{
    display:none;position:fixed;bottom:14px;left:16px;z-index:60;
    align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;white-space:nowrap;
  }
  .master-editor-toggle.show{display:flex;}
  .master-editor-toggle:hover{border-color:var(--gold-bright);}
  .master-editor-toggle.on{background:rgba(148,80,216,0.18);color:var(--violet);border-color:var(--violet);}
  @media (max-width:760px){
    .master-editor-toggle{position:static;margin:0 0 10px;}
  }

  .master-color-picker{
    display:none;position:fixed;bottom:60px;left:16px;z-index:60;
    align-items:center;gap:8px;padding:6px 12px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    white-space:nowrap;
  }
  .master-color-picker.show{display:flex;}
  .master-color-picker input[type=color]{
    width:30px;height:22px;border:none;border-radius:6px;padding:0;
    background:none;cursor:pointer;
  }
  @media (max-width:760px){
    .master-color-picker{position:static;margin:0 0 10px;}
  }

  /* ---------- EVOLUZIONI FUTURE (pannelli richiudibili) ---------- */
  .evo-note{font-size:12.5px;color:var(--text-faint);margin:-6px 0 14px;line-height:1.5;}
  .evo-level{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .evo-level:last-child{margin-bottom:0;}
  .evo-level summary{
    cursor:pointer;padding:13px 16px;font-family:var(--serif);font-weight:700;
    color:var(--gold-bright);letter-spacing:.4px;list-style:none;display:flex;align-items:center;gap:8px;
  }
  .evo-level summary::-webkit-details-marker{display:none;}
  .evo-level summary::before{content:"\25B8";color:var(--gold);transition:transform .15s;}
  .evo-level[open] summary::before{transform:rotate(90deg);}
  .evo-level summary:hover{color:var(--gold);}
  .evo-content{padding:0 16px 16px 16px;border-top:1px solid var(--border-soft);padding-top:12px;}
  .evo-content p{margin:0 0 10px;}
  .evo-content p:last-child{margin-bottom:0;}

  /* ---------- EQUIP GRID ---------- */
  .equip-slot{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .equip-slot label{display:block;font-size:10px;text-transform:uppercase;color:var(--text-faint);letter-spacing:1px;margin-bottom:4px;}
  .equip-slot input{width:100%;background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:14px;}
  .equip-slot input:focus{outline:none;}
  .img-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .thumb{width:42px;height:42px;border-radius:7px;object-fit:cover;border:1px solid var(--border-soft);background:var(--bg-panel-3);cursor:pointer;}
  .thumb-placeholder{width:42px;height:42px;border-radius:7px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:17px;background:var(--bg-panel-3);cursor:pointer;flex-shrink:0;}
  .thumb-placeholder:hover, .thumb:hover{border-color:var(--gold);}
  /* Miniature Equipaggiamento: più grandi rispetto a quelle dell'Inventario */
  #equip-slots-grid .img-row{flex-wrap:wrap;gap:10px;}
  #equip-slots-grid .thumb, #equip-slots-grid .thumb-placeholder{width:96px;height:96px;border-radius:10px;}
  #equip-slots-grid .thumb-placeholder{font-size:30px;}
  .file-btn{font-size:10.5px;color:var(--text-dim);cursor:pointer;border:1px solid var(--border-soft);border-radius:6px;padding:4px 8px;background:var(--bg-panel-2);white-space:nowrap;}
  .file-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .file-input-hidden{display:none;}
  .img-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;}
  .img-remove:hover{color:var(--bad);}

  /* ---------- INGRANDIMENTO IMMAGINE (solo Equipaggiamento) ---------- */
  .img-zoom{
    background:none;border:1px solid var(--border-soft);border-radius:6px;color:var(--text-faint);
    cursor:pointer;font-size:13px;width:24px;height:24px;line-height:1;flex-shrink:0;
  }
  .img-zoom:hover{border-color:var(--gold);color:var(--gold-bright);}
  .img-lightbox{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;}
  .img-lightbox[hidden]{display:none;}
  .img-lightbox-backdrop{position:absolute;inset:0;background:rgba(10,8,7,0.95);backdrop-filter:blur(4px);}
  .img-lightbox-content{
    position:relative;width:100%;height:100%;max-width:min(98vw,2200px);max-height:97vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transform:scale(.96);opacity:0;transition:transform .16s ease,opacity .16s ease;
  }
  .img-lightbox.show .img-lightbox-content{transform:scale(1);opacity:1;}
  .img-lightbox-content img{display:block;max-width:100%;max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:12px;border:1px solid var(--border-soft);box-shadow:0 16px 60px rgba(0,0,0,0.6);}
  .img-lightbox-caption{color:var(--gold-bright);font-size:15px;font-weight:600;text-align:center;}
  .img-lightbox-caption[hidden]{display:none;}
  .img-lightbox-close{
    position:absolute;top:-16px;right:-16px;width:42px;height:42px;border-radius:50%;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    font-size:24px;line-height:1;cursor:pointer;
  }
  .img-lightbox-close:hover{border-color:var(--gold);color:var(--gold-bright);}
  @media (max-width:720px){
    .img-lightbox{padding:8px;}
    .img-lightbox-content{max-width:100vw;max-height:100vh;gap:10px;}
    .img-lightbox-content img{max-height:calc(100vh - 70px);}
    .img-lightbox-close{top:-13px;right:2px;width:38px;height:38px;font-size:22px;}
  }

  /* ---------- INVENTORY ---------- */
  .inv-cap{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .inv-bar{flex:1;min-width:200px;height:16px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;}
  .inv-bar-fill{height:100%;transition:width .3s, background .3s;}
  .inv-table{width:100%;border-collapse:collapse;}
  .inv-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);padding:6px 8px;border-bottom:1px solid var(--border);}
  .inv-table td{padding:6px 8px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
  .inv-table td.imgcell{width:56px;}
  .inv-table input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;}
  .inv-table input[type=text]{background:transparent;border:none;color:var(--text);font-weight:600;width:100%;}
  .inv-table input[type=text]:focus, .inv-table textarea:focus{outline:none;background:var(--bg-panel-2);border-radius:4px;}
  .inv-table input[type=number]{width:52px;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:5px;text-align:center;font-family:var(--mono);}
  .inv-table textarea{width:100%;background:transparent;border:none;color:var(--text-dim);font-size:12.5px;min-height:28px;font-family:var(--sans);}

  /* ---------- INVENTARIO (card, non tabella) ---------- */
  #inv-list{display:flex;flex-direction:column;gap:8px;}
  .inv-item{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .inv-item-top{display:flex;align-items:center;gap:10px;}
  .inv-item-top input[type=checkbox]{accent-color:var(--gold);width:17px;height:17px;flex-shrink:0;}
  .inv-item .imgcell{flex-shrink:0;}
  .inv-item .inv-name{flex:1;min-width:0;background:transparent;border:none;color:var(--text);font-weight:700;font-size:14.5px;padding:4px 2px;}
  .inv-item .inv-name:focus{outline:none;background:var(--bg-panel-3);border-radius:4px;}
  .inv-peso-row{display:flex;justify-content:flex-end;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
  .inv-peso-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .inv-peso-wrap input[type=number]{width:48px;background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:5px;text-align:center;font-family:var(--mono);padding:4px 2px;}
  .inv-peso-wrap label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);}
  .inv-desc{
    width:100%;background:transparent;border:none;color:var(--text-dim);font-size:13px;line-height:1.55;
    font-family:var(--sans);margin-top:6px;resize:none;overflow:hidden;padding:4px 2px;min-height:20px;
  }
  .inv-desc:focus{outline:none;background:var(--bg-panel-3);border-radius:4px;}
  .inv-desc::placeholder{color:var(--text-faint);}
  .inv-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;}
  .inv-remove:hover{color:var(--bad);}

  /* ---------- PORTRAITS ---------- */
  .portraits{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){.portraits{grid-template-columns:1fr;}}
  .portrait{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-soft);}
  /* Il resize verticale nativo (angolo in basso a destra) \u00e8 disponibile
     solo in Editor Master: solo il Master controlla la dimensione del
     riquadro, il giocatore controlla solo immagine e didascalia. */
  body.master-editor-on .portrait{resize:vertical;}
  .portrait img{width:100%;display:block;filter:saturate(1.05) contrast(1.03);cursor:pointer;}
  /* Quando il riquadro ha un'altezza personalizzata (persistita dal
     Master), l'immagine usa object-fit:cover per non deformarsi mai. */
  .portrait.has-h img{height:100%;object-fit:cover;}
  .portrait .cap{
    position:absolute;bottom:0;left:0;right:0;padding:10px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
    font-family:var(--serif);letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:var(--gold-bright);
    border:none;outline:none;width:100%;box-sizing:border-box;
  }
  .portrait .cap:focus{background:linear-gradient(0deg, rgba(0,0,0,0.92), rgba(0,0,0,0.35));}

  /* ---------- NOTES ---------- */
  .note-entry{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .note-entry .note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .note-entry input[type=text]{background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:13px;width:70%;}
  .note-entry input[type=text]:focus{outline:none;}
  .note-entry textarea{background:transparent;border:none;color:var(--text);width:100%;min-height:70px;font-size:13.5px;}
  .note-entry textarea:focus{outline:none;}
  .note-date{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}

  .savebar{
    position:static;margin:28px 0 40px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    max-width:min(94vw, 620px);justify-content:flex-end;
    font-size:11px;color:var(--text-faint);
    background:rgba(20,16,14,0.9);border:1px solid var(--border-soft);border-radius:16px;
    padding:8px 10px;
  }
  .savebar b{color:var(--gold-bright);}
  .savebar .btn{padding:5px 11px;font-size:10.5px;border-radius:14px;}
  .savebar .sep{width:1px;height:16px;background:var(--border-soft);}
  .savebar.warn{border-color:var(--bad);}
  .savebar-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--gold-bright);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;flex-shrink:0;white-space:nowrap;
  }
  .savebar-toggle:hover{border-color:var(--gold-bright);}
  .savebar.collapsed{padding:6px 8px;gap:0;}
  .savebar.collapsed .savebar-content{display:none;}

  /* Su smartphone il riquadro comandi non deve restare "fixed" sopra i contenuti
     durante lo scroll: torna nel normale flusso della pagina, in fondo alla scheda.
     Allineato al breakpoint (760px) già usato dal pulsante di comprimi/espandi qui sotto. */
  @media (max-width:760px){
    body{ padding-bottom:0; }
    .savebar{
      position:static;
      bottom:auto; right:auto; left:auto; top:auto;
      width:auto; max-width:none;
      margin:24px 20px 20px;
      justify-content:center;
      backdrop-filter:none;
    }
  }
  .savebar #savebar-status.warn-text{color:#ff9d90;font-weight:600;}
  #btn-print{background:linear-gradient(180deg, #22301f, #182013);border-color:var(--good);}
  #btn-print:hover{color:#b9e0ac;}
  @media (max-width:760px){
    .pip{width:28px;height:28px;}
    .pips{gap:8px;}
    .btn{padding:10px 14px;font-size:13px;}
    .btn.small{padding:8px 12px;}
    .tab-btn{padding:14px 15px;}
  }

  .divider-label{font-family:var(--serif);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);margin:22px 0 8px;text-align:center;position:relative;}
  .divider-label::before,.divider-label::after{content:"";position:absolute;top:50%;width:38%;height:1px;background:var(--border);}
  .divider-label::before{left:0;}
  .divider-label::after{right:0;}

  /* ---------- SCHERMATA DI ACCESSO ---------- */
  #lock-screen{
    position:fixed;inset:0;z-index:9999;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.12), transparent 60%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .lock-box{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);border-radius:12px;
    padding:32px 30px;max-width:340px;width:100%;text-align:center;
  }
  .lock-box h2{
    font-family:var(--serif);color:var(--gold-bright);text-transform:uppercase;letter-spacing:1.6px;
    font-size:20px;margin:0 0 8px;
  }
  .lock-box p{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
  .lock-box input[type=password]{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:10px 12px;font-size:14px;width:100%;text-align:center;margin-bottom:12px;
  }
  .lock-box input:focus{outline:none;border-color:var(--gold);}
  .lock-box button{
    background:linear-gradient(180deg, #3a2a12, #241a0c);border:1px solid var(--gold);color:var(--gold-bright);
    border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;width:100%;
  }
  .lock-box button:hover{opacity:0.9;}
  .lock-error{color:#ff9d90;font-size:12px;margin-top:10px;min-height:14px;}

  /* ---------- STAMPA PULITA ---------- */
  @media print{
    @page{ margin:10mm; }
    body{ background:#fff !important; color:#111 !important; padding-bottom:0 !important; font-size:11px !important; }
    .tabbar, .savebar, .hero-hint, #hero-image-input, #import-input,
    .thumb, .thumb-placeholder, .file-btn, .img-remove, .img-row, .img-zoom, #img-lightbox,
    .inv-remove, #inv-add, #reset-slots, #reset-risorse, #lock-screen{ display:none !important; }
    .wrap{ padding:12px 0 !important; max-width:100% !important; }
    .hero{
      background:none !important; padding:2px 0 8px !important; border-bottom:2px solid #111 !important;
      cursor:default !important;
    }
    .hero::before{ display:none !important; }
    .hero-inner{ align-items:baseline !important; gap:8px !important; }
    .editable-name{ color:#000 !important; text-shadow:none !important; border:none !important; font-size:26px !important; }
    .hero-sub{ color:#444 !important; font-size:11px !important; margin-top:2px !important; }
    .hero-chip{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; backdrop-filter:none !important; padding:2px 9px !important; font-size:10.5px !important; }
    .hero-chip b{ color:#000 !important; }
    .hero-meta{ gap:6px !important; }

    .panel{ display:block !important; }
    .card, .subcard{
      background:#fff !important; border:1px solid #999 !important; box-shadow:none !important;
      page-break-inside:avoid; break-inside:avoid;
      padding:8px 10px !important; margin-bottom:6px !important; border-radius:5px !important;
    }
    .card h2{ color:#000 !important; border-bottom:1px solid #999 !important; font-size:10.5px !important; margin:0 0 6px !important; padding-bottom:3px !important; letter-spacing:.6px !important; }
    .card h2 small{ display:none !important; }
    input, textarea, select{ color:#000 !important; background:transparent !important; border:none !important; font-size:11px !important; padding:2px 3px !important; }
    .rich{ background:#fff !important; border:1px solid #ccc !important; color:#000 !important; padding:6px 8px !important; font-size:10.5px !important; line-height:1.4 !important; }
    .rich b, .rich strong{ color:#000 !important; }

    /* forza colonne compatte indipendentemente dal breakpoint a schermo */
    .grid{ gap:5px !important; }
    .grid-6{ grid-template-columns:repeat(6,1fr) !important; }
    .grid-4{ grid-template-columns:repeat(4,1fr) !important; }
    .grid-3{ grid-template-columns:repeat(3,1fr) !important; }
    .grid-2{ grid-template-columns:repeat(2,1fr) !important; }

    /* caratteristiche: molto più compatte */
    .abil-box{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .abil-box .name{ color:#000 !important; font-size:8.5px !important; letter-spacing:.3px !important; }
    .abil-box input[type=number]{
      color:#000 !important; background:transparent !important; border:none !important;
      font-size:13px !important; width:32px !important; margin:2px auto 1px !important; padding:0 !important;
    }
    .abil-box .mod{ color:#000 !important; font-size:13px !important; }

    .statpill{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .statpill label{ font-size:8.5px !important; margin-bottom:2px !important; }
    .statpill input{ color:#000 !important; font-size:12px !important; }

    .save-row, .skill-row{ padding:3px 4px !important; }
    .save-row .modbadge{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; padding:2px 0 !important; }
    .skill-row input, .inv-table input, .inv-table textarea{ color:#000 !important; }
    .skill-abbr{ background:#fff !important; border:1px solid #ccc !important; color:#333 !important; font-size:9px !important; padding:1px 0 !important; }

    .hp-row{ gap:8px !important; }
    .hp-numbers input{ padding:3px 0 !important; }
    .pip{ width:15px !important; height:15px !important; border-color:#000 !important; }
    .pip.used{ background:#000 !important; box-shadow:none !important; }
    .hp-track, .inv-bar{ height:12px !important; border:1px solid #000 !important; background:#fff !important; }
    .hp-fill, .inv-bar-fill{ background:#999 !important; }

    .equip-slot{ background:#fff !important; border:1px solid #ccc !important; padding:5px 6px !important; }
    .equip-slot label{ font-size:8.5px !important; }
    .equip-slot input{ color:#000 !important; font-size:11px !important; }

    .inv-table th, .inv-table td.imgcell, .inv-table th:nth-child(2){ display:none !important; }
    .inv-table td{ padding:3px 5px !important; }
    .inv-item{ background:#fff !important; border:1px solid #ccc !important; padding:6px 8px !important; }
    .inv-item .imgcell{ display:none !important; }
    .inv-item .inv-name{ color:#000 !important; }
    .inv-peso-wrap input{ color:#000 !important; }
    .inv-desc{ color:#333 !important; }
    .tracker{ padding:5px 0 !important; }
    .slot-lvl{ padding:4px 0 !important; }

    .portraits, .portrait{ display:none !important; }
    .divider-label{ color:#444 !important; margin:10px 0 6px !important; font-size:9.5px !important; }
    .divider-label::before, .divider-label::after{ background:#999 !important; }
    .subcard{ padding:6px 8px !important; }
    .subcard .tag{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; font-size:8.5px !important; padding:1px 7px !important; margin-bottom:4px !important; }
    .subcard h3{ color:#000 !important; font-size:12px !important; margin:0 0 4px !important; }
    a{ color:#000 !important; text-decoration:underline; }
  }

</style>
</head>

<div id="lock-screen">
  <div class="lock-box">
    <h2>Accesso Protetto</h2>
    <p>Inserisci la password per aprire questa scheda.</p>
    <input type="password" id="lock-input" placeholder="Password" autocomplete="off">
    <button id="lock-submit">Sblocca</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<a class="home-link" href="index.html" title="Torna all’elenco dei personaggi">← Home</a>

<div class="hero" id="hero">

  <div class="hero-hint">Trascina per riposizionare · <span id="btn-hero-image" style="text-decoration:underline;cursor:pointer;pointer-events:auto;">cambia immagine</span> · <button type="button" id="hero-zoom-out" class="hero-zoom-btn" title="Riduci zoom" style="pointer-events:auto;">−</button><span id="hero-zoom-label" style="pointer-events:none;">100%</span><button type="button" id="hero-zoom-in" class="hero-zoom-btn" title="Aumenta zoom" style="pointer-events:auto;">+</button></div>

  </div>
</div>

<div class="tabbar">

</div>

<div class="wrap" id="panels"></div>

<button class="master-editor-toggle" id="master-editor-toggle" type="button" title="Attiva/disattiva la modalità di modifica strutturale (solo Master): categorie, titoli, riquadri">🛠️ Editor Master</button>
<div class="master-color-picker" id="master-color-picker" title="Colore identitario di questo personaggio (solo Master)">

  <span id="local-file-status" style="color:var(--gold-bright);font-size:10.5px;"></span>
  <div class="sep"></div>
  <button class="btn" id="btn-google" title="Accedi con Google per salvare automaticamente su Drive">Accedi con Google</button>
  <button class="btn" id="btn-google-load" title="Ricarica l'ultima versione salvata su Drive">Carica da Drive</button>
  <button class="btn" id="btn-google-picker" title="Seleziona un file già condiviso su Google Drive (es. dal Master) invece di crearne uno nuovo">📂 File condiviso</button>
  <span id="google-status" style="color:var(--gold-bright);font-size:10.5px;"></span>
  <span id="google-share-hint" style="color:var(--text-faint);font-size:10.5px;"></span>
  <div class="sep"></div>
  <button class="btn" id="btn-export" title="Scarica un file di backup con tutti i dati della scheda">Esporta backup</button>

  <div class="sep"></div>
  <button class="btn" id="btn-print" title="Versione pulita da stampare, senza sfondi né immagini">Stampa</button>
  <button class="btn" id="btn-new-sheet" title="Crea una scheda vuota per un nuovo personaggio">Nuova scheda</button>
  </div>
</div>

function slugify(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

/* Colore funzionale del "tag" di una capacit\u00e0, dedotto dal testo del tag stesso
   (non dall'array di appartenenza): Passiva = viola, Truccetto = blu, Abilit\u00e0/Incantesimo = rosso. */
function tagColorClass(tag){
  const t = String(tag || "");
  if (/^passiva/i.test(t)) return "tag-passiva";
  if (/^truccetto/i.test(t)) return "tag-truccetto";
  if (/incantesimo/i.test(t)) return "tag-incantesimo";
  if (/abilit/i.test(t)) return "tag-abilita";
  return "";
}
const ATTACCHI_LINKS = [{"label": "Bastone Santificato", "tab": "equip", "anchor": "anchor-bastone-santificato-arma-livelliana"}];
function renderAttacchiNav(){
  if (!ATTACCHI_LINKS.length) return "";
  return `<div class="quicknav">${ATTACCHI_LINKS.map(l=>`<span class="quicknav-pill" data-jump-tab="${l.tab}" data-jump-anchor="${l.anchor}">${l.label}</span>`).join("")}</div>`;
}
function bindQuicknav(){
  document.querySelectorAll(".quicknav-pill").forEach(el=>{
    el.addEventListener("click", ()=> jumpToAnchor(el.dataset.jumpTab, el.dataset.jumpAnchor));
  });
}
function jumpToAnchor(tabId, anchorId){
  const btn = document.querySelector('.tab-btn[data-tab="'+tabId+'"]');
  if (btn) btn.click();
  setTimeout(()=>{
    const el = anchorId ? document.getElementById(anchorId) : null;
    const target = el || document.getElementById("panel-"+tabId);
    if (target){
      target.scrollIntoView({behavior:"smooth", block:"start"});
      if (el){
        el.classList.add("anchor-flash");
        setTimeout(()=>el.classList.remove("anchor-flash"), 1500);
      }
    }
  }, 80);
}

  incantesimo: [
    {nome:"Livelli di Evocazione", desc:"<p>Il giocatore ha la facolt\u00e0 di evocare pedine di luce sul campo di battaglia, decidendone la forma una volta sola alla prima evocazione (salvo artefatti che consentano modifiche successive). Pu\u00f2 evocare un massimo di 3 evocazioni per turno (incluse Armatura Waiku e Totem Lucenti). L'evocatore pu\u00f2 usare solo un'abilit\u00e0 speciale a turno: se le evocazioni sul campo sono di livello diverso, pu\u00f2 sceglierne solo una per scontro; se sono tutte dello stesso livello, pu\u00f2 usarle tutte ma solo una per turno.</p><h4>Lvl 1 \\u2014 Guardia</h4><p>Max 6 pedine.<br><br>Soldato con scudo semplice o arciere:<br>1d4+1 danni \\u00b7 10 PF \\u00b7 15 CA \\u00b7 Spostamento 6 \\u00b7 Distanza arcieri 8.<br><br><b>Abilit\\u00e0 Speciale \\u2014 Formazione:</b> se evocate tutte insieme o avvicinate tra loro (minimo 6 pedine), si fondono in un'unica entit\\u00e0 che avanza compatta e non pu\\u00f2 pi\\u00f9 dividersi. Subendo danni perde pedine ma non si rompe mai del tutto una volta creata.<br>Formazione: 6d6+1 (o 9d4+1 a distanza) \\u00b7 70 PF \\u00b7 17 CA \\u00b7 Spostamento 5 \\u00b7 Distanza arcieri 10.</p><h4>Lvl 2 \\u2014 Guerriglia</h4><p>Max 4 pedine.<br><br>Guerriero con lancia e scudo (mischia/medio raggio) o Balestriere (lunga gittata):<br>1d8+1 danni \\u00b7 20 PF \\u00b7 16 CA \\u00b7 Spostamento 8 \\u00b7 Distanza balestriere 12.<br><br><b>Speciale Guerriero:</b> 1x a scontro recupera fino a 20 PF a piacere (senza tiro); 1x a scontro lancia la lancia fino a 15 caselle (2d8+4).<br><b>Speciale Balestriere \\u2014 frecce disponibili:</b><br>\\u2022 1d4 taglienti \\u2014 sanguinamento 2 PF x2 turni [x3]<br>\\u2022 1d6 paralizzanti \\u2014 catene di luce, TS nemico 16 [x3]<br>\\u2022 1d8 perforanti \\u2014 sanguinamento 4 PF x3 turni [x3]<br>\\u2022 1d10 esplosive [x2]<br>\\u2022 1d12 divisibili \\u2014 3d4 su pi\\u00f9 nemici o danni sommati su uno solo [x2]<br>\\u2022 1d12 curative [x2]<br>\\u2022 1d20 (o 2d10) gigante [x1]</p><h4>Lvl 3 \\u2014 Apocalisse</h4><p>Max 3 pedine: Healer, Stealth e Guerriero, ciascuno con abilit\\u00e0 propria.<br><br><b>Healer:</b> 1d10+1 \\u00b7 30 PF \\u00b7 17 CA \\u00b7 Spostamento 6 \\u00b7 Distanza 15.<br>Lancia due magie a turno (una offensiva, una di supporto); dispensa fino a 100 PF di cure senza intaccare quelli di Lux (poi attinge dal suo serbatoio). 1x a scontro crea due campi da 6 caselle che curano 5 PF a turno fino a fine scontro.<br><br><b>Stealth:</b> 1d10+2 \\u00b7 30 PF \\u00b7 17 CA \\u00b7 Spostamento 10 \\u00b7 Distanza 8.<br>Invisibile finch\\u00e9 non viene colpito (poi deve ritirare per riottenerla); durante l'invisibilit\\u00e0 +2 spostamento e +3 sulla CA nemica. 2x a scontro crea illusioni di s\\u00e9 stesso (CA percepita 25 per 2 turni, TS CD16); mentre attiva, i suoi danni salgono a 1d12+2.<br><br><b>Guerriero:</b> 1d10+2 \\u00b7 30 PF \\u00b7 17 CA \\u00b7 Spostamento 8.<br>3 attacchi da 1d4; nel turno nemico pu\\u00f2 tirare un contrattacco contrapposto \\u2014 meno attacchi usa, pi\\u00f9 forte il contrattacco (fino a 1d12+3 se non ne usa nessuno). 1x a scontro affondo pesante da 4d6.<br><br>Questa squadra pu\\u00f2 anche agire da sola con ordini generali (\\u201cdifesa/attacco/contrattacco\\u201d), 2x per riposo lungo; Lux pu\\u00f2 sempre riprenderne il controllo diretto.</p><h4>Lvl 4 \\u2014 Distruzione</h4><p>Max 2 pedine: Centauro, Simil Mago o Comandante.<br><br><b>Centauro:</b> 3d6 \\u00b7 50 PF \\u00b7 18 CA \\u00b7 Spostamento 15 \\u00b7 Distanza 10.<br>+1d8 danni, +5 spostamento, +19 PF se un'altra evocazione lo cavalca. 1x a scontro carica un nemico per azzopparlo (7d6, TS CD16); chi lo cavalca ottiene +2 ai tiri per colpire e +1d6 danni.<br><br><b>Simil Mago:</b> 3d6 \\u00b7 50 PF \\u00b7 18 CA \\u00b7 Spostamento 12 \\u00b7 Distanza 20.<br>Due magie a turno (una offensiva, una di supporto); levita ma non vola. Lancia incantesimi fino a livello 3 (occasionalmente livello 5, da concordare col Master).<br><br><b>Comandante:</b> 3d6 \\u00b7 50 PF \\u00b7 18 CA \\u00b7 Spostamento 8.<br>30 PF bonus usabili come temporanei o come cure; a 5 PF residui si autodistrugge (6d6 danni) curando 3d6 agli alleati vicini. Pu\\u00f2 comandare altre evocazioni presenti, anche pi\\u00f9 potenti di lui (bonus casuali).</p><h4>Lvl 5 \\u2014 Massacro</h4><p>Max 1 pedina: Aramusha, Tiratore Scelto o Guerriero Pesante (Rodgard).<br><br><b>Aramusha:</b> Danni 6d6 o 3d12 \\u00b7 PF 80 \\u00b7 Spostamento 20 \\u00b7 19 CA.<br><b>Abilit\\u00e0 Speciale:</b> Il guerriero presenta la possibilit\\u00e0 di attaccare ripetutamente il nemico. Con 3 attacchi da 2d6 o 1d12. Se solo uno di questi attacchi andasse a segno, otterrebbe un bonus cumulabile per ogni attacco effettuato. ESEMPIO se il 1\\u00b0 non va a segno, ma il secondo si, dal 3\\u00b0 attacco in poi, l'Aramusha otterr\\u00e0 un bonus, che si andr\\u00e0 a sommare a quelli del turno successivo fino a quando non fallir\\u00e0 un attacco. Ogni attacco andato a segno + 1d6 + 1 TpC x un Max di 9d6 bonus e + 9 TpC oppure inoltre \\u00e8 possibile commutare i 3 attacchi andati a segno in 30 PFT max 2 volte non cumulabili.<br><br><b>Tiratore Scelto:</b> 6d6 o 3d12 \\u00b7 70 PF \\u00b7 Spostamento 10 \\u00b7 Distanza 40 \\u00b7 19 CA.<br>Concentrazione progressiva (max 4 turni): 1\\u00b0 turno 8d10 (+2 TpC) \\u00b7 2\\u00b0 turno 6d20/12d10 (+4) \\u00b7 3\\u00b0 turno 9d20/18d10 (+6) \\u00b7 4\\u00b0 turno 14d20/28d10 (+8, poi 2 turni di recupero).<br><br><b>Guerriero Pesante (Rodgard):</b> 6d6 (10d6 in concentrazione) \\u00b7 90 PF \\u00b7 Spostamento 7 \\u00b7 20 CA.<br>L'evocazione \\u00e8 concepita come unit\\u00e0 difensiva pesante e pu\\u00f2 assumere configurazioni difensive avanzate su comando dell'evocatore. Pu\\u00f2 attivare un gigantesco scudo rettangolare integrato nell'armatura: all'attivazione ottiene +2 CA (totale 22 CA) e 30 PF temporanei; lo scudo occupa 6 caselle ed \\u00e8 solidale al movimento dell'evocazione, funzionando come un vero e proprio muro mobile che blocca passaggi e linee di vista. Lo scudo \\u00e8 parte integrante dell'armatura e non pu\\u00f2 essere distrutto: cessa di esistere solo se l'evocazione viene distrutta, dissolta o richiamata.<br>In alternativa allo scudo mobile, l'evocazione pu\\u00f2 piantare il martello a terra entrando in modalit\\u00e0 Fortificazione: viene creata una struttura difensiva a 360 gradi pari a un'area di 4x4 caselle con 22 CA, che blocca completamente attacchi ed effetti provenienti dall'esterno. Dall'interno verso l'esterno solo l'evocatore pu\\u00f2 colpire, e solo con effetti o attacchi di luce; durante questa modalit\\u00e0 l'evocazione non pu\\u00f2 muoversi fino alla disattivazione della fortificazione.<br>Se l'evocatore rinuncia completamente al proprio turno (non si muove e non effettua alcuna azione, incluso l'attacco base con il bastone da 1d6), pu\\u00f2 entrare in concentrazione per potenziare l'evocazione: finch\\u00e9 la concentrazione \\u00e8 mantenuta, i danni dell'evocazione aumentano da 6d6 a 10d6 + 20 PFT. La concentrazione pu\\u00f2 essere attivata o disattivata liberamente \\u2014 se l'evocatore si muove o compie un'azione, il bonus termina immediatamente; pu\\u00f2 essere riattivato in un turno successivo rispettando nuovamente le condizioni.</p>"},
    {nome:"Altri Incantesimi", desc:"<h4>Marchio del Cacciatore</h4><p>Marchia un bersaglio: danni extra e bonus ai tiri per colpire a ogni colpo, finch\\u00e9 dura.<br>Lvl1: 1d4 + 1 TpC<br>Lvl2: 1d6 + 2 TpC<br>Lvl3: 1d8 + 2 TpC<br>Lvl4: 1d10 + 3 TpC<br>Lvl5: 1d12 + 3 TpC</p><h4>Punizione Divina</h4><p>Benedice l'arma con effetti radiosi (raddoppiati su immondi o esseri maledetti).<br>Lvl1: +1d6 danni x 12 turni<br>Lvl2: +1d8 danni x 10 turni<br>Lvl3: +1d10 danni x 8 turni<br>Lvl4: +1d12 danni x 6 turni<br>Lvl5: +1d20 danni (o 2d10) x 4 turni</p><h4>Aura di Protezione</h4><p>Emana un'aura curativa/difensiva: ogni alleato dentro pu\\u00f2 curarsi o scegliere +1 CA; Lux stesso recupera PF o ottiene bonus CA a scelta.<br>Lvl1: 4 caselle \\u00b7 cura 1d4 \\u00b7 CA +0 \\u00b7 7 turni<br>Lvl2: 6 caselle \\u00b7 cura 1d6 \\u00b7 CA +1 \\u00b7 6 turni<br>Lvl3: 8 caselle \\u00b7 cura 1d8 \\u00b7 CA +1 \\u00b7 5 turni<br>Lvl4: 10 caselle \\u00b7 cura 1d12 \\u00b7 CA +2 \\u00b7 4 turni<br>Lvl5: 20 caselle \\u00b7 cura 1d20 o 2d10 \\u00b7 CA +3 \\u00b7 3 turni</p><h4>Imposizione delle Mani</h4><p>PF condivisibili con s\\u00e9 stesso o alleati (l'eccesso diventa PF temporanei, max 20 a testa).<br>Lvl1: 50 PF<br>Lvl2: 70 PF<br>Lvl3: 90 PF<br>Lvl4: 150 PF<br>Lvl5: 200 PF</p><h4>Armatura Lucente</h4><p>Armatura di luce che protegge fino a fine scontro (max +6 CA con tutte le abilit\\u00e0).<br>Lvl1: +1 CA<br>Lvl2: +1 CA, danni di ritorno 1d6<br>Lvl3: +2 CA, danni di ritorno 1d4<br>Lvl4: +2 CA, danni di ritorno 1d12<br>Lvl5: +3 CA, danni di ritorno 2d10 (Lux recupera il secondo d10 come PF)</p><h4>Raggio di Luce Pura</h4><p>Canalizza la propria essenza in un fascio di luce sacra che cresce di potenza pi\\u00f9 a lungo viene mantenuto. Lanciato subito: 6d6.<br>1\\u00b0 turno di concentrazione: 13d6<br>2\\u00b0 turno: 20d6<br>3\\u00b0 turno: 28d6<br>4\\u00b0 e ultimo turno: 36d6<br>I turni devono essere consecutivi: qualsiasi interruzione (attacco, incantesimo, altra azione) azzera l'accumulo. Pu\\u00f2 muoversi ma non fare altro durante la canalizzazione. 1x per riposo lungo; dopo l'uso, un turno obbligato di riabilitazione senza poter agire.</p><h4>Dominio Celeste</h4><p>Il personaggio consacra un'area del campo e la trasforma in territorio dominato dalla propria luce, estendendo il proprio potere celeste in uno spazio definito entro cui la sua volont\\u00e0 pu\\u00f2 manifestarsi in forma difensiva, vincolante o di supporto. All'interno del Dominio Celeste, il personaggio pu\\u00f2 commutare la luce in differenti effetti compatibili con la natura dell'abilit\\u00e0, come ripari balistici, ostacoli, alterazioni del terreno, pressioni sui nemici o vantaggi per gli alleati, rendendo quest'area un ambiente direttamente soggetto alla propria influenza. Le manifestazioni del Dominio possono essere attive, reattive o passive a seconda dell'impiego scelto: in alcuni casi possono essere attivate direttamente dal personaggio, in altri possono innescarsi in risposta a un'azione, a un ingresso, a un movimento o a una presenza nemica o alleata all'interno dell'area, mentre in altri casi possono permanere in modo costante e passivo finch\\u00e9 il Dominio resta attivo, purch\\u00e9 gli effetti restino coerenti con le possibilit\\u00e0 del potere impiegato. Gli effetti generati dal Dominio Celeste appartengono unicamente a questa abilit\\u00e0 e non vanno a intaccare n\\u00e9 a sostituire le altre abilit\\u00e0 del personaggio, anche quando assumono natura curativa, offensiva, difensiva o di supporto. La grandezza dell'area, l'intensit\\u00e0 delle manifestazioni, la loro complessit\\u00e0, la loro modalit\\u00e0 di attivazione e il numero di effetti sostenibili dipendono dalla potenza utilizzata per attivare l'abilit\\u00e0: pi\\u00f9 alta \\u00e8 la potenza investita, maggiore sar\\u00e0 il controllo esercitabile sul dominio e pi\\u00f9 rilevanti potranno essere le alterazioni prodotte, sempre entro limiti compatibili con le capacit\\u00e0 del personaggio e concordati con il master. Le misure indicate per ogni livello rappresentano una base indicativa del campo e possono quindi essere adattate, rimodellate o redistribuite in forme differenti, purch\\u00e9 restino coerenti con l'estensione complessiva concessa dalla potenza impiegata il campo pu\\u00f2 essere ridotto per diventare mobile e seguire il personaggio come epicentro dal LVL 3 in poi.<br>LVL 1: campo 2x2<br>LVL 2: campo 4x4<br>LVL 3: campo 6x6 / 3x3<br>LVL 4: campo 8x8 / 4x4<br>LVL 5: campo 12x12 / 6x6</p><h4>Evocazione Perenne (Lvl 2)</h4><p>La sua evocazione perenne ascende al livello 2: 16 CA, 40 PF, pu\\u00f2 mutare stabilmente forma (1 turno di attesa per cambiare) tra Aquila e Lupo.<br><br><b>Forma Aquila</b> (supporto da osservazione): individua e segnala nemici \\u2014 i bersagli spottati danno +2 ai tiri per colpire a tutti gli alleati e +3 a Lux. Finch\\u00e9 resta sul campo: +5 iniziativa, +3 percezione passiva. Lux pu\\u00f2 vedere attraverso i suoi occhi e, concentrandosi, percepire creature nascoste/invisibili/sotterranee nei paraggi tramite la loro energia vitale.<br><br><b>Forma Lupo</b> (marcatura offensiva): sceglie un bersaglio \\u201cbraccato\\u201d \\u2014 Lux ottiene +2 ai tiri per colpire contro di esso (+4 se il lupo lo colpisce, marchio permanente). 1x a turno il lupo attacca per 1d8, oppure divide in 2d4 su uno o due bersagli; se entrambi i 2d4 colpiscono lo stesso, sanguinamento 2 danni fissi a turno fino a fine scontro. Il bersaglio colpito genera un epicentro predatorio 4x4: nemici dentro devono superare TS Carisma 16 o -2 ai tiri per colpire.</p><h4>Totem Lucente</h4><p>Sblocca statue Totem che curano gli alleati vicini; non influenzano il numero massimo di pedine evocabili.<br>Lvl1: 1 Totem piccolo, area 2 caselle, 20 PF (divisibili)<br>Lvl2: 2 Totem piccoli (area 2, 30 PF) oppure 1 medio (area 4, 62 PF)<br>Lvl3: 1 Totem medio, area 5 caselle, 80 PF<br>Lvl4: 2 Totem medi (area 5, 50 PF) oppure 1 grande (area 10, 110 PF)<br>Lvl5: 1 Totem grande, area 15 caselle, 200 PF; entro 7 caselle dalla statua +1 CA, entro 3 caselle +2 CA e +5 PF a turno. In alternativa pu\\u00f2 far spuntare pi\\u00f9 Totem medi/piccoli dividendo i PF totali a piacere.</p><h4>Bastone Santificato (Arma Livelliana)</h4><p>Muta forma secondo necessit\\u00e0 (armi o utensili) e spara colpi di luce, o infonde luce per creare oggetti abbinabili (es. frecce per un arco). I danni del bastone sono inversamente proporzionali alla potenza delle evocazioni sul campo: con una sola pedina Lvl1 (max 1d6) il bastone arriva a 5d6; con una pedina Lvl5 scende a 1d6. All'inizio dello scontro, con un'evocazione Lvl4 o inferiore gi\\u00e0 sul campo, il primo dardo non consuma un attacco. Senza nessuna evocazione o abilit\\u00e0 di luce attiva, il bastone arriva a 4d10 + 1 CA (pu\\u00f2 mutare in tirapugni e sim.).<br><b>Abilit\\u00e0 speciale:</b> pu\\u00f2 generare uno slot Lvl4 extra in casi di emergenza \\u2014 durante il quale Lux pu\\u00f2 solo spostarsi (max 5 caselle), niente azioni complesse. Dopo l'effetto (breve come una cura, o lungo come un'evocazione), un turno obbligato di riposo/meditazione.</p>"},
    {nome:"Armatura Waiku", desc:"<p>Il giocatore, grazie ad un oggetto, sblocca la possibilit\\u00e0 di utilizzare un antico rituale santo che protegge il proprio evocatore, manifestando l'anima di un guerriero antico, spesso utilizzato dai monaci Kalashtar. Il PG ha la facolt\\u00e0 di evocare questa armatura in base alle pedine evocate sul campo, tot spendibile 36 danni (comprese evocazioni). Se il pg rinuncia al suo attacco si pu\\u00f2 sommare un +1d6+1 agli attacchi dell'armatura. Con l'armatura evocata, le evocazioni perenni possono attaccare ogni turno, senza limiti di attacchi. (Ai PF temporanei guadagnati si possono aggiungere max 20 PF temporanei derivanti da altre abilit\\u00e0)<br><b>Lvl 1</b> = Il PG evoca un braccio di luce, di fattura scheletrica, sx o dx, per poter combattere corpo a corpo il nemico. 1d4+1; distanza 2 caselle (dimensione arto piccola). Una volta a scontro il PG pu\\u00f2 allungare il braccio e colpire/prendere/spostare a distanza 10. Durata 4 turni.<br><b>Lvl 2</b> = Il PG evoca entrambe le braccia scheletriche. 1d8+1; distanza 3 caselle (dimensione arti piccola). Una volta a scontro il PG pu\\u00f2 evocare un coltello di piccole dimensioni in una delle due mani scheletriche + 1d6 danni. Durata 4 turni.<br><b>Lvl 3</b> = Il PG oltre alle braccia evoca un costato che lo protegge ulteriormente + 1 alla CA, 1d10+2; distanza 4 caselle (dimensione arti media). Il PG, acquisisce 10 pf temporanei. Una volta a scontro il PG pu\\u00f2 aumentare ulteriormente la potenza del suo costato aggiungendo un +1 alla CA aggiuntivo. Durata 4 turni.<br><b>Lvl 4</b> = Il PG evoca un mezzo esoscheletro completo di testa che avvolge il suo corpo avendo la facolt\\u00e0 di lanciare palle di luce che esplodono a contatto. + 2 alla CA, 3d6; distanza 5 caselle (dimensione arti media), attacchi a distanza 13 caselle. Il PG acquisisce 20 pf temporanei. Il PG una volta a scontro pu\\u00f2 ottenere un + 1 aggiuntivo sulla CA x 4 turni e in pi\\u00f9 pu\\u00f2 compiere un attacco a distanza di 5d6 con danni esplosivi.<br><b>Lvl 5</b> = Il PG evoca un armatura che ricopre l'esoscheletro fornendogli un +3 alla CA, 6d6 o 3d12 senza la presenza di pedine sul campo di battaglia il danno aumenta a 4d12+2; distanza 6 caselle (dimensione arti grande), attacchi a distanza 20 caselle. Il PG acquisisce 30 pf temporanei. Il PG una volta a scontro pu\\u00f2 ottenere un + 2 aggiuntivo sulla CA x 4 turni e in pi\\u00f9 pu\\u00f2 compiere un attacco a distanza di 20d6 con danni esplosivi. In pi\\u00f9, il PG, pu\\u00f2 allontanare l'armatura dal suo corpo controllandola a distanza, per un massimo di 10 caselle. 100 PF/ CA 20 / 7D6 / MOVIMENTO 5 (Se lontana dal corpo del PG, quest'ultimo perde i PF temporanei e i bonus sulla CA.) <b>Una volta ogni due riposi lunghi l'armatura pu\\u00f2 aumentare di potenza ed essere 150PF/ 21CA / 12D6 / MOV 7.</b></p>"}

  truccetti: [
    {nome:"Prigione Divina", desc:"Evoca barre di luce che intrappolano il nemico in una prigione da cui, per uscire, deve superare un tiro salvezza (ogni turno passato dentro: -1d10). TS difficolt\u00e0 per il nemico 17, CD 16, durata 5 turni.", uso:"2 x Riposo Lungo"},
    {nome:"Percezione del Divino", desc:"Percepisce entit\u00e0 pure e maligne fino a 20 caselle, anche se coperte, occultate o nascoste \u2014 anche a occhi chiusi. Riconosce il tipo di creatura percepita (non l'identit\u00e0) e individua luoghi sacri o sacrileghi nello stesso raggio. +2 ai tiri per colpire su tutte le creature identificate.", uso:"3 x Riposo Lungo, CD 15"},
    {nome:"Benedizione", desc:"Permette di parlare con i morti e, nel caso, epurarli dal male inflitto o passato. Se usata sui vivi, mostra gli ultimi 30 minuti del loro passato al tocco.", uso:"3 x Riposo Lungo, CD 15"},
    {nome:"Aiuto Divino", desc:"Lux evoca potenziamenti temporanei sul campo di battaglia in base al tempo passato in meditazione (un turno senza azioni n\u00e9 attacchi propri, salvo un attacco con evocazione). Gli aiuti variano in base alla richiesta e alla durata della meditazione (fulmini divini, portali, cure casuali, slot aggiuntivi, evocazioni autonome). Possono manifestarsi anche in modo casuale.", uso:"1 x 2 Riposi Lunghi"},
    {nome:"Scheletro Demoniaco", desc:"Dopo il contatto con la natura corrotta di Ervork, il personaggio ha acquisito la capacit\u00e0 di fondere luce celeste ed essenza demoniaca in un'unica evocazione minore di livello 2, dando vita a uno scheletro instabile e brillante, carico di entrambe le energie. Il personaggio pu\u00f2 evocare uno scheletro minore di luce demoniaca, solo quando Ervork \u00e8 presente sul campo di battaglia. Questo viene considerato trucchetto e non spreca slot. Lo scheletro attacca una volta per turno infliggendo 1d10 + 2 danni normali, oppure pu\u00f2 scegliere di dividere l'attacco in 2d6, di cui 1d6 radiante e 1d6 demoniaco: in questo secondo caso, se il d6 demoniaco ottiene 5 o 6, infligge 2 danni necrotici fissi all'inizio del turno del nemico per 3 turni, mentre se il d6 radiante ottiene 5 o 6, lo scheletro recupera un numero di punti ferita pari al danno radiante inflitto.<br><b>Abilit\u00e0 specifica:</b> una volta per scontro, lo scheletro pu\u00f2 aprire lo sterno e scagliare una lancia energetica composta da luce sacra e materia corrotta fino a 12 caselle di distanza. Se il colpo a distanza va a segno, aggiunge 2d6 santi e 2d6 necrotici ai danni base dell'attacco, per un totale di 4d6 danni aggiuntivi. I 2d6 santi guariscono automaticamente lo scheletro di un ammontare pari al risultato ottenuto e, se lo scheletro \u00e8 gi\u00e0 al massimo dei suoi punti ferita, convertono l'eccesso in punti ferita temporanei. I 2d6 necrotici infliggono 5 danni necrotici fissi a turno al bersaglio fino alla sua morte o alla fine dello scontro.", uso:"Non consuma slot \u2014 solo quando Ervork \u00e8 presente sul campo di battaglia."},
    {nome:"<span style=\"color:var(--red-glow);\">\u201c</span><span style=\"color:var(--violet);\">Gennaro</span><span style=\"color:var(--red-glow);\">\u201d</span> \u2014 Scheletro Demoniaco Elettrificato", desc:"Solo quando sia Ola che Ervork sono presenti contemporaneamente sul campo di battaglia, il personaggio pu\u00f2 evocare questa creatura d'\u00e9lite: uno scheletro di livello 5, fuso con le energie instabili di luce, elettricit\u00e0 e potere demoniaco. Rivestito da un'armatura elettrificata e armato con strumenti sacri e corrotti, rappresenta l'apice delle evocazioni combinate. L'attacco base infligge 6d6 totali per colpo, divisi in 3d6 elettrici e 3d6 demoniaci. Ogni colpo elettrico consente al giocatore di lanciare una moneta: se il risultato \u00e8 positivo e l'attacco \u00e8 andato a segno, il nemico viene paralizzato per 1 turno. Se il nemico \u00e8 gi\u00e0 paralizzato e viene colpito nuovamente con successo, e la moneta d\u00e0 esito positivo una seconda volta, la paralisi viene estesa a 2 turni. I 3d6 demoniaci infliggono automaticamente 5 danni necrotici fissi per turno, cumulabili fino a un massimo di 15 danni necrotici per turno per tutto lo scontro. Dopo ogni colpo a segno, lo scheletro lancia 3d6: il risultato cura direttamente i suoi punti ferita, ed eventuali eccessi si trasformano in punti ferita temporanei.<br><b>Abilit\u00e0 specifica:</b> una volta per scontro, lo scheletro pu\u00f2 evocare una lancia di energia pura, composta da potere santificato, elettricit\u00e0 e caos demoniaco, e scagliarla fino a 20 caselle di distanza. Se colpisce, infligge 20d6 danni totali, suddivisi equamente tra danni sacri, elettrici e demoniaci. Dopo l'impatto, il personaggio recupera tutti i punti ferita persi, tornando esattamente al valore iniziale di inizio scontro; se non ha perso alcun punto ferita prima del lancio, ottiene automaticamente 30 punti ferita temporanei. Il bersaglio subisce 20 danni necrotici fissi per turno fino alla fine dello scontro ed \u00e8 paralizzato per 3 turni. Tutti gli effetti si sommano e avvengono contemporaneamente. Quando questa evocazione di livello 5 \u00e8 attiva in concomitanza con un'altra evocazione di livello 5, il personaggio, essendo completamente concentrato nel mantenere il legame, non pu\u00f2 effettuare attacchi diretti: pu\u00f2 muoversi e compiere azioni, ma solo legate a capacit\u00e0 difensive, curative o di supporto.", uso:"Avanzato \u2014 non consuma slot, 1x ogni 2 riposi lunghi (richiede Ola ed Ervork presenti insieme)."}
  ],

  evoluzioniFuturi: [
    {
      "livello": "Livello 9",
      "html": "<p><b>1) RISONANZA</b></p><p>Il personaggio emette una vibrazione mentale e spirituale di natura celeste che entra in risonanza con mente, anima e volontà delle creature scelte. Sugli alleati la Risonanza rafforza lucidità, ordine interiore e stabilità mentale; sui nemici esercita una pressione psichica che può generare disorientamento, confusione, alterazioni percettive, perdita di precisione, destabilizzazione mentale e progressiva compromissione del controllo. Per ogni livello l'abilità conferisce bonus agli alleati e malus ai nemici, ma la sua natura principale resta quella di un <b>controllo mentale progressivo</b>: ai livelli più bassi la mente del bersaglio può essere solo influenzata o disturbata, mentre aumentando la potenza impiegata la Risonanza può diventare sempre più invasiva, fino a compromettere azioni complesse, capacità decisionali, percezione della realtà e persino indurre il nemico a compiere azioni errate, casuali o ostili verso i propri alleati. In base al livello impiegato, la Risonanza aumenta quindi la propria intensità e profondità, sia nel supporto agli alleati sia nella capacità di piegare, confondere o forzare la mente dei nemici.</p><p><b>LVL 1</b> (<b>1 bersaglio / TS SAG 16 solo se nemico</b>): Se usata su un alleato, questo ottiene <b>+2 alla protezione mentale</b> contro effetti di charme, paura, confusione, controllo mentale o alterazioni psichiche simili, oltre a una maggiore lucidità nelle decisioni e nella lettura del campo. Se usata su un nemico, questo subisce <b>-2 ai tiri per colpire</b> e una lieve pressione mentale che ne disturba concentrazione e precisione.<br><b>LVL 2</b> (<b>2 bersagli / TS SAG 17 solo se nemici</b>): Se usata su alleati, questi ottengono <b>+3 alla protezione mentale</b> e <b>+2 ai tiri per colpire</b>, entrando in uno stato di maggiore coordinazione, lucidità e sintonia tattica, utile per leggere meglio il combattimento e reagire con più ordine alle minacce. Se usata su nemici, questi subiscono <b>-3 ai tiri per colpire</b> e, se falliscono il <b>TS SAG 17</b>, vengono colpiti da una confusione mentale più marcata che rende più difficile eseguire azioni complesse, lanciare incantesimi, mantenere concentrazione o utilizzare abilità che richiedano particolare controllo mentale.<br><b>LVL 3</b> (<b>3 bersagli / TS SAG 18 solo se nemici</b>): Se usata su alleati, questi ottengono <b>+4 alla protezione mentale</b> e <b>+3 ai tiri per colpire</b>, entrando in uno stato di intensa lucidità psichica che permette loro di <b>riconoscere illusioni di media potenza</b> e, in alcuni casi, anche <b>illusioni più forti</b>, se non eccessivamente complesse o superiori alla capacità della Risonanza. Se usata su nemici, questi subiscono <b>-4 ai tiri per colpire</b> e, se falliscono il <b>TS SAG 18</b>, vengono colpiti da una confusione mentale più marcata, da una forte destabilizzazione e da una grave difficoltà nell'utilizzare abilità che richiedano particolare controllo mentale; inoltre, in caso di fallimento del tiro salvezza, il bersaglio <b>salta il turno successivo</b>.<br><b>LVL 4</b> (<b>4 bersagli / TS SAG 19 solo se nemici</b>): Se usata su alleati, questi ottengono <b>+5 alla protezione mentale</b> e <b>+4 ai tiri per colpire</b>, entrando in una vera <b>connessione mentale condivisa</b> che permette loro di comunicare tra loro all'interno della mente e di coordinarsi in modo immediato e preciso sul campo di battaglia; inoltre, la Risonanza consente loro di riconoscere con maggiore facilità anche <b>illusioni forti</b> o particolarmente insidiose, purché non superiori alla capacità complessiva dell'abilità. Se usata su nemici, questi subiscono <b>-5 ai tiri per colpire</b> e, se falliscono il <b>TS SAG 19</b>, vengono colpiti da una destabilizzazione psichica profonda che rende estremamente difficile utilizzare abilità che richiedano controllo mentale, li costringe a <b>saltare il turno successivo</b> e li obbliga, nel turno seguente, a <b>ripetere il tiro salvezza su Saggezza</b>; in caso di nuovo fallimento, il bersaglio <b>salta un ulteriore turno</b>. Inoltre, i nemici colpiti possono iniziare a percepire <b>illusioni visive e mentali visibili solo a loro</b>, tali da destabilizzarli, confonderli e spingerli a compiere <b>azioni casuali, errate o persino autolesionistiche</b>.<br><b>LVL 5</b> (<b>5 bersagli / TS SAG 20 solo se nemici</b>): Se usata su alleati, questi ottengono <b>+6 alla protezione mentale</b> e <b>+5 ai tiri per colpire</b>, entrando in una <b>risonanza mentale superiore</b> che va oltre la semplice comunicazione: pensieri, intuizioni, strategie e decisioni vengono condivisi in modo istantaneo tra tutti i bersagli coinvolti, trasformandoli in una mente collettiva capace di ragionare, pianificare e reagire come un unico organismo. Questo permette di coordinare azioni complesse in tempi minimi, riducendo drasticamente i tempi di decisione e rendendo immediata la trasmissione di idee, pericoli, priorità e soluzioni tattiche. Inoltre, gli alleati in questo stato riescono a leggere con grande facilità illusioni anche molto avanzate, salvo quelle di livello eccezionalmente superiore alla Risonanza stessa. Se usata su nemici, questi subiscono <b>-6 ai tiri per colpire</b> e, se falliscono il <b>TS SAG 20</b>, vengono travolti da una frattura mentale gravissima che rende quasi impossibile mantenere controllo, lucidità e uso corretto delle proprie abilità più complesse. Il bersaglio <b>salta il turno successivo</b> e, successivamente, <b>ogni due turni</b> deve ripetere il <b>tiro salvezza su Saggezza</b>: in caso di fallimento, può <b>saltare nuovamente il turno</b> oppure, a seconda della distorsione mentale subita, <b>attaccare un proprio alleato</b>, agendo sulla base delle illusioni e delle percezioni alterate che la Risonanza gli impone. Inoltre, le illusioni mentali a questo livello diventano tanto invasive da poter compromettere in modo molto grave giudizio, riconoscimento dei bersagli e capacità decisionale.</p><p><b>2) OTTENIMENTO</b> Nr. 1 SLOT <b>LVL 6</b>.</p>"
    },
    {
      "livello": "Livello 10",
      "html": "<p><b>1) AVVENTO</b></p><p>Il contenitore mortale del personaggio si apre in misura molto più ampia alla propria vera natura arcangelica, permettendo al suo potere di fluire in maniera molto più pura, intensa e completa rispetto allo stato ordinario. In questa condizione il personaggio può <b>levitare</b> costantemente e, se lo desidera, manifestare <b>ali di luce</b> come estensione diretta del proprio potere evocativo; il corpo viene avvolto da un'aura angelica visibile, la <b>CA aumenta di +1</b> e tutte le sue capacità risultano nettamente amplificate. In questo stadio, ha la possibilità di usare in parte la sua Grazia Arcangelica seppur non a pieno potere.</p><p><b>GRAZIA ARCANGELICA — PREMINENZA</b>: entro un raggio di <b>6 caselle</b>, i nemici con un valore di <b>Carisma inferiore</b> a quello del personaggio <b>non possono colpirlo né intraprendere realmente combattimento contro di lui</b>, poiché la sua natura celeste si impone sulla loro volontà come una superiorità spirituale insormontabile. Solo creature con <b>Carisma pari o superiore</b> al suo possono reggere la sua presenza e tentare di affrontarlo direttamente.<br><b>AURA DELLA LUMINESCENZA</b>: entro un raggio di <b>6 caselle</b>, tutti gli alleati avvolti dall'aura del personaggio ottengono <b>10 punti ferita per turno</b>; se sono già al massimo dei propri punti ferita, ottengono invece <b>10 punti ferita temporanei</b>, accumulabili fino a un massimo di <b>30</b>, salvo eccezioni particolari in cui tale limite può essere superato. Inoltre, finché restano all'interno dell'aura, ottengono <b>+1 CA</b>, <b>+3 ai tiri per colpire</b> e <b>+1D6 ai danni</b>, poiché la luce dell'Avvento li protegge, li rafforza e li potenzia direttamente.<br><b>ONNIVEGGENZA CELESTE</b>: per la durata dello stato, il campo di battaglia risulta totalmente leggibile agli occhi del personaggio; invisibilità, presenze occultate, tracce, distorsioni luminose, magie, energie e altri effetti normalmente difficili da cogliere diventano percepibili con estrema chiarezza.<br><b>AZIONE SUPERIORE</b>: per tutta la durata dell'Avvento, il personaggio ottiene <b>un'azione bonus fissa aggiuntiva</b> e può inoltre <b>lanciare un ulteriore incantesimo bonus nel turno</b>, arrivando così a sostenere <b>due azioni e due incantesimi</b> complessivi nello stesso turno.<br><b>RISERVE CELESTI</b>: tutti gli utilizzi dal <b>LVL 1 al LVL 3</b> diventano <b>gratuiti e illimitati</b> per la durata dello stato, mentre gli utilizzi di <b>LVL 4 e LVL 5</b> vengono <b>raddoppiati</b> rispetto al numero normalmente disponibile.<br><b>POTENZIAMENTO ASSOLUTO</b>: per tutta la durata dell'Avvento, il personaggio dispone di <b>10D6</b> danni complessivi per turno da ripartire liberamente tra incantesimi, colpi a mani nude o attacchi effettuati con la propria arma, che in questo stato diventa un vero e proprio <b>catalizzatore di potenza celeste</b>.<br><b>DOMINIO DELL'ARMA</b>: il personaggio può utilizzare la propria arma anche a distanza senza impugnarla, guidandola tramite una forza celeste affine a una telecinesi divina, combattendo quindi anche senza contatto diretto. In questo stato, l'arma si trasforma direttamente in una <b>falce</b>. <b>ATTACCO SPECIALE — FALCE DEL GIUDIZIO</b>: una volta per scontro, la falce può essere accelerata fino a trasformarsi in una sorta di <b>sega circolare celeste</b> che compie un attacco ad area capace di colpire fino a un massimo di <b>6 nemici</b>; ogni bersaglio subisce un colpo singolo fino a <b>6D6</b> danni e, se colpito, subisce <b>5 danni da sanguinamento per turno fino alla fine dello scontro</b>. Tutti i nemici colpiti da questo attacco diventano <b>sudditi celesti</b>, subiscono <b>-4 al Carisma</b> e risultano molto più vulnerabili all'influenza mentale dell'arcangelo, potendo in certi casi agire secondo il suo volere.<br><u><b>ABILITA' 1 OGNI 2 RIPOSI LUNGHI</b></u></p><p><b>2) REQUIE</b></p><p>Il personaggio può entrare in comunione con i morti anche senza contatto diretto con il corpo integro, riuscendo a percepire e interrogare anime, resti, scheletri o frammenti di una salma, purché vi sia ancora una traccia spirituale sufficiente da richiamare. Attraverso Requie, il personaggio può ascoltare memorie residue, ricevere risposte, cogliere emozioni legate alla morte o comprendere eventi accaduti attorno ai resti, nei limiti concessi dallo stato dell'anima e dell'integrità spirituale del defunto. Se necessario, Requie può essere usata anche per <b>purificare</b> i morti, placando spiriti inquieti, liberando presenze corrotte, sciogliendo legami malevoli o accompagnando l'anima verso uno stato di quiete. In alcuni casi, le anime purificate possono lasciare al personaggio <b>benefici temporanei di natura variabile</b>, proporzionati alla grandezza, alla quantità e alla profondità della purificazione compiuta: tali vantaggi possono manifestarsi sotto forma di <b>evocazioni temporanee</b>, <b>potenziamenti fisici</b>, <b>amplificazioni agli incantesimi</b> o altri <b>buff spirituali di natura indefinita</b>, a seconda del tipo di anima coinvolta e dell'intensità del rito.</p>"
    },
