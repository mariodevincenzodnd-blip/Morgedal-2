<style>
  :root{
    --bg:#0f0d0c;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.10), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(201,70,59,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:0;
  }
  ::selection{background:var(--violet-dim);color:#fff;}
  a{color:var(--gold-bright);}

  .hero.dragging{cursor:grabbing;}
  .hero-zoom-btn{
    background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.25);
    color:rgba(237,227,208,0.9);width:18px;height:18px;line-height:16px;
    border-radius:50%;font-size:12px;cursor:pointer;padding:0;margin:0 1px;
    font-family:var(--mono);vertical-align:middle;
  }
  .hero-zoom-btn:hover{background:rgba(0,0,0,0.7);}
  #hero-zoom-label{font-family:var(--mono);font-size:10px;margin:0 3px;vertical-align:middle;}
  .hero-hint{
    position:absolute;top:12px;right:16px;font-size:10px;letter-spacing:.4px;
    color:rgba(237,227,208,0.8);background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);
    padding:4px 11px;border-radius:12px;transition:opacity .2s;opacity:0.55;z-index:2;
  }
  .hero:hover .hero-hint{opacity:1;}

  .hero::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, var(--identity), var(--identity2));z-index:2;
  }
  .hero-inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .hero-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(38px,6vw,64px);
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-bright);
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    margin:0;
  }
  .hero-sub{font-family:var(--serif);font-style:italic;color:var(--text-dim);font-size:15px;margin-top:6px;}
  .hero-meta{display:flex;gap:10px;flex-wrap:wrap;}
  .hero-chip{
    background:rgba(20,16,14,0.65);
    border:1px solid var(--border);
    border-radius:20px;
    padding:6px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    backdrop-filter: blur(2px);
  }
  .hero-chip b{color:var(--gold-bright);font-weight:600;}
  .tipo-label{opacity:.65;font-size:11px;letter-spacing:.5px;}
  .hero-chip-tipo{border-color:var(--identity);}
  .hero-chip-tipo b{color:var(--identity);}
  .hero-chip-id{display:flex;flex-direction:column;gap:1px;padding:5px 14px 6px;}
  .hero-chip-label{
    font-size:8px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-faint);font-weight:600;line-height:1.3;
  }
  .quicknav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;}
  .quicknav-pill{
    display:inline-flex;align-items:center;gap:5px;
    background:color-mix(in srgb, var(--identity) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--identity) 45%, transparent);
    border-radius:14px;padding:4px 12px;font-size:12px;color:var(--identity);
    cursor:pointer;transition:background .15s,color .15s;
  }
  .quicknav-pill:hover{background:color-mix(in srgb, var(--identity) 25%, transparent);color:var(--gold-bright);}
  .quicknav-pill::before{content:"\2197";font-size:11px;}
  @keyframes anchorFlash{0%,100%{box-shadow:none;}30%{box-shadow:0 0 0 3px var(--gold);}}
  .anchor-flash{animation:anchorFlash 1.4s ease;}
  .editable-name{
    background:transparent;border:none;color:var(--gold-bright);font-family:var(--serif);
    font-weight:700;font-size:64px;letter-spacing:2px;text-transform:uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    border-bottom:1px dashed transparent; padding:0; width:100%; max-width:100%;
    white-space:nowrap; overflow:hidden;
  }
  @media (max-width:720px){ .editable-name{ font-size:38px; } }
  .editable-name:hover, .editable-name:focus{border-bottom:1px dashed var(--gold); outline:none;}

  /* ---------- TABS ---------- */
  .tabbar{
    position:sticky;top:0;z-index:50;
    background:rgba(15,13,12,0.94);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    white-space:nowrap;
  }
  .tabbar-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 16px;}
  .tab-btn{
    background:none;border:none;color:var(--text-dim);
    font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:0.4px;
    padding:14px 16px;cursor:pointer;border-bottom:2px solid transparent;
    text-transform:uppercase;transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-bright);border-bottom:2px solid var(--gold);}
  .dot-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--identity);margin-left:6px;filter:drop-shadow(0 0 4px var(--identity));animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---------- CARDS / GRID ---------- */
  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:1.6px;
    color:var(--gold);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .card h2 small{font-family:var(--sans);text-transform:none;letter-spacing:0;color:var(--text-faint);font-size:11px;}
  .grid{display:grid;gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  @media (max-width:820px){.grid-4,.grid-3,.grid-6{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.grid-4,.grid-3,.grid-2,.grid-6{grid-template-columns:1fr 1fr;}}
  @media (max-width:700px){.grid-2{grid-template-columns:1fr;}}
  @media (max-width:520px){#equip-slots-grid{grid-template-columns:1fr;}}
  @media (max-width:480px){.grid-3{grid-template-columns:1fr;}}
  /* Sotto gli 820px il numero di colonne reali si riduce: un riquadro con "width" 2 o 3
     (grid-column:span impostato via inline style da masterBoxStyle) non deve mai richiedere
     più colonne di quelle effettivamente disponibili, altrimenti la grid ne crea di implicite
     e la pagina va in overflow orizzontale. Lo forziamo a occupare tutta la riga disponibile. */
  @media (max-width:820px){.grid-3>[style*="grid-column"]{grid-column:1 / -1 !important;}}

  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-faint);}
  .field input[type=text], .field input[type=number], select, textarea{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%;
  }
  .field input:focus, textarea:focus, select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  textarea{resize:vertical;font-family:var(--sans);line-height:1.55;}

  /* ---------- ABILITY SCORES ---------- */
  .abil-box{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:14px;text-align:center;position:relative;
  }
  .abil-box .name{font-size:11px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .abil-box input[type=number]{
    width:64px;text-align:center;font-size:20px;font-weight:700;font-family:var(--mono);
    background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);
    margin:8px auto 6px;padding:4px 0;
  }
  .abil-box .mod{
    font-family:var(--mono);font-size:22px;color:var(--gold-bright);font-weight:700;
    width:60px;text-align:center;background:transparent;border:1px solid transparent;
    border-radius:6px;padding:2px 0;margin:0 auto;display:block;
  }
  .abil-box .mod:hover{border-color:var(--border-soft);}
  .abil-box .mod:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  .abil-box .mod.is-override{color:var(--text);border-color:var(--gold);background:var(--bg-panel-3);}

  /* ---------- STAT PILLS ---------- */
  .statpill{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px;text-align:center;}
  .statpill label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);margin-bottom:6px;}
  .statpill input{width:100%;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;background:transparent;border:none;color:var(--gold-bright);}
  .statpill input:focus{outline:none;}

  /* ---------- HP ---------- */
  .hp-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .hp-track{flex:1;min-width:220px;height:22px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;position:relative;}
  .hp-fill{height:100%;background:linear-gradient(90deg,#7a2a24,var(--bad));transition:width .3s;}
  .hp-numbers{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:15px;}
  .hp-numbers input{width:64px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);border-radius:6px;padding:6px 2px;}
  .hp-row-temp{margin-top:6px;}
  .hp-track-temp{height:14px;}
  .hp-fill-temp{height:100%;background:linear-gradient(90deg,#8a5a1f,var(--amber));transition:width .3s;}
  .btn{
    background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.3px;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn.primary{background:linear-gradient(180deg, #3a2a12, #241a0c);border-color:var(--gold);color:var(--gold-bright);}
  .btn.small{padding:4px 9px;font-size:11px;}
  .btn.danger:hover{border-color:var(--bad);color:#ff9d90;}

  /* ---------- SKILL LIST ---------- */
  .skill-row{display:grid;grid-template-columns:1fr 46px 60px;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border-soft);}
  .skill-row:last-child{border-bottom:none;}
  .skill-name{font-size:13.5px;}
  .skill-abbr{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);text-align:center;background:var(--bg-panel-3);border-radius:5px;padding:3px 0;}
  .skill-row input[type=number]{width:100%;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:6px;padding:5px 0;font-family:var(--mono);font-weight:700;}

  /* ---------- SAVES ---------- */
  .save-row{display:grid;grid-template-columns:26px 1fr 60px;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--border-soft);}
  .save-row:last-child{border-bottom:none;}
  .save-row .modbadge{font-family:var(--mono);text-align:center;color:var(--gold-bright);font-weight:700;background:var(--bg-panel-3);border-radius:6px;padding:5px 0;}
  .save-row input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;}

  /* ---------- PIPS / TRACKERS ---------- */
  .tracker{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .tracker:last-child{border-bottom:none;}
  .tracker .t-name{font-size:13.5px;font-weight:600;color:var(--text);min-width:190px;}
  .tracker .t-desc{font-size:11.5px;color:var(--text-faint);flex:1;min-width:160px;}
  .pips{display:flex;gap:6px;}
  .pip{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);
    cursor:pointer;background:transparent;transition:background .15s, box-shadow .15s;
  }
  .pip.used{background:radial-gradient(circle at 35% 30%, var(--violet), var(--violet-dim));box-shadow:0 0 8px rgba(148,80,216,0.8);border-color:var(--violet);}
  .pip.death{border-color:var(--bad);}
  .pip.death.death-success{border-color:var(--good);}
  .pip.death.death-success.used{background:radial-gradient(circle at 35% 30%, #8fc97e, var(--good));box-shadow:0 0 8px rgba(111,154,99,0.7);border-color:var(--good);}
  .pip.death.death-fail.used{background:radial-gradient(circle at 35% 30%, #e0685a, var(--bad));box-shadow:0 0 8px rgba(224,104,90,0.7);border-color:var(--bad);}
  .pip.fail{border-color:var(--text-faint);}

  /* ---------- SLOTS ---------- */
  .slot-lvl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .slot-lvl:last-child{border-bottom:none;}
  .slot-lvl .lvl-badge{font-family:var(--serif);font-weight:700;color:var(--gold-bright);width:78px;font-size:13px;}
  .slot-lvl input.maxslot{width:42px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-faint);border-radius:5px;font-size:11px;padding:3px 0;}

  /* ---------- RICH TEXT ---------- */
  .rich{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;
    padding:12px 14px;font-size:14px;line-height:1.65;color:var(--text);
  }
  .rich:focus{outline:none;border-color:var(--gold);}
  .rich b, .rich strong{color:var(--gold-bright);}
  /* Editor Master: consente di ridimensionare verticalmente (drag dell'angolo in basso
     a destra) i riquadri di testo modificabili, sullo stesso principio già usato per le
     Note. Attivo solo quando l'Editor Master è acceso (classe su <body>), quindi mai
     visibile o utilizzabile in modalità giocatore. */
  body.master-editor-on .rich[contenteditable]{
    resize:vertical;overflow:auto;min-height:60px;
  }
  body.master-editor-on .inv-item-desc{
    /* niente overflow:auto qui: la descrizione non deve mai avere uno
       scroll interno. Il Master pu\u00f2 comunque ingrandirla manualmente
       (resize:vertical); se prova a ridurla sotto l'altezza del contenuto,
       il listener ResizeObserver in renderInvTable() la fa risnappare. */
    resize:vertical;overflow:hidden;min-height:44px;
  }
  /* Blocco 1: in Editor Master ogni riquadro/tabella (non solo l'inventario)
     deve potersi ridimensionare verticalmente, con lo stesso comportamento
     già usato per le Note: resize manuale dall'angolo in basso a destra. */
  body.master-editor-on .subcard,
  body.master-editor-on .tracker,
  body.master-editor-on textarea{
    resize:vertical;overflow:auto;
  }
  body.master-editor-on .subcard{min-height:80px;}
  body.master-editor-on .tracker{min-height:56px;}
  .subcard{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .subcard h3{margin:0 0 8px;font-family:var(--serif);font-size:14.5px;color:var(--gold-bright);letter-spacing:.4px;}
  .subcard .tag{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);background:rgba(255,255,255,0.05);border:1px solid var(--border-soft);border-radius:10px;padding:2px 9px;margin-bottom:8px;}
  .subcard .tag.tag-passiva{color:var(--amber);background:rgba(224,138,58,0.14);border-color:var(--amber-dim);}
  .subcard .tag.tag-truccetto{color:var(--blue);background:rgba(79,143,214,0.12);border-color:var(--blue-dim);}
  .subcard .tag.tag-abilita{color:var(--red-glow);background:rgba(201,70,59,0.14);border-color:rgba(201,70,59,0.45);}
  .subcard .tag.tag-incantesimo{color:var(--violet);background:rgba(148,80,216,0.12);border-color:var(--violet-dim);}
  .subcard .tag.tag-ambito{color:var(--teal);background:rgba(47,184,172,0.14);border-color:var(--teal-dim);}
  .subcard .tag.tag-campo{color:var(--good);background:rgba(111,154,99,0.14);border-color:rgba(111,154,99,0.45);}
  .subcard-grouped{grid-column:1/-1;}
  .subcard-subsection{padding-top:10px;margin-top:10px;border-top:1px dashed var(--border-soft);}
  .subcard-subsection:first-of-type{border-top:none;margin-top:6px;padding-top:0;}
  .subcard-subsection h4{margin:0 0 4px;font-size:13.5px;color:var(--gold-bright);font-family:var(--serif);}

  /* ---------- MASTER EDITOR (visibile solo in modalità Editor Master) ---------- */
  .master-toolbar{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-bottom:8px;padding:4px 6px;border-radius:6px;
    background:rgba(148,80,216,0.08);border:1px dashed var(--violet-dim);
  }
  .master-cat-select, .master-box-width{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:5px;font-size:10px;padding:2px 4px;max-width:120px;
  }
  .master-mini-btn, .master-mini-del{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:5px;font-size:11px;padding:2px 7px;cursor:pointer;line-height:1.3;
  }
  .master-mini-btn:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  .master-mini-del{color:var(--bad);}
  .master-mini-del:hover{border-color:var(--bad);}
  .master-eye-btn.is-hidden{color:var(--bad);border-color:rgba(176,74,63,0.5);}
  .master-hidden-item{opacity:0.55;border-style:dashed;}
  .master-add-btn{margin-top:8px;}
  .master-name-input{
    display:block;width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border-soft);
    color:var(--gold-bright);font-family:var(--serif);font-size:14.5px;letter-spacing:.4px;
    margin:0 0 8px;padding:0 0 4px;
  }
  .master-name-input:focus{outline:none;border-color:var(--gold-bright);}
  .master-tag-input, .master-uso-input{
    display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;
    background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:10px;padding:2px 9px;margin-bottom:8px;width:auto;max-width:220px;
  }
  [data-master-field][contenteditable="true"]{border-radius:4px;}
  [data-master-field][contenteditable="true"]:focus{outline:1px dashed var(--violet-dim);}
  .home-link{
    position:fixed;top:14px;left:16px;z-index:60;
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    text-decoration:none;white-space:nowrap;transition:border-color .15s, color .15s;
  }
  .home-link:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  @media (max-width:760px){
    .home-link{position:static;display:inline-flex;margin:0 0 10px;}
  }

  .master-editor-toggle{
    display:none;position:fixed;bottom:14px;left:16px;z-index:60;
    align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;white-space:nowrap;
  }
  .master-editor-toggle.show{display:flex;}
  .master-editor-toggle:hover{border-color:var(--gold-bright);}
  .master-editor-toggle.on{background:rgba(148,80,216,0.18);color:var(--violet);border-color:var(--violet);}
  @media (max-width:760px){
    .master-editor-toggle{position:static;margin:0 0 10px;}
  }

  .master-color-picker{
    display:none;position:fixed;bottom:60px;left:16px;z-index:60;
    align-items:center;gap:8px;padding:6px 12px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    white-space:nowrap;
  }
  .master-color-picker.show{display:flex;}
  .master-color-picker input[type=color]{
    width:30px;height:22px;border:none;border-radius:6px;padding:0;
    background:none;cursor:pointer;
  }
  @media (max-width:760px){
    .master-color-picker{position:static;margin:0 0 10px;}
  }

  /* ---------- EVOLUZIONI FUTURE (pannelli richiudibili) ---------- */
  .evo-note{font-size:12.5px;color:var(--text-faint);margin:-6px 0 14px;line-height:1.5;}
  .evo-level{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .evo-level:last-child{margin-bottom:0;}
  .evo-level summary{
    cursor:pointer;padding:13px 16px;font-family:var(--serif);font-weight:700;
    color:var(--gold-bright);letter-spacing:.4px;list-style:none;display:flex;align-items:center;gap:8px;
  }
  .evo-level summary::-webkit-details-marker{display:none;}
  .evo-level summary::before{content:"\25B8";color:var(--gold);transition:transform .15s;}
  .evo-level[open] summary::before{transform:rotate(90deg);}
  .evo-level summary:hover{color:var(--gold);}
  .evo-content{padding:0 16px 16px 16px;border-top:1px solid var(--border-soft);padding-top:12px;}
  .evo-content p{margin:0 0 10px;}
  .evo-content p:last-child{margin-bottom:0;}

  /* ---------- EQUIP GRID ---------- */
  .equip-slot{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .equip-slot label{display:block;font-size:10px;text-transform:uppercase;color:var(--text-faint);letter-spacing:1px;margin-bottom:4px;}
  .equip-slot input{width:100%;background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:14px;}
  .equip-slot input:focus{outline:none;}
  .img-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .thumb{width:42px;height:42px;border-radius:7px;object-fit:cover;border:1px solid var(--border-soft);background:var(--bg-panel-3);cursor:pointer;}
  .thumb-placeholder{width:42px;height:42px;border-radius:7px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:17px;background:var(--bg-panel-3);cursor:pointer;flex-shrink:0;}
  .thumb-placeholder:hover, .thumb:hover{border-color:var(--gold);}
  /* Miniature Equipaggiamento: più grandi rispetto a quelle dell'Inventario */
  #equip-slots-grid .img-row{flex-wrap:wrap;gap:10px;}
  #equip-slots-grid .thumb, #equip-slots-grid .thumb-placeholder{width:96px;height:96px;border-radius:10px;}
  #equip-slots-grid .thumb-placeholder{font-size:30px;}
  .file-btn{font-size:10.5px;color:var(--text-dim);cursor:pointer;border:1px solid var(--border-soft);border-radius:6px;padding:4px 8px;background:var(--bg-panel-2);white-space:nowrap;}
  .file-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .file-input-hidden{display:none;}
  .img-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;}
  .img-remove:hover{color:var(--bad);}

  /* ---------- INGRANDIMENTO IMMAGINE (solo Equipaggiamento) ---------- */
  .img-zoom{
    background:none;border:1px solid var(--border-soft);border-radius:6px;color:var(--text-faint);
    cursor:pointer;font-size:13px;width:24px;height:24px;line-height:1;flex-shrink:0;
  }
  .img-zoom:hover{border-color:var(--gold);color:var(--gold-bright);}
  .img-lightbox{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;}
  .img-lightbox[hidden]{display:none;}
  .img-lightbox-backdrop{position:absolute;inset:0;background:rgba(10,8,7,0.95);backdrop-filter:blur(4px);}
  .img-lightbox-content{
    position:relative;width:100%;height:100%;max-width:min(98vw,2200px);max-height:97vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transform:scale(.96);opacity:0;transition:transform .16s ease,opacity .16s ease;
  }
  .img-lightbox.show .img-lightbox-content{transform:scale(1);opacity:1;}
  .img-lightbox-content img{display:block;max-width:100%;max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:12px;border:1px solid var(--border-soft);box-shadow:0 16px 60px rgba(0,0,0,0.6);}
  .img-lightbox-caption{color:var(--gold-bright);font-size:15px;font-weight:600;text-align:center;}
  .img-lightbox-caption[hidden]{display:none;}
  .img-lightbox-close{
    position:absolute;top:-16px;right:-16px;width:42px;height:42px;border-radius:50%;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    font-size:24px;line-height:1;cursor:pointer;
  }
  .img-lightbox-close:hover{border-color:var(--gold);color:var(--gold-bright);}
  @media (max-width:720px){
    .img-lightbox{padding:8px;}
    .img-lightbox-content{max-width:100vw;max-height:100vh;gap:10px;}
    .img-lightbox-content img{max-height:calc(100vh - 70px);}
    .img-lightbox-close{top:-13px;right:2px;width:38px;height:38px;font-size:22px;}
  }

  /* ---------- INVENTORY ---------- */
  .inv-cap{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .inv-bar{flex:1;min-width:200px;height:16px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;}
  .inv-bar-fill{height:100%;transition:width .3s, background .3s;}
  /* Elenco Inventario: card verticali, ordine Nome -> Descrizione -> Peso.
     La descrizione non ha altezza fissa né scroll interno: si espande col contenuto. */
  .inv-list{display:flex;flex-direction:column;gap:10px;}
  .inv-item{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .inv-item-top{display:flex;align-items:center;gap:10px;}
  .inv-item input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;}
  .inv-item .imgcell{flex-shrink:0;}
  .inv-item-name{background:transparent;border:none;color:var(--text);font-weight:600;font-size:14px;flex:1;min-width:0;}
  .inv-item-name:focus, .inv-item-desc:focus{outline:none;background:var(--bg-panel-3);border-radius:4px;}
  .inv-item-desc{
    display:block;width:100%;box-sizing:border-box;margin-top:8px;
    background:transparent;border:none;color:var(--text-dim);font-size:13px;font-family:var(--sans);
    line-height:1.5;resize:none;overflow:hidden;min-height:22px;padding:4px 2px;
  }
  .inv-item-peso{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
  .inv-item-peso label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);}
  .inv-item-peso input[type=number]{width:52px;background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:5px;text-align:center;font-family:var(--mono);}
  .inv-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;flex-shrink:0;}
  .inv-remove:hover{color:var(--bad);}

  /* ---------- PORTRAITS ---------- */
  .portraits{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){.portraits{grid-template-columns:1fr;}}
  .portrait{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-soft);}
  /* Il resize verticale nativo (angolo in basso a destra) \u00e8 disponibile
     solo in Editor Master: solo il Master controlla la dimensione del
     riquadro, il giocatore controlla solo immagine e didascalia. */
  body.master-editor-on .portrait{resize:vertical;}
  .portrait img{width:100%;display:block;filter:saturate(1.05) contrast(1.03);cursor:pointer;}
  /* Quando il riquadro ha un'altezza personalizzata (persistita dal
     Master), l'immagine usa object-fit:cover per non deformarsi mai. */
  .portrait.has-h img{height:100%;object-fit:cover;}
  .portrait .cap{
    position:absolute;bottom:0;left:0;right:0;padding:10px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
    font-family:var(--serif);letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:var(--gold-bright);
    border:none;outline:none;width:100%;box-sizing:border-box;
  }
  .portrait .cap:focus{background:linear-gradient(0deg, rgba(0,0,0,0.92), rgba(0,0,0,0.35));}

  /* ---------- NOTES ---------- */
  .note-entry{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .note-entry .note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .note-entry input[type=text]{background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:13px;width:70%;}
  .note-entry input[type=text]:focus{outline:none;}
  .note-entry textarea{background:transparent;border:none;color:var(--text);width:100%;min-height:70px;font-size:13.5px;}
  .note-entry textarea:focus{outline:none;}
  .note-date{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}

  .savebar{
    position:static;margin:28px 0 40px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    max-width:min(94vw, 620px);justify-content:flex-end;
    font-size:11px;color:var(--text-faint);
    background:rgba(20,16,14,0.9);border:1px solid var(--border-soft);border-radius:16px;
    padding:8px 10px;
  }
  .savebar b{color:var(--gold-bright);}
  .savebar .btn{padding:5px 11px;font-size:10.5px;border-radius:14px;}
  .savebar .sep{width:1px;height:16px;background:var(--border-soft);}
  .savebar.warn{border-color:var(--bad);}
  .savebar-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--gold-bright);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;flex-shrink:0;white-space:nowrap;
  }
  .savebar-toggle:hover{border-color:var(--gold-bright);}
  .savebar.collapsed{padding:6px 8px;gap:0;}
  .savebar.collapsed .savebar-content{display:none;}
  .savebar #savebar-status.warn-text{color:#ff9d90;font-weight:600;}
  @media (max-width:760px){
    .pip{width:28px;height:28px;}
    .pips{gap:8px;}
    .btn{padding:10px 14px;font-size:13px;}
    .btn.small{padding:8px 12px;}
    .tab-btn{padding:14px 15px;}
  }

  /* Su smartphone il riquadro comandi non deve restare "fixed" sopra i contenuti
     durante lo scroll: torna nel normale flusso della pagina, in fondo alla scheda. */
  @media (max-width:768px){
    body{ padding-bottom:0; }
    .savebar{
      position:static;
      bottom:auto; right:auto; left:auto; top:auto;
      width:auto; max-width:none;
      margin:24px 20px 20px;
      justify-content:center;
      backdrop-filter:none;
    }
  }
  #btn-print{background:linear-gradient(180deg, #22301f, #182013);border-color:var(--good);}
  #btn-print:hover{color:#b9e0ac;}

  .divider-label{font-family:var(--serif);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);margin:22px 0 8px;text-align:center;position:relative;}
  .divider-label::before,.divider-label::after{content:"";position:absolute;top:50%;width:38%;height:1px;background:var(--border);}
  .divider-label::before{left:0;}
  .divider-label::after{right:0;}

  /* ---------- SCHERMATA DI ACCESSO ---------- */
  #lock-screen{
    position:fixed;inset:0;z-index:9999;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.12), transparent 60%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .lock-box{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);border-radius:12px;
    padding:32px 30px;max-width:340px;width:100%;text-align:center;
  }
  .lock-box h2{
    font-family:var(--serif);color:var(--gold-bright);text-transform:uppercase;letter-spacing:1.6px;
    font-size:20px;margin:0 0 8px;
  }
  .lock-box p{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
  .lock-box input[type=password]{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:10px 12px;font-size:14px;width:100%;text-align:center;margin-bottom:12px;
  }
  .lock-box input:focus{outline:none;border-color:var(--gold);}
  .lock-box button{
    background:linear-gradient(180deg, #3a2a12, #241a0c);border:1px solid var(--gold);color:var(--gold-bright);
    border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;width:100%;
  }
  .lock-box button:hover{opacity:0.9;}
  .lock-error{color:#ff9d90;font-size:12px;margin-top:10px;min-height:14px;}

  /* ---------- STAMPA PULITA ---------- */
  @media print{
    @page{ margin:10mm; }
    body{ background:#fff !important; color:#111 !important; padding-bottom:0 !important; font-size:11px !important; }
    .tabbar, .savebar, .hero-hint, #hero-image-input, #import-input,
    .thumb, .thumb-placeholder, .file-btn, .img-remove, .img-row, .img-zoom, #img-lightbox,
    .inv-remove, #inv-add, #reset-slots, #reset-risorse, #lock-screen{ display:none !important; }
    .wrap{ padding:12px 0 !important; max-width:100% !important; }
    .hero{
      background:none !important; padding:2px 0 8px !important; border-bottom:2px solid #111 !important;
      cursor:default !important;
    }
    .hero::before{ display:none !important; }
    .hero-inner{ align-items:baseline !important; gap:8px !important; }
    .editable-name{ color:#000 !important; text-shadow:none !important; border:none !important; font-size:26px !important; }
    .hero-sub{ color:#444 !important; font-size:11px !important; margin-top:2px !important; }
    .hero-chip{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; backdrop-filter:none !important; padding:2px 9px !important; font-size:10.5px !important; }
    .hero-chip b{ color:#000 !important; }
    .hero-meta{ gap:6px !important; }

    .panel{ display:block !important; }
    .card, .subcard{
      background:#fff !important; border:1px solid #999 !important; box-shadow:none !important;
      page-break-inside:avoid; break-inside:avoid;
      padding:8px 10px !important; margin-bottom:6px !important; border-radius:5px !important;
    }
    .card h2{ color:#000 !important; border-bottom:1px solid #999 !important; font-size:10.5px !important; margin:0 0 6px !important; padding-bottom:3px !important; letter-spacing:.6px !important; }
    .card h2 small{ display:none !important; }
    input, textarea, select{ color:#000 !important; background:transparent !important; border:none !important; font-size:11px !important; padding:2px 3px !important; }
    .rich{ background:#fff !important; border:1px solid #ccc !important; color:#000 !important; padding:6px 8px !important; font-size:10.5px !important; line-height:1.4 !important; }
    .rich b, .rich strong{ color:#000 !important; }

    /* forza colonne compatte indipendentemente dal breakpoint a schermo */
    .grid{ gap:5px !important; }
    .grid-6{ grid-template-columns:repeat(6,1fr) !important; }
    .grid-4{ grid-template-columns:repeat(4,1fr) !important; }
    .grid-3{ grid-template-columns:repeat(3,1fr) !important; }
    .grid-2{ grid-template-columns:repeat(2,1fr) !important; }

    /* caratteristiche: molto più compatte */
    .abil-box{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .abil-box .name{ color:#000 !important; font-size:8.5px !important; letter-spacing:.3px !important; }
    .abil-box input[type=number]{
      color:#000 !important; background:transparent !important; border:none !important;
      font-size:13px !important; width:32px !important; margin:2px auto 1px !important; padding:0 !important;
    }
    .abil-box .mod{ color:#000 !important; font-size:13px !important; }

    .statpill{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .statpill label{ font-size:8.5px !important; margin-bottom:2px !important; }
    .statpill input{ color:#000 !important; font-size:12px !important; }

    .save-row, .skill-row{ padding:3px 4px !important; }
    .save-row .modbadge{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; padding:2px 0 !important; }
    .skill-row input, .inv-item input, .inv-item textarea{ color:#000 !important; }
    .skill-abbr{ background:#fff !important; border:1px solid #ccc !important; color:#333 !important; font-size:9px !important; padding:1px 0 !important; }

    .hp-row{ gap:8px !important; }
    .hp-numbers input{ padding:3px 0 !important; }
    .pip{ width:15px !important; height:15px !important; border-color:#000 !important; }
    .pip.used{ background:#000 !important; box-shadow:none !important; }
    .hp-track, .inv-bar{ height:12px !important; border:1px solid #000 !important; background:#fff !important; }
    .hp-fill, .inv-bar-fill{ background:#999 !important; }

    .equip-slot{ background:#fff !important; border:1px solid #ccc !important; padding:5px 6px !important; }
    .equip-slot label{ font-size:8.5px !important; }
    .equip-slot input{ color:#000 !important; font-size:11px !important; }

    .inv-item .imgcell{ display:none !important; }
    .inv-item{ padding:4px 5px !important; }
    .tracker{ padding:5px 0 !important; }
    .slot-lvl{ padding:4px 0 !important; }

    .portraits, .portrait{ display:none !important; }
    .divider-label{ color:#444 !important; margin:10px 0 6px !important; font-size:9.5px !important; }
    .divider-label::before, .divider-label::after{ background:#999 !important; }
    .subcard{ padding:6px 8px !important; }
    .subcard .tag{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; font-size:8.5px !important; padding:1px 7px !important; margin-bottom:4px !important; }
    .subcard h3{ color:#000 !important; font-size:12px !important; margin:0 0 4px !important; }
    a{ color:#000 !important; text-decoration:underline; }
  }

</style>
</head>

function slugify(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

/* Colore funzionale del "tag" di una capacit\u00e0, dedotto dal testo del tag stesso
   (non dall'array di appartenenza): Passiva = viola, Truccetto = blu, Abilit\u00e0/Incantesimo = rosso. */
function tagColorClass(tag){
  const t = String(tag || "");
  if (/^passiva/i.test(t)) return "tag-passiva";
  if (/^truccetto/i.test(t)) return "tag-truccetto";
  if (/incantesimo/i.test(t)) return "tag-incantesimo";
  if (/abilit/i.test(t)) return "tag-abilita";
  return "";
}
const ATTACCHI_LINKS = [{"label": "Guanti del Monaco Difensore", "tab": "equip", "anchor": "anchor-guanti-del-monaco-difensore"}];
function renderAttacchiNav(){
  if (!ATTACCHI_LINKS.length) return "";
  return `<div class="quicknav">${ATTACCHI_LINKS.map(l=>`<span class="quicknav-pill" data-jump-tab="${l.tab}" data-jump-anchor="${l.anchor}">${l.label}</span>`).join("")}</div>`;
}
function bindQuicknav(){
  document.querySelectorAll(".quicknav-pill").forEach(el=>{
    el.addEventListener("click", ()=> jumpToAnchor(el.dataset.jumpTab, el.dataset.jumpAnchor));
  });
}
function jumpToAnchor(tabId, anchorId){
  const btn = document.querySelector('.tab-btn[data-tab="'+tabId+'"]');
  if (btn) btn.click();
  setTimeout(()=>{
    const el = anchorId ? document.getElementById(anchorId) : null;
    const target = el || document.getElementById("panel-"+tabId);
    if (target){
      target.scrollIntoView({behavior:"smooth", block:"start"});
      if (el){
        el.classList.add("anchor-flash");
        setTimeout(()=>el.classList.remove("anchor-flash"), 1500);
      }
    }
  }, 80);
}

    {nome:"Modificatore Fisico (Lvl 6)", tag:"Passiva", width:2, hidden:false, desc:"Il pg acquisisce la capacità di mutare la forma del suo fisico e poterlo modellare a sua scelta, essendo malleabile il corpo del pg può avere diverse applicazioni sia in combattimento che no, ex braccio tagliente (da discutere con il Dm)."},
    {nome:"Energia Pura (Lvl 7)", tag:"Passiva", width:2, hidden:false, desc:"Il corpo dell'ibrido si evolve a tal punto da riuscire a immagazzinare l'energia in esubero, tutte le azioni e le entrate in combattimento del pg consumano solo ed esclusivamente 1 di energia, rimangono però a 5 le trasformazioni."},
    {nome:"Rig. Cell. Superiore (Lvl 7)", tag:"Passiva", width:2, hidden:false, desc:"Ogni turno di combattimento il pg rigenera 1PV, esclusi i combattimenti il pg ha la capacità di rigenerare 1PV per ora. In caso di perdita di arti, la loro ricrescita avverrebbe per metà, risultando più piccoli del normale come se fossero di fanciulli (la ricrescita effettiva non sarebbe sicura al 100%, pertanto il PG potrebbe tornare alle sue complete funzioni motorie come no)."},
    {nome:"Corazza Rinforzata (Lvl 7)", tag:"Passiva", width:2, hidden:false, desc:"CA = 17 (se non si indossa equipaggiamento che la possa modificare, in caso contrario si perderebbe il beneficio di Corazza Rinforzata e si calcolerebbe la CA come di prassi 10 + Mod. Destrezza + Bonus Competenza)."},
    {nome:"Adattamenti Animali (Lvl 8)", tag:"Passiva", width:2, hidden:false, desc:"Amplia il repertorio biologico: sblocca 2 nuovi vantaggi animali a scelta tra quelli conosciuti, già osservati o presenti nell'archivio genetico. Entrano stabilmente a far parte del repertorio e si richiamano come i normali vantaggi genetici animali."}

  abilita: [
    {nome:"Sintesi Parziale (Lvl 8)", tag:"Abilità", width:2, hidden:false, desc:"Richiama in modo incompleto e controllato i vantaggi delle proprie trasformazioni, senza attivarle per intero. Spendendo un solo slot, mantiene in forma base un solo elemento o vantaggio a scelta di una trasformazione già posseduta — una componente fisica visibile (ali, gambe mutate, arti specializzati) oppure un beneficio interno (bonus a una caratteristica, resistenza, PF extra, mobilità, sensi). Resta stabile finché non si passa a una trasformazione completa (nessun ulteriore slot richiesto per farlo). Una volta nel turno avversario può tentare di modificare rapidamente il vantaggio attivo o richiamare una risposta mutagena istantanea (scudo, schivata adattiva, corazza improvvisa...) con un TS Costituzione CD 16. In caso di successo, il cambio o la risposta si attivano immediatamente, permettendo alla sintesi di adattarsi anche nel pieno della pressione nemica."},
    {nome:"Doppio Volto (Lvl 7)", tag:"Abilità", width:2, hidden:false, desc:"Il pg acquisisce la capacità di creare una copia esatta di se stesso, scegliendo quanto dividere tra il suo corpo e quello della copia tra PF e Danni; essendo mentalmente connessi, ed essendo lo stesso essere, il giocatore potrà compiere gesti e parlare da entrambi i corpi proprio come se non si fosse mai diviso. Se il tiro dovesse uscire inferiore a 5 la copia avrebbe la personalità alternativa del pg e sarebbe un avversario a tutti gli effetti per i giocatori. Danni aggiuntivi 3d6 + 2 + 24 PF: questi dati potranno essere gestiti interamente dal giocatore, che potrà decidere di dividerli equamente in entrambi gli involucri o potenziarne uno e minimizzare l'altro. L'importante è che sopravviva uno dei due esseri, non importa quale. Fino a quando la copia sarà sul campo di battaglia il pg non potrà effettuare trasformazioni. Il pg non è obbligato a dividersi in una copia sola. (Durata tutto lo scontro / 8h)"}
  ],
  incantesimo: [],
  divergenzaIntro: "Il PG ha la facoltà di trasformare il proprio fisico in base alle evenienze, maturando vantaggi tattici. Ogni trasformazione ha modificatori propri e abilità intrinseche specifiche, considerate <b>trucchetti</b> (non consumano slot abilità). Ogni trasformazione dura tutto lo scontro; all'inizio dello scontro il PG può tentare un tiro Trasformazione Extra per cambiare aspetto. Il costo energetico di ogni trasformazione è di <b>5 punti energia</b>. I modificatori indicati per ciascuna trasformazione sono bonus da aggiungere alla caratteristica selezionata.",

  trasformazioni: [
    {nome:"Alterazione: Velocità", tag:"Abilità", width:1, hidden:false, desc:"Mod. Destrezza +4 · Movimento 20 · Bonus attacco +2 · +10 PF temporanei.<br><br>Corpo a corpo: 5d6+2 danni contundenti (rischio di stordire il nemico).<br><br>Il pg sviluppa la capacità di mutare la sua stazza fisica per agevolarsi negli spostamenti, ma soprattutto in combattimento, diventando più abile nello spostamento e nella schivata: mutazioni riconducibili a un fisico asciutto, gambe da metà ghepardo, braccia molto snelle, gomiti e testa a punta curva all'indietro per aerodinamicità, coda più corta.<br><br><b>Abilità Specifica:</b> nel turno avversario può compiere un tiro opposto per tentare di schivare l'attacco. Quantità 3."},
    {nome:"Alterazione: Forza", tag:"Abilità", width:1, hidden:false, desc:"Mod. Forza +4 · Movimento 7 · Bonus attacco +4 · CA +1 · +20 PF temporanei.<br><br>Corpo a corpo: 7d6+2 danni pesanti (rischio di azzoppare il nemico).<br><br>Il pg sviluppa la capacità di mutare la sua stazza fisica per avvantaggiarsi negli scontri fisici e nei combattimenti dove è richiesta più potenza: mutazioni riconducibili a un fisico possente e nerboruto, non troppo imponente, gambe e braccia grosse e spesse come zampe d'elefante, petto doppio, vita stretta come un gorilla, coda lunga come un lizardiano, con corna.<br><br><b>Abilità Specifica:</b> una volta per riposo lungo può andare in Berserk, +2d6 danni. Quantità 1."},
    {nome:"Alterazione: Volo", tag:"Abilità", width:1, hidden:false, desc:"Mod. Forza +1, Mod. Destrezza +2 · Movimento 15 (volando) · Bonus attacco +3 · +10 PF temporanei.<br><br>Corpo a corpo: 6d6+2 danni da sanguinamento.<br><br>Il pg sviluppa la capacità di mutare la sua stazza fisica per avvantaggiarsi negli scontri sviluppando caratteristiche fisiche riconducibili a rapaci e volatili: ali e becco, così da raggiungere un'aerodinamicità spiccata, coda ridimensionata, artigli, e una stazza fisica complessivamente ridotta.<br><br><b>Abilità Specifica:</b> con un movimento d'ali attacca a distanza con turbini/colpi d'aria, 3d6 a colpo, max 2 di fila — se entrambi in successione, il secondo non richiede tiro sulla CA nemica (danno automatico). Quantità 4."},
    {nome:"Alterazione: Mini", tag:"Abilità", width:1, hidden:false, desc:"Mod. Forza +2, Mod. Destrezza +3 · Movimento 5 · Bonus attacco +3 · +10 PF temporanei.<br><br>Corpo a corpo: 5d6+2 danni da paralisi (elettricità).<br><br>Il pg sviluppa la capacità di mutare la sua stazza fisica per avvantaggiarsi negli scontri, riducendo di molto la sua statura fino a diventare difficilmente reperibile per i nemici, mantenendo però tutti i vantaggi, le caratteristiche e le abilità della forma normale.<br><br><b>Abilità Specifica — Colpo Devastante:</b> forza sufficiente a sollevare fino a 10 volte il proprio peso, concentrata in un colpo letale: 12d6 danni. Quantità 2, max 1 per scontro."},
    {nome:"Alterazione: Ancestrale", tag:"Abilità", width:3, hidden:false, desc:"<p><b>ALTERAZIONE FISICA : ANCESTRALE</b> PF +10 (Temporanei)</p>\n<p>MOD. INT + 2/MOD.CAR + 3/VELOCITÀ MOV. 9/BONUS TIRI PER CURE + 2</p>\n<p>Danni corpo a corpo: 5d6+2 danni, ogni colpo inferto 1d12 cure o 6Pf fissi, il pg commuta le sue ossa in un'arma simil bastone che può utilizzare per combattimento che comanda con telecinesi a distanza max 5 caselle. Il pg sviluppa la capacità di mutare la sua corporatura in una forma snella e somigliante ad un essere celeste (privo di ali) ma soprattutto acquisisce la capacità di combinare le sue capacità energetiche a quelle di luce dell'arcangelo. Il pg ha la facoltà di levitare costantemente ed elevarsi per brevi periodi non superiori ad 1h o 3 turni, passato un turno in discesa si potrà effettuare nuovamente l'ascesa. il PG acquisisce la capacità di curare gli alleati o se stesso avendo a disposizione 150 PF da poter ripartire con un max di 50 a giocatore. Ogni pg può avere un massimo di 20PF temporanei se già full vita. CD 16 su CARISMA (basterà effettuare una sola volta il tiro per poter curare gli alleati che si desidera). Il pg in questa forma acquisisce la possibilità di creare grandi colpi di energia combinati con luce santa, potenziando i suoi attacchi a distanza 8d6 max 10 caselle(ad ogni attacco 1d8 cure o 2d4). Il pg ha la capacità di guardare per un lasso di tempo breve nel passato di un personaggio toccandolo. CD 16 CARISMA. Il pg può leggere nella mente dei personaggi per un breve lasso di tempo. CD 16 CARISMA. Il PG può parlare direttamente con il dio della Vita LINFEUS. Qualora nel combattimento dovesse essere presente l'arcangelo Lux (o addirittura altri arcangeli)potrebbero esserci dei potenziamenti casuali. Durante la trasformazione il PG avrà a disposizione degli Slot unici che potranno essere utilizzati come \"Slot Incantesimi\" esclusivamente per le abilità della trasformazione corrente n. 5lvl 1, 4 lvl2, 3 lvl3, 2 lvl 4 e 1 lvl 5. Durante la trasformazione il PG potrà creare oggetti di luce, armi, protezioni per se' stesso o per gli altri o addirittura famigli. In base al livello dello slot il PG evocherà una magia più potente. Esempio slot lvl 1 famiglio = 1d6, 10pf, 10CA; slot lvl 6 = 6d6, 60 PF, 17 CA. <b>Abilità Specifica :</b> il pg acquisisce la possibilità di modellare la luce immagazzinata per poter creare oggetti, aumentare la sua forza creando pugni di luce o armi, aumentare la sua robustezza + CA, oppure evocare un famiglio di luce di qualsiasi entità a sua scelta. Tutti gli effetti delle abilità svaniranno una volta terminata la trasformazione.</p>\n<p><b>Creazione oggetti :</b> Lvl 1 = piccola taglia / Lvl 2 = media taglia / Lvl 3 = 1 piccolo e 1 medio o 3 piccoli / Lvl 4 = grande taglia / Lvl 5 = 1 grande taglia + 1 medio o 6 piccoli o 3 medi o 1 medio e 4 piccoli o 2 medi o 2 piccoli</p>\n<p><b>Bonus Attacco :</b> Lvl 1 = + 1d4 (piccola arma di luce) / Lvl 2 = + 1d6 ( arma di luce leggera / pugni di luce) / Lvl 3 = + 1d8 o 2 d4 ( arma di luce pesante / braccia di luce + 1 caselle distanza colpo nemico) Lvl 4 = + 1d12 o 2d6 (doppia arma leggera o braccio scheletrico aggiuntivo + 1 azione bonus + 2 caselle) / Lvl 5 = + 1d20 o 2d10 (doppia arma a scelta o braccia scheletriche aggiuntive dalla schiena + 1 CA + 1 azione bonus + 4 caselle + Tpc +4)</p>\n<p><b>Armatura Ancestrale :</b> Lvl 1 = + 1 CA (1 solo PG) / Lvl 2 = + 2 CA (1 solo PG) / Lvl 3 = + 1 CA ( 2 PG) + 10 PF Temporanei o + 2 CA e 20 PF (Solo 1) / Lvl 4 = + 3 CA e 30 PF (1 PG) o + 2 CA e 20 PF (2 PG) o + 1 CA e 10 PF (3 PG) / Lvl 5 = + 4 CA e 40 PF o + 3 CA e 30 PF (3 PG) o TUTTI i tuoi alleati compreso te + 2 CA e 20 PF</p>\n<p><b>Evocazione :</b> (Mentre le evocazioni saranno sul campo di battaglia il PG donerà parte della sua potenza per evocarle pertanto in base al danno che queste arrecheranno verrà decurtato dalla potenza massima del PG. Ex. 1 evocazione Lvl 1 danno 1d6, danno PG totale - 1d6 quindi 4d6 + 2)</p>\n<p>Lvl 1 = 1 evocazione/ 1d6 / 10 pf / 10 CA / 5 Movimento (Abilità: L'evocazione può compiere un salto di 5 caselle al termine dello spostamento per raggiungere il nemico)</p>\n<p>Lvl 2 = 1 evocazione / 2d6 / 20 pf / 12 CA / 6 Movimento (Abilità: l'evocazione può esplodere a comando o una volta colpita prima di svanire)</p>\n<p>Lvl 3 = 3 evocazioni di Lvl 1 o 1 evocazione 3d6 / 30 pf / 14 CA / 7 movimento (Abilità: L'evocazione ha la possibilità di effettuare un secondo Tpc se il primo dovesse fallire)</p>\n<p>Lvl 4 = 4 evocazioni Lvl 1 o 1 lvl 3 e 1 Lvl 1 o 2 Lvl 2 o 1 evocazione 4d6 / 40 pf / 16 CA / 8 movimento (Abilità: l'evocazione può effettuare un colpo a distanza con gli stessi danni del Cac)</p>\n<p>Lvl 5 = 5 evocazioni Lvl 1 o 1 Lvl 4 e 1 lvl 1 o 1 Lvl 3 e 2 Lvl 2 o 2 Lvl 2 e 1 lvl 1 o 1 evocazione da 5d6 / 5d6 / 18 CA / 9 movimento (Abilità: L'evocazione può essere divisa in più evocazioni, in base ai PF rimanenti. Ex quando raggiunge 50 PF si divide in una di Lvl 4 e 1 di Lvl 1, continuando così quella di Lvl 4 una volta colpita potrebbe dividersi in due di Lvl 2 mantenendo la sua abilità ma una volta trasformata può utilizzare anche quella dell'evocazione corrente). In base alle sembianze che prenderà l'evocazione questa avrà dei micro bonus sulle caratteristiche principali.</p>\n<p><b>FORZA</b> + 2 a Forza + 10PF + 1 CA / <b>VELOCITA'</b> + 2 a Destrezza + 5 PF + 2 su tiri per schivare + spostamento 12 caselle / <b>VOLO</b> + 1 Forza e + 1 Destrezza + può volare + spostamento 15 caselle / <b>MINI</b> + 2 Forza + 2 Destrezza + 2 danni bonus + 2 svantaggio ai Tpc dei nemici / <b>ANCESTRALE</b> + 2 SAGGEZZA + 2 CARISMA + 60 PF che può ripartire come preferisce agli alleati / <b>PURA ENERGIA</b> Distanza Caselle 20 (colpi) + 1CA. /<b>DEMONIACA</b> + 5 Danni elettrici a colpo + possibilità di lanciare palle di energia ai nemici distanza 15 caselle / <b>RUST</b> + 2 CA + 5 danni + 20 PF / <b>STEALTH</b> + 4 DESTREZZA + possibilità di compiere attacchi furtivi con bonus + 5 ai TpC</p>", slotsTemp:[{lvl:1,max:6,used:0},{lvl:2,max:5,used:0},{lvl:3,max:4,used:0},{lvl:4,max:3,used:0},{lvl:5,max:2,used:0},{lvl:6,max:1,used:0}]},
    {nome:"Alterazione: Pura Energia", tag:"Abilità", width:2, hidden:false, desc:"<p><b>ALTERAZIONE FISICA : PURA ENERGIA</b></p>\n<p>MOD. COST + 3 / CA + 3 / VELOCITÀ MOV. 5 / PF TEMPORANEI +30</p>\n<p>Il PG sblocca la piena capacità di assorbire ed espellere energia, così facendo diventa a tutti gli effetti un vero e proprio catalizzatore vivente. In questa forma il suo corpo mantiene le condizioni fisiche standard ma diventa, quasi completamente etereo, un ammasso di pura energia. Il PG può compiere 4 azioni durante il turno. Danni 6d6, gli esseri viventi sono composti da energia, ogni qualvolta il PG colpisce un nemico questo viene depredato della sua energia vitale e il PG aumenta di potenza. Gli effetti potrebbero essere casuali quali, difficoltà di movimento/deambulazione, perdita di memoria, svenimenti, MORTE ISTANTANEA. Ola è in grado di assorbire gran parte o tutta l'energia di un essere, quando lo fa' guadagna +1d6. CD 17 . Ogni volta che assorbe energia da un nemico, tira un d6. Se esce 1, accumula un \"punto di instabilità\" altrimenti gli altri saranno \"punti energia\". Al 4° punto, <b>rischia di perdere il controllo</b>: TS COSTITUZIONE CD 15, se fallisce esplode in un raggio di 10 caselle, infliggendo 20d6 a tutti (incluso sé stesso, ripartito per tutti i presenti). L'energia può essere scaricata nel terreno o dispersa in metallo/elementi conduttori. In questo stato il PG è letteralmente energia, pertanto ogni qualvolta qualcuno tenterà di attaccarlo, dovrà effettuare un TS COSTITUZIONE CD 16 per evitare di prendere danni Folgoranti. In caso di fallimento 2d6 danni folgoranti nell'immediatezza e 1d6 x tutto lo scontro. La potenza incanalata nel PG è così tanta che i suoi movimenti sono rallentati, esso levita costantemente da terra a furia dell'elettromagnetismo, senza nessuno sforzo. Gli attacchi non si distinguono tra Mischia e Distanza, in questo particolare stato, il nemico verrà attinto da fulmini e saette a prescindere dal tipo di attacco, basterà che sia nel campo di azione di 15 caselle. Con 2 punti energia può entrare temporaneamente nel corpo di un nemico ed impossessarsi di esso effettuando un tiro su COSTITUZIONE contrapposto. Una volta superato il Nemico non potrà effettuare nessuna azione se non ritentando i TS che aumenteranno gradualmente di difficoltà. Durata max 4 turni. Con 3 punti energia e se non effettua nessuno spostamento, il PG entra in modalità \"Tesla\", questo allarga il campo di attacco a 30 caselle e aggiunge +2d6 ai danni, in questa modalità il PG guadagna +1CA, poiché viene avvolto da fulmini. In presenza di superfici d'acqua, metallo o magie \"conduttrici\", Ola non può usare la modalità Tesla e il raggio d'azione si dimezza. I nemici in queste aree ricevono solo metà dei danni. In questo stato, non essendo fisico, non può compiere azioni complesse, aprire porte, raccogliere oggetti, usare oggetti magici non integrati nel corpo. Per qualsiasi interazione fisica, deve tornare in forma materiale. In modalità Tesla Ola può attaccare tutti i nemici nel raggio a sua disposizione ripartendo i dadi che ha come danni, anche se distanti tra loro (purché entrambi nel raggio). In questo stato il PG ha la capacità di attrarre metalli a sè, in modalità normale entro 10 caselle in modalità Tesla entro 30. <b>Abilità Specifica :</b> il PG ottiene abbastanza potenza da entrare in modalità Tesla Avanzata, questo permetterà di avere un raggio d'azione di 50 Caselle, un + 2 sulla CA e bonus ai danni di + 4d6 + 20 PFT. In modalità Tesla Avanzata il Pg, potrà comandare più nemici contemporaneamente. questi dovranno sostenere un TS su COSTITUZIONE CD 17, in caso di fallimento, il PG potrà fargli compiere azioni basiche o attacchi. Tot Max 6 Nemici. La trasformazione avrà termine alla fine dello scontro. 1 ogni 2 Riposi Lunghi.</p>"},
    {nome:"Alterazione: Demoniaca", tag:"Abilità", width:3, hidden:false, desc:"<p><b>ALTERAZIONE FISICA : DEMONIACA</b></p>\n<p>MOD. FOR + 2 / MOD. DEST + 2 / CA + 1 / VELOCITÀ MOV. 9 / BONUS TIRI MUTAZIONE + 2 / PF TEMPORANEI +10</p>\n<p>La trasformazione prevede due varianti con le quali il PG si può alternare facendo un tiro su COSTITUZIONE che non richiede azioni. Il PG acquisisce la capacità di mutare il suo corpo in una forma muscolosa e somigliante ad un essere demoniaco. In questa particolare forma avrà la possibilità di alternarsi in due specifiche sotto trasformazioni. Una somigliante al demone Rust, quindi considerata d'attacco e mischia, con poteri di fuoco, ed una più furtiva, utilizzante il potere demoniaco e l'emomanzia. Nella sua forma base il personaggio ha comunque delle capacità demoniache. Danni CaC 5d6 + 4, il PG può una volta per scontro tentare di assorbire linfa vitale dal nemico che sta combattendo max 2 x scontro. I danni inferti saranno i PF recuperati, se full, possono essere convertiti in Temporanei per un max di 30PF. Max 3 CD 16. Il PG ha la possibilità di guardare negli occhi un essere senziente, è capire la sua natura se benevola o malevola. Nel caso in cui fosse malevola, potrebbe tentare un tiro per consumare l'anima del nemico fino a poterlo uccidere. CD 18( Dipende dai casi). Il PG può parlare direttamente con il dio della Morte CRATUS. Il PG può utilizzare tutte le abilità demoniache rubate da Ervork durante il suo viaggio, ma a sua differenza può immagazzinarle tutte senza avere limiti di spazio. Queste abilità consumano slot ammenochè non ci sia specificata la quantità di utilizzo allora verrebbero considerate \"trucchetti\".</p>\n<p>ABILITÀ DEMONE OBELIX : Possibilità di evocare delle catene e poterle utilizzare come meglio si preferisce. Queste hanno un attacco che intrappola il nemico facendogli patire le peggiori pene mentali e fisiche decise dal demone 2d6 ogni turno x 2 turni max 1 volta a scontro CD 16. In più si ha la facoltà di evocare raggi laser dagli occhi come lo stesso Obelix, danno a distanza 6d6.<br>ABILITÀ X:</p>\n<p><b>Abilità Speciale :</b> Il PG può tentare di piegare il volere del nemico ipnotizzandolo, ad una distanza massima di 8 caselle, i personaggi ipnotizzati eseguono temporaneamente gli ordinativi del giocatore, alcuni imperativi però potrebbero non funzionare a seconda del nemico scelto. Non ha effetto su creature pure. Durata 3 turni, una volta terminato l'effetto, se il giocatore ha a disposizione un'azione, può automaticamente ripetere il tiro per soggiogare la mente del nemico. CD 16</p>\n<h4>Variante Rust</h4>\n<p>MOD. FOR + 4 / MOD. DEST + 3 / CA + 3 / VELOCITÀ MOV. 8 / PF TEMPORANEI +10</p>\n<p>Il pg muta totalmente diventando molto più grosso e alto, con fuoco che fuoriesca dalla sua testa. Questa trasformazione deriva dal demone Rust insito nel corpo di Ervork pertanto si potrà dialogare con il summenzionato demone. Danni corpo a corpo: 7d6 oppure due attacchi da 3d6+3 ciascuno, se effettuati sullo stesso nemico di fila o un nemico non più distante di 2 caselle, non è necessario effettuare il secondo tiro sulla CA. Il PG può creare delle armi di fuoco con cui combattere durante lo scontro +1d6 ad arma max 2. Ogni arma generata equivarrà ad uno slot del PG. il PG ha la possibilità di compiere attacchi di puro fuoco misto energia, creando delle combinazioni di potenza demoniaca, questi attacchi a distanza, avranno un bonus aggiuntivo se caricati. (Minimo di carica 1 turno, max 4) Attacco Base 7d6 / <b>1° turno</b>(ossia il secondo turno passato in concentrazione)  totale danni  9d10(+1 al tiro per colpire + 1d4 danni incendiari x 3 turni) / <b>2° turno</b>  7d20 (+2 al tiro per colpire + 1d6 danni incendiari x 3 turni) / <b>3° turno</b>  9d20 o 18d10 (+3 al tiro per colpire + 1d8 danni incendiari x 3 turni)/ <b>4° turno</b>  12d20 o 24d10 (+5 al tiro per colpire +1d10 danni incendiari x 3 turni )[se si arriva ad usare anche il 4° turno si dovrà pazientare due turni non più uno, per riprendere la concentrazione.]</p>\n<p><b>Abilità Specifica :</b> il pg acquisisce la possibilità di creare un armatura di fuoco che lo avvolga garantendogli un + 1 alla CA e delle grosse ali infuocate che gli permettano di volare, distanza 20 caselle, in questa forma può generare automaticamente un arma a sua scelta di fuoco lavico che aggiunga un +1d6 ai danni. 1 x Riposo Lungo</p>\n<h4>Variante Stealth</h4>\n<p>MOD. FOR + 2 / MOD. DEST + 4 / BONUS ACROBAZIE + 4 / BONUS FURTIVITA' + 4/ VELOCITÀ MOV. 14</p>\n<p>Il pg assume una corporatura più snella e agile, con un mantello di fumo nero che fuoriesce dalla sua schiena, urtilizzabile per celare la sua presenza.In questa trasformazione il PG mischia la propria capacità energetica con il potere demoniaco puro, avendo la possibilità di utilizzare l'emomanzia come arma principale. Il corpo del PG viene avvolto da una cortina fumogena che simula una cappa. Questa ha la funzione di clare il PG affinchè il nemico venga colto alla sprovvista. Per attivare la sua abilità, il PG dovrà superare CD 13 di notte e CD 16 di giorno per utilizzare gli effetti della summenzionata. Questa garantisce bonus di +4 ai tiri su furtività e TpC. Il nemico dovrà effettuare un TS su DESTREZZA per individuare il PG. Il PG ha la possibilità di utilizzare il potere emomantico, antico potere demonico. L'attivazione richiede un sacrificio iniziale di 20 PF. Questo attiva la forma emomantica e garantisce +6 ai tiri su Furtività. All'attivazione, il PG ottiene 2 attacchi da 2d12 con lame di sangue ed energia evocate. Ogni 10 PF aggiuntivi sacrificati (fino a un massimo di 40PF totali) potenziano la forma: 30 PF 3 attacchi da 2d12 / 40 PF 4 attacchi da 2d12</p>\n<p>Dopo ogni attacco andato a segno, una sola volta per turno, può scegliere:</p>\n<p>Recuperare 5 PF / Aggiungere +1d6 ai danni all'attacco</p>\n<p>I danni bonus totali ottenibili sono limitati a +4d6 per attivazione. Una volta raggiunto +4d6 usati, al prossimo colpo lanciato o se si supera tale soglia, il PG entra in blocco: rimane immobile per 3 turni, non può agire né muoversi e gli attacchi contro di lui sono molto efficaci. Il PG può compiere grazie all'energia fusa con il sangue demoniaco dei grossi colpi concentrati, per farlo deve utilizzare 10 PF attuali oppure 10 PF recuperati tramite assorbimento. Questi particolari attacchi a distanza si nutriranno del sangue degli avversari. Pertanto verranno utilizzati i d6 bonus ottenuti tramite attacchi inferti in forma emomantica. Ogni d6 sacrificato viene sostituito e potenzia l'attacco: <b>1d6</b> → 1d8 / <b>2d6</b> → 2d8 + 5 PF recuperati / <b>3d6</b> → 3d8 + colpo perforante su 2 bersagli in linea (Il secondo ½ danno) / <b>4d6</b> → 4d8 + esplosione necrotica ad area divisibile + critico con 18 +1 CA (non cumulabile). Più il PG usa questi attacchi energetici misti ad emomanzia e più il suo corpo cresce di potere cumulando energia. Ogni colpo inferto con l'energia, causa al nemico una paralisi temporanea. Esso dovrà effettuare un TS COSTITUZIONE per non rimanere paralizzato 1 turno. <b>1</b>° Colpo CD 16 / <b>2°</b> Colpo CD 18 / <b>3°</b> Copo CD 20 / <b>4°</b> Colpo CD 22</p>\n<p>Se il PG dovesse riuscire ad effettuare un 5° Colpo, il nemico cadrebbe in uno stato catatonico dal quale non riuscirebbe più a fuoriuscire. (Salvo Casi Eccezionali). Se Ola scende sotto i 20PF non può più potenziarsi o evocare armi, se dovesse essere colpito a morte ed andare a terra perderebbe tutti i bonus guadagnati. <b>Abilità Specifica :</b> Una volta x scontro il PG ottiene abbastanza potenza da potersi muovere così veloce da teletrasportarsi in un luogo che può vedere, entro 30 caselle.</p>"},
    {nome:"Alterazione: Dragonide", tag:"Abilità", width:3, hidden:false, desc:"<p><b>ALTERAZIONE FISICA : DRAGONIDE</b></p>\n<p>MOD. INT + 3/MOD. CAR + 2/CA + 2 /VELOCITÀ MOV. 9/BONUS TIRI INCANTESIMI + 4/PF TEMP. +10</p>\n<p>I danni sono equivalenti alla forma base nonché 3d6+ 2 (nonostante il giocatore non sia competente nel combattimento corpo a corpo, ha la capacità di base di arrecare danni fisici anche senza armi). Se si avvale dei suoi denti aguzzi, il danno sale a 5d6 + 2 danni da sanguinamento.</p>\n<p>La trasformazione rende a tutti gli effetti Deagonide il PG e considerato che questi ultimi sono spesso di colori sgargianti e dagli occhi luminosi la sua tradizione viene considerata come non \"Diversa\" dal resto delle razze a differenza della sua forma base.</p>\n<p>Durante l'utilizzo di questa trasformazione il PG può avvalersi dell'utilizzo del suo potere energetico.</p>\n<p>La trasformazione prevede che Il PG acquisisca la capacità di utilizzare la magia avvalendosi dell'utilizzo di slot incantesimo.</p>\n<p>Il PG seppur non trasformato completamente può utilizzare diverse caratteristiche fisiche da Dragonide che verranno aggiunte alle mutazioni disponibili. Ossia :</p>\n<p><b>DENTI AGUZZI :</b> Il PG muta il suo volto in quello di un Dragonide, maturando la possibilità di infliggere ingenti danni con morsi 5d6 + 2 sanguinamento.</p>\n<p><b>VISIONE SUBACQUEA :</b> I suoi occhi vengono ricoperti di una sottilissima membrana che gli permette di vedere con chiarezza sott'acqua.</p>\n<p><b>INTELLIGENZA SPICCATA :</b> Il cervello di un Dragonide è una delle armi terrene più potenti mai esistite se utilizzato con criterio. Il PG guadagna un + 2 sulla caratteristica di INTELLIGENZA. Gia addizzionata alla trasformazione <b>FUOCO/FULMINI :</b> Il PG può eiettare fuoco o fulmini dalla bocca fino ad una distanza massima di 5 Caselle. Più vicino è il nemico più danno subirà. Danno max 8d6 a scalare di una casella fino a 4d6 dalla massima.</p>\n<p><b>PELLE A SCAGLIE :</b> Il PG viene ricoperto da scaglie che rendono la sua pelle più dura. + 2 CA. Già addizionata alla trasformazione.</p>\n<p>Il PG allo stato attuale non conosce incantesimi ne tantomeno è capace di lanciarli. Per farlo ogni mago utilizza un catalizzatore, ossia uno strumento dedito al solo fine di permettere al mago di rappresentare la magia in modo concreto. Ola ha il suo assistente integrato che permette la piena acquisizione di incantesimi senza avvalersi di tomi, catalizzatori o bastoni. Pertanto il PG non solo potrà lanciare incantesimi senza avvalersi dell'utilizzo dei summenzionati ma potrà anche imparare magie senza doverle necessariamente trascriverle o leggerle. Di norma un mago per imparare incantesimi deve impiegare un tot di ore affinché questo venga appreso, leggendo o studiando. Ola potrà fare la stessa cosa dimezzando il tempo di appresa e semplicemente guardando l'incantesimo lanciato anche senza chiedere al mago di condividere le informazioni di esso. (Non tutti gli incantesimi è possibile imparare).</p>\n<p>Il PG acquisisce la piena padronanza della lingua dragonide nonché lo SPAGNOLO STEREOTIPATO in più ha la possibilità di decifrare il Dragonide Antico.</p>\n<p>Nel corredo genetico Dragonide è presente la capacità altamente remota di \"Ascendere\" alla forma Definitiva, nonché trasformarsi in un vero Drago. Nel corredo genetico di questo Dragonide in particolare non vi è questa capacità ma si è guadagnato un punto \"Corredo Genetico\" che sommato ad altri potrebbe alla fine dare lo stesso effetto. (CORREDO GENETICO 1/X)</p>\n<p><b>Abilità Specifica :</b> Il PG una volta per Riposo Lungo può effettuare un tiro su \"Recuperare Slot\" tirando 2d6 il primo il livello degli slot da recuperare e il secondo per la quantità. (Il PG al livello attuale conosce e può utilizzare Slot max fino al livello 5 ma se dovesse uscire 6 sul dado guadagnerebbe la possibilità di lanciare un incantesimo di lvl 6 o addirittura poterlo donare ad un compagno con slot a livello)</p>", slotsTemp:[{lvl:1,max:6,used:0},{lvl:2,max:5,used:0},{lvl:3,max:4,used:0},{lvl:4,max:3,used:0},{lvl:5,max:2,used:0},{lvl:6,max:1,used:0}]},
    {nome:"Alterazione: Numa", tag:"Abilità", width:1, hidden:true, desc:"<p><b>ALTERAZIONE FISICA: NUMA</b> PF +10 (Temporanei)</p>\n<p>MOD. FORZA + 3 · MOD. DESTREZZA + 5 · VELOCITÀ MOV. 15 · BONUS ATT. PER COLPIRE + 4 · PERCEZIONE PASSIVA + 4 · CA + 1</p>\n<p>Danni corpo a corpo: 3d12 + 3 danni sanguinamento (probabilità di causare sanguinamento con ogni colpo). Il pg usufruisce di 3 attacchi o di uno unico da 5d6 + 4, ad ogni colpo il pg lancera' una moneta e se dovesse uscire il risultato prescelto affibbiera' un + 1 sanguinamento al nemico fino alla fine dello scontro. Questo effetto e' cumulabile fino a + 10 danni grazie ai suoi lunghi artigli e denti aguzzi.<br>Il pg sviluppa la capacità di mutare la sua stazza in quello della razza felina Numa, una sottorazza dei Tabaxi, esclusivamente rappresentante pantere.<br>Il pg sviluppa azione costante, avendo la possibilit' di avere un'azione bonus per turno.<br>Il pg ha specifici bonus sui tiri di acrobazie e furtivita' ove in alcuni casi non e' necessario lanciare i dadi (chiedere al master). Bonus + 10<br>Grazie ai suoi affilatissimi artigli il pg puo' arrampicarsi sulla maggior parte delle superfici e rimanerne attaccato per diverso tempo (discrezione master).<br>Il pg ha un olfatto molto sviluppato oltre che l'udito, grazie a questi benefici ha molti vantaggi tattici.<br><b>Abilità Specifica :</b> Il pg utilizza la sua rabbia selvaggia per regredire a essere della foresta, il suo spostamento arriva a un tot di 20 i danni diventano 4d12 o 8d6 e puo' attaccare nemici vicini tra loro. Ogni attacco fatto con mosrsi recupera 5pft per un max di 20 pft. <b>Quantità - 2 -</b></p>"}
  ],
  corredi: [
    {nome:"Corredo Genetico Animale — Corpo da Lumaca", tag:"Truccetto", width:1, hidden:false, spazi:0, max:2, used:0, desc:"Melma gelatinosa a solidificazione istantanea: rinuncia agli attacchi nel proprio turno; chi la tocca deve superare un TS o subire solidificazione parziale/totale. Velocità 1, CA +3, TS nemico 17, durata 4 turni. Quantità 2."},
    {nome:"Corredo Genetico Ancestrale (3 spazi)", tag:"Truccetto", width:3, hidden:false, spazi:3, max:0, used:0, desc:"Truccetto — ciascuna variante quantità 2:<br>• <b>Cura:</b> distribuisce fino a 50 cure.<br>• <b>Visione Crepuscolare:</b> vede al buio come fosse giorno.<br>• <b>Saggezza Predominante:</b> +4 Saggezza (l'anima di un Arcangelo convoglia energia spirituale).<br>• <b>Luce:</b> +3 danni a ogni colpo che la usa; in alternativa crea piccole creazioni di luce (oggetti o famigli, 1d6 danni / 10 PF / 4 mov / 14 CA), interconnesse con la sua mente.<br>• <b>Levitazione:</b> fino a 6 turni / 6h (non vola, ma può planare)."},
    {nome:"Corredo Genetico Demoniaco (3 spazi)", tag:"Truccetto", width:3, hidden:false, spazi:3, max:0, used:0, desc:"Truccetto — ciascuna variante quantità 2:<br>• <b>Assorbimento Vitale:</b> assorbe la linfa vitale dei nemici, 6d6.<br>• <b>Visione Crepuscolare:</b> vede al buio come fosse giorno.<br>• <b>Costituzione Possente:</b> +4 Forza (energia di un demone superiore).<br>• <b>Fuoco:</b> +3 danni a colpo; a distanza 7d6.<br>• <b>Calore:</b> immune al freddo e alle basse temperature.<br>• <b>Fumo Demoniaco:</b> nube nera fino a 4 caselle; i nemici dentro devono superare TS Destrezza 18 per vederci, e gli attacchi dentro l'area ottengono +5."},
    {nome:"Corredo Genetico Dragonide (1 spazio)", tag:"Truccetto", width:2, hidden:false, spazi:1, max:0, used:0, desc:"Truccetto — ciascuna variante quantità 2:<br>• <b>Denti Aguzzi:</b> morso 5d6+2 sanguinamento.<br>• <b>Visione Subacquea:</b> vede chiaramente sott'acqua fino a 6 turni/6h.<br>• <b>Intelligenza Spiccata:</b> +4 Intelligenza.<br>• <b>Fuoco/Fulmini:</b> eiettati dalla bocca fino a 5 caselle — più vicino il nemico, più danno (max 8d6, scala fino a 4d6 alla distanza massima).<br>• <b>Pelle a Scaglie:</b> +2 CA fino a fine scontro."},
    {nome:"Corredo Genetico Numa (1 spazio)", tag:"Truccetto", width:2, hidden:false, spazi:1, max:0, used:0, desc:"Truccetto — ciascuna variante quantità 2:<br>• <b>Artigli Affilati:</b> graffi/morsi 6d6+2 sanguinamento.<br>• <b>Percezione Passiva:</b> +6 (udito e olfatto sviluppati).<br>• <b>Destrezza Elevata:</b> +2 Destrezza.<br>• <b>Fuoco/Fulmini:</b> come Dragonide, max 8d6 a 5 caselle scalando a 4d6.<br>• <b>Guerriero Silenzioso:</b> +10 su prove di non essere rilevato.<br>• <b>Acrobata:</b> +10 su furtività/acrobazie o azioni complesse senza tiro."}
  ],

  truccetti: [
    {nome:"Contrasti", desc:"In caso di perdita di controllo durante lo sdoppiamento (Doppio Volto), il PG può tentare di dominare la parte “corrotta” del suo alter ego: +3 sul tiro contrapposto.", uso:"4 x Riposo Lungo"},
    {nome:"Ab. Specifica — Velocità / Forza / Volo / Mini", desc:"Ogni forma di Alterazione Fisica porta con sé un'abilità intrinseca dedicata, considerata trucchetto (non consuma slot): schivata su tiro opposto (Velocità), Berserk +2d6 danni 1x riposo lungo (Forza), attacchi a distanza con turbini 3d6 max 2 colpi (Volo), Colpo Devastante 12d6 max 1 a scontro (Mini).", uso:"Quantità variabile per forma (vedi Risorse)"},
    {nome:"Potenza Elettrica", desc:"Il PG sprigiona energia elettrica in attacchi ad area, a corto e lungo raggio (raggi laser, palle di energia, colpi paralizzanti). Danni base 6d6. Una volta per riposo lungo può concentrare un colpo attraverso la potenza accumulata fino a 20d6.", uso:"1 x Riposo Lungo (colpo potenziato)"}
  ],

  lore: [
    {t:"Trasformazioni", d:"Il PG ha la facolt\u00e0 di trasformare il proprio fisico in base alle evenienze, maturando vantaggi tattici diversi per ogni forma. Ogni trasformazione dura tutto lo scontro e comporta abilit\u00e0 intrinseche specifiche considerate trucchetti."},
    {t:"Corredo genetico", d:"Pu\u00f2 acquisire il codice genetico di razze o creature con cui entra in contatto, assimilandone i tratti pi\u00f9 utili. L'archivio genetico dispone di 10 spazi totali; i codici pi\u00f9 complessi (demoniaco, ancestrale) ne occupano di pi\u00f9 rispetto a quelli semplici."},
    {t:"Altro", d:"Spazio utile o inutile (come tutta la scheda)."}

  noteGenerali: "Guerrieri Leggendari: morti Logar, Bargar, Elafir, Arthur e Demacas (periti nell'ultima grande guerra). Restanti: Oda, Yanovar, Rodgard, Taramond, Striscia di Tigre, Bruck \u2014 non si sa chi sia ancora vivo. Party: Walter\u2192Katan, Savino\u2192Jhaggork, Ivan\u2192Lux, Stefano\u2192Ervork, Nic\u2192Ola.",
  diarioEntries: [
    {title:"Sessione 1 \u2014 Taramond e Gloxinia", date:"", text:"Ho le branchie. Taramond \u00e8 a Gloxinia (citt\u00e0 Onodoros), per volere degli dei, Tubaret. I nani di Gloxinia lavoravano in armonia in 4 miniere, guidati da Re Fardum, finch\u00e9 un mese fa \u00e8 arrivato l'esercito del perfido Re Ares. Dopo la caduta del re, i nani sopravvissuti (mutilati) lavorano nell'unica miniera rimasta funzionante. Obiettivo: raggiungere Rodgard (fratello di Taramond) nella prima citt\u00e0 di Sadaril e uccidere Re Ares. Il mondo si chiama Morgedal, sei continenti: Sadaril, Candertal, Gloxinia, Ibstina, Brothental e l'isola di Axel.<br><br>Retroscena degli dei: in origine regnavano 5 divinit\u00e0 (Kratos, Ignis, Linfeus, Galactus, Mens). Tre Grandi Guerre per il potere; nella terza, gli dei capirono che ci\u00f2 che avevano creato era troppo grande da distruggere e si ritirarono ciascuno nel proprio piano. Mens, il pi\u00f9 piccolo ma pi\u00f9 intelligente, fu cacciato da ogni piano e tent\u00f2 di uccidere Kratos; Kratos e gli altri lo esiliarono a Morgedal, distruggendo la pangea originaria nei 6 continenti attuali. Gli 11 Guerrieri Leggendari (Ola tra loro) ricevettero una vita aggiuntiva per aver combattuto in quella guerra."},
    {title:"Sessione 2 \u2014 Il party e il sistema di mischia", date:"", text:"Roster: Walter \u2192 Katan, Savino \u2192 Jhaggork, Ivan \u2192 Lux, Stefano \u2192 Ervork. Regole di combattimento da mischia: ci si posiziona di fronte all'avversario, si tira un PROVA (4d6) contrapposto; in caso di pareggio l'attaccante ha vantaggio; se si vince si entra in modalit\u00e0 Mischia (altrimenti si subiscono direttamente i danni). In mischia si tira iniziativa, poi si tira un d20 contrapposto per ogni scambio (il pi\u00f9 alto vince e fa entrare il colpo); si pu\u00f2 anche tentare la Schivata."},
    {title:"Sessione 3 \u2014 Anubis e Rah", date:"", text:"Nell'atrio abbiamo attivato l'evocazione di Anubis, che ha creato numerose evocazioni (tra cui un mago pericoloso). Dopo un duro scontro, Ervork \u00e8 stato scaraventato in un'altra stanza da Anubis; \u00e8 tornato e ha finito Anubis con un pugno. \u00c8 poi comparso Rah, che ci ha lanciato un sole addosso: si sono rivelati Anubis e Rah, figli di Nogradim, portatori del potere di trasformazione fisica donato mille anni fa (la gemma oscura ne \u00e8 la fonte)."},
    {title:"23/08/25", date:"23/08/25", text:"Rifugio da Brandomm, nano demolito dalla guerra, nella locanda di Onodoros. Ares \u00e8 sparito da mesi dopo aver trovato \u201cun ragazzo\u201d. Usando la tunica del monaco per diventare invisibile, ho origliato le guardie; imprevisto con una guardia sospettosa, gestito insieme a Lux ed Ervork. Il giorno dopo, ottenere pellicce per mimetizzarsi; in piazza, una nana viene frustata al terzo rintocco di campana."},
    {title:"17/10/25", date:"17/10/25", text:"Nella taverna sotto la citt\u00e0 con Fab e Rina: Ares ha sottomesso i nani in sei mesi, mutilandoli. Sanno dove si trova Taramond. Rinara ha continuato a combattere dopo la caduta del re e viene frustata pubblicamente ogni giorno per punizione. A Gloxinia di notte si aggirano vampiri (non in branco). Il mio nome \u00e8 legato a due nani leggendari (Ola e Nik): meglio non presentarmi come \u201cOla\u201d. Sogno ricorrente: un uomo con un grande cappello che scrive su un libro nero. Arriva Vorkax, compagno draconico ambiguo (razza pura draconica, 4000 anni; per assumerne il DNA serve ingerire parti del suo corpo)."},
    {title:"10/11/25", date:"10/11/25", text:"Piano di fuga da Dundar con Fab e Rinara. Analizzate le ronde delle guardie (schemi prevedibili, di notte sono di meno per via dei vampiri). Acquisita parte del corredo genetico di Vorkax. Nemici incontrati: C1P1000 (umanoide metallico, nucleo energetico in gemma Astrofilite, punto debole al nucleo) e B800 (pi\u00f9 pericoloso, nucleo nel braccio sinistro). L'Astrofilite \u00e8 un minerale magico comune a Sadaril, Gloxinia e Kandertal. Il metallo dei costrutti potrebbe essere ottone elementale."}
