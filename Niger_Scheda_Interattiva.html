":"","art1":"","art2":"","art3":""},"equipDettagli":"","inventario":[["✓","PENNELLO PER DISEGNI","1","",""],["✓","CORDA SOTTILE 15","3","",""],["✓","4 anelli simili a fedi nuziali con spine nascoste e spesso velenose, tipicamente indossate dalle kunoichi, e che consentono ai ninja di strangolare silenziosamente i nemici con le estremità appuntite contro il collo o la gola + 1 DANNI CAC","2","",""],["✓","MAKIBISHI 40 sono oggetti appuntiti usati per rallentare gli inseguitori o nella difesa delle fortificazioni","4","",""],["✓","RAMPINO PER SCALARE + 2 in attività che richiedono l'attività di scalare o Arrampicata","1","",""],["✓","30 SHURIKEN piccolissime armi da lancio (se ne possono lanciare fino a 4 per attacco (1d4)","3","",""],["✓","4 FIALE PER VELENO","2","",""],["✓","CARNE ESSICCATA (10 Scorte da Campo)","5","",""],["✓","INCHIOSTRO PER DISEGNI","1","",""],["✓","MAPPA TIBSTINA CON CONFINI EVIDENZIATI","1","",""],["✓","1000 MONETE D’ORO","1","",""]],"capacitaMax":30,"passive":[],"abilita":[{"nome":"FUKASHI NO JUTSU\n(Invisibilità)","desc":"<p>Il pg entra in uno stato di simil trasparenza diventando a tutti gli effetti invisibile agli occhi Nemici e Amici. Durante l&#x27;uso della tecnica lo Shinobi potrà compiere azioni furtive non effettuando tiri aggiuntivi per mantenere la forma di invisibilità. Se colpito accidentalmente o non, dovrà effettuare un tiro su NINJUTSU che se superato avrà come effetto benefico il suo proseguo in caso contrario non perderà la sua invisibilità bensì sarà visibile solo al nemico/i per cui avrà dovuto effettuare il tiro. (Per ogni nemico ucciso in invisibilità guadagna 10 PF Temporanei, non è necessario che sia il pg ad ucciderlo ma basta che gli vengano inferti più di 4 colpi). Durata tutto lo scontro oppure 10 H/ + 6 furtività / + 6 / + 6 acrobazie/ + 5 Movimento / + 4 danni a colpo sommabili. Se il primo dovesse andare a segno il secondo colpo avrebbe + 8 danni e di conseguenza il terzo + 12 anche su nemici differenti/ + 6 ai tiri per colpire / se vi dovessero essere dei nemici vicini nell&#x27;arco di 3 caselle e il pg dovesse brandire un arma idonea potrebbe effettuare un attacco ad area con gli stessi danni di un attacco normale (esempio kusarigama)</p>","hidden":false,"width":3},{"nome":"KAGEBUSHI NO JUTSU\n(Moltiplicazione del corpo)","desc":"<p>Lo shinobi ha la possibilità di creare delle copie di se stesso posizionandole dove meglio preferisce nell&#x27;arco di 6 caselle. Esse saranno delle vere e proprie copie che avranno capacità proprie o saranno comandate dallo shinobi indurranno. Lo Shinobi può generare fino ad un massimo di 5 Copie. Ogni volta che lo shinobi genera una copia decide quanto danno essa può fare e quanti punti ferita essa debba avere tutto ovviamente condiviso con le sue caratteristiche. Durante l&#x27;uso di questa tecnica particolare il pg guadagna 20pft per un totale di 85pf. Inoltre avrà 2d6 aggiuntivi o 1d12 a scelta, per un totale di 8d6 o 4 d12 In questo caso potrà decide di dividere equamente i dadi dei danni e i pf per ogni copia oppure decidere strategicamente di dare 10pf ad ogni copia e 1d6 danni. Se le copie vengono poste vicino al nemico, il pg guadagna un bonus di + 3 al tiro per colpire per ognuna, in più se distrutte si trasformano in catene circolari che bloccano il nemico per un turno se non dovesse riuscire a superare la TS DESTREZZA di 19. In alcuni casi, mantenendo la concentrazione e stando immobile, il pg può generare molte più copie di quelle previste che però possono compiere azioni semplici e non attacchi. Una volta per riposo lungo, i PF Aumentano a 100 e i d6 da 2 diventano 4 per un totale di 10d6 o 5d12.</p>","hidden":false,"width":3},{"nome":"SHARINGAN\n(Arte Illusoria)","desc":"<p>Questa tecnica non rappresenta un genjutsu avanzato né una forma di controllo mentale profondo. Il suo scopo non è intrappolare il nemico in un’illusione totale, ma disorientarlo, alterandone la percezione immediata della realtà e inducendolo a commettere errori. Il PG utilizza il genjutsu per far percepire al bersaglio elementi che non esistono o che non si trovano nella posizione reale, come la falsa collocazione del PG, movimenti inesistenti o presenze illusorie. Il genjutsu può essere attivato entro un raggio di 20 caselle, purché vi sia contatto visivo diretto tra il PG e il bersaglio. Al momento dell’attivazione, il bersaglio deve effettuare un tiro salvezza su Saggezza CD 19. In caso di fallimento, il bersaglio cade sotto l’effetto dell’illusione.</p><p>Gli effetti del genjutsu sono decisi dal PG, sempre in accordo con il master, e devono rientrare in manifestazioni di disorientamento percettivo. A titolo di esempio, il PG può far percepire al nemico numerose copie illusorie di sé stesso sparse sul campo di battaglia, inducendolo a non distinguere quale sia la posizione reale, oppure alterare la percezione di movimenti, distanze o direzioni. Il genjutsu non immobilizza, non infligge danni diretti e non genera effetti prolungati o traumatici (per ottenere effetti di questo tipo sarebbe necessario accumulare una quantità molto elevata di energia, mantenendo la concentrazione per numerosi turni consecutivi; una pratica non impossibile per il PG, ma estremamente difficile e rischiosa, poiché richiederebbe di restare fermo e vulnerabile a lungo). La tecnica può essere attivata in qualsiasi momento, anche durante il turno di un avversario, purché il PG abbia un’azione ancora disponibile. In tal caso non viene considerata una reazione, ma un’azione spesa fuori dal proprio turno, rendendola utilizzabile come strumento difensivo o di evasione.</p>","hidden":false,"width":3},{"nome":"BYAKUGAN\n(Visione Totale)","desc":"<p>Questa tecnica conferisce al PG una percezione estremamente avanzata del campo di battaglia, permettendogli di controllare il territorio attraverso la vista e la lettura energetica. Si tratta di una disciplina ninja basata su concentrazione, postura e affinamento sensoriale, ispirata alle arti di osservazione più elevate. Quando il PG attiva il Byakugan, ottiene una visione a 360 gradi del campo di battaglia. La visione comprende tutto il campo di battaglia, se eccessivamente grande, entro un raggio di circa 40 caselle. Il PG è in grado di individuare con chiarezza nemici, alleati e creature, anche se nascosti, invisibili o protetti da magie, illusioni o artefatti che ne celano la presenza. La posizione dei bersagli viene percepita in modo costante e affidabile. Durante l’effetto della tecnica, il PG vede indipendentemente dalle condizioni ambientali: buio totale, nebbia, fumo, polvere, oscurità magica o ostacoli visivi non impediscono la percezione. Inoltre, il PG è in grado di individuare trappole, sigilli, incantesimi attivi, anomalie energetiche e strutture nascoste, rendendo l’abilità estremamente utile sia in combattimento sia nelle fasi di esplorazione tattica.</p><p>Mentre l’arte è attiva, il PG può effettuare un tiro su Osservare per analizzare uno o più avversari visibili. In caso di successo, il PG individua punti deboli, schemi di movimento o vulnerabilità, che restano percepibili in modo costante per tutta la durata dell’abilità, fornendo un vantaggio tattico diretto a sé stesso e, se comunicato, anche ai compagni. Considerata dai Ninja una grande tecnica che non tutti riescono a padroneggiare.</p>","hidden":false,"width":3},{"nome":"KAGEMANE NO JUTSU\n(Possessione dell’Ombra)","desc":"<p>Il PG si abbassa in una postura di concentrazione, quasi immobile, e lascia che la propria ombra si distenda come un’appendice viva sul terreno, cercando un contatto reale con l’ombra del bersaglio: quando le due ombre si toccano, il legame scatta e il corpo nemico viene costretto a seguire la volontà del ninja come se fosse tirato da fili invisibili. Il PG può attivare la tecnica fino a un massimo di 15 caselle, ma solo in condizioni di ombra (mezza luce/mezza penombra); in luce forte la tecnica non può essere utilizzata oppure viene annullata immediatamente se già attiva. Per agganciare non è necessaria la linea visiva sul nemico, però l’ombra deve essere agganciabile e deve esistere un contatto reale tra le due ombre lungo una superficie continua, come se il vincolo fosse quasi fisico. Contro nemici base non sono richiesti tiri aggiuntivi: se l’aggancio è possibile il vincolo è completo e il bersaglio viene bloccato; se il PG si alza o modifica la propria posizione, il bersaglio replica esattamente i suoi movimenti come una marionetta. Contro nemici più forti o più grossi il controllo non è garantito: il PG deve superare un tiro contrapposto su COSTITUZIONE per stabilire il vincolo e, se riesce, dovrà ripetere lo stesso contrapposto ogni turno per mantenere la presa (in caso di fallimento il vincolo si spezza). Durante l’uso il PG ha due possibilità: Presa Classica, in cui mantiene la postura e blocca un singolo bersaglio comandandone i movimenti, oppure Estensione Ad Area, in cui estende un’area a cerchio di 7 caselle di raggio e può bloccare fino a 4–5 nemici, ma solo se sono nemici base senza peculiarità rilevanti su FORZA o COSTITUZIONE. Se il PG dispone di abbastanza chakra, può inoltre stringere il vincolo fino allo strangolamento del bersaglio; l’uso della tecnica non infligge danni al PG.</p>","hidden":false,"width":3},{"nome":"BUNKAI SURU NO JUTSU\n(Dissimulazione)","desc":"<p>Il pg grazie a questa tecnica illusoria molto potente ha la possibilità di mutare la forma del suo corpo facendo credere al nemico di essere un oggetto. Questa tecnica sfrutta un particolare effetto ottico che renderà il pg solo visivamente diverso e non fisicamente, pertanto se il nemico dovesse in qualche modo toccarlo l&#x27;effetto della tecnica svanirebbe. Per far sì che la tecnica vada a buon fine il PG dovrà rimanere fermo immobile, pertanto in determinate situazioni ostiche, se necessario verrà richiesto un tiro su equilibrio.(Ex. Prendere le sembianze di un barilotto fuori da un locale o una pianta in un giardino).</p>","hidden":false,"width":3},{"nome":"SHIZUKESA NO JUTSU\n(Insonorizzazione)","desc":"<p>Il Ninja ha la possibilità, oltre alle sue conoscenze ed al suo equipaggiamento/vestiario, di annullare qualsiasi suono/rumore proveniente dal corpo o quelle di un alleato toccandolo. Durata 5 turni / + 4 ai tiri per colpire / + 4 Movimento / + 4 Acrobazia / + 4 furtività</p>","hidden":false,"width":3},{"nome":"SHINEN GOGEN NO JUTSU\n(Tecnica delle Cinque Manifestazioni Naturali)","desc":"<p>Il PG fa fluire e modella l’energia interna attraverso disciplina fisica e concentrazione spirituale, manifestandola sotto forma di cinque elementi naturali. Questa tecnica è un&#x27;arte ninja avanzata che utilizza il corpo come catalizzatore. Il Chakra può essere mantenuto in concentrazione per potenziare progressivamente gli effetti delle manifestazioni, rendendole più intense, estese o oppressive.</p><p>- RAITON (FULMINE) :</p><p>RAIKIRI: il PG concentra il fulmine sul proprio corpo e scatta verso un bersaglio fino a 12 caselle, infliggendo un colpo ravvicinato devastante. Il bersaglio principale subisce 8d6 danni da fulmine, mentre tutte le creature che si trovano lungo il percorso del dash subiscono 2d6 danni da fulmine a causa della scarica residua che attraversa l’aria.</p><p>KIRIN: il PG rimane immobile e agisce come un parafulmine, richiamando l’elettricità dall’atmosfera. Dopo la concentrazione, può colpire un bersaglio entro 20 caselle con un fulmine che scende dal cielo. Il danno cresce in base ai turni di concentrazione, partendo da 13d6, aumentando a 20d6 e fino a un massimo di 28d6 al terzo turno, al termine del quale il colpo deve essere obbligatoriamente scagliato.</p><p>- FŪTON (ARIA) :</p><p>RASENGAN: il PG comprime l’energia del vento in una sfera instabile e colpisce in mischia infliggendo 7d6 danni, accompagnando l’attacco con uno spostamento fino a 10 caselle. Il Rasengan può essere utilizzato anche come propulsione, scaricandolo contro il terreno o una superficie solida per generare una potente spinta che consente al PG di slanciarsi in aria o riposizionarsi rapidamente.</p><p>RASENSHURIKEN: una volta per scontro, il PG lancia una lama di vento estremamente distruttiva entro 30 caselle, infliggendo un totale di 30d6 danni. Il Rasenshuriken può esplodere, permettendo al PG di ripartire liberamente i danni tra tutti i nemici coinvolti, oppure essere usato in forma concentrata, assegnando i danni singolarmente ai bersagli scelti.</p><p>- KATON (FUOCO) :</p><p>GŌKAKYŪ NO JUTSU: il PG sprigiona una potente fiammata frontale a cono, estendibile fino a 6 caselle, infliggendo un totale di 10d6 danni da fuoco. I dadi possono essere concentrati su un singolo bersaglio oppure ripartiti tra più nemici colpiti. Chiunque venga colpito subisce inoltre 2 danni fissi fino alla fine dello scontro.</p><p>HŌSENKA NO JUTSU: il PG genera 8 palle di fuoco, ciascuna indirizzabile indipendentemente entro 12 caselle. Ogni palla infligge 1d6 danni più 1d4 danni incendiari permanenti fino alla fine dello scontro. Se tutte le palle vengono dirette contro lo stesso bersaglio, viene effettuato un solo tiro contro la CA; se distribuite su più nemici, si effettua un tiro per ciascun bersaglio.</p><p>- DOTON (TERRA) :</p><p>DORYŪHEKI NO JUTSU: il PG modella la terra circostante creando strutture fisiche reali come ripari balistici, muri, speroni o modifiche del terreno utili al controllo dello spazio. Il PG può inoltre immergersi nella terra e riemergere in un punto a scelta entro un massimo di 30 caselle, utilizzando il terreno come mezzo di spostamento. Mantenendo la concentrazione, le strutture diventano progressivamente più estese e resistenti.</p><p>DOMU NO JUTSU: il PG utilizza la terra per potenziare sé stesso o un alleato, creando un’armatura di terra che fornisce +1 alla CA oppure forgiando armi di terra che conferiscono un bonus ai danni pari a +1d6. Mantenendo la concentrazione, tali benefici possono aumentare progressivamente.</p><p>- SUITON (ACQUA) :</p><p>SUIRYŪDAN NO JUTSU: il PG evoca un drago d’acqua che colpisce i nemici con la forza del flusso, infliggendo 8d6 danni. I bersagli colpiti possono essere spinti o inglobati nel drago; chi non supera un tiro salvezza su Destrezza CD 18 viene trascinato dal flusso e può essere spostato dal PG fino a 12 caselle.</p><p>SUIRŌ NO JUTSU: il PG genera una gigantesca onda d’acqua che pervade il campo di battaglia in un’area rettangolare di 20 caselle, alterando completamente il terreno. L’acqua permane sul campo creando un forte vantaggio tattico: il PG può muoversi agevolmente sulla superficie, mentre i nemici sono costretti a nuotare o a muoversi con difficoltà. All’interno dell’acqua il PG può modellare il flusso per creare barriere mobili o imprigionare un nemico in una prigione d’acqua; il bersaglio deve superare un tiro salvezza su Costituzione CD 18, altrimenti rimane intrappolato e la difficoltà di liberarsi aumenta a ogni turno successivo.</p>","hidden":false,"width":3}],"incantesimo":[],"divergenzaIntro":"","ambiti":[],"campiAttiva":[],"divergenzaAttivaNote":"","divergenzaPassiva":"","trucchetti":[],"descrizione":{"eta":"19","altezza":"MEDIA","peso":"85","occhi":"Giallo Ocra","capelli":"IMMAGINE 1","colorePersonaggio":"Pelo Nero"},"backstory":"<p>Nato e cresciuto nella casa dei ninja a Tibstina Niger non ricorda altro che le mura della pagoda, ha trovato una figura paterna in Rakar, suo maestro, diventando il più diligente dei discepoli per compiacere e rendere orgoglioso il lupis che lo aveva cresciuto.</p><p>Da sempre ha una grande affinità con gli animali, suoi unici compagni oltre agli altri discepoli e crescendo svilupperà un legame forte con la natura che gli permetterà di muoversi sempre facilmente in ambienti che potrebbero sembrare ostili. Crescendo gli viene affidato il ruolo di istruttore e diventa il braccio destro del maestro Rakar, proprio per questo non dimenticherà mai i principi con i quali è cresciuto, anche se un evento tragico cambia per sempre la sua vita, che perde tutte le certezze acquisite nella casa ninja e si ritrova in un mondo esterno completamente diverso ed inaspettato.</p>","lore":[{"t":"Tratti caratteriali / Ideali / Legami / Difetti / Privilegi","d":"<p>Non rivela mai la sua identità se non è strettamente necessario, ripudia la violenza adoperata per motivi futili su qualsiasi essere vivente e non, si muove come se avesse perso la sicurezza di sè</p>"}],"portraits":[{"img":"assets/characters/niger-1.webp","cap":"NIGER","h":null},{"img":"assets/characters/niger-2.webp","cap":"NIGER · Ritratto 2","h":null}],"noteGenerali":"","diarioEntries":[],"evoluzioniFuturi":[],"fonteOriginale":"SCHEDA PG   \r\n\tNOME PERSONAGGIO \r\n\r\n\r\n\r\n\r\n\r\n\r\nNIGER NIGER \r\n\tCLASSE E LIVELLO\r\n\r\n\r\nNINJA LVL 7\r\n\tBACKGROUND\r\n\r\n\r\nNinja \r\n\r\n\r\n\tNOME GIOCATORE\r\n\r\n\r\nGIGASAMA\r\n\r\n\r\n\tRAZZA\r\n\r\n\r\nNUMA\r\n\r\n\r\n\tALLINEAMENTO\r\n\r\n\r\nX\r\n\r\n\r\n\tALTRO\r\n\r\n\r\n\r\n\r\n\tFORZA\r\n\r\n\r\n12\r\n\r\n\r\n(+1)\r\n\t\r\n\r\n(X)  ISPIRAZIONE\r\n(DI FATTI NON LA UTILIZZIAMO SCRIVETECI QUELLO CHE VOLETE)\r\n\tCA\r\n\r\n\r\n17\r\n\tINIZIATIVA\r\n\r\n\r\n7\r\n\tVELOCITÀ\r\n\r\n\r\n10\r\n\tT.CARATTERIALI/IDEALI/LEGAMI/DIFETTI/PRIVILEGI\r\nNon rivela mai la sua identità se non è strettamente necessario, ripudia la violenza adoperata per motivi futili su qualsiasi essere vivente e non, si muove come se avesse perso la sicurezza di sè\r\n\t\r\n\r\n(+3)  BONUS COMPETENZA\r\n\tDESTREZZA\r\n\r\n\r\n18\r\n\r\n\r\n(+4)\r\n\t  PUNTI FERITA           ATTUALI\r\n\r\n\r\n[ 72 ]         72\r\n\tPUNTI FERITA TEMPORANEI\r\n\r\n\r\n0\r\n\tCOSTITUZIONE\r\n\r\n\r\n13\r\n\r\n\r\n(+1)\r\n\tTIRI SALVEZZA\r\n\r\n\r\n[X] DESTREZZA\r\n[X] COSTITUZIONE\r\n\r\n\r\n\tDADO VITA\r\n\r\n\r\n1D8\r\n\tTS CONTRO MORTE\r\n\r\n\r\n* SUCCESSI    (3)\r\n* FALLIMENTI  (3)\r\n\tSLOT E UTILIZZABILI\r\n\tINTELLIGENZA\r\n\r\n\r\n12\r\n\r\n\r\n(+1)\r\n\tABILITA’\r\n\r\n\r\n[ 4 ]  ACROBAZIA (DES)\r\n[ 3 ]  ADD.ANIMALI (SAG)\r\n[ 1 ]  ARCANO (INT)\r\n[ 2 ] ATLETICA (FOR)\r\n[ 3 ]  FURTIVITA’ (DES)\r\n[ 1 ]  INDAGARE (INT)\r\n[ 2 ]  INGANNO (CAR)\r\n[ 1 ]  INTIMIDIRE (CAR)\r\n[ 1 ]  INTRATTENERE (CAR)\r\n[ 0 ]  INTUIZIONE (SAG)\r\n[ 0 ]  MEDICINA (SAG)\r\n[ 3 ]  NATURA (INT)\r\n[ 1 ]  PERCEZIONE (SAG)\r\n[ 1 ]  PERSUASIONE (CAR)\r\n[ 6 ]  RAPID. DI MANO (DES)\r\n[ 0 ]  RELIGIONE (INT)\r\n[ 1 ]  SOPRAVVIVENZA (SAG)\r\n[ 0 ]  STORIA (INT)\r\n\tATTACCHI & INCANTESIMI DI PRIMA UTILITA’\r\n\r\n\r\n\r\n\r\n* DANNI 3D12 3 ATTACCHI DIVERSI oppure uno UNICO \r\n\r\n\r\n* Azione costante migliore, il pg ha due azioni durante un turno di combattimento.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\t* Slot 1  \r\n* Slot 2\r\n* Slot 3\r\n* Slot 4\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\t* Slot 5 \r\n* Slot 6\r\n* Slot 7\r\n\tSAGGEZZA\r\n\r\n\r\n8\r\n\r\n\r\n(-1)\r\n\tCARISMA\r\n\r\n\r\n16\r\n\r\n\r\n(+3)\r\n\t\r\n\r\n3 x KAWARIMI NO JUTSU (Max 3)  [0/3](Trovati)\r\n\r\n\r\n3 x MIZUNOKAMI O ARUKU NO JUTSU (Max 3)\r\n\r\n\r\n3 x MISAI NO JUTSU (Max 3)\r\n\r\n\r\n3 x DOKU NO JUTSU (Max 3)\r\n\r\n\r\n1 x KUSARIGAMA ( 1 x SCONTRO)\r\n\r\n\r\n1 x KAGEBUSHI NO JUTSU (Max 1)\r\n\r\n\r\n3 x KUCHIYOSE NO JUTSU (Max 3)\r\n\t\r\n\r\n18 (+4)  SAGGEZZA (PERCEZIONE) PASSIVA\r\n\t                                                                                                     \r\nDESCRIZIONE PG\r\n\tETA’\r\n\r\n\r\n19\r\n\r\n\r\n\tALTEZZA\r\n\r\n\r\nMEDIA\r\n\tPESO\r\n\r\n\r\n85\r\n\tOCCHI\r\n\r\n\r\nGiallo Ocra\r\n\r\n\r\n\tCARNAGIONE\r\n\r\n\r\nPelo Nero\r\n\r\n\r\n\tCAPELLI\r\n\r\n\r\n\r\n\r\n\t\r\n\r\nIMMAGINE 1\r\n\r\n\r\n\t\r\n\r\nIMMAGINE 2\r\n\r\n\r\n\t  \r\n\r\n\t  \r\n\r\n\tSTORIA\r\n\r\n\r\nNato e cresciuto nella casa dei ninja a Tibstina Niger non ricorda altro che le mura della pagoda, ha trovato una figura paterna in Rakar, suo maestro, diventando il più diligente dei discepoli per compiacere e rendere orgoglioso il lupis che lo aveva cresciuto.\r\nDa sempre ha una grande affinità con gli animali, suoi unici compagni oltre agli altri discepoli e crescendo svilupperà un legame forte con la natura che gli permetterà di muoversi sempre facilmente in ambienti che potrebbero sembrare ostili. Crescendo gli viene affidato il ruolo di istruttore e diventa il braccio destro del maestro Rakar, proprio per questo non dimenticherà mai i principi con i quali è cresciuto, anche se un evento tragico cambia per sempre la sua vita, che perde tutte le certezze acquisite nella casa ninja e si ritrova in un mondo esterno completamente diverso ed inaspettato.\r\n\r\n\r\n\t                                          \r\nEQUIPAGGIAMENTO\r\n\tTESTA\r\n\r\n\r\nCAPPUCCIO E BANDANA\r\n\tBUSTO\r\n\r\n\r\nABBIGLIAMENTO SCURO\r\n\tGAMBE\r\n\r\n\r\nABBIGLIAMENTO SCURO\r\n\tARMA 1\r\n\r\n\r\nKUSARIGAMA\r\n\tARMA 2\r\n\r\n\r\nWAKIZASHI E TANTO\r\n\tARTEFATTI\r\n\r\n\r\n//\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n* KUSARIGAMA (falcetto con catena lunga): particolare arma ninja che ha facoltà di attaccare nemici vicini e lontani (3 caselle). Ogni qualvolta un nemico viene colpito il danno non viene suddiviso come per i classici attacchi ad area bensì verrà conteggiato come attacco singolo, pertanto se le condizioni lo permettono potranno essere attaccati più soggetti allo stesso tempo come se li si stesse attaccando frontalmente. Una volta per scontro è possibile utilizzare una particolare tecnica per effettuare una rotazione del corpo molto elevata che permette di compiere un attacco ad area di 10d6 per nemico nell'area di 5 caselle.\r\n\r\n\r\n* WAKIZASHI E TANTO (daga luga e una un po' più corta): se tutti e tre i colpi dovessero andare a segno il pg maturerebbe un 4° attacco bonus, se questo dovesse andare a buon fine il pg maturerebbe costantemente attacchi bonus fino alla suo fallimento, questo comprende qualsiasi nemico nelle sue possibilità. Ogni attacco Bonus guadagna un +2 sul Tiro per colpire e +1 sui danni che verranno sommati al successivo. Se il Pg dovesse riuscire ad effettuare 6 attacchi totali, ossia 3 normali + 3 Bonus, il 7° attacco gioverebbe di un antichissima tecnica Ninja che veda prendere fuoco le armi e totalizzare un attacco di 10d6(in questo attacco il pg potrà effettuare un Dash di 10 caselle a prescindere dal suo spostamento)\r\n\r\n\r\n* COTTA D’OMBRA FLESSIBILE : Questa armatura è realizzata con tessuti sottili ma resistenti, progettata per chi necessita di discrezione e agilità. La cotta sembra assorbire la luce circostante, permettendo a chi la indossa di muoversi con maggiore facilità nelle ombre. Sebbene non offra una protezione massiccia, la sua leggerezza e la sua struttura elastica consentono una buona mobilità e un minimo di resistenza ai danni fisici. La cotta consente a chi la indossa di muoversi più facilmente nelle ombre e nelle aree scarsamente illuminate, conferendo un +2 in situazioni di furtività, la struttura flessibile dell'armatura migliora i movimenti rapidi e leggeri, consentendo a chi la indossa di compiere manovre agili, +1 acrobazie o schivate. La cotta offre una protezione moderata contro i colpi più leggeri, come graffi o frecce, riducendo di poco il danno subito da armi leggere e non perforanti, i danni inferiori a 10 PF avranno grandi possibilità di essere evitati tirando una moneta. La cotta è progettata per ridurre il rumore dei movimenti, ma non garantisce invisibilità totale. Tuttavia, chi la indossa può ottenere una leggera riduzione dei rumori provocati da camminamenti o azioni furtive. + 1 CA\r\n\r\n\r\n* SANDALI INSONORIZZATI : questi facenti parte dell'abbigliamento proprio ninja, grazie alla loro conformazione a conca favoriscono di un + 1 tutti i tiri su furtività.\r\n\r\n\r\n\t\r\n\r\n                                                                                                                 \r\nINVENTARIO\r\n\tTotale massimo trasportabile 30P\r\n\t\r\n\r\n* PENNELLO PER DISEGNI; 1P\r\n\r\n\r\n* CORDA SOTTILE 15; 3P\r\n\r\n\r\n* 4 anelli simili a fedi nuziali con spine nascoste e spesso velenose, tipicamente indossate dalle kunoichi, e che consentono ai ninja di strangolare silenziosamente i nemici con le estremità appuntite contro il collo o la gola + 1 DANNI CAC; 2P\r\n\r\n\r\n*  MAKIBISHI 40 sono oggetti appuntiti usati per rallentare gli inseguitori o nella difesa delle fortificazioni; 4P\r\n\r\n\r\n* RAMPINO PER SCALARE + 2 in attività che richiedono l'attività di scalare o Arrampicata; 1P\r\n\r\n\r\n* 30 SHURIKEN piccolissime armi da lancio (se ne possono lanciare fino a 4 per attacco (1d4); 3P\r\n\r\n\r\n* 4 FIALE PER VELENO; 2P\r\n\r\n\r\n* CARNE ESSICCATA (10 Scorte da Campo); 5P\r\n\r\n\r\n* INCHIOSTRO PER DISEGNI; 1P\r\n\r\n\r\n* MAPPA TIBSTINA CON CONFINI EVIDENZIATI; 1P\r\n\r\n\r\n* 1000 MONETE D’ORO; 1P\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\tTOT  24P/30P     \r\n\r\n\r\n\t\r\n\r\n\r\n\r\nABILITÀ  & TRUCCHETTI \r\n\t\r\n\r\nFUKASHI NO JUTSU \r\n(Invisibilità)\r\nABILITÀ \r\n\tIl pg entra in uno stato di simil trasparenza diventando a tutti gli effetti invisibile agli occhi Nemici e Amici. Durante l'uso della tecnica lo Shinobi potrà compiere azioni furtive non effettuando tiri aggiuntivi per mantenere la forma di invisibilità. Se colpito accidentalmente o non, dovrà effettuare un tiro su NINJUTSU che se superato avrà come effetto benefico il suo proseguo in caso contrario non perderà la sua invisibilità bensì sarà visibile solo al nemico/i per cui avrà dovuto effettuare il tiro. (Per ogni nemico ucciso in invisibilità guadagna 10 PF Temporanei, non è necessario che sia il pg ad ucciderlo ma basta che gli vengano inferti più di 4 colpi). Durata tutto lo scontro oppure 10 H/ + 6 furtività / + 6 / + 6 acrobazie/ + 5 Movimento / + 4 danni a colpo sommabili. Se il primo dovesse andare a segno il secondo colpo avrebbe + 8 danni e di conseguenza il terzo + 12 anche su nemici differenti/ + 6 ai tiri per colpire / se vi dovessero essere dei nemici vicini nell'arco di 3 caselle e il pg dovesse brandire un arma idonea potrebbe effettuare un attacco ad area con gli stessi danni di un attacco normale (esempio kusarigama)\r\n\t\r\n\r\nKAGEBUSHI NO JUTSU \r\n(Moltiplicazione del corpo)\r\nABILITÀ  \r\n\tLo shinobi ha la possibilità di creare delle copie di se stesso posizionandole dove meglio preferisce nell'arco di 6 caselle. Esse saranno delle vere e proprie copie che avranno capacità proprie o saranno comandate dallo shinobi indurranno. Lo Shinobi può generare fino ad un massimo di 5 Copie. Ogni volta che lo shinobi genera una copia decide quanto danno essa può fare e quanti punti ferita essa debba avere tutto ovviamente condiviso con le sue caratteristiche. Durante l'uso di questa tecnica particolare il pg guadagna 20pft per un totale di 85pf. Inoltre avrà 2d6 aggiuntivi o 1d12 a scelta, per un totale di 8d6 o 4 d12 In questo caso potrà decide di dividere equamente i dadi dei danni e i pf per ogni copia oppure decidere strategicamente di dare 10pf ad ogni copia e 1d6 danni. Se le copie vengono poste vicino al nemico, il pg guadagna un bonus di + 3 al tiro per colpire per ognuna, in più se distrutte si trasformano in catene circolari che bloccano il nemico per un turno se non dovesse riuscire a superare la TS DESTREZZA di 19. In alcuni casi, mantenendo la concentrazione e stando immobile, il pg può generare molte più copie di quelle previste che però possono compiere azioni semplici e non attacchi. Una volta per riposo lungo, i PF Aumentano a 100 e i d6 da 2 diventano 4 per un totale di 10d6 o 5d12.\r\n\t\r\n\r\n\r\n\r\n                    \r\nSHARINGAN \r\n(Arte Illusoria)\r\nABILITÀ\r\n\tQuesta tecnica non rappresenta un genjutsu avanzato né una forma di controllo mentale profondo. Il suo scopo non è intrappolare il nemico in un’illusione totale, ma disorientarlo, alterandone la percezione immediata della realtà e inducendolo a commettere errori. Il PG utilizza il genjutsu per far percepire al bersaglio elementi che non esistono o che non si trovano nella posizione reale, come la falsa collocazione del PG, movimenti inesistenti o presenze illusorie. Il genjutsu può essere attivato entro un raggio di 20 caselle, purché vi sia contatto visivo diretto tra il PG e il bersaglio. Al momento dell’attivazione, il bersaglio deve effettuare un tiro salvezza su Saggezza CD 19. In caso di fallimento, il bersaglio cade sotto l’effetto dell’illusione.\r\nGli effetti del genjutsu sono decisi dal PG, sempre in accordo con il master, e devono rientrare in manifestazioni di disorientamento percettivo. A titolo di esempio, il PG può far percepire al nemico numerose copie illusorie di sé stesso sparse sul campo di battaglia, inducendolo a non distinguere quale sia la posizione reale, oppure alterare la percezione di movimenti, distanze o direzioni. Il genjutsu non immobilizza, non infligge danni diretti e non genera effetti prolungati o traumatici (per ottenere effetti di questo tipo sarebbe necessario accumulare una quantità molto elevata di energia, mantenendo la concentrazione per numerosi turni consecutivi; una pratica non impossibile per il PG, ma estremamente difficile e rischiosa, poiché richiederebbe di restare fermo e vulnerabile a lungo). La tecnica può essere attivata in qualsiasi momento, anche durante il turno di un avversario, purché il PG abbia un’azione ancora disponibile. In tal caso non viene considerata una reazione, ma un’azione spesa fuori dal proprio turno, rendendola utilizzabile come strumento difensivo o di evasione.\r\n\r\n\r\n\tBYAKUGAN\r\n(Visione Totale) \r\nABILITÀ\r\n\tQuesta tecnica conferisce al PG una percezione estremamente avanzata del campo di battaglia, permettendogli di controllare il territorio attraverso la vista e la lettura energetica. Si tratta di una disciplina ninja basata su concentrazione, postura e affinamento sensoriale, ispirata alle arti di osservazione più elevate. Quando il PG attiva il Byakugan, ottiene una visione a 360 gradi del campo di battaglia. La visione comprende tutto il campo di battaglia, se eccessivamente grande, entro un raggio di circa 40 caselle. Il PG è in grado di individuare con chiarezza nemici, alleati e creature, anche se nascosti, invisibili o protetti da magie, illusioni o artefatti che ne celano la presenza. La posizione dei bersagli viene percepita in modo costante e affidabile. Durante l’effetto della tecnica, il PG vede indipendentemente dalle condizioni ambientali: buio totale, nebbia, fumo, polvere, oscurità magica o ostacoli visivi non impediscono la percezione. Inoltre, il PG è in grado di individuare trappole, sigilli, incantesimi attivi, anomalie energetiche e strutture nascoste, rendendo l’abilità estremamente utile sia in combattimento sia nelle fasi di esplorazione tattica.\r\nMentre l’arte è attiva, il PG può effettuare un tiro su Osservare per analizzare uno o più avversari visibili. In caso di successo, il PG individua punti deboli, schemi di movimento o vulnerabilità, che restano percepibili in modo costante per tutta la durata dell’abilità, fornendo un vantaggio tattico diretto a sé stesso e, se comunicato, anche ai compagni. Considerata dai Ninja una grande tecnica che non tutti riescono a padroneggiare.\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nKAGEMANE NO JUTSU\r\n(Possessione dell’Ombra)\r\nABILITÀ\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\tIl PG si abbassa in una postura di concentrazione, quasi immobile, e lascia che la propria ombra si distenda come un’appendice viva sul terreno, cercando un contatto reale con l’ombra del bersaglio: quando le due ombre si toccano, il legame scatta e il corpo nemico viene costretto a seguire la volontà del ninja come se fosse tirato da fili invisibili. Il PG può attivare la tecnica fino a un massimo di 15 caselle, ma solo in condizioni di ombra (mezza luce/mezza penombra); in luce forte la tecnica non può essere utilizzata oppure viene annullata immediatamente se già attiva. Per agganciare non è necessaria la linea visiva sul nemico, però l’ombra deve essere agganciabile e deve esistere un contatto reale tra le due ombre lungo una superficie continua, come se il vincolo fosse quasi fisico. Contro nemici base non sono richiesti tiri aggiuntivi: se l’aggancio è possibile il vincolo è completo e il bersaglio viene bloccato; se il PG si alza o modifica la propria posizione, il bersaglio replica esattamente i suoi movimenti come una marionetta. Contro nemici più forti o più grossi il controllo non è garantito: il PG deve superare un tiro contrapposto su COSTITUZIONE per stabilire il vincolo e, se riesce, dovrà ripetere lo stesso contrapposto ogni turno per mantenere la presa (in caso di fallimento il vincolo si spezza). Durante l’uso il PG ha due possibilità: Presa Classica, in cui mantiene la postura e blocca un singolo bersaglio comandandone i movimenti, oppure Estensione Ad Area, in cui estende un’area a cerchio di 7 caselle di raggio e può bloccare fino a 4–5 nemici, ma solo se sono nemici base senza peculiarità rilevanti su FORZA o COSTITUZIONE. Se il PG dispone di abbastanza chakra, può inoltre stringere il vincolo fino allo strangolamento del bersaglio; l’uso della tecnica non infligge danni al PG.\r\n\t                   \r\n      BUNKAI SURU NO JUTSU                                    \r\n            (Dissimulazione)\r\n                      ABILITÀ\r\n\tIl pg grazie a questa tecnica illusoria molto potente ha la possibilità di mutare la forma del suo corpo facendo credere al nemico di essere un oggetto. Questa tecnica sfrutta un particolare effetto ottico che renderà il pg solo visivamente diverso e non fisicamente, pertanto se il nemico dovesse in qualche modo toccarlo l'effetto della tecnica svanirebbe. Per far sì che la tecnica vada a buon fine il PG dovrà rimanere fermo immobile, pertanto in determinate situazioni ostiche, se necessario verrà richiesto un tiro su equilibrio.(Ex. Prendere le sembianze di un barilotto fuori da un locale o una pianta in un giardino).\r\n\t \r\n      SHIZUKESA NO JUTSU \r\n(Insonorizzazione)\r\nABILITÀ\r\n\tIl Ninja ha la possibilità, oltre alle sue conoscenze ed al suo equipaggiamento/vestiario, di annullare qualsiasi suono/rumore proveniente dal corpo o quelle di un alleato toccandolo. Durata 5 turni / + 4 ai tiri per colpire / + 4 Movimento / + 4 Acrobazia / + 4 furtività\r\n\t\r\n\r\nSHINEN GOGEN NO JUTSU  \r\n(Tecnica delle Cinque Manifestazioni Naturali)\r\nABILITÀ\r\nIl PG fa fluire e modella l’energia interna attraverso disciplina fisica e concentrazione spirituale, manifestandola sotto forma di cinque elementi naturali. Questa tecnica è un'arte ninja avanzata che utilizza il corpo come catalizzatore. Il Chakra può essere mantenuto in concentrazione per potenziare progressivamente gli effetti delle manifestazioni, rendendole più intense, estese o oppressive. \r\n\r\n\r\n- RAITON (FULMINE) :\r\n\r\n\r\n* RAIKIRI: il PG concentra il fulmine sul proprio corpo e scatta verso un bersaglio fino a 12 caselle, infliggendo un colpo ravvicinato devastante. Il bersaglio principale subisce 8d6 danni da fulmine, mentre tutte le creature che si trovano lungo il percorso del dash subiscono 2d6 danni da fulmine a causa della scarica residua che attraversa l’aria.\r\n\r\n\r\n* KIRIN: il PG rimane immobile e agisce come un parafulmine, richiamando l’elettricità dall’atmosfera. Dopo la concentrazione, può colpire un bersaglio entro 20 caselle con un fulmine che scende dal cielo. Il danno cresce in base ai turni di concentrazione, partendo da 13d6, aumentando a 20d6 e fino a un massimo di 28d6 al terzo turno, al termine del quale il colpo deve essere obbligatoriamente scagliato.\r\n\r\n\r\n- FŪTON (ARIA) :\r\n\r\n* RASENGAN: il PG comprime l’energia del vento in una sfera instabile e colpisce in mischia infliggendo 7d6 danni, accompagnando l’attacco con uno spostamento fino a 10 caselle. Il Rasengan può essere utilizzato anche come propulsione, scaricandolo contro il terreno o una superficie solida per generare una potente spinta che consente al PG di slanciarsi in aria o riposizionarsi rapidamente.\r\n\r\n\r\n* RASENSHURIKEN: una volta per scontro, il PG lancia una lama di vento estremamente distruttiva entro 30 caselle, infliggendo un totale di 30d6 danni. Il Rasenshuriken può esplodere, permettendo al PG di ripartire liberamente i danni tra tutti i nemici coinvolti, oppure essere usato in forma concentrata, assegnando i danni singolarmente ai bersagli scelti.\r\n\r\n\r\n- KATON (FUOCO) :\r\n\r\n* GŌKAKYŪ NO JUTSU: il PG sprigiona una potente fiammata frontale a cono, estendibile fino a 6 caselle, infliggendo un totale di 10d6 danni da fuoco. I dadi possono essere concentrati su un singolo bersaglio oppure ripartiti tra più nemici colpiti. Chiunque venga colpito subisce inoltre 2 danni fissi fino alla fine dello scontro.\r\n\r\n\r\n* HŌSENKA NO JUTSU: il PG genera 8 palle di fuoco, ciascuna indirizzabile indipendentemente entro 12 caselle. Ogni palla infligge 1d6 danni più 1d4 danni incendiari permanenti fino alla fine dello scontro. Se tutte le palle vengono dirette contro lo stesso bersaglio, viene effettuato un solo tiro contro la CA; se distribuite su più nemici, si effettua un tiro per ciascun bersaglio.\r\n\r\n\r\n- DOTON (TERRA) :\r\n\r\n* DORYŪHEKI NO JUTSU: il PG modella la terra circostante creando strutture fisiche reali come ripari balistici, muri, speroni o modifiche del terreno utili al controllo dello spazio. Il PG può inoltre immergersi nella terra e riemergere in un punto a scelta entro un massimo di 30 caselle, utilizzando il terreno come mezzo di spostamento. Mantenendo la concentrazione, le strutture diventano progressivamente più estese e resistenti.\r\n\r\n\r\n* DOMU NO JUTSU: il PG utilizza la terra per potenziare sé stesso o un alleato, creando un’armatura di terra che fornisce +1 alla CA oppure forgiando armi di terra che conferiscono un bonus ai danni pari a +1d6. Mantenendo la concentrazione, tali benefici possono aumentare progressivamente.\r\n\r\n\r\n- SUITON (ACQUA) :\r\n\r\n* SUIRYŪDAN NO JUTSU: il PG evoca un drago d’acqua che colpisce i nemici con la forza del flusso, infliggendo 8d6 danni. I bersagli colpiti possono essere spinti o inglobati nel drago; chi non supera un tiro salvezza su Destrezza CD 18 viene trascinato dal flusso e può essere spostato dal PG fino a 12 caselle.\r\n\r\n\r\n* SUIRŌ NO JUTSU: il PG genera una gigantesca onda d’acqua che pervade il campo di battaglia in un’area rettangolare di 20 caselle, alterando completamente il terreno. L’acqua permane sul campo creando un forte vantaggio tattico: il PG può muoversi agevolmente sulla superficie, mentre i nemici sono costretti a nuotare o a muoversi con difficoltà. All’interno dell’acqua il PG può modellare il flusso per creare barriere mobili o imprigionare un nemico in una prigione d’acqua; il bersaglio deve superare un tiro salvezza su Costituzione CD 18, altrimenti rimane intrappolato e la difficoltà di liberarsi aumenta a ogni turno successivo.\r\n\t                                                                                                                               \r\n\r\n\r\n\r\n\r\nKUCHIYOSE NO JUSTU\r\n (Evocazione)\r\nTRUCCHETTO\r\n\r\n\r\n\r\n\r\n\r\n\r\n\tIl pg evoca un \"servitore ninja\" che ubbidirà ai suoi comandi, aiutandolo in qualsiasi modo possibile. Questi particolari “servitori” riguardano una antichissima tradizione ninja che prevede l’affiliazione a “famiglie” ninja. Queste famiglie sono un’insieme di animali soggetti a particolari e antichissimi incantesimi di vitalizzazione. In sostanza sono animali comuni che possono parlare e compiere azioni comuni (di solito gatti). Per evocare il servitore il PG dovra’ donare un piccolo tributo di sangue, di solito un morso al dito (5PF), in quel caso il famiglio potra’ essere evocato nell’arco di 6 caselle di distanza ed eseguira’ gli ordini del suo evocatore o in caso contrario lo aiutera’ come meglio possibile. La durata e’ indefinita, ma se dovesse terminare i PF l’evocazione tornerebbe nel suo limbo considerandola come un KAGEBUSHI. Quindi una volta sconfitto si trasformera’ in catene circolari che bloccano il nemico per un turno se non dovesse riuscire a superare la TS DESTREZZA di 19. \r\nPF 60 / MOV 12 /  CA 18  Quantità - 3 - CD 15\r\nIn casi di estrema necessita’ con un sacrificio di sangue elevato (20pf) e un accumulo di chakra non indifferente, il pg puo’ evocare il capofamiglia, nonche’ uno dei servitori piu’ anziani e forti, di stazza gigante e dalla forza e abilita’ devastanti. Una volta evocato il capofamiglia, il pg non potra’ compiere nessuna abilita’ che richieda chakra ma solo attacchi semplici, solo in determinati contesti sara’ possibile utilizzare chakra(discrezione Master)\r\n\t\r\n\r\n\r\n\r\nKAWARIMI NO JUTSU\r\n (Sostituzione)\r\nTRUCCHETTO\r\n\tLo shinobi ha la possibilità, durante il turno nemico, di sostituire la propria persona con un oggetto inanimato. Questo permetterà di evitare il colpo nemico. Questa tecnica può essere usata dopo che il nemico ha effettivamente effettuato un tiro superando la classe armatura del pg(quindi sapendo con chiarezza che si verrà colpiti). In alcuni casi l’oggetto puo’ si trasformera’ in catene circolari che bloccano il nemico per un turno se non dovesse riuscire a superare la TS DESTREZZA di 19. La tecnica richiede che il giocatore cerchi autonomamente questi oggetti, fuori dai combattimenti, ex. Tronco di legno, Pietra di una certa grandezza etc, per poi apporgli uno specifico marchio dipinto sopra (una volta fatto l'oggetto sparirà e potrà essere utilizzato in combattimento) Quantità - 3 - CD 15\r\n\t\r\n\r\nMISAI NO JUTSU\r\n(Mimetizzazione)\r\nTRUCCHETTO\r\n\tIl pg ha la capacità di assumere gli stessi colori del circondario se rimane fermo in un punto così da essere quasi tutt'uno con l'ambiente circostante. Per utilizzare questa capacità il PG dovrà rimanere fermo anche solo il turno corrente e se lo farà guadagnerà un i nemici avranno un - 4 ai tiri per colpire. Se l'ambiente circostante è formato dagli stessi colori e disposizioni il Pg ha la facoltà di muoversi senza perdere il beneficio della mimetizzazione, ogni volta che l'ambiente circostante cambierà il PG potrà effettuare un tiro per modificare la sua mimetizzazione. Oltre ad essere fondamentale come abilità di combattimento viene spesso utilizzata in ambiti furtivi.  L'abilità termina solo se l'ambiente circostante muta o il pg si sposta in uno nuovo. (Se il PG è fermo da 3 o più turni l'abilità si attiva in automatico senza sprecare \"Quantità\") Quantità - 3 - CD 14\r\n\t\r\n\r\nDOKU NO JUTSU \r\n(Creazione veleno)\r\nTRUCCHETTO\r\n\tGrazie alla via dei Ninja \"Chi-mon\" ovvero Geografia, il pg ha una ottima cultura del territorio, che studiando potrebbe aumentare e dare ancora più benefici. Il pg può grazie alle sue conoscenze creare veleni paralizzanti/devianti/parzialmente lesivi/mortali/o altri tipi di effetti a seconda delle conoscenze del giocatore in materia, raccogliendo dal territorio il materiale adatto. Quantità - 3 - CD 14\r\n\t\r\n\r\nKYŪIN NO JUTSU\r\n(Risonanza del Chakra)\r\nTRUCCHETTO\r\n\tQuesta tecnica ninja avanzata permette al PG di ottimizzare e amplificare il proprio flusso di chakra, trasformando l’accumulo energetico in sostegno fisico e potenziamento delle tecniche. Il chakra, inteso come linfa vitale, viene concentrato e compresso fino a produrre un effetto rigenerativo sul corpo. Quando il PG attiva il Kyūin no Jutsu, spende un intero turno in concentrazione. Al termine di questo turno, il PG recupera 4d10 punti ferita, se Full 25 diventano Temporanei e ottiene un forte incremento del proprio quantitativo di chakra, sufficiente a consentire l’uso di abilità particolarmente dispendiose o normalmente difficili da sostenere. Una volta attivato per tutta la durata dello scontro, ogni volta che il PG si mette in concentrazione per aumentare il proprio chakra, ottiene anche un recupero di 1d10 punti ferita. Inoltre, in questo stato, il quantitativo di chakra guadagnato tramite concentrazione è raddoppiato rispetto a quanto otterrebbe normalmente. Dunque anche tecniche che richiederebbero elevati sforzi o turni in concentrazione verrebbero diemezzati. Questo stato di risonanza rende il PG capace di sostenere un ritmo di combattimento più intenso e di lanciare abilità che può normalmente utilizzare, ma in forme più potenti, grazie all’elevata disponibilità di chakra. L’effettivo grado di potenziamento delle tecniche rimane soggetto alla valutazione del master, ma va considerato che il PG, in questa condizione, dispone di risorse nettamente superiori allo standard (Ricordarlo al Master). Quantità - 3 - CD 14 \r\n\t\r\n\r\nMIZUNOKAMI O ARUKU NO JUTSU\r\n(Camminare sull'acqua)\r\nTRUCCHETTO\r\n\t\r\n\r\nQuesta tecnica permette al Ninja di camminare sull'acqua per tutto lo scontro o max 10h variabile in base alle condizioni atmosferiche. Quantità - 3 - CD 14\r\n\t\r\n\r\n\t\r\n\r\n\t\r\n\r\n\t\r\n\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nNOTE\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n        \r\n\t                                                  \r\n\r\n\r\n  PRIVILEGI DI RAZZA E CLASSE:\r\n\r\n\r\n- Il pg ha la possibilità di effettuare 3 attacchi con qualsiasi arma ninja (poiché competente in essa) 1d12\r\n\r\n\r\n- i Numa hanno un udito eccellente e pertanto la percezione passiva (ossia la capacità di percepire presenze esterne, trappole o imboscate) del PG è di 18(+4)\r\n\r\n\r\n- il Pg grazie alla sua razza ha la piena possibilità di combattere a mani nude poiché dotato di denti aguzzi e artigli affilati e grazie alle sue conoscenze del taijutsu 1d8+1 (probabilità sanguinamento) 3 attacchi disponibili \r\n\r\n\r\n- Il Pg grazie ai suoi artigli ha la possibilità di arrampicarsi/rimanere aggrappato anche su superfici ostiche per 6 turni  senza effettuare nessun tiro. Superati tali limiti verrà effettuato un tiro su acrobazia per rimanere aggrappato.\r\n\r\n\r\n- Il Pg avendo piena padronanza delle \"18 Vie Ninja\" ha diverse conoscenze che possono aiutarlo durante qualsiasi tipo di attività. (Esso dovrà citarle obbligatoriamente ogni tanto nei discorsi, facendo piccole citazioni o spiegazioni nel caso da chiedere al Master)\r\n\r\n\r\n1. Bōjutsu: tecniche del bastone                              2. Bōryaku – tattica\r\n3. Chi-mon – geografia                                            4. Chōhō – spionaggio\r\n5. Hensōjutsu: travestimento e imitazione               6. Intonjutsu: fuga e occultamento\r\n7. Kayakujutsu – pirotecnica                                    8. Kenjutsu – tecniche della spada\r\n9. Kusarigamajutsu (falce a catena)                         10. Naginatajutsu  (bastone lungo con lama innestata) \r\n11. Seishinteki kyōyō – raffinatezza spirituale        12. Shinobi-iri: furtività e infiltrazione\r\n13. Shurikenjutsu: tecniche di lancio di armi          14. Sōjutsu – tecniche di lancia\r\n15. Sui-ren – allenamento in acqua                         16. Taijutsu: combattimento senza armi\r\n17. Tenmon – meteorologia                                     18. Bajutsu – equitazione\r\n\r\n\r\n- TECNICHE NINJUTSU \r\nGrazie  al  \"Qui-Gong\" meglio conosciuto dai Ninja come CHAKRA, il pg può compiere dei gesti specifici con le mani, che composti nel modo giusto e pronunciata correttamente il nome della tecnica ad alta voce, porteranno ad abilità innate. Esso e’ il potere che scorre all’interno di ogni essere vivente e grazie a dei movimenti delle mani si puo’ utilizzare come fonte di energia che i Ninja hanno imparato ad imbrigliare in ablita’ uniche. PER ACCUMULARE CHAKRA IL PG DOVRA’ RIMANERE IN CONCENTRAZIONE PER DIVERSO TEMPO. PIU’ CHAKRA SI ACCUMULA E PIU’ FORTI POSSONO ESSERE GLI EFFETTI DELLE ABILITA’ LANCIATE. (E’ POSSIBILE CUMULARE CHAKRA PREVENTIVAMENTE MA ESSO NON RIMARRA’ IMMAGAZZINATA PER SEMPRE, COMINCERA’ GRADUALMENTE A DIMINUIRE FINO AD ARRIVARE ALLA CARICA BASE DEL PG PER LANCIARE LE ABILITA’ NORMALI)  \r\n\r\n\r\n- AZIONE COSTANTE, IL PG PUO’ EFFETTUARE DUE AZIONI DURANTE IL SUO TURNO\r\n\r\n\r\n- INSERIMENTO SLOT PG\r\nIl PG usufruirà di 7 slot esclusivamente per ABILITÀ attive, il restante, verrà contrassegnato come TRUCCHETTO. I trucchetti avranno CD proprie ed avranno degli utilizzi limitati nell'arco della giornata (riposo lungo). I tiri delle abilità verranno effettuati esclusivamente su NINJUTSU una Macro CD 16 che scalerà su DESTREZZA.","heroBgPos":{"x":50,"y":20},"heroBgImage":"","heroBgZoom":1,"truccetti":[{"nome":"KUCHIYOSE NO JUSTU\n(Evocazione)","desc":"<p>Il pg evoca un &quot;servitore ninja&quot; che ubbidirà ai suoi comandi, aiutandolo in qualsiasi modo possibile. Questi particolari “servitori” riguardano una antichissima tradizione ninja che prevede l’affiliazione a “famiglie” ninja. Queste famiglie sono un’insieme di animali soggetti a particolari e antichissimi incantesimi di vitalizzazione. In sostanza sono animali comuni che possono parlare e compiere azioni comuni (di solito gatti). Per evocare il servitore il PG dovra’ donare un piccolo tributo di sangue, di solito un morso al dito (5PF), in quel caso il famiglio potra’ essere evocato nell’arco di 6 caselle di distanza ed eseguira’ gli ordini del suo evocatore o in caso contrario lo aiutera’ come meglio possibile. La durata e’ indefinita, ma se dovesse terminare i PF l’evocazione tornerebbe nel suo limbo considerandola come un KAGEBUSHI. Quindi una volta sconfitto si trasformera’ in catene circolari che bloccano il nemico per un turno se non dovesse riuscire a superare la TS DESTREZZA di 19.</p><p>PF 60 / MOV 12 /  CA 18  Quantità - 3 - CD 15</p><p>In casi di estrema necessita’ con un sacrificio di sangue elevato (20pf) e un accumulo di chakra non indifferente, il pg puo’ evocare il capofamiglia, nonche’ uno dei servitori piu’ anziani e forti, di stazza gigante e dalla forza e abilita’ devastanti. Una volta evocato il capofamiglia, il pg non potra’ compiere nessuna abilita’ che richieda chakra ma solo attacchi semplici, solo in determinati contesti sara’ possibile utilizzare chakra(discrezione Master)</p>","hidden":false,"width":3,"uso":"3"},{"nome":"KAWARIMI NO JUTSU\n(Sostituzione)","desc":"<p>Lo shinobi ha la possibilità, durante il turno nemico, di sostituire la propria persona con un oggetto inanimato. Questo permetterà di evitare il colpo nemico. Questa tecnica può essere usata dopo che il nemico ha effettivamente effettuato un tiro superando la classe armatura del pg(quindi sapendo con chiarezza che si verrà colpiti). In alcuni casi l’oggetto puo’ si trasformera’ in catene circolari che bloccano il nemico per un turno se non dovesse riuscire a superare la TS DESTREZZA di 19. La tecnica richiede che il giocatore cerchi autonomamente questi oggetti, fuori dai combattimenti, ex. Tronco di legno, Pietra di una certa grandezza etc, per poi apporgli uno specifico marchio dipinto sopra (una volta fatto l&#x27;oggetto sparirà e potrà essere utilizzato in combattimento) Quantità - 3 - CD 15</p>","hidden":false,"width":3,"uso":"3"},{"nome":"MISAI NO JUTSU\n(Mimetizzazione)","desc":"<p>Il pg ha la capacità di assumere gli stessi colori del circondario se rimane fermo in un punto così da essere quasi tutt&#x27;uno con l&#x27;ambiente circostante. Per utilizzare questa capacità il PG dovrà rimanere fermo anche solo il turno corrente e se lo farà guadagnerà un i nemici avranno un - 4 ai tiri per colpire. Se l&#x27;ambiente circostante è formato dagli stessi colori e disposizioni il Pg ha la facoltà di muoversi senza perdere il beneficio della mimetizzazione, ogni volta che l&#x27;ambiente circostante cambierà il PG potrà effettuare un tiro per modificare la sua mimetizzazione. Oltre ad essere fondamentale come abilità di combattimento viene spesso utilizzata in ambiti furtivi.  L&#x27;abilità termina solo se l&#x27;ambiente circostante muta o il pg si sposta in uno nuovo. (Se il PG è fermo da 3 o più turni l&#x27;abilità si attiva in automatico senza sprecare &quot;Quantità&quot;) Quantità - 3 - CD 14</p>","hidden":false,"width":3,"uso":"3"},{"nome":"DOKU NO JUTSU\n(Creazione veleno)","desc":"<p>Grazie alla via dei Ninja &quot;Chi-mon&quot; ovvero Geografia, il pg ha una ottima cultura del territorio, che studiando potrebbe aumentare e dare ancora più benefici. Il pg può grazie alle sue conoscenze creare veleni paralizzanti/devianti/parzialmente lesivi/mortali/o altri tipi di effetti a seconda delle conoscenze del giocatore in materia, raccogliendo dal territorio il materiale adatto. Quantità - 3 - CD 14</p>","hidden":false,"width":3,"uso":"3"},{"nome":"KYŪIN NO JUTSU\n(Risonanza del Chakra)","desc":"<p>Questa tecnica ninja avanzata permette al PG di ottimizzare e amplificare il proprio flusso di chakra, trasformando l’accumulo energetico in sostegno fisico e potenziamento delle tecniche. Il chakra, inteso come linfa vitale, viene concentrato e compresso fino a produrre un effetto rigenerativo sul corpo. Quando il PG attiva il Kyūin no Jutsu, spende un intero turno in concentrazione. Al termine di questo turno, il PG recupera 4d10 punti ferita, se Full 25 diventano Temporanei e ottiene un forte incremento del proprio quantitativo di chakra, sufficiente a consentire l’uso di abilità particolarmente dispendiose o normalmente difficili da sostenere. Una volta attivato per tutta la durata dello scontro, ogni volta che il PG si mette in concentrazione per aumentare il proprio chakra, ottiene anche un recupero di 1d10 punti ferita. Inoltre, in questo stato, il quantitativo di chakra guadagnato tramite concentrazione è raddoppiato rispetto a quanto otterrebbe normalmente. Dunque anche tecniche che richiederebbero elevati sforzi o turni in concentrazione verrebbero diemezzati. Questo stato di risonanza rende il PG capace di sostenere un ritmo di combattimento più intenso e di lanciare abilità che può normalmente utilizzare, ma in forme più potenti, grazie all’elevata disponibilità di chakra. L’effettivo grado di potenziamento delle tecniche rimane soggetto alla valutazione del master, ma va considerato che il PG, in questa condizione, dispone di risorse nettamente superiori allo standard (Ricordarlo al Master). Quantità - 3 - CD 14</p>","hidden":false,"width":3,"uso":"3"},{"nome":"MIZUNOKAMI O ARUKU NO JUTSU\n(Camminare sull'acqua)","desc":"<p>Questa tecnica permette al Ninja di camminare sull&#x27;acqua per tutto lo scontro o max 10h variabile in base alle condizioni atmosferiche. Quantità - 3 - CD 14</p>","hidden":false,"width":3,"uso":"3"}],"sourceSections":[{"nome":"PRIVILEGI DI RAZZA E CLASSE","group":"REGOLE DEL NINJA","desc":"<p>- Il pg ha la possibilità di effettuare 3 attacchi con qualsiasi arma ninja (poiché competente in essa) 1d12</p><p>- i Numa hanno un udito eccellente e pertanto la percezione passiva (ossia la capacità di percepire presenze esterne, trappole o imboscate) del PG è di 18(+4)</p><p>- il Pg grazie alla sua razza ha la piena possibilità di combattere a mani nude poiché dotato di denti aguzzi e artigli affilati e grazie alle sue conoscenze del taijutsu 1d8+1 (probabilità sanguinamento) 3 attacchi disponibili</p><p>- Il Pg grazie ai suoi artigli ha la possibilità di arrampicarsi/rimanere aggrappato anche su superfici ostiche per 6 turni  senza effettuare nessun tiro. Superati tali limiti verrà effettuato un tiro su acrobazia per rimanere aggrappato.</p>","location":"poteri","hidden":false},{"nome":"18 VIE NINJA","group":"REGOLE DEL NINJA","desc":"<p>- Il Pg avendo piena padronanza delle &quot;18 Vie Ninja&quot; ha diverse conoscenze che possono aiutarlo durante qualsiasi tipo di attività. (Esso dovrà citarle obbligatoriamente ogni tanto nei discorsi, facendo piccole citazioni o spiegazioni nel caso da chiedere al Master)</p><p>1. Bōjutsu: tecniche del bastone                              2. Bōryaku – tattica</p><p>3. Chi-mon – geografia                                            4. Chōhō – spionaggio</p><p>5. Hensōjutsu: travestimento e imitazione               6. Intonjutsu: fuga e occultamento</p><p>7. Kayakujutsu – pirotecnica                                    8. Kenjutsu – tecniche della spada</p><p>9. Kusarigamajutsu (falce a catena)                         10. Naginatajutsu  (bastone lungo con lama innestata)</p><p>11. Seishinteki kyōyō – raffinatezza spirituale        12. Shinobi-iri: furtività e infiltrazione</p><p>13. Shurikenjutsu: tecniche di lancio di armi          14. Sōjutsu – tecniche di lancia</p><p>15. Sui-ren – allenamento in acqua                         16. Taijutsu: combattimento senza armi</p><p>17. Tenmon – meteorologia                                     18. Bajutsu – equitazione</p>","location":"poteri","hidden":false},{"nome":"CHAKRA E TECNICHE NINJUTSU","group":"REGOLE DEL NINJA","desc":"<p>- TECNICHE NINJUTSU</p><p>Grazie  al  &quot;Qui-Gong&quot; meglio conosciuto dai Ninja come CHAKRA, il pg può compiere dei gesti specifici con le mani, che composti nel modo giusto e pronunciata correttamente il nome della tecnica ad alta voce, porteranno ad abilità innate. Esso e’ il potere che scorre all’interno di ogni essere vivente e grazie a dei movimenti delle mani si puo’ utilizzare come fonte di energia che i Ninja hanno imparato ad imbrigliare in ablita’ uniche. PER ACCUMULARE CHAKRA IL PG DOVRA’ RIMANERE IN CONCENTRAZIONE PER DIVERSO TEMPO. PIU’ CHAKRA SI ACCUMULA E PIU’ FORTI POSSONO ESSERE GLI EFFETTI DELLE ABILITA’ LANCIATE. (E’ POSSIBILE CUMULARE CHAKRA PREVENTIVAMENTE MA ESSO NON RIMARRA’ IMMAGAZZINATA PER SEMPRE, COMINCERA’ GRADUALMENTE A DIMINUIRE FINO AD ARRIVARE ALLA CARICA BASE DEL PG PER LANCIARE LE ABILITA’ NORMALI)</p>","location":"poteri","hidden":false},{"nome":"AZIONE COSTANTE E SLOT","group":"REGOLE DEL NINJA","desc":"<p>- AZIONE COSTANTE, IL PG PUO’ EFFETTUARE DUE AZIONI DURANTE IL SUO TURNO</p><p>- INSERIMENTO SLOT PG</p><p>Il PG usufruirà di 7 slot esclusivamente per ABILITÀ attive, il restante, verrà contrassegnato come TRUCCHETTO. I trucchetti avranno CD proprie ed avranno degli utilizzi limitati nell&#x27;arco della giornata (riposo lungo). I tiri delle abilità verranno effettuati esclusivamente su NINJUTSU una Macro CD 16 che scalerà su DESTREZZA.</p>","location":"poteri","hidden":false},{"nome":"KUSARIGAMA (falcetto con catena lunga)","desc":"<p>particolare arma ninja che ha facoltà di attaccare nemici vicini e lontani (3 caselle). Ogni qualvolta un nemico viene colpito il danno non viene suddiviso come per i classici attacchi ad area bensì verrà conteggiato come attacco singolo, pertanto se le condizioni lo permettono potranno essere attaccati più soggetti allo stesso tempo come se li si stesse attaccando frontalmente. Una volta per scontro è possibile utilizzare una particolare tecnica per effettuare una rotazione del corpo molto elevata che permette di compiere un attacco ad area di 10d6 per nemico nell'area di 5 caselle.</p>","group":"DETTAGLI EQUIPAGGIAMENTO","location":"equip","hidden":false},{"nome":"WAKIZASHI E TANTO (daga luga e una un po' più corta)","desc":"<p>se tutti e tre i colpi dovessero andare a segno il pg maturerebbe un 4° attacco bonus, se questo dovesse andare a buon fine il pg maturerebbe costantemente attacchi bonus fino alla suo fallimento, questo comprende qualsiasi nemico nelle sue possibilità. Ogni attacco Bonus guadagna un +2 sul Tiro per colpire e +1 sui danni che verranno sommati al successivo. Se il Pg dovesse riuscire ad effettuare 6 attacchi totali, ossia 3 normali + 3 Bonus, il 7° attacco gioverebbe di un antichissima tecnica Ninja che veda prendere fuoco le armi e totalizzare un attacco di 10d6(in questo attacco il pg potrà effettuare un Dash di 10 caselle a prescindere dal suo spostamento)</p>","group":"DETTAGLI EQUIPAGGIAMENTO","location":"equip","hidden":false},{"nome":"COTTA D’OMBRA FLESSIBILE","desc":"<p>Questa armatura è realizzata con tessuti sottili ma resistenti, progettata per chi necessita di discrezione e agilità. La cotta sembra assorbire la luce circostante, permettendo a chi la indossa di muoversi con maggiore facilità nelle ombre. Sebbene non offra una protezione massiccia, la sua leggerezza e la sua struttura elastica consentono una buona mobilità e un minimo di resistenza ai danni fisici. La cotta consente a chi la indossa di muoversi più facilmente nelle ombre e nelle aree scarsamente illuminate, conferendo un +2 in situazioni di furtività, la struttura flessibile dell'armatura migliora i movimenti rapidi e leggeri, consentendo a chi la indossa di compiere manovre agili, +1 acrobazie o schivate. La cotta offre una protezione moderata contro i colpi più leggeri, come graffi o frecce, riducendo di poco il danno subito da armi leggere e non perforanti, i danni inferiori a 10 PF avranno grandi possibilità di essere evitati tirando una moneta. La cotta è progettata per ridurre il rumore dei movimenti, ma non garantisce invisibilità totale. Tuttavia, chi la indossa può ottenere una leggera riduzione dei rumori provocati da camminamenti o azioni furtive. + 1 CA</p>","group":"DETTAGLI EQUIPAGGIAMENTO","location":"equip","hidden":false},{"nome":"SANDALI INSONORIZZATI","desc":"<p>questi facenti parte dell'abbigliamento proprio ninja, grazie alla loro conformazione a conca favoriscono di un + 1 tutti i tiri su furtività.</p>","group":"DETTAGLI EQUIPAGGIAMENTO","location":"equip","hidden":false}],"travellerLayoutVersion":6};

// Salva il token in sessionStorage così che, navigando dalla Home a una scheda
// (o da una scheda all'altra) nella stessa scheda del browser, l'accesso a Google
// resti attivo senza doverlo rifare ogni volta.
function saveGoogleTokenToSession(token, expiresInSeconds){
  try{
    sessionStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY, JSON.stringify({
      token: token,
      expiresAt: Date.now() + (Number(expiresInSeconds || 0) * 1000)
    }));
  }catch(e){}
}

function loadGoogleTokenFromSession(){
  try{
    const raw = sessionStorage.getItem(GOOGLE_TOKEN_STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.token || !data.expiresAt) return null;
    if (Date.now() > data.expiresAt - 60000) return null; // margine di sicurezza di 60s
    return data.token;
  }catch(e){ return null; }
}

function initGoogleAuth(){
  if (!googleConfigured()) return;
  const tryInit = ()=>{
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2){
      setTimeout(tryInit, 300);
      return;
    }
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (resp)=>{
        if (resp && resp.access_token){
          googleAccessToken = resp.access_token;
          saveGoogleTokenToSession(resp.access_token, resp.expires_in);
          try{ localStorage.setItem(GOOGLE_EVER_CONNECTED_KEY, "1"); }catch(e){}
          await onGoogleSignedIn();
        }
      },
      error_callback: ()=>{
        // Il tentativo di accesso automatico e silenzioso (senza popup) non è
        // riuscito: nessuna sessione Google attiva nel browser, o consenso non
        // ancora dato. Non facciamo nulla: resta il pulsante "Accedi con Google".
      }
    });
  };
  tryInit();
}

async function onGoogleSignedIn(){
  try{
    const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
      headers: { Authorization: "Bearer " + googleAccessToken }
    });
    const info = res.ok ? await res.json() : null;
    googleUserEmail = (info && info.email) || "";
  }catch(e){ googleUserEmail = ""; }

  driveFileIdKey = driveStorageKey();
  let legacyFileId = null;
  try{ legacyFileId = localStorage.getItem(driveFileIdKey) || null; }catch(e){}
  const isPlayer = isAuthorizedPlayerEmail(googleUserEmail);

  if (isPlayer && legacyFileId && legacyFileId !== DEFAULT_DRIVE_FILE_ID){
    driveFileId = legacyFileId;
    const loadedLegacy = await driveLoad();
    if (loadedLegacy){
      try{
        driveFileId = DEFAULT_DRIVE_FILE_ID;
        await driveUpdate(DEFAULT_DRIVE_FILE_ID);
        try{ localStorage.setItem(driveFileIdKey, DEFAULT_DRIVE_FILE_ID); }catch(e){}
        updateGoogleStatus();
        setStatus("Modifiche precedenti migrate nel file condiviso ✓");
        return;
      }catch(e){
        console.error("Migrazione verso il file condiviso non riuscita:", e);
      }
    }
  }

  driveFileId = DEFAULT_DRIVE_FILE_ID;
  try{ localStorage.setItem(driveFileIdKey, driveFileId); }catch(e){}
  updateGoogleStatus();

  const ok = await driveLoad();
  if (!ok){
    setStatus("Errore collegamento file condiviso Drive");
    return;
  }
}
async function driveFind(){
  const name = suggestedFileName();
  const q = encodeURIComponent(`name='${name}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: "Bearer " + googleAccessToken }
  });
  if (!res.ok){
    const body = await res.text().catch(()=> "");
    console.error("Drive (find) errore " + res.status + ": " + body);
    throw new Error("drive find failed: " + res.status);
  }
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function driveCreate(){
  const name = suggestedFileName();
  const boundary = "-------scheda" + Date.now();
  const metadata = { name, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(STATE)}\r\n` +
    `--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": `multipart/related; boundary=${boundary}` },
    body
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (create) errore " + res.status + ": " + errBody);
    throw new Error("drive create failed: " + res.status);
  }
  const data = await res.json();
  return data.id;
}

async function driveUpdate(fileId){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": "application/json" },
    body: JSON.stringify(STATE)
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (update) errore " + res.status + ": " + errBody);
    const err = new Error("drive update failed: " + res.status);
    err.status = res.status;
    throw err;
  }
}

function deepMerge(base, override){
  if (Array.isArray(base)) return (override && Array.isArray(override)) ? override : base;
  if (typeof base === "object" && base !== null){
    const out = {...base};
    if (override && typeof override === "object"){
      for (const k in override){ out[k] = deepMerge(base[k], override[k]); }
    }
    if (override && override.sheetId && override.travellerLayoutVersion === undefined) out.travellerLayoutVersion = 0;
    return out;
  }
  return (override !== undefined) ? override : base;
}

async function loadState(){
  if (!window.storage || typeof window.storage.get !== "function"){
    STORAGE_AVAILABLE = false;
    STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
    setStorageWarning();
    return;
  }
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if (res && res.value){
      const saved = JSON.parse(res.value);
      STATE = deepMerge(DEFAULT_STATE, saved);
      setStatus("Dati caricati \u2713");
      return;
    }
  }catch(e){ /* nessun dato salvato ancora, va bene cos\u00ec */ }
  STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
  setStatus("Scheda pronta");
}

function queueSave(){
  setStatus("Salvataggio\u2026");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(performSave, 500);
}

function flushSave(){
  clearTimeout(saveTimer);
  performSave();
}

async function performSave(){
  let wroteSomething = false;
  let cloudFailed = false;

  if (STORAGE_AVAILABLE){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
      wroteSomething = true;
    }catch(e){ cloudFailed = true; }
  }

  if (localFileHandle){
    const ok = await writeLocalFile();
    if (ok) wroteSomething = true;
  }

  let driveOk = false;
  let driveAttempted = false;
  if (googleAccessToken){
    driveAttempted = true;
    driveOk = await driveSave();
    if (driveOk) wroteSomething = true;
  }

  const t = new Date();
  const stamp = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  if (wroteSomething){
    lastSaveOk = true;
    clearStorageWarning();
    const extras = [localFileHandle ? "file locale" : null, driveOk ? "Drive" : null].filter(Boolean).join(" + ");
    setStatus("Salvato \u2713 " + stamp + (extras ? " (" + extras + ")" : ""));
  } else if (cloudFailed){
    lastSaveOk = false;
    setStatus("Errore di salvataggio \u2014 usa \u2018Esporta backup\u2019");
  } else if (driveAttempted && !driveOk){
    lastSaveOk = false;
    setStatus("Errore di salvataggio su Drive \u2014 controlla la console (F12) o usa \u2018Esporta backup\u2019");
  } else {
    setStatus("Non salvato automaticamente \u2014 collega un file locale, Google Drive, o esporta il backup");
  }
}

/* ============================================================
   FILE LOCALE (es. dentro una cartella sincronizzata con Google Drive)
   Usa la File System Access API del browser (Chrome / Edge):
   una volta collegato un file, ogni salvataggio automatico lo
   sovrascrive direttamente — se quel file vive in una cartella
   sincronizzata da Google Drive Desktop, finisce su Drive da solo,
   senza bisogno di scaricare backup manualmente ogni volta.
   ============================================================ */
function localFSSupported(){
  return typeof window.showSaveFilePicker === "function" && typeof window.showOpenFilePicker === "function";
}

function suggestedFileName(){
  const safe = (STATE.nome || "personaggio").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "personaggio";
  return "scheda-" + safe + ".json";
}

async function connectNewLocalFile(){
  if (!localFSSupported()){
    window.alert("Questa funzione richiede Chrome o Edge (su computer). Puoi comunque usare \u2018Esporta backup\u2019 e salvare tu il file dentro la cartella di Google Drive.");
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: suggestedFileName(),
      types: [{ description: "Backup scheda (JSON)", accept: {"application/json": [".json"]} }]
    });
    localFileHandle = handle;
    await writeLocalFile();
    updateLocalFileStatus();
    clearStorageWarning();
    setStatus("File locale collegato \u2713");
  }catch(e){
    if (!e || e.name !== "AbortError") window.alert("Non sono riuscito a collegare il file.");
  }
}

async function openExistingLocalFile(){
  if (!localFSSupported()){
    window.alert("Questa funzione richiede Chrome o Edge (su computer). Puoi comunque usare \u2018Importa scheda\u2019 per caricare un backup.");
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "Backup scheda (JSON)", accept: {"application/json": [".json"]} }],
      multiple: false
    });
    const file = await handle.getFile();
    const text = await file.text();
    let parsed;
    try{ parsed = JSON.parse(text); }
    catch(err){ window.alert("Il file scelto non \u00e8 un backup valido."); return; }
    const ok = window.confirm("Caricare questa scheda e collegarla per il salvataggio automatico?\nLa scheda attuale verr\u00e0 sostituita.");
    if (!ok) return;
    STATE = deepMerge(BLANK_STATE, parsed);
    localFileHandle = handle;
    renderAll();
    updateLocalFileStatus();
    queueSave();
  }catch(e){
    if (!e || e.name !== "AbortError") window.alert("Non sono riuscito ad aprire il file scelto.");
  }
}

async function writeLocalFile(){
  if (!localFileHandle) return false;
  try{
    const perm = await localFileHandle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted") return false;
    const writable = await localFileHandle.createWritable();
    await writable.write(JSON.stringify(STATE, null, 2));
    await writable.close();
    return true;
  }catch(e){ return false; }
}

function updateLocalFileStatus(){
  const el = document.getElementById("local-file-status");

  el.textContent = localFileHandle ? ("\ud83d\udd17 " + (localFileHandle.name || "file locale")) : "";

   altrimenti il calcolo automatico dal punteggio. Permette all'utente di sostituire
   un valore calcolato senza che il ricalcolo automatico lo sovrascriva. */

/* ============================================================
   IMMAGINI OGGETTI (compresse in dataURL, salvate nello stato)
   ============================================================ */
function fileToCompressedDataURL(file, maxDim, quality, cb){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim / Math.max(w,h));
      w = Math.max(1, Math.round(w*scale));
      h = Math.max(1, Math.round(h*scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = ()=>{ setStatus("Immagine non valida"); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function openImageLightbox(src, label){
  const lb = document.getElementById("img-lightbox");
  const img = document.getElementById("img-lightbox-img");
  const cap = document.getElementById("img-lightbox-caption");
  if (!lb || !img || !src) return;
  img.src = src;
  if (cap){
    if (label){ cap.textContent = label; cap.hidden = false; }
    else { cap.textContent = ""; cap.hidden = true; }
  }
  lb.hidden = false;
  requestAnimationFrame(()=> lb.classList.add("show"));
}
function closeImageLightbox(){
  const lb = document.getElementById("img-lightbox");
  const img = document.getElementById("img-lightbox-img");
  if (!lb) return;
  lb.classList.remove("show");
  lb.hidden = true;
  if (img) img.src = "";
}
function initImageLightbox(){
  const lb = document.getElementById("img-lightbox");
  if (!lb) return;
  const backdrop = document.getElementById("img-lightbox-backdrop");
  const closeBtn = document.getElementById("img-lightbox-close");
  if (backdrop) backdrop.addEventListener("click", closeImageLightbox);
  if (closeBtn) closeBtn.addEventListener("click", closeImageLightbox);
  document.addEventListener("keydown", (e)=>{ if (e.key === "Escape" && !lb.hidden) closeImageLightbox(); });
}

/* allowZoom: aggiunge un pulsante di ingrandimento (modal) accanto alla miniatura.
   Usato solo per le immagini dell'Equipaggiamento, non per l'Inventario. */
function makeImagePicker(currentSrc, onPick, onRemove, allowZoom, zoomLabel, readOnly){
  const wrap = document.createElement("div");
  wrap.className = "img-row";

  const thumb = document.createElement(currentSrc ? "img" : "div");
  if (currentSrc){ thumb.src = currentSrc; thumb.className = "thumb"; }
  else { thumb.className = "thumb-placeholder"; }

  if (readOnly){
    /* Player read-only (equip/inventario): solo visualizzazione. Nessun
       modo di aggiungere, cambiare o rimuovere l'immagine. Se c'è
       un'immagine, il clic sulla miniatura apre il lightbox; altrimenti
       un placeholder neutro senza alcuna interattività. */
    if (currentSrc){
      thumb.title = "Clic per ingrandire";
      thumb.addEventListener("click", ()=> openImageLightbox(currentSrc, zoomLabel));
    } else {
      thumb.title = "Nessuna immagine";
    }
    wrap.appendChild(thumb);
    return wrap;
  }

  if (currentSrc){ thumb.title = "Clic per cambiare immagine"; }
  else { thumb.textContent = "+"; thumb.title = "Aggiungi immagine"; }

  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.className = "file-input-hidden";
  input.addEventListener("change", ()=>{
    const f = input.files && input.files[0];
    if (f) fileToCompressedDataURL(f, 320, 0.72, (dataUrl)=>{ onPick(dataUrl); });
  });

  thumb.addEventListener("click", ()=> input.click());

  wrap.appendChild(thumb);
  wrap.appendChild(input);

  const label = document.createElement("span");
  label.className = "file-btn";
  label.textContent = currentSrc ? "Cambia immagine" : "Aggiungi immagine";
  label.addEventListener("click", ()=> input.click());
  wrap.appendChild(label);

  if (currentSrc && allowZoom){
    const zoom = document.createElement("button");
    zoom.className = "img-zoom"; zoom.type="button"; zoom.textContent = "\u26f6"; zoom.title="Ingrandisci immagine";
    zoom.addEventListener("click", (ev)=>{ ev.stopPropagation(); openImageLightbox(currentSrc, zoomLabel); });
    wrap.appendChild(zoom);
  }

  if (currentSrc){
    const rm = document.createElement("button");
    rm.className = "img-remove"; rm.type="button"; rm.textContent = "\u2715"; rm.title="Rimuovi immagine";
    rm.addEventListener("click", (ev)=>{ ev.stopPropagation(); onRemove(); });
    wrap.appendChild(rm);
  }
  return wrap;
}

    pips.push(`<button class="caos-pip ${i<=STATE.livelloCaos?'on':''}" data-caos-pip="${i}" title="Livello ${i}"></button>`);

  const letterEls = letters.map((l,i)=>`<span class="caos-letter ${STATE.livelloCaos>i?'lit':''}">${l}</span>`).join("");
  const flameOn = STATE.livelloCaos >= STATE.livelloCaosMax;
  return `
    <div class="caos-tracker">
      <div class="caos-col">
        <div class="caos-pips">${pips.join("")}</div>
        <div class="caos-label">Livello di Caos (${STATE.livelloCaos}/${STATE.livelloCaosMax})</div>
      </div>
      <div class="caos-word">${letterEls}</div>
      <span class="caos-flame ${flameOn?'on':''}">\ud83d\udd25</span>
    </div>`;
}

function bindCaosTracker(){
  document.querySelectorAll('[data-caos-pip]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const n = parseInt(btn.dataset.caosPip, 10);
      STATE.livelloCaos = (STATE.livelloCaos === n) ? n - 1 : n;
      const panel = document.getElementById("panel-scheda");
      if (panel){
        const holder = panel.querySelector(".caos-tracker");
        if (holder) holder.outerHTML = renderCaosTracker();
        bindCaosTracker();
      }
      queueSave();
    });
  });
}

function renderScheda(){
  const masterOn = isMasterEditorOn();
  const abilNames = {FOR:"Forza", DES:"Destrezza", COS:"Costituzione", INT:"Intelligenza", SAG:"Saggezza", CAR:"Carisma"};

  const saveRows = Object.keys(STATE.saves).map(k=>`
