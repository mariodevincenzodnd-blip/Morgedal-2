  }
  .hero.dragging{cursor:grabbing;}
  .hero-zoom-btn{
    background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.25);
    color:rgba(237,227,208,0.9);width:18px;height:18px;line-height:16px;
    border-radius:50%;font-size:12px;cursor:pointer;padding:0;margin:0 1px;
    font-family:var(--mono);vertical-align:middle;
  }
  .hero-zoom-btn:hover{background:rgba(0,0,0,0.7);}
  #hero-zoom-label{font-family:var(--mono);font-size:10px;margin:0 3px;vertical-align:middle;}
  .hero-hint{
    position:absolute;top:12px;right:16px;font-size:10px;letter-spacing:.4px;
    color:rgba(237,227,208,0.8);background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);
    padding:4px 11px;border-radius:12px;transition:opacity .2s;opacity:0.55;z-index:2;
  }
  .hero:hover .hero-hint{opacity:1;}

  .hero::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, var(--identity), var(--identity2));z-index:2;
  }
  .hero-inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .hero-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(38px,6vw,64px);
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-bright);
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    margin:0;
  }
  .hero-sub{font-family:var(--serif);font-style:italic;color:var(--text-dim);font-size:15px;margin-top:6px;}
  .hero-meta{display:flex;gap:10px;flex-wrap:wrap;}
  .hero-chip{
    background:rgba(20,16,14,0.65);
    border:1px solid var(--border);
    border-radius:20px;
    padding:6px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    backdrop-filter: blur(2px);
  }
  .hero-chip b{color:var(--gold-bright);font-weight:600;}
  .tipo-label{opacity:.65;font-size:11px;letter-spacing:.5px;}
  .hero-chip-tipo{border-color:var(--identity);}
  .hero-chip-tipo b{color:var(--identity);}
  .hero-chip-id{display:flex;flex-direction:column;gap:1px;padding:5px 14px 6px;}
  .hero-chip-label{
    font-size:8px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-faint);font-weight:600;line-height:1.3;
  }
  .quicknav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;}
  .quicknav-pill{
    display:inline-flex;align-items:center;gap:5px;
    background:color-mix(in srgb, var(--identity) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--identity) 45%, transparent);
    border-radius:14px;padding:4px 12px;font-size:12px;color:var(--identity);
    cursor:pointer;transition:background .15s,color .15s;
  }
  .quicknav-pill:hover{background:color-mix(in srgb, var(--identity) 25%, transparent);color:var(--gold-bright);}
  .quicknav-pill::before{content:"\2197";font-size:11px;}
  @keyframes anchorFlash{0%,100%{box-shadow:none;}30%{box-shadow:0 0 0 3px var(--gold);}}
  .anchor-flash{animation:anchorFlash 1.4s ease;}
  .editable-name{
    background:transparent;border:none;color:var(--gold-bright);font-family:var(--serif);
    font-weight:700;font-size:64px;letter-spacing:2px;text-transform:uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    border-bottom:1px dashed transparent; padding:0; width:100%; max-width:100%;
    white-space:nowrap; overflow:hidden;
  }
  @media (max-width:720px){ .editable-name{ font-size:38px; } }
  .editable-name:hover, .editable-name:focus{border-bottom:1px dashed var(--gold); outline:none;}

  /* ---------- TABS ---------- */
  .tabbar{
    position:sticky;top:0;z-index:50;
    background:rgba(15,13,12,0.94);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    white-space:nowrap;
  }
  .tabbar-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 16px;}
  .tab-btn{
    background:none;border:none;color:var(--text-dim);
    font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:0.4px;
    padding:14px 16px;cursor:pointer;border-bottom:2px solid transparent;
    text-transform:uppercase;transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-bright);border-bottom:2px solid var(--gold);}
  .dot-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--identity);margin-left:6px;filter:drop-shadow(0 0 4px var(--identity));animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---------- CARDS / GRID ---------- */
  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:1.6px;
    color:var(--gold);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .card h2 small{font-family:var(--sans);text-transform:none;letter-spacing:0;color:var(--text-faint);font-size:11px;}
  .grid{display:grid;gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  @media (max-width:820px){.grid-4,.grid-3,.grid-6{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.grid-4,.grid-3,.grid-2,.grid-6{grid-template-columns:1fr 1fr;}}
  @media (max-width:700px){.grid-2{grid-template-columns:1fr;}}
  @media (max-width:520px){#equip-slots-grid{grid-template-columns:1fr;}}
  @media (max-width:480px){.grid-3{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-faint);}
  .field input[type=text], .field input[type=number], select, textarea{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%;
  }
  .field input:focus, textarea:focus, select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  textarea{resize:vertical;font-family:var(--sans);line-height:1.55;}

  /* ---------- ABILITY SCORES ---------- */
  .abil-box{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:14px;text-align:center;position:relative;
  }
  .abil-box .name{font-size:11px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .abil-box input[type=number]{
    width:64px;text-align:center;font-size:20px;font-weight:700;font-family:var(--mono);
    background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);
    margin:8px auto 6px;padding:4px 0;
  }
  .abil-box .mod{
    font-family:var(--mono);font-size:22px;color:var(--gold-bright);font-weight:700;
    width:60px;text-align:center;background:transparent;border:1px solid transparent;
    border-radius:6px;padding:2px 0;margin:0 auto;display:block;
  }
  .abil-box .mod:hover{border-color:var(--border-soft);}
  .abil-box .mod:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  .abil-box .mod.is-override{color:var(--text);border-color:var(--gold);background:var(--bg-panel-3);}
  .abil-box.rust .mod.is-override{color:#ff8a6a;border-color:#ff8a6a;}
  .abil-box.rust{border-color:rgba(255,138,106,0.4);}
  .abil-box.rust .name{color:#ff8a6a;}
  .abil-box.rust .mod{color:#ff8a6a;}
  .abil-box.rust input[type=number]{border-color:rgba(255,138,106,0.3);}

  /* ---------- STAT PILLS ---------- */
  .statpill{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px;text-align:center;}
  .statpill label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);margin-bottom:6px;}
  .statpill input{width:100%;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;background:transparent;border:none;color:var(--gold-bright);}
  .statpill input:focus{outline:none;}
  .statpill.dual{display:flex;flex-direction:column;gap:6px;}
  .statpill.dual .dual-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .statpill.dual .dual-row span{font-size:9.5px;text-transform:uppercase;color:var(--text-faint);width:38px;text-align:left;}
  .statpill.dual .dual-row span.rust-tag{color:#ff8a6a;}
  .statpill.dual input{font-size:16px;text-align:right;}

  .rust-banner{
    display:flex;align-items:center;gap:8px;background:linear-gradient(90deg, rgba(201,70,59,0.12), transparent);
    border:1px solid rgba(255,138,106,0.35);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:#ffb3a0;
  }
  .rust-banner b{color:#ff8a6a;}

  /* ---------- HP ---------- */
  .hp-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .hp-track{flex:1;min-width:220px;height:22px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;position:relative;}
  .hp-fill{height:100%;background:linear-gradient(90deg,#7a2a24,var(--bad));transition:width .3s;}
  .hp-numbers{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:15px;}
  .hp-numbers input{width:64px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);border-radius:6px;padding:6px 2px;}
  .hp-row-temp{margin-top:6px;}
  .hp-track-temp{height:14px;}
  .hp-fill-temp{height:100%;background:linear-gradient(90deg,#8a5a1f,var(--amber));transition:width .3s;}
  .btn{
    background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.3px;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn.primary{background:linear-gradient(180deg, #3a2a12, #241a0c);border-color:var(--gold);color:var(--gold-bright);}
  .btn.small{padding:4px 9px;font-size:11px;}
  .btn.danger:hover{border-color:var(--bad);color:#ff9d90;}

  /* ---------- SKILL LIST ---------- */
  .skill-row{display:grid;grid-template-columns:1fr 46px 60px;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border-soft);}
  .skill-row:last-child{border-bottom:none;}
  .skill-name{font-size:13.5px;}
  .skill-abbr{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);text-align:center;background:var(--bg-panel-3);border-radius:5px;padding:3px 0;}
  .skill-row input[type=number]{width:100%;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:6px;padding:5px 0;font-family:var(--mono);font-weight:700;}

  /* ---------- SAVES ---------- */
  .save-row{display:grid;grid-template-columns:26px 1fr 60px;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--border-soft);}
  .save-row:last-child{border-bottom:none;}
  .save-row .modbadge{font-family:var(--mono);text-align:center;color:var(--gold-bright);font-weight:700;background:var(--bg-panel-3);border-radius:6px;padding:5px 0;}
  .save-row input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;}

  /* ---------- PIPS / TRACKERS ---------- */
  .tracker{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .tracker:last-child{border-bottom:none;}
  .tracker .t-name{font-size:13.5px;font-weight:600;color:var(--text);min-width:190px;}
  .tracker .t-desc{font-size:11.5px;color:var(--text-faint);flex:1;min-width:160px;}
  .pips{display:flex;gap:6px;}
  .pip{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);
    cursor:pointer;background:transparent;transition:background .15s, box-shadow .15s;
  }
  .pip.used{background:radial-gradient(circle at 35% 30%, var(--violet), var(--violet-dim));box-shadow:0 0 8px rgba(148,80,216,0.8);border-color:var(--violet);}
  .pip.death{border-color:var(--bad);}
  .pip.death.death-success{border-color:var(--good);}
  .pip.death.death-success.used{background:radial-gradient(circle at 35% 30%, #8fc97e, var(--good));box-shadow:0 0 8px rgba(111,154,99,0.7);border-color:var(--good);}
  .pip.death.death-fail.used{background:radial-gradient(circle at 35% 30%, #e0685a, var(--bad));box-shadow:0 0 8px rgba(224,104,90,0.7);border-color:var(--bad);}
  .pip.fail{border-color:var(--text-faint);}

  /* ---------- SLOTS ---------- */
  .slot-lvl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .slot-lvl:last-child{border-bottom:none;}
  .slot-lvl .lvl-badge{font-family:var(--serif);font-weight:700;color:var(--gold-bright);width:78px;font-size:13px;}
  .slot-lvl input.maxslot{width:42px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-faint);border-radius:5px;font-size:11px;padding:3px 0;}

  /* ---------- RICH TEXT ---------- */
  .rich{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;
    padding:12px 14px;font-size:14px;line-height:1.65;color:var(--text);
  }
  .rich:focus{outline:none;border-color:var(--gold);}
  .rich b, .rich strong{color:var(--gold-bright);}
  /* Editor Master: consente di ridimensionare verticalmente (drag dell'angolo in basso
     a destra) i riquadri di testo modificabili, sullo stesso principio già usato per le
     Note. Attivo solo quando l'Editor Master è acceso (classe su <body>), quindi mai
     visibile o utilizzabile in modalità giocatore. */
  body.master-editor-on .rich[contenteditable]{
    resize:vertical;overflow:auto;min-height:60px;
  }
  body.master-editor-on .inv-item-desc{
    /* niente overflow:auto qui: la descrizione non deve mai avere uno
       scroll interno. Il Master pu\u00f2 comunque ingrandirla manualmente
       (resize:vertical); se prova a ridurla sotto l'altezza del contenuto,
       il listener ResizeObserver in renderInvTable() la fa risnappare. */
    resize:vertical;overflow:hidden;min-height:44px;
  }
  /* Blocco 1: in Editor Master ogni riquadro/tabella (non solo l'inventario)
     deve potersi ridimensionare verticalmente, con lo stesso comportamento
     già usato per le Note: resize manuale dall'angolo in basso a destra. */
  body.master-editor-on .subcard,
  body.master-editor-on .tracker,
  body.master-editor-on textarea{
    resize:vertical;overflow:auto;
  }
  body.master-editor-on .subcard{min-height:80px;}
  body.master-editor-on .tracker{min-height:56px;}
  .subcard{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .subcard h3{margin:0 0 8px;font-family:var(--serif);font-size:14.5px;color:var(--gold-bright);letter-spacing:.4px;}
  .subcard .tag{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);background:rgba(255,255,255,0.05);border:1px solid var(--border-soft);border-radius:10px;padding:2px 9px;margin-bottom:8px;}
  .subcard .tag.tag-passiva{color:var(--amber);background:rgba(224,138,58,0.14);border-color:var(--amber-dim);}
  .subcard .tag.tag-truccetto{color:var(--blue);background:rgba(79,143,214,0.12);border-color:var(--blue-dim);}
  .subcard .tag.tag-abilita{color:var(--red-glow);background:rgba(201,70,59,0.14);border-color:rgba(201,70,59,0.45);}
  .subcard .tag.tag-incantesimo{color:var(--violet);background:rgba(148,80,216,0.12);border-color:var(--violet-dim);}
  .subcard .tag.tag-ambito{color:var(--teal);background:rgba(47,184,172,0.14);border-color:var(--teal-dim);}
  .subcard .tag.tag-campo{color:var(--good);background:rgba(111,154,99,0.14);border-color:rgba(111,154,99,0.45);}
  .subcard-grouped{grid-column:1/-1;}
  .subcard-subsection{padding-top:10px;margin-top:10px;border-top:1px dashed var(--border-soft);}
  .subcard-subsection:first-of-type{border-top:none;margin-top:6px;padding-top:0;}
  .subcard-subsection h4{margin:0 0 4px;font-size:13.5px;color:var(--gold-bright);font-family:var(--serif);}

  /* ---------- MASTER EDITOR (visibile solo in modalità Editor Master) ---------- */
  .master-toolbar{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-bottom:8px;padding:4px 6px;border-radius:6px;
    background:rgba(148,80,216,0.08);border:1px dashed var(--violet-dim);
  }
  .master-cat-select, .master-box-width{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:5px;font-size:10px;padding:2px 4px;max-width:120px;
  }
  .master-mini-btn, .master-mini-del{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:5px;font-size:11px;padding:2px 7px;cursor:pointer;line-height:1.3;
  }
  .master-mini-btn:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  .master-mini-del{color:var(--bad);}
  .master-mini-del:hover{border-color:var(--bad);}
  .master-eye-btn.is-hidden{color:var(--bad);border-color:rgba(176,74,63,0.5);}
  .master-hidden-item{opacity:0.55;border-style:dashed;}
  .master-add-btn{margin-top:8px;}
  .master-name-input{
    display:block;width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border-soft);
    color:var(--gold-bright);font-family:var(--serif);font-size:14.5px;letter-spacing:.4px;
    margin:0 0 8px;padding:0 0 4px;
  }
  .master-name-input:focus{outline:none;border-color:var(--gold-bright);}
  .master-tag-input, .master-uso-input{
    display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;
    background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:10px;padding:2px 9px;margin-bottom:8px;width:auto;max-width:220px;
  }
  [data-master-field][contenteditable="true"]{border-radius:4px;}
  [data-master-field][contenteditable="true"]:focus{outline:1px dashed var(--violet-dim);}
  .home-link{
    position:fixed;top:14px;left:16px;z-index:60;
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    text-decoration:none;white-space:nowrap;transition:border-color .15s, color .15s;
  }
  .home-link:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  @media (max-width:760px){
    .home-link{position:static;display:inline-flex;margin:0 0 10px;}
  }

  .master-editor-toggle{
    display:none;position:fixed;bottom:14px;left:16px;z-index:60;
    align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;white-space:nowrap;
  }
  .master-editor-toggle.show{display:flex;}
  .master-editor-toggle:hover{border-color:var(--gold-bright);}
  .master-editor-toggle.on{background:rgba(148,80,216,0.18);color:var(--violet);border-color:var(--violet);}
  @media (max-width:760px){
    .master-editor-toggle{position:static;margin:0 0 10px;}
  }

  .master-color-picker{
    display:none;position:fixed;bottom:60px;left:16px;z-index:60;
    align-items:center;gap:8px;padding:6px 12px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    white-space:nowrap;
  }
  .master-color-picker.show{display:flex;}
  .master-color-picker input[type=color]{
    width:30px;height:22px;border:none;border-radius:6px;padding:0;
    background:none;cursor:pointer;
  }
  @media (max-width:760px){
    .master-color-picker{position:static;margin:0 0 10px;}
  }

  /* ---------- EVOLUZIONI FUTURE (pannelli richiudibili) ---------- */
  .evo-note{font-size:12.5px;color:var(--text-faint);margin:-6px 0 14px;line-height:1.5;}
  .evo-level{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .evo-level:last-child{margin-bottom:0;}
  .evo-level summary{
    cursor:pointer;padding:13px 16px;font-family:var(--serif);font-weight:700;
    color:var(--gold-bright);letter-spacing:.4px;list-style:none;display:flex;align-items:center;gap:8px;
  }
  .evo-level summary::-webkit-details-marker{display:none;}
  .evo-level summary::before{content:"\25B8";color:var(--gold);transition:transform .15s;}
  .evo-level[open] summary::before{transform:rotate(90deg);}
  .evo-level summary:hover{color:var(--gold);}
  .evo-content{padding:0 16px 16px 16px;border-top:1px solid var(--border-soft);padding-top:12px;}
  .evo-content p{margin:0 0 10px;}
  .evo-content p:last-child{margin-bottom:0;}

  /* ---------- EQUIP GRID ---------- */
  .equip-slot{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .equip-slot label{display:block;font-size:10px;text-transform:uppercase;color:var(--text-faint);letter-spacing:1px;margin-bottom:4px;}
  .equip-slot input{width:100%;background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:14px;}
  .equip-slot input:focus{outline:none;}
  .img-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .thumb{width:42px;height:42px;border-radius:7px;object-fit:cover;border:1px solid var(--border-soft);background:var(--bg-panel-3);cursor:pointer;}
  .thumb-placeholder{width:42px;height:42px;border-radius:7px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:17px;background:var(--bg-panel-3);cursor:pointer;flex-shrink:0;}
  .thumb-placeholder:hover, .thumb:hover{border-color:var(--gold);}
  /* Miniature Equipaggiamento: più grandi rispetto a quelle dell'Inventario */
  #equip-slots-grid .img-row{flex-wrap:wrap;gap:10px;}
  #equip-slots-grid .thumb, #equip-slots-grid .thumb-placeholder{width:96px;height:96px;border-radius:10px;}
  #equip-slots-grid .thumb-placeholder{font-size:30px;}
  .file-btn{font-size:10.5px;color:var(--text-dim);cursor:pointer;border:1px solid var(--border-soft);border-radius:6px;padding:4px 8px;background:var(--bg-panel-2);white-space:nowrap;}
  .file-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .file-input-hidden{display:none;}
  .img-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;}
  .img-remove:hover{color:var(--bad);}

  /* ---------- INGRANDIMENTO IMMAGINE (solo Equipaggiamento) ---------- */
  .img-zoom{
    background:none;border:1px solid var(--border-soft);border-radius:6px;color:var(--text-faint);
    cursor:pointer;font-size:13px;width:24px;height:24px;line-height:1;flex-shrink:0;
  }
  .img-zoom:hover{border-color:var(--gold);color:var(--gold-bright);}
  .img-lightbox{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;}
  .img-lightbox[hidden]{display:none;}
  .img-lightbox-backdrop{position:absolute;inset:0;background:rgba(10,8,7,0.95);backdrop-filter:blur(4px);}
  .img-lightbox-content{
    position:relative;width:100%;height:100%;max-width:min(98vw,2200px);max-height:97vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transform:scale(.96);opacity:0;transition:transform .16s ease,opacity .16s ease;
  }
  .img-lightbox.show .img-lightbox-content{transform:scale(1);opacity:1;}
  .img-lightbox-content img{display:block;max-width:100%;max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:12px;border:1px solid var(--border-soft);box-shadow:0 16px 60px rgba(0,0,0,0.6);}
  .img-lightbox-caption{color:var(--gold-bright);font-size:15px;font-weight:600;text-align:center;}
  .img-lightbox-caption[hidden]{display:none;}
  .img-lightbox-close{
    position:absolute;top:-16px;right:-16px;width:42px;height:42px;border-radius:50%;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    font-size:24px;line-height:1;cursor:pointer;
  }
  .img-lightbox-close:hover{border-color:var(--gold);color:var(--gold-bright);}
  @media (max-width:720px){
    .img-lightbox{padding:8px;}
    .img-lightbox-content{max-width:100vw;max-height:100vh;gap:10px;}
    .img-lightbox-content img{max-height:calc(100vh - 70px);}
    .img-lightbox-close{top:-13px;right:2px;width:38px;height:38px;font-size:22px;}
  }

  /* ---------- INVENTORY ---------- */
  .inv-cap{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .inv-bar{flex:1;min-width:200px;height:16px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;}
  .inv-bar-fill{height:100%;transition:width .3s, background .3s;}
  /* Elenco Inventario: card verticali, ordine Nome -> Descrizione -> Peso.
     La descrizione non ha altezza fissa né scroll interno: si espande col contenuto. */
  .inv-list{display:flex;flex-direction:column;gap:10px;}
  .inv-item{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .inv-item-top{display:flex;align-items:center;gap:10px;}
  .inv-item input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;}
  .inv-item .imgcell{flex-shrink:0;}
  .inv-item-name{background:transparent;border:none;color:var(--text);font-weight:600;font-size:14px;flex:1;min-width:0;}
  .inv-item-name:focus, .inv-item-desc:focus{outline:none;background:var(--bg-panel-3);border-radius:4px;}
  .inv-item-desc{
    display:block;width:100%;box-sizing:border-box;margin-top:8px;
    background:transparent;border:none;color:var(--text-dim);font-size:13px;font-family:var(--sans);
    line-height:1.5;resize:none;overflow:hidden;min-height:22px;padding:4px 2px;
  }
  .inv-item-peso{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
  .inv-item-peso label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);}
  .inv-item-peso input[type=number]{width:52px;background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:5px;text-align:center;font-family:var(--mono);}
  .inv-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;flex-shrink:0;}
  .inv-remove:hover{color:var(--bad);}

  /* ---------- PORTRAITS ---------- */
  .portraits{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){.portraits{grid-template-columns:1fr;}}
  .portrait{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-soft);}
  /* Il resize verticale nativo (angolo in basso a destra) \u00e8 disponibile
     solo in Editor Master: solo il Master controlla la dimensione del
     riquadro, il giocatore controlla solo immagine e didascalia. */
  body.master-editor-on .portrait{resize:vertical;}
  .portrait img{width:100%;display:block;filter:saturate(1.05) contrast(1.03);cursor:pointer;}
  /* Quando il riquadro ha un'altezza personalizzata (persistita dal
     Master), l'immagine usa object-fit:cover per non deformarsi mai. */
  .portrait.has-h img{height:100%;object-fit:cover;}
  .portrait .cap{
    position:absolute;bottom:0;left:0;right:0;padding:10px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
    font-family:var(--serif);letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:var(--gold-bright);
    border:none;outline:none;width:100%;box-sizing:border-box;
  }
  .portrait .cap:focus{background:linear-gradient(0deg, rgba(0,0,0,0.92), rgba(0,0,0,0.35));}

  /* ---------- NOTES ---------- */
  .note-entry{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .note-entry .note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .note-entry input[type=text]{background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:13px;width:70%;}
  .note-entry input[type=text]:focus{outline:none;}
  .note-entry textarea{background:transparent;border:none;color:var(--text);width:100%;min-height:70px;font-size:13.5px;}
  .note-entry textarea:focus{outline:none;}
  .note-date{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}

  .savebar{
    position:static;margin:28px 0 40px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    max-width:min(94vw, 620px);justify-content:flex-end;
    font-size:11px;color:var(--text-faint);
    background:rgba(20,16,14,0.9);border:1px solid var(--border-soft);border-radius:16px;
    padding:8px 10px;
  }
  .savebar b{color:var(--gold-bright);}
  .savebar .btn{padding:5px 11px;font-size:10.5px;border-radius:14px;}
  .savebar .sep{width:1px;height:16px;background:var(--border-soft);}
  .savebar.warn{border-color:var(--bad);}
  .savebar-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--gold-bright);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;flex-shrink:0;white-space:nowrap;
  }
  .savebar-toggle:hover{border-color:var(--gold-bright);}
  .savebar.collapsed{padding:6px 8px;gap:0;}
  .savebar.collapsed .savebar-content{display:none;}

  /* Su smartphone il riquadro comandi non deve restare "fixed" sopra i contenuti
     durante lo scroll: torna nel normale flusso della pagina, in fondo alla scheda. */
  @media (max-width:768px){
    body{ padding-bottom:0; }
    .savebar{
      position:static;
      bottom:auto; right:auto; left:auto; top:auto;
      width:auto; max-width:none;
      margin:24px 20px 20px;
      justify-content:center;
      backdrop-filter:none;
    }
  }
  .savebar #savebar-status.warn-text{color:#ff9d90;font-weight:600;}
  @media (max-width:760px){
    .pip{width:28px;height:28px;}
    .pips{gap:8px;}
    .btn{padding:10px 14px;font-size:13px;}
    .btn.small{padding:8px 12px;}
    .tab-btn{padding:14px 15px;}
  }
  #btn-print{background:linear-gradient(180deg, #22301f, #182013);border-color:var(--good);}
  #btn-print:hover{color:#b9e0ac;}

  .divider-label{font-family:var(--serif);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);margin:22px 0 8px;text-align:center;position:relative;}
  .divider-label::before,.divider-label::after{content:"";position:absolute;top:50%;width:38%;height:1px;background:var(--border);}
  .divider-label::before{left:0;}
  .divider-label::after{right:0;}

  /* ---------- SCHERMATA DI ACCESSO ---------- */
  #lock-screen{
    position:fixed;inset:0;z-index:9999;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.12), transparent 60%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .lock-box{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);border-radius:12px;
    padding:32px 30px;max-width:340px;width:100%;text-align:center;
  }
  .lock-box h2{
    font-family:var(--serif);color:var(--gold-bright);text-transform:uppercase;letter-spacing:1.6px;
    font-size:20px;margin:0 0 8px;
  }
  .lock-box p{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
  .lock-box input[type=password]{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:10px 12px;font-size:14px;width:100%;text-align:center;margin-bottom:12px;
  }
  .lock-box input:focus{outline:none;border-color:var(--gold);}
  .lock-box button{
    background:linear-gradient(180deg, #3a2a12, #241a0c);border:1px solid var(--gold);color:var(--gold-bright);
    border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;width:100%;
  }
  .lock-box button:hover{opacity:0.9;}
  .lock-error{color:#ff9d90;font-size:12px;margin-top:10px;min-height:14px;}

  /* ---------- STAMPA PULITA ---------- */
  @media print{
    @page{ margin:10mm; }
    body{ background:#fff !important; color:#111 !important; padding-bottom:0 !important; font-size:11px !important; }
    .tabbar, .savebar, .hero-hint, #hero-image-input, #import-input,
    .thumb, .thumb-placeholder, .file-btn, .img-remove, .img-row, .img-zoom, #img-lightbox,
    .inv-remove, #inv-add, #reset-slots, #reset-risorse, #lock-screen{ display:none !important; }
    .wrap{ padding:12px 0 !important; max-width:100% !important; }
    .hero{
      background:none !important; padding:2px 0 8px !important; border-bottom:2px solid #111 !important;
      cursor:default !important;
    }
    .hero::before{ display:none !important; }
    .hero-inner{ align-items:baseline !important; gap:8px !important; }
    .editable-name{ color:#000 !important; text-shadow:none !important; border:none !important; font-size:26px !important; }
    .hero-sub{ color:#444 !important; font-size:11px !important; margin-top:2px !important; }
    .hero-chip{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; backdrop-filter:none !important; padding:2px 9px !important; font-size:10.5px !important; }
    .hero-chip b{ color:#000 !important; }
    .hero-meta{ gap:6px !important; }

    .panel{ display:block !important; }
    .card, .subcard{
      background:#fff !important; border:1px solid #999 !important; box-shadow:none !important;
      page-break-inside:avoid; break-inside:avoid;
      padding:8px 10px !important; margin-bottom:6px !important; border-radius:5px !important;
    }
    .card h2{ color:#000 !important; border-bottom:1px solid #999 !important; font-size:10.5px !important; margin:0 0 6px !important; padding-bottom:3px !important; letter-spacing:.6px !important; }
    .card h2 small{ display:none !important; }
    input, textarea, select{ color:#000 !important; background:transparent !important; border:none !important; font-size:11px !important; padding:2px 3px !important; }
    .rich{ background:#fff !important; border:1px solid #ccc !important; color:#000 !important; padding:6px 8px !important; font-size:10.5px !important; line-height:1.4 !important; }
    .rich b, .rich strong{ color:#000 !important; }

    /* forza colonne compatte indipendentemente dal breakpoint a schermo */
    .grid{ gap:5px !important; }
    .grid-6{ grid-template-columns:repeat(6,1fr) !important; }
    .grid-4{ grid-template-columns:repeat(4,1fr) !important; }
    .grid-3{ grid-template-columns:repeat(3,1fr) !important; }
    .grid-2{ grid-template-columns:repeat(2,1fr) !important; }

    /* caratteristiche: molto più compatte */
    .abil-box{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .abil-box.rust{ border-color:#e08a70 !important; }
    .abil-box .name{ color:#000 !important; font-size:8.5px !important; letter-spacing:.3px !important; }
    .abil-box input[type=number]{
      color:#000 !important; background:transparent !important; border:none !important;
      font-size:13px !important; width:32px !important; margin:2px auto 1px !important; padding:0 !important;
    }
    .abil-box .mod{ color:#000 !important; font-size:13px !important; }

    .statpill{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .statpill label{ font-size:8.5px !important; margin-bottom:2px !important; }
    .statpill input{ color:#000 !important; font-size:12px !important; }

    .save-row, .skill-row{ padding:3px 4px !important; }
    .save-row .modbadge{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; padding:2px 0 !important; }
    .skill-row input, .inv-item input, .inv-item textarea{ color:#000 !important; }
    .skill-abbr{ background:#fff !important; border:1px solid #ccc !important; color:#333 !important; font-size:9px !important; padding:1px 0 !important; }

    .hp-row{ gap:8px !important; }
    .hp-numbers input{ padding:3px 0 !important; }
    .pip{ width:15px !important; height:15px !important; border-color:#000 !important; }
    .pip.used{ background:#000 !important; box-shadow:none !important; }
    .hp-track, .inv-bar{ height:12px !important; border:1px solid #000 !important; background:#fff !important; }
    .hp-fill, .inv-bar-fill{ background:#999 !important; }

    .equip-slot{ background:#fff !important; border:1px solid #ccc !important; padding:5px 6px !important; }
    .equip-slot label{ font-size:8.5px !important; }
    .equip-slot input{ color:#000 !important; font-size:11px !important; }

    .inv-item .imgcell{ display:none !important; }
    .inv-item{ padding:4px 5px !important; }
    .tracker{ padding:5px 0 !important; }
    .slot-lvl{ padding:4px 0 !important; }

    .portraits, .portrait{ display:none !important; }
    .divider-label{ color:#444 !important; margin:10px 0 6px !important; font-size:9.5px !important; }
    .divider-label::before, .divider-label::after{ background:#999 !important; }
    .subcard{ padding:6px 8px !important; }
    .subcard .tag{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; font-size:8.5px !important; padding:1px 7px !important; margin-bottom:4px !important; }
    .subcard h3{ color:#000 !important; font-size:12px !important; margin:0 0 4px !important; }
    a{ color:#000 !important; text-decoration:underline; }
  }

</style>

   DATI DI BASE (dalla scheda originale di Ervork)
   Ervork ha due forme con modificatori diversi: se stesso ed il
   demone "Rust". Le caratteristiche di base sono le stesse, ma
   in forma Rust alcuni modificatori cambiano; per questo ogni
   forma ha il proprio set di punteggi indipendente (scoresRust) e
   CA / Iniziativa / Velocit\u00e0 hanno un secondo valore dedicato.
   ============================================================ */
function slugify(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

/* Colore funzionale del "tag" di una capacit\u00e0, dedotto dal testo del tag stesso
   (non dall'array di appartenenza): Passiva = viola, Truccetto = blu, Abilit\u00e0/Incantesimo = rosso. */
function tagColorClass(tag){
  const t = String(tag || "");
  if (/^passiva/i.test(t)) return "tag-passiva";
  if (/^truccetto/i.test(t)) return "tag-truccetto";
  if (/incantesimo/i.test(t)) return "tag-incantesimo";
  if (/abilit/i.test(t)) return "tag-abilita";
  return "";
}
const ATTACCHI_LINKS = [{"label": "Spade Gemelle del Caos", "tab": "equip", "anchor": "anchor-spade-gemelle-del-caos"}];
function renderAttacchiNav(){
  if (!ATTACCHI_LINKS.length) return "";
  return `<div class="quicknav">${ATTACCHI_LINKS.map(l=>`<span class="quicknav-pill" data-jump-tab="${l.tab}" data-jump-anchor="${l.anchor}">${l.label}</span>`).join("")}</div>`;
}
function bindQuicknav(){
  document.querySelectorAll(".quicknav-pill").forEach(el=>{
    el.addEventListener("click", ()=> jumpToAnchor(el.dataset.jumpTab, el.dataset.jumpAnchor));
  });
}
function jumpToAnchor(tabId, anchorId){
  const btn = document.querySelector('.tab-btn[data-tab="'+tabId+'"]');
  if (btn) btn.click();
  setTimeout(()=>{
    const el = anchorId ? document.getElementById(anchorId) : null;
    const target = el || document.getElementById("panel-"+tabId);
    if (target){
      target.scrollIntoView({behavior:"smooth", block:"start"});
      if (el){
        el.classList.add("anchor-flash");
        setTimeout(()=>el.classList.remove("anchor-flash"), 1500);
      }
    }
  }, 80);
}

uò far emergere ciò che vuole dal terreno, utilizzare le proprie abilità come un'estensione diretta del suo corpo all'interno dell'area e manifestare i propri poteri senza dover necessariamente entrare in contatto fisico con il bersaglio. Catene, attacchi, estensioni infernali e altre manifestazioni del suo potere possono quindi sorgere direttamente dal suolo marchiato invece di partire dal corpo, dalle mani o dalla posizione immediata del personaggio, rendendo il dominio un vero prolungamento vivente di Rust e lasciando aperta un'ulteriore possibilità di evoluzione dell'abilità.</p><p><b>2) ASSIMILAZIONE DEMONIACA:</b> Il corpo del personaggio ha ormai raggiunto un grado di adattamento sufficiente da sostenere pienamente il potere demoniaco che ospita al proprio interno. Di conseguenza, ogni trasformazione o manifestazione legata a Rust non provoca più danni necrotici al personaggio, poiché il suo corpo ha finalmente assimilato quella forza come parte integrante della propria esistenza, smettendo di subirla come un elemento estraneo o distruttivo.</p><p><b>3) MISCELA DI FUOCO:</b> Il personaggio, avendo ormai interiorizzato e immagazzinato differenti fuochi di natura diversa, sblocca la capacità di utilizzarne due contemporaneamente, manifestandoli anche separatamente, ad esempio uno per mano, senza perdere i vantaggi o le proprietà che ciascun fuoco garantirebbe se usato singolarmente. Questa abilità gli permette non solo di mantenere attivi due fuochi distinti nello stesso momento, ma anche di fonderli, modularli o contaminarli tra loro, generando fuochi misti dagli effetti variabili in base alla combinazione scelta, alla situazione e alle opportunità del combattimento. Le proprietà risultanti restano coerenti con la natura dei fuochi impiegati e possono produrre manifestazioni nuove, più versatili o più complesse rispetto all'uso di un solo elemento alla volta. Il limite massimo di questa abilità è di due fuochi cumulabili contemporaneamente.</p>"

function saveGoogleTokenToSession(token, expiresInSeconds){
  try{
    sessionStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY, JSON.stringify({
      token: token,
      expiresAt: Date.now() + (Number(expiresInSeconds || 0) * 1000)
    }));
  }catch(e){}
}

function loadGoogleTokenFromSession(){
  try{
    const raw = sessionStorage.getItem(GOOGLE_TOKEN_STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.token || !data.expiresAt) return null;
    if (Date.now() > data.expiresAt - 60000) return null; // margine di sicurezza di 60s
    return data.token;
  }catch(e){ return null; }
}

    // Primo collegamento a Google per questo personaggio su questo dispositivo
    // (nessun file ancora collegato): prima di crearne uno nuovo, chiediamo se

async function driveFind(){
  const name = suggestedFileName();
  const q = encodeURIComponent(`name='${name}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: "Bearer " + googleAccessToken }
  });
  if (!res.ok){
    const body = await res.text().catch(()=> "");
    console.error("Drive (find) errore " + res.status + ": " + body);
    throw new Error("drive find failed: " + res.status);
  }
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function driveCreate(){
  const name = suggestedFileName();
  const boundary = "-------scheda" + Date.now();
  const metadata = { name, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(STATE)}\r\n` +
    `--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": `multipart/related; boundary=${boundary}` },
    body
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (create) errore " + res.status + ": " + errBody);
    throw new Error("drive create failed: " + res.status);
  }
  const data = await res.json();
  return data.id;
}

async function driveUpdate(fileId){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": "application/json" },
    body: JSON.stringify(STATE)
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (update) errore " + res.status + ": " + errBody);
    const err = new Error("drive update failed: " + res.status);
    err.status = res.status;
    throw err;
  }
}

async function driveSave(){
  if (!googleAccessToken) return false;
  try{
    if (!driveFileId){
      // La ricerca per nome (files.list) richiede al token un permesso più ampio di
      // quello concesso (drive.file): su alcuni progetti Google Cloud questa chiamata
      // viene rifiutata con 403 "insufficient authentication scopes". Non deve bloccare
      // il salvataggio: se la ricerca fallisce, si procede comunque a creare il file
      // (che con lo scope drive.file funziona sempre), sacrificando solo — nel raro caso
      // in cui esistesse già un file con lo stesso nome creato da un altro browser/dispositivo
      // di cui questo browser non conosce l'id — la possibilità di ritrovarlo automaticamente.
      try{
        driveFileId = await driveFind();
      }catch(findErr){
        console.error("Ricerca file su Drive non riuscita (si procede comunque con la creazione):", findErr);
        driveFileId = null;
      }
    }
    if (!driveFileId){
      driveFileId = await driveCreate();
    } else {
      try{
        await driveUpdate(driveFileId);
      }catch(updateErr){
        if (updateErr && updateErr.status === 404){
          // Il file collegato non esiste più o non è più accessibile con questo
          // account (cestinato, rimosso, o il collegamento salvato era comunque
          // sbagliato): continuare a riprovare sullo stesso id non porterebbe a
          // nulla. Rimuoviamo il collegamento rotto e ne creiamo uno nuovo, invece
          // di fallire ad ogni salvataggio da qui in avanti.
          console.error("Il file Drive collegato non è più accessibile: rimuovo il collegamento rotto e ne creo uno nuovo.", updateErr);
          try{ localStorage.removeItem(driveFileIdKey || driveStorageKey()); }catch(e){}
          driveFileId = await driveCreate();
        } else {
          throw updateErr;
        }
      }
    }
    try{ localStorage.setItem(driveFileIdKey || driveStorageKey(), driveFileId); }catch(e){}
    updateGoogleStatus();
    return true;
  }catch(e){
    console.error("Salvataggio su Drive non riuscito:", e);
    return false;
  }
}

function deepMerge(base, override){
  if (Array.isArray(base)) return (override && Array.isArray(override)) ? override : base;
  if (typeof base === "object" && base !== null){
    const out = {...base};
    if (override && typeof override === "object"){
      for (const k in override){ out[k] = deepMerge(base[k], override[k]); }
    }
    return out;
  }
  return (override !== undefined) ? override : base;
}

async function loadState(){
  if (!window.storage || typeof window.storage.get !== "function"){
    STORAGE_AVAILABLE = false;
    STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
    setStorageWarning();
    return;
  }
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if (res && res.value){
      const saved = JSON.parse(res.value);
      STATE = deepMerge(DEFAULT_STATE, saved);
      setStatus("Dati caricati \u2713");
      return;
    }
  }catch(e){ /* nessun dato salvato ancora, va bene cos\u00ec */ }
  STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
  setStatus("Scheda pronta");
}

function queueSave(){
  setStatus("Salvataggio\u2026");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(performSave, 500);
}

function flushSave(){
  clearTimeout(saveTimer);
  performSave();
}

async function performSave(){
  let wroteSomething = false;
  let cloudFailed = false;

  if (STORAGE_AVAILABLE){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
      wroteSomething = true;
    }catch(e){ cloudFailed = true; }
  }

  if (localFileHandle){
    const ok = await writeLocalFile();
    if (ok) wroteSomething = true;
  }

  let driveOk = false;
  let driveAttempted = false;
  if (googleAccessToken){
    driveAttempted = true;
    driveOk = await driveSave();
    if (driveOk) wroteSomething = true;
  }

  const t = new Date();
  const stamp = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  if (wroteSomething){
    lastSaveOk = true;
    clearStorageWarning();
    const extras = [localFileHandle ? "file locale" : null, driveOk ? "Drive" : null].filter(Boolean).join(" + ");
    setStatus("Salvato \u2713 " + stamp + (extras ? " (" + extras + ")" : ""));
  } else if (cloudFailed){
    lastSaveOk = false;
    setStatus("Errore di salvataggio \u2014 usa \u2018Esporta backup\u2019");
  } else if (driveAttempted && !driveOk){
    lastSaveOk = false;
    setStatus("Errore di salvataggio su Drive \u2014 controlla la console (F12) o usa \u2018Esporta backup\u2019");
  } else {
    setStatus("Non salvato automaticamente \u2014 collega un file locale, Google Drive, o esporta il backup");
  }
}

async function writeLocalFile(){
  if (!localFileHandle) return false;
  try{
    const perm = await localFileHandle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted") return false;
    const writable = await localFileHandle.createWritable();
    await writable.write(JSON.stringify(STATE, null, 2));
    await writable.close();
    return true;
  }catch(e){ return false; }
}

function mod(score){ return Math.floor((score-10)/2); }
function fmtMod(m){ return (m>=0 ? "+" : "") + m; }
/* Modificatore effettivo: usa il valore inserito manualmente (override) se presente,
   altrimenti il calcolo automatico dal punteggio. Permette all'utente di sostituire
   un valore calcolato senza che il ricalcolo automatico lo sovrascriva.
   Ervork ha due set di caratteristiche indipendenti (forma normale e Rust),
   quindi l'override è tenuto separato per gruppo ("ervork" / "rust"). */
function effMod(scoresObj, group, k){
  const g = STATE.modOverride && STATE.modOverride[group];
  const ov = g ? g[k] : undefined;
  return (typeof ov === "number" && !isNaN(ov)) ? ov : mod(scoresObj[k]);
}
function hasOverride(group, k){
  const g = STATE.modOverride && STATE.modOverride[group];
  return !!(g && typeof g[k] === "number");
}

/* ============================================================
   IMMAGINI OGGETTI (compresse in dataURL, salvate nello stato)
   ============================================================ */
function fileToCompressedDataURL(file, maxDim, quality, cb){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim / Math.max(w,h));
      w = Math.max(1, Math.round(w*scale));
      h = Math.max(1, Math.round(h*scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = ()=>{ setStatus("Immagine non valida"); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* allowZoom: aggiunge un pulsante di ingrandimento (modal) accanto alla miniatura.
   Usato solo per le immagini dell'Equipaggiamento, non per l'Inventario. */
function makeImagePicker(currentSrc, onPick, onRemove, allowZoom, zoomLabel, readOnly){
  const wrap = document.createElement("div");
  wrap.className = "img-row";

  const thumb = document.createElement(currentSrc ? "img" : "div");
  if (currentSrc){ thumb.src = currentSrc; thumb.className = "thumb"; }
  else { thumb.className = "thumb-placeholder"; }

  if (readOnly){
    /* Player read-only (equip/inventario): solo visualizzazione. Nessun
       modo di aggiungere, cambiare o rimuovere l'immagine. Se c'è
       un'immagine, il clic sulla miniatura apre il lightbox; altrimenti
       un placeholder neutro senza alcuna interattività. */
    if (currentSrc){
      thumb.title = "Clic per ingrandire";
      thumb.addEventListener("click", ()=> openImageLightbox(currentSrc, zoomLabel));
    } else {
      thumb.title = "Nessuna immagine";
    }
    wrap.appendChild(thumb);
    return wrap;
  }

  if (currentSrc){ thumb.title = "Clic per cambiare immagine"; }
  else { thumb.textContent = "+"; thumb.title = "Aggiungi immagine"; }

  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.className = "file-input-hidden";
  input.addEventListener("change", ()=>{
    const f = input.files && input.files[0];
    if (f) fileToCompressedDataURL(f, 320, 0.72, (dataUrl)=>{ onPick(dataUrl); });
  });

  thumb.addEventListener("click", ()=> input.click());

  wrap.appendChild(thumb);
  wrap.appendChild(input);

  const label = document.createElement("span");
  label.className = "file-btn";
  label.textContent = currentSrc ? "Cambia immagine" : "Aggiungi immagine";
  label.addEventListener("click", ()=> input.click());
  wrap.appendChild(label);

  if (currentSrc && allowZoom){
    const zoom = document.createElement("button");
    zoom.className = "img-zoom"; zoom.type="button"; zoom.textContent = "\u26f6"; zoom.title="Ingrandisci immagine";
    zoom.addEventListener("click", (ev)=>{ ev.stopPropagation(); openImageLightbox(currentSrc, zoomLabel); });
    wrap.appendChild(zoom);
  }

  if (currentSrc){
    const rm = document.createElement("button");
    rm.className = "img-remove"; rm.type="button"; rm.textContent = "\u2715"; rm.title="Rimuovi immagine";
    rm.addEventListener("click", (ev)=>{ ev.stopPropagation(); onRemove(); });
    wrap.appendChild(rm);
  }
  return wrap;
}

const TABS = [

];

function renderTabbar(){
  const bar = document.getElementById("tabbar");
  bar.innerHTML = TABS.map((t,i)=>
    `<button class="tab-btn ${i===0?'active':''}" data-tab="${t.id}">${t.label}${t.pulse?'<span class="dot-pulse"></span>':''}</button>`
  ).join("");
  bar.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      bar.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
      document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
    });
  });
}

/* ============================================================
   RENDER: SCHEDA
   ============================================================ */
function renderScheda(){
  const masterOn = isMasterEditorOn();
  const abilNames = {FOR:"Forza", DES:"Destrezza", COS:"Costituzione", INT:"Intelligenza", SAG:"Saggezza", CAR:"Carisma"};
  const hasRust = !!STATE.scoresRust;

  function buildAbilBoxes(scoresObj, group){
    return Object.keys(scoresObj).map(k=>`
    <div class="abil-box ${group==='rust'?'rust':''}">
      <div class="name">${abilNames[k]}</div>
      <input type="number" data-score-group="${group}" data-score="${k}" value="${scoresObj[k]}">
      <input type="text" inputmode="numeric" class="mod${hasOverride(group,k)?' is-override':''}" id="mod-${group}-${k}" data-modover-group="${group}" data-modover="${k}" value="${fmtMod(effMod(scoresObj,group,k))}" title="Modificatore calcolato automaticamente dal punteggio. Puoi modificarlo manualmente: il valore inserito viene mantenuto e non viene più sovrascritto dal ricalcolo automatico. Cancella il campo per tornare al calcolo automatico.">
    </div>`).join("");
  }
  const abilBoxes = buildAbilBoxes(STATE.scores, "ervork");
  const abilBoxesRust = hasRust ? buildAbilBoxes(STATE.scoresRust, "rust") : "";

  const saveRows = Object.keys(STATE.saves).map(k=>`
    <div class="save-row">
      <input type="checkbox" data-save="${k}" ${STATE.saves[k]?"checked":""}>
      <span>${abilNames[k]}</span>
      <span class="modbadge" id="savemod-${k}">${fmtMod(effMod(STATE.scores,"ervork",k))}</span>
    </div>`).join("");

  const skillRows = STATE.skills.map((s,i)=>`
    <div class="skill-row">
      <span class="skill-name">${s[0]}</span>
      <span class="skill-abbr" id="skillmod-${i}">${s[1]} ${fmtMod(effMod(STATE.scores,"ervork",s[1]))}</span>
      <input type="number" data-skill="${i}" value="${s[2]}">
    </div>`).join("");

  const deathPips = (arr, cls)=> arr.map((v,i)=>`<button class="pip death ${cls==='s'?'death-success':'death-fail'} ${v?'used':''}" data-death="${cls}-${i}"></button>`).join("");

  document.getElementById("panel-scheda").innerHTML = `
    ${hasRust ? `<div class="rust-banner">\ud83d\udd25 <b>Doppia forma:</b> Ervork e Rust hanno caratteristiche indipendenti, modificabili separatamente qui sotto.</div>` : ""}
    <div class="card">
      <h2>Identit\u00e0</h2>
      <div class="grid grid-4">
        <div class="field"><label>Classe e Livello</label><input type="text" data-key="classe" value="${esc(STATE.classe)}"></div>
        <div class="field"><label>Background</label><input type="text" data-key="background" value="${esc(STATE.background)}"></div>
        <div class="field"><label>Razza</label><input type="text" data-key="razza" value="${esc(STATE.razza)}"></div>
        <div class="field"><label>Allineamento</label><input type="text" data-key="allineamento" value="${esc(STATE.allineamento)}"></div>
        <div class="field"><label>Nome Giocatore</label><input type="text" data-key="giocatore" value="${esc(STATE.giocatore)}"></div>
        <div class="field"><label>Altro</label><input type="text" data-key="altro" value="${esc(STATE.altro)}"></div>
      </div>
    </div>

    <div class="card">
      <h2>Caratteristiche <small>il modificatore si aggiorna da solo</small></h2>
      <div class="divider-label" style="margin-top:0;">Ervork</div>
      <div class="grid grid-6">${abilBoxes}</div>
      ${hasRust ? `<div class="divider-label">\ud83d\udd25 Rust</div><div class="grid grid-6">${abilBoxesRust}</div>` : ""}
    </div>

    <div class="card">
      <h2>Parametri di Combattimento</h2>
      <div class="grid grid-4">
        <div class="statpill dual">
          <label>CA</label>
          <div class="dual-row"><span>Ervork</span><input type="number" data-key-num="ca" value="${STATE.ca}"></div>
          ${hasRust ? `<div class="dual-row"><span class="rust-tag">Rust</span><input type="number" data-key-num="caRust" value="${STATE.caRust}"></div>` : ""}
        </div>
        <div class="statpill dual">
          <label>Iniziativa</label>
          <div class="dual-row"><span>Ervork</span><input type="number" data-key-num="iniziativa" value="${STATE.iniziativa}"></div>
          ${hasRust ? `<div class="dual-row"><span class="rust-tag">Rust</span><input type="number" data-key-num="iniziativaRust" value="${STATE.iniziativaRust}"></div>` : ""}
        </div>
        <div class="statpill dual">
          <label>Velocit\u00e0</label>
          <div class="dual-row"><span>Ervork</span><input type="number" data-key-num="velocita" value="${STATE.velocita}"></div>
          ${hasRust ? `<div class="dual-row"><span class="rust-tag">Rust</span><input type="number" data-key-num="velocitaRust" value="${STATE.velocitaRust}"></div>` : ""}
        </div>
        <div class="statpill"><label>Bonus Competenza</label><input type="number" data-key-num="bonusComp" value="${STATE.bonusComp}"></div>
      </div>
      <div style="margin-top:12px;" class="grid grid-4">
        <div class="statpill"><label>Dado Vita</label><input type="text" data-key="dadoVita" value="${esc(STATE.dadoVita)}"></div>
        <div class="statpill"><label>Perc. Passiva</label><input type="number" data-key-num="percPassiva" value="${STATE.percPassiva}"></div>
      </div>
    </div>

    <div class="card">
      <h2>Punti Ferita</h2>
      <div class="hp-row">
        <div class="hp-numbers">
          <button class="btn small" id="hp-minus">\u2212</button>
          <input type="number" id="hp-cur" value="${STATE.hpCur}">
          <span style="color:var(--text-faint)">/</span>
          <input type="number" id="hp-max" value="${STATE.hpMax}">
          <button class="btn small" id="hp-plus">+</button>
        </div>
        <div class="hp-track"><div class="hp-fill" id="hp-fill"></div></div>
      </div>
      <div class="hp-row hp-row-temp">
        <div class="hp-numbers">
          <label style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;">PF Temp.</label>
          <input type="number" id="hp-temp" value="${STATE.hpTemp}">
        </div>
        <div class="hp-track hp-track-temp"><div class="hp-fill hp-fill-temp" id="hp-fill-temp"></div></div>
      </div>
      ${STATE.hpTempRustNota ? `<div style="margin-top:8px;font-size:11.5px;color:#ff8a6a;font-style:italic;" ${masterOn ? 'contenteditable="true"' : ''} data-rich="hpTempRustNota">${STATE.hpTempRustNota}</div>` : ""}
      <div class="divider-label">Tiri Salvezza contro la Morte</div>
      <div style="display:flex;gap:26px;justify-content:center;flex-wrap:wrap;">
        <div><div style="text-align:center;font-size:10.5px;color:var(--good);text-transform:uppercase;margin-bottom:6px;">Successi</div><div class="pips">${deathPips(STATE.deathSuccess,"s")}</div></div>
        <div><div style="text-align:center;font-size:10.5px;color:var(--bad);text-transform:uppercase;margin-bottom:6px;">Fallimenti</div><div class="pips">${deathPips(STATE.deathFail,"f")}</div></div>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h2>Tiri Salvezza</h2>
        ${saveRows}
      </div>
      <div class="card">
        <h2>Abilit\u00e0</h2>
        ${skillRows}
      </div>
    </div>

    <div class="card">
      <h2>Attacchi & Incantesimi di Prima Utilit\u00e0</h2>
      ${renderAttacchiNav()}
      <div class="rich" ${masterOn ? 'contenteditable="true"' : ''} data-rich="attacchi">${STATE.attacchi}</div>
    </div>
  `;

  // score inputs
  document.querySelectorAll('[data-score]').forEach(inp=>{
    inp.readOnly = !isMasterEditorOn();
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.score;
      const group = inp.dataset.scoreGroup || "ervork";
      const targetObj = group === "rust" ? STATE.scoresRust : STATE.scores;
      targetObj[k] = parseInt(inp.value || "0", 10);
      const modEl = document.getElementById("mod-"+group+"-"+k);
      if (modEl){ modEl.value = fmtMod(effMod(targetObj, group, k)); modEl.classList.toggle("is-override", hasOverride(group,k)); }
      if (group === "ervork"){
        const sm = document.getElementById("savemod-"+k);
        if (sm) sm.textContent = fmtMod(effMod(STATE.scores,"ervork",k));
        STATE.skills.forEach((s,i)=>{
          if (s[1]===k){ const el=document.getElementById("skillmod-"+i); if(el) el.textContent = k+" "+fmtMod(effMod(STATE.scores,"ervork",k)); }
        });
      }
      queueSave();
    });
  });

  // override manuale del modificatore (Caratteristiche editabili):
  // il calcolo automatico resta attivo, ma un valore inserito qui manualmente
  // sostituisce quello calcolato e non viene più sovrascritto dal ricalcolo.
  // Ogni gruppo (ervork/rust) mantiene il proprio override in modo indipendente.
  document.querySelectorAll('[data-modover]').forEach(inp=>{
    inp.readOnly = !isMasterEditorOn();
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.modover;
      const group = inp.dataset.modoverGroup || "ervork";
      const targetObj = group === "rust" ? STATE.scoresRust : STATE.scores;
      const raw = inp.value.trim();
      if (!STATE.modOverride) STATE.modOverride = { ervork:{}, rust:{} };
      if (!STATE.modOverride[group]) STATE.modOverride[group] = {};
      if (raw === ""){
        delete STATE.modOverride[group][k];
      } else {
        const parsed = parseInt(raw.replace(/^\+/, ""), 10);
        if (!isNaN(parsed)) STATE.modOverride[group][k] = parsed;
      }
      inp.classList.toggle("is-override", hasOverride(group,k));
      if (group === "ervork"){
        const sm = document.getElementById("savemod-"+k);
        if (sm) sm.textContent = fmtMod(effMod(STATE.scores,"ervork",k));
        STATE.skills.forEach((s,i)=>{
          if (s[1]===k){ const el=document.getElementById("skillmod-"+i); if(el) el.textContent = k+" "+fmtMod(effMod(STATE.scores,"ervork",k)); }
        });
      }
      queueSave();
    });
    inp.addEventListener("blur", ()=>{
      const k = inp.dataset.modover;
      const group = inp.dataset.modoverGroup || "ervork";
      const targetObj = group === "rust" ? STATE.scoresRust : STATE.scores;
      inp.value = fmtMod(effMod(targetObj, group, k));
    });
  });
  document.querySelectorAll('[data-save]').forEach(inp=>{
    inp.disabled = !isMasterEditorOn();
    inp.addEventListener("change", ()=>{ STATE.saves[inp.dataset.save] = inp.checked; queueSave(); });
  });
  document.querySelectorAll('[data-skill]').forEach(inp=>{
    inp.readOnly = !isMasterEditorOn();
    inp.addEventListener("input", ()=>{ STATE.skills[inp.dataset.skill][2] = parseInt(inp.value||"0",10); queueSave(); });
  });
  document.querySelectorAll('[data-death]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cls,idx] = btn.dataset.death.split("-");
      const arr = cls==="s" ? STATE.deathSuccess : STATE.deathFail;
      arr[idx] = !arr[idx];
      btn.classList.toggle("used", arr[idx]);
      queueSave();
    });
  });

  bindSimpleInputs();
  bindRich();

  const hpCur = document.getElementById("hp-cur"), hpMax = document.getElementById("hp-max"), hpTemp = document.getElementById("hp-temp");
  hpMax.readOnly = !isMasterEditorOn();
  function refreshHp(){
    let cur = parseInt(hpCur.value||"0",10), max = parseInt(hpMax.value||"0",10);
    if (cur > max) cur = max;
    if (cur < 0) cur = 0;
    hpCur.value = cur;
    let temp = parseInt(hpTemp.value||"0",10);
    if (temp < 0) temp = 0;
    STATE.hpCur = cur; STATE.hpMax = max; STATE.hpTemp = temp;
    const pct = max>0 ? Math.max(0,Math.min(100, cur/max*100)) : 0;
    document.getElementById("hp-fill").style.width = pct+"%";
    document.getElementById("hp-fill").style.background = pct<25 ? "linear-gradient(90deg,#7a2a24,var(--bad))" : (pct<60 ? "linear-gradient(90deg,#8a6a24,#c9a34e)" : "linear-gradient(90deg,#3f6a3a,var(--good))");
    const tempPct = max>0 ? Math.max(0,Math.min(100, temp/max*100)) : (temp>0 ? 100 : 0);
    document.getElementById("hp-fill-temp").style.width = tempPct+"%";
  }
  hpCur.addEventListener("input", ()=>{refreshHp(); queueSave();});
  hpMax.addEventListener("input", ()=>{refreshHp(); queueSave();});
  hpTemp.addEventListener("input", ()=>{refreshHp(); queueSave();});
  document.getElementById("hp-minus").addEventListener("click", ()=>{hpCur.value = (parseInt(hpCur.value||"0",10)-1); refreshHp(); queueSave();});
  document.getElementById("hp-plus").addEventListener("click", ()=>{hpCur.value = (parseInt(hpCur.value||"0",10)+1); refreshHp(); queueSave();});
  refreshHp();
}

/* ============================================================
   MASTER EDITOR
   Modalità di modifica strutturale riservata al Master: categoria,
   titolo/etichetta, testo, larghezza e ordine dei riquadri di   Passive/Truccetti/Risorse/Ambiti/Campi. Nessuna auto-correzione:
   il testo inserito viene salvato esattamente com'è scritto.
   Attivabile SOLO da chi ha già sbloccato la modalità Master
   (password Master), ed è completamente invisibile/inattiva in
   modalità giocatore.
   ============================================================ */
const MASTER_EDITOR_KEY = "morgedal-master-editor";
const MASTER_CATS = [
  { key:"passive", label:"Passiva" },
  { key:"truccetti", label:"Truccetto" },
  { key:"incantesimo", label:"Incantesimo" },
  { key:"abilita", label:"Abilità" },
  { key:"risorse", label:"Risorsa" },
  { key:"ambiti", label:"Ambito" },
  { key:"campiAttiva", label:"Campo" }
];
const MASTER_ARR_SHAPE_CATS = new Set(["ambiti","campiAttiva"]);

function isMasterEditorOn(){
  if (!isMasterUnlocked()) return false;
  try{ return sessionStorage.getItem(MASTER_EDITOR_KEY) === "1"; }catch(e){ return false; }
}
function setMasterEditorOn(on){
  try{ if (on) sessionStorage.setItem(MASTER_EDITOR_KEY, "1"); else sessionStorage.removeItem(MASTER_EDITOR_KEY); }catch(e){}
}

function masterToCanonical(cat, item){
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    return { nome:item[0]||"", desc:item[1]||"", group:item[2]||"", width:item[3]||1 };
  }
  if (cat === "passive") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Passiva", width:item.width||1, hidden:!!item.hidden };
  if (cat === "truccetti") return { nome:item.nome||"", desc:item.desc||"", uso:item.uso||"?", width:item.width||1, hidden:!!item.hidden };
  if (cat === "abilita") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Abilità", width:item.width||1, hidden:!!item.hidden };
  if (cat === "risorse") return { nome:item.nome||"", desc:item.desc||"", max:item.max||1, width:item.width||1, hidden:!!item.hidden };
  if (cat === "incantesimo") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Incantesimo", width:item.width||1, hidden:!!item.hidden };
  return { nome:"", desc:"", width:1 };
}
function masterFromCanonical(cat, c){
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    return [c.nome||"Nuovo elemento", c.desc||"", "", c.width||1];
  }
  if (cat === "passive") return { nome:c.nome||"Nuova Passiva", tag:c.tag||"Passiva", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "truccetti") return { nome:c.nome||"Nuovo Truccetto", uso:c.uso||"?", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "abilita") return { nome:c.nome||"Nuova Abilità", tag:c.tag||"Abilità", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "risorse") return { nome:c.nome||"Nuova Risorsa", desc:c.desc||"", max:c.max||1, used:0, width:c.width||1, hidden:!!c.hidden };
  if (cat === "incantesimo") return { nome:c.nome||"Nuovo Incantesimo", tag:c.tag||"Incantesimo", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  return { nome:c.nome||"", desc:c.desc||"" };
}

function masterRerender(cat){
  if (MASTER_ARR_SHAPE_CATS.has(cat)) renderDivergenza(); else renderPoteri();
}
function masterMoveCategory(cat, idx, newCat){
  if (newCat === cat) return;
  const item = STATE[cat][idx];
  const canon = masterToCanonical(cat, item);
  STATE[cat].splice(idx,1);
  if (!STATE[newCat]) STATE[newCat] = [];
  STATE[newCat].push(masterFromCanonical(newCat, canon));
  renderPoteri(); renderDivergenza();
  queueSave();
}
function masterReorder(cat, idx, dir){
  const arr = STATE[cat];
  const j = idx + dir;
  if (j < 0 || j >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
  masterRerender(cat);
  queueSave();
}
function masterDelete(cat, idx){
  STATE[cat].splice(idx,1);
  masterRerender(cat);
  queueSave();
}
function masterCreate(cat){
  STATE[cat].push(masterFromCanonical(cat, {nome:"Nuovo elemento", desc:""}));
  masterRerender(cat);
  queueSave();
}
function masterBoxWidth(cat, idx){
  const item = STATE[cat][idx];
  return (MASTER_ARR_SHAPE_CATS.has(cat) ? item[3] : item.width) || 1;
}
function setMasterBoxWidth(cat, idx, w){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)) item[3] = w; else item.width = w;
  masterRerender(cat);
  queueSave();
}
function masterSetField(cat, idx, field, val){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    if (field === "nome") item[0] = val;
    else if (field === "desc") item[1] = val;
    else if (field === "group") item[2] = val;
  } else {
    item[field] = val;
  }
}
function masterBoxHeight(cat, idx){
  const item = STATE[cat][idx];
  return (MASTER_ARR_SHAPE_CATS.has(cat) ? item[4] : item.h) || null;
}
function setMasterBoxHeight(cat, idx, h){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)) item[4] = h; else item.h = h;
  queueSave();
}
/* Al rilascio di un resize verticale del Master, se l'altezza scelta
   manualmente è inferiore al minimo necessario a mostrare tutto il
   contenuto (produrrebbe uno scroll interno), il box viene espanso
   automaticamente al minimo richiesto: nessuna scrollbar interna, nessun
   testo tagliato. Restituisce l'altezza EFFETTIVA (px, intera) da salvare
   nello STATE, che quindi non è mai inferiore a quella richiesta dal
   contenuto. Se l'altezza scelta è già sufficiente resta invariata. */
function growBoxToFitContent(el){
  let h = Math.round(el.getBoundingClientRect().height);
  if (el.scrollHeight > el.clientHeight){
    h = Math.round(h + (el.scrollHeight - el.clientHeight));
    el.style.height = h + "px";
  }
  return h;
}
function masterBoxStyle(cat, idx){
  const w = masterBoxWidth(cat, idx);
  const h = masterBoxHeight(cat, idx);
  let style = "";
  if (w && w > 1) style += `grid-column:span ${w};`;
  if (h) style += `height:${h}px;`;
  return ` data-master-box="${cat}-${idx}"${style ? ` style="${style}"` : ""}`;
}
function masterToolbarHtml(cat, idx, opts){
  opts = opts || {};
  const options = MASTER_CATS.map(c => `<option value="${c.key}"${c.key===cat?" selected":""}>${c.label}</option>`).join("");
  const w = masterBoxWidth(cat, idx);
  const widthCtl = opts.noWidth ? "" : `<select class="master-box-width" data-master-width="${cat}-${idx}" title="Larghezza del riquadro">
      <option value="1"${w===1?" selected":""}>1/3</option>
      <option value="2"${w===2?" selected":""}>2/3</option>
      <option value="3"${w===3?" selected":""}>3/3</option>
    </select>`;
  const canHide = !MASTER_ARR_SHAPE_CATS.has(cat);
  const isHidden = canHide && !!(STATE[cat][idx] && STATE[cat][idx].hidden);
  const eyeCtl = canHide
    ? `<button type="button" class="master-mini-btn master-eye-btn${isHidden?' is-hidden':''}" data-master-eye="${cat}-${idx}" title="${isHidden?'Nascosto al giocatore — clic per mostrare':'Visibile al giocatore — clic per nascondere'}">${isHidden?'🙈':'👁️'}</button>`
    : "";
  return `<div class="master-toolbar">
    <select class="master-cat-select" data-master-move="${cat}-${idx}" title="Sposta in un'altra categoria">${options}</select>
    <button type="button" class="master-mini-btn" data-master-up="${cat}-${idx}" title="Sposta su">↑</button>

}
function masterNewBoxBtn(cat, label){
  return `<button type="button" class="btn master-add-btn" data-master-create="${cat}">+ Nuovo box — ${label}</button>`;
}
function masterToggleHidden(cat, idx){
  const item = STATE[cat][idx];
  if (!item) return;
  item.hidden = !item.hidden;
  masterRerender(cat);
  queueSave();
}
function bindMasterControls(root){
  root = root || document;
  if (!isMasterEditorOn()) return;
  root.querySelectorAll('[data-master-move]').forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const [cat, idx] = sel.dataset.masterMove.split("-");
      masterMoveCategory(cat, Number(idx), sel.value);
    });
  });
  root.querySelectorAll('[data-master-up]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterUp.split("-");
      masterReorder(cat, Number(idx), -1);
    });
  });
  root.querySelectorAll('[data-master-down]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterDown.split("-");
      masterReorder(cat, Number(idx), 1);
    });
  });
  root.querySelectorAll('[data-master-del]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterDel.split("-");
      masterDelete(cat, Number(idx));
    });
  });
  root.querySelectorAll('[data-master-eye]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterEye.split("-");
      masterToggleHidden(cat, Number(idx));
    });
  });
  root.querySelectorAll('[data-master-width]').forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const [cat, idx] = sel.dataset.masterWidth.split("-");
      setMasterBoxWidth(cat, Number(idx), Number(sel.value));
    });
  });
  root.querySelectorAll('[data-master-box]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const [cat, idx] = el.dataset.masterBox.split("-");
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = growBoxToFitContent(el);
        if (h && h !== masterBoxHeight(cat, Number(idx))){
          setMasterBoxHeight(cat, Number(idx), h);
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
  root.querySelectorAll('[data-master-create]').forEach(btn=>{
    btn.addEventListener("click", ()=>{ masterCreate(btn.dataset.masterCreate); });
  });
  root.querySelectorAll('[data-master-field]').forEach(el=>{
    const evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, ()=>{
      const [cat, idx, field] = el.dataset.masterField.split("|");
      const val = el.matches("[contenteditable]") ? el.innerHTML : el.value;
      masterSetField(cat, Number(idx), field, val);
      queueSave();
    });
  });
}
function initMasterEditorToggle(){
  const btn = document.getElementById("master-editor-toggle");
  if (!btn) return;
  if (!isMasterUnlocked()){
    btn.classList.remove("show");
    return;
  }
  btn.classList.add("show");
  const refresh = ()=>{
    const on = isMasterEditorOn();
    btn.classList.toggle("on", on);
    btn.textContent = on ? "🛠️ Editor Master: ON" : "🛠️ Editor Master";
    document.body.classList.toggle("master-editor-on", on);
  };
  refresh();
  btn.addEventListener("click", ()=>{
    setMasterEditorOn(!isMasterEditorOn());
    refresh();
    renderAll();
  });
}

/* Ordine: Nome -> Descrizione -> Peso. La descrizione si espande in verticale
   con il contenuto (nessuno scroll interno, nessun testo troncato). */
function renderInvTable(){
  const masterOn = isMasterEditorOn();
  const tbody = document.getElementById("inv-tbody");
  tbody.innerHTML = STATE.inventario.map((it,i)=>`
    <div class="inv-item">
      <div class="inv-item-top">
        <input type="checkbox" data-inv-check="${i}" ${it[0]==="\u2713"?"checked":""} title="Portato/equipaggiato">
        <div class="imgcell" id="inv-img-${i}"></div>

      </div>
