<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARY — Scheda Personaggio</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
  :root{
    --bg:#0f0d0c;
    --bg-panel:#1b1613;
    --bg-panel-2:#241d18;
    --bg-panel-3: #171210;
    --border:#3d3024;
    --border-soft:#2a2119;
    --gold:#c9a34e;
    --gold-bright:#eecb7c;
    --violet:#9450d8;
    --violet-dim:#5c3a86;
    --red-glow:#c9463b;
    --blue:#4f8fd6;
    --blue-dim:#2d5a86;
    --teal:#2fb8ac;
    --teal-dim:#1d6b64;
    --amber:#e08a3a;
    --amber-dim:#8a541f;
    --identity:#b34868;
    --identity2:#5c9b8c;
    --text:#ece3d0;
    --text-dim:#a89880;
    --text-faint:#7a6c58;
    --good:#6f9a63;
    --bad:#b04a3f;
    --radius:10px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.10), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(201,70,59,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:0;
  }
  ::selection{background:var(--violet-dim);color:#fff;}
  a{color:var(--gold-bright);}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:38px 24px 26px;
    border-bottom:1px solid var(--border);
        cursor:grab;
    user-select:none;
    touch-action:none;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;inset:0;z-index:-1;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
      url('assets/characters/mary-1.webp');
    background-size:cover;
    background-position:50% 20%;
    background-repeat:no-repeat;
    transition:transform .12s ease-out;
  }
  .hero.dragging{cursor:grabbing;}
  .hero-zoom-btn{
    background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.25);
    color:rgba(237,227,208,0.9);width:18px;height:18px;line-height:16px;
    border-radius:50%;font-size:12px;cursor:pointer;padding:0;margin:0 1px;
    font-family:var(--mono);vertical-align:middle;
  }
  .hero-zoom-btn:hover{background:rgba(0,0,0,0.7);}
  #hero-zoom-label{font-family:var(--mono);font-size:10px;margin:0 3px;vertical-align:middle;}
  .hero-hint{
    position:absolute;top:12px;right:16px;font-size:10px;letter-spacing:.4px;
    color:rgba(237,227,208,0.8);background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);
    padding:4px 11px;border-radius:12px;transition:opacity .2s;opacity:0.55;z-index:2;
  }
  .hero:hover .hero-hint{opacity:1;}

  .hero::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, var(--identity), var(--identity2));z-index:2;
  }
  .hero-inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .hero-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(38px,6vw,64px);
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-bright);
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    margin:0;
  }
  .hero-sub{font-family:var(--serif);font-style:italic;color:var(--text-dim);font-size:15px;margin-top:6px;}
  .hero-meta{display:flex;gap:10px;flex-wrap:wrap;}
  .hero-chip{
    background:rgba(20,16,14,0.65);
    border:1px solid var(--border);
    border-radius:20px;
    padding:6px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    backdrop-filter: blur(2px);
  }
  .hero-chip b{color:var(--gold-bright);font-weight:600;}
  .tipo-label{opacity:.65;font-size:11px;letter-spacing:.5px;}
  .hero-chip-tipo{border-color:var(--identity);}
  .hero-chip-tipo b{color:var(--identity);}
  .hero-chip-id{display:flex;flex-direction:column;gap:1px;padding:5px 14px 6px;}
  .hero-chip-label{
    font-size:8px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-faint);font-weight:600;line-height:1.3;
  }
  .quicknav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;}
  .quicknav-pill{
    display:inline-flex;align-items:center;gap:5px;
    background:color-mix(in srgb, var(--identity) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--identity) 45%, transparent);
    border-radius:14px;padding:4px 12px;font-size:12px;color:var(--identity);
    cursor:pointer;transition:background .15s,color .15s;
  }
  .quicknav-pill:hover{background:color-mix(in srgb, var(--identity) 25%, transparent);color:var(--gold-bright);}
  .quicknav-pill::before{content:"\2197";font-size:11px;}
  @keyframes anchorFlash{0%,100%{box-shadow:none;}30%{box-shadow:0 0 0 3px var(--gold);}}
  .anchor-flash{animation:anchorFlash 1.4s ease;}
  .editable-name{
    background:transparent;border:none;color:var(--gold-bright);font-family:var(--serif);
    font-weight:700;font-size:64px;letter-spacing:2px;text-transform:uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    border-bottom:1px dashed transparent; padding:0; width:100%; max-width:100%;
    white-space:nowrap; overflow:hidden;
  }
  @media (max-width:720px){ .editable-name{ font-size:38px; } }
  .editable-name:hover, .editable-name:focus{border-bottom:1px dashed var(--gold); outline:none;}

  /* ---------- TABS ---------- */
  .tabbar{
    position:sticky;top:0;z-index:50;
    background:rgba(15,13,12,0.94);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    white-space:nowrap;
  }
  .tabbar-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 16px;}
  .tab-btn{
    background:none;border:none;color:var(--text-dim);
    font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:0.4px;
    padding:14px 16px;cursor:pointer;border-bottom:2px solid transparent;
    text-transform:uppercase;transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-bright);border-bottom:2px solid var(--gold);}
  .dot-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--identity);margin-left:6px;filter:drop-shadow(0 0 4px var(--identity));animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---------- CARDS / GRID ---------- */
  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:1.6px;
    color:var(--gold);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .card h2 small{font-family:var(--sans);text-transform:none;letter-spacing:0;color:var(--text-faint);font-size:11px;}
  .grid{display:grid;gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  @media (max-width:820px){.grid-4,.grid-3,.grid-6{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.grid-4,.grid-3,.grid-2,.grid-6{grid-template-columns:1fr 1fr;}}
  @media (max-width:700px){.grid-2{grid-template-columns:1fr;}}
  @media (max-width:520px){#equip-slots-grid{grid-template-columns:1fr;}}
  @media (max-width:480px){.grid-3{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-faint);}
  .field input[type=text], .field input[type=number], select, textarea{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%;
  }
  .field input:focus, textarea:focus, select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  textarea{resize:vertical;font-family:var(--sans);line-height:1.55;}

  /* ---------- ABILITY SCORES ---------- */
  .abil-box{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:14px;text-align:center;position:relative;
  }
  .abil-box .name{font-size:11px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .abil-box input[type=number]{
    width:64px;text-align:center;font-size:20px;font-weight:700;font-family:var(--mono);
    background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);
    margin:8px auto 6px;padding:4px 0;
  }
  .abil-box .mod{
    font-family:var(--mono);font-size:22px;color:var(--gold-bright);font-weight:700;
    width:60px;text-align:center;background:transparent;border:1px solid transparent;
    border-radius:6px;padding:2px 0;margin:0 auto;display:block;
  }
  .abil-box .mod:hover{border-color:var(--border-soft);}
  .abil-box .mod:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  .abil-box .mod.is-override{color:var(--text);border-color:var(--gold);background:var(--bg-panel-3);}

  /* ---------- STAT PILLS ---------- */
  .statpill{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px;text-align:center;}
  .statpill label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);margin-bottom:6px;}
  .statpill input{width:100%;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;background:transparent;border:none;color:var(--gold-bright);}
  .statpill input:focus{outline:none;}

  /* ---------- HP ---------- */
  .hp-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .hp-track{flex:1;min-width:220px;height:22px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;position:relative;}
  .hp-fill{height:100%;background:linear-gradient(90deg,#3f6a3a,var(--good));transition:width .3s;}
  .hp-numbers{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:15px;}
  .hp-numbers input{width:64px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);border-radius:6px;padding:6px 2px;}
  .hp-row-temp{margin-top:6px;}
  .hp-track-temp{height:14px;}
  .hp-fill-temp{height:100%;background:linear-gradient(90deg,#8a5a1f,var(--amber));transition:width .3s;}
  .btn{
    background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.3px;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn.primary{background:linear-gradient(180deg, #3a2a12, #241a0c);border-color:var(--gold);color:var(--gold-bright);}
  .btn.small{padding:4px 9px;font-size:11px;}
  .btn.danger:hover{border-color:var(--bad);color:#ff9d90;}

  /* ---------- SKILL LIST ---------- */
  .skill-row{display:grid;grid-template-columns:1fr 46px 60px;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border-soft);}
  .skill-row:last-child{border-bottom:none;}
  .skill-name{font-size:13.5px;}
  .skill-abbr{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);text-align:center;background:var(--bg-panel-3);border-radius:5px;padding:3px 0;}
  .skill-row input[type=number]{width:100%;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:6px;padding:5px 0;font-family:var(--mono);font-weight:700;}

  /* ---------- SAVES ---------- */
  .save-row{display:grid;grid-template-columns:26px 1fr 60px;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--border-soft);}
  .save-row:last-child{border-bottom:none;}
  .save-row .modbadge{font-family:var(--mono);text-align:center;color:var(--gold-bright);font-weight:700;background:var(--bg-panel-3);border-radius:6px;padding:5px 0;}
  .save-row input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;}

  /* ---------- PIPS / TRACKERS ---------- */
  .tracker{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .tracker:last-child{border-bottom:none;}
  .tracker .t-name{font-size:13.5px;font-weight:600;color:var(--text);min-width:190px;}
  .tracker .t-desc{font-size:11.5px;color:var(--text-faint);flex:1;min-width:160px;}
  .pips{display:flex;gap:6px;}
  .pip{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);
    cursor:pointer;background:transparent;transition:background .15s, box-shadow .15s;
  }
  .pip.used{background:radial-gradient(circle at 35% 30%, var(--violet), var(--violet-dim));box-shadow:0 0 8px rgba(148,80,216,0.8);border-color:var(--violet);}
  .pip.death{border-color:var(--bad);}
  .pip.death.death-success{border-color:var(--good);}
  .pip.death.death-success.used{background:radial-gradient(circle at 35% 30%, #8fc97e, var(--good));box-shadow:0 0 8px rgba(111,154,99,0.7);border-color:var(--good);}
  .pip.death.death-fail.used{background:radial-gradient(circle at 35% 30%, #e0685a, var(--bad));box-shadow:0 0 8px rgba(224,104,90,0.7);border-color:var(--bad);}
  .pip.fail{border-color:var(--text-faint);}

  /* ---------- SLOTS ---------- */
  .slot-lvl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .slot-lvl:last-child{border-bottom:none;}
  .slot-lvl .lvl-badge{font-family:var(--serif);font-weight:700;color:var(--gold-bright);width:78px;font-size:13px;}
  .slot-lvl input.maxslot{width:42px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-faint);border-radius:5px;font-size:11px;padding:3px 0;}

  /* ---------- RICH TEXT ---------- */
  .rich{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;
    padding:12px 14px;font-size:14px;line-height:1.65;color:var(--text);
  }
  .rich:focus{outline:none;border-color:var(--gold);}
  .rich b, .rich strong{color:var(--gold-bright);}
  /* Editor Master: consente di ridimensionare verticalmente (drag dell'angolo in basso
     a destra) i riquadri di testo modificabili, sullo stesso principio già usato per le
     Note. Attivo solo quando l'Editor Master è acceso (classe su <body>), quindi mai
     visibile o utilizzabile in modalità giocatore. */
  body.master-editor-on .rich[contenteditable]{
    resize:vertical;overflow:auto;min-height:60px;
  }
  body.master-editor-on .inv-item-desc{
    /* niente overflow:auto qui: la descrizione non deve mai avere uno
       scroll interno. Il Master può comunque ingrandirla manualmente
       (resize:vertical); se prova a ridurla sotto l'altezza del contenuto,
       il listener ResizeObserver in renderInvTable() la fa risnappare. */
    resize:vertical;overflow:hidden;min-height:44px;
  }
  /* Blocco 1: in Editor Master ogni riquadro/tabella (non solo l'inventario)
     deve potersi ridimensionare verticalmente, con lo stesso comportamento
     già usato per le Note: resize manuale dall'angolo in basso a destra. */
  body.master-editor-on .subcard,
  body.master-editor-on .tracker,
  body.master-editor-on textarea{
    resize:vertical;overflow:auto;
  }
  body.master-editor-on .subcard{min-height:80px;}
  body.master-editor-on .tracker{min-height:56px;}
  .subcard{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .subcard h3{margin:0 0 8px;font-family:var(--serif);font-size:14.5px;color:var(--gold-bright);letter-spacing:.4px;}
  .subcard .tag{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);background:rgba(255,255,255,0.05);border:1px solid var(--border-soft);border-radius:10px;padding:2px 9px;margin-bottom:8px;}
  .subcard .tag.tag-passiva{color:var(--amber);background:rgba(224,138,58,0.14);border-color:var(--amber-dim);}
  .subcard .tag.tag-truccetto{color:var(--blue);background:rgba(79,143,214,0.12);border-color:var(--blue-dim);}
  .subcard .tag.tag-abilita{color:var(--red-glow);background:rgba(201,70,59,0.14);border-color:rgba(201,70,59,0.45);}
  .subcard .tag.tag-incantesimo{color:var(--violet);background:rgba(148,80,216,0.12);border-color:var(--violet-dim);}
  .subcard .tag.tag-ambito{color:var(--teal);background:rgba(47,184,172,0.14);border-color:var(--teal-dim);}
  .subcard .tag.tag-campo{color:var(--good);background:rgba(111,154,99,0.14);border-color:rgba(111,154,99,0.45);}
  .subcard-grouped{grid-column:1/-1;}
  .subcard-subsection{padding-top:10px;margin-top:10px;border-top:1px dashed var(--border-soft);}
  .subcard-subsection:first-of-type{border-top:none;margin-top:6px;padding-top:0;}
  .subcard-subsection h4{margin:0 0 4px;font-size:13.5px;color:var(--gold-bright);font-family:var(--serif);}

  /* ---------- MASTER EDITOR (visibile solo in modalità Editor Master) ---------- */
  .master-toolbar{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-bottom:8px;padding:4px 6px;border-radius:6px;
    background:rgba(148,80,216,0.08);border:1px dashed var(--violet-dim);
  }
  .master-cat-select, .master-box-width{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:5px;font-size:10px;padding:2px 4px;max-width:120px;
  }
  .master-mini-btn, .master-mini-del{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:5px;font-size:11px;padding:2px 7px;cursor:pointer;line-height:1.3;
  }
  .master-mini-btn:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  .master-mini-del{color:var(--bad);}
  .master-mini-del:hover{border-color:var(--bad);}
  .master-eye-btn.is-hidden{color:var(--bad);border-color:rgba(176,74,63,0.5);}
  .master-hidden-item{opacity:0.55;border-style:dashed;}
  .master-add-btn{margin-top:8px;}
  .master-name-input{
    display:block;width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border-soft);
    color:var(--gold-bright);font-family:var(--serif);font-size:14.5px;letter-spacing:.4px;
    margin:0 0 8px;padding:0 0 4px;
  }
  .master-name-input:focus{outline:none;border-color:var(--gold-bright);}
  .master-tag-input, .master-uso-input{
    display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;
    background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:10px;padding:2px 9px;margin-bottom:8px;width:auto;max-width:220px;
  }
  [data-master-field][contenteditable="true"]{border-radius:4px;}
  [data-master-field][contenteditable="true"]:focus{outline:1px dashed var(--violet-dim);}
  .home-link{
    position:fixed;top:14px;left:16px;z-index:60;
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    text-decoration:none;white-space:nowrap;transition:border-color .15s, color .15s;
  }
  .home-link:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  @media (max-width:760px){
    .home-link{position:static;display:inline-flex;margin:0 0 10px;}
  }

  .master-editor-toggle{
    display:none;position:fixed;bottom:14px;left:16px;z-index:60;
    align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;white-space:nowrap;
  }
  .master-editor-toggle.show{display:flex;}
  .master-editor-toggle:hover{border-color:var(--gold-bright);}
  .master-editor-toggle.on{background:rgba(148,80,216,0.18);color:var(--violet);border-color:var(--violet);}
  @media (max-width:760px){
    .master-editor-toggle{position:static;margin:0 0 10px;}
  }

  .master-color-picker{
    display:none;position:fixed;bottom:60px;left:16px;z-index:60;
    align-items:center;gap:8px;padding:6px 12px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    white-space:nowrap;
  }
  .master-color-picker.show{display:flex;}
  .master-color-picker input[type=color]{
    width:30px;height:22px;border:none;border-radius:6px;padding:0;
    background:none;cursor:pointer;
  }
  @media (max-width:760px){
    .master-color-picker{position:static;margin:0 0 10px;}
  }

  /* ---------- EVOLUZIONI FUTURE (pannelli richiudibili) ---------- */
  .evo-note{font-size:12.5px;color:var(--text-faint);margin:-6px 0 14px;line-height:1.5;}
  .evo-level{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .evo-level:last-child{margin-bottom:0;}
  .evo-level summary{
    list-style:none;cursor:pointer;padding:12px 16px;font-family:var(--serif);font-size:14.5px;color:var(--gold-bright);
    display:flex;align-items:center;gap:8px;user-select:none;
  }
  .evo-level summary::-webkit-details-marker{display:none;}
  .evo-level summary::before{content:"\25B8";color:var(--gold);transition:transform .15s;}
  .evo-level[open] summary::before{transform:rotate(90deg);}
  .evo-level summary:hover{color:var(--gold);}
  .evo-content{padding:0 16px 16px 16px;border-top:1px solid var(--border-soft);padding-top:12px;}
  .evo-content p{margin:0 0 10px;}
  .evo-content p:last-child{margin-bottom:0;}

  /* ---------- EQUIP GRID ---------- */
  .equip-slot{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .equip-slot label{display:block;font-size:10px;text-transform:uppercase;color:var(--text-faint);letter-spacing:1px;margin-bottom:4px;}
  .equip-slot input{width:100%;background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:14px;}
  .equip-slot input:focus{outline:none;}
  .img-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .thumb{width:42px;height:42px;border-radius:7px;object-fit:cover;border:1px solid var(--border-soft);background:var(--bg-panel-3);cursor:pointer;}
  .thumb-placeholder{width:42px;height:42px;border-radius:7px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:17px;background:var(--bg-panel-3);cursor:pointer;flex-shrink:0;}
  .thumb-placeholder:hover, .thumb:hover{border-color:var(--gold);}
  /* Miniature Equipaggiamento: più grandi rispetto a quelle dell'Inventario */
  #equip-slots-grid .img-row{flex-wrap:wrap;gap:10px;}
  #equip-slots-grid .thumb, #equip-slots-grid .thumb-placeholder{width:96px;height:96px;border-radius:10px;}
  #equip-slots-grid .thumb-placeholder{font-size:30px;}
  .file-btn{font-size:10.5px;color:var(--text-dim);cursor:pointer;border:1px solid var(--border-soft);border-radius:6px;padding:4px 8px;background:var(--bg-panel-2);white-space:nowrap;}
  .file-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .file-input-hidden{display:none;}
  .img-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;}
  .img-remove:hover{color:var(--bad);}

  /* ---------- INGRANDIMENTO IMMAGINE (solo Equipaggiamento) ---------- */
  .img-zoom{
    background:none;border:1px solid var(--border-soft);border-radius:6px;color:var(--text-faint);
    cursor:pointer;font-size:13px;width:24px;height:24px;line-height:1;flex-shrink:0;
  }
  .img-zoom:hover{border-color:var(--gold);color:var(--gold-bright);}
  .img-lightbox{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;}
  .img-lightbox[hidden]{display:none;}
  .img-lightbox-backdrop{position:absolute;inset:0;background:rgba(10,8,7,0.95);backdrop-filter:blur(4px);}
  .img-lightbox-content{
    position:relative;width:100%;height:100%;max-width:min(98vw,2200px);max-height:97vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transform:scale(.96);opacity:0;transition:transform .16s ease,opacity .16s ease;
  }
  .img-lightbox.show .img-lightbox-content{transform:scale(1);opacity:1;}
  .img-lightbox-content img{display:block;max-width:100%;max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:12px;border:1px solid var(--border-soft);box-shadow:0 16px 60px rgba(0,0,0,0.6);}
  .img-lightbox-caption{color:var(--gold-bright);font-size:15px;font-weight:600;text-align:center;}
  .img-lightbox-caption[hidden]{display:none;}
  .img-lightbox-close{
    position:absolute;top:-16px;right:-16px;width:42px;height:42px;border-radius:50%;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    font-size:24px;line-height:1;cursor:pointer;
  }
  .img-lightbox-close:hover{border-color:var(--gold);color:var(--gold-bright);}
  @media (max-width:720px){
    .img-lightbox{padding:8px;}
    .img-lightbox-content{max-width:100vw;max-height:100vh;gap:10px;}
    .img-lightbox-content img{max-height:calc(100vh - 70px);}
    .img-lightbox-close{top:-13px;right:2px;width:38px;height:38px;font-size:22px;}
  }

  /* ---------- INVENTORY ---------- */
  .inv-cap{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .inv-bar{flex:1;min-width:200px;height:16px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;}
  .inv-bar-fill{height:100%;transition:width .3s, background .3s;}
  /* Elenco Inventario: card verticali, ordine Nome -> Descrizione -> Peso.
     La descrizione non ha altezza fissa né scroll interno: si espande col contenuto. */
  .inv-list{display:flex;flex-direction:column;gap:10px;}
  .inv-item{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .inv-item-top{display:flex;align-items:center;gap:10px;}
  .inv-item input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;}
  .inv-item .imgcell{flex-shrink:0;}
  .inv-item-name{background:transparent;border:none;color:var(--text);font-weight:600;font-size:14px;flex:1;min-width:0;}
  .inv-item-name:focus, .inv-item-desc:focus{outline:none;background:var(--bg-panel-3);border-radius:4px;}
  .inv-item-desc{
    display:block;width:100%;box-sizing:border-box;margin-top:8px;
    background:transparent;border:none;color:var(--text-dim);font-size:13px;font-family:var(--sans);
    line-height:1.5;resize:none;overflow:hidden;min-height:22px;padding:4px 2px;
  }
  .inv-item-peso{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
  .inv-item-peso label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);}
  .inv-item-peso input[type=number]{width:52px;background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:5px;text-align:center;font-family:var(--mono);}
  .inv-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;flex-shrink:0;}
  .inv-remove:hover{color:var(--bad);}

  /* ---------- PORTRAITS ---------- */
  .portraits{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){.portraits{grid-template-columns:1fr;}}
  .portrait{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-soft);}
  /* Il resize verticale nativo (angolo in basso a destra) \u00e8 disponibile
     solo in Editor Master: solo il Master controlla la dimensione del
     riquadro, il giocatore controlla solo immagine e didascalia. */
  body.master-editor-on .portrait{resize:vertical;}
  .portrait img{width:100%;display:block;filter:saturate(1.05) contrast(1.03);cursor:pointer;}
  /* Quando il riquadro ha un'altezza personalizzata (persistita dal
     Master), l'immagine usa object-fit:cover per non deformarsi mai. */
  .portrait.has-h img{height:100%;object-fit:cover;}
  .portrait .cap{
    position:absolute;bottom:0;left:0;right:0;padding:10px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
    font-family:var(--serif);letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:var(--gold-bright);
    border:none;outline:none;width:100%;box-sizing:border-box;
  }
  .portrait .cap:focus{background:linear-gradient(0deg, rgba(0,0,0,0.92), rgba(0,0,0,0.35));}

  /* ---------- NOTES ---------- */
  .note-entry{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .note-entry .note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .note-entry input[type=text]{background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:13px;width:70%;}
  .note-entry input[type=text]:focus{outline:none;}
  .note-entry textarea{background:transparent;border:none;color:var(--text);width:100%;min-height:70px;font-size:13.5px;}
  .note-entry textarea:focus{outline:none;}
  .note-date{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}

  .savebar{
    position:static;margin:28px 0 40px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    max-width:min(94vw, 620px);justify-content:flex-end;
    font-size:11px;color:var(--text-faint);
    background:rgba(20,16,14,0.9);border:1px solid var(--border-soft);border-radius:16px;
    padding:8px 10px;
  }
  .savebar b{color:var(--gold-bright);}
  .savebar .btn{padding:5px 11px;font-size:10.5px;border-radius:14px;}
  .savebar .sep{width:1px;height:16px;background:var(--border-soft);}
  .savebar.warn{border-color:var(--bad);}
  .savebar-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--gold-bright);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;flex-shrink:0;white-space:nowrap;
  }
  .savebar-toggle:hover{border-color:var(--gold-bright);}
  .savebar.collapsed{padding:6px 8px;gap:0;}
  .savebar.collapsed .savebar-content{display:none;}

  /* Su smartphone il riquadro comandi non deve restare "fixed" sopra i contenuti
     durante lo scroll: torna nel normale flusso della pagina, in fondo alla scheda. */
  @media (max-width:768px){
    body{ padding-bottom:0; }
    .savebar{
      position:static;
      bottom:auto; right:auto; left:auto; top:auto;
      width:auto; max-width:none;
      margin:24px 20px 20px;
      justify-content:center;
      backdrop-filter:none;
    }
  }
  .savebar #savebar-status.warn-text{color:#ff9d90;font-weight:600;}
  @media (max-width:760px){
    .pip{width:28px;height:28px;}
    .pips{gap:8px;}
    .btn{padding:10px 14px;font-size:13px;}
    .btn.small{padding:8px 12px;}
    .tab-btn{padding:14px 15px;}
  }
  #btn-print{background:linear-gradient(180deg, #22301f, #182013);border-color:var(--good);}
  #btn-print:hover{color:#b9e0ac;}

  .divider-label{font-family:var(--serif);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);margin:22px 0 8px;text-align:center;position:relative;}
  .divider-label::before,.divider-label::after{content:"";position:absolute;top:50%;width:38%;height:1px;background:var(--border);}
  .divider-label::before{left:0;}
  .divider-label::after{right:0;}

  /* ---------- TRACCIATO DEL CAOS ---------- */
  .caos-tracker{
    display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
    background:radial-gradient(ellipse at center, rgba(148,80,216,0.10), transparent 70%);
    border:1px solid var(--border-soft);border-radius:12px;padding:18px 20px;margin-bottom:16px;
  }
  .caos-pips{display:flex;gap:8px;}
  .caos-pip{
    width:26px;height:26px;border-radius:50%;border:2px solid #9450d8;background:transparent;cursor:pointer;
    transition:background .2s, box-shadow .2s, transform .15s;
  }
  .caos-pip:hover{transform:scale(1.08);}
  .caos-pip.on{
    background:radial-gradient(circle at 35% 30%, #ff8a4a, #c9463b);
    box-shadow:0 0 12px 3px rgba(255,138,74,0.7);border-color:#ff8a4a;
  }
  .caos-word{display:flex;gap:6px;font-family:var(--serif);font-weight:700;font-size:38px;letter-spacing:2px;}
  .caos-letter{
    color:var(--border-soft);text-shadow:none;transition:color .3s, text-shadow .3s, transform .3s;
    transform:scale(0.92);
  }
  .caos-letter.lit{transform:scale(1);}
  .caos-letter.lit:nth-child(1){color:#4fd1c5;text-shadow:0 0 14px rgba(79,209,197,0.8);}
  .caos-letter.lit:nth-child(2){color:#e0a85a;text-shadow:0 0 14px rgba(224,168,90,0.8);}
  .caos-letter.lit:nth-child(3){color:#e0524a;text-shadow:0 0 14px rgba(224,82,74,0.8);}
  .caos-letter.lit:nth-child(4){color:#9450d8;text-shadow:0 0 14px rgba(148,80,216,0.8);}
  .caos-flame{font-size:32px;filter:grayscale(1) opacity(0.25);transition:filter .3s, transform .3s;}
  .caos-flame.on{filter:none;opacity:1;animation:flamepulse 1.4s infinite;}
  @keyframes flamepulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .caos-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-faint);text-align:center;margin-top:6px;}
  .caos-col{display:flex;flex-direction:column;align-items:center;}

  /* ---------- SCHERMATA DI ACCESSO ---------- */
  #lock-screen{
    position:fixed;inset:0;z-index:9999;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.12), transparent 60%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .lock-box{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);border-radius:12px;
    padding:32px 30px;max-width:340px;width:100%;text-align:center;
  }
  .lock-box h2{
    font-family:var(--serif);color:var(--gold-bright);text-transform:uppercase;letter-spacing:1.6px;
    font-size:20px;margin:0 0 8px;
  }
  .lock-box p{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
  .lock-box input[type=password]{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:10px 12px;font-size:14px;width:100%;text-align:center;margin-bottom:12px;
  }
  .lock-box input:focus{outline:none;border-color:var(--gold);}
  .lock-box button{
    background:linear-gradient(180deg, #3a2a12, #241a0c);border:1px solid var(--gold);color:var(--gold-bright);
    border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;width:100%;
  }
  .lock-box button:hover{opacity:0.9;}
  .lock-error{color:#ff9d90;font-size:12px;margin-top:10px;min-height:14px;}

  /* ---------- STAMPA PULITA ---------- */
  @media print{
    @page{ margin:10mm; }
    body{ background:#fff !important; color:#111 !important; padding-bottom:0 !important; font-size:11px !important; }
    .tabbar, .savebar, .hero-hint, #hero-image-input, #import-input,
    .thumb, .thumb-placeholder, .file-btn, .img-remove, .img-row, .img-zoom, #img-lightbox,
    .inv-remove, #inv-add, #reset-slots, #reset-risorse, #lock-screen{ display:none !important; }
    .wrap{ padding:12px 0 !important; max-width:100% !important; }
    .hero{
      background:none !important; padding:2px 0 8px !important; border-bottom:2px solid #111 !important;
      cursor:default !important;
    }
    .hero::before{ display:none !important; }
    .hero-inner{ align-items:baseline !important; gap:8px !important; }
    .editable-name{ color:#000 !important; text-shadow:none !important; border:none !important; font-size:26px !important; }
    .hero-sub{ color:#444 !important; font-size:11px !important; margin-top:2px !important; }
    .hero-chip{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; backdrop-filter:none !important; padding:2px 9px !important; font-size:10.5px !important; }
    .hero-chip b{ color:#000 !important; }
    .hero-meta{ gap:6px !important; }

    .panel{ display:block !important; }
    .card, .subcard{
      background:#fff !important; border:1px solid #999 !important; box-shadow:none !important;
      page-break-inside:avoid; break-inside:avoid;
      padding:8px 10px !important; margin-bottom:6px !important; border-radius:5px !important;
    }
    .card h2{ color:#000 !important; border-bottom:1px solid #999 !important; font-size:10.5px !important; margin:0 0 6px !important; padding-bottom:3px !important; letter-spacing:.6px !important; }
    .card h2 small{ display:none !important; }
    input, textarea, select{ color:#000 !important; background:transparent !important; border:none !important; font-size:11px !important; padding:2px 3px !important; }
    .rich{ background:#fff !important; border:1px solid #ccc !important; color:#000 !important; padding:6px 8px !important; font-size:10.5px !important; line-height:1.4 !important; }
    .rich b, .rich strong{ color:#000 !important; }

    /* forza colonne compatte indipendentemente dal breakpoint a schermo */
    .grid{ gap:5px !important; }
    .grid-6{ grid-template-columns:repeat(6,1fr) !important; }
    .grid-4{ grid-template-columns:repeat(4,1fr) !important; }
    .grid-3{ grid-template-columns:repeat(3,1fr) !important; }
    .grid-2{ grid-template-columns:repeat(2,1fr) !important; }

    /* caratteristiche: molto più compatte */
    .abil-box{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .abil-box .name{ color:#000 !important; font-size:8.5px !important; letter-spacing:.3px !important; }
    .abil-box input[type=number]{
      color:#000 !important; background:transparent !important; border:none !important;
      font-size:13px !important; width:32px !important; margin:2px auto 1px !important; padding:0 !important;
    }
    .abil-box .mod{ color:#000 !important; font-size:13px !important; }

    .statpill{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .statpill label{ font-size:8.5px !important; margin-bottom:2px !important; }
    .statpill input{ color:#000 !important; font-size:12px !important; }

    .save-row, .skill-row{ padding:3px 4px !important; }
    .save-row .modbadge{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; padding:2px 0 !important; }
    .skill-row input, .inv-item input, .inv-item textarea{ color:#000 !important; }
    .skill-abbr{ background:#fff !important; border:1px solid #ccc !important; color:#333 !important; font-size:9px !important; padding:1px 0 !important; }

    .hp-row{ gap:8px !important; }
    .hp-numbers input{ padding:3px 0 !important; }
    .pip{ width:15px !important; height:15px !important; border-color:#000 !important; }
    .pip.used{ background:#000 !important; box-shadow:none !important; }
    .hp-track, .inv-bar{ height:12px !important; border:1px solid #000 !important; background:#fff !important; }
    .hp-fill, .inv-bar-fill{ background:#999 !important; }

    .equip-slot{ background:#fff !important; border:1px solid #ccc !important; padding:5px 6px !important; }
    .equip-slot label{ font-size:8.5px !important; }
    .equip-slot input{ color:#000 !important; font-size:11px !important; }

    .inv-item .imgcell{ display:none !important; }
    .inv-item{ padding:4px 5px !important; }
    .tracker{ padding:5px 0 !important; }
    .slot-lvl{ padding:4px 0 !important; }

    .portraits, .portrait{ display:none !important; }
    .caos-tracker{ background:#fff !important; border:1px solid #999 !important; }
    .caos-pip{ border-color:#000 !important; }
    .caos-pip.on{ background:#000 !important; box-shadow:none !important; }
    .caos-letter{ color:#ccc !important; text-shadow:none !important; }
    .caos-letter.lit{ color:#000 !important; text-shadow:none !important; }
    .caos-flame{ display:none !important; }
    .divider-label{ color:#444 !important; margin:10px 0 6px !important; font-size:9.5px !important; }
    .divider-label::before, .divider-label::after{ background:#999 !important; }

function slugify(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

/* Colore funzionale del "tag" di una capacit\u00e0, dedotto dal testo del tag stesso
   (non dall'array di appartenenza): Passiva = viola, Truccetto = blu, Abilit\u00e0/Incantesimo = rosso. */
function tagColorClass(tag){
  const t = String(tag || "");
  if (/^passiva/i.test(t)) return "tag-passiva";
  if (/^truccetto/i.test(t)) return "tag-truccetto";
  if (/incantesimo/i.test(t)) return "tag-incantesimo";
  if (/abilit/i.test(t)) return "tag-abilita";
  return "";
}
function renderAttacchiNav(){
  const masterOn = isMasterEditorOn();
  const links = [{label:'Poteri e risorse',tab:'poteri',anchor:'powers-slots'}];
  const groups = new Set();
  (STATE.sourceSections||[]).forEach((section,i)=>{
    if(section.location!=='equip'||(!masterOn&&section.hidden))return;
    const label=section.group||section.nome;
    if(!label||groups.has(label))return;
    groups.add(label);
    links.push({label,tab:'equip',anchor:'source-'+i});
  });
  return `<nav class="quicknav" aria-label="Dettagli di attacchi ed equipaggiamento">${links.map(l=>`<button type="button" class="quicknav-pill" data-jump-tab="${esc(l.tab)}" data-jump-anchor="${esc(l.anchor)}">${esc(l.label)}</button>`).join('')}</nav>`;
}
function bindQuicknav(){
  document.querySelectorAll(".quicknav-pill").forEach(el=>{
    el.addEventListener("click", ()=> jumpToAnchor(el.dataset.jumpTab, el.dataset.jumpAnchor));
  });
}
function jumpToAnchor(tabId, anchorId){
  const btn = document.querySelector('.tab-btn[data-tab="'+tabId+'"]');
  if (btn) btn.click();
  setTimeout(()=>{
    const el = anchorId ? document.getElementById(anchorId) : null;
    const target = el || document.getElementById("panel-"+tabId);
    if (target){
      target.scrollIntoView({behavior:"smooth", block:"start"});
      if (el){
        el.classList.add("anchor-flash");
        setTimeout(()=>el.classList.remove("anchor-flash"), 1500);
      }
    }
  }, 80);
}

SI PORTA E RITROVARSI NEL SUO “RIFUGIO” SE USA LA RUNA ASSEGNATA AD ESSO. SPESSO UTILE IN SITUAZIONE DI NECESSITA’.</p><p>UTILIZZABILI</p><p>2 x SCHIVATA (Max 2 x SCONTRO)</p><p>5 x RIFUGIO (Max 5 poi Slot LVL 1)</p><p>2 x TAVOLA G. (Max 2 x SCONTRO)</p><p>1 x RUNA CURA TATUATA (Max 1)</p>","equip":{"testa":"","gambe":"VESTE SEMPLICE","arma1":"PENNELLO DEL TRATTO VIVO","arma2":"","altro":"","corpo":"CAPPOTTO DI KAMUT","art1":"TAVOLA GAMMICA","art2":"CAVALLETTO DEL BIANCO PURO","art3":""},"equipImages":{"testa":"","gambe":"","arma1":"","arma2":"","altro":"","corpo":"","art1":"","art2":"","art3":""},"equipDettagli":"","inventario":[["✓","POZIONE RIVITALIZZANTE","2","x 2 Consente di recuperare 15 PF.",""],["✓","TACCUINO IN CUOIO","1","Taccuino da viaggio per appunti rapidi, idee di disegni, note su persone incontrate e intuizioni runiche; tutto ciò che viene scritto può essere trasferito automaticamente su un tomo più grande custodito nella SOGLIA PERSONALE, così da non perdere mai informazioni importanti. L’inchiostro usato è “riservato”: di base è leggibile solo dal possessore, ma può essere reso visibile anche ad altri a sua volontà.",""],["✓","KIT PULIZIA E MANUTENZIONE","2","Panno, olio leggero, aghi e filo, piccole fibbie/clip di ricambio per tenere in ordine equipaggiamento e indumenti durante il viaggio.",""],["✓","BORRACCIA PROFONDA (30L)","2","Borraccia runica che, una volta riempita, conserva una riserva interna fino a 30 litri senza aumentare l’ingombro esterno; permette di bere a lungo e di dosare l’acqua all’occorrenza.",""],["✓","RAZIONI LEGGERE (10)","2","Scorte da campo essenziali per lunghi spostamenti.",""],["✓","MONOLENTE D’OSSERVAZIONE","1","Monolente compatta capace di ingrandire sia a distanza (fino a circa 200 metri) sia su dettagli minuscoli, utile come binocolo e come “microscopio” da campo per leggere incisioni, studiare segni e controllare particolari.",""],["✓","BUSSOLA MULTIDIREZINALE","1","Bussola piccola e affidabile, fondamentale per orientarsi durante esplorazione e viaggi lunghi; può essere calibrata su rune specifiche poste su un oggetto, un luogo o un soggetto e puntare verso di esse, con un massimo di 5 rune memorizzabili contemporaneamente, selezionabili a volontà del PG.",""],["✓","ASTUCCIO SIGILLATO DEI DISEGNI","2","Tubo rigido cerato per proteggere fogli, mappe e schizzi, inciso con una runa di protezione che consente l’apertura solo al possessore, così da custodire appunti e disegni importanti senza rischio di manomissione; tutto ciò che viene inserito può essere automaticamente archiviato nel porta-disegni/mappe sito nel “Rifugio”, se il PG lo desidera, infilando la mano nell’astuccio può recuperare direttamente il foglio o la mappa specifica di cui ha bisogno.",""],["✓","CANDELA PROFUMATA INFINITA","1","Candela da viaggio che non si consuma mai; il profumo lieve aiuta a calmare la mente e a ritrovare lucidità, come un richiamo rassicurante a un luogo familiare quando ci si ferma per riposare.",""],["✓","5000 MONETE D’ORO","5","",""]],"capacitaMax":30,"passive":[],"abilita":[{"nome":"RUNA DELL’AMPLIFICAZIONE 🌟","desc":"<p>Quando il PG traccia la Runa dell’Amplificazione, i segni ancestrali si caricano di energia pura e vengono apposti sul bersaglio, entrando in risonanza con la sua essenza. Il potere runico non crea capacità nuove e non cambia la natura di ciò che tocca: lavora su ciò che esiste già, come un catalizzatore che prende un potenziale reale e lo spinge oltre il suo limite naturale. L’amplificazione non è “una forza cieca”, ma una forza controllata: riversa potenza, stabilità ed efficacia in ciò che il bersaglio è già in grado di fare, rendendo quel potenziale più intenso, più solido e più incisivo. Al momento dell’attivazione, il PG utilizza uno slot di livello compreso tra 1 e 5 e sceglie una caratteristica del bersaglio tra FORZA, DESTREZZA, COSTITUZIONE, INTELLIGENZA, SAGGEZZA o CARISMA; in base al livello dello slot impiegato, la caratteristica selezionata viene potenziata in modo crescente. Questo potenziamento non è solo un numero: insieme al valore numerico, la runa fa emergere anche una serie di benefici coerenti con la caratteristica amplificata. Ai livelli più bassi l’effetto è lieve e circoscritto, ai livelli intermedi diventa più evidente e funzionale, mentre ai livelli alti l’amplificazione prende forma avanzata e mostra la sua piena forza. In altre parole, la runa non si limita a “dare un bonus”: rende quella caratteristica più completa, più affidabile e più dominante nel modo in cui il bersaglio agisce. Quando la runa viene lanciata con uno slot di livello 5, il PG può scegliere due strade diverse: concentrare tutta l’amplificazione su una singola caratteristica del bersaglio, ottenendo il massimo incremento accompagnato da bonus più importanti e incisivi, oppure distribuire l’energia runica in modo uniforme, potenziando tutte le caratteristiche con un incremento più equilibrato e stabile, così da ottenere un effetto più versatile e meno specializzato. I benefici aggiuntivi legati alla runa vengono stabiliti dal master in base alla situazione e alla caratteristica scelta, ma chi utilizza la runa può proporre una declinazione specifica dell’amplificazione, cioè può spiegare “in che modo” quella caratteristica sta venendo potenziata; la proposta può essere accettata se resta coerente con la natura della runa e con l’equilibrio generale dell’abilità. Dopo l’apposizione, la runa crea anche una connessione più profonda: il PG entra in sintonia con la conformazione fisica e spirituale del bersaglio e può studiarne l’essenza in modo estremamente preciso, come se stesse leggendo una struttura interna fatta di istinto, natura e identità. Da questa connessione nasce un effetto importante: l’amplificazione può essere modellata con grande finezza, quasi come un abito cucito su misura, perché la runa non amplifica “in modo uguale per tutti”, ma tende ad adattarsi a ciò che sta toccando. I potenziamenti possono essere immagazzinati e utilizzati, ma “alle rune piace cambiare&quot; : l’amplificazione può cambiare nel tempo e, se scelto dal PG, può essere riorientata e rimodulata ogni volta, mantenendo però la coerenza con la caratteristica che viene potenziata e con la potenza dello slot impiegato.</p><p>LVL 1 : + 2 Micro Bonus</p><p>LVL 2 : + 4  Bonus Modici</p><p>LVL 3 : + 6 Bonus Media entita’</p><p>LVL 4 : + 8  Bonus Avanzati</p><p>LVL 5 : + 10 Macro Bonus / + 6 tutte le Caratteristiche + Bonus Media entita’</p>","width":3,"hidden":false},{"nome":"RUNA DELLA PROTEZIONE 🛡️","desc":"<p>Quando il PG incide la Runa della Protezione, non “crea uno scudo” nel senso comune e non attiva una magia tradizionale. Fa una cosa più simile a una legge: impone una regola runica che stabilisce come il bersaglio (o un’area scelta) deve reagire a ciò che è ostile. In pratica la runa decide, prima ancora che la minaccia arrivi fino in fondo, se quella minaccia verrà ridotta, assorbita, deviata, trattenuta, rimodulata oppure respinta. La cosa importante è questa: la runa non finge che l’evento non sia mai esistito. L’attacco, l’energia, la condizione avversa e l’interferenza esterna esistono davvero, ma la runa cambia il modo in cui i loro effetti “si trasformano” quando entrano in contatto con il bersaglio o con l’area protetta. Al momento dell’attivazione, il PG utilizza uno slot di livello compreso tra 1 e 5. Quel livello rappresenta quanto fortemente la legge runica viene imposta: a livelli bassi la protezione riesce a controllare soprattutto eventi semplici e localizzati; a livelli alti riesce a gestire minacce più complesse, più insistenti o più ampie. In base al livello dello slot, il PG sceglie un numero crescente di componenti difensive da un roster di sette. Queste componenti entrano in funzione insieme e possono sembrare “separate” o possono fondersi, sostenersi e diventare un’unica protezione più organica, purché restino coerenti con ciò che ciascuna componente fa davvero. La runa può essere apposta direttamente su un bersaglio oppure sul terreno: nel primo caso la regola difensiva segue quel bersaglio; nel secondo caso la regola difensiva si applica a chiunque si trovi dentro l’area creata, e la dimensione dell’area e la forza della protezione dipendono dal livello dello slot impiegato. Ogni attivazione della Runa della Protezione è unica, perché le stesse componenti possono manifestarsi in modo diverso in base alla minaccia affrontata e al contesto: la runa non cambia natura, ma cambia “resa”, cioè cambia come si presenta e come risolve il problema. Spetta al master valutare se l’effetto dichiarato rientra nei limiti delle componenti scelte e nell’intensità dello slot usato, accettando che la stessa combinazione possa risultare più o meno incisiva a seconda della situazione.</p><p>Al LIVELLO 1 il PG sceglie 1 componente.</p><p>Al LIVELLO 2 il PG sceglie 2 componenti.</p><p>Al LIVELLO 3 il PG sceglie 3 componenti.</p><p>Al LIVELLO 4 il PG sceglie 4 componenti.</p><p>Al LIVELLO 5 il PG può attivare tutte le componenti.</p><h4>1. MITIGAZIONE DEL DANNO</h4><p>Questa componente lavora sul momento più diretto della difesa: quando una forza ostile colpisce, la runa interviene sull’impatto prima che diventi un danno pieno. È come se la runa “rompesse” la forza in arrivo, la spezzasse, la scompensasse o la spostasse di lato, così che una parte non arrivi mai davvero a colpire con tutta la sua potenza. La mitigazione può presentarsi come dissipazione, deviazione o assorbimento parziale: cambia da situazione a situazione, ma il concetto resta lo stesso, cioè che la forza non viene lasciata esprimere al massimo. La parte più importante è che l’energia intercettata non è obbligata a sparire: può essere trattenuta e resa più “maneggiabile”, può essere rimodulata e riorganizzata, e può diventare una risorsa che il bersaglio può poi usare come rilascio controllato, come slancio offensivo o come potenziamento momentaneo. In pratica la runa non dice solo “subisci meno”, ma può anche dire “quello che hai intercettato non è perso: può trasformarsi in qualcos’altro”. Funzione tecnica: riduzione o assorbimento dei danni subiti, con possibilità di conversione della potenza intercettata in energia offensiva o rilascio reattivo.</p><h4>2. STABILIZZAZIONE DEL CORPO</h4><p>Questa componente non è pensata per un singolo colpo, ma per tutto ciò che “ti mangia nel tempo”. Protegge il bersaglio dagli effetti che peggiorano progressivamente e che, turno dopo turno, riducono la capacità di reggere lo scontro. La runa interviene su avvelenamenti, sanguinamenti, corrosioni, debilitazioni persistenti e condizioni che impongono penalità continuative o perdite graduali di risorse. La logica qui è molto semplice: il corpo non viene lasciato scivolare verso il collasso. Questa componente non è pensata per ripristinare ciò che è già stato perso; è pensata per impedire che la degradazione continui o si accumuli. In altre parole: non “guarisce”, ma impedisce che il bersaglio venga consumato e portato sempre più giù da effetti che lavorano lentamente.\u000b Funzione tecnica: prevenzione, riduzione o annullamento di danni ed effetti persistenti nel tempo.</p><h4>3. RESISTENZA AL CONTROLLO</h4><p>Questa componente difende la libertà d’azione. Non riguarda solo il corpo, ma anche la capacità di agire senza essere “messo in gabbia” da un controllo esterno. La runa contrasta tutto ciò che tenta di limitare, forzare o spezzare la volontà e la possibilità di compiere azioni: costrizioni fisiche, blocchi del movimento, paura, confusione, stordimento e influenze che impediscono di agire pienamente. Non rende il bersaglio intoccabile e non garantisce che certi effetti non possano mai agganciarsi; però fa sì che il bersaglio riesca a opporsi, a reagire e, soprattutto, a non restare intrappolato senza possibilità di risposta. È una componente che rende più difficile trasformare il bersaglio in un bersaglio “inerte” o “inermi”. Funzione tecnica: riduzione o contrasto di effetti che impediscono movimento, azioni o volontà.</p><h4>4. SCHERMATURA ENERGETICA</h4><p>Questa componente lavora sulle energie ostili: tutto ciò che è energia diretta, potere sovrannaturale, magie, incantesimi, fenomeno energetico o effetto che “arriva addosso” come una forza non solo fisica. La runa modifica il modo in cui quell’energia interagisce con il bersaglio o con l’area: può attenuarla, deviarla, assorbirla, disperderla o trattenerla per un momento, così che non esploda o non travolga con la sua forma piena. È importante che non si parla di annullamento totale: la runa non fa sparire l’energia come se non fosse mai esistita, ma ne altera traiettoria, intensità o comportamento, rendendola gestibile e trasformando un impatto “pieno” in un impatto “ridotto” o “ridistribuito”. Funzione tecnica: difesa contro effetti magici, energetici o sovrannaturali, tramite attenuazione, deviazione o assorbimento parziale.</p><h4>5. ANCORAGGIO</h4><p>Questa componente stabilisce un vincolo tra il bersaglio e la sua posizione. Il concetto è: “tu sei qui, e non è facile spostarti da qui”. La runa si oppone a spinte, trascinamenti, separazioni, dislocazioni, teletrasporti ostili e alterazioni non volontarie della posizione nello spazio. L’ancoraggio non significa per forza immobilità assoluta: un bersaglio può ancora muoversi di sua volontà, ma diventa estremamente difficile “strapparlo via”, isolarlo, portarlo dove non vuole o impedirgli di restare dove serve che resti. È una protezione contro il controllo dello spazio sul bersaglio. Funzione tecnica: prevenzione di spostamenti forzati e dislocazioni indesiderate.</p><h4>6. CONVERSIONE VITALE</h4><p>Questa componente prende una parte di ciò che la runa ha già intercettato (danno mitigato, energia assorbita, impatto ridotto) e lo rielabora in sostegno fisico. Non è una cura diretta che “fa comparire vita dal nulla”: è una compensazione difensiva. In pratica la runa dice: “se sono riuscito a prendere una parte della forza che ti avrebbe ferito, allora quella parte non deve essere sprecata; può diventare vigore, stabilità vitale o recupero limitato”. Può manifestarsi come punti ferita temporanei, come un recupero contenuto o come un rinforzo della resistenza del corpo. Il senso resta sempre lo stesso: una difesa che non si limita a ridurre, ma che trasforma una parte del negativo in sostegno. Funzione tecnica: trasformazione di parte del danno mitigato in beneficio vitale o punti ferita temporanei.</p><h4>7. RISPOSTA ISTINTIVA</h4><p>Questa componente rende la protezione attiva e reattiva. Invece di essere solo “un muro”, la runa sfrutta ciò che nel turno non viene usato e lo converte in risposta immediata. Il concetto è: se il bersaglio ha risorse non sfruttate (azioni, movimento, margini di tempo), la runa può riorganizzarle e trasformarle in reazioni difensive: schivate, piccoli spostamenti rapidi, contrasti o interventi fuori dal normale flusso. Non crea azioni dal nulla e non regala turni extra: prende ciò che esiste come potenziale e lo trasforma in una reazione, rendendo il bersaglio più difficile da prendere “fermo” o “inermi” quando arriva l’attacco. È una difesa che usa il momento giusto, non solo la resistenza. Funzione tecnica: conversione di azioni o movimenti non usati in reazioni difensive o contrasti.</p><p>LIVELLO 1 – EFFETTO MINORE</p><p>LIVELLO 2 – EFFETTO MODERATO</p><p>LIVELLO 3 – EFFETTO MEDIO</p><p>LIVELLO 4 – EFFETTO AVANZATO</p><p>LIVELLO 5 – EFFETTO SUPERIORE</p>","width":3,"hidden":false},{"nome":"RUNA DELLO SPAZIO 📥📤","desc":"<p>Quando il PG incide la Runa dello Spazio, sta intervenendo sulle regole che decidono dove si trova qualcosa, come si attraversa una distanza e che cosa significa essere “separati” o “vicini”. È come se lo spazio, che normalmente è rigido (prima sei qui, poi cammini, poi arrivi lì), diventasse più flessibile e più “scrivibile” tramite il segno runico. Questa runa permette di rendere lo spazio più fluido quando lo si percorre, di cambiare posizione senza passare dal tragitto, di richiamare un legame spaziale già esistente e di stratificare lo spazio in livelli, come se potesse avere più “strati” temporanei. In base all’intensità dello slot utilizzato, la runa può funzionare su spostamenti più semplici o più complessi, su distanze più brevi o più ampie, su legami spaziali fragili o molto solidi, e su configurazioni più o meno stabili. La Runa dello Spazio è divisa in quattro macro categorie: ognuna prende un pezzo preciso del concetto di “spazio” e lo rende manipolabile.</p><p>1. FLUSSO SPAZIALE</p><p>Il Flusso Spaziale riguarda attraversare lo spazio senza perdere continuità. Qui non si “salta” da un punto all’altro e non si cambia posizione all’istante. Il movimento esiste ancora, ma cambia il modo in cui il movimento avviene. È come se la runa rendesse il percorso più “scorrevole”, impedendo che il movimento venga spezzato facilmente da ciò che normalmente lo rallenta o lo interrompe. L’attrito, i rallentamenti, gli impedimenti ambientali e le pressioni che normalmente fanno perdere tempo diventano meno determinanti. Non significa che il terreno scompaia o che gli ostacoli non esistano; significa che lo spazio “percorribile” diventa più permissivo, come se la runa riducesse la severità della geometria del luogo. In pratica, il Flusso Spaziale permette di trasformare uno spostamento in una sequenza continua: invece di fermarsi, inciampare, perdere l’azione o spezzare il ritmo, il movimento resta un flusso unico che prosegue. Funzione tecnica: questa componente modella la continuità dello spostamento, rendendo meno efficaci o meno invalidanti gli elementi che interrompono, rallentano o frammentano un movimento, e rendendo più affidabile raggiungere un posizionamento anche attraverso percorsi complessi, senza “teletrasportare” e senza ignorare lo spazio intermedio.</p><h4>2. TRASPOSIZIONE DIRETTA</h4><p>La Trasposizione Diretta riguarda cambiare posizione senza attraversare lo spazio tra i due punti. Qui il movimento non viene migliorato: viene proprio sostituito. La runa non dice “muoviti meglio”, dice “ora sei lì”. Questo però non avviene in modo arbitrario, perché la Trasposizione Diretta ha un requisito chiaro: servono due riferimenti runici reali. Il primo è il segno attivo legato al punto di origine (cioè il punto da cui parte l’effetto, collegato al PG o alla runa che sta incidendo). Il secondo è un segno preesistente nel punto di destinazione, inciso in passato o comunque già presente, perché la runa deve “agganciare” quel punto e riconoscerlo come arrivo valido. Senza un segno reale di destinazione, la Trasposizione Diretta non ha un luogo a cui legarsi e non può essere “decisa a piacere”. Dentro questi limiti, la Trasposizione Diretta permette cambi netti di posizione: può spostare un soggetto o un oggetto su un punto segnato, può scambiare due collocazioni, può estrarre qualcosa da un punto segnato o inserirlo dentro un punto segnato, può ricollocare con precisione ignorando ostacoli e tragitto, purché l’aggancio runico esista davvero. Funzione tecnica: questa componente impone una nuova collocazione istantanea basata su due segni (origine attiva e destinazione preesistente), risolvendo problemi di posizione in modo diretto, riposizionare, scambiare, inserire, estrarre, sottrarre, senza attraversare lo spazio intermedio e senza dipendere dal percorso, ma sempre vincolata alla presenza reale dei segni.</p><h4>3. RICHIAMO SPAZIALE</h4><p>Il Richiamo Spaziale riguarda il concetto di legame: non “spostare a caso”, ma far prevalere una connessione spaziale già esistente. Se la Trasposizione Diretta è un cambio di posizione perché due punti sono segnati, il Richiamo Spaziale è un ritorno o un ricongiungimento perché esiste già una relazione tra un soggetto e un luogo, tra un oggetto e il suo vincolo, tra un’entità e una traccia che la lega a una destinazione. Questa componente non inventa destinazioni: funziona quando esiste già una connessione reale, come un segno inciso, una traccia, una risonanza o un vincolo stabilito. Anche qui c’è un requisito: servono due riferimenti, uno attivo e uno preesistente. Il riferimento attivo è il segno che “chiama” (determina cosa richiama o dove richiama). Il riferimento preesistente è il legame già presente sul bersaglio o sulla destinazione, perché la runa non deve creare un legame dal nulla: deve riattivarlo e farlo prevalere. Con il Richiamo Spaziale, qualcosa può tornare verso un punto segnato, un alleato può essere richiamato verso una runa incisa in precedenza, un oggetto può tornare al punto a cui era stato vincolato, una relazione spaziale può essere ristabilita anche se qualcosa l’ha interrotta o disturbata. È una componente che rende “affidabile” il concetto di ritorno: ciò che è legato, può essere ricondotto, se il segno lo richiama e se il legame esiste davvero. Funzione tecnica: questa componente riattiva e rafforza un vincolo spaziale già stabilito, costringendo il ritorno o il ricongiungimento verso un riferimento segnato, rendendo più difficile spezzare quella connessione con separazioni, spinte, dislocazioni o interferenze, e rendendo il richiamo più solido quanto più chiaro e profondo è il legame preesistente.</p><h4>4. SOVRAPPOSIZIONE SPAZIALE</h4><p>La Sovrapposizione Spaziale riguarda lo spazio come struttura a strati, non solo come distanza. È l’idea che qualcosa possa esistere “di lato” rispetto allo strato ordinario, pur restando reale, come se venisse temporaneamente spostato in un livello spaziale adiacente. Qui non si tratta semplicemente di spostare un bersaglio da A a B: si tratta di modificare la struttura dello spazio per contenere, isolare, deviare o mettere in contatto elementi che normalmente resterebbero separati. Questa componente permette, per esempio, di collocare temporaneamente un oggetto in uno strato spaziale vicino per trasportarlo o custodirlo senza che occupi volume nello spazio ordinario; permette di isolare un’energia o un evento perché i suoi effetti non si riversino subito sull’ambiente materiale; permette di deviare parte di un impatto fuori dallo strato ordinario senza annullarlo, come se una porzione della forza venisse “spostata di lato”; permette di creare dimensioni alternative; permette anche di gestire situazioni in cui due stati spaziali devono coesistere per un attimo, senza confondere i corpi e senza creare sovrapposizioni impossibili. In sintesi, è la componente che fa capire che lo spazio non è sempre un unico foglio piatto: a volte può diventare un foglio con un secondo foglio attaccato sopra, e la runa decide cosa va su quale strato e per quanto tempo. Funzione tecnica: questa componente stratifica lo spazio rendendolo temporaneamente permeabile o “a livelli”, consentendo di custodire, isolare, deviare, proteggere e creare contatti brevi tra stati spaziali differenti, gestendo eventi troppo distruttivi o ingombranti per lo strato ordinario senza trasformare la sovrapposizione in una separazione permanente o in un mondo alternativo stabile.</p>","width":3,"hidden":false},{"nome":"RUNA DEL TEMPO ⏳","desc":"<p>La Runa del Tempo interviene sulla sequenza degli istanti, sulla durata degli eventi e sulla memoria delle condizioni, rendendo il tempo qualcosa di modellabile e leggibile. Quando il PG incide questa runa, impone un principio semplice: il tempo non è obbligato a scorrere sempre uguale per tutti, nello stesso modo e con la stessa rigidità. La runa non serve a spostare le cose nello spazio e non serve a “riscrivere la storia del mondo” in modo libero; serve invece a dare quattro strumenti chiari, ognuno con un significato preciso: cambiare il ritmo con cui accadono le cose, riportare indietro lo stato di qualcosa già segnato, far ripetere un tratto di realtà dentro un perimetro definito, e simulare una linea temporale possibile per scegliere con lucidità. La runa può essere incisa su un bersaglio, su un oggetto, su un punto o su un’area, perché una runa è prima di tutto un segno: dove viene posta, lì il tempo comincia ad ascoltare. Più alto è lo slot usato, più la runa riesce a influire su intervalli più lunghi, su più bersagli, su aree più grandi e con maggiore stabilità; più basso è lo slot, più l’effetto rimane breve, piccolo e semplice.</p><h4>1. CROMIA DEL TEMPO</h4><p>La Cromia del Tempo è la parte più facile da immaginare perché funziona come una manopola: rende il tempo più veloce o più lento in un punto preciso. Non fa “viaggiare nel futuro” e non fa “tornare nel passato”: modifica solo il ritmo con cui gli istanti scorrono. Quando il tempo diventa più lento, tutto ciò che sta dentro quella cromia sembra muoversi con un peso addosso: le azioni richiedono più istanti per completarsi, le reazioni arrivano più tardi, gli spostamenti risultano più faticosi e ciò che succede matura più lentamente. Quando il tempo diventa più veloce, accade l’opposto: ciò che sta dentro quella cromia diventa più scorrevole, le azioni arrivano prima, le reazioni sono più pronte, le manovre si chiudono più rapidamente e le finestre di opportunità si aprono e si chiudono in modo diverso. La Cromia del Tempo può comprimere una breve durata perché qualcosa si chiuda prima o dilatarla perché qualcosa impieghi più tempo a compiersi; può rendere la cadenza di azioni e reazioni più fluida o più faticosa; può far perdere o guadagnare micro-frazioni di tempo senza trasformarle in teletrasporti temporali. Funzione tecnica: modula velocità, ritmo, durata breve e tempi di reazione di eventi già in corso o imminenti, rendendo il tempo più denso o più leggero attorno a ciò che viene colpito dalla runa.</p><h4>2. RICHIAMO DELLA CONDIZIONE</h4><p>Il Richiamo della Condizione governa la memoria temporale di un bersaglio segnato, permettendo di riportarlo a una condizione precedente registrata. È come dire: “ricordati com’eri”, e far tornare il bersaglio a quello stato. Qui non si rallenta e non si accelera niente: si lavora sulla memoria dello stato. Un soggetto, un oggetto o anche una condizione può essere segnato con una condizione di riferimento, come se la runa scattasse una fotografia invisibile. Quando poi qualcosa cambia quello stato (una ferita, una condizione debilitante, una trasformazione, uno sfasamento, un effetto che altera l’assetto), il Richiamo può riportare il bersaglio alla condizione registrata, ristabilendo assetto, postura, continuità di un effetto, integrità funzionale o condizioni temporanee definite al momento della marcatura. Questo non significa cancellare la storia del mondo: il mondo non dimentica ciò che è successo; è il bersaglio che viene riportato dentro il perimetro di ciò che era stato segnato, come se la runa imponesse di nuovo quello stato. Funzione tecnica: ripristina un set di condizioni salvate su un bersaglio segnato, facendo prevalere lo stato registrato contro alterazioni recenti, senza annullare gli eventi del mondo, ma cambiando di nuovo lo stato del bersaglio.</p><h4>3. ECO DEL CICLO</h4><p>L’Eco del Ciclo è il concetto del “loop”: il PG sceglie un pezzo di tempo recente e impone che quel pezzo si ripeta. Questa macrocategoria non riporta indietro solo una creatura a una condizione, ma può far tornare indietro una porzione di realtà inclusa nel segno. La runa può essere impressa su un’area, su un campo, su uno o più bersagli segnati, su un oggetto o su un punto, e può forzare la ripetizione di una finestra temporale recente, riportando ciò che è stato incluso nel ciclo a uno stato precedente e facendolo accadere di nuovo. La runa crea un confine (anche solo concettuale) e, dentro quel confine, tutto ciò che è stato incluso viene riportato indietro della finestra scelta e la scena si ripete. Non è un loop infinito: è una ripetizione controllata che permette di correggere un errore, ripetere un’azione in modo diverso, evitare una conseguenza, salvare qualcuno o ribaltare un evento dentro un perimetro definito. La differenza rispetto al Richiamo della Condizione è netta: nel Richiamo viene riportato indietro lo stato di una cosa; nell’Eco del Ciclo viene riportato indietro il tratto di realtà che la circonda. La memoria del ciclo può essere gestita dal PG: può far sì che tutti ricordino, può far sì che ricordino solo alcuni, oppure può essere così dominante da far conservare il ricordo anche ai nemici; questo dipende da come viene impostato il segno e da quanta potenza viene investita nella runa. Funzione tecnica: crea una ripetizione temporale reale e limitata, riportando indietro una finestra recente su ciò che è incluso nel ciclo, permettendo di ripetere la sequenza con esiti diversi.</p><h4>4. VISIONE DEL BIVIO</h4><p>La Visione del Bivio governa la simulazione di una linea temporale possibile, non come viaggio nel futuro, ma come proiezione che viene attraversata per scegliere. È come fare una prova “senza che conti davvero”, ma non è un trucco gratuito: è una simulazione guidata dalla runa. Il PG sceglie un’azione o una direzione e la runa gli permette di attraversare per un breve tratto una linea possibile del tempo, osservando come evolverebbe quella scelta; poi, prima che quella linea diventi definitiva, il PG torna indietro al punto in cui aveva scelto e decide se confermare quella direzione o intraprenderne un’altra. Qui sta la differenza rispetto all’Eco del Ciclo: nel ciclo il mondo viene davvero riportato indietro e ripetuto; nella Visione del Bivio il mondo non viene resettato perché quella linea non si era ancora fissata come realtà completa: è una possibilità vista, poi scartata o confermata. Anche la memoria è modulabile: normalmente resta al PG, ma può essere condivisa con alleati o estesa anche a un avversario, se il segno include chi viene legato alla visione e se la potenza investita lo rende possibile. Funzione tecnica: permette di esplorare una linea temporale possibile e tornare al punto di scelta mantenendo la memoria di ciò che è stato visto, così da confermare o cambiare azione senza aver fissato definitivamente la prima linea come realtà.</p>","width":3,"hidden":false},{"nome":"RUNA DELLA CURA 🌿","desc":"<p>Quando il PG incide la Runa della Cura, non sta “creando vita dal nulla” e non sta lanciando una guarigione come se fosse una magia tradizionale. Sta imponendo una regola runica che dice al corpo e allo spirito una cosa molto chiara: “torna in ordine, ricomponiti, riallineati”. Questa runa lavora sulla ricostruzione, sulla stabilizzazione e sulla continuità della vita, come se il segno elfico riuscisse a rimettere al posto giusto ciò che è stato spezzato, consumato o destabilizzato. La sua natura è profondamente elfica: non forza la realtà con un miracolo improvviso, ma guida il bersaglio verso una condizione più sana e più stabile, ricucendo ciò che è ferito e calmando ciò che è in disordine. Al momento dell’attivazione, il PG utilizza uno slot di livello compreso tra 1 e 5. Il livello dello slot rappresenta quanto “in profondità” la runa riesce a lavorare: a livelli bassi l’intervento è semplice, breve e mirato; a livelli intermedi diventa più completo e affidabile; a livelli alti la runa riesce a intervenire su stati più complessi e su una stabilizzazione molto più solida. La runa può essere apposta su un bersaglio, su un corpo o su una creatura in condizioni critiche, oppure su un punto o un’area se il PG vuole che la regola di cura agisca come “presenza” nel luogo; in quel caso, però, l’effetto resta sempre coerente con il concetto di ripristino vitale e la sua potenza dipende dallo slot impiegato. La cosa importante da capire è che la Runa della Cura non serve solo a “curare tanti danni”. La cura qui è a 360 gradi, perché la runa non vede solo la ferita: vede la vitalità nel suo insieme. Questo significa che può lavorare su più funzioni vitali avanzate, non necessariamente legate al numero di danni subiti. Può ricucire e ripristinare, ma può anche riportare il corpo a una condizione più efficiente e più stabile, ad esempio riducendo o annullando affaticamenti, calmando condizioni di sfavore fisico, riequilibrando una stanchezza profonda, stabilizzando un organismo che sta cedendo, ripulendo il “rumore” interno che rende il bersaglio meno lucido o meno reattivo, e rimuovendo quei blocchi vitali che non sono ferite aperte ma sono comunque un problema reale per la resa del corpo. In altre parole: questa runa può guarire, ma può anche “rimettere in sesto” in senso ampio, come se riportasse il bersaglio da uno stato di decadimento a uno stato di funzionalità. Questa runa non è pensata per sostituire tutte le difese o tutte le protezioni: non riduce l’impatto degli attacchi come una regola difensiva, ma interviene dopo che il danno o la condizione hanno colpito e cerca di ricomporre. Proprio per questo, il suo risultato non è mai identico ogni volta: la runa fa sempre cura, ma la cura può manifestarsi in modi diversi in base a ciò che il bersaglio sta subendo. In alcuni casi ricuce una ferita, in altri stabilizza un collasso, in altri ancora annulla un affaticamento o riequilibra una condizione fisica sfavorevole che sta limitando il bersaglio. La regola generale resta sempre la stessa: la runa porta il bersaglio verso una condizione migliore, più stabile e più viva, senza trasformarlo in qualcosa di diverso da ciò che è. Il modo più corretto di immaginarla è questo: la runa “legge” il bersaglio e individua dove la vitalità sta cedendo o perdendo efficienza, poi usa l’energia runica per riordinare quella parte. Più alto è lo slot, più la runa legge con precisione, più riesce a intervenire su più aspetti insieme e più riesce a mantenere stabile il risultato. Il master definisce la resa concreta del ripristino in base alla situazione e all’intensità dello slot, ma il PG può proporre come la cura debba manifestarsi (più ricucitura, più stabilizzazione, più recupero, più eliminazione di affaticamenti e condizioni fisiche sfavorevoli), e quella proposta può essere accettata se resta coerente con la natura della runa e con l’equilibrio del livello impiegato.</p>","width":3,"hidden":false},{"nome":"RUNA DELLA MATERIA 🪨","desc":"<p>Quando il PG incide la Runa della Materia, impone una regola runica concreta che governa come la materia si dispone, che FORMA assume, quanto VOLUME occupa e quanto è DENSA. In questa runa, FORMA e MATERIA restano inseparabili: cambiare la FORMA significa riorganizzare la sostanza; cambiare la STAZZA significa cambiare il rapporto tra VOLUME e DENSITÀ; cambiare la CONSISTENZA significa cambiare quanto la materia “tiene” o “cede” pur restando reale. La runa viene incisa su un OGGETTO, su una porzione definita di esso o su una STRUTTURA fisica; lavora sulla materia delle cose e non è pensata come mutaforma di creature viventi. In base allo slot utilizzato, la riscrittura può essere più intensa, stabile e complessa, ma mantiene sempre un principio chiave: la runa non inventa proprietà magiche nuove e non trasforma un oggetto comune in un oggetto leggendario; rende la materia più adatta a una funzione fisica, modificando FORMA, VOLUME e DENSITÀ in modo coerente con il materiale. Questa runa permette quattro famiglie di intervento, che il PG può scegliere e combinare entro limiti credibili e compatibili con l’oggetto:</p><p>FORMA / STRUTTURA: piegare, aprire, compattare, distendere, irrigidire o rendere flessibile, creare incastri, agganci e prese, rifinire una funzione concreta, ottenere protezioni fisiche semplici senza aggiungere poteri nuovi.</p><p>STAZZA / VOLUME: rendere un oggetto più grande o più piccolo, più ingombrante o più tascabile, più esteso o più concentrato, variando lo spazio che occupa senza alterarne la natura di base.</p><p>DENSITÀ / CONSISTENZA: rendere la materia più compatta e resistente oppure meno densa e più “larga”, modificando anche peso, tenuta, rigidità e cedevolezza, sempre in modo coerente col materiale.</p><p>CREAZIONE (SOTTOCATEGORIA ECCEZIONALE): questo e’ un  processo molto più complesso, perché costringe la materia a diventare un OGGETTO completo, co
