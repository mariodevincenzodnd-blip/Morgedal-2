é l’effetto dichiarato resti coerente con ciò che la natura presente può davvero offrire.\r\n\r\n\r\n\r\n\r\n   * FLORA RISONANTE: questa macrocategoria governa l’interazione con il verde e con tutto ciò che cresce o appartiene al “corpo” vegetale del luogo, come se la runa stabilisse un linguaggio muto con radici, cortecce, foglie, roccia. Il PG può guidare la flora verso risposte semplici e coerenti che rendono l’ambiente più favorevole: far emergere o piegare radici, rami ed edera perché diventino appigli e passaggi credibili, intrecciare liane come prese temporanee, rendere una parete più scalabile senza “costruirla”, stabilizzare un terreno che cede, rendere meno penalizzante un dislivello o un tratto impervio, e in generale trasformare uno spazio naturale in un percorso più “utilizzabile” senza cancellare la realtà del luogo. Allo stesso tempo, il PG può addensare e orientare vegetazione e detriti naturali per ottenere copertura rapida e irregolare: fronde più fitte, rovi che si chiudono, foglie e canne che schermano, barriere di frasche che spezzano una linea di tiro e riducono l’esposizione. La flora può anche diventare un velo percettivo: ombre che spezzano la sagoma, foglie che si muovono nel momento giusto, fruscii che spostano l’attenzione, tracce che si mescolano, odori e direzioni che confondono, rendendo più difficile individuare, seguire o “puntare” con precisione ciò che la runa sta proteggendo. In pratica, questa macrocategoria fa sì che il verde “aiuti” a salire, a riparare, a sparire per un attimo, a passare dove prima era scomodo, e a rendere il campo meno leggibile per chi ti cerca. Funzione tecnica: mobilità e posizionamento tramite appigli e stabilizzazione naturali, creazione di copertura leggera o medio-leggera, occultamento leggero e confusione percettiva coerente con l’ambiente vegetale.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n   * FAUNA OPERATIVA: questa macrocategoria governa l’interazione con la parte viva e mobile della natura: animali, creature minori, stormi, insetti, presenze notturne, e in generale ciò che si muove e reagisce per istinto. La runa non promette “obbedienza assoluta”, perché gli animali non diventano marionette: rende però possibile una comprensione molto più chiara dei loro segnali e un contatto immediato che permette al PG di comunicare in modo semplice e diretto, intuire intenzioni, calmare o allontanare, attirare, e soprattutto chiedere cooperazione compatibile con l’indole e le possibilità reali della creatura presente. Questo significa che il PG può usare la fauna come supporto pratico: ottenere una vedetta che segnali presenze, far coprire una ritirata con distrazioni naturali (movimenti, richiami, passaggi che attirano lo sguardo), chiedere a creature minori di “disturbare” o rendere scomoda un’area (ronzii, piccoli morsi, intralci istintivi), o semplicemente ottenere indicazioni istintive su ciò che è pericoloso o anomalo nel territorio. Se serve raggiungere una posizione, la fauna può diventare un mezzo: una grande aquila o un corvo robusto possono aiutare in uno spostamento breve e contestuale, una cavalcatura naturale può permettere di coprire rapidamente un tratto, oppure un animale adatto può offrire un sostegno fisico credibile nel superare un ostacolo. Se serve esplorare o “leggere” l’ambiente, la fauna può offrire capacità che il PG non ha: talpe o creature scavatrici possono aprire un varco o un tunnel grezzo dove il terreno lo consente, pipistrelli o creature simili possono aiutare a percepire spazi, vuoti e ostacoli tramite eco e vibrazioni, e insetti o piccoli animali possono attraversare fessure e riportare reazioni utili. In combattimento, quando il contesto lo permette, il PG può ottenere anche un aiuto più attivo: non un’evocazione dal nulla, ma un intervento reale e coerente di animali presenti o richiamabili dal territorio, con azioni semplici (distrarre, intralciare, segnalare, frapporsi, trasportare, spostare piccoli oggetti, rompere una linea di vista). Più il luogo è “vivo”, più la fauna risponde con varietà; più il luogo è sterile o innaturale, più questa macrocategoria diventa difficile da far fruttare. Funzione tecnica: comunicazione e comprensione animale, influenza istintiva lieve (calmare/attirare/allontanare), richiesta di cooperazione contestuale e supporto operativo tramite creature realmente presenti (mobilità, esplorazione, distrazione, intralcio leggero, supporto ambientale).\r\n\r\n\r\nAnche con queste due diramazioni, la Runa della Natura resta volutamente “aperta”: la natura è viva, varia e piena di eccezioni, quindi il PG può attribuire alla runa usi creativi anche non citati parola per parola, purché siano coerenti con ciò che è presente nel luogo e con quello che flora e fauna possono davvero fare. La regola resta sempre la stessa: niente creazione dal nulla e niente risultati innaturali perfetti, ma guida e collaborazione di ciò che esiste già. Il PG può proporre un uso nuovo, può mescolare le due macrocategorie, può trovare una soluzione alternativa “da sopravvivenza”, e l’effetto prende forma in modo credibile in base al contesto e all’intento dichiarato.\r\n\r\n\r\nQUANTITA’ - 20 -\r\n\r\n\r\nRUNA DELLA SINERGIA ✨\r\nTRUCCHETTO\r\nQuando il PG incide la Runa della Sinergia, non sta lanciando una runa “in più”: sta facendo una cosa diversa, molto più rara e più delicata. Sta prendendo due leggi runiche separate e le sta costringendo a respirare nello stesso segno, nello stesso istante, come se la runa diventasse un telaio capace di intrecciare fili diversi senza spezzarli. È una runa che non nasce per creare un nuovo potere dal nulla, ma per fondere ciò che già esiste nel repertorio del PG, costruendo una forma unica e temporanea che dura solo per l’evento o per lo scontro in cui viene incisa. La sensazione, quando questa runa viene attivata, è che il segno “tiri” su di sé tutto il peso delle rune coinvolte, le faccia combaciare e poi le lasci esplodere insieme in un’unica manifestazione coerente, come se fossero state progettate per stare una dentro l’altra.\r\nLa Runa della Sinergia permette al PG di usare un solo slot per ottenere un effetto composto, cioè un’unica runa che contiene più funzioni provenienti da rune diverse. Non si parla di spendere più risorse, ma di comprimere più significati runici dentro lo stesso sigillo. La sinergia non inventa, non supera i limiti concettuali delle rune di partenza: le fonde, le fa cooperare, e le obbliga a manifestarsi insieme. La Runa della Sinergia funziona come un “ponte” tra rune. Prima di incidere il segno, il PG dichiara quali rune vuole intrecciare e quale obiettivo vuole ottenere, poi la runa costruisce un’unica manifestazione che contiene entrambe le nature. Il livello dello slot usato diventa il “tetto” dell’intera fusione: non significa che ogni runa dentro la sinergia è automaticamente al massimo, significa che la forza complessiva della runa composta è quella dello slot impiegato, e la resa concreta viene modellata in modo che le due funzioni convivano senza trasformarsi in due lanci completi separati. In altre parole: non è “due rune intere al costo di una”, è “una runa unica che porta dentro due anime e le fa lavorare insieme”. La runa può essere incisa come tutte le altre: su un bersaglio, su un oggetto, su un punto o su un’area, purché la forma scelta sia coerente con le rune che si stanno fondendo. Se la fusione include una runa che normalmente vive su un bersaglio e un’altra che vive su un’area, la sinergia può trovare una soluzione intermedia, ma deve restare leggibile: il segno non deve diventare un paradosso, deve diventare una regola chiara che si applica in un modo chiaro.\r\nQuesta runa ha anche una natura “aperta” e progressiva, ma senza dirlo in modo esplicito e numerico: il PG che continua a studiare la sinergia, che la usa con intelligenza e che ne comprende i limiti, può arrivare a creare fusioni sempre più raffinate, più pulite e più complete. Non è solo una questione di potenza: è una questione di controllo, di precisione e di capacità di far convivere più significati runici senza farli collassare. Per questo motivo, la runa lascia sempre spazio a evoluzioni future, senza dichiararle come regole fisse: è un potere che cresce nella qualità e nella complessità delle combinazioni possibili, non solo nella forza bruta. Durante la creazione della runa sinergica, il PG dovra’ rimanere in concentrazione. Più la runa sara’ sinergicamente potente più tempo e potere dovra’ impiegare il PG per generarla. Tutte le rune create possono essere immagazzinate e riutilizzate all'occorrenza, ovviamente spendendo gli stessi slot e tempo di generazione. Poiche’ estremamente potente, deve essere utilizzata con cautela in base al livello dello slot il PG avra’ a disposizione tot SINERGIE da poter creare nell’arco di un riposo lungo. (In casi di estrema necessita’ e di forte concentrazione si potrebbe valutare l’ipotesi di usare piu’ SINERGIE di quelle concesse)\r\nLVL 1 - 2 = 3 SINERGIE                    LVL 3 - 4 = 2 SINERGIE                     LVL 5 = 1 SINERGIA \r\nVADEMECUM CREAZIONE\r\nVADEMECUM CREAZIONE\r\n\r\n\r\n- PROMEMORIA DADI\r\nD2 (moneta) · D4 · D6 · D8 · D10 · D12 · D20 · D100 normale o percentuale.\r\nIl D20 serve quasi sempre per capire se “riesci” (prove, colpire, tiri salvezza).\r\nI dadi come D4/D6/D8/D10/D12 servono quasi sempre per dire “quanto” (cura, danni, scudi, quantità).\r\nIl D100 è una percentuale (spesso si fa con due D10: uno per le decine e uno per le unità).                                                    D20 e D100 possono essere utilizzati per grandi danni. Generalmente se si vuole aumentare i danni inflitti è preferibile utilizzare più dadi perché “+ Dadi = + Danni”.                                                                                                       Esempio : Palla di Fuoco al lvl 5 deve fare massimo 100 danni, invece di 1D100 useremo 5D20 o 10D10.\r\n- COME PARTIRE: “COSA VOGLIO FARE?”\r\nInizia sempre con una domanda secca: COSA VOGLIO FARE? Voglio curare, Voglio proteggere, Voglio spostare, Voglio rallentare, Voglio potenziare. In base alla risposta analizza le rune che hai a disposizione e cosa fanno. Se nella frase ci sono due effetti grandi, il modo più semplice e veloce è separarli, ma in casi estremi ricordati che hai a disposizione la RUNA DELLA SINERGIA\r\n- LE 5 COSE CHE UNA RUNA DEVE AVERE \r\n   1. Su chi agisce (bersaglio)\r\nDevi sempre sapere se la runa riguarda te stessa, un alleato, un nemico, oppure un’area. Questa scelta decide quanto dev’essere “contenuta”: una runa su un solo bersaglio può permettersi più potenza; una runa ad area o su più bersagli, invece, deve stare più attenta a durata e forza perché impatta molte cose insieme.\r\n\r\n   2. Da dove la fai funzionare (gittata)\r\nLa distanza cambia la comodità della runa. Contatto significa che devi esporti e avvicinarti; una gittata media ti permette di restare al sicuro; una gittata lunga ti dà controllo da lontano. Più la runa è comoda da lanciare lontano, più è importante tenerla chiara (potenza o durata più gestibili). Anche solo ricordarsi “quanto lontano posso farla partire?” evita metà delle confusioni al tavolo.\r\n\r\n   3. Quanto dura (durata)\r\nUna runa può essere istantanea (succede e finisce) oppure durare per un certo tempo (turni, minuti…). La durata è una delle leve più forti del gioco: un effetto anche “normale”, se dura tanto, diventa enorme. Per questo, quando crei una runa, chiediti sempre: “deve essere un colpo secco o un effetto che resta?” e “quanto mi serve davvero che resti?”.\r\n\r\n   4. Che posto occupa nel tuo turno (azione/bonus/reazione)\r\nDi solito nel turno si ha un’Azione/Attacco, a volte una Bonus, e il Movimento; la Reazione è un “intervento” fuori turno quando scatta una condizione. Una runa da Azione può permettersi di essere più importante. Una runa da Bonus deve essere più semplice o più piccola (perché la sommi a un’altra azione). Una runa da Reazione è spesso difensiva o “al momento giusto”, e quindi va tenuta molto chiara e immediata. Scegliere questo punto ti fa capire subito quanto la runa può essere “grossa”.\r\n\r\n   5. Se influenza un nemico, come può resistere (difesa)\r\nSe la runa cura o potenzia un alleato, di solito non serve che qualcuno “resista”. Se invece la runa dà fastidio a un nemico (lo rallenta, lo blocca, lo sposta controvoglia, gli impedisce di fare bene qualcosa), allora quasi sempre deve esistere una via di difesa: un Tiro Salvezza (TS), una prova contrapposta, o un tiro per colpire, effettuato con un D20.\r\n\r\n\r\n\r\n- POTENZA: DADI O NUMERI, MA SEMPRE CON CRESCITA\r\nLa potenza si può esprimere con dadi oppure con numeri fissi. L’importante è non scegliere “a caso”, ma pensare già alla scala fino al 5.\r\nEsempio con numeri: se a livello 1 fai 10, poi deve crescere in modo leggibile (spesso raddoppio o crescita costante: 10→20→40→60→100, con il 5 che può “staccare” un po’).\r\nEsempio con dadi: stesso concetto, D4→D6→D8→D12→D20. Non è obbligatorio usare i dadi: sono solo un modo comodo per non perdere coerenza.\r\n- EFFETTI SPECIALI: QUANDO CI STANNO\r\nUn effetto “speciale” (secondario) si può aggiungere, ma di norma ha senso quando i livelli sono già alti, perché altrimenti la runa diventa troppo piena. La regola pratica: fino ai livelli bassi fai effetti puliti; ai livelli alti puoi permetterti il “plus”, purché resti coerente col tipo di runa.\r\n- CHE COSA SIGNIFICA DAVVERO LIVELLO 1→5\r\nLivelli 1–2: “piccolo e chiaro”\r\nEffetti brevi, potenza bassa, un solo bersaglio o impatto limitato. Sono i livelli dove la runa deve essere facile da usare e difficile da abusare.\r\nLivelli 3–4: “medio e solido”\r\nQui iniziano durata più comoda, impatto più visibile, possibilità di toccare meglio il campo (senza diventare onnipotenti). È anche il punto in cui puoi iniziare a pensare a piccole variazioni intelligenti, ma senza strafare.\r\nLivello 5: “apicale”\r\nÈ il massimo attuale: pochi slot, potenza alta. Qui puoi sbilanciarti di più: o un salto di potenza, o un effetto speciale davvero significativo, o un controllo più incisivo. Il livello 5 deve “sentirsi” diverso, perché è raro e prezioso.\r\nLivello 6: “devastante”\r\nÈ un Livello Bonus, alcuni hanno la possibilità di raggiungerlo per concentrazione altri per superamento di limite di potenza, altri come Mary, hanno la possibilità di crearli. Essendo estremamente raro, questo Slot richiede massima attenzione, ma in linea di massima ha molto margine d’azione poiché allo stato attuale rappresenta l’espressione massima di un Incantesimo/Abilità.\r\n- SUGLI SLOT \r\nLo slot non è solo “quanto forte”: è quanto spazio ti concedi. Più lo slot è alto, più puoi permetterti potenza e/o complessità, soprattutto dal 4 e ancora di più al 5. Il 5, proprio perché è raro, può reggere l’effetto speciale migliore.\r\n- IL “PEGNO” NON È OBBLIGATORIO, MA È UNO STRUMENTO\r\n Non è vero che una runa forte deve per forza pagare sempre. Però, quando una runa è molto comoda (lunga durata + tanta distanza + tanti bersagli + grande potenza), allora per equilibrio conviene scegliere almeno un limite. Non come punizione: come modo per tenere la runa giocabile e chiara.\r\n      * dura poco\r\n      * ha poca distanza\r\n      * colpisce un solo bersaglio\r\n      * richiede concentrazione\r\n\r\n\r\n\r\n\r\n- COME NON ANDARE IN LOOP (quando non sai cosa fare)\r\nNon partire dalla runa: parti dal bisogno del momento. COSA VOGLIO / DEVO FARE ? Sopravvivere (cura/protezione), muoversi (spazio), impedire una cosa (tempo), potenziare l’azione chiave (amplificazione).\r\n- PROMEMORIA DA TENERE IN TESTA\r\nUna runa è sempre: “una frase chiara” + “chi” + “distanza” + “durata” + “quanto è forte” (+ “difesa se colpisce un nemico”).\r\n- CONSIGLIO TATTICO (timing di combattimento)\r\nGestione Azioni nel Turno :                                                                                                                                                                Le 4 azioni sono un vantaggio enorme, ma vanno amministrate: non devono diventare “quattro attacchi fissi”, altrimenti Mary smette di essere supporto e soprattutto rinuncia alla sua forza principale, cioè il controllo della scena. Una regola semplice è trattare quelle 4 azioni come un budget da dividere ogni turno tra tre bisogni:                                                                                     (1) posizione sicura / vantaggiosa                                                                                                                   (2) rune utili al momento                                                                                                                     (3) eventuali attacchi.                                                                                                                                    Se in un turno devi riposizionarti molto (perché ti hanno puntata o perché vuoi un’angolazione migliore), puoi spendere 1–2 azioni per Natura/Materia e tenere le altre 2 per una runa “chiave” + un attacco (o due attacchi se la runa non serve). Se invece sei già in posizione perfetta, puoi dedicare più azioni alle rune: una per proteggere/curare/amplificare e una per svantaggiare un nemico, lasciando le restanti per attacco o micro-spostamenti. L’errore più comune da evitare è fare “solo danno” quando la squadra sta rischiando: in quel caso anche un singolo intervento di Protezione/Cura/Amplificazione al momento giusto vale più di due attacchi.                                     Prima sicurezza e vantaggio, poi stabilizzazione degli alleati, poi controllo del nemico, e solo alla fine attacco.\r\nGestione Rune :                                                                                                                                                         Mary deve ragionare come “regista” dello scontro: non vince stando nel mucchio, vince scegliendo dove stare e in che ordine intervenire. La priorità è sempre creare vantaggio tattico e sopravvivere: usare Protezione, Natura e Materia per tenersi lontana dalla linea di fuoco, cambiare posizione, dissimulare la propria presenza, celarsi dietro coperture o punti difficili da raggiungere, e soprattutto non farsi mai “agganciare” dal nemico. Il suo turno va pensato come una sequenza: prima mettersi al sicuro o riposizionarsi (se serve), poi intervenire sugli alleati, e solo dopo, quando la squadra è stabilizzata, iniziare ad Attaccare e Disturbare i nemici. In pratica, il loop mentale è: proteggere gli alleati (Runa della Protezione), curarli se necessario (Runa della Cura) oppure potenziarli nel momento giusto (Runa dell’Amplificazione); appena la linea amica regge, passare a creare svantaggio e controllo sul nemico con Tempo, Spazio o Spirito, scegliendo ogni volta l’opzione più utile alla situazione (rallentare chi sta arrivando, spostare/impedire un ingaggio, spezzare un’azione chiave, confondere o limitare). Solo se resta “spazio mentale e d’azione” dopo aver sistemato posizionamento e runa/e fondamentali, allora conviene convertire il resto in attacchi: Mary può fare danni, ma il suo valore vero è far sì che gli altri facciano danni meglio e più a lungo.\r\n- REGOLA MADRE :                                                                                                                                                 Quando hai dubbi perplessità o incertezze CHIEDI AL MASTER e il gioco è fatto.\r\n\r\n\r\nNOTE\r\n\r\n\r\nPENNELLO DEL TRATTO VIVO: Un pennello antico, con manico scuro e finiture dorate, usato da artisti itineranti capaci di trasformare il disegno in gesto reale. Il pennello non “evoca” materia: crea solo inchiostro animato, solido quel tanto che basta per colpire, afferrare, proteggere o sostenere per un tempo breve, poi si sfalda e svanisce. Il PG può disegnare su tela o su un supporto adatto, ma può anche comandare a distanza l’inchiostro già depositato in un punto, come se tracciasse direttamente lì. Le creazioni possono essere offensive o di utilità (barriere, prese, fruste, appigli, scudi, blocchi, trascinamenti, ecc.) e la loro stabilità dipende da quanto sono grandi e/o dettagliate: più sono complesse, più richiedono attenzione e tendono a essere meno stabili. Il PG ha un tetto massimo di danni per turno (40) da commutare in dadi : se genera più creazioni offensive, divide quel totale tra di loro (es. 4 creazioni piccole = 4 colpi separati che si spartiscono il massimale). Di norma il personaggio avrebbe 2 AZIONI e 2 ATTACCHI nel turno; quando impugna il Pennello, AZIONI e ATTACCHI si fondono in un unico totale di 4 “interventi” ridistribuibili liberamente (fino a 4 azioni, 4 attacchi o combinazioni), senza influenzare l'azione di movimento/uso oggetti. Un disegno piccolo richiede 1 intervento, un disegno medio 2 interventi, un disegno grande tutti e 4, con possibilità di combinare (es. 2 piccoli + 1 medio). Il PG può anche impiegare tutti e 4 gli interventi solo in tratto e concentrazione per completare una creazione ancora più grande o complessa, rinunciando ad altro nel turno; il “peso” non dipende solo dalla taglia: contano anche precisione, controllo e funzioni specifiche. Evocazioni Persistenti : quando si parla degli ATTACCHI, il PG può scegliere di non creare colpi istantanei ma una vera e propria evocazione d’inchiostro (corvi, bestie, figure animate); una volta generata, finché non viene eliminata o distrutta, rimane sul territorio e diventa la fonte dei suoi attacchi: finché presente, il PG può continuare a usare quella forma per colpire spendendo 1 solo punto Azione. La permanenza non ha un tempo fisso: dipende dall’inchiostro investito e dai danni/dispersione; ogni evocazione ha Punti Ferita propri e resta in campo fino a distruzione/eliminazione/trasformazione in runa. La quantità di inchiostro disponibile è limitata: più grande e dettagliata è l’evocazione, più inchiostro rimane impegnato e meno il PG ne avrà per generare altre cose; taglia e numero di evocazioni dipendono dagli interventi spesi nel turno: 1 intervento = una forma piccola (es. 1 corvo), 2 interventi = due forme piccole o una media, 4 interventi = una forma grande o più forme minori, secondo le regole già indicate. Il PG può mantenere attive fino a un massimo di 4 evocazioni piccole, oppure 2 medie, oppure 1 grande; spendendo l’intero turno in tratto e concentrazione può evocarne direttamente una grande sul campo (impiegando tutti e 4 gli interventi solo per disegnare), rinunciando ad altro nel turno. Le evocazioni possono trasformarsi in una runa su un punto (terreno, oggetto, bersaglio) al contatto, permettendo al PG di imprimere rune tramite i disegni oltre che tracciarle su tela o a terra. Il pennello nasconde un’anima lama: in casi estremi viene usato come coltello, infliggendo 2D6 danni per ogni attacco disponibile. Passiva : il pennello può assorbire solo il colore di ciò che tocca (pigmenti, tinte, vernici, polveri, tracce cromatiche) e replicarlo nel suo inchiostro; non copia proprietà, poteri o effetti, prende esclusivamente la cromia. Abilità Speciale : anche una sola chiazza d’inchiostro su terreno, oggetto o bersaglio può diventare un punto di comando; in un secondo momento il PG può farla espandere, muovere o trasformare in una creazione a distanza, come se stesse disegnando direttamente su quel punto.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nPENNELLO DEL TRATTO VIVO : Un pennello antico, con manico scuro e finiture dorate, usato da artisti itineranti capaci di trasformare il disegno in gesto reale. Il pennello non “evoca” materia: ciò che crea è sempre e solo inchiostro animato, solido quel tanto che basta per colpire, afferrare, proteggere o sostenere per un tempo breve, poi si sfalda e svanisce. Il PG può disegnare su tela o su un supporto adatto, ma può anche comandare a distanza l’inchiostro già depositato in un punto, come se stesse tracciando direttamente lì. Il PG ha un tetto massimo di danni per turno (40): se genera più creazioni offensive, divide quel totale tra di loro (esempio 4 creazioni piccole = 4 colpi separati che si spartiscono il massimale). Le creazioni possono essere offensive o di utilità (barriere, prese, fruste, appigli, scudi, blocchi, trascinamenti, ecc.) e hanno durata breve e non fissa: più una creazione è grande o dettagliata, più richiede attenzione e tende a essere meno stabile; più è semplice, più è rapida ma meno “fine” nelle funzioni. Di norma il personaggio avrebbe 2 AZIONI e 2 ATTACCHI nel turno. Quando impugna il Pennello del Tratto Vivente, AZIONI e ATTACCHI si fondono in un unico totale di 4 “interventi” ridistribuibili liberamente in base a ciò che disegna (fino a 4 azioni, fino a 4 attacchi, o combinazioni) il tutto non influenza l’azione di movimento/utilizzo oggetti del PG. Un disegno piccolo ne richiede 1, un disegno medio 2, un disegno grande tutti e 4, con possibilità di combinare (es. 2 piccoli + 1 medio). Il PG può anche impiegare tutti e 4 gli interventi solo in concentrazione e tratto per completare una creazione ancora più grande o complessa, rinunciando ad altro nel turno. Il costo non dipende solo dalla grandezza: conta anche la completezza e la precisione del disegno. Due creazioni della stessa taglia possono quindi “pesare” in modo diverso, perché più il PG pretende dettagli, controllo e funzioni specifiche, più la creazione richiede attenzione. \r\nEvocazioni Persistenti “Forma d’Inchiostro” : Quando si parla degli ATTACCHI del personaggio, il PG può scegliere di non creare colpi “istantanei”, ma di generare una vera e propria evocazione d’inchiostro (es. corvi, bestie, figure animate). Una volta generata, finché non viene eliminata o distrutta, l’evocazione rimane sul territorio e diventa la fonte dei suoi attacchi: finché è presente, il PG può continuare a usare quella forma per colpire spendendo 1 solo punto Azione. La permanenza non ha un tempo fisso: dipende da quanto inchiostro è stato investito e da quanto la creazione viene danneggiata o dispersa. Ogni evocazione ha Punti Ferita propri e resta in campo fino a distruzione/eliminazione/trasformazione in runa. La quantità di inchiostro disponibile è limitata: più grande e più dettagliata è l’evocazione, più inchiostro “rimane impegnato” in essa e meno il PG ne avrà a disposizione per generare altre cose. La taglia dell’evocazione e il numero di evocazioni dipendono dagli “interventi” spesi nel turno: 1 intervento = una forma piccola (es. 1 corvo), 2 interventi = due forme piccole o una media, 4 interventi = una forma grande o più forme minori, secondo le regole già indicate. Le evocazioni possono trasformarsi in una runa su un punto (terreno, oggetto, bersaglio) al contatto, permettendo al PG di “imprimere” rune tramite i suoi disegni oltre che disegnarle su tela o a terra. Il PG può mantenere contemporaneamente attive fino a un massimo di 4 evocazioni di taglia piccola, oppure 2 medie, oppure 1 grande. “Spendendo” l’intero turno in tratto e concentrazione può evocarne direttamente una grande sul campo (impiegando tutti e 4 gli interventi solo per disegnare), rinunciando ad altro nel turno.\r\nIl pennello nasconde un’anima lama: in casi estremi viene usato come coltello, infliggendo 2D6 danni per ogni attacco disponibile.\r\n(Passiva) : Il pennello può assorbire solo il colore di ciò che tocca (pigmenti, tinte, vernici, polveri, tracce cromatiche) e replicarlo nel suo inchiostro. Non copia proprietà, poteri o effetti: prende esclusivamente la cromia.\r\nAbilità Speciale : Anche una sola chiazza d’inchiostro lasciata su terreno, oggetto o bersaglio può diventare un punto di comando. In un secondo momento il PG può farla espandere, muovere o trasformare in una creazione a distanza, come se stesse disegnando su quel punto.","heroBgPos":{"x":50,"y":20},"heroBgImage":"","heroBgZoom":1,"truccetti":[{"nome":"SOGLIA PERSONALE","desc":"<p>Il PG mantiene sempre attiva una particolare Runa dello Spazio legata al proprio luogo personale, un “posto sicuro” che non ha collocazione reale nel mondo di Morgedal: non è in un punto preciso, non è raggiungibile seguendo una strada, e non esiste come edificio ancorato al terreno, ma come stanza sospesa in uno spazio etereo, protetta dal fatto stesso di non appartenere a nessun luogo. Quando il PG lo desidera, può apporre un sigillo di soglia su una porta qualsiasi e, spendendo un’azione, trasformare quell’ingresso in un varco temporaneo: aprendo la porta entra nella sua stanza, una sala ampia ma raccolta, silenziosa e stabile, pensata per trovare pace, riorganizzarsi e sentirsi al riparo. Il varco risponde alla volontà del PG: chiunque può entrare insieme a lui o subito dopo, senza dover ricevere sigilli o marchi, purché il PG lo permetta. Se invece il PG non lo desidera, l’accesso rimane negato: per chiunque altro quella porta non conduce alla stanza e non può essere attraversata, se non tramite interventi eccezionali o forze mistiche particolari. Una volta chiusa o dissolto il sigillo, la porta torna a essere una porta normale e il collegamento svanisce come se non fosse mai esistito. Dopo 5 utilizzi il PG dovra’ utilizzare uno slot lvl 1 / CD 16.</p>","hidden":false,"width":3,"uso":""},{"nome":"RUNE DI SANGUE","desc":"<p>Il PG porta sul corpo rune tatuate che funzionano come le sue rune normali, ma invece dell’inchiostro consumano la sua linfa vitale: ogni volta che le usa perde Punti Ferita in base alla potenza dello slot impiegato, quindi più alto è lo slot più il costo in PF è pesante. Sulle braccia (coperte dall’abbigliamento) ha le rune più utili e di primo utilizzo, tre sul braccio sinistro e tre sul destro, scelte tra PROTEZIONE, AMPLIFICAZIONE, NATURA, SPAZIO, TEMPO e MATERIA; sulla schiena invece ha un tatuaggio più grande che è la RUNA DELLA CURA, che può usare normalmente come tutte le altre pagando il costo in PF, ma che nasconde anche una modifica di emergenza che si attiva solo quando il PG è davvero in pericolo di vita e solo se decide lei di richiamarla. Abilità Speciale : In estrema urgenza, una volta per riposo lungo, il PG può “aprire” la runa grande sulla schiena e forzare il corpo a reggere oltre il limite: i suoi PF massimi diventano 150 e ottiene +3 alla CA; da quel momento ogni utilizzo di una runa tatuata costa sempre -10 PF a prescindere dallo slot (anche se è di livello 1). In questo stato tutte le rune tatuate risultano amplificate negli effetti, e inoltre il PG ottiene 1 slot di livello 5 gratuito da usare una sola volta mentre la modalità è attiva. Quando il PG torna al suo massimale naturale di PF può scegliere di disattivare la modalità. Al momento dell’attivazione il suo corpo si ricopre di strisce nere come se la linfa vitale venisse canalizzata e scritta sulla pelle. (CD 16 PER  USARE RUNE)</p>","hidden":false,"width":3,"uso":""},{"nome":"FORGIATURA LINFATICA","desc":"<p>Grazie al potere della linfa, il PG può assimilare, commutare e trasformare il proprio potere in “potenza grezza”, trasferendola a un altro personaggio sotto forma di slot ripristinati. Il bersaglio li recupera come se li avesse riottenuti naturalmente, ma può ricevere questo beneficio una sola volta fino al successivo riposo lungo (o pausa molto prolungata). La forgiatura richiede sempre concentrazione continua: in combattimento conta in turni consecutivi, fuori dal combattimento richiede comunque tempo e dedizione totali; in entrambi i casi, se il PG viene colpito, disturbato o perde la concentrazione, non annulla tutto, ma la progressione arretra di 1 turno e deve essere ricostruita per completare il processo. Il PG può scegliere tre modalità: ripristinare un singolo slot (turni pari al livello: 1/2/3/4/5), ripristinare tutta la fascia di slot di un livello (turni pari a livello +2: 3/4/5/6/7), oppure ripristinare tutti gli slot (10 turni). Quest’ultima modalità è estrema: quando si completa, sia chi emette sia chi riceve subiscono -20 PF non curabili fino al termine dello scontro, perché lo sforzo supera i limiti del corpo e della linfa.</p>","hidden":false,"width":3,"uso":""},{"nome":"RUNA DELLA NATURA 🌿","desc":"<p>Quando il PG incide la Runa della Natura, imprime un segno che non “crea” potere dal nulla, ma risveglia e orienta ciò che è già vivo nel mondo, come se la realtà naturale riconoscesse la grammatica runica e decidesse di collaborare. Questa runa esiste per dare soluzioni pratiche, elastiche e credibili: muoversi meglio in un ambiente ostile, trovare copertura dove prima c’era solo esposizione, confondere la vista dove prima era netto, e ottenere aiuto da ciò che vive attorno, senza trasformare la natura in un comando assoluto. La Runa della Natura lavora sempre su un principio semplice: rende “più disponibile” ciò che è naturale, lo piega verso un intento preciso e poi lascia che torni al suo equilibrio; non costruisce strutture perfette, non produce oggetti impossibili, non garantisce effetti permanenti. Se il luogo è ricco di vita o di elementi naturali (vegetazione, terra, rocce, legno, radici, acqua, polvere, detriti), la runa trova più facilmente materia su cui agire; se il luogo è sterile o completamente artificiale, può comunque tentare di funzionare, ma la resa diventa più povera, più fragile o più breve. La Runa della Natura racchiude due macro categorie, che possono essere usate singolarmente o intrecciate tra loro, purché l’effetto dichiarato resti coerente con ciò che la natura presente può davvero offrire.</p><p>FLORA RISONANTE: questa macrocategoria governa l’interazione con il verde e con tutto ciò che cresce o appartiene al “corpo” vegetale del luogo, come se la runa stabilisse un linguaggio muto con radici, cortecce, foglie, roccia. Il PG può guidare la flora verso risposte semplici e coerenti che rendono l’ambiente più favorevole: far emergere o piegare radici, rami ed edera perché diventino appigli e passaggi credibili, intrecciare liane come prese temporanee, rendere una parete più scalabile senza “costruirla”, stabilizzare un terreno che cede, rendere meno penalizzante un dislivello o un tratto impervio, e in generale trasformare uno spazio naturale in un percorso più “utilizzabile” senza cancellare la realtà del luogo. Allo stesso tempo, il PG può addensare e orientare vegetazione e detriti naturali per ottenere copertura rapida e irregolare: fronde più fitte, rovi che si chiudono, foglie e canne che schermano, barriere di frasche che spezzano una linea di tiro e riducono l’esposizione. La flora può anche diventare un velo percettivo: ombre che spezzano la sagoma, foglie che si muovono nel momento giusto, fruscii che spostano l’attenzione, tracce che si mescolano, odori e direzioni che confondono, rendendo più difficile individuare, seguire o “puntare” con precisione ciò che la runa sta proteggendo. In pratica, questa macrocategoria fa sì che il verde “aiuti” a salire, a riparare, a sparire per un attimo, a passare dove prima era scomodo, e a rendere il campo meno leggibile per chi ti cerca. Funzione tecnica: mobilità e posizionamento tramite appigli e stabilizzazione naturali, creazione di copertura leggera o medio-leggera, occultamento leggero e confusione percettiva coerente con l’ambiente vegetale.</p><p>FAUNA OPERATIVA: questa macrocategoria governa l’interazione con la parte viva e mobile della natura: animali, creature minori, stormi, insetti, presenze notturne, e in generale ciò che si muove e reagisce per istinto. La runa non promette “obbedienza assoluta”, perché gli animali non diventano marionette: rende però possibile una comprensione molto più chiara dei loro segnali e un contatto immediato che permette al PG di comunicare in modo semplice e diretto, intuire intenzioni, calmare o allontanare, attirare, e soprattutto chiedere cooperazione compatibile con l’indole e le possibilità reali della creatura presente. Questo significa che il PG può usare la fauna come supporto pratico: ottenere una vedetta che segnali presenze, far coprire una ritirata con distrazioni naturali (movimenti, richiami, passaggi che attirano lo sguardo), chiedere a creature minori di “disturbare” o rendere scomoda un’area (ronzii, piccoli morsi, intralci istintivi), o semplicemente ottenere indicazioni istintive su ciò che è pericoloso o anomalo nel territorio. Se serve raggiungere una posizione, la fauna può diventare un mezzo: una grande aquila o un corvo robusto possono aiutare in uno spostamento breve e contestuale, una cavalcatura naturale può permettere di coprire rapidamente un tratto, oppure un animale adatto può offrire un sostegno fisico credibile nel superare un ostacolo. Se serve esplorare o “leggere” l’ambiente, la fauna può offrire capacità che il PG non ha: talpe o creature scavatrici possono aprire un varco o un tunnel grezzo dove il terreno lo consente, pipistrelli o creature simili possono aiutare a percepire spazi, vuoti e ostacoli tramite eco e vibrazioni, e insetti o piccoli animali possono attraversare fessure e riportare reazioni utili. In combattimento, quando il contesto lo permette, il PG può ottenere anche un aiuto più attivo: non un’evocazione dal nulla, ma un intervento reale e coerente di animali presenti o richiamabili dal territorio, con azioni semplici (distrarre, intralciare, segnalare, frapporsi, trasportare, spostare piccoli oggetti, rompere una linea di vista). Più il luogo è “vivo”, più la fauna risponde con varietà; più il luogo è sterile o innaturale, più questa macrocategoria diventa difficile da far fruttare. Funzione tecnica: comunicazione e comprensione animale, influenza istintiva lieve (calmare/attirare/allontanare), richiesta di cooperazione contestuale e supporto operativo tramite creature realmente presenti (mobilità, esplorazione, distrazione, intralcio leggero, supporto ambientale).</p><p>Anche con queste due diramazioni, la Runa della Natura resta volutamente “aperta”: la natura è viva, varia e piena di eccezioni, quindi il PG può attribuire alla runa usi creativi anche non citati parola per parola, purché siano coerenti con ciò che è presente nel luogo e con quello che flora e fauna possono davvero fare. La regola resta sempre la stessa: niente creazione dal nulla e niente risultati innaturali perfetti, ma guida e collaborazione di ciò che esiste già. Il PG può proporre un uso nuovo, può mescolare le due macrocategorie, può trovare una soluzione alternativa “da sopravvivenza”, e l’effetto prende forma in modo credibile in base al contesto e all’intento dichiarato.</p><p>QUANTITA’ - 20 -</p>","hidden":false,"width":3,"uso":""},{"nome":"RUNA DELLA SINERGIA ✨","desc":"<p>Quando il PG incide la Runa della Sinergia, non sta lanciando una runa “in più”: sta facendo una cosa diversa, molto più rara e più delicata. Sta prendendo due leggi runiche separate e le sta costringendo a respirare nello stesso segno, nello stesso istante, come se la runa diventasse un telaio capace di intrecciare fili diversi senza spezzarli. È una runa che non nasce per creare un nuovo potere dal nulla, ma per fondere ciò che già esiste nel repertorio del PG, costruendo una forma unica e temporanea che dura solo per l’evento o per lo scontro in cui viene incisa. La sensazione, quando questa runa viene attivata, è che il segno “tiri” su di sé tutto il peso delle rune coinvolte, le faccia combaciare e poi le lasci esplodere insieme in un’unica manifestazione coerente, come se fossero state progettate per stare una dentro l’altra.</p><p>La Runa della Sinergia permette al PG di usare un solo slot per ottenere un effetto composto, cioè un’unica runa che contiene più funzioni provenienti da rune diverse. Non si parla di spendere più risorse, ma di comprimere più significati runici dentro lo stesso sigillo. La sinergia non inventa, non supera i limiti concettuali delle rune di partenza: le fonde, le fa cooperare, e le obbliga a manifestarsi insieme. La Runa della Sinergia funziona come un “ponte” tra rune. Prima di incidere il segno, il PG dichiara quali rune vuole intrecciare e quale obiettivo vuole ottenere, poi la runa costruisce un’unica manifestazione che contiene entrambe le nature. Il livello dello slot usato diventa il “tetto” dell’intera fusione: non significa che ogni runa dentro la sinergia è automaticamente al massimo, significa che la forza complessiva della runa composta è quella dello slot impiegato, e la resa concreta viene modellata in modo che le due funzioni convivano senza trasformarsi in due lanci completi separati. In altre parole: non è “due rune intere al costo di una”, è “una runa unica che porta dentro due anime e le fa lavorare insieme”. La runa può essere incisa come tutte le altre: su un bersaglio, su un oggetto, su un punto o su un’area, purché la forma scelta sia coerente con le rune che si stanno fondendo. Se la fusione include una runa che normalmente vive su un bersaglio e un’altra che vive su un’area, la sinergia può trovare una soluzione intermedia, ma deve restare leggibile: il segno non deve diventare un paradosso, deve diventare una regola chiara che si applica in un modo chiaro.</p><p>Questa runa ha anche una natura “aperta” e progressiva, ma senza dirlo in modo esplicito e numerico: il PG che continua a studiare la sinergia, che la usa con intelligenza e che ne comprende i limiti, può arrivare a creare fusioni sempre più raffinate, più pulite e più complete. Non è solo una questione di potenza: è una questione di controllo, di precisione e di capacità di far convivere più significati runici senza farli collassare. Per questo motivo, la runa lascia sempre spazio a evoluzioni future, senza dichiararle come regole fisse: è un potere che cresce nella qualità e nella complessità delle combinazioni possibili, non solo nella forza bruta. Durante la creazione della runa sinergica, il PG dovra’ rimanere in concentrazione. Più la runa sara’ sinergicamente potente più tempo e potere dovra’ impiegare il PG per generarla. Tutte le rune create possono essere immagazzinate e riutilizzate all'occorrenza, ovviamente spendendo gli stessi slot e tempo di generazione. Poiche’ estremamente potente, deve essere utilizzata con cautela in base al livello dello slot il PG avra’ a disposizione tot SINERGIE da poter creare nell’arco di un riposo lungo. (In casi di estrema necessita’ e di forte concentrazione si potrebbe valutare l’ipotesi di usare piu’ SINERGIE di quelle concesse)</p><p>LVL 1 - 2 = 3 SINERGIE                    LVL 3 - 4 = 2 SINERGIE                     LVL 5 = 1 SINERGIA</p>","hidden":false,"width":3,"uso":""}],"sourceSections":[{"nome":"🏡 RIFUGIO 🏡","desc":"<p>Totale massimo stivabile 500P</p><p>SCRITTOIO DEL TOMO INFINITO : Ampio scrittoio con sopra un tomo sempre “aperto” e pronto, dove confluiscono automaticamente tutte le scritte e gli appunti che il PG registra sul proprio taccuino personale o su fogli segnati con rune dello SPAZIO; il tomo funge da archivio completo e ordinato, consultabile nella SOGLIA PERSONALE. 25P</p><p>BAULE DEI DISEGNI E MAPPE : Baule capiente dove vengono archiviati disegni e mappe collegati all’ASTUCCIO SIGILLATO DEI DISEGNI; il contenuto può essere richiamato e organizzato a piacere dal PG, con fogli arrotolati o distesi a seconda della necessità. 25P</p><p>ARREDAMENTO E SUPPELLETTILI : Poltroncine e tavolino lettura, angolo cucina, quadri e materiali da disegno, piante e dettagli decorativi, candele levitanti e resto dell’allestimento della stanza. 50P</p><p>TOT 100P/500P</p>","location":"note","hidden":false},{"nome":"TRATTI DISTINTIVI","desc":"<p>TRATTI CARATTERIALI : Calma e composta, con una buona parlantina senza essere invadente. Ha un indole gentile e tende ad aiutare il prossimo, ma non è ingenua: si fida delle persone con misura e la sua fiducia va guadagnata. Le piace esplorare, viaggiare e scoprire cose nuove; è avventurosa e curiosa, sempre pronta a mettersi in cammino quando c’è qualcosa da conoscere o da capire. Di base resta tranquilla, però quando qualcuno la provoca o serve farsi valere risponde a tono, senza paura di nessuno. Ama la natura e gli animali. Quando si pone un obiettivo diventa molto determinata: anche davanti a problemi e difficoltà non si tira indietro, si rimbocca le maniche e va fino in fondo.</p><p>INSERIMENTO SLOT PG : Il PG potrà usufruire di diversi slot, suddivisi in livelli esclusivamente per abilità ATTIVE, il restante, verrà contrassegnato come TRUCCHETTO. I trucchetti avranno CD proprie ed avranno degli utilizzi limitati nell&#x27;arco della giornata (riposo lungo). I tiri delle Abilità e Rune verranno effettuati esclusivamente su ARTE con CD 16 che scaleranno su INTELLIGENZA.</p><p>PRIVILEGI DI RAZZA :</p><p>VISIONE CREPUSCOLARE : Gli occhi di un elfo possono vedere facilmente attraverso l&#x27;oscurità. In condizioni di luce fioca può vedere fino a 18 metri come se si trovasse in condizioni di luce intensa e nell&#x27;oscurità come se si trovasse in luce fioca. Nell&#x27;oscurità non è in grado di discernere i colori, ma solo le tonalità di grigio.</p><p>AGILITA’ E DESTREZZA : Abituata al combattimento sin da piccola, la PG puo’ compiere acrobazie e gesti atletici con totale naturalezza. 2 volte per scontro puo’ utilizzare un&#x27;azione per schivare un attacco nemico effettuando un tiro contrapposto su DESTREZZA. Tutti i tiri su agilità e acrobazia hanno + 3 bonus.</p><p>FIGLIA DELLA NATURA : Il PG, per origine e crescita, possiede una connessione naturale e spirituale con il mondo vivente che esula dalle rune. Anche senza attivare alcun potere runico, percepisce meglio l’ambiente, capisce con più facilità segni e tracce, riconosce passaggi, presenze e comportamenti tipici della fauna, e riesce a interagire con la natura in modo istintivo e rispettoso, ottenendo spesso risposte utili dal contesto. Questa sensibilità non sostituisce la Runa della Natura e non ne replica gli effetti: è un tratto costante che rende il PG più “in sintonia” con territorio, animali e segnali naturali, e gli permette di sfruttare competenze e intuizioni tipiche di una formazione druidica. E’ profondamente ammaliata dai TULIP una rarissima razza naturale presente solo nel tronco degli alberi sacri Irminsul e Yggdrasil.</p><p>ARTE E DISEGNO : Il PG possiede una capacità fuori dal comune di fissare su un foglio ciò che ha in mente con precisione e coerenza. Se visualizza un volto, un simbolo, un luogo o un dettaglio descritto da altri, riesce a trascriverlo fedelmente come un ritrattista esperto, creando ritratti utili a riconoscere persone o a ricostruire identità da una semplice descrizione. Allo stesso modo, se ha in mente un percorso, una stanza, una struttura o una zona già vista, può riportarla su carta sotto forma di mappa, schema o pianta in modo rapido e leggibile, mantenendo proporzioni e riferimenti essenziali. In pratica, ciò che il PG immagina o ricorda diventa facilmente “disegnabile” e consultabile, come se la sua mente avesse già un tratto pronto.</p>","location":"lore","hidden":false},{"nome":"PENNELLO DEL TRATTO VIVO","group":"STRUMENTI DI MARY","desc":"<p>Un pennello antico, con manico scuro e finiture dorate, usato da artisti itineranti capaci di trasformare il disegno in gesto reale. Il pennello non “evoca” materia: crea solo inchiostro animato, solido quel tanto che basta per colpire, afferrare, proteggere o sostenere per un tempo breve, poi si sfalda e svanisce. Il PG può disegnare su tela o su un supporto adatto, ma può anche comandare a distanza l’inchiostro già depositato in un punto, come se tracciasse direttamente lì. Le creazioni possono essere offensive o di utilità (barriere, prese, fruste, appigli, scudi, blocchi, trascinamenti, ecc.) e la loro stabilità dipende da quanto sono grandi e/o dettagliate: più sono complesse, più richiedono attenzione e tendono a essere meno stabili. Il PG ha un tetto massimo di danni per turno (40) da commutare in dadi : se genera più creazioni offensive, divide quel totale tra di loro (es. 4 creazioni piccole = 4 colpi separati che si spartiscono il massimale). Di norma il personaggio avrebbe 2 AZIONI e 2 ATTACCHI nel turno; quando impugna il Pennello, AZIONI e ATTACCHI si fondono in un unico totale di 4 “interventi” ridistribuibili liberamente (fino a 4 azioni, 4 attacchi o combinazioni), senza influenzare l'azione di movimento/uso oggetti. Un disegno piccolo richiede 1 intervento, un disegno medio 2 interventi, un disegno grande tutti e 4, con possibilità di combinare (es. 2 piccoli + 1 medio). Il PG può anche impiegare tutti e 4 gli interventi solo in tratto e concentrazione per completare una creazione ancora più grande o complessa, rinunciando ad altro nel turno; il “peso” non dipende solo dalla taglia: contano anche precisione, controllo e funzioni specifiche. Evocazioni Persistenti : quando si parla degli ATTACCHI, il PG può scegliere di non creare colpi istantanei ma una vera e propria evocazione d’inchiostro (corvi, bestie, figure animate); una volta generata, finché non viene eliminata o distrutta, rimane sul territorio e diventa la fonte dei suoi attacchi: finché presente, il PG può continuare a usare quella forma per colpire spendendo 1 solo punto Azione. La permanenza non ha un tempo fisso: dipende dall’inchiostro investito e dai danni/dispersione; ogni evocazione ha Punti Ferita propri e resta in campo fino a distruzione/eliminazione/trasformazione in runa. La quantità di inchiostro disponibile è limitata: più grande e dettagliata è l’evocazione, più inchiostro rimane impegnato e meno il PG ne avrà per generare altre cose; taglia e numero di evocazioni dipendono dagli interventi spesi nel turno: 1 intervento = una forma piccola (es. 1 corvo), 2 interventi = due forme piccole o una media, 4 interventi = una forma grande o più forme minori, secondo le regole già indicate. Il PG può mantenere attive fino a un massimo di 4 evocazioni piccole, oppure 2 medie, oppure 1 grande; spendendo l’intero turno in tratto e concentrazione può evocarne direttamente una grande sul campo (impiegando tutti e 4 gli interventi solo per disegnare), rinunciando ad altro nel turno. Le evocazioni possono trasformarsi in una runa su un punto (terreno, oggetto, bersaglio) al contatto, permettendo al PG di imprimere rune tramite i disegni oltre che tracciarle su tela o a terra. Il pennello nasconde un’anima lama: in casi estremi viene usato come coltello, infliggendo 2D6 danni per ogni attacco disponibile. Passiva : il pennello può assorbire solo il colore di ciò che tocca (pigmenti, tinte, vernici, polveri, tracce cromatiche) e replicarlo nel suo inchiostro; non copia proprietà, poteri o effetti, prende esclusivamente la cromia. Abilità Speciale : anche una sola chiazza d’inchiostro su terreno, oggetto o bersaglio può diventare un punto di comando; in un secondo momento il PG può farla espandere, muovere o trasformare in una creazione a distanza, come se stesse disegnando direttamente su quel punto.</p>","location":"equip","hidden":false},{"nome":"CAPPOTTO DI KAMUT","group":"STRUMENTI DI MARY","desc":"<p>Un cappotto spesso e lungo ricavato dalla pelle del Kamut, una creatura tipica di Brodental, noto perché la sua fibra reagisce agli urti irrigidendosi nel punto dell’impatto come una corazza naturale che “scatta” solo quando serve, spezzando e assorbendo parte della forza e garantendo +2 alla CA (efficace soprattutto contro colpi moderati e ripetuti, mentre contro impatti estremi la protezione non è assoluta e può comunque essere superata). Il cappotto è costruito in modo estremamente modulare: lungo tutta la struttura presenta numerosi agganci, clip e attacchi che permettono di staccare e riattaccare sezioni, in particolare le parti delle braccia/maniche, così da adattarlo rapidamente a climi molto freddi o più caldi e a esigenze diverse del possessore senza perdere la sua funzione principale. Non possiede altre abilità “attive”, ma è ricco di dettagli pratici: molte tasche nascoste, punti di fissaggio per piccoli oggetti e accessori, e una vestibilità regolabile che lo rende un indumento da viaggio completo oltre che una protezione affidabile.</p>","location":"equip","hidden":false},{"nome":"TAVOLA GAMMICA","group":"STRUMENTI DI MARY","desc":"<p>Un bracciale leggendario dall’aspetto elegante e discreto quando è chiuso, come un semplice ornamento dorato. Quando il PG lo desidera, l’artefatto si apre “a ali” e si dispiega in una vera tavolozza: possiede 11 gemme totali, 1 centrale molto più grande e 10 minori distribuite sulle due ali. Le gemme cambiano colore a volontà del possessore, permettendo di avere sempre la cromia perfetta pronta senza dover cercare pigmenti o preparare miscele. La tavola però non conserva solo colori: conserva anche “tratti”, cioè disegni già fissati e memorizzati. Ogni gemma può immagazzinare un tratto completo registrato in precedenza; quando il PG lo richiama, quel tratto viene riprodotto con estrema rapidità sulla superficie scelta, come se si disegnasse quasi da solo, riducendo drasticamente il tempo di esecuzione rispetto a una creazione improvvisata. Le 10 gemme minori ospitano tratti ordinari e versatili, mentre la gemma centrale può contenere un tratto speciale più potente del normale, pensato per momenti decisivi: la forma e la funzione del tratto maggiore vengono scelte dal PG al momento della registrazione e restano coerenti con la natura di “inchiostro vivo”, senza copiare poteri leggendari o proprietà impossibili. In casi estremi, l’artefatto può anche compattarsi e rimodellarsi fisicamente fino a diventare un piccolo scudo circolare, garantendo +1 alla CA finché resta in assetto difensivo, poi può richiudersi tornando alla forma di bracciale 2 X SCONTRO. Passiva : Il PG può cambiare istantaneamente colore alle gemme, mantenendo sempre pronta la cromia desiderata per il pennello o per qualsiasi intervento d’inchiostro. Abilità Speciale : Il bracciale può registrare e conservare 11 tratti. Le 10 gemme minori contengono tratti ordinari richiamabili rapidamente; la gemma centrale contiene 1 tratto maggiore, più potente, utilizzabile in contesti critici. Inoltre, cliccando una gemma, il PG può proiettare a distanza la cromia selezionata come spruzzo d’inchiostro oppure rilasciare direttamente il tratto preregistrato su una superficie a scelta. Questo permette di usare i tratti salvati anche senza il pennello, in situazioni di emergenza o quando lo strumento principale è indisponibile.</p>","location":"equip","hidden":false},{"nome":"CAVALLETTO DEL BIANCO PURO","group":"STRUMENTI DI MARY","desc":"<p>Un treppiedi di legno richiudibile, consumato dal viaggio ma rifinito con incisioni sottili e piccoli rinforzi decorativi che lo fanno sembrare più di un semplice attrezzo. Quando viene aperto, la tela non si appoggia: nasce dal cavalletto stesso, tendendosi agli angoli come una vela tirata in forza, pronta a ricevere il tratto. Quando viene richiuso, la struttura rientra su sé stessa e la tela si ripiega insieme alle aste, serrandosi in un fascio compatto da portare sulle spalle. Si dice che questo cavalletto sia stato costruito per artisti che non potevano permettersi errori permanenti: ogni scena dipinta doveva poter sparire, ogni bozza doveva poter rinascere pulita, come se la pagina non avesse mai conosciuto macchia. Passiva : La tela può essere “azzerata” a comando del possessore. Qualunque materiale sia stato usato per dipingere viene cancellato e la superficie torna pulita e bianca, pronta a essere riutilizzata, senza lasciare residui. Abilità Speciale : Il cavalletto è legato al suo possessore tramite un semplice vincolo di tracciamento. Una volta designato, lo segue automaticamente e lo raggiunge quando viene richiamato o quando resta indietro, senza essere vivo e senza comprendere ciò che accade: si limita a muoversi per tornare dal proprietario.</p>","location":"equip","hidden":false},{"nome":"PROMEMORIA DADI","group":"VADEMECUM CREAZIONE","desc":"<p>D2 (moneta) · D4 · D6 · D8 · D10 · D12 · D20 · D100 normale o percentuale.\u000b Il D20 serve quasi sempre per capire se “riesci” (prove, colpire, tiri salvezza).\u000b I dadi come D4/D6/D8/D10/D12 servono quasi sempre per dire “quanto” (cura, danni, scudi, quantità).\u000b Il D100 è una percentuale (spesso si fa con due D10: uno per le decine e uno per le unità).                                                    D20 e D100 possono essere utilizzati per grandi danni. Generalmente se si vuole aumentare i danni inflitti è preferibile utilizzare più dadi perché “+ Dadi = + Danni”.                                                                                                       Esempio : Palla di Fuoco al lvl 5 deve fare massimo 100 danni, invece di 1D100 useremo 5D20 o 10D10.</p>","location":"note","hidden":false},{"nome":"COME PARTIRE: “COSA VOGLIO FARE?”","group":"VADEMECUM CREAZIONE","desc":"<p>Inizia sempre con una domanda secca: COSA VOGLIO FARE? Voglio curare, Voglio proteggere, Voglio spostare, Voglio rallentare, Voglio potenziare. In base alla risposta analizza le rune che hai a disposizione e cosa fanno. Se nella frase ci sono due effetti grandi, il modo più semplice e veloce è separarli, ma in casi estremi ricordati che hai a disposizione la RUNA DELLA SINERGIA</p>","location":"note","hidden":false},{"nome":"LE 5 COSE CHE UNA RUNA DEVE AVERE","group":"VADEMECUM CREAZIONE","desc":"<p>Su chi agisce (bersaglio)\u000b Devi sempre sapere se la runa riguarda te stessa, un alleato, un nemico, oppure un’area. Questa scelta decide quanto dev’essere “contenuta”: una runa su un solo bersaglio può permettersi più potenza; una runa ad area o su più bersagli, invece, deve stare più attenta a durata e forza perché impatta molte cose insieme.</p><p>Da dove la fai funzionare (gittata)\u000b La distanza cambia la comodità della runa. Contatto significa che devi esporti e avvicinarti; una gittata media ti permette di restare al sicuro; una gittata lunga ti dà controllo da lontano. Più la runa è comoda da lanciare lontano, più è importante tenerla chiara (potenza o durata più gestibili). Anche solo ricordarsi “quanto lontano posso farla partire?” evita metà delle confusioni al tavolo.</p><p>Quanto dura (durata)\u000b Una runa può essere istantanea (succede e finisce) oppure durare per un certo tempo (turni, minuti…). La durata è una delle leve più forti del gioco: un effetto anche “normale”, se dura tanto, diventa enorme. Per questo, quando crei una runa, chiediti sempre: “deve essere un colpo secco o un effetto che resta?” e “quanto mi serve davvero che resti?”.</p><p>Che posto occupa nel tuo turno (azione/bonus/reazione)\u000bDi solito nel turno si ha un’Azione/Attacco, a volte una Bonus, e il Movimento; la Reazione è un “intervento” fuori turno quando scatta una condizione. Una runa da Azione può permettersi di essere più importante. Una runa da Bonus deve essere più semplice o più piccola (perché la sommi a un’altra azione). Una runa da Reazione è spesso difensiva o “al momento giusto”, e quindi va tenuta molto chiara e immediata. Scegliere questo punto ti fa capire subito quanto la runa può essere “grossa”.</p><p>Se influenza un nemico, come può resistere (difesa)\u000b Se la runa cura o potenzia un alleato, di solito non serve che qualcuno “resista”. Se invece la runa dà fastidio a un nemico (lo rallenta, lo blocca, lo sposta controvoglia, gli impedisce di fare bene qualcosa), allora quasi sempre deve esistere una via di difesa: un Tiro Salvezza (TS), una prova contrapposta, o un tiro per colpire, effettuato con un D20.</p>","location":"note","hidden":false},{"nome":"POTENZA E CRESCITA","group":"VADEMECUM CREAZIONE","desc":"<p>La potenza si può esprimere con dadi oppure con numeri fissi. L’importante è non scegliere “a caso”, ma pensare già alla scala fino al 5.\u000b Esempio con numeri: se a livello 1 fai 10, poi deve crescere in modo leggibile (spesso raddoppio o crescita costante: 10→20→40→60→100, con il 5 che può “staccare” un po’).\u000b Esempio con dadi: stesso concetto, D4→D6→D8→D12→D20. Non è obbligatorio usare i dadi: sono solo un modo comodo per non perdere coerenza.</p>","location":"note","hidden":false},{"nome":"EFFETTI SPECIALI","group":"VADEMECUM CREAZIONE","desc":"<p>Un effetto “speciale” (secondario) si può aggiungere, ma di norma ha senso quando i livelli sono già alti, perché altrimenti la runa diventa troppo piena. La regola pratica: fino ai livelli bassi fai effetti puliti; ai livelli alti puoi permetterti il “plus”, purché resti coerente col tipo di runa.</p>","location":"note","hidden":false},{"nome":"LIVELLI 1 → 6","group":"VADEMECUM CREAZIONE","desc":"<p>- CHE COSA SIGNIFICA DAVVERO LIVELLO 1→5\u000b Livelli 1–2: “piccolo e chiaro”\u000b Effetti brevi, potenza bassa, un solo bersaglio o impatto limitato. Sono i livelli dove la runa deve essere facile da usare e difficile da abusare.</p><p>Livelli 3–4: “medio e solido”\u000b Qui iniziano durata più comoda, impatto più visibile, possibilità di toccare meglio il campo (senza diventare onnipotenti). È anche il punto in cui puoi iniziare a pensare a piccole variazioni intelligenti, ma senza strafare.</p><p>Livello 5: “apicale”\u000b È il massimo attuale: pochi slot, potenza alta. Qui puoi sbilanciarti di più: o un salto di potenza, o un effetto speciale davvero significativo, o un controllo più incisivo. Il livello 5 deve “sentirsi” diverso, perché è raro e prezioso.</p><p>Livello 6: “devastante”\u000b È un Livello Bonus, alcuni hanno la possibilità di raggiungerlo per concentrazione altri per superamento di limite di potenza, altri come Mary, hanno la possibilità di crearli. Essendo estremamente raro, questo Slot richiede massima attenzione, ma in linea di massima ha molto margine d’azione poiché allo stato attuale rappresenta l’espressione massima di un Incantesimo/Abilità.</p>","location":"note","hidden":false},{"nome":"SLOT E LIMITI","group":"VADEMECUM CREAZIONE","desc":"<p>- SUGLI SLOT \u000b Lo slot non è solo “quanto forte”: è quanto spazio ti concedi. Più lo slot è alto, più puoi permetterti potenza e/o complessità, soprattutto dal 4 e ancora di più al 5. Il 5, proprio perché è raro, può reggere l’effetto speciale migliore.</p><p>- IL “PEGNO” NON È OBBLIGATORIO, MA È UNO STRUMENTO\u000b Non è vero che una runa forte deve per forza pagare sempre. Però, quando una runa è molto comoda (lunga durata + tanta distanza + tanti bersagli + grande potenza), allora per equilibrio conviene scegliere almeno un limite. Non come punizione: come modo per tenere la runa giocabile e chiara.</p><p>dura poco</p><p>ha poca distanza</p><p>colpisce un solo bersaglio</p><p>richiede concentrazione</p>","location":"note","hidden":false},{"nome":"COME NON ANDARE IN LOOP","group":"VADEMECUM CREAZIONE","desc":"<p>- COME NON ANDARE IN LOOP (quando non sai cosa fare)\u000b Non partire dalla runa: parti dal bisogno del momento. COSA VOGLIO / DEVO FARE ? Sopravvivere (cura/protezione), muoversi (spazio), impedire una cosa (tempo), potenziare l’azione chiave (amplificazione).</p><p>- PROMEMORIA DA TENERE IN TESTA\u000b Una runa è sempre: “una frase chiara” + “chi” + “distanza” + “durata” + “quanto è forte” (+ “difesa se colpisce un nemico”).</p>","location":"note","hidden":false},{"nome":"GESTIONE DELLE 4 AZIONI","group":"TACTICA DI MARY","desc":"<p>Gestione Azioni nel Turno :                                                                                                                                                                Le 4 azioni sono un vantaggio enorme, ma vanno amministrate: non devono diventare “quattro attacchi fissi”, altrimenti Mary smette di essere supporto e soprattutto rinuncia alla sua forza principale, cioè il controllo della scena. Una regola semplice è trattare quelle 4 azioni come un budget da dividere ogni turno tra tre bisogni:                                                                                     (1) posizione sicura / vantaggiosa                                                                                                                   (2) rune utili al momento                                                                                                                     (3) eventuali attacchi.                                                                                                                                    Se in un turno devi riposizionarti molto (perché ti hanno puntata o perché vuoi un’angolazione migliore), puoi spendere 1–2 azioni per Natura/Materia e tenere le altre 2 per una runa “chiave” + un attacco (o due attacchi se la runa non serve). Se invece sei già in posizione perfetta, puoi dedicare più azioni alle rune: una per proteggere/curare/amplificare e una per svantaggiare un nemico, lasciando le restanti per attacco o micro-spostamenti. L’errore più comune da evitare è fare “solo danno” quando la squadra sta rischiando: in quel caso anche un singolo intervento di Protezione/Cura/Amplificazione al momento giusto vale più di due attacchi.                                     Prima sicurezza e vantaggio, poi stabilizzazione degli alleati, poi controllo del nemico, e solo alla fine attacco.</p>","location":"note","hidden":false},{"nome":"GESTIONE DELLE RUNE","group":"TACTICA DI MARY","desc":"<p>Gestione Rune :                                                                                                                                                         Mary deve ragionare come “regista” dello scontro: non vince stando nel mucchio, vince scegliendo dove stare e in che ordine intervenire. La priorità è sempre creare vantaggio tattico e sopravvivere: usare Protezione, Natura e Materia per tenersi lontana dalla linea di fuoco, cambiare posizione, dissimulare la propria presenza, celarsi dietro coperture o punti difficili da raggiungere, e soprattutto non farsi mai “agganciare” dal nemico. Il suo turno va pensato come una sequenza: prima mettersi al sicuro o riposizionarsi (se serve), poi intervenire sugli alleati, e solo dopo, quando la squadra è stabilizzata, iniziare ad Attaccare e Disturbare i nemici. In pratica, il loop mentale è: proteggere gli alleati (Runa della Protezione), curarli se necessario (Runa della Cura) oppure potenziarli nel momento giusto (Runa dell’Amplificazione); appena la linea amica regge, passare a creare svantaggio e controllo sul nemico con Tempo, Spazio o Spirito, scegliendo ogni volta l’opzione più utile alla situazione (rallentare chi sta arrivando, spostare/impedire un ingaggio, spezzare un’azione chiave, confondere o limitare). Solo se resta “spazio mentale e d’azione” dopo aver sistemato posizionamento e runa/e fondamentali, allora conviene convertire il resto in attacchi: Mary può fare danni, ma il suo valore vero è far sì che gli altri facciano danni meglio e più a lungo.</p>","location":"note","hidden":false},{"nome":"REGOLA MADRE","group":"TACTICA DI MARY","desc":"<p>Quando hai dubbi perplessità o incertezze CHIEDI AL MASTER e il gioco è fatto.</p>","location":"note","hidden":false}],"travellerLayoutVersion":6};

function saveGoogleTokenToSession(token, expiresInSeconds){
  try{
    sessionStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY, JSON.stringify({
      token: token,
      expiresAt: Date.now() + (Number(expiresInSeconds || 0) * 1000)
    }));
  }catch(e){}
}

function loadGoogleTokenFromSession(){
  try{
    const raw = sessionStorage.getItem(GOOGLE_TOKEN_STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.token || !data.expiresAt) return null;
    if (Date.now() > data.expiresAt - 60000) return null; // margine di sicurezza di 60s
    return data.token;
  }catch(e){ return null; }
}

async function driveFind(){
  const name = suggestedFileName();
  const q = encodeURIComponent(`name='${name}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: "Bearer " + googleAccessToken }
  });
  if (!res.ok){
    const body = await res.text().catch(()=> "");
    console.error("Drive (find) errore " + res.status + ": " + body);
    throw new Error("drive find failed: " + res.status);
  }
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function driveCreate(){
  const name = suggestedFileName();
  const boundary = "-------scheda" + Date.now();
  const metadata = { name, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(STATE)}\r\n` +
    `--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": `multipart/related; boundary=${boundary}` },
    body
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (create) errore " + res.status + ": " + errBody);
    throw new Error("drive create failed: " + res.status);
  }
  const data = await res.json();
  return data.id;
}

async function driveUpdate(fileId){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: "Bearer " + googleAccessToken, "Content-Type": "application/json" },
    body: JSON.stringify(STATE)
  });
  if (!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Drive (update) errore " + res.status + ": " + errBody);
    const err = new Error("drive update failed: " + res.status);
    err.status = res.status;
    throw err;
  }
}

function deepMerge(base, override){
  if (Array.isArray(base)) return (override && Array.isArray(override)) ? override : base;
  if (typeof base === "object" && base !== null){
    const out = {...base};
    if (override && typeof override === "object"){
      for (const k in override){ out[k] = deepMerge(base[k], override[k]); }
    }
    if (override && override.sheetId && override.travellerLayoutVersion === undefined) out.travellerLayoutVersion = 0;
    return out;
  }
  return (override !== undefined) ? override : base;
}

async function writeLocalFile(){

    const writable = await localFileHandle.createWritable();
    await writable.write(JSON.stringify(STATE, null, 2));
    await writable.close();
    return true;
  }catch(e){ return false; }

   IMMAGINI OGGETTI (compresse in dataURL, salvate nello stato)
   ============================================================ */
function fileToCompressedDataURL(file, maxDim, quality, cb){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim / Math.max(w,h));
      w = Math.max(1, Math.round(w*scale));
      h = Math.max(1, Math.round(h*scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = ()=>{ setStatus("Immagine non valida"); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* allowZoom: aggiunge un pulsante di ingrandimento (modal) accanto alla miniatura.
   Usato solo per le immagini dell'Equipaggiamento, non per l'Inventario. */
function makeImagePicker(currentSrc, onPick, onRemove, allowZoom, zoomLabel, readOnly){
  const wrap = document.createElement("div");
  wrap.className = "img-row";

  const thumb = document.createElement(currentSrc ? "img" : "div");
  if (currentSrc){ thumb.src = currentSrc; thumb.className = "thumb"; }
  else { thumb.className = "thumb-placeholder"; }

  if (readOnly){
    /* Player read-only (equip/inventario): solo visualizzazione. Nessun
       modo di aggiungere, cambiare o rimuovere l'immagine. Se c'è
       un'immagine, il clic sulla miniatura apre il lightbox; altrimenti
       un placeholder neutro senza alcuna interattività. */
    if (currentSrc){
      thumb.title = "Clic per ingrandire";
      thumb.addEventListener("click", ()=> openImageLightbox(currentSrc, zoomLabel));
    } else {
      thumb.title = "Nessuna immagine";
    }
    wrap.appendChild(thumb);
    return wrap;
  }

  if (currentSrc){ thumb.title = "Clic per cambiare immagine"; }
  else { thumb.textContent = "+"; thumb.title = "Aggiungi immagine"; }

  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.className = "file-input-hidden";
  input.addEventListener("change", ()=>{
    const f = input.files && input.files[0];
    if (f) fileToCompressedDataURL(f, 320, 0.72, (dataUrl)=>{ onPick(dataUrl); });
  });

  thumb.addEventListener("click", ()=> input.click());

  wrap.appendChild(thumb);
  wrap.appendChild(input);

  const label = document.createElement("span");
  label.className = "file-btn";
  label.textContent = currentSrc ? "Cambia immagine" : "Aggiungi immagine";
  label.addEventListener("click", ()=> input.click());
  wrap.appendChild(label);

  if (currentSrc && allowZoom){
    const zoom = document.createElement("button");
    zoom.className = "img-zoom"; zoom.type="button"; zoom.textContent = "\u26f6"; zoom.title="Ingrandisci immagine";
    zoom.addEventListener("click", (ev)=>{ ev.stopPropagation(); openImageLightbox(currentSrc, zoomLabel); });
    wrap.appendChild(zoom);
  }

  if (currentSrc){
    const rm = document.createElement("button");
    rm.className = "img-remove"; rm.type="button"; rm.textContent = "\u2715"; rm.title="Rimuovi immagine";
    rm.addEventListener("click", (ev)=>{ ev.stopPropagation(); onRemove(); });
    wrap.appendChild(rm);
  }
  return wrap;
}

      document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
    });
  });
}

function renderCaosTracker(){
  if (!STATE.livelloCaosMax) return "";
  const letters = ["C","A","O","S"];
  const pips = [];
  for (let i=1; i<=STATE.livelloCaosMax; i++){
    pips.push(`<button class="caos-pip ${i<=STATE.livelloCaos?'on':''}" data-caos-pip="${i}" title="Livello ${i}"></button>`);
  }
  const letterEls = letters.map((l,i)=>`<span class="caos-letter ${STATE.livelloCaos>i?'lit':''}">${l}</span>`).join("");
  const flameOn = STATE.livelloCaos >= STATE.livelloCaosMax;
  return `
    <div class="caos-tracker">
      <div class="caos-col">
        <div class="caos-pips">${pips.join("")}</div>
        <div class="caos-label">Livello di Caos (${STATE.livelloCaos}/${STATE.livelloCaosMax})</div>
      </div>
      <div class="caos-word">${letterEls}</div>
      <span class="caos-flame ${flameOn?'on':''}">\ud83d\udd25</span>
    </div>`;
}

function bindCaosTracker(){
  document.querySelectorAll('[data-caos-pip]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const n = parseInt(btn.dataset.caosPip, 10);
      STATE.livelloCaos = (STATE.livelloCaos === n) ? n - 1 : n;
      const panel = document.getElementById("panel-scheda");
      if (panel){
        const holder = panel.querySelector(".caos-tracker");
        if (holder) holder.outerHTML = renderCaosTracker();
        bindCaosTracker();
      }
      queueSave();
    });
  });
}

function renderScheda(){
  const masterOn = isMasterEditorOn();
  const abilNames = {FOR:"Forza", DES:"Destrezza", COS:"Costituzione", INT:"Intelligenza", SAG:"Saggezza", CAR:"Carisma"};
  const abilBoxes = Object.keys(STATE.scores).map(k=>`

  const saveRows = Object.keys(STATE.saves).map(k=>`

    <div class="card">

        <div class="field"><label>Classe e Livello</label><input type="text" data-key="classe" value="${esc(STATE.classe)}"></div>
        <div class="field"><label>Background</label><input type="text" data-key="background" value="${esc(STATE.background)}"></div>
        <div class="field"><label>Razza</label><input type="text" data-key="razza" value="${esc(STATE.razza)}"></div>
        <div class="field"><label>Allineamento</label><input type="text" data-key="allineamento" value="${esc(STATE.allineamento)}"></div>
        <div class="field"><label>Nome Giocatore</label><input type="text" data-key="giocatore" value="${esc(STATE.giocatore)}"></div>
        <div class="field"><label>Altro</label><input type="text" data-key="altro" value="${esc(STATE.altro)}"></div>
      </div>
    </div>

    <div class="card">
      <h2>Caratteristiche <small>il modificatore si aggiorna da solo</small></h2>
      <div class="grid grid-6">${abilBoxes}</div>
    </div>

    <div class="card">
      <h2>Parametri di Combattimento</h2>
      <div class="grid grid-4">
        <div class="statpill"><label>CA</label><input type="number" data-key-num="ca" value="${STATE.ca}"></div>
        <div class="statpill"><label>Iniziativa</label><input type="number" data-key-num="iniziativa" value="${STATE.iniziativa}"></div>
        <div class="statpill"><label>Velocit\u00e0</label><input type="number" data-key-num="velocita" value="${STATE.velocita}"></div>
        <div class="statpill"><label>Bonus Competenza</label><input type="number" data-key-num="bonusComp" value="${STATE.bonusComp}"></div>
      </div>
      <div style="margin-top:12px;" class="grid grid-4">
        <div class="statpill"><label>Dado Vita</label><input type="text" data-key="dadoVita" value="${esc(STATE.dadoVita)}"></div>
        <div class="statpill"><label>Perc. Passiva</label><input type="number" data-key-num="percPassiva" value="${STATE.percPassiva}"></div>
      </div>
    </div>

    <div class="card">
      <h2>Punti Ferita</h2>
      <div class="hp-row">
        <div class="hp-numbers">
          <button class="btn small" id="hp-minus">\u2212</button>
          <input type="number" id="hp-cur" value="${STATE.hpCur}">
          <span style="color:var(--text-faint)">/</span>
          <input type="number" id="hp-max" value="${STATE.hpMax}">
          <button class="btn small" id="hp-plus">+</button>
        </div>
        <div class="hp-track"><div class="hp-fill" id="hp-fill"></div></div>
      </div>
      <div class="hp-row hp-row-temp">
        <div class="hp-numbers">
          <label style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;">PF Temp.</label>

        <div><div style="text-align:center;font-size:10.5px;color:var(--bad);text-transform:uppercase;margin-bottom:6px;">Fallimenti</div><div class="pips">${deathPips(STATE.deathFail,"f")}</div></div>

    <div class="grid grid-2">
      <div class="card">
        <h2>Tiri Salvezza</h2>

        ${skillRows}

      <h2>Attacchi & Incantesimi di Prima Utilit\u00e0</h2>

    inp.addEventListener("input", ()=>{
