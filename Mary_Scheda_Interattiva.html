      STATE.scores[k] = parseInt(inp.value || "0", 10);
      const modInp = document.getElementById("mod-"+k);
      if (modInp){ modInp.value = fmtMod(effMod(k)); modInp.classList.toggle("is-override", hasOverride(k)); }
      const sm = document.getElementById("savemod-"+k);
      if (sm) sm.textContent = fmtMod(effMod(k));
      STATE.skills.forEach((s,i)=>{
        if (s[1]===k){ const el=document.getElementById("skillmod-"+i); if(el) el.textContent = k+" "+fmtMod(effMod(k)); }
      });
      queueSave();
    });
  });

  // override manuale del modificatore (Caratteristiche editabili):
  // il calcolo automatico resta attivo, ma un valore inserito qui manualmente
  // sostituisce quello calcolato e non viene più sovrascritto dal ricalcolo.
  document.querySelectorAll('[data-modover]').forEach(inp=>{
    inp.readOnly = false;
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.modover;
      const raw = inp.value.trim();
      if (!STATE.modOverride) STATE.modOverride = {};
      if (raw === ""){
        delete STATE.modOverride[k];
      } else {
        const parsed = parseInt(raw.replace(/^\+/, ""), 10);
        if (!isNaN(parsed)) STATE.modOverride[k] = parsed;
      }
      inp.classList.toggle("is-override", hasOverride(k));
      const sm = document.getElementById("savemod-"+k);
      if (sm) sm.textContent = fmtMod(effMod(k));
      STATE.skills.forEach((s,i)=>{
        if (s[1]===k){ const el=document.getElementById("skillmod-"+i); if(el) el.textContent = k+" "+fmtMod(effMod(k)); }
      });
      queueSave();
    });

      const k = inp.dataset.modover;
      inp.value = fmtMod(effMod(k));
    });
  });
  document.querySelectorAll('[data-save]').forEach(inp=>{

  });
  document.querySelectorAll('[data-death]').forEach(btn=>{

      const [cls,idx] = btn.dataset.death.split("-");

      btn.classList.toggle("used", arr[idx]);
      queueSave();
    });
  });

  bindSimpleInputs();
  bindRich();

  const hpCur = document.getElementById("hp-cur"), hpMax = document.getElementById("hp-max"), hpTemp = document.getElementById("hp-temp");
  hpMax.readOnly = !isMasterEditorOn();
  function refreshHp(){
    let cur = parseInt(hpCur.value||"0",10), max = parseInt(hpMax.value||"0",10);
    if (cur > max) cur = max;
    if (cur < 0) cur = 0;
    hpCur.value = cur;
    let temp = parseInt(hpTemp.value||"0",10);
    if (temp < 0) temp = 0;
    STATE.hpCur = cur; STATE.hpMax = max; STATE.hpTemp = temp;
    const pct = max>0 ? Math.max(0,Math.min(100, cur/max*100)) : 0;
    document.getElementById("hp-fill").style.width = pct+"%";
    document.getElementById("hp-fill").style.background = "linear-gradient(90deg,#3f6a3a,var(--good))";
    const tempPct = max>0 ? Math.max(0,Math.min(100, temp/max*100)) : (temp>0 ? 100 : 0);
    document.getElementById("hp-fill-temp").style.width = tempPct+"%";
  }
  hpCur.addEventListener("input", ()=>{refreshHp(); queueSave();});
  hpMax.addEventListener("input", ()=>{refreshHp(); queueSave();});
  hpTemp.addEventListener("input", ()=>{refreshHp(); queueSave();});
  document.getElementById("hp-minus").addEventListener("click", ()=>{hpCur.value = (parseInt(hpCur.value||"0",10)-1); refreshHp(); queueSave();});
  document.getElementById("hp-plus").addEventListener("click", ()=>{hpCur.value = (parseInt(hpCur.value||"0",10)+1); refreshHp(); queueSave();});
  refreshHp();
  bindCaosTracker();
}

/* ============================================================
   MASTER EDITOR
   Modalità di modifica strutturale riservata al Master: categoria,
   titolo/etichetta, testo, larghezza e ordine dei riquadri di
   Passive/Truccetti/Risorse/Ambiti/Campi. Nessuna auto-correzione:
   il testo inserito viene salvato esattamente com'è scritto.
   Attivabile SOLO da chi ha già sbloccato la modalità Master
   (password Master), ed è completamente invisibile/inattiva in
   modalità giocatore.
   ============================================================ */
const MASTER_EDITOR_KEY = "morgedal-master-editor";
const MASTER_CATS = [
  { key:"passive", label:"Passiva" },
  { key:"truccetti", label:"Truccetto" },
  { key:"incantesimo", label:"Incantesimo" },
  { key:"abilita", label:"Abilità" },
  { key:"risorse", label:"Risorsa" },
  { key:"ambiti", label:"Ambito" },
  { key:"campiAttiva", label:"Campo" }
];
const MASTER_ARR_SHAPE_CATS = new Set(["ambiti","campiAttiva"]);

function isMasterEditorOn(){
  if (!isMasterUnlocked()) return false;
  try{ return sessionStorage.getItem(MASTER_EDITOR_KEY) === "1"; }catch(e){ return false; }
}
function setMasterEditorOn(on){  try{ if (on) sessionStorage.setItem(MASTER_EDITOR_KEY, "1"); else sessionStorage.removeItem(MASTER_EDITOR_KEY); }catch(e){}
}

function masterToCanonical(cat, item){
  if (cat === "sourceSections") return {...item, width:item.width||3};
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    return { nome:item[0]||"", desc:item[1]||"", group:item[2]||"", width:item[3]||3 };
  }
  if (cat === "passive") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Passiva", width:item.width||3, hidden:!!item.hidden };
  if (cat === "truccetti") return { nome:item.nome||"", desc:item.desc||"", uso:item.uso||"?", width:item.width||3, hidden:!!item.hidden };
  if (cat === "abilita") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Abilità", width:item.width||3, hidden:!!item.hidden };
  if (cat === "risorse") return { nome:item.nome||"", desc:item.desc||"", max:item.max||1, width:item.width||3, hidden:!!item.hidden };
  if (cat === "incantesimo") return { nome:item.nome||"", desc:item.desc||"", tag:item.tag||"Incantesimo", width:item.width||3, hidden:!!item.hidden };
  return { nome:"", desc:"", width:1 };
}
function masterFromCanonical(cat, c){
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    return [c.nome||"Nuovo elemento", c.desc||"", "", c.width||1];
  }
  if (cat === "passive") return { nome:c.nome||"Nuova Passiva", tag:c.tag||"Passiva", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "truccetti") return { nome:c.nome||"Nuovo Truccetto", uso:c.uso||"?", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "abilita") return { nome:c.nome||"Nuova Abilità", tag:c.tag||"Abilità", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  if (cat === "risorse") return { nome:c.nome||"Nuova Risorsa", desc:c.desc||"", max:c.max||1, used:0, width:c.width||1, hidden:!!c.hidden };
  if (cat === "incantesimo") return { nome:c.nome||"Nuovo Incantesimo", tag:c.tag||"Incantesimo", desc:c.desc||"", width:c.width||1, hidden:!!c.hidden };
  return { nome:c.nome||"", desc:c.desc||"" };
}

function masterRerender(cat){
  if (cat === "sourceSections") renderAll(); else renderPoteri();
}
function masterMoveCategory(cat, idx, newCat){
  if (newCat === cat) return;
  const item = STATE[cat][idx];
  const canon = masterToCanonical(cat, item);
  STATE[cat].splice(idx,1);
  if (!STATE[newCat]) STATE[newCat] = [];
  STATE[newCat].push(masterFromCanonical(newCat, canon));
  renderAll();
  queueSave();
}
function masterReorder(cat, idx, dir){
  const arr = STATE[cat];
  const j = idx + dir;
  if (j < 0 || j >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
  masterRerender(cat);
  queueSave();
}
function masterDelete(cat, idx){
  STATE[cat].splice(idx,1);
  masterRerender(cat);
  queueSave();
}
function masterCreate(cat){
  STATE[cat].push(masterFromCanonical(cat, {nome:"Nuovo elemento", desc:""}));
  masterRerender(cat);
  queueSave();
}
function masterBoxWidth(cat, idx){
  const item = STATE[cat][idx];
  return (MASTER_ARR_SHAPE_CATS.has(cat) ? item[3] : item.width) || 3;
}
function setMasterBoxWidth(cat, idx, w){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)) item[3] = w; else item.width = w;
  masterRerender(cat);
  queueSave();
}
function masterSetField(cat, idx, field, val){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)){
    if (field === "nome") item[0] = val;
    else if (field === "desc") item[1] = val;
    else if (field === "group") item[2] = val;
  } else {
    item[field] = val;
  }
}
function masterBoxHeight(cat, idx){
  const item = STATE[cat][idx];
  return (MASTER_ARR_SHAPE_CATS.has(cat) ? item[4] : item.h) || null;
}
function setMasterBoxHeight(cat, idx, h){
  const item = STATE[cat][idx];
  if (MASTER_ARR_SHAPE_CATS.has(cat)) item[4] = h; else item.h = h;
  queueSave();
}
/* Al rilascio di un resize verticale del Master, se l'altezza scelta
   manualmente è inferiore al minimo necessario a mostrare tutto il
   contenuto (produrrebbe uno scroll interno), il box viene espanso
   automaticamente al minimo richiesto: nessuna scrollbar interna, nessun
   testo tagliato. Restituisce l'altezza EFFETTIVA (px, intera) da salvare
   nello STATE, che quindi non è mai inferiore a quella richiesta dal
   contenuto. Se l'altezza scelta è già sufficiente resta invariata. */
function growBoxToFitContent(el){
  let h = Math.round(el.getBoundingClientRect().height);
  if (el.scrollHeight > el.clientHeight){
    h = Math.round(h + (el.scrollHeight - el.clientHeight));
    el.style.height = h + "px";
  }
  return h;
}
function masterBoxStyle(cat, idx){
  const w = masterBoxWidth(cat, idx);
  const h = masterBoxHeight(cat, idx);
  let style = "";
  if (w && w > 1) style += `grid-column:span ${w};`;
  if (h) style += `height:${h}px;`;
  return ` data-master-box="${cat}-${idx}"${style ? ` style="${style}"` : ""}`;
}
function masterToolbarHtml(cat, idx, opts){
  opts = opts || {};
  const options = (cat === "sourceSections" ? '<option value="sourceSections" selected>Sezione originale</option>' : "") + MASTER_CATS.map(c => `<option value="${c.key}"${c.key===cat?" selected":""}>${c.label}</option>`).join("");
  const w = masterBoxWidth(cat, idx);
  const widthCtl = opts.noWidth ? "" : `<select class="master-box-width" data-master-width="${cat}-${idx}" title="Larghezza del riquadro">
      <option value="1"${w===1?" selected":""}>1/3</option>
      <option value="2"${w===2?" selected":""}>2/3</option>
      <option value="3"${w===3?" selected":""}>3/3</option>
    </select>`;
  const canHide = !MASTER_ARR_SHAPE_CATS.has(cat);
  const isHidden = canHide && !!(STATE[cat][idx] && STATE[cat][idx].hidden);
  const eyeCtl = canHide
    ? `<button type="button" class="master-mini-btn master-eye-btn${isHidden?' is-hidden':''}" data-master-eye="${cat}-${idx}" title="${isHidden?'Nascosto al giocatore — clic per mostrare':'Visibile al giocatore — clic per nascondere'}">${isHidden?'🙈':'👁️'}</button>`
    : "";
  return `<div class="master-toolbar">
    <select class="master-cat-select" data-master-move="${cat}-${idx}" title="Sposta in un'altra categoria">${options}</select>
    <button type="button" class="master-mini-btn" data-master-up="${cat}-${idx}" title="Sposta su">↑</button>
    <button type="button" class="master-mini-btn" data-master-down="${cat}-${idx}" title="Sposta giù">↓</button>
    ${widthCtl}
    ${cat === "risorse" ? `<label>max <input type="number" min="0" max="100" data-resource-max="${idx}" value="${STATE[cat][idx].max}" style="width:64px"></label>` : ""}
    ${eyeCtl}
    <button type="button" class="master-mini-del" data-master-del="${cat}-${idx}" title="Elimina questo elemento">✕</button>
  </div>`;
}
function masterNewBoxBtn(cat, label){
  return `<button type="button" class="btn master-add-btn" data-master-create="${cat}">+ Nuovo box — ${label}</button>`;
}
function masterToggleHidden(cat, idx){
  const item = STATE[cat][idx];
  if (!item) return;
  item.hidden = !item.hidden;
  masterRerender(cat);
  queueSave();
}
function bindMasterControls(root){
  root = root || document;
  root.querySelectorAll("[data-resource-max]").forEach(el=>el.addEventListener("change",()=>{if(!isMasterEditorOn())return; const r=STATE.risorse[+el.dataset.resourceMax]; r.max=Math.max(0,Math.min(100,parseInt(el.value)||0));r.used=Math.min(r.used,r.max);renderPoteri();queueSave();}));
  root = root || document;
  if (!isMasterEditorOn()) return;
  root.querySelectorAll('[data-master-move]').forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const [cat, idx] = sel.dataset.masterMove.split("-");
      masterMoveCategory(cat, Number(idx), sel.value);
    });
  });
  root.querySelectorAll('[data-master-up]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterUp.split("-");
      masterReorder(cat, Number(idx), -1);
    });
  });
  root.querySelectorAll('[data-master-down]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterDown.split("-");
      masterReorder(cat, Number(idx), 1);
    });
  });
  root.querySelectorAll('[data-master-del]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterDel.split("-");
      masterDelete(cat, Number(idx));
    });
  });
  root.querySelectorAll('[data-master-eye]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [cat, idx] = btn.dataset.masterEye.split("-");
      masterToggleHidden(cat, Number(idx));
    });
  });
  root.querySelectorAll('[data-master-width]').forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const [cat, idx] = sel.dataset.masterWidth.split("-");
      setMasterBoxWidth(cat, Number(idx), Number(sel.value));
    });
  });
  root.querySelectorAll('[data-master-box]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const [cat, idx] = el.dataset.masterBox.split("-");
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = growBoxToFitContent(el);
        if (h && h !== masterBoxHeight(cat, Number(idx))){
          setMasterBoxHeight(cat, Number(idx), h);
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
  root.querySelectorAll('[data-master-create]').forEach(btn=>{
    btn.addEventListener("click", ()=>{ masterCreate(btn.dataset.masterCreate); });
  });
  root.querySelectorAll('[data-master-field]').forEach(el=>{
    const evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, ()=>{
      const [cat, idx, field] = el.dataset.masterField.split("|");
      const val = el.matches("[contenteditable]") ? el.innerHTML : el.value;
      masterSetField(cat, Number(idx), field, val);
      queueSave();
    });
  });
}
function initMasterEditorToggle(){
  const btn = document.getElementById("master-editor-toggle");
  if (!btn) return;
  if (!isMasterUnlocked()){
    btn.classList.remove("show");
    return;
  }
  btn.classList.add("show");
  const refresh = ()=>{
    const on = isMasterEditorOn();
    btn.classList.toggle("on", on);
    btn.textContent = on ? "🛠️ Editor Master: ON" : "🛠️ Editor Master";
    document.body.classList.toggle("master-editor-on", on);
  };
  refresh();
  btn.addEventListener("click", ()=>{
    setMasterEditorOn(!isMasterEditorOn());
    refresh();
    renderAll();
  });
}

const MARY_EQUIP_V2_DETAILS = "<p>TESTA</p><p>X</p><p>BUSTO</p><p>CAPPOTTO DI KAMUT</p><p>GAMBE</p><p>VESTE SEMPLICE</p><p>ARMA 1</p><p>PENNELLO DEL TRATTO VIVO</p><p>ARMA 2</p><p>X</p><p>ALTR0O</p><p>X</p><p>ARTEFATTO 1</p><p>TAVOLA GAMMICA</p><p>ARTEFATTO 2</p><p>CAVALLETTO DEL BIANCO PURO</p><p>ARTEFATTO 3</p><p>X</p><p>PENNELLO DEL TRATTO VIVO: Un pennello antico, con manico scuro e finiture dorate, usato da artisti itineranti capaci di trasformare il disegno in gesto reale. Il pennello non “evoca” materia: crea solo inchiostro animato, solido quel tanto che basta per colpire, afferrare, proteggere o sostenere per un tempo breve, poi si sfalda e svanisce. Il PG può disegnare su tela o su un supporto adatto, ma può anche comandare a distanza l’inchiostro già depositato in un punto, come se tracciasse direttamente lì. Le creazioni possono essere offensive o di utilità (barriere, prese, fruste, appigli, scudi, blocchi, trascinamenti, ecc.) e la loro stabilità dipende da quanto sono grandi e/o dettagliate: più sono complesse, più richiedono attenzione e tendono a essere meno stabili. Il PG ha un tetto massimo di danni per turno (40) da commutare in dadi : se genera più creazioni offensive, divide quel totale tra di loro (es. 4 creazioni piccole = 4 colpi separati che si spartiscono il massimale). Di norma il personaggio avrebbe 2 AZIONI e 2 ATTACCHI nel turno; quando impugna il Pennello, AZIONI e ATTACCHI si fondono in un unico totale di 4 “interventi” ridistribuibili liberamente (fino a 4 azioni, 4 attacchi o combinazioni), senza influenzare l'azione di movimento/uso oggetti. Un disegno piccolo richiede 1 intervento, un disegno medio 2 interventi, un disegno grande tutti e 4, con possibilità di combinare (es. 2 piccoli + 1 medio). Il PG può anche impiegare tutti e 4 gli interventi solo in tratto e concentrazione per completare una creazione ancora più grande o complessa, rinunciando ad altro nel turno; il “peso” non dipende solo dalla taglia: contano anche precisione, controllo e funzioni specifiche. Evocazioni Persistenti : quando si parla degli ATTACCHI, il PG può scegliere di non creare colpi istantanei ma una vera e propria evocazione d’inchiostro (corvi, bestie, figure animate); una volta generata, finché non viene eliminata o distrutta, rimane sul territorio e diventa la fonte dei suoi attacchi: finché presente, il PG può continuare a usare quella forma per colpire spendendo 1 solo punto Azione. La permanenza non ha un tempo fisso: dipende dall’inchiostro investito e dai danni/dispersione; ogni evocazione ha Punti Ferita propri e resta in campo fino a distruzione/eliminazione/trasformazione in runa. La quantità di inchiostro disponibile è limitata: più grande e dettagliata è l’evocazione, più inchiostro rimane impegnato e meno il PG ne avrà per generare altre cose; taglia e numero di evocazioni dipendono dagli interventi spesi nel turno: 1 intervento = una forma piccola (es. 1 corvo), 2 interventi = due forme piccole o una media, 4 interventi = una forma grande o più forme minori, secondo le regole già indicate. Il PG può mantenere attive fino a un massimo di 4 evocazioni piccole, oppure 2 medie, oppure 1 grande; spendendo l’intero turno in tratto e concentrazione può evocarne direttamente una grande sul campo (impiegando tutti e 4 gli interventi solo per disegnare), rinunciando ad altro nel turno. Le evocazioni possono trasformarsi in una runa su un punto (terreno, oggetto, bersaglio) al contatto, permettendo al PG di imprimere rune tramite i disegni oltre che tracciarle su tela o a terra. Il pennello nasconde un’anima lama: in casi estremi viene usato come coltello, infliggendo 2D6 danni per ogni attacco disponibile. Passiva : il pennello può assorbire solo il colore di ciò che tocca (pigmenti, tinte, vernici, polveri, tracce cromatiche) e replicarlo nel suo inchiostro; non copia proprietà, poteri o effetti, prende esclusivamente la cromia. Abilità Speciale : anche una sola chiazza d’inchiostro su terreno, oggetto o bersaglio può diventare un punto di comando; in un secondo momento il PG può farla espandere, muovere o trasformare in una creazione a distanza, come se stesse disegnando direttamente su quel punto.</p><p>CAPPOTTO DI KAMUT : Un cappotto spesso e lungo ricavato dalla pelle del Kamut, una creatura tipica di Brodental, noto perché la sua fibra reagisce agli urti irrigidendosi nel punto dell’impatto come una corazza naturale che “scatta” solo quando serve, spezzando e assorbendo parte della forza e garantendo +2 alla CA (efficace soprattutto contro colpi moderati e ripetuti, mentre contro impatti estremi la protezione non è assoluta e può comunque essere superata). Il cappotto è costruito in modo estremamente modulare: lungo tutta la struttura presenta numerosi agganci, clip e attacchi che permettono di staccare e riattaccare sezioni, in particolare le parti delle braccia/maniche, così da adattarlo rapidamente a climi molto freddi o più caldi e a esigenze diverse del possessore senza perdere la sua funzione principale. Non possiede altre abilità “attive”, ma è ricco di dettagli pratici: molte tasche nascoste, punti di fissaggio per piccoli oggetti e accessori, e una vestibilità regolabile che lo rende un indumento da viaggio completo oltre che una protezione affidabile.</p><p>TAVOLA GAMMICA : Un bracciale leggendario dall’aspetto elegante e discreto quando è chiuso, come un semplice ornamento dorato. Quando il PG lo desidera, l’artefatto si apre “a ali” e si dispiega in una vera tavolozza: possiede 11 gemme totali, 1 centrale molto più grande e 10 minori distribuite sulle due ali. Le gemme cambiano colore a volontà del possessore, permettendo di avere sempre la cromia perfetta pronta senza dover cercare pigmenti o preparare miscele. La tavola però non conserva solo colori: conserva anche “tratti”, cioè disegni già fissati e memorizzati. Ogni gemma può immagazzinare un tratto completo registrato in precedenza; quando il PG lo richiama, quel tratto viene riprodotto con estrema rapidità sulla superficie scelta, come se si disegnasse quasi da solo, riducendo drasticamente il tempo di esecuzione rispetto a una creazione improvvisata. Le 10 gemme minori ospitano tratti ordinari e versatili, mentre la gemma centrale può contenere un tratto speciale più potente del normale, pensato per momenti decisivi: la forma e la funzione del tratto maggiore vengono scelte dal PG al momento della registrazione e restano coerenti con la natura di “inchiostro vivo”, senza copiare poteri leggendari o proprietà impossibili. In casi estremi, l’artefatto può anche compattarsi e rimodellarsi fisicamente fino a diventare un piccolo scudo circolare, garantendo +1 alla CA finché resta in assetto difensivo, poi può richiudersi tornando alla forma di bracciale 2 X SCONTRO. Passiva : Il PG può cambiare istantaneamente colore alle gemme, mantenendo sempre pronta la cromia desiderata per il pennello o per qualsiasi intervento d’inchiostro. Abilità Speciale : Il bracciale può registrare e conservare 11 tratti. Le 10 gemme minori contengono tratti ordinari richiamabili rapidamente; la gemma centrale contiene 1 tratto maggiore, più potente, utilizzabile in contesti critici. Inoltre, cliccando una gemma, il PG può proiettare a distanza la cromia selezionata come spruzzo d’inchiostro oppure rilasciare direttamente il tratto preregistrato su una superficie a scelta. Questo permette di usare i tratti salvati anche senza il pennello, in situazioni di emergenza o quando lo strumento principale è indisponibile.</p><p>CAVALLETTO DEL BIANCO PURO: Un treppiedi di legno richiudibile, consumato dal viaggio ma rifinito con incisioni sottili e piccoli rinforzi decorativi che lo fanno sembrare più di un semplice attrezzo. Quando viene aperto, la tela non si appoggia: nasce dal cavalletto stesso, tendendosi agli angoli come una vela tirata in forza, pronta a ricevere il tratto. Quando viene richiuso, la struttura rientra su sé stessa e la tela si ripiega insieme alle aste, serrandosi in un fascio compatto da portare sulle spalle. Si dice che questo cavalletto sia stato costruito per artisti che non potevano permettersi errori permanenti: ogni scena dipinta doveva poter sparire, ogni bozza doveva poter rinascere pulita, come se la pagina non avesse mai conosciuto macchia. Passiva : La tela può essere “azzerata” a comando del possessore. Qualunque materiale sia stato usato per dipingere viene cancellato e la superficie torna pulita e bianca, pronta a essere riutilizzata, senza lasciare residui. Abilità Speciale : Il cavalletto è legato al suo possessore tramite un semplice vincolo di tracciamento. Una volta designato, lo segue automaticamente e lo raggiunge quando viene richiamato o quando resta indietro, senza essere vivo e senza comprendere ciò che accade: si limita a muoversi per tornare dal proprietario.</p>";
const MARY_VADEMECUM_V2_DESC = "<p>- PROMEMORIA DADI\u000b D2 (moneta) · D4 · D6 · D8 · D10 · D12 · D20 · D100 normale o percentuale.\u000b Il D20 serve quasi sempre per capire se “riesci” (prove, colpire, tiri salvezza).\u000b I dadi come D4/D6/D8/D10/D12 servono quasi sempre per dire “quanto” (cura, danni, scudi, quantità).\u000b Il D100 è una percentuale (spesso si fa con due D10: uno per le decine e uno per le unità).                                                    D20 e D100 possono essere utilizzati per grandi danni. Generalmente se si vuole aumentare i danni inflitti è preferibile utilizzare più dadi perché “+ Dadi = + Danni”.                                                                                                       Esempio : Palla di Fuoco al lvl 5 deve fare massimo 100 danni, invece di 1D100 useremo 5D20 o 10D10.</p><p>- COME PARTIRE: “COSA VOGLIO FARE?”\u000bInizia sempre con una domanda secca: COSA VOGLIO FARE? Voglio curare, Voglio proteggere, Voglio spostare, Voglio rallentare, Voglio potenziare. In base alla risposta analizza le rune che hai a disposizione e cosa fanno. Se nella frase ci sono due effetti grandi, il modo più semplice e veloce è separarli, ma in casi estremi ricordati che hai a disposizione la RUNA DELLA SINERGIA</p><p>- LE 5 COSE CHE UNA RUNA DEVE AVERE</p><p>Su chi agisce (bersaglio)\u000b Devi sempre sapere se la runa riguarda te stessa, un alleato, un nemico, oppure un’area. Questa scelta decide quanto dev’essere “contenuta”: una runa su un solo bersaglio può permettersi più potenza; una runa ad area o su più bersagli, invece, deve stare più attenta a durata e forza perché impatta molte cose insieme.</p><p>Da dove la fai funzionare (gittata)\u000b La distanza cambia la comodità della runa. Contatto significa che devi esporti e avvicinarti; una gittata media ti permette di restare al sicuro; una gittata lunga ti dà controllo da lontano. Più la runa è comoda da lanciare lontano, più è importante tenerla chiara (potenza o durata più gestibili). Anche solo ricordarsi “quanto lontano posso farla partire?” evita metà delle confusioni al tavolo.</p><p>Quanto dura (durata)\u000b Una runa può essere istantanea (succede e finisce) oppure durare per un certo tempo (turni, minuti…). La durata è una delle leve più forti del gioco: un effetto anche “normale”, se dura tanto, diventa enorme. Per questo, quando crei una runa, chiediti sempre: “deve essere un colpo secco o un effetto che resta?” e “quanto mi serve davvero che resti?”.</p><p>Che posto occupa nel tuo turno (azione/bonus/reazione)\u000bDi solito nel turno si ha un’Azione/Attacco, a volte una Bonus, e il Movimento; la Reazione è un “intervento” fuori turno quando scatta una condizione. Una runa da Azione può permettersi di essere più importante. Una runa da Bonus deve essere più semplice o più piccola (perché la sommi a un’altra azione). Una runa da Reazione è spesso difensiva o “al momento giusto”, e quindi va tenuta molto chiara e immediata. Scegliere questo punto ti fa capire subito quanto la runa può essere “grossa”.</p><p>Se influenza un nemico, come può resistere (difesa)\u000b Se la runa cura o potenzia un alleato, di solito non serve che qualcuno “resista”. Se invece la runa dà fastidio a un nemico (lo rallenta, lo blocca, lo sposta controvoglia, gli impedisce di fare bene qualcosa), allora quasi sempre deve esistere una via di difesa: un Tiro Salvezza (TS), una prova contrapposta, o un tiro per colpire, effettuato con un D20.</p><p>- POTENZA: DADI O NUMERI, MA SEMPRE CON CRESCITA\u000b La potenza si può esprimere con dadi oppure con numeri fissi. L’importante è non scegliere “a caso”, ma pensare già alla scala fino al 5.\u000b Esempio con numeri: se a livello 1 fai 10, poi deve crescere in modo leggibile (spesso raddoppio o crescita costante: 10→20→40→60→100, con il 5 che può “staccare” un po’).\u000b Esempio con dadi: stesso concetto, D4→D6→D8→D12→D20. Non è obbligatorio usare i dadi: sono solo un modo comodo per non perdere coerenza.</p><p>- EFFETTI SPECIALI: QUANDO CI STANNO\u000b Un effetto “speciale” (secondario) si può aggiungere, ma di norma ha senso quando i livelli sono già alti, perché altrimenti la runa diventa troppo piena. La regola pratica: fino ai livelli bassi fai effetti puliti; ai livelli alti puoi permetterti il “plus”, purché resti coerente col tipo di runa.</p><p>- CHE COSA SIGNIFICA DAVVERO LIVELLO 1→5\u000b Livelli 1–2: “piccolo e chiaro”\u000b Effetti brevi, potenza bassa, un solo bersaglio o impatto limitato. Sono i livelli dove la runa deve essere facile da usare e difficile da abusare.</p><p>Livelli 3–4: “medio e solido”\u000b Qui iniziano durata più comoda, impatto più visibile, possibilità di toccare meglio il campo (senza diventare onnipotenti). È anche il punto in cui puoi iniziare a pensare a piccole variazioni intelligenti, ma senza strafare.</p><p>Livello 5: “apicale”\u000b È il massimo attuale: pochi slot, potenza alta. Qui puoi sbilanciarti di più: o un salto di potenza, o un effetto speciale davvero significativo, o un controllo più incisivo. Il livello 5 deve “sentirsi” diverso, perché è raro e prezioso.</p><p>Livello 6: “devastante”\u000b È un Livello Bonus, alcuni hanno la possibilità di raggiungerlo per concentrazione altri per superamento di limite di potenza, altri come Mary, hanno la possibilità di crearli. Essendo estremamente raro, questo Slot richiede massima attenzione, ma in linea di massima ha molto margine d’azione poiché allo stato attuale rappresenta l’espressione massima di un Incantesimo/Abilità.</p><p>- SUGLI SLOT \u000b Lo slot non è solo “quanto forte”: è quanto spazio ti concedi. Più lo slot è alto, più puoi permetterti potenza e/o complessità, soprattutto dal 4 e ancora di più al 5. Il 5, proprio perché è raro, può reggere l’effetto speciale migliore.</p><p>- IL “PEGNO” NON È OBBLIGATORIO, MA È UNO STRUMENTO\u000b Non è vero che una runa forte deve per forza pagare sempre. Però, quando una runa è molto comoda (lunga durata + tanta distanza + tanti bersagli + grande potenza), allora per equilibrio conviene scegliere almeno un limite. Non come punizione: come modo per tenere la runa giocabile e chiara.</p><p>dura poco</p><p>ha poca distanza</p><p>colpisce un solo bersaglio</p><p>richiede concentrazione</p><p>- COME NON ANDARE IN LOOP (quando non sai cosa fare)\u000b Non partire dalla runa: parti dal bisogno del momento. COSA VOGLIO / DEVO FARE ? Sopravvivere (cura/protezione), muoversi (spazio), impedire una cosa (tempo), potenziare l’azione chiave (amplificazione).</p><p>- PROMEMORIA DA TENERE IN TESTA\u000b Una runa è sempre: “una frase chiara” + “chi” + “distanza” + “durata” + “quanto è forte” (+ “difesa se colpisce un nemico”).</p><p>- CONSIGLIO TATTICO (timing di combattimento)</p><p>Gestione Azioni nel Turno :                                                                                                                                                                Le 4 azioni sono un vantaggio enorme, ma vanno amministrate: non devono diventare “quattro attacchi fissi”, altrimenti Mary smette di essere supporto e soprattutto rinuncia alla sua forza principale, cioè il controllo della scena. Una regola semplice è trattare quelle 4 azioni come un budget da dividere ogni turno tra tre bisogni:                                                                                     (1) posizione sicura / vantaggiosa                                                                                                                   (2) rune utili al momento                                                                                                                     (3) eventuali attacchi.                                                                                                                                    Se in un turno devi riposizionarti molto (perché ti hanno puntata o perché vuoi un’angolazione migliore), puoi spendere 1–2 azioni per Natura/Materia e tenere le altre 2 per una runa “chiave” + un attacco (o due attacchi se la runa non serve). Se invece sei già in posizione perfetta, puoi dedicare più azioni alle rune: una per proteggere/curare/amplificare e una per svantaggiare un nemico, lasciando le restanti per attacco o micro-spostamenti. L’errore più comune da evitare è fare “solo danno” quando la squadra sta rischiando: in quel caso anche un singolo intervento di Protezione/Cura/Amplificazione al momento giusto vale più di due attacchi.                                     Prima sicurezza e vantaggio, poi stabilizzazione degli alleati, poi controllo del nemico, e solo alla fine attacco.</p><p>Gestione Rune :                                                                                                                                                         Mary deve ragionare come “regista” dello scontro: non vince stando nel mucchio, vince scegliendo dove stare e in che ordine intervenire. La priorità è sempre creare vantaggio tattico e sopravvivere: usare Protezione, Natura e Materia per tenersi lontana dalla linea di fuoco, cambiare posizione, dissimulare la propria presenza, celarsi dietro coperture o punti difficili da raggiungere, e soprattutto non farsi mai “agganciare” dal nemico. Il suo turno va pensato come una sequenza: prima mettersi al sicuro o riposizionarsi (se serve), poi intervenire sugli alleati, e solo dopo, quando la squadra è stabilizzata, iniziare ad Attaccare e Disturbare i nemici. In pratica, il loop mentale è: proteggere gli alleati (Runa della Protezione), curarli se necessario (Runa della Cura) oppure potenziarli nel momento giusto (Runa dell’Amplificazione); appena la linea amica regge, passare a creare svantaggio e controllo sul nemico con Tempo, Spazio o Spirito, scegliendo ogni volta l’opzione più utile alla situazione (rallentare chi sta arrivando, spostare/impedire un ingaggio, spezzare un’azione chiave, confondere o limitare). Solo se resta “spazio mentale e d’azione” dopo aver sistemato posizionamento e runa/e fondamentali, allora conviene convertire il resto in attacchi: Mary può fare danni, ma il suo valore vero è far sì che gli altri facciano danni meglio e più a lungo.</p><p>- REGOLA MADRE :                                                                                                                                                 Quando hai dubbi perplessità o incertezze CHIEDI AL MASTER e il gioco è fatto.</p>";
const MARY_NOTE_V2_DESC = "<p>PENNELLO DEL TRATTO VIVO: Un pennello antico, con manico scuro e finiture dorate, usato da artisti itineranti capaci di trasformare il disegno in gesto reale. Il pennello non “evoca” materia: crea solo inchiostro animato, solido quel tanto che basta per colpire, afferrare, proteggere o sostenere per un tempo breve, poi si sfalda e svanisce. Il PG può disegnare su tela o su un supporto adatto, ma può anche comandare a distanza l’inchiostro già depositato in un punto, come se tracciasse direttamente lì. Le creazioni possono essere offensive o di utilità (barriere, prese, fruste, appigli, scudi, blocchi, trascinamenti, ecc.) e la loro stabilità dipende da quanto sono grandi e/o dettagliate: più sono complesse, più richiedono attenzione e tendono a essere meno stabili. Il PG ha un tetto massimo di danni per turno (40) da commutare in dadi : se genera più creazioni offensive, divide quel totale tra di loro (es. 4 creazioni piccole = 4 colpi separati che si spartiscono il massimale). Di norma il personaggio avrebbe 2 AZIONI e 2 ATTACCHI nel turno; quando impugna il Pennello, AZIONI e ATTACCHI si fondono in un unico totale di 4 “interventi” ridistribuibili liberamente (fino a 4 azioni, 4 attacchi o combinazioni), senza influenzare l&#x27;azione di movimento/uso oggetti. Un disegno piccolo richiede 1 intervento, un disegno medio 2 interventi, un disegno grande tutti e 4, con possibilità di combinare (es. 2 piccoli + 1 medio). Il PG può anche impiegare tutti e 4 gli interventi solo in tratto e concentrazione per completare una creazione ancora più grande o complessa, rinunciando ad altro nel turno; il “peso” non dipende solo dalla taglia: contano anche precisione, controllo e funzioni specifiche. Evocazioni Persistenti : quando si parla degli ATTACCHI, il PG può scegliere di non creare colpi istantanei ma una vera e propria evocazione d’inchiostro (corvi, bestie, figure animate); una volta generata, finché non viene eliminata o distrutta, rimane to da artisti itineranti capaci di trasformare il disegno in gesto reale. Il pennello non “evoca” materia: ciò che crea è sempre e solo inchiostro animato, solido quel tanto che basta per colpire, afferrare, proteggere o sostenere per un tempo breve, poi si sfalda e svanisce. Il PG può disegnare su tela o su un supporto adatto, ma può anche comandare a distanza l’inchiostro già depositato in un punto, come se stesse tracciando direttamente lì. Il PG ha un tetto massimo di danni per turno (40): se genera più creazioni offensive, divide quel totale tra di loro (esempio 4 creazioni piccole = 4 colpi separati che si spartiscono il massimale). Le creazioni possono essere offensive o di utilità (barriere, prese, fruste, appigli, scudi, blocchi, trascinamenti, ecc.) e hanno durata breve e non fissa: più una creazione è grande o dettagliata, più richiede attenzione e tende a essere meno stabile; più è semplice, più è rapida ma meno “fine” nelle funzioni. Di norma il personaggio avrebbe 2 AZIONI e 2 ATTACCHI nel turno. Quando impugna il Pennello del Tratto Vivente, AZIONI e ATTACCHI si fondono in un unico totale di 4 “interventi” ridistribuibili liberamente in base a ciò che disegna (fino a 4 azioni, fino a 4 attacchi, o combinazioni) il tutto non influenza l’azione di movimento/utilizzo oggetti del PG. Un disegno piccolo ne richiede 1, un disegno medio 2, un disegno grande tutti e 4, con possibilità di combinare (es. 2 piccoli + 1 medio). Il PG può anche impiegare tutti e 4 gli interventi solo in concentrazione e tratto per completare una creazione ancora più grande o complessa, rinunciando ad altro nel turno. Il costo non dipende solo dalla grandezza: conta anche la completezza e la precisione del disegno. Due creazioni della stessa taglia possono quindi “pesare” in modo diverso, perché più il PG pretende dettagli, controllo e funzioni specifiche, più la creazione richiede attenzione.</p><p>Evocazioni Persistenti “Forma d’Inchiostro” : Quando si parla degli ATTACCHI del personaggio, il PG può scegliere di non creare colpi “istantanei”, ma di generare una vera e propria evocazione d’inchiostro (es. corvi, bestie, figure animate). Una volta generata, finché non viene eliminata o distrutta, l’evocazione rimane sul territorio e diventa la fonte dei suoi attacchi: finché è presente, il PG può continuare a usare quella forma per colpire spendendo 1 solo punto Azione. La permanenza non ha un tempo fisso: dipende da quanto inchiostro è stato investito e da quanto la creazione viene danneggiata o dispersa. Ogni evocazione ha Punti Ferita propri e resta in campo fino a distruzione/eliminazione/trasformazione in runa. La quantità di inchiostro disponibile è limitata: più grande e più dettagliata è l’evocazione, più inchiostro “rimane impegnato” in essa e meno il PG ne avrà a disposizione per generare altre cose. La taglia dell’evocazione e il numero di evocazioni dipendono dagli “interventi” spesi nel turno: 1 intervento = una forma piccola (es. 1 corvo), 2 interventi = due forme piccole o una media, 4 interventi = una forma grande o più forme minori, secondo le regole già indicate. Le evocazioni possono trasformarsi in una runa su un punto (terreno, oggetto, bersaglio) al contatto, permettendo al PG di “imprimere” rune tramite i suoi disegni oltre che disegnarle su tela o a terra. Il PG può mantenere contemporaneamente attive fino a un massimo di 4 evocazioni di taglia piccola, oppure 2 medie, oppure 1 grande. “Spendendo” l’intero turno in tratto e concentrazione può evocarne direttamente una grande sul campo (impiegando tutti e 4 gli interventi solo per disegnare), rinunciando ad altro nel turno.</p><p>Il pennello nasconde un’anima lama: in casi estremi viene usato come coltello, infliggendo 2D6 danni per ogni attacco disponibile.</p><p>(Passiva) : Il pennello può assorbire solo il colore di ciò che tocca (pigmenti, tinte, vernici, polveri, tracce cromatiche) e replicarlo nel suo inchiostro. Non copia proprietà, poteri o effetti: prende esclusivamente la cromia.</p><p>Abilità Speciale : Anche una sola chiazza d’inchiostro lasciata su terreno, oggetto o bersaglio può diventare un punto di comando. In un secondo momento il PG può farla espandere, muovere o trasformare in una creazione a distanza, come se stesse disegnando su quel punto.</p>";
function migrateTravellerState(){
  if (!STATE || STATE.sheetId !== DEFAULT_STATE.sheetId) return;

  if ((STATE.travellerLayoutVersion || 0) < 1){
    for (const key of ['passive','truccetti','abilita','incantesimo','sourceSections']){
      if (!STATE[key] || STATE[key].length === 0) STATE[key] = JSON.parse(JSON.stringify(DEFAULT_STATE[key] || []));
    }
    STATE.risorse = STATE.risorse || [];
    for (const resource of DEFAULT_STATE.risorse || []){
      if (resource.sourceId && !STATE.risorse.some(r=>r.sourceId === resource.sourceId || (r.nome === resource.nome && !r.sourceId))){
        STATE.risorse.push(JSON.parse(JSON.stringify(resource)));
      }
    }
    if (TRAVELLER_MAGE && STATE.slots.length === 1 && STATE.slots[0].lvl === 1 && STATE.slots[0].max === 6){
      STATE.slots = JSON.parse(JSON.stringify(DEFAULT_STATE.slots)).map((s,i)=>({...s,used:i===0?STATE.slots[0].used:0}));
    }
    if (!STATE.portraits) STATE.portraits = JSON.parse(JSON.stringify(DEFAULT_STATE.portraits));
    STATE.portraits.forEach((p,i)=>{if (!p.img) p.img=DEFAULT_STATE.portraits[i]?.img||''; if (/^Ritratto [12]$/.test(p.cap||'')) p.cap=DEFAULT_STATE.portraits[i]?.cap||p.cap;});
    STATE.travellerLayoutVersion = 1;
  }

  if ((STATE.travellerLayoutVersion || 0) < 2){
    STATE.truccetti = STATE.truccetti || [];
    for (const canonicalTrucchetto of DEFAULT_STATE.truccetti || []){
      if (!STATE.truccetti.some(t=>t && t.nome === canonicalTrucchetto.nome)){
        STATE.truccetti.push(JSON.parse(JSON.stringify(canonicalTrucchetto)));
      }
    }
    STATE.travellerLayoutVersion = 2;
  }

  if ((STATE.travellerLayoutVersion || 0) < 6){
    if (STATE.identityColor === "#b89b5e" && !STATE.identityColor2){
      STATE.identityColor = DEFAULT_STATE.identityColor;
      STATE.identityColor2 = DEFAULT_STATE.identityColor2;
    }

    const sections = STATE.sourceSections || (STATE.sourceSections=[]);

    if (STATE.equipDettagli === MARY_EQUIP_V2_DETAILS){
      STATE.equipDettagli = "";
      if (!sections.some(s=>s.group==="STRUMENTI DI MARY")){
        const cards=(DEFAULT_STATE.sourceSections||[]).filter(s=>s.group==="STRUMENTI DI MARY").map(s=>JSON.parse(JSON.stringify(s)));
        const at=sections.findIndex(s=>s.location==="equip");
        sections.splice(at<0?sections.length:at,0,...cards);
      }
    }

    const vadIndex=sections.findIndex(s=>s.nome==="VADEMECUM CREAZIONE" && s.desc===MARY_VADEMECUM_V2_DESC);
    if (vadIndex>=0){
      const cards=(DEFAULT_STATE.sourceSections||[]).filter(s=>s.group==="VADEMECUM CREAZIONE" || s.group==="TACTICA DI MARY").map(s=>JSON.parse(JSON.stringify(s)));
      sections.splice(vadIndex,1,...cards);
    }

    const oldNoteIndex=sections.findIndex(s=>s.nome==="NOTE" && s.desc===MARY_NOTE_V2_DESC);
    if (oldNoteIndex>=0) sections.splice(oldNoteIndex,1);

    const refuge=sections.find(s=>s.nome==="🏡 RIFUGIO 🏡");
    if (refuge && refuge.location==="equip") refuge.location="note";

    STATE.travellerLayoutVersion = 6;
  }
}

function sourceSectionsHtml(location){
  const masterOn=isMasterEditorOn(); let lastGroup='';
  return (STATE.sourceSections||[]).map((s,i)=>{
    if ((s.location||'poteri')!==location || (!masterOn && s.hidden)) return '';
    const group=s.group && s.group!==lastGroup ? `<h2 class="source-group-title">${esc(s.group)}</h2>`:'';lastGroup=s.group||'';
    return `${group}<div class="subcard source-block${s.hidden?' master-hidden-item':''}" data-source-group="${esc(s.group||'')}" data-source-name="${esc(s.nome||'')}" id="source-${i}"${masterBoxStyle('sourceSections',i)}>
      ${masterOn?masterToolbarHtml('sourceSections',i,{noWidth:true}):''}
      ${masterOn?`<input class="master-name-input" data-master-field="sourceSections|${i}|nome" value="${esc(s.nome)}">`:`<h3>${esc(s.nome)}</h3>`}
      <div class="rich" ${masterOn?'contenteditable="true"':''} data-master-field="sourceSections|${i}|desc">${formatTravellerRich(s.desc)}</div>
    </div>`;
  }).join('');
}
function mountSourceSections(location){
  const panel=document.getElementById('panel-'+location);if(!panel)return;
  panel.querySelectorAll('.source-sections').forEach(el=>el.remove());
  const markup=sourceSectionsHtml(location);
  if(markup){const wrap=document.createElement('div');wrap.className='card source-sections';wrap.innerHTML=markup;panel.append(wrap);bindMasterControls(wrap);}
}

function renderPoteri(){
  const masterOn=isMasterEditorOn(), panel=document.getElementById('panel-poteri');
  const categories=[['truccetti','Trucchetti','tag-truccetto'],['abilita','Abilità','tag-abilita'],['incantesimo','Incantesimi','tag-incantesimo'],['passive','Passive','tag-passiva'],['ambiti','Ambiti','tag-ambito'],['campiAttiva','Campi','tag-campo']];
  const visible=cat=>(STATE[cat]||[]).some(x=>!x.hidden);
  const resourceIndexFor=(cat,item)=>{
    const key=String(item.nome||'').split('\n')[0].toLocaleLowerCase();
    return (STATE.risorse||[]).findIndex(r=>r.nome.toLocaleLowerCase()===key || (TRAVELLER_RESOURCE_ALIASES[key]&&r.nome===TRAVELLER_RESOURCE_ALIASES[key]));
  };
  const linked=new Set();
  const cards=categories.map(([cat,label,cls])=>{
    if (!masterOn&&!visible(cat))return '';
    const body=(STATE[cat]||[]).map((raw,i)=>{
      const item=Array.isArray(raw)?{nome:raw[0],desc:raw[1],width:raw[3]||3}:raw;
      if(!masterOn&&item.hidden)return '';
      const ri=resourceIndexFor(cat,item);let uses='';
      if(ri>=0){linked.add(ri);const r=STATE.risorse[ri];
        if(masterOn||!r.hidden)uses=`<div class="power-uses">${r.desc?`<div class="rich power-resource-description">${formatTravellerRich(r.desc)}</div>`:''}<span class="field-label">${esc(r.nome)} · utilizzi</span><div class="pips">${Array.from({length:r.max},(_,p)=>`<button type="button" class="pip ${p<r.used?'used':''}" data-respip="${ri}-${p}" aria-label="${esc(r.nome)}: utilizzo ${p+1}" aria-pressed="${p<r.used}"></button>`).join('')}</div></div>`;
      }
      return `<div class="subcard${item.hidden?' master-hidden-item':''}" data-width="${item.width||3}" id="anchor-${slugify(item.nome)}"${masterBoxStyle(cat,i)}>
        ${masterOn?masterToolbarHtml(cat,i):''}<span class="tag ${cls}">${esc(MASTER_CATS.find(c=>c.key===cat)?.label||label)}</span>
        ${masterOn?`<input class="master-name-input" data-master-field="${cat}|${i}|nome" value="${esc(item.nome)}">`:`<h3>${esc(item.nome)}</h3>`}
        <div class="rich" ${masterOn?'contenteditable="true"':''} data-master-field="${cat}|${i}|desc">${formatTravellerRich(item.desc||'')}</div>${uses}
      </div>`;
    }).join('');
    return `<section class="card" id="powers-${cat}"><h2>${label}</h2><div class="power-grid">${body}</div>${masterOn?masterNewBoxBtn(cat,MASTER_CATS.find(c=>c.key===cat)?.label||label):''}</section>`;
  }).join('');
  const resources=(STATE.risorse||[]).map((r,i)=>{
    if(!masterOn&&(r.hidden||linked.has(i)))return '';
    return `<div class="tracker${r.hidden?' master-hidden-item':''}">${masterOn?masterToolbarHtml('risorse',i,{noWidth:true}):''}
      ${masterOn?`<input class="master-name-input" data-master-field="risorse|${i}|nome" value="${esc(r.nome)}">`:`<div class="t-name">${esc(r.nome)}</div>`}
      <div class="rich" ${masterOn?'contenteditable="true"':''} data-master-field="risorse|${i}|desc">${formatTravellerRich(r.desc||'')}</div>
      <div class="pips">${Array.from({length:r.max},(_,p)=>`<button type="button" class="pip ${p<r.used?'used':''}" data-respip="${i}-${p}" aria-label="${esc(r.nome)}: utilizzo ${p+1}" aria-pressed="${p<r.used}"></button>`).join('')}</div></div>`;
  }).join('');
  panel.innerHTML=`<nav class="power-index" aria-label="Sezioni poteri"><a href="#powers-slots">${TRAVELLER_MAGE?'Slot Incantesimo':'Slot'}</a>${categories.filter(([c])=>masterOn||visible(c)).map(([c,l])=>`<a href="#powers-${c}">${l}</a>`).join('')}${(resources||masterOn)?'<a href="#powers-resources">Risorse</a>':''}${(STATE.sourceSections||[]).some(s=>(s.location||'poteri')==='poteri'&&(masterOn||!s.hidden))?'<a href="#powers-extra">Regole e capacità</a>':''}</nav>
    <section class="card" id="powers-slots"><h2>${TRAVELLER_MAGE?'Slot Incantesimo':'Slot'}</h2>
    ${(STATE.slots||[]).map((s,i)=>`<div class="slot-lvl"><div class="lvl-badge">${TRAVELLER_MAGE?'Livello '+s.lvl:'Slot'}</div><div class="pips">${Array.from({length:s.max},(_,p)=>`<button type="button" class="pip ${p<s.used?'used':''} ${s.colorClass||''}" data-slotpip="${i}-${p}" aria-label="Slot ${s.lvl}, ${p+1}" aria-pressed="${p<s.used}"></button>`).join('')}</div><label>max <input class="maxslot" type="number" min="0" data-slotmax="${i}" value="${s.max}" ${masterOn?'':'readonly'}></label></div>`).join('')}
    <button class="btn primary" id="reset-slots">Riposo Lungo — recupera tutti gli slot</button></section>
    ${(resources||masterOn)?`<section class="card" id="powers-resources"><h2>Risorse</h2>${resources}${masterOn?masterNewBoxBtn('risorse','Risorsa'):''}</section>`:''}
    <div style="margin-bottom:20px"><button class="btn" id="reset-risorse">Riposo Lungo — recupera le risorse</button></div>
    ${cards}${sourceSectionsHtml('poteri')?`<section class="card" id="powers-extra">${sourceSectionsHtml('poteri')}</section>`:''}`;
  panel.querySelectorAll('[data-slotpip]').forEach(el=>el.addEventListener('click',()=>{const[i,p]=el.dataset.slotpip.split('-').map(Number),s=STATE.slots[i];s.used=p<s.used?p:p+1;renderPoteri();queueSave();}));
  panel.querySelectorAll('[data-respip]').forEach(el=>el.addEventListener('click',()=>{const[i,p]=el.dataset.respip.split('-').map(Number),r=STATE.risorse[i];r.used=p<r.used?p:p+1;renderPoteri();queueSave();}));
  panel.querySelectorAll('[data-slotmax]').forEach(el=>el.addEventListener('change',()=>{if(!isMasterEditorOn())return;const s=STATE.slots[+el.dataset.slotmax];s.max=Math.max(0,Math.min(100,parseInt(el.value)||0));s.used=Math.min(s.used,s.max);renderPoteri();queueSave();}));
  panel.querySelector('#reset-slots').addEventListener('click',()=>{STATE.slots.forEach(s=>s.used=0);renderPoteri();queueSave();});
  panel.querySelector('#reset-risorse').addEventListener('click',()=>{STATE.risorse.forEach(r=>r.used=0);renderPoteri();queueSave();});
  bindMasterControls(panel);
}

    const picker = makeImagePicker(
      STATE.equipImages[key],
      (dataUrl)=>{ STATE.equipImages[key] = dataUrl; renderEquipSlots(); queueSave(); },
      ()=>{ STATE.equipImages[key] = ""; renderEquipSlots(); queueSave(); },
      true,
      label,
      false

    box.appendChild(picker);

  grid.querySelectorAll('[data-equip]').forEach(inp=>{
    inp.readOnly = false;
    inp.addEventListener("input", ()=>{ STATE.equip[inp.dataset.equip] = inp.value; queueSave(); });

        <input type="checkbox" data-inv-check="${i}" ${it[0]==="\u2713"?"checked":""} title="Portato/equipaggiato">

        ${masterOn ? `<button class="inv-remove" data-inv-del="${i}" title="Rimuovi oggetto">\u2715</button>` : ''}
      </div>

        <label>Peso</label>
        <input type="number" data-inv-peso="${i}" value="${it[2]}">
      </div>
    </div>`).join("");

  STATE.inventario.forEach((it,i)=>{
    const cell = document.getElementById("inv-img-"+i);
    if (!cell) return;
    const picker = makeImagePicker(
      it[4] || "",
      (dataUrl)=>{ STATE.inventario[i][4] = dataUrl; renderInvTable(); queueSave(); },
      ()=>{ STATE.inventario[i][4] = ""; renderInvTable(); queueSave(); },
      true,
      it[1] || "Oggetto",
      false
    );
    // nell'elenco mostriamo solo la miniatura, senza le etichette testuali
    const lbl = picker.querySelector(".file-btn");
    if (lbl) lbl.remove();
    cell.appendChild(picker);
  });

  tbody.querySelectorAll('[data-inv-check]').forEach(c=>c.addEventListener("change",()=>{
    STATE.inventario[c.dataset.invCheck][0] = c.checked?"\u2713":"";
    refreshInvTotal(); queueSave();
  }));
  tbody.querySelectorAll('[data-inv-name]').forEach(c=>c.addEventListener("input",()=>{
    STATE.inventario[c.dataset.invName][1] = c.value; queueSave();
  }));
  tbody.querySelectorAll('[data-inv-peso]').forEach(c=>c.addEventListener("input",()=>{
    STATE.inventario[c.dataset.invPeso][2] = c.value; refreshInvTotal(); queueSave();
  }));
  tbody.querySelectorAll('[data-inv-desc]').forEach(c=>{
    autoGrowTextarea(c);
    c.addEventListener("input",()=>{
      STATE.inventario[c.dataset.invDesc][3] = c.value;
      autoGrowTextarea(c);
      queueSave();
    });
  });
  // Editor Master: se il Master ridimensiona manualmente una descrizione
  // sotto l'altezza necessaria a mostrare il testo per intero, la
  // riporta automaticamente almeno all'altezza del contenuto (niente
  // testo tagliato, niente scroll interno).
  if (window.ResizeObserver && !tbody.__invDescRO){
    tbody.__invDescRO = new ResizeObserver(entries=>{
      for (const entry of entries){
        const el = entry.target;
        if (el.scrollHeight > el.clientHeight + 1) autoGrowTextarea(el);
      }
    });
  }
  if (tbody.__invDescRO){
    tbody.querySelectorAll('[data-inv-desc]').forEach(c=> tbody.__invDescRO.observe(c));
  }
  tbody.querySelectorAll('[data-inv-del]').forEach(c=>c.addEventListener("click",()=>{
    STATE.inventario.splice(parseInt(c.dataset.invDel,10),1);
    renderInvTable(); refreshInvTotal(); queueSave();
  }));
  refreshInvTotal();
}

function refreshInvTotal(){
  const total = STATE.inventario.reduce((sum,it)=> sum + (it[0]==="\u2713" ? (parseFloat(it[2])||0) : 0), 0);
  const cap = STATE.capacitaMax || 1;
  const pct = Math.max(0, Math.min(100, total/cap*100));
  const fill = document.getElementById("inv-bar-fill");
  if (fill){
    fill.style.width = pct+"%";
    fill.style.background = pct<70 ? "var(--good)" : (pct<100 ? "var(--gold)" : "var(--bad)");
  }
  const totalEl = document.getElementById("inv-total");
  if (totalEl) totalEl.textContent = total + " / " + cap + " P";
}

/* Raggruppa voci di ambiti/campiAttiva che condividono un terzo elemento (chiave di gruppo)
   in un unico box "subcard", cos\u00ec da non frammentare blocchi concettuali unici della fonte
   originale (es. "Super Abilit\u00e0" di Katan, "Emocrachia"/"Purgatorio di Rasta" di Ervork).
   Le voci senza chiave di gruppo (2 elementi: [nome, descrizione]) si comportano come prima,
   una subcard indipendente ciascuna. Pensata per essere manipolabile dal futuro Master Editor:
   ogni sotto-voce mantiene il proprio id ancora (anchor-slug) per i link di navigazione rapida. */
function renderGroupedSubcards(arr, tagLabel, tagClass, fieldName){
  const masterOn = isMasterEditorOn();
  const groups = [];
  const byKey = {};
  (arr||[]).forEach((entry,idx)=>{
    const n = entry[0], d = entry[1], g = entry[2];
    if (g){
      if (!byKey[g]){ byKey[g] = { key:g, items:[] }; groups.push(byKey[g]); }
      byKey[g].items.push([n,d,idx]);
    } else {
      groups.push({ key:null, items:[[n,d,idx]] });
    }
  });
  const itemFields = (n,d,idx,headingTag)=>{
    if (!masterOn){
      return `<${headingTag}>${n}</${headingTag}><div style="color:var(--text-dim);font-size:13.5px;">${d}</div>`;
    }
    const nameField = `<input type="text" class="master-name-input" data-master-field="${fieldName}|${idx}|nome" value="${esc(n)}">`;
    const descField = `<div class="rich" contenteditable="true" style="color:var(--text-dim);font-size:13.5px;" data-master-field="${fieldName}|${idx}|desc">${d}</div>`;
    return nameField + descField;
  };
  return groups.map(grp=>{
    if (!grp.key){
      const [n,d,idx] = grp.items[0];
      const toolbar = masterOn ? masterToolbarHtml(fieldName, idx) : "";
      return `<div class="subcard" id="anchor-${slugify(n)}"${masterOn?masterBoxStyle(fieldName, idx):""}>
        ${toolbar}
        <span class="tag ${tagClass}">${tagLabel}</span>
        ${itemFields(n,d,idx,"h3")}
      </div>`;
    }
    const body = grp.items.map(([n,d,idx])=>{
      const toolbar = masterOn ? masterToolbarHtml(fieldName, idx, {noWidth:true}) : "";
      return `<div class="subcard-subsection" id="anchor-${slugify(n)}">
        ${toolbar}
        ${itemFields(n,d,idx,"h4")}
      </div>`;
    }).join("");
    return `<div class="subcard subcard-grouped"><span class="tag ${tagClass}">${tagLabel}</span><h3>${grp.key}</h3>${body}</div>`;
  }).join("");
}

/* Editor Master: ridimensionamento verticale persistente dei riquadri di
   Info & Carattere (STATE.lore[i].h), sullo stesso principio gi\u00e0 usato
   per i Ritratti: il resize nativo CSS (angolo in basso a destra) resta
   disponibile solo in modalit\u00e0 Master; al rilascio del trascinamento
   l'altezza raggiunta viene salvata in STATE.lore[i].h e resta quindi
   persistente tra render/reload/export/import (non un semplice resize CSS
   volatile). Se h \u00e8 assente il riquadro mantiene l'aspetto originale.
   Il giocatore non vede mai la maniglia di resize. */
function initLoreResize(){
  document.querySelectorAll('.subcard[data-lore-box]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      if (!isMasterEditorOn()) return;
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const idx = el.dataset.loreBox;
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = growBoxToFitContent(el);
        if (h && STATE.lore[idx] && h !== STATE.lore[idx].h){
          STATE.lore[idx].h = h;
          queueSave();
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
}

/* Editor Master: ridimensionamento verticale persistente dei ritratti.
   Il resize nativo CSS (angolo in basso a destra del riquadro) resta
   disponibile solo in modalit\u00e0 Master; al rilascio del trascinamento
   l'altezza raggiunta viene salvata in STATE.portraits[i].h e resta quindi
   persistente tra render/reload/export/import (non un semplice resize CSS
   volatile). L'immagine usa object-fit per non deformarsi mai quando il
   riquadro ha un'altezza personalizzata. Solo il Master pu\u00f2 ridimensionare
   il riquadro; il giocatore pu\u00f2 sempre cambiare immagine e didascalia. */
function initPortraitResize(){
  document.querySelectorAll('.portrait[data-portrait-idx]').forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      if (!isMasterEditorOn()) return;
      const rect = el.getBoundingClientRect();
      const nearRight = (rect.right - e.clientX) < 20;
      const nearBottom = (rect.bottom - e.clientY) < 20;
      if (!(nearRight && nearBottom)) return;
      const idx = el.dataset.portraitIdx;
      const onUp = ()=>{
        document.removeEventListener("pointerup", onUp);
        const h = Math.round(el.getBoundingClientRect().height);
        if (h && STATE.portraits[idx] && h !== STATE.portraits[idx].h){
          STATE.portraits[idx].h = h;
          el.classList.add("has-h");
          queueSave();
        }
      };
      document.addEventListener("pointerup", onUp);
    });
  });
}

/* Migrazione hidden di Evoluzioni Future: se una voce ha gi\u00e0 un valore
   booleano per "hidden" (salvataggio esistente, o gi\u00e0 impostato dal
   Master con l'occhio), viene rispettato cos\u00ec com'\u00e8. Se invece
   "hidden" \u00e8 assente (voce mai migrata), viene inizializzato secondo
   la regola: livelli fino al 10 compreso (e l'eventuale livello 11 gi\u00e0
   presente nella fonte) visibili di default, livelli dal 12 in poi
   nascosti di default. Non crea n\u00e9 elimina mai livelli. */
function evoLevelNumber(lv){
  const m = String((lv && lv.livello) || "").match(/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}
function migrateEvoHiddenDefaults(list){
  (list || []).forEach(lv=>{
    if (typeof lv.hidden !== "boolean"){
      const n = evoLevelNumber(lv);
      lv.hidden = (n !== null && n >= 12);
    }
  });
}
function renderEvoluzioni(){
  const list = STATE.evoluzioniFuturi || [];
  migrateEvoHiddenDefaults(list);
  const masterOn = isMasterEditorOn();
  const visibleList = masterOn ? list : list.filter(lv=>!lv.hidden);
  const items = list.map((lv,i)=>{
    if (!masterOn && lv.hidden) return "";
    const eyeCtl = masterOn
      ? `<button type="button" class="master-mini-btn master-eye-btn${lv.hidden?' is-hidden':''}" data-master-evo-eye="${i}" title="${lv.hidden?'Nascosto al giocatore \u2014 clic per mostrare':'Visibile al giocatore \u2014 clic per nascondere'}">${lv.hidden?'\ud83d\ude48':'\ud83d\udc41\ufe0f'}</button>`
      : "";
    return `
    <details class="evo-level${masterOn && lv.hidden ? ' master-hidden-item' : ''}">
      <summary>${eyeCtl}${esc(lv.livello)}</summary>
      <div class="evo-content rich" ${masterOn ? 'contenteditable="true"' : ''} data-rich-evo="${i}">${lv.html}</div>
    </details>`;
  }).join("");

  document.getElementById("panel-evoluzioni").innerHTML = (visibleList.length || masterOn) ? `
    <div class="card">
      <h2>Evoluzioni Future & Poteri Futuri <small>testo originale non ancora sbloccato in gioco</small></h2>
      <p class="evo-note">Contenuto trascritto verbatim dalla scheda originale: poteri, trasformazioni e privilegi dei livelli successivi a quello attuale del personaggio, non ancora disponibili in gioco. Clic su una voce per espanderla.</p>
      <div class="evo-list">${items || '<p class="muted">Nessun contenuto di livello futuro trovato nel documento originale di questo personaggio.</p>'}</div>
    </div>
  ` : '';

  document.querySelectorAll('[data-rich-evo]').forEach(el=>{
    el.addEventListener("input", ()=>{ STATE.evoluzioniFuturi[el.dataset.richEvo].html = el.innerHTML; queueSave(); });
  });
  document.querySelectorAll('[data-master-evo-eye]').forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(btn.dataset.masterEvoEye);
      STATE.evoluzioniFuturi[idx].hidden = !STATE.evoluzioniFuturi[idx].hidden;
      renderEvoluzioni();
      queueSave();
    });
  });
}

/* ============================================================
   HERO — sfondo trascinabile
   ============================================================ */
const HERO_ZOOM_MIN = 1, HERO_ZOOM_MAX = 2.5, HERO_ZOOM_STEP = 0.1;
function clampHeroZoom(z){ return Math.max(HERO_ZOOM_MIN, Math.min(HERO_ZOOM_MAX, z)); }
function setHeroZoom(z){
  STATE.heroBgZoom = clampHeroZoom(z);
  applyHeroBg();
  queueSave();
}
function initHeroZoom(){
  const zoomOut = document.getElementById("hero-zoom-out");
  const zoomIn = document.getElementById("hero-zoom-in");
  const hero = document.getElementById("hero");
  if (zoomOut) zoomOut.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); setHeroZoom((STATE.heroBgZoom||1) - HERO_ZOOM_STEP); });
  if (zoomIn) zoomIn.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); setHeroZoom((STATE.heroBgZoom||1) + HERO_ZOOM_STEP); });
  if (hero) hero.addEventListener("wheel", (e)=>{
    e.preventDefault();
    setHeroZoom((STATE.heroBgZoom||1) + (e.deltaY < 0 ? HERO_ZOOM_STEP : -HERO_ZOOM_STEP));
  }, { passive:false });
}
function applyHeroBg(){  const hero = document.getElementById("hero");
  const heroBg = document.getElementById("hero-bg");
  if (!hero || !heroBg) return;
  heroBg.style.backgroundPosition = STATE.heroBgPos.x + "% " + STATE.heroBgPos.y + "%";
  if (STATE.heroBgImage){
    heroBg.style.backgroundImage = "linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.75)), url('" + STATE.heroBgImage + "')";
  } else {
    heroBg.style.backgroundImage = "";
  }
  const heroZoom = STATE.heroBgZoom || 1;
  heroBg.style.transform = "scale(" + heroZoom + ")";
  const zoomLabel = document.getElementById("hero-zoom-label");
  if (zoomLabel) zoomLabel.textContent = Math.round(heroZoom * 100) + "%";
}

/* Blocco 1: colore identitario editabile dal Master, con anteprima live.
   applyIdentityColor() lo applica per chiunque (giocatore incluso: e' il
   colore scelto per il personaggio, non un dettaglio riservato al Master).
   Il controllo per cambiarlo resta visibile solo con l'Editor Master attivo. */
function applyIdentityColor(){
  const c1 = STATE.identityColor || "#c9a34e";
  const c2 = STATE.identityColor2 || c1;
  document.documentElement.style.setProperty("--identity", c1);
  document.documentElement.style.setProperty("--identity2", c2);
}
function initColorPicker(){
  const input = document.getElementById("master-color-input");
  const input2 = document.getElementById("master-color-input-2");
  const clearBtn = document.getElementById("master-color-2-clear");
  if (!input) return;
  input.addEventListener("input", ()=>{
    document.documentElement.style.setProperty("--identity", input.value);
  });
  input.addEventListener("change", ()=>{
    STATE.identityColor = input.value;
    queueSave();
  });
  if (input2){
    input2.addEventListener("input", ()=>{
      document.documentElement.style.setProperty("--identity2", input2.value);
    });
    input2.addEventListener("change", ()=>{
      STATE.identityColor2 = input2.value;
      queueSave();
    });
  }
  if (clearBtn){
    clearBtn.addEventListener("click", ()=>{
      STATE.identityColor2 = null;
      queueSave();
      applyIdentityColor();
      refreshColorPicker();
    });
  }
}
function refreshColorPicker(){
  const wrap = document.getElementById("master-color-picker");
  const input = document.getElementById("master-color-input");
  const input2 = document.getElementById("master-color-input-2");
  if (!wrap || !input) return;
  const show = isMasterUnlocked() && isMasterEditorOn();
  wrap.classList.toggle("show", show);
  input.value = STATE.identityColor || "#c9a34e";
  if (input2) input2.value = STATE.identityColor2 || input.value;
}

function initHeroImageUpload(){
  const btn = document.getElementById("btn-hero-image");
  const input = document.getElementById("hero-image-input");
  if (!btn || !input) return;
  btn.addEventListener("click", ()=> input.click());
  input.addEventListener("change", ()=>{
    const f = input.files && input.files[0];
    if (f) fileToCompressedDataURL(f, 1400, 0.8, (dataUrl)=>{
      STATE.heroBgImage = dataUrl;
      applyHeroBg();
      queueSave();
    });
    input.value = "";
  });
}

function clamp01to100(v){ return Math.max(0, Math.min(100, v)); }

function initHeroDrag(){
  const hero = document.getElementById("hero");
  if (!hero) return;
  let dragging = false, startX = 0, startY = 0, startPos = {x:50,y:20};

  hero.addEventListener("pointerdown", (e)=>{
    if (e.target.closest("input, .hero-chip, .hero-hint")) return;
    dragging = true;
    hero.classList.add("dragging");
    startX = e.clientX; startY = e.clientY;
    startPos = { x: STATE.heroBgPos.x, y: STATE.heroBgPos.y };
    hero.setPointerCapture(e.pointerId);
  });
  hero.addEventListener("pointermove", (e)=>{
    if (!dragging) return;
    const rect = hero.getBoundingClientRect();
    const dx = e.clientX - startX, dy = e.clientY - startY;
    const newX = clamp01to100(startPos.x - (dx / rect.width) * 100);
    const newY = clamp01to100(startPos.y - (dy / rect.height) * 100);
    STATE.heroBgPos = { x:newX, y:newY };
    applyHeroBg();
  });
  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    hero.classList.remove("dragging");
    try{ hero.releasePointerCapture(e.pointerId); }catch(err){}
    queueSave();
  }
  hero.addEventListener("pointerup", endDrag);
  hero.addEventListener("pointercancel", endDrag);
  hero.addEventListener("pointerleave", (e)=>{ if(dragging) endDrag(e); });
}

// The owner confirmed the repeated Tavola G. source row was a copy error.
// Remove only that import record, preserving any uses already marked on it.
function correctMaryTavolaDuplicate(){
  const resources=STATE.risorse||[];
  const duplicate=resources.find(r=>r.sourceId==='mary-uses-1');
  const keep=resources.find(r=>r.sourceId==='mary-uses-0');
  if(duplicate){
    if(keep){
      keep.used=Math.min(keep.max,Math.max(keep.used||0,duplicate.used||0));
      resources.splice(resources.indexOf(duplicate),1);
    }else duplicate.sourceId='mary-uses-0';
  }
  const row='<p>2 x TAVOLA G. (Max 2 x SCONTRO)</p>';
  if(typeof STATE.attacchi==='string')STATE.attacchi=STATE.attacchi.replace(row+row,row);
}

function migrateInventorySourceFromOriginal(){
  if (!STATE || !Array.isArray(STATE.inventario)) return;
  for (const patch of INVENTORY_SOURCE_PATCHES){
    const old = patch.old, next = patch.next;
    const idx = STATE.inventario.findIndex(it => Array.isArray(it)
      && String(it[1] ?? "") === String(old[1] ?? "")
      && String(it[2] ?? "") === String(old[2] ?? "")
      && String(it[3] ?? "") === String(old[3] ?? ""));
    if (idx < 0) continue;
    if (!next){ STATE.inventario.splice(idx,1); continue; }
    const cur = STATE.inventario[idx];
    STATE.inventario[idx] = [cur[0], next[1], next[2], next[3], cur[4] || next[4] || ""];
  }
}

/* Riduce automaticamente la dimensione del font del nome personaggio se troppo lungo per stare
   su una riga, cos\u00ec da non farlo tagliare/scomparire su nomi lunghi (es. nome completo esteso). */
function fitNameToWidth(el){
  if (!el) return;
  const maxPx = 64, minPx = 18;
  el.style.letterSpacing = "2px";
  el.style.fontSize = maxPx + "px";
  let size = maxPx;
  let guard = 0;
  while (el.scrollWidth > el.clientWidth && size > minPx && guard < 60){
    size -= 1;
    el.style.fontSize = size + "px";
    guard++;
  }
  // Se anche alla dimensione minima il testo non entra, riduce progressivamente la spaziatura
  // tra le lettere prima di lasciare che l'ultimo carattere venga tagliato.
  let spacing = 2;
  guard = 0;
  while (el.scrollWidth > el.clientWidth && spacing > -0.5 && guard < 30){
    spacing -= 0.1;
    el.style.letterSpacing = spacing.toFixed(1) + "px";
    guard++;
  }
}

function initGoogleButton(){
  const btn = document.getElementById("btn-google");
  const loadBtn = document.getElementById("btn-google-load");
  const statusEl = document.getElementById("google-status");
  if (!btn) return;
  if (!googleConfigured()){
    btn.title = "Non ancora configurato su questa pagina";
    btn.style.opacity = "0.55";
    if (loadBtn){ loadBtn.style.opacity = "0.55"; loadBtn.title = "Non ancora configurato su questa pagina"; }
    return;
  }
  initGoogleAuth();

  // Se l'accesso con Google è già stato eseguito in questa stessa scheda del
  // browser (es. dalla Home, o da un'altra scheda personaggio), recupera subito
  // il token invece di richiedere di nuovo l'accesso.
  if (!googleAccessToken){
    const restored = loadGoogleTokenFromSession();
    if (restored){
      googleAccessToken = restored;
      onGoogleSignedIn();
    }
  }

  // Se questo browser ha già usato Google Drive per questo personaggio almeno
  // una volta (in qualunque sessione precedente), prova un accesso automatico e
  // silenzioso (senza popup) prima di mostrare il solo pulsante manuale: se la
  // sessione Google è ancora attiva nel browser, l'accesso si ripristina da solo.
  if (!googleAccessToken){
    try{
      if (localStorage.getItem(GOOGLE_EVER_CONNECTED_KEY) === "1"){
        tryGoogleSilentReauth();
      }
    }catch(e){}
  }

  // Il collegamento a Google non resta attivo da una apertura di pagina all'altra
  // (per sicurezza, va rifatto ogni volta, salvo il recupero automatico sopra). Se
  // questo browser ha già un salvataggio Drive per questo personaggio, lo segnaliamo
  // qui: altrimenti sembra che le modifiche siano andate perse, quando in realtà
  // vanno solo recuperate premendo di nuovo "Accedi con Google".
  if (!googleAccessToken && statusEl){
    try{
      if (localStorage.getItem(driveStorageKey())){
        statusEl.textContent = "\u2601\ufe0f Salvataggio Drive trovato per questo personaggio \u2014 premi \u201cAccedi con Google\u201d per recuperarlo";
        statusEl.style.color = "var(--gold-bright)";
      }
    }catch(e){}
  }

  btn.addEventListener("click", ()=> signInGoogle(googleAccessToken ? "" : "consent"));
  if (loadBtn) loadBtn.addEventListener("click", ()=>{
    if (!googleAccessToken){ window.alert("Accedi prima con Google."); return; }
    driveLoad();
  });

  const pickerBtn = document.getElementById("btn-google-picker");
  if (pickerBtn){
    if (!GOOGLE_PICKER_API_KEY){
      pickerBtn.style.opacity = "0.55";
      pickerBtn.title = "Non ancora configurato su questa pagina (manca la Chiave API della Picker API)";
    }
    pickerBtn.addEventListener("click", ()=>{
      if (!googleAccessToken){ window.alert("Accedi prima con Google."); return; }
      if (!GOOGLE_PICKER_API_KEY){ window.alert("La selezione di file condivisi non è ancora configurata su questa pagina."); return; }
      openDrivePicker();
    });
  }

  // Suggerimento per il Master: quale file cercare su Drive per condividerlo
  // con il giocatore (il file va condiviso dall'interfaccia di Google Drive
  // stessa: qui mostriamo solo il nome da cercare).
  const shareHintEl = document.getElementById("google-share-hint");
  if (shareHintEl && typeof isMasterUnlocked === "function" && isMasterUnlocked()){
    shareHintEl.textContent = "Master: per condividere, cerca su Drive “" + suggestedFileName() + "” e condividilo con il giocatore.";
  }
}

function openDrivePicker(){
  function showPicker(){
    const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
      .setMimeTypes("application/json")
      .setIncludeFolders(false);
    const picker = new google.picker.PickerBuilder()
      .setOAuthToken(googleAccessToken)
      .setDeveloperKey(GOOGLE_PICKER_API_KEY)
      // Necessario per selezionare correttamente file "Condivisi con me" (non
      // creati da questa app) sotto lo scope drive.file: senza l'App ID, Drive
      // può negare l'accesso al file scelto anche se il selettore lo mostra
      // (l'errore tipico è "File not found" nonostante il file esista davvero).
      // Il Project Number è il segmento numerico prima del primo "-" nel Client ID.
      .setAppId(GOOGLE_CLIENT_ID.split("-")[0])
      .addView(view)
      .setCallback(onDrivePicked)
      .build();
    picker.setVisible(true);
  }
  if (window.gapi && window.gapi.picker){ showPicker(); return; }
  if (!window.gapi){ window.alert("La libreria di Google non è ancora pronta, riprova tra un istante."); return; }
  gapi.load("picker", { callback: showPicker });
}

async function onDrivePicked(data){
  if (!data || data.action !== google.picker.Action.PICKED) return;
  const doc = data.docs && data.docs[0];
  if (!doc || !doc.id) return;

  // Non colleghiamo subito la scheda al file scelto: prima verifichiamo che
  // si riesca davvero a leggerlo con questo account (es. non più condiviso,
  // spostato nel cestino, o scelto con l'account sbagliato). Se il caricamento
  // fallisce, torniamo al collegamento precedente invece di restare bloccati
  // su un id che farebbe fallire anche tutti i salvataggi automatici successivi.
  const previousFileId = driveFileId;
  driveFileId = doc.id;
  driveFileIdKey = driveStorageKey();
  setStatus("File collegato: " + (doc.name || "senza nome") + " — caricamento…");

  const ok = await driveLoad();
  if (ok){
    try{ localStorage.setItem(driveFileIdKey, driveFileId); }catch(e){}
    updateGoogleStatus();
  } else {
    driveFileId = previousFileId;
    setStatus("Collegamento al file condiviso non riuscito — controlla che sia stato condiviso con questo account Google, poi riprova.");
  }
}

/* ============================================================
   BACKUP — esporta / importa
   ============================================================ */
function initSavebarToggle(){
  const bar = document.getElementById("savebar");
  const btn = document.getElementById("savebar-toggle");
  if (!bar || !btn) return;
  function updateLabel(){
    const collapsed = bar.classList.contains("collapsed");
    btn.textContent = collapsed ? "⚙ Opzioni scheda" : "✕ Chiudi opzioni";
    btn.title = collapsed ? "Mostra il pannello Opzioni scheda" : "Nascondi il pannello Opzioni scheda";
  }
  updateLabel();
  btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    bar.classList.toggle("collapsed");
    updateLabel();
  });
}

function initBackupButtons(){
  const exportBtn = document.getElementById("btn-export");
  const importBtn = document.getElementById("btn-import");
  const importInput = document.getElementById("import-input");
  if (!exportBtn || !importBtn || !importInput) return;

  exportBtn.addEventListener("click", ()=>{
    const json = JSON.stringify(STATE, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (STATE.nome || "personaggio").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "personaggio";
    const today = new Date();
    const stamp = today.getFullYear() + String(today.getMonth()+1).padStart(2,"0") + String(today.getDate()).padStart(2,"0");
    a.href = url;
    a.download = `scheda-${safeName}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    setStatus("Backup scaricato");
  });

  importBtn.addEventListener("click", ()=> importInput.click());
  importInput.addEventListener("change", ()=>{
    const f = importInput.files && importInput.files[0];
    importInput.value = "";
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ window.alert("Il file scelto non \u00e8 un backup valido."); return; }
      const ok = window.confirm("Ripristinare la scheda da questo file di backup?\nLa scheda attuale verr\u00e0 sostituita.");
      if (!ok) return;
      STATE = deepMerge(BLANK_STATE, parsed);
      renderAll();
      queueSave();
      setStatus("Backup importato");
    };
    reader.onerror = ()=> window.alert("Non sono riuscito a leggere il file.");
    reader.readAsText(f);
  });
}

function esc(s){
  return String(s===undefined||s===null?"":s)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
