n parti coerenti tra loro, dettagli, incastri e funzionalità fisica. Proprio per questo la CREAZIONE richiede uno sforzo enorme: è un uso raro, pesante e difficile da sostenere, e viene considerato praticabile solo con il massimo investimento di potere runico (lvl 5), perché anche ricreare un oggetto piccolo può prosciugare energie se deve essere preciso. Più la ricostruzione deve essere dettagliata, più diventa ardua, durata o rischio di imperfezioni sono frequenti se il PG spinge oltre ciò che può controllare. La CREAZIONE funziona in tre modi, in ordine di affidabilità: se il PG possiede un “aggancio reale” (un frammento autentico, una parte fondamentale, o materiale compatibile sufficiente), la runa può completare e ricostruire in modo fedele e stabile; se il PG non ha un frammento ma può studiare l’oggetto con attenzione (osservarlo a lungo, misurarlo, copiarne la struttura, usare uno stampo o un riferimento chiaro), può ricrearne una copia fisica credibile anche senza pezzi originali, ma con maggiore difficoltà e con più probabilità di difetti o instabilità; se invece il PG crea “da zero” senza agganci né riferimenti solidi, ciò che nasce può essere utile e funzionante, ma resta un oggetto comune, perché può imitare FORMA e utilità pratica, non l’unicità o le capacità speciali dell’originale. In ogni caso, la CREAZIONE non inventa poteri: se un oggetto aveva qualità uniche, quelle non possono comparire dal nulla; possono al massimo riemergere solo quando la ricostruzione avviene attorno a un nucleo autentico che già le conteneva, e solo se la ricomposizione è coerente e completa.</p>","width":3,"hidden":false},{"nome":"RUNA DELLO SPIRITO 👁️‍🗨️","desc":"<p>Quando il PG incide la Runa dello Spirito, traccia un segno che parla direttamente alla parte invisibile delle cose: pensieri, volontà, presenza, intenzione, coscienza. Il segno runico crea una risonanza sottile che può avvicinare due menti, far emergere ciò che è nascosto dentro un impulso, guidare una scelta, proteggere la propria essenza, oppure afferrare per un istante il filo che lega un corpo alla sua guida interiore. In base allo slot utilizzato, questa risonanza diventa più ampia, più stabile, più profonda e più difficile da spezzare, rendendo possibili effetti più intensi o più complessi. La Runa dello Spirito racchiude sei macro categorie distinte: ognuna governa un modo diverso di interagire con mente, presenza e forza interiore, e possono essere usate singolarmente o intrecciate tra loro, purché l’effetto dichiarato resti coerente con la natura di ciascuna componente.</p><p>1. SUSSURRO DELLA MENTE</p><p>Questa macrocategoria governa l’influenza sottile e la lettura dei moti interiori. Permette al PG di cogliere ciò che si muove dietro una parola o un’esitazione: tracce di emozione, intenzione, tensione, paura, rabbia, dubbio, desiderio. Il PG può rendere la mente del bersaglio più permeabile a una direzione semplice, spingendola verso un’idea immediata o un istinto preciso, senza trasformare la persona in un burattino. Può appesantire i pensieri e rendere più difficile mantenere lucidità e concentrazione, può confondere per un istante priorità e reazioni, oppure può fare l’opposto: portare calma e chiarezza, spegnendo panico e disordine emotivo. Questa componente lavora sul “prima”: prima che un gesto avvenga, prima che una scelta si chiuda, prima che una reazione esploda, guidando la mente come una voce che non si sente con le orecchie ma che la coscienza percepisce lo stesso. Funzione tecnica: lettura di emozioni e intenzioni, pressione mentale, orientamento di scelte semplici, disturbo o stabilizzazione di concentrazione e lucidità.</p><p>2. FILAMENTO SPIRITUALE</p><p>Questa macrocategoria governa i legami invisibili tra presenze. Permette al PG di creare o rinforzare un collegamento fatto di risonanza. Il PG può imprimere un marchio etereo che rende un bersaglio riconoscibile alla percezione runica; può percepirne la direzione o la distanza in modo istintivo; può trasmettere messaggi senza suono, come un pensiero che attraversa un filo; può condividere sensazioni semplici o impulsi chiari per coordinarsi e non perdersi. Se il legame esiste, la runa può farlo prevalere contro separazioni e confusione, rendendo più difficile spezzare il contatto o cancellare la traccia. Funzione tecnica: marcatura eterea, percezione di direzione/distanza, comunicazione mentale, condivisione limitata di impulsi e sensazioni, mantenimento di legami spirituali.</p><p>3. VELO DELL’ESSENZA</p><p>Questa macrocategoria governa la protezione della presenza interiore e la gestione della propria impronta spirituale. Permette al PG di rendere una mente più difficile da leggere e una presenza più difficile da agganciare. Può mascherare o attenuare l’aura, può rendere la mente opaca come avvolta da nebbia, può spezzare o indebolire legami ostili che cercano di ancorarsi alla coscienza, può sigillare temporaneamente un pensiero o un ricordo per impedirne l’estrazione, può creare silenzio interiore rendendo emozioni e impulsi più difficili da manipolare. È difesa invisibile, stabilità psichica e discrezione spirituale. Funzione tecnica: occultamento di aura/presenza, resistenza a lettura e influenza mentale, attenuazione di legami spirituali ostili, sigillo temporaneo di pensieri e ricordi, stabilizzazione della volontà.</p><p>4. DOMINIO DEL VASO</p><p>Questa macrocategoria governa l’interazione più diretta tra volontà e corpo, cioè il punto in cui una mente guida un gesto. Permette al PG di interferire con la traduzione tra intenzione e movimento: introdurre esitazione, deviare un gesto, spezzare un’azione sul nascere, imporre un freno o un impulso minimo. Nei casi più profondi, la runa può tentare di prendere il comando per un istante, costringendo il corpo a obbedire a una direzione semplice o a un comando breve. Questa componente richiede sempre un aggancio reale e uno scontro di volontà: se la presa non entra, non c’è dominio; se entra, il dominio è sempre contestabile e non è mai gratuito, perché più l’interferenza è profonda più è facile che lasci fatica mentale o contraccolpo a chi la sta imponendo. Funzione tecnica: interferenza motoria, imposizione di freni o impulsi, deviazione di gesti e azioni, comando breve o controllo parziale quando la presa spirituale riesce e la volontà avversaria viene superata.</p><p>5. OCCHIO INTERIORE</p><p>Questa macrocategoria governa la percezione passiva aumentata, cioè la capacità di “sentire” un’area anche quando non si sta guardando con gli occhi. Il PG, tramite la runa, espande la propria attenzione come una presenza che si stende sul campo: percepisce movimenti sottili, variazioni di intenzione, vuoti innaturali, presenze che cercano di non farsi notare, punti di tensione nello spazio, anomalie che stonano con il resto. Non è una vista perfetta e non è onniscienza: è una lettura a 360 gradi fatta di segnali spirituali, come se il mondo lasciasse impronte invisibili. Questa componente permette di individuare presenze nascoste o sfalsate, accorgersi di trappole o pericoli “in agguato” quando la loro natura lascia un’ombra percettiva, riconoscere un avversario invisibile perché la sua volontà e la sua presenza comunque “spingono” sul luogo, o cogliere il punto in cui un nemico è più fragile perché la sua essenza non è uniforme. Può anche essere usata per guidare gli alleati: il PG percepisce e comunica, segnala, coordina, rendendo il gruppo più reattivo e meno vulnerabile agli imboscamenti. Funzione tecnica: percezione a 360 gradi di presenze, anomalie, minacce nascoste e punti di vulnerabilità tramite lettura spirituale dell’area, con possibilità di trasmettere indicazioni agli alleati.</p><p>6. MANO DELL’ANIMA</p><p>Questa macrocategoria governa l’espressione dello spirito come forza capace di interagire con il mondo fisico e con le presenze non materiali. Il PG condensa la propria risonanza in una “presa” invisibile: non è un semplice spostare oggetti come farebbe una forza meccanica, ma un tocco spirituale che può trattenere, spingere, richiamare, deviare, sostenere, oppure afferrare qualcosa che normalmente è intangibile. Questa componente può manifestarsi come telecinesi spirituale, ma anche come intervento su energie e presenze: respingere un’entità, trattenere un’ombra, disturbare una forma eterea, proteggere un alleato con una pressione invisibile, deviare un impatto quel tanto che basta a salvarlo, o creare una presa breve per immobilizzare o disarmare senza toccare fisicamente. Nei casi più alti, la runa può anche permettere una chiamata spirituale: non “crea” un essere dal nulla, ma richiama una presenza o un frammento di spirito compatibile con il segno, che può manifestarsi come supporto etereo, vincolo, guardia, disturbo o interposizione per un tempo limitato. È la parte più “grande” della runa, perché lo spirito diventa mano, pressione, presenza attiva. Funzione tecnica: interazione spirituale con materia ed entità (spinta, trazione, trattenimento, deviazione, sostegno), possibilità di afferrare o disturbare presenze non materiali, e richiamo temporaneo di una presenza spirituale coerente con il segno.</p>","width":3,"hidden":false}],"incantesimo":[],"divergenzaIntro":"","ambiti":[],"campiAttiva":[],"divergenzaAttivaNote":"","divergenzaPassiva":"","trucchetti":[],"descrizione":{"eta":"100","altezza":"1,65","peso":"60kg","occhi":"ROSA","capelli":"VIOLA","colorePersonaggio":"CHIARA"},"backstory":"<p>Mary nasce a Heisalor, la città principale di Brodental degli Elfi. Poco dopo la sua nascita, i suoi genitori si trasferiscono nella comunità druidica sotto le radici dell’albero sacro Irminsul, l’Albero della Vita, scegliendo una vita scandita dal rispetto della natura e dei suoi equilibri. Mary cresce lì, ma non si integra davvero: viene emarginata dai giovani druidi perché, invece di limitarsi ai riti, sviluppa una passione sempre più forte per la lettura e per la storia druidica più antica. Proprio per questo si avvicina a Elarion Thalwyr, un vecchio druido erudito ormai ritirato, che le insegna le rune antiche, un sapere che molti hanno smesso di studiare. Per Mary diventa una ricerca totale: più studia, più comprende che l’antichità elfica era più profonda di quanto la sua comunità volesse ammettere, e che dietro l’armonia del presente esisteva una potenza ordinata fatta di lingua incisa, leggi e volontà. Mary diventa così un’esperta delle rune, ma paga quel percorso con l’isolamento: i rapporti si consumano, gli amici non arrivano e la sua vita si stringe attorno a studio e disciplina, mentre i genitori non la ostacolano quando capiscono che il suo cammino non può restare confinato sotto Irminsul. Il vero inizio del viaggio arriva quando, attraverso le rune, Mary sviluppa una connessione con la natura così profonda da diventare un messaggio chiaro: la natura stessa le rivela di essere in pericolo e le indica un luogo preciso e una figura da trovare. Per questo Mary lascia Brodental e parte verso Gloxinia, le terre fredde, seguendo un richiamo che non è curiosità ma necessità, con un nome che le resta come direzione inevitabile: Ervork, parte di un gruppo che, secondo ciò che la natura le ha rivelato, può aiutarla a salvarla.</p>","lore":[],"portraits":[{"img":"assets/characters/mary-1.webp","cap":"MARY","h":null},{"img":"assets/characters/mary-2.webp","cap":"MARY · Ritratto 2","h":null}],"noteGenerali":"","diarioEntries":[],"evoluzioniFuturi":[],"fonteOriginale":"SCHEDA PG\r\n\r\n\r\nSCHEDA PG\r\n\tNOME PERSONAGGIO \r\n\r\n\r\n\r\n\r\n\r\n\r\nMary Sunset\r\n\tCLASSE E LIVELLO\r\n\r\n\r\nMAGO  8\r\n\tBACKGROUND\r\n\r\n\r\nARTISTA VIAGGIATRICE\r\n\r\n\r\n\tNOME GIOCATORE\r\n\r\n\r\nAnna\r\n\r\n\r\n\tRAZZA\r\n\r\n\r\nELFO\r\n\r\n\r\n\tALLINEAMENTO\r\n\r\n\r\nX\r\n\r\n\r\n\tPG PRINCIPALE DI RIFERIMENTO\r\n\r\n\r\nERVORK\r\n\t\r\n\r\n\r\n\r\nFORZA\r\n\r\n\r\n12\r\n\r\n\r\n(+1)\r\n\t\r\n\r\n(X)  ISPIRAZIONE\r\n(DI FATTI NON LA UTILIZZIAMO SCRIVETECI QUELLO CHE VOLETE)\r\n\tCA\r\n\r\n\r\n16\r\n\tINIZIATIVA\r\n\r\n\r\n5\r\n\t    VELOCITÀ\r\n\r\n\r\n7\r\n\tSLOT \r\n\t1\r\n\t2\r\n\t3\r\n\t4\r\n\t5\r\n\t6\r\n\t* * * * * * \r\n\r\n\t* a\r\n* a\r\n* a\r\n* a\r\n* a\r\n\t* a\r\n* l\r\n* l\r\n* \t* a\r\n* a\r\n* a\r\n\r\n\r\n\t* a\r\n* \t* \t\r\n\r\n(+3)  BONUS COMPETENZA\r\n\tDESTREZZA\r\n\r\n\r\n16\r\n\r\n\r\n(+3)\r\n\t   PUNTI FERITA         ATTUALI\r\n\r\n\r\n[ 68 ]       68\r\n\tPUNTI FERITA TEMPORANEI\r\n\r\n\r\n0\r\n\tCOSTITUZIONE\r\n\r\n\r\n13\r\n\r\n\r\n(+1)\r\n\tTIRI SALVEZZA\r\n\r\n\r\n[X] INTELLIGENZA \r\n[X] SAGGEZZA \r\n\tDADO VITA\r\n\r\n\r\n1D8\r\n\tTS CONTRO MORTE\r\n\r\n\r\n* SUCCESSI    (3)\r\n* FALLIMENTI  (3)\r\n\tINTELLIGENZA\r\n\r\n\r\n18\r\n\r\n\r\n(+4)\r\n\tABILITA’\r\n\r\n\r\n[ 5 ]  ACROBAZIA (DES)\r\n[ 5 ]  ADD.ANIMALI (SAG)\r\n[ 0 ]  ARCANO (INT)\r\n[ 5 ] ATLETICA (FOR)\r\n[ 0 ]  FURTIVITA’ (DES)\r\n[ 5 ]  INDAGARE (INT)\r\n[ 0 ]  INGANNO (CAR)\r\n[ 0 ]  INTIMIDIRE (CAR)\r\n[ 0 ]  INTRATTENERE (CAR)\r\n[ 0 ]  INTUIZIONE (SAG)\r\n[ 0 ]  MEDICINA (SAG)\r\n[ 5 ]  NATURA (INT)\r\n[ 0 ]  PERCEZIONE (SAG)\r\n[ 0 ]  PERSUASIONE (CAR)\r\n[ 5 ]  RAPID. DI MANO (DES)\r\n[ 0 ]  RELIGIONE (INT)\r\n[ 0 ]  SOPRAVVIVENZA (SAG)\r\n[ 0 ]  STORIA (INT)\r\n\tFUNZIONI DI PRIMA UTILITA’\r\n\r\n\r\n\r\n\r\nOGNI TURNO PUO’ USARE 4 “MOSSE” SUDDIVISIBILI IN ATTACCHI O AZIONI (40 DANNI MAX) CHE NON INFLUENZANO L’AZIONE BASE DI SPOSTAMENTO/UTILIZZO OGGETTI\r\n\r\n\r\nPENNELLO DEL TRATTO VIVO, LAMA NASCOSTA 2D6 ALL’OCCORRENZA\r\n\r\n\r\nRUNE DI SANGUE : TATUAGGI INCISI SUL CORPO QUALORA DOVESSE ESSERE RUBATO/PERSO IL PENNELLO. ATTENZIONE CONSUMANO LINFA VITALE E PF.\r\n\r\n\r\nIL PG PUO’ APRIRE UNA QUALSIASI PORTA E RITROVARSI NEL SUO “RIFUGIO” SE USA LA RUNA ASSEGNATA AD ESSO. SPESSO UTILE IN SITUAZIONE DI NECESSITA’. \r\n\tUTILIZZABILI\r\n\r\n\r\n\r\n\r\n\r\n\r\n2 x SCHIVATA (Max 2 x SCONTRO)\r\n\r\n\r\n5 x RIFUGIO (Max 5 poi Slot LVL 1)\r\n\r\n\r\n2 x TAVOLA G. (Max 2 x SCONTRO)\r\n\r\n\r\n2 x TAVOLA G. (Max 2 x SCONTRO)\r\n\r\n\r\n1 x RUNA CURA TATUATA (Max 1)\r\n\tSAGGEZZA\r\n\r\n\r\n14\r\n\r\n\r\n(+2)\r\n\tCARISMA\r\n\r\n\r\n12\r\n\r\n\r\n(+1)\r\n\t16 (+3)  SAGGEZZA (PERCEZIONE) PASSIVA\r\n\t\r\n\r\nDESCRIZIONE PG\r\n\tETA’\r\n\r\n\r\n100\r\n\r\n\r\n\tALTEZZA\r\n\r\n\r\n1,65\r\n\tPESO\r\n\r\n\r\n60kg\r\n\tOCCHI\r\n\r\n\r\nROSA\r\n\r\n\r\n\tCARNAGIONE\r\n\r\n\r\nCHIARA\r\n\r\n\r\n\tCAPELLI\r\n\r\n\r\nVIOLA\r\n\tIMMAGINE 1\r\n\tIMMAGINE 2\r\n\t  \r\n\r\n\t  \r\n\r\n\tSTORIA\r\nMary nasce a Heisalor, la città principale di Brodental degli Elfi. Poco dopo la sua nascita, i suoi genitori si trasferiscono nella comunità druidica sotto le radici dell’albero sacro Irminsul, l’Albero della Vita, scegliendo una vita scandita dal rispetto della natura e dei suoi equilibri. Mary cresce lì, ma non si integra davvero: viene emarginata dai giovani druidi perché, invece di limitarsi ai riti, sviluppa una passione sempre più forte per la lettura e per la storia druidica più antica. Proprio per questo si avvicina a Elarion Thalwyr, un vecchio druido erudito ormai ritirato, che le insegna le rune antiche, un sapere che molti hanno smesso di studiare. Per Mary diventa una ricerca totale: più studia, più comprende che l’antichità elfica era più profonda di quanto la sua comunità volesse ammettere, e che dietro l’armonia del presente esisteva una potenza ordinata fatta di lingua incisa, leggi e volontà. Mary diventa così un’esperta delle rune, ma paga quel percorso con l’isolamento: i rapporti si consumano, gli amici non arrivano e la sua vita si stringe attorno a studio e disciplina, mentre i genitori non la ostacolano quando capiscono che il suo cammino non può restare confinato sotto Irminsul. Il vero inizio del viaggio arriva quando, attraverso le rune, Mary sviluppa una connessione con la natura così profonda da diventare un messaggio chiaro: la natura stessa le rivela di essere in pericolo e le indica un luogo preciso e una figura da trovare. Per questo Mary lascia Brodental e parte verso Gloxinia, le terre fredde, seguendo un richiamo che non è curiosità ma necessità, con un nome che le resta come direzione inevitabile: Ervork, parte di un gruppo che, secondo ciò che la natura le ha rivelato, può aiutarla a salvarla.\r\n\t\r\n\r\nEQUIPAGGIAMENTO\r\n\tTESTA\r\n\r\n\r\nX\r\n\tBUSTO\r\n\r\n\r\nCAPPOTTO DI KAMUT\r\n\tGAMBE\r\n\r\n\r\nVESTE SEMPLICE\r\n\tARMA 1\r\n\r\n\r\nPENNELLO DEL TRATTO VIVO\r\n\tARMA 2\r\nX\r\n\tALTR0O\r\nX\r\n\tARTEFATTO 1\r\n\r\n\r\nTAVOLA GAMMICA\r\n\tARTEFATTO 2\r\n\r\n\r\nCAVALLETTO DEL BIANCO PURO\r\n\r\n\r\n\tARTEFATTO 3\r\n\r\n\r\nX\r\n\tPENNELLO DEL TRATTO VIVO: Un pennello antico, con manico scuro e finiture dorate, usato da artisti itineranti capaci di trasformare il disegno in gesto reale. Il pennello non “evoca” materia: crea solo inchiostro animato, solido quel tanto che basta per colpire, afferrare, proteggere o sostenere per un tempo breve, poi si sfalda e svanisce. Il PG può disegnare su tela o su un supporto adatto, ma può anche comandare a distanza l’inchiostro già depositato in un punto, come se tracciasse direttamente lì. Le creazioni possono essere offensive o di utilità (barriere, prese, fruste, appigli, scudi, blocchi, trascinamenti, ecc.) e la loro stabilità dipende da quanto sono grandi e/o dettagliate: più sono complesse, più richiedono attenzione e tendono a essere meno stabili. Il PG ha un tetto massimo di danni per turno (40) da commutare in dadi : se genera più creazioni offensive, divide quel totale tra di loro (es. 4 creazioni piccole = 4 colpi separati che si spartiscono il massimale). Di norma il personaggio avrebbe 2 AZIONI e 2 ATTACCHI nel turno; quando impugna il Pennello, AZIONI e ATTACCHI si fondono in un unico totale di 4 “interventi” ridistribuibili liberamente (fino a 4 azioni, 4 attacchi o combinazioni), senza influenzare l'azione di movimento/uso oggetti. Un disegno piccolo richiede 1 intervento, un disegno medio 2 interventi, un disegno grande tutti e 4, con possibilità di combinare (es. 2 piccoli + 1 medio). Il PG può anche impiegare tutti e 4 gli interventi solo in tratto e concentrazione per completare una creazione ancora più grande o complessa, rinunciando ad altro nel turno; il “peso” non dipende solo dalla taglia: contano anche precisione, controllo e funzioni specifiche. Evocazioni Persistenti : quando si parla degli ATTACCHI, il PG può scegliere di non creare colpi istantanei ma una vera e propria evocazione d’inchiostro (corvi, bestie, figure animate); una volta generata, finché non viene eliminata o distrutta, rimane sul territorio e diventa la fonte dei suoi attacchi: finché presente, il PG può continuare a usare quella forma per colpire spendendo 1 solo punto Azione. La permanenza non ha un tempo fisso: dipende dall’inchiostro investito e dai danni/dispersione; ogni evocazione ha Punti Ferita propri e resta in campo fino a distruzione/eliminazione/trasformazione in runa. La quantità di inchiostro disponibile è limitata: più grande e dettagliata è l’evocazione, più inchiostro rimane impegnato e meno il PG ne avrà per generare altre cose; taglia e numero di evocazioni dipendono dagli interventi spesi nel turno: 1 intervento = una forma piccola (es. 1 corvo), 2 interventi = due forme piccole o una media, 4 interventi = una forma grande o più forme minori, secondo le regole già indicate. Il PG può mantenere attive fino a un massimo di 4 evocazioni piccole, oppure 2 medie, oppure 1 grande; spendendo l’intero turno in tratto e concentrazione può evocarne direttamente una grande sul campo (impiegando tutti e 4 gli interventi solo per disegnare), rinunciando ad altro nel turno. Le evocazioni possono trasformarsi in una runa su un punto (terreno, oggetto, bersaglio) al contatto, permettendo al PG di imprimere rune tramite i disegni oltre che tracciarle su tela o a terra. Il pennello nasconde un’anima lama: in casi estremi viene usato come coltello, infliggendo 2D6 danni per ogni attacco disponibile. Passiva : il pennello può assorbire solo il colore di ciò che tocca (pigmenti, tinte, vernici, polveri, tracce cromatiche) e replicarlo nel suo inchiostro; non copia proprietà, poteri o effetti, prende esclusivamente la cromia. Abilità Speciale : anche una sola chiazza d’inchiostro su terreno, oggetto o bersaglio può diventare un punto di comando; in un secondo momento il PG può farla espandere, muovere o trasformare in una creazione a distanza, come se stesse disegnando direttamente su quel punto.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n \r\n\r\n\r\nCAPPOTTO DI KAMUT : Un cappotto spesso e lungo ricavato dalla pelle del Kamut, una creatura tipica di Brodental, noto perché la sua fibra reagisce agli urti irrigidendosi nel punto dell’impatto come una corazza naturale che “scatta” solo quando serve, spezzando e assorbendo parte della forza e garantendo +2 alla CA (efficace soprattutto contro colpi moderati e ripetuti, mentre contro impatti estremi la protezione non è assoluta e può comunque essere superata). Il cappotto è costruito in modo estremamente modulare: lungo tutta la struttura presenta numerosi agganci, clip e attacchi che permettono di staccare e riattaccare sezioni, in particolare le parti delle braccia/maniche, così da adattarlo rapidamente a climi molto freddi o più caldi e a esigenze diverse del possessore senza perdere la sua funzione principale. Non possiede altre abilità “attive”, ma è ricco di dettagli pratici: molte tasche nascoste, punti di fissaggio per piccoli oggetti e accessori, e una vestibilità regolabile che lo rende un indumento da viaggio completo oltre che una protezione affidabile.\r\n\r\n\r\nTAVOLA GAMMICA : Un bracciale leggendario dall’aspetto elegante e discreto quando è chiuso, come un semplice ornamento dorato. Quando il PG lo desidera, l’artefatto si apre “a ali” e si dispiega in una vera tavolozza: possiede 11 gemme totali, 1 centrale molto più grande e 10 minori distribuite sulle due ali. Le gemme cambiano colore a volontà del possessore, permettendo di avere sempre la cromia perfetta pronta senza dover cercare pigmenti o preparare miscele. La tavola però non conserva solo colori: conserva anche “tratti”, cioè disegni già fissati e memorizzati. Ogni gemma può immagazzinare un tratto completo registrato in precedenza; quando il PG lo richiama, quel tratto viene riprodotto con estrema rapidità sulla superficie scelta, come se si disegnasse quasi da solo, riducendo drasticamente il tempo di esecuzione rispetto a una creazione improvvisata. Le 10 gemme minori ospitano tratti ordinari e versatili, mentre la gemma centrale può contenere un tratto speciale più potente del normale, pensato per momenti decisivi: la forma e la funzione del tratto maggiore vengono scelte dal PG al momento della registrazione e restano coerenti con la natura di “inchiostro vivo”, senza copiare poteri leggendari o proprietà impossibili. In casi estremi, l’artefatto può anche compattarsi e rimodellarsi fisicamente fino a diventare un piccolo scudo circolare, garantendo +1 alla CA finché resta in assetto difensivo, poi può richiudersi tornando alla forma di bracciale 2 X SCONTRO. Passiva : Il PG può cambiare istantaneamente colore alle gemme, mantenendo sempre pronta la cromia desiderata per il pennello o per qualsiasi intervento d’inchiostro. Abilità Speciale : Il bracciale può registrare e conservare 11 tratti. Le 10 gemme minori contengono tratti ordinari richiamabili rapidamente; la gemma centrale contiene 1 tratto maggiore, più potente, utilizzabile in contesti critici. Inoltre, cliccando una gemma, il PG può proiettare a distanza la cromia selezionata come spruzzo d’inchiostro oppure rilasciare direttamente il tratto preregistrato su una superficie a scelta. Questo permette di usare i tratti salvati anche senza il pennello, in situazioni di emergenza o quando lo strumento principale è indisponibile.\r\n\r\n\r\nCAVALLETTO DEL BIANCO PURO: Un treppiedi di legno richiudibile, consumato dal viaggio ma rifinito con incisioni sottili e piccoli rinforzi decorativi che lo fanno sembrare più di un semplice attrezzo. Quando viene aperto, la tela non si appoggia: nasce dal cavalletto stesso, tendendosi agli angoli come una vela tirata in forza, pronta a ricevere il tratto. Quando viene richiuso, la struttura rientra su sé stessa e la tela si ripiega insieme alle aste, serrandosi in un fascio compatto da portare sulle spalle. Si dice che questo cavalletto sia stato costruito per artisti che non potevano permettersi errori permanenti: ogni scena dipinta doveva poter sparire, ogni bozza doveva poter rinascere pulita, come se la pagina non avesse mai conosciuto macchia. Passiva : La tela può essere “azzerata” a comando del possessore. Qualunque materiale sia stato usato per dipingere viene cancellato e la superficie torna pulita e bianca, pronta a essere riutilizzata, senza lasciare residui. Abilità Speciale : Il cavalletto è legato al suo possessore tramite un semplice vincolo di tracciamento. Una volta designato, lo segue automaticamente e lo raggiunge quando viene richiamato o quando resta indietro, senza essere vivo e senza comprendere ciò che accade: si limita a muoversi per tornare dal proprietario.\r\n\r\n\r\n\t\r\n\r\n                                                                                                                \r\nINVENTARIO\r\n\tTotale massimo trasportabile 30P\r\n\t\r\n\r\n* POZIONE RIVITALIZZANTE : x 2 Consente di recuperare 15 PF. 2P \r\n\r\n\r\n* TACCUINO IN CUOIO : Taccuino da viaggio per appunti rapidi, idee di disegni, note su persone incontrate e intuizioni runiche; tutto ciò che viene scritto può essere trasferito automaticamente su un tomo più grande custodito nella SOGLIA PERSONALE, così da non perdere mai informazioni importanti. L’inchiostro usato è “riservato”: di base è leggibile solo dal possessore, ma può essere reso visibile anche ad altri a sua volontà. 1P\r\n\r\n\r\n* KIT PULIZIA E MANUTENZIONE : Panno, olio leggero, aghi e filo, piccole fibbie/clip di ricambio per tenere in ordine equipaggiamento e indumenti durante il viaggio. 2P\r\n\r\n\r\n* BORRACCIA PROFONDA (30L) : Borraccia runica che, una volta riempita, conserva una riserva interna fino a 30 litri senza aumentare l’ingombro esterno; permette di bere a lungo e di dosare l’acqua all’occorrenza. 2P\r\n\r\n\r\n* RAZIONI LEGGERE (10) : Scorte da campo essenziali per lunghi spostamenti. 2P\r\n\r\n\r\n* MONOLENTE D’OSSERVAZIONE : Monolente compatta capace di ingrandire sia a distanza (fino a circa 200 metri) sia su dettagli minuscoli, utile come binocolo e come “microscopio” da campo per leggere incisioni, studiare segni e controllare particolari. 1P\r\n\r\n\r\n* BUSSOLA MULTIDIREZINALE :  Bussola piccola e affidabile, fondamentale per orientarsi durante esplorazione e viaggi lunghi; può essere calibrata su rune specifiche poste su un oggetto, un luogo o un soggetto e puntare verso di esse, con un massimo di 5 rune memorizzabili contemporaneamente, selezionabili a volontà del PG. 1P\r\n\r\n\r\n* ASTUCCIO SIGILLATO DEI DISEGNI : Tubo rigido cerato per proteggere fogli, mappe e schizzi, inciso con una runa di protezione che consente l’apertura solo al possessore, così da custodire appunti e disegni importanti senza rischio di manomissione; tutto ciò che viene inserito può essere automaticamente archiviato nel porta-disegni/mappe sito nel “Rifugio”, se il PG lo desidera, infilando la mano nell’astuccio può recuperare direttamente il foglio o la mappa specifica di cui ha bisogno. 2P\r\n\r\n\r\n* CANDELA PROFUMATA INFINITA : Candela da viaggio che non si consuma mai; il profumo lieve aiuta a calmare la mente e a ritrovare lucidità, come un richiamo rassicurante a un luogo familiare quando ci si ferma per riposare. 1P\r\n\r\n\r\n* 5000 MONETE D’ORO. 5P\r\n\r\n\r\n\r\n\r\n\tTOT 19P/30P\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n🏡 RIFUGIO 🏡\r\n\tTotale massimo stivabile 500P\r\n\t* SCRITTOIO DEL TOMO INFINITO : Ampio scrittoio con sopra un tomo sempre “aperto” e pronto, dove confluiscono automaticamente tutte le scritte e gli appunti che il PG registra sul proprio taccuino personale o su fogli segnati con rune dello SPAZIO; il tomo funge da archivio completo e ordinato, consultabile nella SOGLIA PERSONALE. 25P\r\n\r\n* BAULE DEI DISEGNI E MAPPE : Baule capiente dove vengono archiviati disegni e mappe collegati all’ASTUCCIO SIGILLATO DEI DISEGNI; il contenuto può essere richiamato e organizzato a piacere dal PG, con fogli arrotolati o distesi a seconda della necessità. 25P\r\n\r\n* ARREDAMENTO E SUPPELLETTILI : Poltroncine e tavolino lettura, angolo cucina, quadri e materiali da disegno, piante e dettagli decorativi, candele levitanti e resto dell’allestimento della stanza. 50P\r\n\r\n\r\n\r\n\tTOT 100P/500P\r\n\t\r\n\r\nABILITÀ  & TRUCCHETTI & RUNE\r\n\t\r\n\r\nSOGLIA PERSONALE\r\nTRUCCHETTO\r\n\r\n\r\n\tIl PG mantiene sempre attiva una particolare Runa dello Spazio legata al proprio luogo personale, un “posto sicuro” che non ha collocazione reale nel mondo di Morgedal: non è in un punto preciso, non è raggiungibile seguendo una strada, e non esiste come edificio ancorato al terreno, ma come stanza sospesa in uno spazio etereo, protetta dal fatto stesso di non appartenere a nessun luogo. Quando il PG lo desidera, può apporre un sigillo di soglia su una porta qualsiasi e, spendendo un’azione, trasformare quell’ingresso in un varco temporaneo: aprendo la porta entra nella sua stanza, una sala ampia ma raccolta, silenziosa e stabile, pensata per trovare pace, riorganizzarsi e sentirsi al riparo. Il varco risponde alla volontà del PG: chiunque può entrare insieme a lui o subito dopo, senza dover ricevere sigilli o marchi, purché il PG lo permetta. Se invece il PG non lo desidera, l’accesso rimane negato: per chiunque altro quella porta non conduce alla stanza e non può essere attraversata, se non tramite interventi eccezionali o forze mistiche particolari. Una volta chiusa o dissolto il sigillo, la porta torna a essere una porta normale e il collegamento svanisce come se non fosse mai esistito. Dopo 5 utilizzi il PG dovra’ utilizzare uno slot lvl 1 / CD 16.\r\n\t\r\n\r\n\r\n\r\n\r\n\r\nRUNE DI SANGUE\r\nTRUCCHETTO\r\n\r\n\r\n\tIl PG porta sul corpo rune tatuate che funzionano come le sue rune normali, ma invece dell’inchiostro consumano la sua linfa vitale: ogni volta che le usa perde Punti Ferita in base alla potenza dello slot impiegato, quindi più alto è lo slot più il costo in PF è pesante. Sulle braccia (coperte dall’abbigliamento) ha le rune più utili e di primo utilizzo, tre sul braccio sinistro e tre sul destro, scelte tra PROTEZIONE, AMPLIFICAZIONE, NATURA, SPAZIO, TEMPO e MATERIA; sulla schiena invece ha un tatuaggio più grande che è la RUNA DELLA CURA, che può usare normalmente come tutte le altre pagando il costo in PF, ma che nasconde anche una modifica di emergenza che si attiva solo quando il PG è davvero in pericolo di vita e solo se decide lei di richiamarla. Abilità Speciale : In estrema urgenza, una volta per riposo lungo, il PG può “aprire” la runa grande sulla schiena e forzare il corpo a reggere oltre il limite: i suoi PF massimi diventano 150 e ottiene +3 alla CA; da quel momento ogni utilizzo di una runa tatuata costa sempre -10 PF a prescindere dallo slot (anche se è di livello 1). In questo stato tutte le rune tatuate risultano amplificate negli effetti, e inoltre il PG ottiene 1 slot di livello 5 gratuito da usare una sola volta mentre la modalità è attiva. Quando il PG torna al suo massimale naturale di PF può scegliere di disattivare la modalità. Al momento dell’attivazione il suo corpo si ricopre di strisce nere come se la linfa vitale venisse canalizzata e scritta sulla pelle. (CD 16 PER  USARE RUNE)\r\n\t  \r\n\r\n\r\n\r\n\r\n\r\n\r\nFORGIATURA LINFATICA\r\nTRUCCHETTO\r\n\r\n\r\n\tGrazie al potere della linfa, il PG può assimilare, commutare e trasformare il proprio potere in “potenza grezza”, trasferendola a un altro personaggio sotto forma di slot ripristinati. Il bersaglio li recupera come se li avesse riottenuti naturalmente, ma può ricevere questo beneficio una sola volta fino al successivo riposo lungo (o pausa molto prolungata). La forgiatura richiede sempre concentrazione continua: in combattimento conta in turni consecutivi, fuori dal combattimento richiede comunque tempo e dedizione totali; in entrambi i casi, se il PG viene colpito, disturbato o perde la concentrazione, non annulla tutto, ma la progressione arretra di 1 turno e deve essere ricostruita per completare il processo. Il PG può scegliere tre modalità: ripristinare un singolo slot (turni pari al livello: 1/2/3/4/5), ripristinare tutta la fascia di slot di un livello (turni pari a livello +2: 3/4/5/6/7), oppure ripristinare tutti gli slot (10 turni). Quest’ultima modalità è estrema: quando si completa, sia chi emette sia chi riceve subiscono -20 PF non curabili fino al termine dello scontro, perché lo sforzo supera i limiti del corpo e della linfa.\r\n\t\r\n\r\nTRATTI DISTINTIVI\r\n\t\r\n\r\n   * TRATTI CARATTERIALI : Calma e composta, con una buona parlantina senza essere invadente. Ha un indole gentile e tende ad aiutare il prossimo, ma non è ingenua: si fida delle persone con misura e la sua fiducia va guadagnata. Le piace esplorare, viaggiare e scoprire cose nuove; è avventurosa e curiosa, sempre pronta a mettersi in cammino quando c’è qualcosa da conoscere o da capire. Di base resta tranquilla, però quando qualcuno la provoca o serve farsi valere risponde a tono, senza paura di nessuno. Ama la natura e gli animali. Quando si pone un obiettivo diventa molto determinata: anche davanti a problemi e difficoltà non si tira indietro, si rimbocca le maniche e va fino in fondo.\r\n\r\n\r\n   * INSERIMENTO SLOT PG : Il PG potrà usufruire di diversi slot, suddivisi in livelli esclusivamente per abilità ATTIVE, il restante, verrà contrassegnato come TRUCCHETTO. I trucchetti avranno CD proprie ed avranno degli utilizzi limitati nell'arco della giornata (riposo lungo). I tiri delle Abilità e Rune verranno effettuati esclusivamente su ARTE con CD 16 che scaleranno su INTELLIGENZA.\r\n\r\n\r\n   * PRIVILEGI DI RAZZA :\r\n\r\n\r\n   * VISIONE CREPUSCOLARE : Gli occhi di un elfo possono vedere facilmente attraverso l'oscurità. In condizioni di luce fioca può vedere fino a 18 metri come se si trovasse in condizioni di luce intensa e nell'oscurità come se si trovasse in luce fioca. Nell'oscurità non è in grado di discernere i colori, ma solo le tonalità di grigio.\r\n\r\n\r\n   * AGILITA’ E DESTREZZA : Abituata al combattimento sin da piccola, la PG puo’ compiere acrobazie e gesti atletici con totale naturalezza. 2 volte per scontro puo’ utilizzare un'azione per schivare un attacco nemico effettuando un tiro contrapposto su DESTREZZA. Tutti i tiri su agilità e acrobazia hanno + 3 bonus.\r\n\r\n\r\n   * FIGLIA DELLA NATURA : Il PG, per origine e crescita, possiede una connessione naturale e spirituale con il mondo vivente che esula dalle rune. Anche senza attivare alcun potere runico, percepisce meglio l’ambiente, capisce con più facilità segni e tracce, riconosce passaggi, presenze e comportamenti tipici della fauna, e riesce a interagire con la natura in modo istintivo e rispettoso, ottenendo spesso risposte utili dal contesto. Questa sensibilità non sostituisce la Runa della Natura e non ne replica gli effetti: è un tratto costante che rende il PG più “in sintonia” con territorio, animali e segnali naturali, e gli permette di sfruttare competenze e intuizioni tipiche di una formazione druidica. E’ profondamente ammaliata dai TULIP una rarissima razza naturale presente solo nel tronco degli alberi sacri Irminsul e Yggdrasil.\r\n\r\n\r\n\r\n\r\n   * ARTE E DISEGNO : Il PG possiede una capacità fuori dal comune di fissare su un foglio ciò che ha in mente con precisione e coerenza. Se visualizza un volto, un simbolo, un luogo o un dettaglio descritto da altri, riesce a trascriverlo fedelmente come un ritrattista esperto, creando ritratti utili a riconoscere persone o a ricostruire identità da una semplice descrizione. Allo stesso modo, se ha in mente un percorso, una stanza, una struttura o una zona già vista, può riportarla su carta sotto forma di mappa, schema o pianta in modo rapido e leggibile, mantenendo proporzioni e riferimenti essenziali. In pratica, ciò che il PG immagina o ricorda diventa facilmente “disegnabile” e consultabile, come se la sua mente avesse già un tratto pronto.\r\n\r\n\r\n\t\r\n\r\n\r\n\r\n\r\n\r\nNOTE\r\n\t\r\n\r\n\r\n\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n        \r\n\t\r\n\r\n\r\n\r\n\t        \r\n\r\n\r\n\t\r\n\r\n\r\n\r\n\t\r\n\r\n\r\n\r\n\t\r\n\r\nRUNE ELFICHE\r\n\r\n\r\n\r\n\r\nRUNA DELL’AMPLIFICAZIONE 🌟\r\nABILITÀ\r\nQuando il PG traccia la Runa dell’Amplificazione, i segni ancestrali si caricano di energia pura e vengono apposti sul bersaglio, entrando in risonanza con la sua essenza. Il potere runico non crea capacità nuove e non cambia la natura di ciò che tocca: lavora su ciò che esiste già, come un catalizzatore che prende un potenziale reale e lo spinge oltre il suo limite naturale. L’amplificazione non è “una forza cieca”, ma una forza controllata: riversa potenza, stabilità ed efficacia in ciò che il bersaglio è già in grado di fare, rendendo quel potenziale più intenso, più solido e più incisivo. Al momento dell’attivazione, il PG utilizza uno slot di livello compreso tra 1 e 5 e sceglie una caratteristica del bersaglio tra FORZA, DESTREZZA, COSTITUZIONE, INTELLIGENZA, SAGGEZZA o CARISMA; in base al livello dello slot impiegato, la caratteristica selezionata viene potenziata in modo crescente. Questo potenziamento non è solo un numero: insieme al valore numerico, la runa fa emergere anche una serie di benefici coerenti con la caratteristica amplificata. Ai livelli più bassi l’effetto è lieve e circoscritto, ai livelli intermedi diventa più evidente e funzionale, mentre ai livelli alti l’amplificazione prende forma avanzata e mostra la sua piena forza. In altre parole, la runa non si limita a “dare un bonus”: rende quella caratteristica più completa, più affidabile e più dominante nel modo in cui il bersaglio agisce. Quando la runa viene lanciata con uno slot di livello 5, il PG può scegliere due strade diverse: concentrare tutta l’amplificazione su una singola caratteristica del bersaglio, ottenendo il massimo incremento accompagnato da bonus più importanti e incisivi, oppure distribuire l’energia runica in modo uniforme, potenziando tutte le caratteristiche con un incremento più equilibrato e stabile, così da ottenere un effetto più versatile e meno specializzato. I benefici aggiuntivi legati alla runa vengono stabiliti dal master in base alla situazione e alla caratteristica scelta, ma chi utilizza la runa può proporre una declinazione specifica dell’amplificazione, cioè può spiegare “in che modo” quella caratteristica sta venendo potenziata; la proposta può essere accettata se resta coerente con la natura della runa e con l’equilibrio generale dell’abilità. Dopo l’apposizione, la runa crea anche una connessione più profonda: il PG entra in sintonia con la conformazione fisica e spirituale del bersaglio e può studiarne l’essenza in modo estremamente preciso, come se stesse leggendo una struttura interna fatta di istinto, natura e identità. Da questa connessione nasce un effetto importante: l’amplificazione può essere modellata con grande finezza, quasi come un abito cucito su misura, perché la runa non amplifica “in modo uguale per tutti”, ma tende ad adattarsi a ciò che sta toccando. I potenziamenti possono essere immagazzinati e utilizzati, ma “alle rune piace cambiare\" : l’amplificazione può cambiare nel tempo e, se scelto dal PG, può essere riorientata e rimodulata ogni volta, mantenendo però la coerenza con la caratteristica che viene potenziata e con la potenza dello slot impiegato. \r\n   * LVL 1 : + 2 Micro Bonus \r\n   * LVL 2 : + 4  Bonus Modici\r\n   * LVL 3 : + 6 Bonus Media entita’\r\n   * LVL 4 : + 8  Bonus Avanzati\r\n   * LVL 5 : + 10 Macro Bonus / + 6 tutte le Caratteristiche + Bonus Media entita’\r\n\r\n\r\nRUNA DELLA PROTEZIONE 🛡️\r\nABILITÀ\r\nQuando il PG incide la Runa della Protezione, non “crea uno scudo” nel senso comune e non attiva una magia tradizionale. Fa una cosa più simile a una legge: impone una regola runica che stabilisce come il bersaglio (o un’area scelta) deve reagire a ciò che è ostile. In pratica la runa decide, prima ancora che la minaccia arrivi fino in fondo, se quella minaccia verrà ridotta, assorbita, deviata, trattenuta, rimodulata oppure respinta. La cosa importante è questa: la runa non finge che l’evento non sia mai esistito. L’attacco, l’energia, la condizione avversa e l’interferenza esterna esistono davvero, ma la runa cambia il modo in cui i loro effetti “si trasformano” quando entrano in contatto con il bersaglio o con l’area protetta. Al momento dell’attivazione, il PG utilizza uno slot di livello compreso tra 1 e 5. Quel livello rappresenta quanto fortemente la legge runica viene imposta: a livelli bassi la protezione riesce a controllare soprattutto eventi semplici e localizzati; a livelli alti riesce a gestire minacce più complesse, più insistenti o più ampie. In base al livello dello slot, il PG sceglie un numero crescente di componenti difensive da un roster di sette. Queste componenti entrano in funzione insieme e possono sembrare “separate” o possono fondersi, sostenersi e diventare un’unica protezione più organica, purché restino coerenti con ciò che ciascuna componente fa davvero. La runa può essere apposta direttamente su un bersaglio oppure sul terreno: nel primo caso la regola difensiva segue quel bersaglio; nel secondo caso la regola difensiva si applica a chiunque si trovi dentro l’area creata, e la dimensione dell’area e la forza della protezione dipendono dal livello dello slot impiegato. Ogni attivazione della Runa della Protezione è unica, perché le stesse componenti possono manifestarsi in modo diverso in base alla minaccia affrontata e al contesto: la runa non cambia natura, ma cambia “resa”, cioè cambia come si presenta e come risolve il problema. Spetta al master valutare se l’effetto dichiarato rientra nei limiti delle componenti scelte e nell’intensità dello slot usato, accettando che la stessa combinazione possa risultare più o meno incisiva a seconda della situazione.\r\n   * Al LIVELLO 1 il PG sceglie 1 componente.\r\n   * Al LIVELLO 2 il PG sceglie 2 componenti.\r\n   * Al LIVELLO 3 il PG sceglie 3 componenti.\r\n   * Al LIVELLO 4 il PG sceglie 4 componenti.\r\n   * Al LIVELLO 5 il PG può attivare tutte le componenti.\r\n1. MITIGAZIONE DEL DANNO\r\nQuesta componente lavora sul momento più diretto della difesa: quando una forza ostile colpisce, la runa interviene sull’impatto prima che diventi un danno pieno. È come se la runa “rompesse” la forza in arrivo, la spezzasse, la scompensasse o la spostasse di lato, così che una parte non arrivi mai davvero a colpire con tutta la sua potenza. La mitigazione può presentarsi come dissipazione, deviazione o assorbimento parziale: cambia da situazione a situazione, ma il concetto resta lo stesso, cioè che la forza non viene lasciata esprimere al massimo. La parte più importante è che l’energia intercettata non è obbligata a sparire: può essere trattenuta e resa più “maneggiabile”, può essere rimodulata e riorganizzata, e può diventare una risorsa che il bersaglio può poi usare come rilascio controllato, come slancio offensivo o come potenziamento momentaneo. In pratica la runa non dice solo “subisci meno”, ma può anche dire “quello che hai intercettato non è perso: può trasformarsi in qualcos’altro”. Funzione tecnica: riduzione o assorbimento dei danni subiti, con possibilità di conversione della potenza intercettata in energia offensiva o rilascio reattivo.\r\n\r\n\r\n2. STABILIZZAZIONE DEL CORPO\r\nQuesta componente non è pensata per un singolo colpo, ma per tutto ciò che “ti mangia nel tempo”. Protegge il bersaglio dagli effetti che peggiorano progressivamente e che, turno dopo turno, riducono la capacità di reggere lo scontro. La runa interviene su avvelenamenti, sanguinamenti, corrosioni, debilitazioni persistenti e condizioni che impongono penalità continuative o perdite graduali di risorse. La logica qui è molto semplice: il corpo non viene lasciato scivolare verso il collasso. Questa componente non è pensata per ripristinare ciò che è già stato perso; è pensata per impedire che la degradazione continui o si accumuli. In altre parole: non “guarisce”, ma impedisce che il bersaglio venga consumato e portato sempre più giù da effetti che lavorano lentamente.\r\nFunzione tecnica: prevenzione, riduzione o annullamento di danni ed effetti persistenti nel tempo.\r\n3. RESISTENZA AL CONTROLLO\r\nQuesta componente difende la libertà d’azione. Non riguarda solo il corpo, ma anche la capacità di agire senza essere “messo in gabbia” da un controllo esterno. La runa contrasta tutto ciò che tenta di limitare, forzare o spezzare la volontà e la possibilità di compiere azioni: costrizioni fisiche, blocchi del movimento, paura, confusione, stordimento e influenze che impediscono di agire pienamente. Non rende il bersaglio intoccabile e non garantisce che certi effetti non possano mai agganciarsi; però fa sì che il bersaglio riesca a opporsi, a reagire e, soprattutto, a non restare intrappolato senza possibilità di risposta. È una componente che rende più difficile trasformare il bersaglio in un bersaglio “inerte” o “inermi”. Funzione tecnica: riduzione o contrasto di effetti che impediscono movimento, azioni o volontà.\r\n4. SCHERMATURA ENERGETICA\r\nQuesta componente lavora sulle energie ostili: tutto ciò che è energia diretta, potere sovrannaturale, magie, incantesimi, fenomeno energetico o effetto che “arriva addosso” come una forza non solo fisica. La runa modifica il modo in cui quell’energia interagisce con il bersaglio o con l’area: può attenuarla, deviarla, assorbirla, disperderla o trattenerla per un momento, così che non esploda o non travolga con la sua forma piena. È importante che non si parla di annullamento totale: la runa non fa sparire l’energia come se non fosse mai esistita, ma ne altera traiettoria, intensità o comportamento, rendendola gestibile e trasformando un impatto “pieno” in un impatto “ridotto” o “ridistribuito”. Funzione tecnica: difesa contro effetti magici, energetici o sovrannaturali, tramite attenuazione, deviazione o assorbimento parziale.\r\n5. ANCORAGGIO\r\nQuesta componente stabilisce un vincolo tra il bersaglio e la sua posizione. Il concetto è: “tu sei qui, e non è facile spostarti da qui”. La runa si oppone a spinte, trascinamenti, separazioni, dislocazioni, teletrasporti ostili e alterazioni non volontarie della posizione nello spazio. L’ancoraggio non significa per forza immobilità assoluta: un bersaglio può ancora muoversi di sua volontà, ma diventa estremamente difficile “strapparlo via”, isolarlo, portarlo dove non vuole o impedirgli di restare dove serve che resti. È una protezione contro il controllo dello spazio sul bersaglio. Funzione tecnica: prevenzione di spostamenti forzati e dislocazioni indesiderate.\r\n6. CONVERSIONE VITALE\r\nQuesta componente prende una parte di ciò che la runa ha già intercettato (danno mitigato, energia assorbita, impatto ridotto) e lo rielabora in sostegno fisico. Non è una cura diretta che “fa comparire vita dal nulla”: è una compensazione difensiva. In pratica la runa dice: “se sono riuscito a prendere una parte della forza che ti avrebbe ferito, allora quella parte non deve essere sprecata; può diventare vigore, stabilità vitale o recupero limitato”. Può manifestarsi come punti ferita temporanei, come un recupero contenuto o come un rinforzo della resistenza del corpo. Il senso resta sempre lo stesso: una difesa che non si limita a ridurre, ma che trasforma una parte del negativo in sostegno. Funzione tecnica: trasformazione di parte del danno mitigato in beneficio vitale o punti ferita temporanei.\r\n7. RISPOSTA ISTINTIVA\r\nQuesta componente rende la protezione attiva e reattiva. Invece di essere solo “un muro”, la runa sfrutta ciò che nel turno non viene usato e lo converte in risposta immediata. Il concetto è: se il bersaglio ha risorse non sfruttate (azioni, movimento, margini di tempo), la runa può riorganizzarle e trasformarle in reazioni difensive: schivate, piccoli spostamenti rapidi, contrasti o interventi fuori dal normale flusso. Non crea azioni dal nulla e non regala turni extra: prende ciò che esiste come potenziale e lo trasforma in una reazione, rendendo il bersaglio più difficile da prendere “fermo” o “inermi” quando arriva l’attacco. È una difesa che usa il momento giusto, non solo la resistenza. Funzione tecnica: conversione di azioni o movimenti non usati in reazioni difensive o contrasti.\r\n\r\n\r\n   * LIVELLO 1 – EFFETTO MINORE \r\n   * LIVELLO 2 – EFFETTO MODERATO \r\n   * LIVELLO 3 – EFFETTO MEDIO \r\n   * LIVELLO 4 – EFFETTO AVANZATO \r\n   * LIVELLO 5 – EFFETTO SUPERIORE \r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nRUNA DELLO SPAZIO 📥📤\r\nABILITÀ\r\nQuando il PG incide la Runa dello Spazio, sta intervenendo sulle regole che decidono dove si trova qualcosa, come si attraversa una distanza e che cosa significa essere “separati” o “vicini”. È come se lo spazio, che normalmente è rigido (prima sei qui, poi cammini, poi arrivi lì), diventasse più flessibile e più “scrivibile” tramite il segno runico. Questa runa permette di rendere lo spazio più fluido quando lo si percorre, di cambiare posizione senza passare dal tragitto, di richiamare un legame spaziale già esistente e di stratificare lo spazio in livelli, come se potesse avere più “strati” temporanei. In base all’intensità dello slot utilizzato, la runa può funzionare su spostamenti più semplici o più complessi, su distanze più brevi o più ampie, su legami spaziali fragili o molto solidi, e su configurazioni più o meno stabili. La Runa dello Spazio è divisa in quattro macro categorie: ognuna prende un pezzo preciso del concetto di “spazio” e lo rende manipolabile. \r\n\r\n\r\n1. FLUSSO SPAZIALE\r\nIl Flusso Spaziale riguarda attraversare lo spazio senza perdere continuità. Qui non si “salta” da un punto all’altro e non si cambia posizione all’istante. Il movimento esiste ancora, ma cambia il modo in cui il movimento avviene. È come se la runa rendesse il percorso più “scorrevole”, impedendo che il movimento venga spezzato facilmente da ciò che normalmente lo rallenta o lo interrompe. L’attrito, i rallentamenti, gli impedimenti ambientali e le pressioni che normalmente fanno perdere tempo diventano meno determinanti. Non significa che il terreno scompaia o che gli ostacoli non esistano; significa che lo spazio “percorribile” diventa più permissivo, come se la runa riducesse la severità della geometria del luogo. In pratica, il Flusso Spaziale permette di trasformare uno spostamento in una sequenza continua: invece di fermarsi, inciampare, perdere l’azione o spezzare il ritmo, il movimento resta un flusso unico che prosegue. Funzione tecnica: questa componente modella la continuità dello spostamento, rendendo meno efficaci o meno invalidanti gli elementi che interrompono, rallentano o frammentano un movimento, e rendendo più affidabile raggiungere un posizionamento anche attraverso percorsi complessi, senza “teletrasportare” e senza ignorare lo spazio intermedio.\r\n2. TRASPOSIZIONE DIRETTA\r\nLa Trasposizione Diretta riguarda cambiare posizione senza attraversare lo spazio tra i due punti. Qui il movimento non viene migliorato: viene proprio sostituito. La runa non dice “muoviti meglio”, dice “ora sei lì”. Questo però non avviene in modo arbitrario, perché la Trasposizione Diretta ha un requisito chiaro: servono due riferimenti runici reali. Il primo è il segno attivo legato al punto di origine (cioè il punto da cui parte l’effetto, collegato al PG o alla runa che sta incidendo). Il secondo è un segno preesistente nel punto di destinazione, inciso in passato o comunque già presente, perché la runa deve “agganciare” quel punto e riconoscerlo come arrivo valido. Senza un segno reale di destinazione, la Trasposizione Diretta non ha un luogo a cui legarsi e non può essere “decisa a piacere”. Dentro questi limiti, la Trasposizione Diretta permette cambi netti di posizione: può spostare un soggetto o un oggetto su un punto segnato, può scambiare due collocazioni, può estrarre qualcosa da un punto segnato o inserirlo dentro un punto segnato, può ricollocare con precisione ignorando ostacoli e tragitto, purché l’aggancio runico esista davvero. Funzione tecnica: questa componente impone una nuova collocazione istantanea basata su due segni (origine attiva e destinazione preesistente), risolvendo problemi di posizione in modo diretto, riposizionare, scambiare, inserire, estrarre, sottrarre, senza attraversare lo spazio intermedio e senza dipendere dal percorso, ma sempre vincolata alla presenza reale dei segni.\r\n3. RICHIAMO SPAZIALE\r\nIl Richiamo Spaziale riguarda il concetto di legame: non “spostare a caso”, ma far prevalere una connessione spaziale già esistente. Se la Trasposizione Diretta è un cambio di posizione perché due punti sono segnati, il Richiamo Spaziale è un ritorno o un ricongiungimento perché esiste già una relazione tra un soggetto e un luogo, tra un oggetto e il suo vincolo, tra un’entità e una traccia che la lega a una destinazione. Questa componente non inventa destinazioni: funziona quando esiste già una connessione reale, come un segno inciso, una traccia, una risonanza o un vincolo stabilito. Anche qui c’è un requisito: servono due riferimenti, uno attivo e uno preesistente. Il riferimento attivo è il segno che “chiama” (determina cosa richiama o dove richiama). Il riferimento preesistente è il legame già presente sul bersaglio o sulla destinazione, perché la runa non deve creare un legame dal nulla: deve riattivarlo e farlo prevalere. Con il Richiamo Spaziale, qualcosa può tornare verso un punto segnato, un alleato può essere richiamato verso una runa incisa in precedenza, un oggetto può tornare al punto a cui era stato vincolato, una relazione spaziale può essere ristabilita anche se qualcosa l’ha interrotta o disturbata. È una componente che rende “affidabile” il concetto di ritorno: ciò che è legato, può essere ricondotto, se il segno lo richiama e se il legame esiste davvero. Funzione tecnica: questa componente riattiva e rafforza un vincolo spaziale già stabilito, costringendo il ritorno o il ricongiungimento verso un riferimento segnato, rendendo più difficile spezzare quella connessione con separazioni, spinte, dislocazioni o interferenze, e rendendo il richiamo più solido quanto più chiaro e profondo è il legame preesistente.\r\n4. SOVRAPPOSIZIONE SPAZIALE\r\nLa Sovrapposizione Spaziale riguarda lo spazio come struttura a strati, non solo come distanza. È l’idea che qualcosa possa esistere “di lato” rispetto allo strato ordinario, pur restando reale, come se venisse temporaneamente spostato in un livello spaziale adiacente. Qui non si tratta semplicemente di spostare un bersaglio da A a B: si tratta di modificare la struttura dello spazio per contenere, isolare, deviare o mettere in contatto elementi che normalmente resterebbero separati. Questa componente permette, per esempio, di collocare temporaneamente un oggetto in uno strato spaziale vicino per trasportarlo o custodirlo senza che occupi volume nello spazio ordinario; permette di isolare un’energia o un evento perché i suoi effetti non si riversino subito sull’ambiente materiale; permette di deviare parte di un impatto fuori dallo strato ordinario senza annullarlo, come se una porzione della forza venisse “spostata di lato”; permette di creare dimensioni alternative; permette anche di gestire situazioni in cui due stati spaziali devono coesistere per un attimo, senza confondere i corpi e senza creare sovrapposizioni impossibili. In sintesi, è la componente che fa capire che lo spazio non è sempre un unico foglio piatto: a volte può diventare un foglio con un secondo foglio attaccato sopra, e la runa decide cosa va su quale strato e per quanto tempo. Funzione tecnica: questa componente stratifica lo spazio rendendolo temporaneamente permeabile o “a livelli”, consentendo di custodire, isolare, deviare, proteggere e creare contatti brevi tra stati spaziali differenti, gestendo eventi troppo distruttivi o ingombranti per lo strato ordinario senza trasformare la sovrapposizione in una separazione permanente o in un mondo alternativo stabile.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nRUNA DEL TEMPO ⏳\r\nABILITÀ\r\nLa Runa del Tempo interviene sulla sequenza degli istanti, sulla durata degli eventi e sulla memoria delle condizioni, rendendo il tempo qualcosa di modellabile e leggibile. Quando il PG incide questa runa, impone un principio semplice: il tempo non è obbligato a scorrere sempre uguale per tutti, nello stesso modo e con la stessa rigidità. La runa non serve a spostare le cose nello spazio e non serve a “riscrivere la storia del mondo” in modo libero; serve invece a dare quattro strumenti chiari, ognuno con un significato preciso: cambiare il ritmo con cui accadono le cose, riportare indietro lo stato di qualcosa già segnato, far ripetere un tratto di realtà dentro un perimetro definito, e simulare una linea temporale possibile per scegliere con lucidità. La runa può essere incisa su un bersaglio, su un oggetto, su un punto o su un’area, perché una runa è prima di tutto un segno: dove viene posta, lì il tempo comincia ad ascoltare. Più alto è lo slot usato, più la runa riesce a influire su intervalli più lunghi, su più bersagli, su aree più grandi e con maggiore stabilità; più basso è lo slot, più l’effetto rimane breve, piccolo e semplice.\r\n1. CROMIA DEL TEMPO\r\nLa Cromia del Tempo è la parte più facile da immaginare perché funziona come una manopola: rende il tempo più veloce o più lento in un punto preciso. Non fa “viaggiare nel futuro” e non fa “tornare nel passato”: modifica solo il ritmo con cui gli istanti scorrono. Quando il tempo diventa più lento, tutto ciò che sta dentro quella cromia sembra muoversi con un peso addosso: le azioni richiedono più istanti per completarsi, le reazioni arrivano più tardi, gli spostamenti risultano più faticosi e ciò che succede matura più lentamente. Quando il tempo diventa più veloce, accade l’opposto: ciò che sta dentro quella cromia diventa più scorrevole, le azioni arrivano prima, le reazioni sono più pronte, le manovre si chiudono più rapidamente e le finestre di opportunità si aprono e si chiudono in modo diverso. La Cromia del Tempo può comprimere una breve durata perché qualcosa si chiuda prima o dilatarla perché qualcosa impieghi più tempo a compiersi; può rendere la cadenza di azioni e reazioni più fluida o più faticosa; può far perdere o guadagnare micro-frazioni di tempo senza trasformarle in teletrasporti temporali. Funzione tecnica: modula velocità, ritmo, durata breve e tempi di reazione di eventi già in corso o imminenti, rendendo il tempo più denso o più leggero attorno a ciò che viene colpito dalla runa.\r\n2. RICHIAMO DELLA CONDIZIONE\r\nIl Richiamo della Condizione governa la memoria temporale di un bersaglio segnato, permettendo di riportarlo a una condizione precedente registrata. È come dire: “ricordati com’eri”, e far tornare il bersaglio a quello stato. Qui non si rallenta e non si accelera niente: si lavora sulla memoria dello stato. Un soggetto, un oggetto o anche una condizione può essere segnato con una condizione di riferimento, come se la runa scattasse una fotografia invisibile. Quando poi qualcosa cambia quello stato (una ferita, una condizione debilitante, una trasformazione, uno sfasamento, un effetto che altera l’assetto), il Richiamo può riportare il bersaglio alla condizione registrata, ristabilendo assetto, postura, continuità di un effetto, integrità funzionale o condizioni temporanee definite al momento della marcatura. Questo non significa cancellare la storia del mondo: il mondo non dimentica ciò che è successo; è il bersaglio che viene riportato dentro il perimetro di ciò che era stato segnato, come se la runa imponesse di nuovo quello stato. Funzione tecnica: ripristina un set di condizioni salvate su un bersaglio segnato, facendo prevalere lo stato registrato contro alterazioni recenti, senza annullare gli eventi del mondo, ma cambiando di nuovo lo stato del bersaglio.\r\n3. ECO DEL CICLO\r\nL’Eco del Ciclo è il concetto del “loop”: il PG sceglie un pezzo di tempo recente e impone che quel pezzo si ripeta. Questa macrocategoria non riporta indietro solo una creatura a una condizione, ma può far tornare indietro una porzione di realtà inclusa nel segno. La runa può essere impressa su un’area, su un campo, su uno o più bersagli segnati, su un oggetto o su un punto, e può forzare la ripetizione di una finestra temporale recente, riportando ciò che è stato incluso nel ciclo a uno stato precedente e facendolo accadere di nuovo. La runa crea un confine (anche solo concettuale) e, dentro quel confine, tutto ciò che è stato incluso viene riportato indietro della finestra scelta e la scena si ripete. Non è un loop infinito: è una ripetizione controllata che permette di correggere un errore, ripetere un’azione in modo diverso, evitare una conseguenza, salvare qualcuno o ribaltare un evento dentro un perimetro definito. La differenza rispetto al Richiamo della Condizione è netta: nel Richiamo viene riportato indietro lo stato di una cosa; nell’Eco del Ciclo viene riportato indietro il tratto di realtà che la circonda. La memoria del ciclo può essere gestita dal PG: può far sì che tutti ricordino, può far sì che ricordino solo alcuni, oppure può essere così dominante da far conservare il ricordo anche ai nemici; questo dipende da come viene impostato il segno e da quanta potenza viene investita nella runa. Funzione tecnica: crea una ripetizione temporale reale e limitata, riportando indietro una finestra recente su ciò che è incluso nel ciclo, permettendo di ripetere la sequenza con esiti diversi.\r\n4. VISIONE DEL BIVIO\r\nLa Visione del Bivio governa la simulazione di una linea temporale possibile, non come viaggio nel futuro, ma come proiezione che viene attraversata per scegliere. È come fare una prova “senza che conti davvero”, ma non è un trucco gratuito: è una simulazione guidata dalla runa. Il PG sceglie un’azione o una direzione e la runa gli permette di attraversare per un breve tratto una linea possibile del tempo, osservando come evolverebbe quella scelta; poi, prima che quella linea diventi definitiva, il PG torna indietro al punto in cui aveva scelto e decide se confermare quella direzione o intraprenderne un’altra. Qui sta la differenza rispetto all’Eco del Ciclo: nel ciclo il mondo viene davvero riportato indietro e ripetuto; nella Visione del Bivio il mondo non viene resettato perché quella linea non si era ancora fissata come realtà completa: è una possibilità vista, poi scartata o confermata. Anche la memoria è modulabile: normalmente resta al PG, ma può essere condivisa con alleati o estesa anche a un avversario, se il segno include chi viene legato alla visione e se la potenza investita lo rende possibile. Funzione tecnica: permette di esplorare una linea temporale possibile e tornare al punto di scelta mantenendo la memoria di ciò che è stato visto, così da confermare o cambiare azione senza aver fissato definitivamente la prima linea come realtà.\r\n\r\n\r\n\r\n\r\nRUNA DELLA CURA 🌿\r\nABILITÀ\r\nQuando il PG incide la Runa della Cura, non sta “creando vita dal nulla” e non sta lanciando una guarigione come se fosse una magia tradizionale. Sta imponendo una regola runica che dice al corpo e allo spirito una cosa molto chiara: “torna in ordine, ricomponiti, riallineati”. Questa runa lavora sulla ricostruzione, sulla stabilizzazione e sulla continuità della vita, come se il segno elfico riuscisse a rimettere al posto giusto ciò che è stato spezzato, consumato o destabilizzato. La sua natura è profondamente elfica: non forza la realtà con un miracolo improvviso, ma guida il bersaglio verso una condizione più sana e più stabile, ricucendo ciò che è ferito e calmando ciò che è in disordine. Al momento dell’attivazione, il PG utilizza uno slot di livello compreso tra 1 e 5. Il livello dello slot rappresenta quanto “in profondità” la runa riesce a lavorare: a livelli bassi l’intervento è semplice, breve e mirato; a livelli intermedi diventa più completo e affidabile; a livelli alti la runa riesce a intervenire su stati più complessi e su una stabilizzazione molto più solida. La runa può essere apposta su un bersaglio, su un corpo o su una creatura in condizioni critiche, oppure su un punto o un’area se il PG vuole che la regola di cura agisca come “presenza” nel luogo; in quel caso, però, l’effetto resta sempre coerente con il concetto di ripristino vitale e la sua potenza dipende dallo slot impiegato. La cosa importante da capire è che la Runa della Cura non serve solo a “curare tanti danni”. La cura qui è a 360 gradi, perché la runa non vede solo la ferita: vede la vitalità nel suo insieme. Questo significa che può lavorare su più funzioni vitali avanzate, non necessariamente legate al numero di danni subiti. Può ricucire e ripristinare, ma può anche riportare il corpo a una condizione più efficiente e più stabile, ad esempio riducendo o annullando affaticamenti, calmando condizioni di sfavore fisico, riequilibrando una stanchezza profonda, stabilizzando un organismo che sta cedendo, ripulendo il “rumore” interno che rende il bersaglio meno lucido o meno reattivo, e rimuovendo quei blocchi vitali che non sono ferite aperte ma sono comunque un problema reale per la resa del corpo. In altre parole: questa runa può guarire, ma può anche “rimettere in sesto” in senso ampio, come se riportasse il bersaglio da uno stato di decadimento a uno stato di funzionalità. Questa runa non è pensata per sostituire tutte le difese o tutte le protezioni: non riduce l’impatto degli attacchi come una regola difensiva, ma interviene dopo che il danno o la condizione hanno colpito e cerca di ricomporre. Proprio per questo, il suo risultato non è mai identico ogni volta: la runa fa sempre cura, ma la cura può manifestarsi in modi diversi in base a ciò che il bersaglio sta subendo. In alcuni casi ricuce una ferita, in altri stabilizza un collasso, in altri ancora annulla un affaticamento o riequilibra una condizione fisica sfavorevole che sta limitando il bersaglio. La regola generale resta sempre la stessa: la runa porta il bersaglio verso una condizione migliore, più stabile e più viva, senza trasformarlo in qualcosa di diverso da ciò che è. Il modo più corretto di immaginarla è questo: la runa “legge” il bersaglio e individua dove la vitalità sta cedendo o perdendo efficienza, poi usa l’energia runica per riordinare quella parte. Più alto è lo slot, più la runa legge con precisione, più riesce a intervenire su più aspetti insieme e più riesce a mantenere stabile il risultato. Il master definisce la resa concreta del ripristino in base alla situazione e all’intensità dello slot, ma il PG può proporre come la cura debba manifestarsi (più ricucitura, più stabilizzazione, più recupero, più eliminazione di affaticamenti e condizioni fisiche sfavorevoli), e quella proposta può essere accettata se resta coerente con la natura della runa e con l’equilibrio del livello impiegato.\r\n\r\n\r\n\r\n\r\nRUNA DELLA MATERIA 🪨\r\nABILITÀ\r\nQuando il PG incide la Runa della Materia, impone una regola runica concreta che governa come la materia si dispone, che FORMA assume, quanto VOLUME occupa e quanto è DENSA. In questa runa, FORMA e MATERIA restano inseparabili: cambiare la FORMA significa riorganizzare la sostanza; cambiare la STAZZA significa cambiare il rapporto tra VOLUME e DENSITÀ; cambiare la CONSISTENZA significa cambiare quanto la materia “tiene” o “cede” pur restando reale. La runa viene incisa su un OGGETTO, su una porzione definita di esso o su una STRUTTURA fisica; lavora sulla materia delle cose e non è pensata come mutaforma di creature viventi. In base allo slot utilizzato, la riscrittura può essere più intensa, stabile e complessa, ma mantiene sempre un principio chiave: la runa non inventa proprietà magiche nuove e non trasforma un oggetto comune in un oggetto leggendario; rende la materia più adatta a una funzione fisica, modificando FORMA, VOLUME e DENSITÀ in modo coerente con il materiale. Questa runa permette quattro famiglie di intervento, che il PG può scegliere e combinare entro limiti credibili e compatibili con l’oggetto:\r\n\r\n\r\nFORMA / STRUTTURA: piegare, aprire, compattare, distendere, irrigidire o rendere flessibile, creare incastri, agganci e prese, rifinire una funzione concreta, ottenere protezioni fisiche semplici senza aggiungere poteri nuovi.\r\n\r\n\r\nSTAZZA / VOLUME: rendere un oggetto più grande o più piccolo, più ingombrante o più tascabile, più esteso o più concentrato, variando lo spazio che occupa senza alterarne la natura di base.\r\n\r\n\r\nDENSITÀ / CONSISTENZA: rendere la materia più compatta e resistente oppure meno densa e più “larga”, modificando anche peso, tenuta, rigidità e cedevolezza, sempre in modo coerente col materiale.\r\n\r\n\r\nCREAZIONE (SOTTOCATEGORIA ECCEZIONALE): questo e’ un  processo molto più complesso, perché costringe la materia a diventare un OGGETTO completo, con parti coerenti tra loro, dettagli, incastri e funzionalità fisica. Proprio per questo la CREAZIONE richiede uno sforzo enorme: è un uso raro, pesante e difficile da sostenere, e viene considerato praticabile solo con il massimo investimento di potere runico (lvl 5), perché anche ricreare un oggetto piccolo può prosciugare energie se deve essere preciso. Più la ricostruzione deve essere dettagliata, più diventa ardua, durata o rischio di imperfezioni sono frequenti se il PG spinge oltre ciò che può controllare. La CREAZIONE funziona in tre modi, in ordine di affidabilità: se il PG possiede un “aggancio reale” (un frammento autentico, una parte fondamentale, o materiale compatibile sufficiente), la runa può completare e ricostruire in modo fedele e stabile; se il PG non ha un frammento ma può studiare l’oggetto con attenzione (osservarlo a lungo, misurarlo, copiarne la struttura, usare uno stampo o un riferimento chiaro), può ricrearne una copia fisica credibile anche senza pezzi originali, ma con maggiore difficoltà e con più probabilità di difetti o instabilità; se invece il PG crea “da zero” senza agganci né riferimenti solidi, ciò che nasce può essere utile e funzionante, ma resta un oggetto comune, perché può imitare FORMA e utilità pratica, non l’unicità o le capacità speciali dell’originale. In ogni caso, la CREAZIONE non inventa poteri: se un oggetto aveva qualità uniche, quelle non possono comparire dal nulla; possono al massimo riemergere solo quando la ricostruzione avviene attorno a un nucleo autentico che già le conteneva, e solo se la ricomposizione è coerente e completa.\r\n\r\n\r\nRUNA DELLO SPIRITO 👁️‍🗨️\r\nABILITÀ\r\nQuando il PG incide la Runa dello Spirito, traccia un segno che parla direttamente alla parte invisibile delle cose: pensieri, volontà, presenza, intenzione, coscienza. Il segno runico crea una risonanza sottile che può avvicinare due menti, far emergere ciò che è nascosto dentro un impulso, guidare una scelta, proteggere la propria essenza, oppure afferrare per un istante il filo che lega un corpo alla sua guida interiore. In base allo slot utilizzato, questa risonanza diventa più ampia, più stabile, più profonda e più difficile da spezzare, rendendo possibili effetti più intensi o più complessi. La Runa dello Spirito racchiude sei macro categorie distinte: ognuna governa un modo diverso di interagire con mente, presenza e forza interiore, e possono essere usate singolarmente o intrecciate tra loro, purché l’effetto dichiarato resti coerente con la natura di ciascuna componente.\r\n\r\n\r\n1. SUSSURRO DELLA MENTE\r\nQuesta macrocategoria governa l’influenza sottile e la lettura dei moti interiori. Permette al PG di cogliere ciò che si muove dietro una parola o un’esitazione: tracce di emozione, intenzione, tensione, paura, rabbia, dubbio, desiderio. Il PG può rendere la mente del bersaglio più permeabile a una direzione semplice, spingendola verso un’idea immediata o un istinto preciso, senza trasformare la persona in un burattino. Può appesantire i pensieri e rendere più difficile mantenere lucidità e concentrazione, può confondere per un istante priorità e reazioni, oppure può fare l’opposto: portare calma e chiarezza, spegnendo panico e disordine emotivo. Questa componente lavora sul “prima”: prima che un gesto avvenga, prima che una scelta si chiuda, prima che una reazione esploda, guidando la mente come una voce che non si sente con le orecchie ma che la coscienza percepisce lo stesso. Funzione tecnica: lettura di emozioni e intenzioni, pressione mentale, orientamento di scelte semplici, disturbo o stabilizzazione di concentrazione e lucidità.\r\n\r\n\r\n2. FILAMENTO SPIRITUALE\r\nQuesta macrocategoria governa i legami invisibili tra presenze. Permette al PG di creare o rinforzare un collegamento fatto di risonanza. Il PG può imprimere un marchio etereo che rende un bersaglio riconoscibile alla percezione runica; può percepirne la direzione o la distanza in modo istintivo; può trasmettere messaggi senza suono, come un pensiero che attraversa un filo; può condividere sensazioni semplici o impulsi chiari per coordinarsi e non perdersi. Se il legame esiste, la runa può farlo prevalere contro separazioni e confusione, rendendo più difficile spezzare il contatto o cancellare la traccia. Funzione tecnica: marcatura eterea, percezione di direzione/distanza, comunicazione mentale, condivisione limitata di impulsi e sensazioni, mantenimento di legami spirituali.\r\n\r\n\r\n3. VELO DELL’ESSENZA\r\nQuesta macrocategoria governa la protezione della presenza interiore e la gestione della propria impronta spirituale. Permette al PG di rendere una mente più difficile da leggere e una presenza più difficile da agganciare. Può mascherare o attenuare l’aura, può rendere la mente opaca come avvolta da nebbia, può spezzare o indebolire legami ostili che cercano di ancorarsi alla coscienza, può sigillare temporaneamente un pensiero o un ricordo per impedirne l’estrazione, può creare silenzio interiore rendendo emozioni e impulsi più difficili da manipolare. È difesa invisibile, stabilità psichica e discrezione spirituale. Funzione tecnica: occultamento di aura/presenza, resistenza a lettura e influenza mentale, attenuazione di legami spirituali ostili, sigillo temporaneo di pensieri e ricordi, stabilizzazione della volontà.\r\n\r\n\r\n4. DOMINIO DEL VASO\r\nQuesta macrocategoria governa l’interazione più diretta tra volontà e corpo, cioè il punto in cui una mente guida un gesto. Permette al PG di interferire con la traduzione tra intenzione e movimento: introdurre esitazione, deviare un gesto, spezzare un’azione sul nascere, imporre un freno o un impulso minimo. Nei casi più profondi, la runa può tentare di prendere il comando per un istante, costringendo il corpo a obbedire a una direzione semplice o a un comando breve. Questa componente richiede sempre un aggancio reale e uno scontro di volontà: se la presa non entra, non c’è dominio; se entra, il dominio è sempre contestabile e non è mai gratuito, perché più l’interferenza è profonda più è facile che lasci fatica mentale o contraccolpo a chi la sta imponendo. Funzione tecnica: interferenza motoria, imposizione di freni o impulsi, deviazione di gesti e azioni, comando breve o controllo parziale quando la presa spirituale riesce e la volontà avversaria viene superata.\r\n\r\n\r\n5. OCCHIO INTERIORE\r\nQuesta macrocategoria governa la percezione passiva aumentata, cioè la capacità di “sentire” un’area anche quando non si sta guardando con gli occhi. Il PG, tramite la runa, espande la propria attenzione come una presenza che si stende sul campo: percepisce movimenti sottili, variazioni di intenzione, vuoti innaturali, presenze che cercano di non farsi notare, punti di tensione nello spazio, anomalie che stonano con il resto. Non è una vista perfetta e non è onniscienza: è una lettura a 360 gradi fatta di segnali spirituali, come se il mondo lasciasse impronte invisibili. Questa componente permette di individuare presenze nascoste o sfalsate, accorgersi di trappole o pericoli “in agguato” quando la loro natura lascia un’ombra percettiva, riconoscere un avversario invisibile perché la sua volontà e la sua presenza comunque “spingono” sul luogo, o cogliere il punto in cui un nemico è più fragile perché la sua essenza non è uniforme. Può anche essere usata per guidare gli alleati: il PG percepisce e comunica, segnala, coordina, rendendo il gruppo più reattivo e meno vulnerabile agli imboscamenti. Funzione tecnica: percezione a 360 gradi di presenze, anomalie, minacce nascoste e punti di vulnerabilità tramite lettura spirituale dell’area, con possibilità di trasmettere indicazioni agli alleati.\r\n\r\n\r\n6. MANO DELL’ANIMA\r\nQuesta macrocategoria governa l’espressione dello spirito come forza capace di interagire con il mondo fisico e con le presenze non materiali. Il PG condensa la propria risonanza in una “presa” invisibile: non è un semplice spostare oggetti come farebbe una forza meccanica, ma un tocco spirituale che può trattenere, spingere, richiamare, deviare, sostenere, oppure afferrare qualcosa che normalmente è intangibile. Questa componente può manifestarsi come telecinesi spirituale, ma anche come intervento su energie e presenze: respingere un’entità, trattenere un’ombra, disturbare una forma eterea, proteggere un alleato con una pressione invisibile, deviare un impatto quel tanto che basta a salvarlo, o creare una presa breve per immobilizzare o disarmare senza toccare fisicamente. Nei casi più alti, la runa può anche permettere una chiamata spirituale: non “crea” un essere dal nulla, ma richiama una presenza o un frammento di spirito compatibile con il segno, che può manifestarsi come supporto etereo, vincolo, guardia, disturbo o interposizione per un tempo limitato. È la parte più “grande” della runa, perché lo spirito diventa mano, pressione, presenza attiva. Funzione tecnica: interazione spirituale con materia ed entità (spinta, trazione, trattenimento, deviazione, sostegno), possibilità di afferrare o disturbare presenze non materiali, e richiamo temporaneo di una presenza spirituale coerente con il segno.\r\n\r\n\r\n\r\n\r\nRUNA DELLA NATURA 🌿\r\nTRUCCHETTO\r\nQuando il PG incide la Runa della Natura, imprime un segno che non “crea” potere dal nulla, ma risveglia e orienta ciò che è già vivo nel mondo, come se la realtà naturale riconoscesse la grammatica runica e decidesse di collaborare. Questa runa esiste per dare soluzioni pratiche, elastiche e credibili: muoversi meglio in un ambiente ostile, trovare copertura dove prima c’era solo esposizione, confondere la vista dove prima era netto, e ottenere aiuto da ciò che vive attorno, senza trasformare la natura in un comando assoluto. La Runa della Natura lavora sempre su un principio semplice: rende “più disponibile” ciò che è naturale, lo piega verso un intento preciso e poi lascia che torni al suo equilibrio; non costruisce strutture perfette, non produce oggetti impossibili, non garantisce effetti permanenti. Se il luogo è ricco di vita o di elementi naturali (vegetazione, terra, rocce, legno, radici, acqua, polvere, detriti), la runa trova più facilmente materia su cui agire; se il luogo è sterile o completamente artificiale, può comunque tentare di funzionare, ma la resa diventa più povera, più fragile o più breve. La Runa della Natura racchiude due macro categorie, che possono essere usate singolarmente o intrecciate tra loro, purch
