<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GORG — Scheda Personaggio</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
  :root{
    --bg:#0f0d0c;
    --bg-panel:#1b1613;
    --bg-panel-2:#241d18;
    --bg-panel-3: #171210;
    --border:#3d3024;
    --border-soft:#2a2119;
    --gold:#c9a34e;
    --gold-bright:#eecb7c;
    --violet:#9450d8;
    --violet-dim:#5c3a86;
    --red-glow:#c9463b;
    --blue:#4f8fd6;
    --blue-dim:#2d5a86;
    --teal:#2fb8ac;
    --teal-dim:#1d6b64;
    --amber:#e08a3a;
    --amber-dim:#8a541f;
    --identity:#4fae54;
    --identity2:#d6409f;
    --text:#ece3d0;
    --text-dim:#a89880;
    --text-faint:#7a6c58;
    --good:#6f9a63;
    --bad:#b04a3f;
    --radius:10px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.10), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(201,70,59,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:0;
  }
  ::selection{background:var(--violet-dim);color:#fff;}
  a{color:var(--gold-bright);}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:38px 24px 26px;
    border-bottom:1px solid var(--border);
        cursor:grab;
    user-select:none;
    touch-action:none;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;inset:0;z-index:-1;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
      url('assets/characters/vorkax-1.webp');
    background-size:cover;
    background-position:50% 20%;
    background-repeat:no-repeat;
    transition:transform .12s ease-out;
  }
  .hero.dragging{cursor:grabbing;}
  .hero-zoom-btn{
    background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.25);
    color:rgba(237,227,208,0.9);width:18px;height:18px;line-height:16px;
    border-radius:50%;font-size:12px;cursor:pointer;padding:0;margin:0 1px;
    font-family:var(--mono);vertical-align:middle;
  }
  .hero-zoom-btn:hover{background:rgba(0,0,0,0.7);}
  #hero-zoom-label{font-family:var(--mono);font-size:10px;margin:0 3px;vertical-align:middle;}
  .hero-hint{
    position:absolute;top:12px;right:16px;font-size:10px;letter-spacing:.4px;
    color:rgba(237,227,208,0.8);background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);
    padding:4px 11px;border-radius:12px;transition:opacity .2s;opacity:0.55;z-index:2;
  }
  .hero:hover .hero-hint{opacity:1;}

  .hero::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, var(--identity), var(--identity2));z-index:2;
  }
  .hero-inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .hero-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(38px,6vw,64px);
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-bright);
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    margin:0;
  }
  .hero-sub{font-family:var(--serif);font-style:italic;color:var(--text-dim);font-size:15px;margin-top:6px;}
  .hero-meta{display:flex;gap:10px;flex-wrap:wrap;}
  .hero-chip{
    background:rgba(20,16,14,0.65);
    border:1px solid var(--border);
    border-radius:20px;
    padding:6px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    backdrop-filter: blur(2px);
  }
  .hero-chip b{color:var(--gold-bright);font-weight:600;}
  .tipo-label{opacity:.65;font-size:11px;letter-spacing:.5px;}
  .hero-chip-tipo{border-color:var(--identity);}
  .hero-chip-tipo b{color:var(--identity);}
  .hero-chip-id{display:flex;flex-direction:column;gap:1px;padding:5px 14px 6px;}
  .hero-chip-label{
    font-size:8px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-faint);font-weight:600;line-height:1.3;
  }
  .quicknav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;}
  .quicknav-pill{
    display:inline-flex;align-items:center;gap:5px;
    background:color-mix(in srgb, var(--identity) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--identity) 45%, transparent);
    border-radius:14px;padding:4px 12px;font-size:12px;color:var(--identity);
    cursor:pointer;transition:background .15s,color .15s;
  }
  .quicknav-pill:hover{background:color-mix(in srgb, var(--identity) 25%, transparent);color:var(--gold-bright);}
  .quicknav-pill::before{content:"\2197";font-size:11px;}
  @keyframes anchorFlash{0%,100%{box-shadow:none;}30%{box-shadow:0 0 0 3px var(--gold);}}
  .anchor-flash{animation:anchorFlash 1.4s ease;}
  .editable-name{
    background:transparent;border:none;color:var(--gold-bright);font-family:var(--serif);
    font-weight:700;font-size:64px;letter-spacing:2px;text-transform:uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 26px rgba(148,80,216,0.35);
    border-bottom:1px dashed transparent; padding:0; width:100%; max-width:100%;
    white-space:nowrap; overflow:hidden;
  }
  @media (max-width:720px){ .editable-name{ font-size:38px; } }
  .editable-name:hover, .editable-name:focus{border-bottom:1px dashed var(--gold); outline:none;}

  /* ---------- TABS ---------- */
  .tabbar{
    position:sticky;top:0;z-index:50;
    background:rgba(15,13,12,0.94);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    white-space:nowrap;
  }
  .tabbar-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 16px;}
  .tab-btn{
    background:none;border:none;color:var(--text-dim);
    font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:0.4px;
    padding:14px 16px;cursor:pointer;border-bottom:2px solid transparent;
    text-transform:uppercase;transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-bright);border-bottom:2px solid var(--gold);}
  .dot-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--identity);margin-left:6px;filter:drop-shadow(0 0 4px var(--identity));animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---------- CARDS / GRID ---------- */
  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:1.6px;
    color:var(--gold);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .card h2 small{font-family:var(--sans);text-transform:none;letter-spacing:0;color:var(--text-faint);font-size:11px;}
  .grid{display:grid;gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  @media (max-width:820px){.grid-4,.grid-3,.grid-6{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.grid-4,.grid-3,.grid-2,.grid-6{grid-template-columns:1fr 1fr;}}
  @media (max-width:700px){.grid-2{grid-template-columns:1fr;}}
  @media (max-width:520px){#equip-slots-grid{grid-template-columns:1fr;}}
  @media (max-width:480px){.grid-3{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-faint);}
  .field input[type=text], .field input[type=number], select, textarea{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%;
  }
  .field input:focus, textarea:focus, select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  textarea{resize:vertical;font-family:var(--sans);line-height:1.55;}

  /* ---------- ABILITY SCORES ---------- */
  .abil-box{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:14px;text-align:center;position:relative;
  }
  .abil-box .name{font-size:11px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .abil-box input[type=number]{
    width:64px;text-align:center;font-size:20px;font-weight:700;font-family:var(--mono);
    background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);
    margin:8px auto 6px;padding:4px 0;
  }
  .abil-box .mod{
    font-family:var(--mono);font-size:22px;color:var(--gold-bright);font-weight:700;
    width:60px;text-align:center;background:transparent;border:1px solid transparent;
    border-radius:6px;padding:2px 0;margin:0 auto;display:block;
  }
  .abil-box .mod:hover{border-color:var(--border-soft);}
  .abil-box .mod:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,78,0.15);}
  .abil-box .mod.is-override{color:var(--text);border-color:var(--gold);background:var(--bg-panel-3);}

  /* ---------- STAT PILLS ---------- */
  .statpill{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px;text-align:center;}
  .statpill label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);margin-bottom:6px;}
  .statpill input{width:100%;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;background:transparent;border:none;color:var(--gold-bright);}
  .statpill input:focus{outline:none;}

  /* ---------- HP ---------- */
  .hp-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .hp-track{flex:1;min-width:220px;height:22px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;position:relative;}
  .hp-fill{height:100%;background:linear-gradient(90deg,#7a2a24,var(--bad));transition:width .3s;}
  .hp-numbers{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:15px;}
  .hp-numbers input{width:64px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);border-radius:6px;padding:6px 2px;}
  .hp-row-temp{margin-top:6px;}
  .hp-track-temp{height:14px;}
  .hp-fill-temp{height:100%;background:linear-gradient(90deg,#8a5a1f,var(--amber));transition:width .3s;}
  .btn{
    background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.3px;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn.primary{background:linear-gradient(180deg, #3a2a12, #241a0c);border-color:var(--gold);color:var(--gold-bright);}
  .btn.small{padding:4px 9px;font-size:11px;}
  .btn.danger:hover{border-color:var(--bad);color:#ff9d90;}

  /* ---------- SKILL LIST ---------- */
  .skill-row{display:grid;grid-template-columns:1fr 46px 60px;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border-soft);}
  .skill-row:last-child{border-bottom:none;}
  .skill-name{font-size:13.5px;}
  .skill-abbr{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);text-align:center;background:var(--bg-panel-3);border-radius:5px;padding:3px 0;}
  .skill-row input[type=number]{width:100%;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:6px;padding:5px 0;font-family:var(--mono);font-weight:700;}

  /* ---------- SAVES ---------- */
  .save-row{display:grid;grid-template-columns:26px 1fr 60px;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--border-soft);}
  .save-row:last-child{border-bottom:none;}
  .save-row .modbadge{font-family:var(--mono);text-align:center;color:var(--gold-bright);font-weight:700;background:var(--bg-panel-3);border-radius:6px;padding:5px 0;}
  .save-row input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;}

  /* ---------- PIPS / TRACKERS ---------- */
  .tracker{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .tracker:last-child{border-bottom:none;}
  .tracker .t-name{font-size:13.5px;font-weight:600;color:var(--text);min-width:190px;}
  .tracker .t-desc{font-size:11.5px;color:var(--text-faint);flex:1;min-width:160px;}
  .pips{display:flex;gap:6px;}
  .pip{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);
    cursor:pointer;background:transparent;transition:background .15s, box-shadow .15s;
  }
  .pip.used{background:radial-gradient(circle at 35% 30%, var(--violet), var(--violet-dim));box-shadow:0 0 8px rgba(148,80,216,0.8);border-color:var(--violet);}
  .pip.death{border-color:var(--bad);}
  .pip.death.death-success{border-color:var(--good);}
  .pip.death.death-success.used{background:radial-gradient(circle at 35% 30%, #8fc97e, var(--good));box-shadow:0 0 8px rgba(111,154,99,0.7);border-color:var(--good);}
  .pip.death.death-fail.used{background:radial-gradient(circle at 35% 30%, #e0685a, var(--bad));box-shadow:0 0 8px rgba(224,104,90,0.7);border-color:var(--bad);}
  .pip.fail{border-color:var(--text-faint);}

  /* ---------- SLOTS ---------- */
  .slot-lvl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .slot-lvl:last-child{border-bottom:none;}
  .slot-lvl .lvl-badge{font-family:var(--serif);font-weight:700;color:var(--gold-bright);width:78px;font-size:13px;}
  .slot-lvl input.maxslot{width:42px;text-align:center;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-faint);border-radius:5px;font-size:11px;padding:3px 0;}

  /* ---------- RICH TEXT ---------- */
  .rich{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;
    padding:12px 14px;font-size:14px;line-height:1.65;color:var(--text);
  }
  .rich:focus{outline:none;border-color:var(--gold);}
  .rich b, .rich strong{color:var(--gold-bright);}
  /* Editor Master: consente di ridimensionare verticalmente (drag dell'angolo in basso
     a destra) i riquadri di testo modificabili, sullo stesso principio già usato per le
     Note. Attivo solo quando l'Editor Master è acceso (classe su <body>), quindi mai
     visibile o utilizzabile in modalità giocatore. */
  body.master-editor-on .rich[contenteditable]{
    resize:vertical;overflow:auto;min-height:60px;
  }
  body.master-editor-on .inv-item-desc{
    /* niente overflow:auto qui: la descrizione non deve mai avere uno
       scroll interno. Il Master può comunque ingrandirla manualmente
       (resize:vertical); se prova a ridurla sotto l'altezza del contenuto,
       il listener ResizeObserver in renderInvTable() la fa risnappare. */
    resize:vertical;overflow:hidden;min-height:44px;
  }
  /* Blocco 1: in Editor Master ogni riquadro/tabella (non solo l'inventario)
     deve potersi ridimensionare verticalmente, con lo stesso comportamento
     già usato per le Note: resize manuale dall'angolo in basso a destra. */
  body.master-editor-on .subcard,
  body.master-editor-on .tracker,
  body.master-editor-on textarea{
    resize:vertical;overflow:auto;
  }
  body.master-editor-on .subcard{min-height:80px;}
  body.master-editor-on .tracker{min-height:56px;}
  .subcard{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .subcard h3{margin:0 0 8px;font-family:var(--serif);font-size:14.5px;color:var(--gold-bright);letter-spacing:.4px;}
  .subcard .tag{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);background:rgba(255,255,255,0.05);border:1px solid var(--border-soft);border-radius:10px;padding:2px 9px;margin-bottom:8px;}
  .subcard .tag.tag-passiva{color:var(--amber);background:rgba(224,138,58,0.14);border-color:var(--amber-dim);}
  .subcard .tag.tag-truccetto{color:var(--blue);background:rgba(79,143,214,0.12);border-color:var(--blue-dim);}
  .subcard .tag.tag-abilita{color:var(--red-glow);background:rgba(201,70,59,0.14);border-color:rgba(201,70,59,0.45);}
  .subcard .tag.tag-incantesimo{color:var(--violet);background:rgba(148,80,216,0.12);border-color:var(--violet-dim);}
  .subcard .tag.tag-ambito{color:var(--teal);background:rgba(47,184,172,0.14);border-color:var(--teal-dim);}
  .subcard .tag.tag-campo{color:var(--good);background:rgba(111,154,99,0.14);border-color:rgba(111,154,99,0.45);}
  .subcard-grouped{grid-column:1/-1;}
  .subcard-subsection{padding-top:10px;margin-top:10px;border-top:1px dashed var(--border-soft);}
  .subcard-subsection:first-of-type{border-top:none;margin-top:6px;padding-top:0;}
  .subcard-subsection h4{margin:0 0 4px;font-size:13.5px;color:var(--gold-bright);font-family:var(--serif);}

  /* ---------- MASTER EDITOR (visibile solo in modalità Editor Master) ---------- */
  .master-toolbar{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-bottom:8px;padding:4px 6px;border-radius:6px;
    background:rgba(148,80,216,0.08);border:1px dashed var(--violet-dim);
  }
  .master-cat-select, .master-box-width{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:5px;font-size:10px;padding:2px 4px;max-width:120px;
  }
  .master-mini-btn, .master-mini-del{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:5px;font-size:11px;padding:2px 7px;cursor:pointer;line-height:1.3;
  }
  .master-mini-btn:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  .master-mini-del{color:var(--bad);}
  .master-mini-del:hover{border-color:var(--bad);}
  .master-eye-btn.is-hidden{color:var(--bad);border-color:rgba(176,74,63,0.5);}
  .master-hidden-item{opacity:0.55;border-style:dashed;}
  .master-add-btn{margin-top:8px;}
  .master-name-input{
    display:block;width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border-soft);
    color:var(--gold-bright);font-family:var(--serif);font-size:14.5px;letter-spacing:.4px;
    margin:0 0 8px;padding:0 0 4px;
  }
  .master-name-input:focus{outline:none;border-color:var(--gold-bright);}
  .master-tag-input, .master-uso-input{
    display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;
    background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--text-dim);
    border-radius:10px;padding:2px 9px;margin-bottom:8px;width:auto;max-width:220px;
  }
  [data-master-field][contenteditable="true"]{border-radius:4px;}
  [data-master-field][contenteditable="true"]:focus{outline:1px dashed var(--violet-dim);}
  .home-link{
    position:fixed;top:14px;left:16px;z-index:60;
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    text-decoration:none;white-space:nowrap;transition:border-color .15s, color .15s;
  }
  .home-link:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  @media (max-width:760px){
    .home-link{position:static;display:inline-flex;margin:0 0 10px;}
  }

  .master-editor-toggle{
    display:none;position:fixed;bottom:14px;left:16px;z-index:60;
    align-items:center;gap:6px;padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;white-space:nowrap;
  }
  .master-editor-toggle.show{display:flex;}
  .master-editor-toggle:hover{border-color:var(--gold-bright);}
  .master-editor-toggle.on{background:rgba(148,80,216,0.18);color:var(--violet);border-color:var(--violet);}
  @media (max-width:760px){
    .master-editor-toggle{position:static;margin:0 0 10px;}
  }

  .master-color-picker{
    display:none;position:fixed;bottom:60px;left:16px;z-index:60;
    align-items:center;gap:8px;padding:6px 12px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--violet-dim);
    color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:.2px;
    white-space:nowrap;
  }
  .master-color-picker.show{display:flex;}
  .master-color-picker input[type=color]{
    width:30px;height:22px;border:none;border-radius:6px;padding:0;
    background:none;cursor:pointer;
  }
  @media (max-width:760px){
    .master-color-picker{position:static;margin:0 0 10px;}
  }

  /* ---------- EVOLUZIONI FUTURE (pannelli richiudibili) ---------- */
  .evo-note{font-size:12.5px;color:var(--text-faint);margin:-6px 0 14px;line-height:1.5;}
  .evo-level{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .evo-level:last-child{margin-bottom:0;}
  .evo-level summary{
    list-style:none;cursor:pointer;padding:12px 16px;font-family:var(--serif);font-size:14.5px;color:var(--gold-bright);
    display:flex;align-items:center;gap:8px;user-select:none;
  }
  .evo-level summary::-webkit-details-marker{display:none;}
  .evo-level summary::before{content:"\25B8";color:var(--gold);transition:transform .15s;}
  .evo-level[open] summary::before{transform:rotate(90deg);}
  .evo-level summary:hover{color:var(--gold);}
  .evo-content{padding:0 16px 16px 16px;border-top:1px solid var(--border-soft);padding-top:12px;}
  .evo-content p{margin:0 0 10px;}
  .evo-content p:last-child{margin-bottom:0;}

  /* ---------- EQUIP GRID ---------- */
  .equip-slot{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .equip-slot label{display:block;font-size:10px;text-transform:uppercase;color:var(--text-faint);letter-spacing:1px;margin-bottom:4px;}
  .equip-slot input{width:100%;background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:14px;}
  .equip-slot input:focus{outline:none;}
  .img-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .thumb{width:42px;height:42px;border-radius:7px;object-fit:cover;border:1px solid var(--border-soft);background:var(--bg-panel-3);cursor:pointer;}
  .thumb-placeholder{width:42px;height:42px;border-radius:7px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:17px;background:var(--bg-panel-3);cursor:pointer;flex-shrink:0;}
  .thumb-placeholder:hover, .thumb:hover{border-color:var(--gold);}
  /* Miniature Equipaggiamento: più grandi rispetto a quelle dell'Inventario */
  #equip-slots-grid .img-row{flex-wrap:wrap;gap:10px;}
  #equip-slots-grid .thumb, #equip-slots-grid .thumb-placeholder{width:96px;height:96px;border-radius:10px;}
  #equip-slots-grid .thumb-placeholder{font-size:30px;}
  .file-btn{font-size:10.5px;color:var(--text-dim);cursor:pointer;border:1px solid var(--border-soft);border-radius:6px;padding:4px 8px;background:var(--bg-panel-2);white-space:nowrap;}
  .file-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .file-input-hidden{display:none;}
  .img-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;}
  .img-remove:hover{color:var(--bad);}

  /* ---------- INGRANDIMENTO IMMAGINE (solo Equipaggiamento) ---------- */
  .img-zoom{
    background:none;border:1px solid var(--border-soft);border-radius:6px;color:var(--text-faint);
    cursor:pointer;font-size:13px;width:24px;height:24px;line-height:1;flex-shrink:0;
  }
  .img-zoom:hover{border-color:var(--gold);color:var(--gold-bright);}
  .img-lightbox{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;}
  .img-lightbox[hidden]{display:none;}
  .img-lightbox-backdrop{position:absolute;inset:0;background:rgba(10,8,7,0.95);backdrop-filter:blur(4px);}
  .img-lightbox-content{
    position:relative;width:100%;height:100%;max-width:min(98vw,2200px);max-height:97vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transform:scale(.96);opacity:0;transition:transform .16s ease,opacity .16s ease;
  }
  .img-lightbox.show .img-lightbox-content{transform:scale(1);opacity:1;}
  .img-lightbox-content img{display:block;max-width:100%;max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:12px;border:1px solid var(--border-soft);box-shadow:0 16px 60px rgba(0,0,0,0.6);}
  .img-lightbox-caption{color:var(--gold-bright);font-size:15px;font-weight:600;text-align:center;}
  .img-lightbox-caption[hidden]{display:none;}
  .img-lightbox-close{
    position:absolute;top:-16px;right:-16px;width:42px;height:42px;border-radius:50%;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    font-size:24px;line-height:1;cursor:pointer;
  }
  .img-lightbox-close:hover{border-color:var(--gold);color:var(--gold-bright);}
  @media (max-width:720px){
    .img-lightbox{padding:8px;}
    .img-lightbox-content{max-width:100vw;max-height:100vh;gap:10px;}
    .img-lightbox-content img{max-height:calc(100vh - 70px);}
    .img-lightbox-close{top:-13px;right:2px;width:38px;height:38px;font-size:22px;}
  }

  /* ---------- INVENTORY ---------- */
  .inv-cap{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .inv-bar{flex:1;min-width:200px;height:16px;background:var(--bg-panel-3);border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;}
  .inv-bar-fill{height:100%;transition:width .3s, background .3s;}
  /* Elenco Inventario: card verticali, ordine Nome -> Descrizione -> Peso.
     La descrizione non ha altezza fissa né scroll interno: si espande col contenuto. */
  .inv-list{display:flex;flex-direction:column;gap:10px;}
  .inv-item{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
  .inv-item-top{display:flex;align-items:center;gap:10px;}
  .inv-item input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;}
  .inv-item .imgcell{flex-shrink:0;}
  .inv-item-name{background:transparent;border:none;color:var(--text);font-weight:600;font-size:14px;flex:1;min-width:0;}
  .inv-item-name:focus, .inv-item-desc:focus{outline:none;background:var(--bg-panel-3);border-radius:4px;}
  .inv-item-desc{
    display:block;width:100%;box-sizing:border-box;margin-top:8px;
    background:transparent;border:none;color:var(--text-dim);font-size:13px;font-family:var(--sans);
    line-height:1.5;resize:none;overflow:hidden;min-height:22px;padding:4px 2px;
  }
  .inv-item-peso{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
  .inv-item-peso label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);}
  .inv-item-peso input[type=number]{width:52px;background:var(--bg-panel-3);border:1px solid var(--border-soft);color:var(--gold-bright);border-radius:5px;text-align:center;font-family:var(--mono);}
  .inv-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;flex-shrink:0;}
  .inv-remove:hover{color:var(--bad);}

  /* ---------- PORTRAITS ---------- */
  .portraits{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){.portraits{grid-template-columns:1fr;}}
  .portrait{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-soft);}
  /* Il resize verticale nativo (angolo in basso a destra) \u00e8 disponibile
     solo in Editor Master: solo il Master controlla la dimensione del
     riquadro, il giocatore controlla solo immagine e didascalia. */
  body.master-editor-on .portrait{resize:vertical;}
  .portrait img{width:100%;display:block;filter:saturate(1.05) contrast(1.03);cursor:pointer;}
  /* Quando il riquadro ha un'altezza personalizzata (persistita dal
     Master), l'immagine usa object-fit:cover per non deformarsi mai. */
  .portrait.has-h img{height:100%;object-fit:cover;}
  .portrait .cap{
    position:absolute;bottom:0;left:0;right:0;padding:10px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
    font-family:var(--serif);letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:var(--gold-bright);
    border:none;outline:none;width:100%;box-sizing:border-box;
  }
  .portrait .cap:focus{background:linear-gradient(0deg, rgba(0,0,0,0.92), rgba(0,0,0,0.35));}

  /* ---------- NOTES ---------- */
  .note-entry{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .note-entry .note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .note-entry input[type=text]{background:transparent;border:none;color:var(--gold-bright);font-weight:700;font-size:13px;width:70%;}
  .note-entry input[type=text]:focus{outline:none;}
  .note-entry textarea{background:transparent;border:none;color:var(--text);width:100%;min-height:70px;font-size:13.5px;}
  .note-entry textarea:focus{outline:none;}
  .note-date{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}

  .savebar{
    position:static;margin:28px 0 40px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    max-width:min(94vw, 620px);justify-content:flex-end;
    font-size:11px;color:var(--text-faint);
    background:rgba(20,16,14,0.9);border:1px solid var(--border-soft);border-radius:16px;
    padding:8px 10px;
  }
  .savebar b{color:var(--gold-bright);}
  .savebar .btn{padding:5px 11px;font-size:10.5px;border-radius:14px;}
  .savebar .sep{width:1px;height:16px;background:var(--border-soft);}
  .savebar.warn{border-color:var(--bad);}
  .savebar-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 14px;border-radius:14px;
    background:var(--bg-panel-2);border:1px solid var(--border-soft);
    color:var(--gold-bright);font-size:11px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;flex-shrink:0;white-space:nowrap;
  }
  .savebar-toggle:hover{border-color:var(--gold-bright);}
  .savebar.collapsed{padding:6px 8px;gap:0;}
  .savebar.collapsed .savebar-content{display:none;}

  /* Su smartphone il riquadro comandi non deve restare "fixed" sopra i contenuti
     durante lo scroll: torna nel normale flusso della pagina, in fondo alla scheda. */
  @media (max-width:768px){
    body{ padding-bottom:0; }
    .savebar{
      position:static;
      bottom:auto; right:auto; left:auto; top:auto;
      width:auto; max-width:none;
      margin:24px 20px 20px;
      justify-content:center;
      backdrop-filter:none;
    }
  }
  .savebar #savebar-status.warn-text{color:#ff9d90;font-weight:600;}
  @media (max-width:760px){
    .pip{width:28px;height:28px;}
    .pips{gap:8px;}
    .btn{padding:10px 14px;font-size:13px;}
    .btn.small{padding:8px 12px;}
    .tab-btn{padding:14px 15px;}
  }
  #btn-print{background:linear-gradient(180deg, #22301f, #182013);border-color:var(--good);}
  #btn-print:hover{color:#b9e0ac;}

  .divider-label{font-family:var(--serif);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);margin:22px 0 8px;text-align:center;position:relative;}
  .divider-label::before,.divider-label::after{content:"";position:absolute;top:50%;width:38%;height:1px;background:var(--border);}
  .divider-label::before{left:0;}
  .divider-label::after{right:0;}

  /* ---------- TRACCIATO DEL CAOS ---------- */
  .caos-tracker{
    display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
    background:radial-gradient(ellipse at center, rgba(148,80,216,0.10), transparent 70%);
    border:1px solid var(--border-soft);border-radius:12px;padding:18px 20px;margin-bottom:16px;
  }
  .caos-pips{display:flex;gap:8px;}
  .caos-pip{
    width:26px;height:26px;border-radius:50%;border:2px solid #9450d8;background:transparent;cursor:pointer;
    transition:background .2s, box-shadow .2s, transform .15s;
  }
  .caos-pip:hover{transform:scale(1.08);}
  .caos-pip.on{
    background:radial-gradient(circle at 35% 30%, #ff8a4a, #c9463b);
    box-shadow:0 0 12px 3px rgba(255,138,74,0.7);border-color:#ff8a4a;
  }
  .caos-word{display:flex;gap:6px;font-family:var(--serif);font-weight:700;font-size:38px;letter-spacing:2px;}
  .caos-letter{
    color:var(--border-soft);text-shadow:none;transition:color .3s, text-shadow .3s, transform .3s;
    transform:scale(0.92);
  }
  .caos-letter.lit{transform:scale(1);}
  .caos-letter.lit:nth-child(1){color:#4fd1c5;text-shadow:0 0 14px rgba(79,209,197,0.8);}
  .caos-letter.lit:nth-child(2){color:#e0a85a;text-shadow:0 0 14px rgba(224,168,90,0.8);}
  .caos-letter.lit:nth-child(3){color:#e0524a;text-shadow:0 0 14px rgba(224,82,74,0.8);}
  .caos-letter.lit:nth-child(4){color:#9450d8;text-shadow:0 0 14px rgba(148,80,216,0.8);}
  .caos-flame{font-size:32px;filter:grayscale(1) opacity(0.25);transition:filter .3s, transform .3s;}
  .caos-flame.on{filter:none;opacity:1;animation:flamepulse 1.4s infinite;}
  @keyframes flamepulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .caos-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-faint);text-align:center;margin-top:6px;}
  .caos-col{display:flex;flex-direction:column;align-items:center;}

  /* ---------- SCHERMATA DI ACCESSO ---------- */
  #lock-screen{
    position:fixed;inset:0;z-index:9999;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(148,80,216,0.12), transparent 60%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .lock-box{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-3));
    border:1px solid var(--border-soft);border-radius:12px;
    padding:32px 30px;max-width:340px;width:100%;text-align:center;
  }
  .lock-box h2{
    font-family:var(--serif);color:var(--gold-bright);text-transform:uppercase;letter-spacing:1.6px;
    font-size:20px;margin:0 0 8px;
  }
  .lock-box p{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
  .lock-box input[type=password]{
    background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text);
    border-radius:6px;padding:10px 12px;font-size:14px;width:100%;text-align:center;margin-bottom:12px;
  }
  .lock-box input:focus{outline:none;border-color:var(--gold);}
  .lock-box button{
    background:linear-gradient(180deg, #3a2a12, #241a0c);border:1px solid var(--gold);color:var(--gold-bright);
    border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;width:100%;
  }
  .lock-box button:hover{opacity:0.9;}
  .lock-error{color:#ff9d90;font-size:12px;margin-top:10px;min-height:14px;}

  /* ---------- STAMPA PULITA ---------- */
  @media print{
    @page{ margin:10mm; }
    body{ background:#fff !important; color:#111 !important; padding-bottom:0 !important; font-size:11px !important; }
    .tabbar, .savebar, .hero-hint, #hero-image-input, #import-input,
    .thumb, .thumb-placeholder, .file-btn, .img-remove, .img-row, .img-zoom, #img-lightbox,
    .inv-remove, #inv-add, #reset-slots, #reset-risorse, #lock-screen{ display:none !important; }
    .wrap{ padding:12px 0 !important; max-width:100% !important; }
    .hero{
      background:none !important; padding:2px 0 8px !important; border-bottom:2px solid #111 !important;
      cursor:default !important;
    }
    .hero::before{ display:none !important; }
    .hero-inner{ align-items:baseline !important; gap:8px !important; }
    .editable-name{ color:#000 !important; text-shadow:none !important; border:none !important; font-size:26px !important; }
    .hero-sub{ color:#444 !important; font-size:11px !important; margin-top:2px !important; }
    .hero-chip{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; backdrop-filter:none !important; padding:2px 9px !important; font-size:10.5px !important; }
    .hero-chip b{ color:#000 !important; }
    .hero-meta{ gap:6px !important; }

    .panel{ display:block !important; }
    .card, .subcard{
      background:#fff !important; border:1px solid #999 !important; box-shadow:none !important;
      page-break-inside:avoid; break-inside:avoid;
      padding:8px 10px !important; margin-bottom:6px !important; border-radius:5px !important;
    }
    .card h2{ color:#000 !important; border-bottom:1px solid #999 !important; font-size:10.5px !important; margin:0 0 6px !important; padding-bottom:3px !important; letter-spacing:.6px !important; }
    .card h2 small{ display:none !important; }
    input, textarea, select{ color:#000 !important; background:transparent !important; border:none !important; font-size:11px !important; padding:2px 3px !important; }
    .rich{ background:#fff !important; border:1px solid #ccc !important; color:#000 !important; padding:6px 8px !important; font-size:10.5px !important; line-height:1.4 !important; }
    .rich b, .rich strong{ color:#000 !important; }

    /* forza colonne compatte indipendentemente dal breakpoint a schermo */
    .grid{ gap:5px !important; }
    .grid-6{ grid-template-columns:repeat(6,1fr) !important; }
    .grid-4{ grid-template-columns:repeat(4,1fr) !important; }
    .grid-3{ grid-template-columns:repeat(3,1fr) !important; }
    .grid-2{ grid-template-columns:repeat(2,1fr) !important; }

    /* caratteristiche: molto più compatte */
    .abil-box{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .abil-box .name{ color:#000 !important; font-size:8.5px !important; letter-spacing:.3px !important; }
    .abil-box input[type=number]{
      color:#000 !important; background:transparent !important; border:none !important;
      font-size:13px !important; width:32px !important; margin:2px auto 1px !important; padding:0 !important;
    }
    .abil-box .mod{ color:#000 !important; font-size:13px !important; }

    .statpill{ background:#fff !important; border:1px solid #ccc !important; padding:4px 2px !important; }
    .statpill label{ font-size:8.5px !important; margin-bottom:2px !important; }
    .statpill input{ color:#000 !important; font-size:12px !important; }

    .save-row, .skill-row{ padding:3px 4px !important; }
    .save-row .modbadge{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; padding:2px 0 !important; }
    .skill-row input, .inv-item input, .inv-item textarea{ color:#000 !important; }
    .skill-abbr{ background:#fff !important; border:1px solid #ccc !important; color:#333 !important; font-size:9px !important; padding:1px 0 !important; }

    .hp-row{ gap:8px !important; }
    .hp-numbers input{ padding:3px 0 !important; }
    .pip{ width:15px !important; height:15px !important; border-color:#000 !important; }
    .pip.used{ background:#000 !important; box-shadow:none !important; }
    .hp-track, .inv-bar{ height:12px !important; border:1px solid #000 !important; background:#fff !important; }
    .hp-fill, .inv-bar-fill{ background:#999 !important; }

    .equip-slot{ background:#fff !important; border:1px solid #ccc !important; padding:5px 6px !important; }
    .equip-slot label{ font-size:8.5px !important; }
    .equip-slot input{ color:#000 !important; font-size:11px !important; }

    .inv-item .imgcell{ display:none !important; }
    .inv-item{ padding:4px 5px !important; }
    .tracker{ padding:5px 0 !important; }
    .slot-lvl{ padding:4px 0 !important; }

    .portraits, .portrait{ display:none !important; }
    .caos-tracker{ background:#fff !important; border:1px solid #999 !important; }
    .caos-pip{ border-color:#000 !important; }
    .caos-pip.on{ background:#000 !important; box-shadow:none !important; }
    .caos-letter{ color:#ccc !important; text-shadow:none !important; }
    .caos-letter.lit{ color:#000 !important; text-shadow:none !important; }
    .caos-flame{ display:none !important; }
    .divider-label{ color:#444 !important; margin:10px 0 6px !important; font-size:9.5px !important; }
    .divider-label::before, .divider-label::after{ background:#999 !important; }

<script>
(function(){
"use strict";

/* ============================================================
   DATI DI BASE (prima importazione dalla scheda originale)
   ============================================================ */
function slugify(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

/* Colore funzionale del "tag" di una capacit\u00e0, dedotto dal testo del tag stesso
   (non dall'array di appartenenza): Passiva = viola, Truccetto = blu, Abilit\u00e0/Incantesimo = rosso. */
function tagColorClass(tag){
  const t = String(tag || "");
  if (/^passiva/i.test(t)) return "tag-passiva";
  if (/^truccetto/i.test(t)) return "tag-truccetto";
  if (/incantesimo/i.test(t)) return "tag-incantesimo";
  if (/abilit/i.test(t)) return "tag-abilita";
  return "";
}
const ATTACCHI_LINKS = [];
function renderAttacchiNav(){
  if (!ATTACCHI_LINKS.length) return "";
  return `<div class="quicknav">${ATTACCHI_LINKS.map(l=>`<span class="quicknav-pill" data-jump-tab="${l.tab}" data-jump-anchor="${l.anchor}">${l.label}</span>`).join("")}</div>`;
}
function bindQuicknav(){
  document.querySelectorAll(".quicknav-pill").forEach(el=>{
    el.addEventListener("click", ()=> jumpToAnchor(el.dataset.jumpTab, el.dataset.jumpAnchor));
  });
}
function jumpToAnchor(tabId, anchorId){
  const btn = document.querySelector('.tab-btn[data-tab="'+tabId+'"]');
  if (btn) btn.click();
  setTimeout(()=>{
    const el = anchorId ? document.getElementById(anchorId) : null;
    const target = el || document.getElementById("panel-"+tabId);
    if (target){
      target.scrollIntoView({behavior:"smooth", block:"start"});
      if (el){
        el.classList.add("anchor-flash");
        setTimeout(()=>el.classList.remove("anchor-flash"), 1500);
      }
    }
  }, 80);
}

re magia) (L. sotto al robot) magia + meccanica ????",""]],"capacitaMax":50,"passive":[],"abilita":[],"incantesimo":[{"nome":"OBLIVION TENEBRIS","desc":"<p>La maledizione scatena un&#x27;ondata di oscurità che avvolge la vittima, paralizzandola nel suo cammino e inghiottendo ogni fonte di luce attorno a lei(psicologicamente). La persona maledetta sperimenta un senso di freddo glaciale e terrore crescente, con il suo spirito lentamente indebolito. La maledizione persiste nel tempo, con la vittima che soffre di incubi notturni e un progressivo indebolimento fisico e mentale, finché non si libera dalla maledizione o soccombe alla sua forza. La vittima perde la lucidità e diventa incapace di concentrarsi o di prendere decisioni razionali. La maledizione può portare a paranoia e follia, distorcendo la percezione della realtà. Se usata in combattimento, oltre a disorientare la vittima ne causa un\u000bdanno costante della psiche.</p><p>- Lvl 1  30 Min (fuori dal cbt)/ 1 d6 x 2 Turni, il nemico potrebbe essere disorientato</p><p>- Lvl 2  2h / 1 d6 x 4 Turni, il nemico potrebbe compie atti autolesivi</p><p>- Lvl 3  1gg / 2 d6 x 3 Turni, il nemico potrebbe attaccare i suoi alleati</p><p>- Lvl 4  3gg / 1 d6 x tutto lo scontro, il nemico potrebbe non essere più in grado di combattere</p><p>- Lvl 5  1set / 2 d6 x tutto lo scontro, il nemico potrebbe cadere in tutti gli stati precedenti</p>","hidden":false,"width":3},{"nome":"AETERNUM DECAY (Magia Proibita)","desc":"<p>Il mago invoca il potere del tempo per accelerare il processo di invecchiamento della vittima. Questo incantesimo può far invecchiare una persona in pochi istanti, riducendola a una persona decrepita e fragile, senza poter fare nulla per fermare il processo. Può essere usata solo su esseri terreni come umani, elfi, gnomi, non su angeli, demoni, costrutti etc. etc. (Se usata in combattimento causa un danno necrotico)</p><p>- Lvl 1  10 Anni (fuori dal cbt) / 1d6 danni necrotici</p><p>- Lvl 2  30 Anni / 3d6 danni necrotici con visibile invecchiamento</p><p>- Lvl 3  50 Anni / 5d6 danni necrotici con possibilità di danno permanente</p><p>- Lvl 4  80 Anni / 7d6 danni necrotici con disabilità dovute al forte e repentino invecchiamento</p><p>- Lvl 5  Morte Decadente (la vittima invecchia rapidamente e gradualmente fino alla effettiva morte CD per uccidere 18) / 9d6 con probabile perdita di arti poichè polverizzati / il mago subisce 1d6 danni necrotici a causa del forte potere oscuro utilizzato sia in cbt che non.</p>","hidden":false,"width":3},{"nome":"VITAE EXECUTIO (Magia Proibita)","desc":"<p>Il mago oscuro prosciuga l&#x27;energia vitale di un nemico, indebolendolo progressivamente fino a ridurlo a uno stato di totale esaurimento. La vittima diventa estremamente debole, con il rischio di morire se l&#x27;incantesimo non viene interrotto. Il mago può assorbire una parte dell&#x27;energia sottratta per ricaricarsi.(Gli Slot recuperati possono essere anche donati)</p><p>- Lvl 1  1d6 PF recuperati e 1d6 danni al nemico</p><p>- Lvl 2  1d6 PF recuperati e 1d6 danni al nemico e 1 solt lvl 1</p><p>- Lvl 3  2d6 PF recuperati e 2d6 danni al nemico e 2 solt lvl 1 o 1 lvl 2</p><p>- Lvl 4  25 PF recuperati e 3d6 danni al nemico e 3 solt lvl 1 o 2 lvl 2 o 1 lvl 3</p><p>- Lvl 5 40 PF recuperati e 5d6 danni al nemico e 4 solt lvl 1 o 3 lvl 2 o 2 lvl 3 o 1 lvl 4 oppure 1d6 slot per quantità e 1d6 slot per lvl (Max lvl 5) (Ogni qualvolta il pg usa questa abilità passa in rassegna 1 turno x lo sforzo)</p>","hidden":false,"width":3},{"nome":"FRIGUS MORTIS","desc":"<p>Il mago lancia un incantesimo che congela istantaneamente la vittima, bloccando le sue funzioni vitali. La persona congelata subisce danni fisici mentre il suo corpo si trasforma in una statua di ghiaccio, vulnerabile a ulteriori attacchi.</p><p>- Lvl 1   10min (fuori dal cbt)/ 1d6 danni congelanti</p><p>- Lvl 2  30min / 2d6 danni congelanti - 3 ai Tpc e - 4 mov</p><p>- Lvl 3  1h / 4d6 danni congelanti - 5 ai Tpc e - 6 mov con 50% di prob. cong.</p><p>- Lvl 4  3h / 6d6 danni congelanti, nemico congelato x 1 turno con - 5 CA (salvo casi eccezionali)</p><p>- Lvl 5  5h / 8d6 danni congelanti, nemico congelato x 3 turni con 1 d6 danni x turno - 6 CA</p>","hidden":false,"width":3},{"nome":"TEMPESTAS OBSCURIUM","desc":"<p>Il mago evoca una tempesta oscura, che può portare fulmini, tuoni e pioggia acida. La tempesta è implacabile, causando danni a tutto ciò che si trova nel suo raggio d&#x27;azione, e può essere indirizzata verso nemici specifici, creando terrore e devastazione.</p><p>- Lvl 1  1d6 fulmine, grandezza 1 casella, max 1 nemico, durata 2 turni, mov nube 5</p><p>- Lvl 2  3d6 pioggia acida, grandezza 4 caselle, max 1 nemico, durata 2 turni, mov nube 4</p><p>- Lvl 3  5d6 tempesta di fumini, grandezza 8 caselle, max 2 nemici (danni divisibili a piacimento), durata 3 turni, mov nube 3</p><p>- Lvl 4  6d6 + 2 Violenta pioggia acida e fulmini, grandezza 12 caselle, max 3 nemici (divisibili), durata 4 turni, mov nube 3</p><p>- Lvl 5 10d6 Uragano devastatore con pioggia, fulmini e forte vento, grandezza 30 caselle o anche tutto il  campo di BT (da chiedere al master), max 6 nemici (divisibili), durata 2 turni.</p>","hidden":false,"width":3},{"nome":"UMBRA FERRUM","desc":"<p>Il mago crea pugnali fatti di pura oscurità, affilati e letali. Questi pugnali non sono visibili alla vista, ma si materializzano all&#x27;interno del corpo della vittima quando il mago li scaglia contro di essa. Le ferite causate da questi strumenti non sanguinano normalmente, ma lasciano cicatrici eteree che non possono essere guarite facilmente</p><p>- Lvl 1 Piccolo Pugnale/ Lama 1d4 / durata 2 turni / 30 min</p><p>- Lvl 2 Daga o Spadino / 1d8 / 4 turni / 2h</p><p>- Lvl 3 Spada Lunga / Piccola Balestra 2d6 / 6 turni / 5h</p><p>- Lvl 4 Bastone Lamato / Balestra Grande 3d6 / 8 turni / 10h</p><p>- Lvl 5 Qualsiasi arma, la grandezza è mutabile in qualunque momento 6d6 / Fino alla fine dello scontro/ 1gg</p>","hidden":false,"width":3},{"nome":"UMBRAUM DOMINUS","desc":"<p>Il mago crea un&#x27;entità fatta di pura ombra, che obbedisce esclusivamente ai suoi ordini. Queste creature di ombra possono essere usate per attaccare, difendere o spiare, ma sono vulnerabili alla luce intensa e possono essere distrutte se il mago perde il controllo. (Magia di evocazione oscura, è necessario che vi sia oscurità). In base al livello di servitore posto sul terreno il mago avrà a disposizione meno potere magico da usufruire.</p><p>- Lvl 1 potrà lanciare incantesimi da lvl 1 a 4*</p><p>- Lvl 2 potrà lanciare incantesimi da lvl 1 a 3*</p><p>- Lvl 3 potrà lanciare incantesimi da lvl 1 a 2*</p><p>- Lvl 4 potrà lanciare incantesimi lvl 1*</p><p>- Lvl 5 non potrà lanciare incantesimi *(offensivi)*</p><p>- Lvl 1  Un piccolo servitore delle tenebre, entità spettrale, si manifesta ed eseguirà gli ordini del suo padrone fino alla morte 1d4+1 danni / mov 15 / CA 14 / 10PF (Ogni attacco causa sanguinamento x 2 turni 2 danni )</p><p>- Lvl 2  Un&#x27;entità spettrale di dimensioni leggermente più grandi, 1d8+1 danni / mov 10 / CA 15 / 20PF (Ogni attacco sanguinamento 4 turni 3 danni + Marchio Spettrale, il nemico subisce psicosi TS SAGGEZZA 16 x 4 turni)</p><p>- Lvl 3  Un&#x27;entità spettrale di medie dimensioni 1d10+1 danni / mov 8 / CA 16 / 30 PF (sanguinamento 6 turni 4 danni + Marchio Spettrale TS SAGGEZZA 17 x 5 turni + Aspirazione Vitale 2d10 PF da commutare in temporanei solo per lui)</p><p>- Lvl 4  Un&#x27;entità spettrale di dimensioni più grandi della media 3d6 danni / mov 7 / CA 17 / 40 PF (sanguinamento 8 turni 5 danni + Marchio Spettrale TS SAGGEZZA 18 x 6 turni + Aspirazione Vitale 3d10 PF da commutare in temporanei per lui o x l’evocatore + controllo nemico con tiro contrapposto su SAGGEZZA TS 18 se nemico fallisce entra e controlla x 2 turni)</p><p>- Lvl 5  Un&#x27;entità spettrale di dimensioni grandi 5d6 danni / mov 6 / CA 18 / 60 PF (sanguinamento tutto lo scontro 10 danni + Marchio Spettrale TS SAGGEZZA 20 x 8 turni + Aspirazione Vitale 4d10 PF da commutare in temporanei per lui o x l’evocatore o alleati + controllo nemico TS SAGGEZZA 19 controllo x 4 turni + attacco a distanza 1 x scontro 8d6 danni necrotici)</p>","hidden":false,"width":3},{"nome":"FULGURUM ABYSSUS","desc":"<p>Un fulmine nero e carico di energia maligna scende dal cielo o appare dalla mano del mago, colpendo un nemico con forza devastante. Il fulmine non solo causa danni fisici ma infligge anche una potente scossa elettrica che paralizza la vittima per alcuni secondi.</p><p>- Lvl 1 1d8</p><p>- Lvl 2 2d8</p><p>- Lvl 3 3d8 + 2</p><p>- Lvl 4 5d8 / paralisi x 1 turno</p><p>- Lvl 5 6d8 / danni permanenti + paralisi x 2 turni</p>","hidden":false,"width":3},{"nome":"OCCULTATIO VISUS","desc":"<p>Il mago altera la percezione visiva del mondo circostante, sottraendo alla vista sé stesso, una creatura o un oggetto. L’effetto non agisce sulla mente né crea illusioni, ma impedisce agli occhi di percepire il bersaglio, rendendolo invisibile.\u000b L’incantesimo può essere lanciato sull’incantatore o su un altro bersaglio; gli oggetti indossati o trasportati al momento del lancio diventano invisibili insieme ad esso. Oggetti separati successivamente possono perdere l’effetto, a discrezione del DM. L’invisibilità può terminare anticipatamente se il bersaglio compie azioni apertamente ostili o interazioni violente dirette.</p><p>- Lvl 1 Invisibilità singolo bersaglio / 2 turni / 20 min</p><p>- Lvl 2 Invisibilità singolo bersaglio / 4 turni / 1h</p><p>- Lvl 3 Invisibilità singolo bersaglio / 6 turni / 2h</p><p>- Lvl 4 Invisibilità avanzata / 10 turni / 4h</p><p>- Lvl 5 Invisibilità totale / Fino alla fine dello scontro / 1gg</p>","hidden":false,"width":3},{"nome":"INFERNUM IGNIS","desc":"<p>Il mago evoca una gigantesca palla di fuoco infernale, che esplode al contatto con il nemico o il terreno, causando un&#x27;onda di calore e fiamme che consumano tutto ciò che colpisce. I danni sono estesi e l&#x27;esplosione lascia il terreno bruciato e infernale.</p><p>- Lvl 1 1d10</p><p>- Lvl 2 2d10</p><p>- Lvl 3 3d10</p><p>- Lvl 4 5d10</p><p>- Lvl 5 6d10</p>","hidden":false,"width":3}],"divergenzaIntro":"","ambiti":[],"campiAttiva":[],"divergenzaAttivaNote":"","divergenzaPassiva":"","trucchetti":[],"descrizione":{"eta":"300","altezza":"1,75","peso":"80kg","occhi":"VIOLA","capelli":"X","colorePersonaggio":"SQUAME NERE"},"backstory":"<p>Vorkax è un Dragonide, razza conosciuta per l'innata predisposizione alla magia. Nasce sull'Isola di Axel, dove studia a lungo al fianco di Gorarakas Oldras, uno dei massimi esponenti dell'epoca. La sua storia ha origine quasi 4.000 anni prima dei giocatori: l'ossessione crescente per la magia e la ricerca continua di potere spingono Gorarakas e il Consiglio Superiore della Magia, composto da dieci membri, a rinchiuderlo in una prigione magica nella quale tempo e spazio sono astratti. Vorkax rimane così imprigionato per millenni senza subire il normale trascorrere del tempo, conservando un'età biologica di circa 300 anni, pur appartenendo cronologicamente a un'epoca distante oltre quattro millenni. Ai giorni nostri riesce infine a liberarsi sprigionando la magia e la forza accumulate durante la prigionia, facendo così la conoscenza dei giocatori. Sul corpo possiede incisioni in antica lingua draconica, cicatrizzate e di colore viola fluorescente: Vorkax ripudia infatti catalizzatori come bastoni magici o tomi e preferisce incidere indelebilmente sul proprio corpo ciò che gli serve per utilizzare la magia.</p>","lore":[],"portraits":[{"img":"assets/characters/vorkax-1.webp","cap":"VORKAX","h":null},{"img":"assets/characters/vorkax-2.webp","cap":"VORKAX · Ritratto 2","h":null}],"noteGenerali":"","diarioEntries":[],"evoluzioniFuturi":[],"fonteOriginale":"VORKAX\r\n\r\n\r\nSCHEDA PG\r\n\tNOME PERSONAGGIO \r\n\r\n\r\n\r\n\r\n\r\n\r\nVorkax Apor\r\n\tCLASSE E LIVELLO\r\n\r\n\r\nMAGO  7\r\n\tBACKGROUND\r\n\r\n\r\nASSETATO DI CONOSCENZA \r\n\r\n\r\n\tNOME GIOCATORE\r\n\r\n\r\nJigen\r\n\r\n\r\n\tRAZZA\r\n\r\n\r\nDRAGONIDE\r\n\r\n\r\n\tALLINEAMENTO\r\n\r\n\r\nCAOTICO MALVAGIO\r\n\r\n\r\n\tALTRO\r\n\r\n\r\nPG VIAGGIATORE\r\n\t\r\n\r\n\r\n\r\nFORZA\r\n\r\n\r\n14\r\n\r\n\r\n(+2)\r\n\t\r\n\r\n(X)  ISPIRAZIONE\r\n(DI FATTI NON LA UTILIZZIAMO SCRIVETECI QUELLO CHE VOLETE)\r\n\tCA\r\n\r\n\r\n16\r\n\tINIZIATIVA\r\n\r\n\r\n8\r\n\t    VELOCITÀ\r\n\r\n\r\n7\r\n\tSLOT E UTILIZZABILI\r\n\t1\r\n\t2\r\n\t3\r\n\t4\r\n\t5\r\n\t6\r\n\t* * * * * * \r\n\r\n\t* a\r\n* a\r\n* a\r\n* a\r\n* a\r\n\t* a\r\n* l\r\n* l\r\n* \t* a\r\n* a\r\n* a\r\n\r\n\r\n\t* a\r\n* \t* \t\r\n\r\n(+3)  BONUS COMPETENZA\r\n\tDESTREZZA\r\n\r\n\r\n14\r\n\r\n\r\n(+2)\r\n\t   PUNTI FERITA         ATTUALI\r\n\r\n\r\n[ 68 ]       68\r\n\tPUNTI FERITA TEMPORANEI\r\n\r\n\r\n0\r\n\tCOSTITUZIONE\r\n\r\n\r\n13\r\n\r\n\r\n(+1)\r\n\tTIRI SALVEZZA\r\n\r\n\r\n[X] INTELLIGENZA \r\n[X] SAGGEZZA \r\n\tDADO VITA\r\n\r\n\r\n1D8\r\n\tTS CONTRO MORTE\r\n\r\n\r\n* SUCCESSI    (3)\r\n* FALLIMENTI  (3)\r\n\tINTELLIGENZA\r\n\r\n\r\n18\r\n\r\n\r\n(+4)\r\n\tABILITA’\r\n\r\n\r\n[ 0 ]  ACROBAZIA (DES)\r\n[ 0 ]  ADD.ANIMALI (SAG)\r\n[ 8 ]  ARCANO (INT)\r\n[ 0 ] ATLETICA (FOR)\r\n[ 0 ]  FURTIVITA’ (DES)\r\n[ 6 ]  INDAGARE (INT)\r\n[ 0 ]  INGANNO (CAR)\r\n[ 5 ]  INTIMIDIRE (CAR)\r\n[ 0 ]  INTRATTENERE (CAR)\r\n[ 0 ]  INTUIZIONE (SAG)\r\n[ 0 ]  MEDICINA (SAG)\r\n[ 5 ]  NATURA (INT)\r\n[ 0 ]  PERCEZIONE (SAG)\r\n[ 0 ]  PERSUASIONE (CAR)\r\n[ 0 ]  RAPID. DI MANO (DES)\r\n[ 5 ]  RELIGIONE (INT)\r\n[ 0 ]  SOPRAVVIVENZA (SAG)\r\n[ 5 ]  STORIA (INT)\r\n\tATTACCHI & INCANTESIMI DI PRIMA UTILITA’\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n2 x Morso (Max 2)\r\n2 x Ruggito di Fuoco (Max 2)\r\n2 x Difesa Veste Multiparticellare (Max 2)\r\n3 x Abilità Veste Multiparticellare  (Max 3)\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\tSAGGEZZA\r\n\r\n\r\n13\r\n\r\n\r\n(+1)\r\n\tCARISMA\r\n\r\n\r\n9\r\n\r\n\r\n(-1)\r\n\t16 (+3)  SAGGEZZA (PERCEZIONE) PASSIVA\r\n\t    \r\nDESCRIZIONE PG\r\n\tETA’\r\n\r\n\r\n300\r\n\r\n\r\n\tALTEZZA\r\n\r\n\r\n1,75\r\n\tPESO\r\n\r\n\r\n80kg\r\n\tOCCHI\r\n\r\n\r\nVIOLA\r\n\r\n\r\n\tCARNAGIONE\r\n\r\n\r\nSQUAME NERE\r\n\r\n\r\n\tCAPELLI\r\n\r\n\r\nX\r\n\tIMMAGINE 1\r\n\tIMMAGINE 2\r\n\t  \r\n\r\n\t  \r\n\r\n\tUTILI\r\n\r\n\r\nConoscenza della lingua Dragonide antica ossia lo SPAGNOLO STERSTEROTIPATO, per parlarlo bisognerà aggiungere la S alla fine di ogni parola(Vorkax parla la lingua comune ma lo spagnolo steroetipato è la sua lingua madre);\r\n\r\n\r\nUna volta al giorno per 2h o 3 turni il PG essendo dragonide ha la capacità di aumentare temporaneamente il suo intelletto + 2 su INTELLIGENZA;\r\n\r\n\r\nIl PG potrà usufruire di diversi slot, suddivisi in livelli esclusivamente per abilità ATTIVE, il restante, verrà contrassegnato come TRUCCHETTO. I trucchetti avranno CD proprie ed avranno degli utilizzi limitati nell'arco della giornata (riposo lungo). I tiri delle abilità verranno effettuati esclusivamente su due Macro Categorie, MAGIA con CD 16 che scaleranno su INTELLIGENZA.\r\n\tSTORIA\r\nVorkax è un Dragonide, razza conosciuta per l'innata predisposizione alla magia. Nasce sull'Isola di Axel, dove studia a lungo al fianco di Gorarakas Oldras, uno dei massimi esponenti dell'epoca. La sua storia ha origine quasi 4.000 anni prima dei giocatori: l'ossessione crescente per la magia e la ricerca continua di potere spingono Gorarakas e il Consiglio Superiore della Magia, composto da dieci membri, a rinchiuderlo in una prigione magica nella quale tempo e spazio sono astratti. Vorkax rimane così imprigionato per millenni senza subire il normale trascorrere del tempo, conservando un'età biologica di circa 300 anni, pur appartenendo cronologicamente a un'epoca distante oltre quattro millenni. Ai giorni nostri riesce infine a liberarsi sprigionando la magia e la forza accumulate durante la prigionia, facendo così la conoscenza dei giocatori. Sul corpo possiede incisioni in antica lingua draconica, cicatrizzate e di colore viola fluorescente: Vorkax ripudia infatti catalizzatori come bastoni magici o tomi e preferisce incidere indelebilmente sul proprio corpo ciò che gli serve per utilizzare la magia.\r\n\t\r\n\r\nEQUIPAGGIAMENTO\r\n\tTESTA\r\n\r\n\r\nX\r\n\tBUSTO\r\n\r\n\r\nVESTE MULTIPARTICELLARE\r\n\tGAMBE\r\n\r\n\r\nVESTE MULTIPARTICELLARE\r\n\tARMA 1\r\n\r\n\r\nANELLO DI TANURIS\r\n\tARMA 2\r\n\r\n\r\nX\r\n\tALTR0O\r\n\r\n\r\nX\r\n\tARTEFATTO 1\r\n\r\n\r\nX\r\n\tARTEFATTO 2\r\n\r\n\r\nX\r\n\r\n\r\n\r\n\r\n\tARTEFATTO 3\r\n\r\n\r\nX\r\n\t\r\n\r\nANELLO DI TANURIS : Un anello d’oro lucido con un simbolo inciso che raffigura un occhio chiuso. Quando viene attivato, il simbolo si apre, rivelando una fessura scura da cui emana una forza invisibile. Il portatore può puntare un nemico e marchiarlo con un giudizio implacabile. Una forza invisibile schiaccia l’essenza del bersaglio, selezionando un bersaglio visibile entro 15 caselle/15mt. Il bersaglio deve effettuare un tiro salvezza su Carisma (CD 15). Se fallisce subisce 7d6 danni psichici e ottiene lo stato maledetto per 3 turni. Mentre è maledetto, subisce 1d6 danni psichici aggiuntivi ogni volta che effettua un tiro di qualsiasi tipo. Se supera il tiro salvezza subisce comunque metà dei danni iniziali (3d6 + 2 danni psichici) e non viene maledetto. L’abilità può essere usata due volte ogni riposo lungo, poiché richiede un grande sforzo mentale. A causa di tale sforzo, l'anello possiede la capacità di emanare un  colpo di energia dal colore violaceo, questo non richiede nessuno slot. Danni 6d6 + 4 danni, lo stesso può essere suddiviso in due colpi con 3d6 + 2 a colpo(effettuando il TPC rispettivamente per ogni attacco). + 1 CA\r\n\r\n\r\nVESTE MULTIPARTICELLARE : L'abito è un'opera d'arte magica, realizzato con un tessuto che sembra intrecciato con fili di luce e ombra. La stoffa cambia leggermente colore a seconda del possessore. Se un attacco sta per colpire l'indossatore, il tessuto si irrigidisce istantaneamente in quel punto, riducendo il danno. Questa capacità può bloccare fino a 2 attacchi ogni riposo lungo, se inferiori a Max 30 danni, in caso superiore parte del danno verrà assorbito, ma l'utilizzatore verrà ugualmente colpito. Quando un attacco magico colpisce l'indossatore, l'abito ha il 50% di possibilità di riflettere l'incantesimo verso l'attaccante.(Tirando una moneta) Max 3 ogni riposo lungo.\r\nSe danneggiato, l'abito si rigenera da solo, cucendo le lacerazioni in pochi minuti. L'abito si adatta a condizioni estreme, fornendo resistenza al caldo e al freddo, non necessitando di altri indumenti. + 3 CA\r\n\r\n\r\n\r\n\r\n\t\r\n\r\n                                                                                                                \r\nINVENTARIO\r\n\tTotale massimo trasportabile 50P\r\n\t* POZIONE RIVITALIZZANTE x 2 Consente di recuperare 15 PF. 2P \r\n* POZIONE DI ENERGIA x 2 Consente di recuperare 3 slot lvl 1 o 2 lvl 2 o 1 lvl 3. 2P \r\n* AMULETO D’ARGENTO  Un piccolo oggetto incantato che nasconde una magia di teletrasporto, qualora il PG dovesse essere in reale pericolo di morte si attiverebbe in automatico per trasportarlo nella sua prigione temporale prima del previsto (avvisare il master). 2P\r\n* PUGNALE CERIMONIALE Una lama sottile e affilata, usata per rituali, incisioni di simboli magici o autodifesa 1d4.(Vorkax lo usa per incidersi il corpo di magie). 2P\r\n* CORDA INCANTATA Una corda leggera ma magica che può allungarsi, agganciarsi o immobilizzare un nemico con un comando. x 10 MT.  5P\r\n* PIETRA DEL RICHIAMO un oggetto che consente di tracciare il possessore, velato da una micro magia di elusione (PIETRA DEL LADRO una pietra che conferisce al suo possessore la possibilità di segnare diversi oggetti come se fosse un gesso, così da sentirne la presenza qualora si dovessero allontanare ex ladri o perdite involontarie, conferisce un + 1 su furtività e Acrobazia) 1P\r\n* PEZZO DI ASTROFILITE 2P (Cristallo usato per assorbire magia) (L. sotto al robot) magia + meccanica ????\r\n \r\n\r\n\r\n\tTOT 16P/50P\r\n\t\r\n\r\n\r\n\r\nABILITÀ  & TRUCCHETTI & INCANTESIMI\r\n\tOBLIVION TENEBRIS\r\nINCANTESIMO\r\nLa maledizione scatena un'ondata di oscurità che avvolge la vittima, paralizzandola nel suo cammino e inghiottendo ogni fonte di luce attorno a lei(psicologicamente). La persona maledetta sperimenta un senso di freddo glaciale e terrore crescente, con il suo spirito lentamente indebolito. La maledizione persiste nel tempo, con la vittima che soffre di incubi notturni e un progressivo indebolimento fisico e mentale, finché non si libera dalla maledizione o soccombe alla sua forza. La vittima perde la lucidità e diventa incapace di concentrarsi o di prendere decisioni razionali. La maledizione può portare a paranoia e follia, distorcendo la percezione della realtà. Se usata in combattimento, oltre a disorientare la vittima ne causa un\r\ndanno costante della psiche. \r\n\t- Lvl 1  30 Min (fuori dal cbt)/ 1 d6 x 2 Turni, il nemico potrebbe essere disorientato\r\n- Lvl 2  2h / 1 d6 x 4 Turni, il nemico potrebbe compie atti autolesivi\r\n- Lvl 3  1gg / 2 d6 x 3 Turni, il nemico potrebbe attaccare i suoi alleati\r\n- Lvl 4  3gg / 1 d6 x tutto lo scontro, il nemico potrebbe non essere più in grado di combattere\r\n- Lvl 5  1set / 2 d6 x tutto lo scontro, il nemico potrebbe cadere in tutti gli stati precedenti\r\n\tAETERNUM DECAY (Magia Proibita)\r\nINCANTESIMO\r\nIl mago invoca il potere del tempo per accelerare il processo di invecchiamento della vittima. Questo incantesimo può far invecchiare una persona in pochi istanti, riducendola a una persona decrepita e fragile, senza poter fare nulla per fermare il processo. Può essere usata solo su esseri terreni come umani, elfi, gnomi, non su angeli, demoni, costrutti etc. etc. (Se usata in combattimento causa un danno necrotico)\r\n\t- Lvl 1  10 Anni (fuori dal cbt) / 1d6 danni necrotici \r\n- Lvl 2  30 Anni / 3d6 danni necrotici con visibile invecchiamento\r\n- Lvl 3  50 Anni / 5d6 danni necrotici con possibilità di danno permanente\r\n- Lvl 4  80 Anni / 7d6 danni necrotici con disabilità dovute al forte e repentino invecchiamento \r\n- Lvl 5  Morte Decadente (la vittima invecchia rapidamente e gradualmente fino alla effettiva morte CD per uccidere 18) / 9d6 con probabile perdita di arti poichè polverizzati / il mago subisce 1d6 danni necrotici a causa del forte potere oscuro utilizzato sia in cbt che non.\r\n\tVITAE EXECUTIO (Magia Proibita)\r\nINCANTESIMO\r\nIl mago oscuro prosciuga l'energia vitale di un nemico, indebolendolo progressivamente fino a ridurlo a uno stato di totale esaurimento. La vittima diventa estremamente debole, con il rischio di morire se l'incantesimo non viene interrotto. Il mago può assorbire una parte dell'energia sottratta per ricaricarsi.(Gli Slot recuperati possono essere anche donati)\r\n\t- Lvl 1  1d6 PF recuperati e 1d6 danni al nemico\r\n- Lvl 2  1d6 PF recuperati e 1d6 danni al nemico e 1 solt lvl 1 \r\n- Lvl 3  2d6 PF recuperati e 2d6 danni al nemico e 2 solt lvl 1 o 1 lvl 2\r\n- Lvl 4  25 PF recuperati e 3d6 danni al nemico e 3 solt lvl 1 o 2 lvl 2 o 1 lvl 3\r\n- Lvl 5 40 PF recuperati e 5d6 danni al nemico e 4 solt lvl 1 o 3 lvl 2 o 2 lvl 3 o 1 lvl 4 oppure 1d6 slot per quantità e 1d6 slot per lvl (Max lvl 5) (Ogni qualvolta il pg usa questa abilità passa in rassegna 1 turno x lo sforzo)\r\n\t\r\n\r\nFRIGUS MORTIS \r\nINCANTESIMO\r\nIl mago lancia un incantesimo che congela istantaneamente la vittima, bloccando le sue funzioni vitali. La persona congelata subisce danni fisici mentre il suo corpo si trasforma in una statua di ghiaccio, vulnerabile a ulteriori attacchi. \r\n\t- Lvl 1   10min (fuori dal cbt)/ 1d6 danni congelanti\r\n- Lvl 2  30min / 2d6 danni congelanti - 3 ai Tpc e - 4 mov\r\n- Lvl 3  1h / 4d6 danni congelanti - 5 ai Tpc e - 6 mov con 50% di prob. cong.\r\n- Lvl 4  3h / 6d6 danni congelanti, nemico congelato x 1 turno con - 5 CA (salvo casi eccezionali)\r\n- Lvl 5  5h / 8d6 danni congelanti, nemico congelato x 3 turni con 1 d6 danni x turno - 6 CA\r\n\tTEMPESTAS OBSCURIUM\r\nINCANTESIMO\r\nIl mago evoca una tempesta oscura, che può portare fulmini, tuoni e pioggia acida. La tempesta è implacabile, causando danni a tutto ciò che si trova nel suo raggio d'azione, e può essere indirizzata verso nemici specifici, creando terrore e devastazione.\r\n\t- Lvl 1  1d6 fulmine, grandezza 1 casella, max 1 nemico, durata 2 turni, mov nube 5  \r\n- Lvl 2  3d6 pioggia acida, grandezza 4 caselle, max 1 nemico, durata 2 turni, mov nube 4 \r\n- Lvl 3  5d6 tempesta di fumini, grandezza 8 caselle, max 2 nemici (danni divisibili a piacimento), durata 3 turni, mov nube 3 \r\n- Lvl 4  6d6 + 2 Violenta pioggia acida e fulmini, grandezza 12 caselle, max 3 nemici (divisibili), durata 4 turni, mov nube 3\r\n- Lvl 5 10d6 Uragano devastatore con pioggia, fulmini e forte vento, grandezza 30 caselle o anche tutto il  campo di BT (da chiedere al master), max 6 nemici (divisibili), durata 2 turni.\r\n\tUMBRA FERRUM\r\nINCANTESIMO\r\nIl mago crea pugnali fatti di pura oscurità, affilati e letali. Questi pugnali non sono visibili alla vista, ma si materializzano all'interno del corpo della vittima quando il mago li scaglia contro di essa. Le ferite causate da questi strumenti non sanguinano normalmente, ma lasciano cicatrici eteree che non possono essere guarite facilmente\r\n\t\r\n\r\n- Lvl 1 Piccolo Pugnale/ Lama 1d4 / durata 2 turni / 30 min\r\n- Lvl 2 Daga o Spadino / 1d8 / 4 turni / 2h\r\n- Lvl 3 Spada Lunga / Piccola Balestra 2d6 / 6 turni / 5h\r\n- Lvl 4 Bastone Lamato / Balestra Grande 3d6 / 8 turni / 10h\r\n- Lvl 5 Qualsiasi arma, la grandezza è mutabile in qualunque momento 6d6 / Fino alla fine dello scontro/ 1gg\r\n\r\n\r\n\t\r\n\r\nUMBRAUM DOMINUS\r\nINCANTESIMO\r\n\r\n\r\nIl mago crea un'entità fatta di pura ombra, che obbedisce esclusivamente ai suoi ordini. Queste creature di ombra possono essere usate per attaccare, difendere o spiare, ma sono vulnerabili alla luce intensa e possono essere distrutte se il mago perde il controllo. (Magia di evocazione oscura, è necessario che vi sia oscurità). In base al livello di servitore posto sul terreno il mago avrà a disposizione meno potere magico da usufruire. \r\n\r\n\r\n- Lvl 1 potrà lanciare incantesimi da lvl 1 a 4*\r\n\r\n\r\n- Lvl 2 potrà lanciare incantesimi da lvl 1 a 3*\r\n\r\n\r\n- Lvl 3 potrà lanciare incantesimi da lvl 1 a 2*\r\n\r\n\r\n- Lvl 4 potrà lanciare incantesimi lvl 1*\r\n\r\n\r\n- Lvl 5 non potrà lanciare incantesimi *(offensivi)*\r\n\t- Lvl 1  Un piccolo servitore delle tenebre, entità spettrale, si manifesta ed eseguirà gli ordini del suo padrone fino alla morte 1d4+1 danni / mov 15 / CA 14 / 10PF (Ogni attacco causa sanguinamento x 2 turni 2 danni )\r\n\r\n\r\n- Lvl 2  Un'entità spettrale di dimensioni leggermente più grandi, 1d8+1 danni / mov 10 / CA 15 / 20PF (Ogni attacco sanguinamento 4 turni 3 danni + Marchio Spettrale, il nemico subisce psicosi TS SAGGEZZA 16 x 4 turni)\r\n\r\n\r\n- Lvl 3  Un'entità spettrale di medie dimensioni 1d10+1 danni / mov 8 / CA 16 / 30 PF (sanguinamento 6 turni 4 danni + Marchio Spettrale TS SAGGEZZA 17 x 5 turni + Aspirazione Vitale 2d10 PF da commutare in temporanei solo per lui)\r\n\r\n\r\n- Lvl 4  Un'entità spettrale di dimensioni più grandi della media 3d6 danni / mov 7 / CA 17 / 40 PF (sanguinamento 8 turni 5 danni + Marchio Spettrale TS SAGGEZZA 18 x 6 turni + Aspirazione Vitale 3d10 PF da commutare in temporanei per lui o x l’evocatore + controllo nemico con tiro contrapposto su SAGGEZZA TS 18 se nemico fallisce entra e controlla x 2 turni)\r\n\r\n\r\n- Lvl 5  Un'entità spettrale di dimensioni grandi 5d6 danni / mov 6 / CA 18 / 60 PF (sanguinamento tutto lo scontro 10 danni + Marchio Spettrale TS SAGGEZZA 20 x 8 turni + Aspirazione Vitale 4d10 PF da commutare in temporanei per lui o x l’evocatore o alleati + controllo nemico TS SAGGEZZA 19 controllo x 4 turni + attacco a distanza 1 x scontro 8d6 danni necrotici)\r\n\tFULGURUM ABYSSUS\r\nINCANTESIMO\r\nUn fulmine nero e carico di energia maligna scende dal cielo o appare dalla mano del mago, colpendo un nemico con forza devastante. Il fulmine non solo causa danni fisici ma infligge anche una potente scossa elettrica che paralizza la vittima per alcuni secondi.\r\n\t\r\n\r\n- Lvl 1 1d8 \r\n- Lvl 2 2d8\r\n- Lvl 3 3d8 + 2 \r\n- Lvl 4 5d8 / paralisi x 1 turno \r\n- Lvl 5 6d8 / danni permanenti + paralisi x 2 turni\r\n\r\n\r\n\t        \r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nOCCULTATIO VISUS\r\n\r\n\r\nINCANTESIMO\r\nIl mago altera la percezione visiva del mondo circostante, sottraendo alla vista sé stesso, una creatura o un oggetto. L’effetto non agisce sulla mente né crea illusioni, ma impedisce agli occhi di percepire il bersaglio, rendendolo invisibile.\r\nL’incantesimo può essere lanciato sull’incantatore o su un altro bersaglio; gli oggetti indossati o trasportati al momento del lancio diventano invisibili insieme ad esso. Oggetti separati successivamente possono perdere l’effetto, a discrezione del DM. L’invisibilità può terminare anticipatamente se il bersaglio compie azioni apertamente ostili o interazioni violente dirette.\r\n\t\r\n\r\n- Lvl 1 Invisibilità singolo bersaglio / 2 turni / 20 min\r\n- Lvl 2 Invisibilità singolo bersaglio / 4 turni / 1h\r\n- Lvl 3 Invisibilità singolo bersaglio / 6 turni / 2h\r\n- Lvl 4 Invisibilità avanzata / 10 turni / 4h\r\n- Lvl 5 Invisibilità totale / Fino alla fine dello scontro / 1gg\r\n\tINFERNUM IGNIS\r\nINCANTESIMO\r\nIl mago evoca una gigantesca palla di fuoco infernale, che esplode al contatto con il nemico o il terreno, causando un'onda di calore e fiamme che consumano tutto ciò che colpisce. I danni sono estesi e l'esplosione lascia il terreno bruciato e infernale.\r\n\t- Lvl 1 1d10\r\n- Lvl 2 2d10\r\n- Lvl 3 3d10 \r\n- Lvl 4 5d10 \r\n- Lvl 5 6d10\r\n\tMORSO\r\nTRUCCHETTO\r\nIl pg grazie alla sua razza dragonide possiede denti aguzzi e artigli affilati, utili in combattimento in caso di estrema necessità 2d6 danni + 1d6 x 2 turni sanguinamento (due ogni riposo lungo)\r\n\tRUGGITO DEL DRAGO DI FUOCO\r\nTRUCCHETTO\r\nIl pg grazie alla sua razza dragonide ha la facoltà di sputare fuoco di color violaceo dalla bocca, proprio come nelle leggende dei draghi, danni 2d6, può essere usato in combo con morso senza sprecare un attacco  (due ogni riposo lungo). \r\n\t\r\n\r\n\t\r\n\r\n\t\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nRUNE NANICHE\r\n\r\n\r\nSIGILLO\r\nIl mago utilizza l’antico linguaggio runico nanico per incidere o evocare rune visibili che agiscono esclusivamente sulla materia. Le rune naniche non influenzano mente, anima o spirito, ma impongono alla realtà un comportamento fisico preciso. Ogni runa lascia sempre un segno visibile: la runa stessa. Le rune possono essere applicate in tre modalità: permanente, temporanea o istantanea, a discrezione dell’utilizzatore. Le rune permanenti vengono fissate su oggetti, armi, armature, strutture o superfici e occupano uno slot del relativo livello, restando attive finché l’oggetto non viene distrutto o la runa non viene annullata o disincantata da un potere di pari livello o superiore. Le rune temporanee producono il loro effetto per una durata limitata senza occupare slot permanenti; tuttavia, se tutti gli slot di rune permanenti risultano occupati, le rune temporanee non possono essere utilizzate. In tal caso, l’unica modalità disponibile è quella istantanea, che produce l’effetto e si dissolve immediatamente. La potenza, l’estensione, la durata e la complessità degli effetti dipendono dal livello della runa utilizzata e dalla modalità di applicazione scelta dall’utilizzatore.\r\n\r\n\r\nPotere Elementale : Le rune permettono di incanalare, stabilizzare o modificare energie elementali all’interno della materia (fuoco, ghiaccio, fulmine, aria, acqua, terra, vibrazione, pressione, calore, freddo, elettricità statica).\r\nStruttura e Resistenza : Le rune agiscono sulla consistenza fisica degli oggetti e delle strutture, modificandone le proprietà meccaniche (indurimento, elasticità controllata, aumento o riduzione della densità, resistenza a urti, fratture, corrosione, temperature estreme).\r\nIntegrità e Conservazione : Le rune preservano la materia nel tempo o ne ripristinano la funzionalità (anti-deperimento, autoriparazione, riparazione progressiva, mantenimento della forma originale, stabilizzazione di ingranaggi e manufatti).\r\nVincolo, Bloccaggio e Sbloccaggio : Le rune impongono o rimuovono limitazioni fisiche all’uso, al movimento o all’accesso, agendo direttamente sulla materia (serrature runiche, barriere materiali, porte o forzieri invalicabili, meccanismi che rifiutano l’apertura o l’attivazione non autorizzata, apertura forzata di strutture sigillate, sbloccaggio di chiusure complesse, disattivazione o sovrascrittura di vincoli materiali preesistenti).\r\nFunzione e Movimento Meccanico : Le rune conferiscono o alterano funzioni operative di oggetti e strutture (movimento autonomo, apertura e chiusura controllata, articolazioni, rotazioni, scatti meccanici, adattamento dinamico delle parti).\r\nForma e Modellazione della Materia : Le rune permettono di modellare, assemblare o far emergere la materia grezza (costruzione di strutture, sollevamento di terra o pietra, compattazione, fusione, assemblaggio o riassemblaggio di parti).\r\nEspansione e Manifestazione Strutturale : Le rune consentono a un oggetto o a una struttura di esprimere una forma più complessa o completa quando necessario (armature che si auto-costruiscono, strutture che emergono dal suolo, componenti che si dispiegano o si ritraggono).\r\nInterazione Forzata con l’Ambiente : Le rune modificano il modo in cui un oggetto o una struttura reagisce al contatto con ciò che lo circonda (assorbimento o rilascio di energia cinetica, deviazione di colpi, trasferimento di forza, ancoraggio al terreno).\r\nRune utilizzate :   Livello 1 — 6/6   Livello 2 — 5/5  Livello 3 — 4/4  Livello 4 — 3/3  Livello 5 — 2/2\r\n\t\r\n\r\n\r\n\r\nAPPUNTI SUI GIOCATORI \r\n\tLUX \r\nNo umano, ha oggetti magici: corona, ciondolo, bracciale, bastone.\r\nEsaminati:\r\n* Ciondolo lux, potenzia delle caratteristiche base, un qualcosa che a me non interessa\r\n\tERVORK - (RUST)\r\nDemone superiore discendente del dio della morte. Avrà fatto qualche patto? QUALE? Posso approfittare? ehhee . In ogni caso è CATTIVO (detto da OLA). Potrebbe andare a mio vantaggio, in fondo è un discendente di un Dio.\r\n\r\n\r\nProva rancore verso Malakit . ervork Ha una bussola interessante indica il luogo dove vuoi effettivamente andare \r\n\r\n\r\nTULIO^? \r\n\r\n\r\n\tOLA\r\nSprigiona energia e mi attira come se fosse lui stesso magico. Presentimento troppo improbabile, ma devo indagare.  \r\nC’entra con qualcosa che potrebbe racchiudere la parola “SIMIC” \r\n\tKATAN \r\nHa la spada con incantesimo detto Anima di ra, evoca un fuoco particolare (io la userei per fare danno) e intuisco che potrei apprendere una magia da quest’arma o copiarne l’effetto, MA dovrei averla con me per un TOT di tempo\r\nMetallo alluvionale astrale . Interessante potrei imparare un incantesimo potente al livello di OLA? è da provare\r\n\t\r\n\r\n\r\n\r\nNOTE\r\n\tDall’ultima sessione sono OSSESSIONATO da OLA e dalla magia che emana. è stato creato da qualcosa? Esiste un mago più forte di me??? assurdo.\r\nOSSESSIONATO a livelli mai raggiunti in 4000 anni. Ha imparato la mia lingua al solo tocco del mio petto, cos’altro sa fare? è magia pura. Lui sa di esserlo? \r\nObiettivi che vorrei raggiungere da ora in poi: \r\n- Trovare chi l’ha creato\r\n- Imparare incantesimi di quel livello \r\n- Imparare o conoscere come ricreare QUELLA magia \r\n- Voglio arrivare al livello dei creatori\r\n- Voglio studiare tutto il possibile su di lui e incidere il mio corpo con incantesimi potenti \r\n- Spingerlo a parlare, magari sa qualcosa \r\n\r\n\r\n* Sto studiando le rune naniche\r\nLoham dove c’è ares rifugiato, 3 chiavi nascoste in mini // Salva il token in sessionStorage così che, navigando dalla Home a una scheda
// (o da una scheda all'altra) nella stessa scheda del browser, l'accesso a Google
// resti attivo senza doverlo rifare ogni volta.
function saveGoogleTokenToSession(token, expiresInSeconds){
  try{
    sessionStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY, JSON.stringify({
      token: token,
      expiresAt: Date.now() + (Number(expiresInSeconds || 0) * 1000)
    }));
  }catch(e){}
}

function loadGoogleTokenFromSession(){
  try{
    const raw = sessionStorage.getItem(GOOGLE_TOKEN_STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.token || !data.expiresAt) return null;
    if (Date.now() > data.expiresAt - 60000) return null; // margine di sicurezza di 60s
    return data.token;
  }catch(e){ return null; }
}

let googleTokenClient = null;
