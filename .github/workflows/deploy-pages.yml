name: Deploy Morgedal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          MORGEDAL_PICKER_API_KEY: ${{ secrets.MORGEDAL_PICKER_API_KEY }}
        run: |
          test -n "$MORGEDAL_PICKER_API_KEY" || { echo "Missing MORGEDAL_PICKER_API_KEY environment secret"; exit 1; }
          python3 build_vercel.py
          test -f dist/index.html
          test -f dist/tinyfish-access.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "dist"

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
