name: Deploy Morgedal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          MORGEDAL_PICKER_API_KEY: ${{ secrets.MORGEDAL_PICKER_API_KEY }}
        run: |
          test -n "$MORGEDAL_PICKER_API_KEY" || { echo "Missing MORGEDAL_PICKER_API_KEY environment secret"; exit 1; }
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("_site/index.html")
          s = p.read_text(encoding="utf-8")
          key = os.environ["MORGEDAL_PICKER_API_KEY"]
          marker = "__MORGEDAL_PICKER_API_KEY__"
          if marker not in s:
              raise SystemExit("Picker key marker not found")
          p.write_text(s.replace(marker, key), encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
