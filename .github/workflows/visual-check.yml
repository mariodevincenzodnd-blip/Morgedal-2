name: Visual check Morgedal

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "*_Scheda_Interattiva.html"
      - ".github/scripts/visual-check.mjs"
      - ".github/workflows/visual-check.yml"
      - "build_vercel.py"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "*_Scheda_Interattiva.html"
      - ".github/scripts/visual-check.mjs"
      - ".github/workflows/visual-check.yml"
      - "build_vercel.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
    inputs:
      page:
        description: "Pagina da controllare (es. Bull_Scheda_Interattiva.html)"
        required: false
        default: "index.html"

permissions:
  contents: read

concurrency:
  group: visual-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Bypass sheet auth only in CI copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gate = 'document.addEventListener("DOMContentLoaded", initLock);'
          bypass = 'document.addEventListener("DOMContentLoaded", ()=>{ try{ setMasterEditorOn(false); }catch(e){} hideLockScreen(); init(); });'

          patched = []
          for path in sorted(Path(".").glob("*_Scheda_Interattiva.html")):
              text = path.read_text(encoding="utf-8")
              if gate not in text:
                  continue
              path.write_text(text.replace(gate, bypass), encoding="utf-8")
              patched.append(path.name)

          if not patched:
              raise SystemExit("Nessuna scheda interattiva patchata: hook initLock non trovato")

          print("Auth bypass CI applicato a:")
          for name in patched:
              print(" -", name)
          PY

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/morgedal-http.log 2>&1 &
          echo $! > /tmp/morgedal-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/morgedal-http.log
          exit 1

      - name: Select pages
        id: pages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "${{ inputs.page }}" > /tmp/visual-pages.txt
          else
            git diff --name-only HEAD^ HEAD \
              | grep -E '(^index\.html$|_Scheda_Interattiva\.html$)' \
              | sort -u > /tmp/visual-pages.txt || true

            if [ ! -s /tmp/visual-pages.txt ]; then
              printf '%s\n' "index.html" "Ola_Scheda_Interattiva.html" > /tmp/visual-pages.txt
            fi
          fi

          echo "Pages selected:"
          cat /tmp/visual-pages.txt

      - name: Run Playwright visual check
        shell: bash
        run: |
          mapfile -t pages < /tmp/visual-pages.txt
          node .github/scripts/visual-check.mjs "${pages[@]}"

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morgedal-visual-report
          path: visual-report/
          if-no-files-found: warn
          retention-days: 14


  qa-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build deploy artifact with CI QA hash
        env:
          MORGEDAL_PICKER_API_KEY: ci-picker-placeholder
          MORGEDAL_AUTOMATION_TOKEN_HASH: 6f9c44f126b68de22ee672f201d8bb09f805e9d43e0d383174682d8f430c3f98
        run: python3 build_vercel.py

      - name: Verify QA access is build-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          dist = root / "dist"

          assert (dist / "index.html").exists(), "dist/index.html missing"
          assert (dist / "tinyfish-access.html").exists(), "tinyfish-access.html missing"
          assert "__MORGEDAL_TINYFISH_QA__" not in (root / "index.html").read_text(encoding="utf-8"), "QA hook leaked into source index"

          index = (dist / "index.html").read_text(encoding="utf-8")
          assert "__MORGEDAL_TINYFISH_QA__" in index, "QA flag missing in built index"
          assert "showHomeForAuthenticatedUser(GOOGLE_OWNER_EMAIL)" in index, "Home QA bypass missing"
          assert "if (window.__MORGEDAL_TINYFISH_QA__)" in index, "Card-navigation QA bypass missing"

          sheets = sorted(dist.glob("*_Scheda_Interattiva.html"))
          assert sheets, "No built interactive sheets found"
          for p in sheets:
              text = p.read_text(encoding="utf-8")
              assert "__MORGEDAL_TINYFISH_QA__" in text, f"QA flag missing in {p.name}"
              assert "markMasterUnlocked();" in text, f"Master QA bypass missing in {p.name}"

          admin = (dist / "admin.html").read_text(encoding="utf-8")
          assert "__MORGEDAL_TINYFISH_QA__" in admin, "Admin QA flag missing"
          assert 'sessionStorage.setItem(SESSION_KEY, "1")' in admin, "Admin QA unlock missing"

          entry = (dist / "tinyfish-access.html").read_text(encoding="utf-8")
          assert "6f9c44f126b68de22ee672f201d8bb09f805e9d43e0d383174682d8f430c3f98" in entry, "CI token-hash override not applied"
          assert "morgedal-tinyfish-qa-v1" in entry, "QA storage key missing"

          print(f"QA build smoke OK: {len(sheets)} schede verificate")
          PY
