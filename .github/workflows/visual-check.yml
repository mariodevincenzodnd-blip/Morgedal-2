name: Visual check Morgedal

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "*_Scheda_Interattiva.html"
      - ".github/scripts/visual-check.mjs"
      - ".github/workflows/visual-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "*_Scheda_Interattiva.html"
      - ".github/scripts/visual-check.mjs"
      - ".github/workflows/visual-check.yml"
  workflow_dispatch:
    inputs:
      page:
        description: "Pagina da controllare (es. Bull_Scheda_Interattiva.html)"
        required: false
        default: "index.html"

permissions:
  contents: read

concurrency:
  group: visual-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Bypass sheet auth only in CI copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gate = 'document.addEventListener("DOMContentLoaded", initLock);'
          bypass = 'document.addEventListener("DOMContentLoaded", ()=>{ try{ setMasterEditorOn(false); }catch(e){} hideLockScreen(); init(); });'

          patched = []
          for path in sorted(Path(".").glob("*_Scheda_Interattiva.html")):
              text = path.read_text(encoding="utf-8")
              if gate not in text:
                  continue
              path.write_text(text.replace(gate, bypass), encoding="utf-8")
              patched.append(path.name)

          if not patched:
              raise SystemExit("Nessuna scheda interattiva patchata: hook initLock non trovato")

          print("Auth bypass CI applicato a:")
          for name in patched:
              print(" -", name)
          PY

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/morgedal-http.log 2>&1 &
          echo $! > /tmp/morgedal-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/morgedal-http.log
          exit 1

      - name: Select pages
        id: pages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "${{ inputs.page }}" > /tmp/visual-pages.txt
          else
            printf '%s\n' "index.html" > /tmp/visual-pages.txt
            find . -maxdepth 1 -type f -name '*_Scheda_Interattiva.html' -printf '%f\n' | sort >> /tmp/visual-pages.txt
          fi

          echo "Pages selected:"
          cat /tmp/visual-pages.txt

      - name: Run Playwright visual check
        shell: bash
        run: |
          mapfile -t pages < /tmp/visual-pages.txt
          node .github/scripts/visual-check.mjs "${pages[@]}"

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morgedal-visual-report
          path: visual-report/
          if-no-files-found: warn
          retention-days: 14
